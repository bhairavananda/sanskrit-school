vara! tvāṃ vinā hṛdayaṃ śūnyam. kadā milāvaḥ?**\n\nAward 2 marks per bhāva: 1 for correct bhāva tone, 1 for grammatical correctness.\n\n## Section D\n**D1.** Sample:\n> adya aham devyāḥ mandiraṃ gacchāmi. dvāre sthitvā harṣeṇa pūrṇaḥ bhavāmi. garbhagṛhe devīṃ paśyāmi — aho! kīdṛśī śobhā! mama netrābhyāṃ ānandasya aśrūṇi patanti. kṛtajñaḥ asmi tava kṛpāyai he ambe!\n\n**D2.**\n> O Goddess! By your darśana my heart is full. Tears of joy fall from my eyes. Oh! What is your compassion like! I am wretched, but you are full of compassion. At your feet I offer everything of mine.\n\n---\n\n**Total: 60 marks**\n"}, "tabs": ["theory", "reference", "workbook-questions", "workbook-answers"]}, {"id": "12-stotra-i", "number": 12, "title": "Stotra I", "subtitle": "Accusative Constructions", "files": {"theory": "# Stage 12: Stotra I — Accusative Constructions (Namāmi Challenge)\n\n## Goal\nCompose original praise verses using accusative (dvitīyā) constructions — the most natural structure for devotional poetry. Write a 4-line original stotra.\n\n## The Namāmi Construction\n\nThe simplest stotra pattern uses **namāmi** + accusative:\n> namāmi śivam — I bow to Śiva\n\nThis extends naturally into poetry:\n> namāmi śivaṃ śāntam — I bow to peaceful Śiva\n> namāmi śivaṃ divyam — I bow to divine Śiva\n> namāmi śivaṃ nityam — I bow to eternal Śiva\n\n## Classical Models\n\n### From Śiva-pañcākṣara-stotra (Ādi Śaṅkara):\n> nāgendrahārāya trilōcanāya\n> bhasmāṅgarāgāya maheśvarāya\n> nityāya śuddhāya digambarāya\n> tasmai \"na\"-kārāya namaḥ śivāya\n\nNotice: each line is a stack of **dative** attributes, but the same principle works with accusative.\n\n### From Acyutāṣṭakam:\n> acyutam keśavaṃ rāma-nārāyaṇam\n> kṛṣṇa-dāmodaraṃ vāsudevaṃ harim\n> śrīdharaṃ mādhavaṃ gopikā-vallabham\n> jānakī-nāyakaṃ rāmacandram bhaje\n\nHere **bhaje** (I adore) takes a series of accusative names.\n\n## Building Blocks for Stotra\n\n### Accusative Forms of Common Deity Names\n| Nominative | Accusative | Use in stotra |\n|-----------|-----------|---------------|\n| śivaḥ | śivam | namāmi śivam |\n| viṣṇuḥ | viṣṇum | bhajāmi viṣṇum |\n| devī | devīm | namāmi devīm |\n| kṛṣṇaḥ | kṛṣṇam | smarāmi kṛṣṇam |\n| rāmaḥ | rāmam | bhajāmi rāmam |\n| gaṇeśaḥ | gaṇeśam | namāmi gaṇeśam |\n| haraḥ | haram | smarāmi haram |\n| harim | — | bhaje harim |\n\n### Stotra Verbs (1st person singular)\n| Verb | Meaning | Takes |\n|------|---------|-------|\n| namāmi | I bow to | accusative |\n| bhajāmi | I adore | accusative |\n| smarāmi | I remember | accusative |\n| prapadye | I take refuge in | accusative |\n| staumi | I praise | accusative |\n| vandāmi | I salute | accusative |\n| sevāmi | I serve | accusative |\n| dhyāyāmi | I meditate on | accusative |\n| gāyāmi | I sing (about) | accusative |\n| āśraye | I resort to | accusative |\n\n## The Namāmi Challenge: 4-Line Composition\n\n### Step 1: Choose your deity and verb\n> namāmi ___\n\n### Step 2: Stack accusative descriptions\nEach line = adjective(s) in accusative + deity name in accusative + verb\n\n### Template:\n```\n[adj-acc] [adj-acc] [deity-acc] [verb]\n[adj-acc] [adj-acc] [deity-acc] [verb]\n[adj-acc] [adj-acc] [deity-acc] [verb]\n[adj-acc] [adj-acc] [deity-acc] [verb]\n```\n\n### Example for Śiva:\n```\nśāntam divyam mahādevam namāmi\nnīlakaṇṭham trilocanam namāmi\ngaṅgādharam umāpatim namāmi\nkailāsavāsam jagadīśam namāmi\n```\n\n### Example for Devī:\n```\nsundarīm karuṇāmayīm namāmi devīm\njagadambām mahāmāyām namāmi devīm\ndurgām bhayahāriṇīm namāmi devīm\nśaktim parameśvarīm namāmi devīm\n```\n\n## Techniques for Richer Stotras\n\n### 1. Epithet Stacking\n> padmanābham, sureshvaram, vanamālinam, garuḍadhvajam — namāmi viṣṇum\n\n### 2. Relative Clause (yaḥ/yā/yat)\n> yaḥ śūlapāṇiḥ yaḥ nīlakaṇṭhaḥ\n> yaḥ gaṅgādharo yaḥ umāpatiḥ\n> tam śaṅkaram... namāmi\n\n### 3. Action Description\n> yo nṛtyati yaḥ hasati yaḥ dahati yaḥ sṛjati\n> taṃ naṭarājaṃ namāmi\n\n### 4. Refrain (dhruva-pada)\nUse the same verb at the end of every line as a refrain.\n\n## Milestone Check\nCan you compose an original 4-line stotra using the namāmi/bhajāmi pattern with correct accusative forms?\n", "reference": "# Stage 12: Stotra I — Reference Guide\n\n## Accusative Forms Quick Table\n\n### Masculine -a stems\n| Nom. | Acc. | Example |\n|------|------|---------|\n| śivaḥ | śivam | namāmi śivam |\n| hariḥ | harim | bhajāmi harim |\n| viṣṇuḥ | viṣṇum | smarāmi viṣṇum |\n\n### Feminine stems\n| Nom. | Acc. | Example |\n|------|------|---------|\n| devī | devīm | vandāmi devīm |\n| durgā | durgām | namāmi durgām |\n| sarasvatī | sarasvatīm | staumi sarasvatīm |\n\n### Adjectives in Accusative (agreeing with deity)\n| Adj (M nom) | M acc | F acc | Usage |\n|-------------|-------|-------|-------|\n| śāntaḥ | śāntam | śāntām | namāmi śāntam śivam |\n| divyaḥ | divyam | divyām | bhajāmi divyām devīm |\n| nityaḥ | nityam | nityām | smarāmi nityam harim |\n| sundaraḥ | sundaram | sundarīm | vandāmi sundarīm devīm |\n| karuṇāmayaḥ | karuṇāmayam | karuṇāmayīm | namāmi karuṇāmayīm ambām |\n| anantaḥ | anantam | anantām | dhyāyāmi anantam viṣṇum |\n\n## Stotra Verbs with Accusative\n\n| Verb | 1P Sg | Meaning |\n|------|-------|---------|\n| namāmi | bow | most common |\n| bhajāmi | adore | intimate |\n| smarāmi | remember | meditative |\n| vandāmi | salute | formal |\n| staumi | praise | elevated |\n| dhyāyāmi | meditate on | contemplative |\n| prapadye | take refuge in | surrender |\n| āśraye | resort to | surrender |\n| gāyāmi | sing of | joyful |\n| sevāmi | serve | humble |\n\n## Stotra Templates\n\n### Template 1: Simple Namāmi (4 lines)\n```\n[epithet-acc] [epithet-acc] namāmi\n[epithet-acc] [epithet-acc] namāmi\n[epithet-acc] [epithet-acc] namāmi\n[epithet-acc] [epithet-acc] namāmi\n```\n\n### Template 2: Bhaje + Epithets (verse)\n```\n[name-acc] [name-acc] [name-acc] [name-acc]\n[name-acc] [name-acc] [name-acc] [name-acc]\n[name-acc] [name-acc] [name-acc] [name-acc]\n[name-acc] [name-acc] [name-acc] bhaje\n```\n\n### Template 3: Yaḥ/Yā Relative (who... him/her I bow to)\n```\nyaḥ [description] yaḥ [description]\nyaḥ [description] yaḥ [description]\ntaṃ [deity-acc] [verb]\n```\n\n### Template 4: Alternating epithets + refrain\n```\n[line of description]\ntaṃ/tāṃ praṇamāmi (refrain)\n[line of description]\ntaṃ/tāṃ praṇamāmi (refrain)\n```\n\n## 50 Useful Accusative Epithets for Stotras\n\n### For Śiva (masculine acc.)\nśāntam, divyam, nityam, śuddham, mahādevam, trilocanam, nīlakaṇṭham, gaṅgādharam, umāpatim, naṭarājam, paśupatim, digambaram, candraśekharam, vṛṣabhadhvajam, pinākapāṇim, kailāsavāsam, bhavaharam, yogīśvaram, viśvanātham, dakṣiṇāmūrtim\n\n### For Devī (feminine acc.)\ndevīm, ambām, durgām, pārvatīm, gaurīm, lalitām, jagadambām, mahāmāyām, bhavānīm, caṇḍikām, mahālakṣmīm, sarasvatīm, annapūrṇām, śāradām, tripurasundarīm, kāmākṣīm, rājarājeśvarīm, bhairāvīm, tārām, bālām\n\n### For Viṣṇu/Kṛṣṇa (masculine acc.)\nviṣṇum, harim, nārāyaṇam, keśavam, mādhavam, govindam, kṛṣṇam, rāmam, vāsudevam, puruṣottamam, acyutam, anantam, padmanābham, śrīdharam, lakṣmīpatim, garuḍadhvajam, vanamālinam, murārim, cakrapāṇim, dāmodaram\n", "workbook-questions": "# Stage 12: Stotra I — Workbook (Questions)\n\n## Section A: Accusative Forms (10 marks)\n**A1.** Convert to accusative for use in \"namāmi ___\" (10 marks):\n1. śivaḥ →  2. devī →  3. viṣṇuḥ →  4. rāmaḥ →  5. durgā →\n6. śāntaḥ (adj, M) →  7. divyā (adj, F) →  8. nityaḥ (adj, M) →  9. sundarī (adj, F) →  10. anantaḥ (adj, M) →\n\n## Section B: Line Composition (20 marks)\n**B1.** Complete each stotra line with appropriate accusative epithets (10 marks):\n1. ___ ___ namāmi śivam (2 adjectives for Śiva)\n2. ___ ___ namāmi devīm (2 adjectives for Devī)\n3. ___ ___ bhajāmi kṛṣṇam (2 epithets for Kṛṣṇa)\n4. ___ ___ smarāmi rāmam (2 epithets for Rāma)\n5. ___ ___ vandāmi gaṇeśam (2 adjectives for Gaṇeśa)\n\n**B2.** Write 4 lines of a stotra using \"namāmi\" as refrain, dedicated to your iṣṭadevatā (10 marks):\n1. ___\n2. ___\n3. ___\n4. ___\n\n## Section C: Analysis (15 marks)\n**C1.** Identify all accusative words in this verse (5 marks):\n> acyutam keśavaṃ rāma-nārāyaṇam\n> kṛṣṇa-dāmodaraṃ vāsudevaṃ harim\n> śrīdharaṃ mādhavaṃ gopikā-vallabham\n> jānakī-nāyakaṃ rāmacandram bhaje\n\n**C2.** Rewrite this stotra changing the verb from namāmi to bhajāmi and the deity from Śiva to Devī (adjust all genders) (10 marks):\n> śāntam divyam mahādevam namāmi\n> nīlakaṇṭham trilocanam namāmi\n\nRewritten:\n1. ___\n2. ___\n\n## Section D: Original Composition (15 marks)\n**D1.** Compose a 4-line original stotra using the yaḥ/yā...tam/tām pattern (7 marks):\n\n**D2.** Compose a 4-line stotra using a different verb (bhajāmi, smarāmi, or dhyāyāmi) (8 marks):\n\n---\n\n**Total: 60 marks**\n", "workbook-answers": "# Stage 12: Stotra I — Workbook (Answers)\n\n## Section A\n1. **śivam** 2. **devīm** 3. **viṣṇum** 4. **rāmam** 5. **durgām**\n6. **śāntam** 7. **divyām** 8. **nityam** 9. **sundarīm** 10. **anantam**\n\n## Section B\n**B1.** Samples:\n1. **śāntam divyam** namāmi śivam\n2. **sundarīm karuṇāmayīm** namāmi devīm\n3. **govindam vanamālinam** bhajāmi kṛṣṇam\n4. **dhīram dhārmikam** smarāmi rāmam\n5. **mahāntam siddhidāyakam** vandāmi gaṇeśam\n\n**B2.** Sample for Śiva:\n1. śāntam divyam trilocanam namāmi\n2. nīlakaṇṭham umāpatim namāmi\n3. gaṅgādharam naṭarājam namāmi\n4. kailāsavāsam viśvanātham namāmi\n\n## Section C\n**C1.** Accusative words: **acyutam, keśavam, rāma-nārāyaṇam, kṛṣṇa-dāmodaram, vāsudevam, harim, śrīdharam, mādhavam, gopikā-vallabham, jānakī-nāyakam, rāmacandram** — all 11 words are accusative, governed by **bhaje**.\n\n**C2.** Gender-shifted rewrite:\n1. **śāntām divyām mahādevīm bhajāmi**\n2. **karuṇāmayīm trilocanām bhajāmi**\n\n(Note: trilocanā as F bahuvrīhi is valid. Alternatively use a different epithet: sundarīm jagadambām bhajāmi)\n\n## Section D\n**D1.** Sample yaḥ...tam stotra:\n> yā sṛṣṭiṃ karoti yā pālayati\n> yā saṃhāraṃ kurute jagataḥ\n> yā sarvaśaktiḥ yā karuṇāmayī\n> tāṃ jagadambāṃ praṇamāmi sadā\n\n**D2.** Sample with smarāmi:\n> gaṅgādharam umāsahitam smarāmi\n> naṭarājam nṛtyapadam smarāmi\n> yogīśvaram dhyānaratam smarāmi\n> sadāśivam bhaktavadam smarāmi\n\nAward: correct accusatives (3), valid epithets (2), coherent praise (2), correct verb usage (1).\n\n---\n\n**Total: 60 marks**\n"}, "tabs": ["theory", "reference", "workbook-questions", "workbook-answers"]}, {"id": "13-stotra-ii", "number": 13, "title": "Stotra II", "subtitle": "Varied Cases", "files": {"theory": "# Stage 13: Stotra II — Varied Cases (Vibhakti Stotram)\n\n## Goal\nCompose stotras using intentionally varied vibhaktis. Move beyond the accusative to express devotion through all cases — dative, instrumental, genitive, locative, ablative.\n\n## Case-Centered Stotra Patterns\n\n### Caturthī (Dative) — \"To/For X\"\nThe **namaḥ** construction:\n> śivāya namaḥ — salutation to Śiva\n> viṣṇave namaḥ — salutation to Viṣṇu\n> devyai namaḥ — salutation to the Goddess\n> guruve namaḥ — salutation to the Guru\n\nExtended: stack dative epithets before namaḥ:\n> nīlakaṇṭhāya trilocanāya bhasmāṅgarāgāya maheśvarāya namaḥ\n\n### Tṛtīyā (Instrumental) — \"By/Through X\"\n> śivena rakṣitaḥ — protected by Śiva\n> bhaktyā muktaḥ — freed through devotion\n> tava kṛpayā jīvāmi — I live by your grace\n\nStotra pattern: describe the deity's power through instrumental:\n> yasya kṛpayā jagatī jayati\n> yasya tejasā timiraṃ naśyati\n\n### Pañcamī (Ablative) — \"From X\"\n> śivāt jñānam — knowledge from Śiva\n> bhayāt trāhi — save from fear\n> pāpāt mocaya — free from sin\n> saṃsārāt uddhara — lift from saṃsāra\n\n### Ṣaṣṭhī (Genitive) — \"Of X\"\n> śivasya kṛpā — Śiva's grace\n> devyāḥ mahimā — the Goddess's glory\n> tava rūpaṃ divyam — your form is divine\n> yasya smaraṇāt pāpaṃ naśyati — by remembrance of whom sin is destroyed\n\n### Saptamī (Locative) — \"In/On X\"\n> śive bhaktiḥ — devotion in Śiva\n> tvayi viśvāsaḥ — trust in you\n> hṛdaye tvaṃ vasasi — you dwell in my heart\n> padme lakṣmīḥ — Lakṣmī on the lotus\n\n## The Vibhakti Stotram Game\n\nCompose a stotra where each line deliberately showcases a different case:\n\n### Example: One Deity, Seven Cases\n```\nśivaḥ jagataḥ pālakaḥ            (1st - Śiva is protector)\nśivaṃ smarāmi satatam             (2nd - I remember Śiva)\nśivena sarvam rakṣitam             (3rd - by Śiva all is protected)\nśivāya sarvasvaṃ dadāmi            (4th - to Śiva I give everything)\nśivāt jñānaṃ labhāmahe             (5th - from Śiva we gain knowledge)\nśivasya māhātmyaṃ ko vā vaktuṃ śaknoti  (6th - who can tell Śiva's greatness?)\nśive mama bhaktiḥ sadā bhavatu     (7th - may my devotion in Śiva always be)\n```\n\n## Advanced Technique: Case as Theological Statement\n\nEach case implies a different relationship with the divine:\n\n| Case | Theological Meaning | Example |\n|------|-------------------|---------|\n| 1st | The divine IS (identity) | śivaḥ sarvam — Śiva is everything |\n| 2nd | I seek the divine (object of desire) | śivam bhajāmi |\n| 3rd | I am sustained BY the divine | śivena jīvāmi |\n| 4th | I dedicate TO the divine | śivāya sarvaṃ samarpayāmi |\n| 5th | I come FROM the divine | śivāt aham āgataḥ |\n| 6th | I belong to the divine | śivasya dāsaḥ asmi |\n| 7th | I rest IN the divine | śive mama viśrāntiḥ |\n\n## Milestone Check\nCan you compose a stotra of at least 4 lines, each line built around a different vibhakti?\n", "reference": "# Stage 13: Stotra II — Reference Guide\n\n## Deity Forms in All Cases (Singular)\n\n### Śiva (M, -a stem)\n| Case | Form | Stotra Phrase |\n|------|------|--------------|\n| 1st | śivaḥ | śivaḥ rakṣatu |\n| 2nd | śivam | namāmi śivam |\n| 3rd | śivena | śivena rakṣitāḥ |\n| 4th | śivāya | śivāya namaḥ |\n| 5th | śivāt | śivāt jñānam |\n| 6th | śivasya | śivasya kṛpā |\n| 7th | śive | śive bhaktiḥ |\n| Voc | he śiva! | he śiva prasīda! |\n\n### Devī (F, -ī stem)\n| Case | Form | Stotra Phrase |\n|------|------|--------------|\n| 1st | devī | devī rakṣatu |\n| 2nd | devīm | namāmi devīm |\n| 3rd | devyā | devyā anugrahaḥ |\n| 4th | devyai | devyai namaḥ |\n| 5th | devyāḥ | devyāḥ kṛpā āgacchatu |\n| 6th | devyāḥ | devyāḥ mahimā |\n| 7th | devyām | devyām viśvāsaḥ |\n| Voc | he devi! | he devi pāhi! |\n\n### Viṣṇu (M, -u stem)\n| Case | Form | Stotra Phrase |\n|------|------|--------------|\n| 1st | viṣṇuḥ | viṣṇuḥ pātu |\n| 2nd | viṣṇum | bhajāmi viṣṇum |\n| 3rd | viṣṇunā | viṣṇunā rakṣitam |\n| 4th | viṣṇave | viṣṇave namaḥ |\n| 5th | viṣṇoḥ | viṣṇoḥ prasādaḥ |\n| 6th | viṣṇoḥ | viṣṇoḥ līlā |\n| 7th | viṣṇau | viṣṇau bhaktiḥ |\n\n## Case-Based Stotra Formulas\n\n### Dative Stack (X-āya namaḥ)\n```\n[epithet-dat] [epithet-dat] [epithet-dat]\n[deity-dat] namaḥ\n```\n\n### Instrumental Praise (X-ena / X-ayā)\n```\nyasya/yasyāḥ [instrument-3rd] [result]\ntasmai/tasyai namaḥ\n```\n\n### Genitive Glory (X-asya / X-āyāḥ)\n```\n[deity-gen] [quality] [adjective]\n[deity-gen] [quality] [adjective]\n```\n\n### Locative Devotion (X-e / X-āyām)\n```\n[deity-loc] [my state/devotion]\nsarvadā [verb]\n```\n\n## Useful Phrases by Case\n\n### With Dative (4th)\n| Phrase | Meaning |\n|--------|---------|\n| śivāya namaḥ | salutation to Śiva |\n| gurave namaḥ | salutation to the guru |\n| sarvadevebhyo namaḥ | salutation to all gods |\n| namaḥ śivāya | (same, reversed) |\n\n### With Instrumental (3rd)\n| Phrase | Meaning |\n|--------|---------|\n| tava kṛpayā | by your grace |\n| tava tejasā | by your radiance |\n| tava icchayā | by your will |\n| bhaktyā muktaḥ | freed through devotion |\n\n### With Ablative (5th)\n| Phrase | Meaning |\n|--------|---------|\n| bhayāt rakṣa | protect from fear |\n| pāpāt mocaya | free from sin |\n| saṃsārāt uddhara | lift from saṃsāra |\n| duḥkhāt trāhi | save from sorrow |\n\n### With Genitive (6th)\n| Phrase | Meaning |\n|--------|---------|\n| tava rūpam | your form |\n| tava māhātmyam | your greatness |\n| tava kṛpā | your grace |\n| tava nāma | your name |\n| yasya smaraṇāt | by remembering whom |\n\n### With Locative (7th)\n| Phrase | Meaning |\n|--------|---------|\n| tvayi bhaktiḥ | devotion in you |\n| tvayi viśvāsaḥ | trust in you |\n| hṛdaye vasasi | you dwell in the heart |\n| sarveṣu bhūteṣu | in all beings |\n", "workbook-questions": "# Stage 13: Stotra II — Workbook (Questions)\n\n## Section A: Case Forms (10 marks)\n**A1.** Give the dative (4th) form and use in \"X namaḥ\" (5 marks):\n1. śiva →  2. devī →  3. viṣṇu →  4. gaṇeśa →  5. guru →\n\n**A2.** Give the genitive (6th) and use in \"X kṛpā\" (5 marks):\n1. śiva →  2. devī →  3. rāma →  4. guru →  5. bhagavān →\n\n## Section B: Case-Specific Composition (20 marks)\n**B1.** Write a 2-line stotra using only dative constructions (namaḥ pattern) (5 marks):\n**B2.** Write a 2-line stotra using instrumental (by whose grace/power...) (5 marks):\n**B3.** Write a 2-line stotra using ablative (save from X, free from Y) (5 marks):\n**B4.** Write a 2-line stotra using locative (devotion in X, trust in Y) (5 marks):\n\n## Section C: Vibhakti Stotram (20 marks)\n**C1.** Compose a 7-line stotra for your iṣṭadevatā — each line must feature a different vibhakti (1st through 7th). Label each line with the case used (14 marks):\n**C2.** Explain the theological significance of each case you used (6 marks):\n\n## Section D: Analysis (10 marks)\n**D1.** Identify the vibhakti and its role in each line (10 marks):\n1. nīlakaṇṭhāya namaḥ\n2. devyā anugraheṇa jīvāmi\n3. pāpāt trāhi māṃ prabho\n4. śivasya rūpaṃ divyam\n5. hṛdaye tvaṃ sadā vasasi\n\n---\n\n**Total: 60 marks**\n", "workbook-answers": "# Stage 13: Stotra II — Workbook (Answers)\n\n## Section A\n**A1.**\n1. **śivāya** namaḥ  2. **devyai** namaḥ  3. **viṣṇave** namaḥ  4. **gaṇeśāya** namaḥ  5. **gurave** namaḥ\n\n**A2.**\n1. **śivasya** kṛpā  2. **devyāḥ** kṛpā  3. **rāmasya** kṛpā  4. **guroḥ** kṛpā  5. **bhagavataḥ** kṛpā\n\n## Section B\n**B1.** Sample: nīlakaṇṭhāya trilocanāya namaḥ / gaṅgādharāya umāpataye namaḥ\n**B2.** Sample: yasya kṛpayā jagat jīvati / yasya tejasā timiraṃ naśyati\n**B3.** Sample: he devi! pāpāt mocaya mām / saṃsārāt uddhara mām prabho!\n**B4.** Sample: śive mama bhaktiḥ sadā bhavatu / tvayi mama viśvāso dṛḍhaḥ\n\n## Section C\n**C1.** Sample for Devī:\n1. (1st) devī mama māta, sarvasya rakṣikā\n2. (2nd) devīm smarāmi satatam hṛdaye\n3. (3rd) devyā kṛpayā mama jīvanaṃ dhanyam\n4. (4th) devyai mama sarvasvaṃ samarpayāmi\n5. (5th) devyāḥ caraṇāt amṛtaṃ patati\n6. (6th) devyāḥ mahimā vāṇyā na varṇanīyā\n7. (7th) devyām mama hṛdayaṃ sthiram tiṣṭhatu\n\n**C2.** Theological significance:\n- 1st: She IS the protector (identity/ontology)\n- 2nd: She is what I seek (object of devotion)\n- 3rd: I live BY her grace (sustaining power)\n- 4th: I dedicate TO her (offering/service)\n- 5th: From her comes nectar (source of grace)\n- 6th: Her glory is beyond words (transcendence)\n- 7th: My heart rests IN her (immanence/dwelling)\n\n## Section D\n1. nīlakaṇṭhāya namaḥ → **caturthī** (dative) — salutation TO the blue-throated one\n2. devyā anugraheṇa jīvāmi → **tṛtīyā** (instrumental) — I live BY the goddess's grace\n3. pāpāt trāhi mām → **pañcamī** (ablative) — save me FROM sin\n4. śivasya rūpaṃ divyam → **ṣaṣṭhī** (genitive) — Śiva's form is divine (OF Śiva)\n5. hṛdaye tvaṃ sadā vasasi → **saptamī** (locative) — you always dwell IN the heart\n\n---\n\n**Total: 60 marks**\n"}, "tabs": ["theory", "reference", "workbook-questions", "workbook-answers"]}, {"id": "14-prarthana", "number": 14, "title": "Prarthana", "subtitle": "Requests & Imperatives", "files": {"theory": "# Stage 14: Prārthanā — Requests and Imperatives\n\n## Goal\nCompose original prayers with imperatives, optatives, and benedictions. Master the grammar of asking gracefully — from urgent plea to gentle request.\n\n## Degrees of Request\n\n### 1. Direct Imperative (Loṭ) — Command/Urgent Plea\n> pāhi mām! — save me!\n> rakṣa mām! — protect me!\n> dehi me jñānam! — give me knowledge!\n\n### 2. Optative (Liṅ / Āśīrliṅ) — Wish/Gentle Request\n> bhūyāt — may it be\n> syāt — may there be\n> pātu — may [he/she] protect\n> jayatu — may [he/she] be victorious\n\n### 3. Potential (Vidhi-liṅ) — Should/Ought\n> kuryāt — one should do\n> bhajet — one should worship\n> paṭhet — one should recite\n\n### 4. First Person Optative — \"Let me...\"\n> bhavāni — let me be\n> karāṇi — let me do\n> seveyam — let me serve\n\n## Core Imperative Vocabulary (Expanded)\n\n| Root | 2P Sg (to deity) | 3P Sg (benediction) | Meaning |\n|------|-----------------|---------------------|---------|\n| pā | pāhi | pātu | protect |\n| rakṣ | rakṣa | rakṣatu | guard |\n| trā | trāhi | trātu | rescue |\n| dā | dehi | dadātu | give |\n| kṛ | kuru | karotu | do/make |\n| nī | naya | nayatu | lead |\n| darśay | darśaya | darśayatu | show |\n| kṣam | kṣamasva | kṣamatu | forgive |\n| pra-sad | prasīda | prasīdatu | be gracious |\n| śru | śṛṇu | śṛṇotu | hear |\n| bhū | bhava | bhavatu | be/become |\n| gam | gaccha | gacchatu | go |\n| ā-gam | āgaccha | āgacchatu | come |\n| dṛś (caus.) | darśaya | darśayatu | show |\n| muc | muñca | muñcatu | release |\n| ji | jaya | jayatu | conquer/be victorious |\n\n## Prayer Structures\n\n### Structure 1: Vocative + Imperative + Object\n> he devi! dehi me bhaktim\n> O Goddess, give me devotion\n\n### Structure 2: Vocative + Description + Imperative\n> he karuṇāsindho! mama duḥkhaṃ nāśaya\n> O ocean of compassion, destroy my suffering\n\n### Structure 3: Purpose Clause (yathā... tathā kuru)\n> yathā tvāṃ na vismarāmi tathā kuru\n> Make it so that I never forget you\n\n### Structure 4: Conditional Request (yadi... tadā)\n> yadi me doṣāḥ santi tadā kṣamasva\n> If I have faults, then forgive\n\n### Structure 5: Benedictive Chain\n> śivaḥ rakṣatu, devī pālayatu, guruḥ bodhayatu\n> May Śiva protect, may Devī preserve, may Guru enlighten\n\n## Complete Sample Prayer\n\n```\nhe jagadīśvara! he karuṇāsāgara!\nśṛṇu mama prārthanām!\n\nmama pāpaṃ kṣamasva,\nmama duḥkhaṃ nāśaya,\nmama ajñānaṃ dūrīkuru.\n\ndehi me jñānam,\ndehi me bhaktim,\ndehi me śāntim.\n\ntava pādayoḥ mama manaḥ sthāpaya.\ntava nāmni mama jihvāṃ niyojaya.\ntava rūpe mama cakṣuḥ sthirīkuru.\n\nsarvadā tvayi mama cittam bhavatu.\ntvām eva śaraṇaṃ prapadye.\n```\n\n## What to Ask For — Devotional Request Vocabulary\n\n| Sanskrit | Meaning |\n|----------|---------|\n| jñānam | knowledge |\n| bhaktim | devotion |\n| śāntim | peace |\n| muktim | liberation |\n| ārogyam | health |\n| āyuḥ | long life |\n| balam | strength |\n| dhairyam | courage |\n| kṣamām | patience |\n| vairāgyam | dispassion |\n| vivekam | discrimination |\n| sadbuddim | good understanding |\n\n## What to Ask Protection From\n\n| Sanskrit | Meaning |\n|----------|---------|\n| pāpāt | from sin |\n| bhayāt | from fear |\n| rogāt | from disease |\n| duḥkhāt | from sorrow |\n| saṃsārāt | from worldly cycle |\n| ajñānāt | from ignorance |\n| mohat | from delusion |\n| lobhāt | from greed |\n| krodhāt | from anger |\n| mṛtyoḥ | from death |\n\n## Milestone Check\nCan you compose an original 8-line Sanskrit prayer with vocatives, imperatives, and specific requests?\n", "reference": "# Stage 14: Prārthanā — Reference Guide\n\n## Imperative Forms Table\n\n### 2nd Person (Requesting the deity)\n| Root | Parasmai. | Ātmane. | Meaning |\n|------|----------|---------|---------|\n| pā | pāhi | — | protect |\n| rakṣ | rakṣa | — | guard |\n| trā | trāhi | — | rescue |\n| dā | dehi | — | give |\n| kṛ | kuru | kuruṣva | do |\n| nī | naya | — | lead |\n| gam | gaccha | — | go |\n| śru | śṛṇu | — | hear |\n| pra-sad | prasīda | — | be gracious |\n| kṣam | — | kṣamasva | forgive |\n| bhū | bhava | — | be |\n| darśay | darśaya | — | show |\n| muc | muñca | — | release |\n\n### 3rd Person (Benedictions — \"may X...\")\n| Root | Form | Meaning |\n|------|------|---------|\n| pā | pātu | may [he] protect |\n| rakṣ | rakṣatu | may [he] guard |\n| bhū | bhavatu | may it be |\n| ji | jayatu | may [he] conquer |\n| nī | nayatu | may [he] lead |\n| kṛ | karotu | may [he] do |\n| dā | dadātu | may [he] give |\n\n### 1st Person (Self-resolution — \"let me...\")\n| Root | Form | Meaning |\n|------|------|---------|\n| bhū | bhavāni | let me be |\n| kṛ | karāṇi | let me do |\n| nam | namāni | let me bow |\n| sev | seveyam | let me serve |\n\n## Prayer Template Library\n\n### Simple Plea\n```\nhe [deity-voc]!\n[imperative] mām!\n```\n\n### Extended Prayer\n```\nhe [deity-voc]! he [epithet-voc]!\nśṛṇu mama prārthanām.\n[request 1 — dehi/kuru + object]\n[request 2 — rakṣa/pāhi + mām + ablative]\n[request 3 — naya/darśaya]\ntava śaraṇam prapadye.\n```\n\n### Benedictive Chain\n```\n[deity] pātu [body part / quality]\n[deity] rakṣatu [situation]\n[deity] [benediction]\nsarve bhavantu sukhinaḥ.\n```\n\n## Request Objects (Accusative)\n\n| Request | Sanskrit |\n|---------|----------|\n| Give me knowledge | dehi me jñānam |\n| Give me devotion | dehi me bhaktim |\n| Give me peace | dehi me śāntim |\n| Give me strength | dehi me balam |\n| Give me courage | dehi me dhairyam |\n| Give me wisdom | dehi me prajñām |\n| Give me liberation | dehi me muktim |\n\n## Protection Requests (Ablative + Imperative)\n\n| Request | Sanskrit |\n|---------|----------|\n| Protect from fear | bhayāt rakṣa / bhayāt trāhi |\n| Free from sin | pāpāt mocaya |\n| Save from death | mṛtyoḥ trāhi |\n| Lift from saṃsāra | saṃsārāt uddhara |\n| Remove ignorance | ajñānaṃ nāśaya |\n| Destroy sorrow | duḥkhaṃ nāśaya |\n\n## Famous Prayer Phrases\n\n| Sanskrit | Source | Meaning |\n|----------|-------|---------|\n| asato mā sadgamaya | Bṛhadāraṇyaka | lead me from untruth to truth |\n| tamaso mā jyotirgamaya | Bṛhadāraṇyaka | lead me from darkness to light |\n| mṛtyor mā amṛtam gamaya | Bṛhadāraṇyaka | lead me from death to immortality |\n| sarve bhavantu sukhinaḥ | traditional | may all be happy |\n| sarve santu nirāmayāḥ | traditional | may all be free from illness |\n| oṃ śāntiḥ śāntiḥ śāntiḥ | Upaniṣads | om peace peace peace |\n| lokāḥ samastāḥ sukhino bhavantu | traditional | may all worlds be happy |\n", "workbook-questions": "# Stage 14: Prārthanā — Workbook (Questions)\n\n## Section A: Imperative Forms (10 marks)\n**A1.** Give the 2P sg imperative (5 marks): 1. pā →  2. dā →  3. kṛ →  4. kṣam →  5. śru →\n**A2.** Give the 3P sg benedictive (5 marks): 1. pā →  2. bhū →  3. ji →  4. rakṣ →  5. kṛ →\n\n## Section B: Prayer Lines (15 marks)\n**B1.** Complete these prayers (5 marks):\n1. he devi! ___ me bhaktim (give)\n2. he śiva! mama pāpam ___ (forgive)\n3. he prabho! bhayāt ___ mām (save)\n4. he guru! mām ___ (lead — nī)\n5. he bhagavan! ___ mama prārthanām (hear)\n\n**B2.** Write 5 prayer lines requesting specific things using \"dehi me ___\" (5 marks):\n**B3.** Write 5 prayer lines requesting protection using \"___āt rakṣa/trāhi mām\" (5 marks):\n\n## Section C: Full Prayer Composition (25 marks)\n**C1.** Compose an 8-line original prayer to your iṣṭadevatā (15 marks). Include: vocative, at least 3 different imperatives, a request for something positive, a request for protection from something negative, and a line of surrender.\n\n**C2.** Write a benedictive prayer (5 lines) — each line should use the 3P imperative (\"may X protect/bless/conquer...\") (10 marks):\n\n## Section D: Translation (10 marks)\n**D1.** Translate into English (5 marks):\n1. asato mā sadgamaya\n2. he devi! mama duḥkhaṃ nāśaya\n3. sarve bhavantu sukhinaḥ\n4. tava kṛpayā sarvam śubham bhavatu\n5. he jagadīśvara! dehi me vivekam\n\n**D2.** Translate into Sanskrit (5 marks):\n1. O Śiva, protect me always\n2. May the Goddess be victorious\n3. Give me peace, give me knowledge\n4. Save me from ignorance\n5. May all beings be happy\n\n---\n\n**Total: 60 marks**\n", "workbook-answers": "# Stage 14: Prārthanā — Workbook (Answers)\n\n## Section A\n**A1.** 1. **pāhi** 2. **dehi** 3. **kuru** 4. **kṣamasva** 5. **śṛṇu**\n**A2.** 1. **pātu** 2. **bhavatu** 3. **jayatu** 4. **rakṣatu** 5. **karotu**\n\n## Section B\n**B1.** 1. **dehi** 2. **kṣamasva** 3. **trāhi** (or pāhi) 4. **naya** 5. **śṛṇu**\n\n**B2.** Sample: dehi me jñānam / dehi me bhaktim / dehi me śāntim / dehi me balam / dehi me muktim\n\n**B3.** Sample: bhayāt trāhi mām / pāpāt rakṣa mām / duḥkhāt trāhi mām / ajñānāt rakṣa mām / saṃsārāt uddhara mām\n\n## Section C\n**C1.** Sample prayer to Devī:\n> he devi! he jagadambe!\n> śṛṇu mama prārthanām.\n> mama pāpaṃ kṣamasva.\n> mama ajñānaṃ nāśaya.\n> dehi me jñānam, dehi me bhaktim.\n> bhayāt trāhi mām, duḥkhāt rakṣa mām.\n> tava pādayoḥ mama manaḥ sthāpaya.\n> tvām eva śaraṇaṃ prapadye.\n\n**C2.** Sample:\n> śivaḥ pātu mama śiraḥ / devī rakṣatu mama hṛdayam\n> gaṇeśaḥ nayatu mama mārgam / sarasvatī bodhayatu mama buddhim\n> sarve devāḥ mama jīvanaṃ maṅgalaṃ kurvantu\n\n## Section D\n**D1.**\n1. Lead me from untruth to truth\n2. O Goddess, destroy my sorrow\n3. May all be happy\n4. By your grace, may all be auspicious\n5. O Lord of the world, give me discrimination\n\n**D2.**\n1. **he śiva! sadā mām pāhi** (or rakṣa mām sadā)\n2. **devī jayatu**\n3. **dehi me śāntim, dehi me jñānam**\n4. **ajñānāt trāhi mām** (or ajñānāt rakṣa mām)\n5. **sarve prāṇinaḥ sukhinaḥ bhavantu** (or sarve bhūtāḥ sukhinaḥ bhavantu)\n\n---\n\n**Total: 60 marks**\n"}, "tabs": ["theory", "reference", "workbook-questions", "workbook-answers"]}, {"id": "15-katha", "number": 15, "title": "Katha", "subtitle": "Narration", "files": {"theory": "# Stage 15: Kathā — Narration\n\n## Goal\nNarrate a deity's story (līlā) in Sanskrit for 2-3 minutes. Master past tense, sequence markers, and narrative structure.\n\n## Past Tense (Laṅ-lakāra)\n\n| Person | Singular | Plural |\n|--------|----------|--------|\n| 3rd | a-√-t (agacchat) | a-√-an (agacchan) |\n| 2nd | a-√-ḥ (agacchaḥ) | a-√-ta (agacchata) |\n| 1st | a-√-am (agaccham) | a-√-āma (agacchāma) |\n\n### Common Past Tenses\n| Present | Past (3sg) | Meaning |\n|---------|-----------|---------|\n| asti | āsīt | was |\n| bhavati | abhavat | became |\n| gacchati | agacchat | went |\n| karoti | akarot | did |\n| vadati | avadat | said |\n| paśyati | apaśyat | saw |\n| dadāti | adadāt | gave |\n| śṛṇoti | aśṛṇot | heard |\n| jānāti | ajānāt | knew |\n| jayati | ajayat | conquered |\n| harati | aharat | took |\n| patati | apatat | fell |\n| tiṣṭhati | atiṣṭhat | stood |\n| namati | anamat | bowed |\n\n## Narrative Connectors\n\n| Sanskrit | Meaning |\n|----------|---------|\n| purā / purākāle | long ago |\n| ekadā | once upon a time |\n| tadā | then |\n| tataḥ | then, after that |\n| anantaram | afterwards |\n| tadanantaram | after that |\n| atha | now, then |\n| evaṃ | thus |\n| iti | (end quote) |\n| saḥ / sā | he / she |\n| tena | by him / therefore |\n| tasmāt | from that / therefore |\n| yadā... tadā | when... then |\n| yāvat... tāvat | while... meanwhile |\n\n## Kathā Structure\n\n### Opening\n> purā kāle eka-smin vane mahān ṛṣiḥ āsīt.\n> (Long ago, in a certain forest, there was a great sage.)\n\n### Development\n> ekadā saḥ dhyānaṃ kurvan āsīt. tadā ekaḥ rākṣasaḥ āgacchat.\n> (Once he was meditating. Then a demon came.)\n\n### Crisis\n> rākṣasaḥ ṛṣiṃ hantuṃ aicchat. ṛṣiḥ bhayam anubhavat.\n> (The demon wanted to kill the sage. The sage felt fear.)\n\n### Resolution\n> tadā devī prādurabhat. sā rākṣasaṃ nāśayat.\n> (Then the Goddess appeared. She destroyed the demon.)\n\n### Closing\n> ṛṣiḥ devīm praṇamat. \"he devi! dhanyaḥ asmi\" iti avadat.\n> (The sage bowed to the Goddess. \"O Goddess, I am blessed,\" he said.)\n\n## Sample Kathā: Gaṅgāvataraṇa (Descent of Gaṅgā)\n\n> purā bhagīrathaḥ nāma rājā āsīt. tasya pūrvajāḥ sagarasya putrāḥ kapila-muneḥ śāpena bhasma-sāt abhavan. teṣāṃ uddhārārtham gaṅgā pṛthivīm ānayanīyā āsīt.\n>\n> bhagīrathaḥ tapasyāṃ akarot. brahma tuṣṭaḥ abhavat. \"gaṅgā avadiṣyati\" iti avadat. kintu gaṅgāyāḥ vegaḥ pṛthivīṃ nāśayet.\n>\n> tataḥ bhagīrathaḥ śivasya ārādhanāṃ akarot. śivaḥ prasannaḥ abhavat. gaṅgāṃ jaṭāsu dhārayat. tataḥ śanaiḥ śanaiḥ gaṅgā pṛthivīm avātarat.\n>\n> evaṃ śivasya kṛpayā gaṅgā loke āgacchat. ataḥ śivaḥ gaṅgādharaḥ iti ucyate.\n\n## Direct Speech in Narration\n\nUse **iti** to close quoted speech:\n> \"he devi! rakṣa mām!\" iti ṛṣiḥ prārthayat.\n> (The sage prayed, \"O Goddess, protect me!\")\n\n> \"mā bhaiṣīḥ\" iti devī avadat.\n> (\"Don't fear,\" said the Goddess.)\n\n## Milestone Check\nCan you narrate a complete deity story (Gaṅgāvataraṇa, Samudra-manthana, or any līlā) in Sanskrit for 2-3 minutes?\n", "reference": "# Stage 15: Kathā — Reference Guide\n\n## Past Tense (Laṅ) — 30 Essential Verbs\n\n| Present | Past 3sg | Past 3pl | Meaning |\n|---------|---------|---------|---------|\n| asti | āsīt | āsan | was/were |\n| bhavati | abhavat | abhavan | became |\n| gacchati | agacchat | agacchan | went |\n| āgacchati | āgacchat | āgacchan | came |\n| karoti | akarot | akurvan | did |\n| vadati | avadat | avadan | said |\n| paśyati | apaśyat | apaśyan | saw |\n| śṛṇoti | aśṛṇot | aśṛṇvan | heard |\n| dadāti | adadāt | adaduḥ | gave |\n| jānāti | ajānāt | ajānan | knew |\n| jayati | ajayat | ajayan | conquered |\n| harati | aharat | aharan | took |\n| tiṣṭhati | atiṣṭhat | atiṣṭhan | stood |\n| namati | anamat | anaman | bowed |\n| tyajati | atyajat | atyajan | abandoned |\n| patati | apatat | apatan | fell |\n| manyate | amanyata | amanyanta | thought |\n| icchati | aicchat | aicchan | wanted |\n| nayati | anayat | anayan | led |\n| pibati | apibat | apiban | drank |\n| rakṣati | arakṣat | arakṣan | protected |\n| pūjayati | apūjayat | apūjayan | worshipped |\n| kathayati | akathayat | akathayan | told |\n| prārthayati | aprārthayat | — | prayed |\n| hasati | ahasat | ahasan | laughed |\n| rudati | arudat | arudan | cried |\n| smarati | asmarat | asmaran | remembered |\n| nṛtyati | anṛtyat | anṛtyan | danced |\n| gāyati | agāyat | agāyan | sang |\n| likhati | alikhat | alikhan | wrote |\n\n## Narrative Structure Template\n\n```\n1. SETTING:    purā [kāle/deśe] [character] āsīt.\n2. CHARACTER:  saḥ/sā [description] āsīt.\n3. EVENT:      ekadā [event] abhavat.\n4. ACTION:     saḥ/sā [action-past].\n5. CRISIS:     kintu/tadā [problem] abhavat.\n6. RESPONSE:   tataḥ [character] [response-past].\n7. CLIMAX:     tadā [deity] [intervention-past].\n8. RESOLUTION: evaṃ [result] abhavat.\n9. MORAL:      ataḥ/tasmāt [lesson].\n```\n\n## Narrative Connectors (Sequence)\n\n| Connector | Position | Meaning |\n|-----------|----------|---------|\n| purā | opening | long ago |\n| ekadā | opening | once |\n| ekasmin dine | opening | one day |\n| tadā | mid | then |\n| tataḥ | mid | after that |\n| anantaram | mid | afterwards |\n| atha | mid | now, then |\n| kintu | mid | but |\n| tathāpi | mid | even so |\n| evaṃ | closing | thus |\n| ataḥ | closing | therefore |\n| iti | closing | thus (end) |\n\n## Direct Speech Pattern\n```\n\"[speech]\" iti [speaker] avadat/prārthayat/cintayat\n```\n\n## Story Starters\n- purā kailāsa-parvate śivaḥ pārvatyā saha āsīt...\n- ekadā vṛndāvane kṛṣṇaḥ gopībhiḥ saha krīḍat...\n- purākāle ayodhyāyāṃ rāmaḥ nāma rājakumāraḥ āsīt...\n- devāsura-saṃgrāme devāḥ parābhūtāḥ abhavan...\n", "workbook-questions": "# Stage 15: Kathā — Workbook (Questions)\n\n## Section A: Past Tense (10 marks)\n**A1.** Convert to past tense (laṅ) 3rd sg (5 marks):\n1. gacchati →  2. karoti →  3. vadati →  4. bhavati →  5. paśyati →\n\n**A2.** Convert to past tense 3rd sg (5 marks):\n1. dadāti →  2. jayati →  3. namati →  4. asti →  5. icchati →\n\n## Section B: Narrative Sentences (15 marks)\n**B1.** Translate into Sanskrit past tense (5 marks):\n1. The sage lived in the forest.\n2. The demon came.\n3. The goddess appeared.\n4. The king prayed.\n5. Śiva was pleased.\n\n**B2.** Put these sentences in logical order and add connectors (5 marks):\n- devī rākṣasaṃ nāśayat\n- ṛṣiḥ vane dhyānaṃ akarot\n- rākṣasaḥ āgacchat\n- ṛṣiḥ devīm prārthayat\n- devī prādurabhat\n\n**B3.** Add direct speech using iti (5 marks):\n1. The sage said, \"O Goddess, save me!\" → ___\n2. The deity said, \"Do not fear.\" → ___\n\n## Section C: Story Composition (25 marks)\n**C1.** Narrate the story of Gaṅgā's descent in 10 Sanskrit sentences (15 marks):\n**C2.** Narrate any deity līlā of your choice in at least 8 sentences (10 marks):\n\n## Section D: Comprehension (10 marks)\nTranslate this passage into English:\n> purā laṅkāyāṃ rāvaṇaḥ nāma rākṣasarājaḥ āsīt. saḥ atīva balavān āsīt. ekadā saḥ sītāṃ hṛtvā laṅkāṃ anayat. rāmaḥ atīva duḥkhitaḥ abhavat. tataḥ rāmaḥ hanumantam preṣayat. hanumān samudraṃ laṅghayat. saḥ sītāṃ apaśyat. \"mā śocaya, rāmaḥ āgamiṣyati\" iti avadat. tataḥ rāmaḥ vānara-sainya-sahitaḥ laṅkām agacchat. mahān yudhaṃ abhavat. rāmaḥ rāvaṇaṃ ajayat. sītā muktā abhavat.\n\n---\n\n**Total: 60 marks**\n", "workbook-answers": "# Stage 15: Kathā — Workbook (Answers)\n\n## Section A\n**A1.** 1. **agacchat** 2. **akarot** 3. **avadat** 4. **abhavat** 5. **apaśyat**\n**A2.** 1. **adadāt** 2. **ajayat** 3. **anamat** 4. **āsīt** 5. **aicchat**\n\n## Section B\n**B1.**\n1. **ṛṣiḥ vane avasīt** (or vane āsīt)\n2. **rākṣasaḥ āgacchat**\n3. **devī prādurabhat** (or āvirbabhūva)\n4. **rājā prārthayat**\n5. **śivaḥ prasannaḥ abhavat** (or tuṣṭaḥ abhavat)\n\n**B2.** Correct order with connectors:\n> **purā** ṛṣiḥ vane dhyānaṃ akarot. **tadā** rākṣasaḥ āgacchat. **tataḥ** ṛṣiḥ devīm prārthayat. **tadā** devī prādurabhat. **sā** devī rākṣasaṃ nāśayat.\n\n**B3.**\n1. **\"he devi! pāhi mām!\" iti ṛṣiḥ avadat**\n2. **\"mā bhaiṣīḥ\" iti devatā avadat**\n\n## Section C\n**C1.** Sample:\n> purā sagarasya putrāḥ kapila-muneḥ śāpena bhasmasāt abhavan. bhagīrathaḥ nāma rājā teṣām uddhārārtham gaṅgām pṛthivīm ānetum aicchat. saḥ brahmaṇaḥ ārādhanāṃ akarot. brahma tuṣṭaḥ abhavat. \"gaṅgā avatarati\" iti brahma avadat. kintu gaṅgāyāḥ vegaḥ pṛthivīṃ nāśayet. tataḥ bhagīrathaḥ śivaṃ prārthayat. śivaḥ prasannaḥ abhavat. saḥ gaṅgāṃ jaṭāsu dhārayat. evaṃ gaṅgā śanaiḥ pṛthivīm avātarat. ataḥ śivaḥ gaṅgādharaḥ iti ucyate.\n\n**C2.** Accept any coherent 8+ sentence narration of a deity story in grammatically reasonable Sanskrit.\n\n## Section D\n> Long ago in Laṅkā there was a demon-king named Rāvaṇa. He was very powerful. Once he abducted Sītā and took her to Laṅkā. Rāma became very sorrowful. Then Rāma sent Hanumān. Hanumān leaped across the ocean. He saw Sītā. \"Do not grieve, Rāma will come,\" he said. Then Rāma went to Laṅkā with the monkey army. A great battle took place. Rāma conquered Rāvaṇa. Sītā was freed.\n\n---\n\n**Total: 60 marks**\n"}, "tabs": ["theory", "reference", "workbook-questions", "workbook-answers"]}, {"id": "16-chandas-i", "number": 16, "title": "Chandas I", "subtitle": "Syllables", "files": {"theory": "# Stage 16: Chandas I — Syllables\n\n## Goal\nUnderstand the syllable system (akṣara, laghu/guru) that underlies all Sanskrit meter. Learn to hear and mark 8-syllable units.\n\n## Laghu and Guru\n\nEvery Sanskrit syllable is either **laghu** (light, ∪) or **guru** (heavy, –):\n\n**Laghu (∪):** a short vowel (a, i, u, ṛ) NOT followed by a conjunct consonant or visarga/anusvāra\n**Guru (–):** a long vowel (ā, ī, ū, e, ai, o, au) OR a short vowel followed by conjunct consonant, anusvāra (ṃ), or visarga (ḥ)\n\n### Rules\n1. Long vowel → always guru: **nā** (–), **de** (–), **vai** (–)\n2. Short vowel + single consonant + vowel → laghu: **na-ma** (∪ ∪)\n3. Short vowel + conjunct → guru: **bha-ktyā** (–, because k+t follows)\n4. Short vowel + anusvāra → guru: **saṃ** (–)\n5. Short vowel + visarga → guru: **śi-vaḥ** (last syllable –)\n6. Last syllable of a pāda is counted as guru by convention\n\n### Examples\n| Word | Syllables | Pattern |\n|------|-----------|---------|\n| namāmi | na-mā-mi | ∪ – ∪ |\n| śivāya | śi-vā-ya | ∪ – ∪ |\n| bhagavān | bha-ga-vān | ∪ ∪ – |\n| triśūlam | tri-śū-lam | ∪ – – |\n| namaḥ | na-maḥ | ∪ – |\n| padmam | pad-mam | – – |\n\n## Gaṇas (Metrical Feet)\n\nGroups of 3 syllables have names:\n\n| Gaṇa | Pattern | Memory | Example |\n|------|---------|--------|---------|\n| ya | ∪ – – | yamātā | yamātā |\n| ma | – – – | mātārā | mātārā |\n| ta | – – ∪ | tārāja | tārāja |\n| ra | – ∪ – | rājabhā | rājabhā |\n| ja | ∪ – ∪ | jabhalā | jabhalā |\n| bha | – ∪ ∪ | bhānasa | bhānasa |\n| na | ∪ ∪ ∪ | nasala | nasala |\n| sa | ∪ ∪ – | salāgā | salāgā |\n\n**Memory trick:** Take the phrase **ya-mā-tā-rā-ja-bhā-na-sa-la-gā-m**. Each gaṇa's pattern is read from its starting letter through the next two syllables.\n\n## Counting Syllables (Akṣara-gaṇanā)\n\n### Exercise: Mark the pattern of this pāda:\n> śā-nta-kā-ra-ṃ bhu-ja-ga-śa-ya-na-m\n> –   –  –  ∪  –  ∪ ∪ ∪ ∪ ∪ ∪ –\n\nWait — let's be more careful:\n> śān-ta-kā-raṃ bhu-ja-ga-śa-ya-naṃ\n> –   ∪  –  –   ∪  ∪ ∪ ∪ ∪ ∪ –\n\n(This is from the Viṣṇu-sahasranāma dhyāna-śloka, in śārdūlavikrīḍita meter — 19 syllables per pāda.)\n\n## 8-Syllable Units: The Anuṣṭubh Foundation\n\nThe most common meter in Sanskrit is **anuṣṭubh** (śloka) — 4 pādas of 8 syllables each, total 32.\n\nLearn to feel groups of 8:\n> na-mā-mi-śi-va-māṃ-śān-tam (8 syllables)\n> Count: 1-2-3-4-5-6-7-8\n\nPractice clapping on each syllable while reciting any śloka.\n\n## The Mantra Tetris Game\n\nTake a devotional phrase and reshape it to fit exactly 8 syllables:\n\n| Phrase | Syllables | Adjustment |\n|--------|-----------|------------|\n| namāmi śivam | 5 | too short — add: śāntam → namāmi śivam śāntam (7)... nityam → 8! |\n| namāmi nīlakaṇṭham | 7 | add: tam → 8... or: namāmi nīlakaṇṭha(m) prabhu(m) |\n\nThis is the beginning of metrical composition.\n\n## Milestone Check\nCan you mark any Sanskrit verse as laghu/guru and count syllables accurately? Can you hear 8-syllable units naturally?\n", "reference": "# Stage 16: Chandas I — Reference Guide\n\n## Laghu/Guru Rules\n\n| Condition | Result | Example |\n|-----------|--------|---------|\n| Long vowel (ā,ī,ū,e,ai,o,au) | Guru (–) | nā, de, vai |\n| Short vowel + single C + vowel | Laghu (∪) | na, ma, ka |\n| Short vowel + conjunct | Guru (–) | bha in bhaktyā |\n| Short vowel + anusvāra | Guru (–) | saṃ, taṃ |\n| Short vowel + visarga | Guru (–) | namaḥ (maḥ = –) |\n| Last syllable of pāda | Guru (by convention) | always – |\n\n## 8 Gaṇas\n\n| Name | Pattern | Mnemonic (from yamātārājabhānasalagām) |\n|------|---------|----------------------------------------|\n| ya | ∪ – – | **ya**-mā-tā |\n| ma | – – – | **mā**-tā-rā |\n| ta | – – ∪ | **tā**-rā-ja |\n| ra | – ∪ – | **rā**-ja-bhā |\n| ja | ∪ – ∪ | **ja**-bhā-na |\n| bha | – ∪ ∪ | **bhā**-na-sa |\n| na | ∪ ∪ ∪ | **na**-sa-la |\n| sa | ∪ ∪ – | **sa**-la-gā |\n\nPlus single-syllable units: **la** (∪) and **ga** (–)\n\n## Common Meters Overview\n\n| Meter | Syllables/pāda | Total | Key Feature |\n|-------|---------------|-------|-------------|\n| Gāyatrī | 6 | 24 | Vedic |\n| Anuṣṭubh/Śloka | 8 | 32 | Most common |\n| Triṣṭubh | 11 | 44 | Vedic/epic |\n| Jagati | 12 | 48 | Vedic |\n| Vasantatilakā | 14 | 56 | Ornate |\n| Mandākrāntā | 17 | 68 | Slow, majestic |\n| Śārdūlavikrīḍita | 19 | 76 | Grand |\n| Sragdharā | 21 | 84 | Longest common |\n\n## Scansion Notation\n\nUse ∪ for laghu and – for guru. Write the pattern below each syllable:\n\n```\nna  mā  mi  śi  vam  śān  tam  de  vam\n∪   –   ∪   ∪   –    –    –    –   –\n```\n\n## Syllable Counting Practice Words\n\n| Word | Syllables | Count | Pattern |\n|------|-----------|-------|---------|\n| deva | de-va | 2 | – ∪ |\n| devam | de-vam | 2 | – – |\n| namaḥ | na-maḥ | 2 | ∪ – |\n| bhagavān | bha-ga-vān | 3 | ∪ ∪ – |\n| nīlakaṇṭha | nī-la-kaṇ-ṭha | 4 | – ∪ – ∪ |\n| mahādevāya | ma-hā-de-vā-ya | 5 | ∪ – – – ∪ |\n| karuṇāmayī | ka-ru-ṇā-ma-yī | 5 | ∪ ∪ – ∪ – |\n| trilocanam | tri-lo-ca-nam | 4 | ∪ – ∪ – |\n| gaṅgādharam | gaṅ-gā-dha-ram | 4 | – – ∪ – |\n", "workbook-questions": "# Stage 16: Chandas I — Workbook (Questions)\n\n## Section A: Laghu/Guru (15 marks)\n**A1.** Mark each syllable as laghu (∪) or guru (–) (10 marks):\n1. namāmi →  2. śivāya →  3. bhagavān →  4. nīlakaṇṭham →  5. triśūlam →\n6. puṣpam →  7. padmam →  8. devī →  9. saṃsāra →  10. karuṇā →\n\n**A2.** State the rule that makes each syllable guru (5 marks):\n1. mā in namāmi  2. ḥ in namaḥ  3. ṃ in saṃ  4. pad in padmam  5. vai in vaira\n\n## Section B: Gaṇa Identification (10 marks)\n**B1.** Name the gaṇa (3-syllable foot) (5 marks):\n1. ∪ – – →  2. – – – →  3. ∪ ∪ ∪ →  4. – ∪ – →  5. ∪ – ∪ →\n\n**B2.** Give the pattern for each gaṇa (5 marks):\n1. sa →  2. bha →  3. ta →  4. na →  5. ma →\n\n## Section C: Syllable Counting (15 marks)\n**C1.** Count the syllables in each phrase (5 marks):\n1. namāmi śivam →  2. he devi rakṣa mām →  3. śivāya namaḥ →  4. nīlakaṇṭhāya namaḥ →  5. oṃ namaḥ śivāya →\n\n**C2.** Scan this anuṣṭubh pāda — mark all 8 syllables as ∪ or – (10 marks):\n1. dharmasya glānir bhavati (8 syllables)\n2. dharmakṣetre kurukṣetre (8 syllables)\n\n## Section D: 8-Syllable Fitting (20 marks)\n**D1.** Reshape each phrase to fit exactly 8 syllables (add or substitute words) (10 marks):\n1. namāmi śivam (5 syl) → add 3 syllables: ___\n2. devīm bhajāmi (5 syl) → add 3: ___\n3. śivāya namaḥ śāntāya namaḥ (10 syl) → trim to 8: ___\n\n**D2.** Compose 4 original 8-syllable pādas on any devotional theme (10 marks):\n1. ___ (8 syllables)\n2. ___ (8 syllables)\n3. ___ (8 syllables)\n4. ___ (8 syllables)\n\n---\n\n**Total: 60 marks**\n", "workbook-answers": "# Stage 16: Chandas I — Workbook (Answers)\n\n## Section A\n**A1.**\n1. na-mā-mi → **∪ – ∪**  2. śi-vā-ya → **∪ – ∪**  3. bha-ga-vān → **∪ ∪ –**\n4. nī-la-kaṇ-ṭham → **– ∪ – –**  5. tri-śū-lam → **∪ – –**\n6. puṣ-pam → **– –**  7. pad-mam → **– –**  8. de-vī → **– –**\n9. saṃ-sā-ra → **– – ∪**  10. ka-ru-ṇā → **∪ ∪ –**\n\n**A2.**\n1. mā — **long vowel (ā)**  2. ḥ — **visarga makes preceding syllable guru**  3. ṃ — **anusvāra makes syllable guru**  4. pad — **short vowel + conjunct (d+m)**  5. vai — **diphthong (long by nature)**\n\n## Section B\n**B1.** 1. ∪ – – → **ya**  2. – – – → **ma**  3. ∪ ∪ ∪ → **na**  4. – ∪ – → **ra**  5. ∪ – ∪ → **ja**\n**B2.** 1. sa → **∪ ∪ –**  2. bha → **– ∪ ∪**  3. ta → **– – ∪**  4. na → **∪ ∪ ∪**  5. ma → **– – –**\n\n## Section C\n**C1.** 1. na-mā-mi-śi-vam → **5**  2. he-de-vi-ra-kṣa-mām → **6**  3. śi-vā-ya-na-maḥ → **5**\n4. nī-la-kaṇ-ṭhā-ya-na-maḥ → **7**  5. oṃ-na-maḥ-śi-vā-ya → **6**\n\n**C2.**\n1. dha-rma-sya-glā-nir-bha-va-ti → ∪ – ∪ – – ∪ ∪ ∪ (accepting reasonable analysis)\n2. dha-rma-kṣe-tre-ku-ru-kṣe-tre → ∪ – – – ∪ ∪ – – (accepting reasonable analysis)\n\n## Section D\n**D1.**\n1. namāmi śivam → **namāmi śivaṃ śāntam** (∪–∪∪–––, 7...) or **nityaṃ namāmi śivam** (8: ni-tyaṃ-na-mā-mi-śi-va-m)\n2. devīm bhajāmi → **devīṃ bhajāmi sadā** (8: de-vīṃ-bha-jā-mi-sa-dā + adjust)\n3. śivāya namaḥ śāntāya namaḥ → **śivāya śāntāya namaḥ** (8: śi-vā-ya-śān-tā-ya-na-maḥ)\n\n**D2.** Sample:\n1. na-mā-mi-de-vaṃ-śi-va-m (namāmi devaṃ śivam — 8)\n2. pā-hi-māṃ-pa-ra-me-śva-ra (pāhi māṃ parameśvara — 8)\n3. de-vī-ma-māṃ-sa-dā-pā-tu (devī mamāṃ sadā pātu — 8)\n4. bha-ja-śaṃ-bhuṃ-sa-dā-śi-vam (bhaja śambhuṃ sadāśivam — 8)\n\n---\n\n**Total: 60 marks**\n"}, "tabs": ["theory", "reference", "workbook-questions", "workbook-answers"]}, {"id": "17-chandas-ii", "number": 17, "title": "Chandas II", "subtitle": "Anustubh", "files": {"theory": "# Stage 17: Chandas II — Anuṣṭubh (Śloka)\n\n## Goal\nMaster the anuṣṭubh/śloka meter and compose spontaneous verses in it.\n\n## Anuṣṭubh Structure\n\n4 pādas × 8 syllables = 32 syllables per verse. Two pādas form a half-verse (ardha-śloka).\n\n```\npāda a (8) | pāda b (8)    ← first half\npāda c (8) | pāda d (8)    ← second half\n```\n\n## The Rules\n\nThe anuṣṭubh is **not** strictly fixed in all positions. The key constraints:\n\n### Even pādas (b and d):\n- Position 5 must be **laghu** (∪)\n- Position 6 must be **guru** (–)\n- Position 7 must be **guru** (–) [in pāda b] or **laghu** (∪) [in pāda d is flexible]\n- Pattern at 5-6-7: typically ∪ – – (b) and ∪ – ∪ (d)\n\n### Odd pādas (a and c):\n- Position 5 should **not** be ∪ – ∪ (ja-gaṇa at 5-6-7 is avoided)\n- Otherwise quite free\n\n### Summary of key constraint:\n```\nPāda b: × × × × ∪ – – ×    (positions 5-6-7 = ∪ – –)\nPāda d: × × × × ∪ – ∪ ×    (positions 5-6-7 = ∪ – ∪)\n```\n(× = free, but certain patterns preferred)\n\n## Yati (Caesura)\n\nA natural word-break (yati) typically falls after the 4th syllable in each pāda.\n\n## Classical Examples\n\n### Bhagavadgītā 2.47:\n```\nkar-ma-ṇy-e-vā-dhi-kā-ras-te    (a: 8 syllables)\nmā pha-le-ṣu ka-dā-ca-na         (b: 8, pos 5-7: ∪ – ∪... actually this is flexible)\nmā kar-ma-pha-la-he-tur bhūr       (c: 8)\nmā te saṅ-go'-stv a-kar-ma-ṇi     (d: 8)\n```\n\n### Simple anuṣṭubh:\n```\nna-mā-mi śi-vaṃ śān-taṃ de-   (a)\nvaṃ tri-lo-ca-naṃ ha-ram       (b)\nnī-la-kaṇ-ṭhaṃ ga-ṅgā-dha-    (c)\nraṃ na-ṭa-rā-jaṃ na-mā-my-a-ham (d)\n```\n\n## Composition Process\n\n### Step 1: Choose your message\n\"I bow to peaceful Śiva who has three eyes\"\n\n### Step 2: List key words with syllable counts\nnamāmi (3), śivam (2), śāntam (2), trilocanam (4), devam (2)\n\n### Step 3: Arrange into 8-syllable pādas\nTry: namāmi śivaṃ śāntam (7... need 1 more)\n→ namāmi śivaṃ śāntaṃ tam (8? adjust...)\n\n### Step 4: Check constraints on positions 5-6-7\n\n### Step 5: Adjust with synonyms if needed\nReplace \"trilocanam\" (4) with \"trinetram\" (3) or \"tryambakam\" (3) if needed for fit.\n\n## Practice Technique\n\n1. Take any simple devotional sentence\n2. Restate it to fit 8 syllables per half-line\n3. Use synonyms to adjust syllable count\n4. Check laghu/guru at positions 5-6-7 in even pādas\n5. Recite aloud — it should flow naturally\n\n## The Śloka Offering Game\n\nCompose one śloka (4 pādas) as a daily offering to your iṣṭadevatā.\n\n## Milestone Check\nCan you compose a spontaneous anuṣṭubh śloka on a given devotional theme?\n", "reference": "# Stage 17: Chandas II — Reference Guide\n\n## Anuṣṭubh Rules Summary\n\n```\nPosition:  1  2  3  4  5  6  7  8\nPāda a:    ×  ×  ×  ×  ×  ×  ×  ×   (free, avoid ja at 5-6-7)\nPāda b:    ×  ×  ×  ×  ∪  –  –  ×   (5-6-7 must be ∪ – –)\nPāda c:    ×  ×  ×  ×  ×  ×  ×  ×   (free, avoid ja at 5-6-7)\nPāda d:    ×  ×  ×  ×  ∪  –  ∪  ×   (5-6-7 should be ∪ – ∪)\n```\n\n× = free (laghu or guru), but patterns should sound natural.\n\n## Word Length × Syllable Count\n\n| Syllables | Useful Words (Masculine Acc.) |\n|-----------|------------------------------|\n| 1 | taṃ, yaṃ, māṃ |\n| 2 | devam, śivam, haram, bhajam |\n| 3 | namāmi, bhajāmi, trinetram |\n| 4 | trilocanam, nīlakaṇṭham, jagadīśam |\n| 5 | mahādevāya, parameśvaram |\n| 6 | nīlakaṇṭhāya, karuṇāmayīm |\n\n## Anuṣṭubh Composition Checklist\n\n1. ☐ Each pāda has exactly 8 syllables\n2. ☐ Pāda b positions 5-6-7 = ∪ – –\n3. ☐ Pāda d positions 5-6-7 = ∪ – ∪\n4. ☐ Natural word-break near position 4-5\n5. ☐ Meaning is complete and devotional\n6. ☐ Sandhi applied at word junctions\n\n## 10 Model Anuṣṭubh Ślokas\n\n### 1. (BG 9.22)\nananyāś cintayanto māṃ / ye janāḥ paryupāsate\nteṣāṃ nityābhiyuktānāṃ / yogakṣemaṃ vahāmy aham\n\n### 2. (BG 4.7)\nyadā yadā hi dharmasya / glānir bhavati bhārata\nabhyutthānam adharmasya / tadātmānaṃ sṛjāmy aham\n\n### 3. (Sarasvatī-stotra pattern)\nyā devī sarvabhūteṣu / buddhirūpeṇa saṃsthitā\nnamas tasyai namas tasyai / namas tasyai namo namaḥ\n\n### 4. (Traditional)\nguru-brahma guru-viṣṇuḥ / gurur devo maheśvaraḥ\nguruḥ sākṣāt paraṃ brahma / tasmai śrīgurave namaḥ\n\n## Synonym Swaps for Metrical Fit\n\n| Too long? | Try shorter | Syl |\n|-----------|-------------|-----|\n| parameśvara (5) | maheśvara (4) | save 1 |\n| nīlakaṇṭha (4) | hara (2) | save 2 |\n| trilocana (4) | trinetra (3) | save 1 |\n| padmanābha (4) | hari (2) | save 2 |\n| karuṇāmaya (5) | kṛpālu (3) | save 2 |\n\n| Too short? | Try longer | Syl |\n|------------|-----------|-----|\n| hara (2) | maheśvara (4) | gain 2 |\n| hari (2) | nārāyaṇa (4) | gain 2 |\n| deva (2) | bhagavān (3) | gain 1 |\n| padma (2) | aravinda (4) | gain 2 |\n", "workbook-questions": "# Stage 17: Chandas II — Workbook (Questions)\n\n## Section A: Scansion (15 marks)\n**A1.** Scan these pādas — mark each syllable as ∪ or – and count (10 marks):\n1. yadā yadā hi dharmasya\n2. glānir bhavati bhārata\n3. namāmi śivaṃ śāntaṃ ca\n4. devīṃ bhajāmi mādhavīm\n\n**A2.** Check: do pādas 2 and 4 above follow the ∪ – – and ∪ – ∪ rule at positions 5-6-7? (5 marks)\n\n## Section B: Composition (30 marks)\n**B1.** Complete these half-ślokas by supplying the second pāda (8 syllables, correct pattern at 5-6-7) (10 marks):\n1. namāmi śivaṃ devam / ___\n2. yā devī sarvabhūteṣu / ___\n\n**B2.** Compose 2 complete anuṣṭubh ślokas (4 pādas each) on any devotional theme. Mark syllable count for each pāda (20 marks):\n\nŚloka 1:\n- a: ___ (count: ___)\n- b: ___ (count: ___)\n- c: ___ (count: ___)\n- d: ___ (count: ___)\n\nŚloka 2:\n- a: ___\n- b: ___\n- c: ___\n- d: ___\n\n## Section C: Synonym Substitution (15 marks)\n**C1.** This pāda has 10 syllables — reduce to 8 by using shorter synonyms (5 marks):\n> nīlakaṇṭhaṃ maheśvaraṃ namāmi (10)\nRevised: ___\n\n**C2.** This pāda has 6 syllables — expand to 8 (5 marks):\n> haraṃ namāmi (5-6)\nExpanded: ___\n\n**C3.** Adjust this śloka so all 4 pādas have exactly 8 syllables (5 marks):\n> a: namāmi devam (5)\n> b: śivaṃ bhajāmi sadā (7)\n> c: nityam smarāmi (5)\n> d: prabhuṃ nīlakaṇṭham (6)\nCorrected version: ___\n\n---\n\n**Total: 60 marks**\n", "workbook-answers": "# Stage 17: Chandas II — Workbook (Answers)\n\n## Section A\n**A1.**\n1. ya-dā-ya-dā-hi-dha-rma-sya → ∪ – ∪ – ∪ ∪ – ∪ (8 syllables)\n2. glā-nir-bha-va-ti-bhā-ra-ta → – – ∪ ∪ ∪ – ∪ ∪ (8 syllables)\n3. na-mā-mi-śi-vaṃ-śān-taṃ-ca → ∪ – ∪ ∪ – – – ∪ (8 syllables)\n4. de-vīṃ-bha-jā-mi-mā-dha-vīm → ∪ – ∪ – ∪ – ∪ – (8 syllables)\n\n**A2.** Pāda 2, pos 5-6-7: ∪ – ∪ → This is the d-type pattern (∪ – ∪), acceptable. Pāda 4, pos 5-6-7: ∪ – ∪ → also d-type. If these are b-pādas, they should ideally be ∪ – –. Context determines correctness.\n\n## Section B\n**B1.** Samples:\n1. namāmi śivaṃ devam / **nīlakaṇṭhaṃ maheśvaram** (8, pos 5-6-7: ∪ – ∪ – ... check and adjust)\n2. yā devī sarvabhūteṣu / **buddhirūpeṇa saṃsthitā** (classic completion)\n\n**B2.** Sample śloka 1:\n- a: na-mā-mi-de-vaṃ-śaṃ-bhu-m (8) — namāmi devaṃ śambhum\n- b: nī-la-kaṇ-ṭhaṃ-ma-he-śva-ram (8) — nīlakaṇṭhaṃ maheśvaram\n- c: tri-ne-traṃ-bha-sma-bhū-ṣi-tam (8) — trinetraṃ bhasmabhūṣitam\n- d: sa-dā-śi-vaṃ-na-mā-my-a-ham (8) — sadāśivaṃ namāmy aham\n\nAccept any correctly structured anuṣṭubh.\n\n## Section C\n**C1.** nīlakaṇṭhaṃ maheśvaraṃ namāmi (10) → **haraṃ nīlakaṇṭhaṃ bhaje** (8) or **nīlakaṇṭhaṃ bhaje haram** (8)\n\n**C2.** haraṃ namāmi (5) → **sadā haraṃ namāmy aham** (8) or **śāntaṃ haraṃ namāmy aham** (8)\n\n**C3.** Corrected sample:\n- a: namāmi śivaṃ devaṃ taṃ (8)\n- b: bhajāmi sadā śaṅkaram (8)\n- c: nityaṃ smarāmi śambhum aham (8)\n- d: prabhuṃ nīlakaṇṭhaṃ haram (8)\n\n(Accept any valid 8-syllable correction.)\n\n---\n\n**Total: 60 marks**\n"}, "tabs": ["theory", "reference", "workbook-questions", "workbook-answers"]}, {"id": "18-chandas-iii", "number": 18, "title": "Chandas III", "subtitle": "Multiple Meters", "files": {"theory": "# Stage 18: Chandas III — Multiple Meters\n\n## Goal\nLearn 5+ meters beyond anuṣṭubh. Match meter to devotional mood. Compose in several meters.\n\n## The Meters\n\n### 1. Anuṣṭubh (8 per pāda) — review\nPattern: relatively free, 5-6-7 constrained. Mood: narrative, instructional.\n\n### 2. Indravajrā (11 per pāda)\nPattern: **– – ∪ – – ∪ ∪ – ∪ – –** (ta ta ja ga ga)\nMood: Stately, powerful. Good for praising powerful deities.\n\n### 3. Upendravajrā (11 per pāda)\nPattern: **∪ – ∪ – – ∪ ∪ – ∪ – –** (ja ta ja ga ga)\nMood: Flowing, graceful. Mixed with Indravajrā = Upajāti.\n\n### 4. Vasantatilakā (14 per pāda)\nPattern: **– – ∪ – ∪ ∪ ∪ – ∪ ∪ – ∪ – –** (ta bha ja ja ga ga)\nMood: Spring-like, ornate, devotional. Very popular in stotras.\n\n### 5. Mandākrāntā (17 per pāda)\nPattern: **– – – – ∪ ∪ ∪ ∪ ∪ – – ∪ – – ∪ – –** (ma bha na ta ta ga ga)\nYati after 4, 10. Mood: Majestic, slow, meditative. Used for Meghadūta.\n\n### 6. Śārdūlavikrīḍita (19 per pāda)\nPattern: **– – – ∪ ∪ – ∪ – ∪ ∪ ∪ – – – ∪ – – ∪ –** (ma sa ja sa ta ta ga)\nYati after 12. Mood: Grand, elaborate. Most stately of common meters.\n\n### 7. Sragdharā (21 per pāda)\nPattern: **– – – – ∪ – – ∪ ∪ ∪ ∪ ∪ ∪ – – – ∪ – – ∪ –** (ma ra bha na ya ya ya)\nYati after 7, 14. Mood: Most expansive, for supreme praise.\n\n### 8. Mālinī (15 per pāda)\nPattern: **∪ ∪ ∪ ∪ ∪ ∪ – – ∪ – – ∪ – – –** (na na ma ya ya)\nYati after 8. Mood: Gentle, sweet. Ideal for Kṛṣṇa/Devī devotion.\n\n## Matching Meter to Bhāva\n\n| Bhāva | Recommended Meters |\n|-------|-------------------|\n| Śānta (peace) | Mandākrāntā, Mālinī |\n| Vīra (heroic) | Śārdūlavikrīḍita, Indravajrā |\n| Śṛṅgāra (beauty) | Vasantatilakā, Mālinī |\n| Karuṇa (compassion) | Mandākrāntā, Vasantatilakā |\n| Adbhuta (wonder) | Sragdharā, Śārdūlavikrīḍita |\n| General praise | Anuṣṭubh, Upajāti |\n\n## Composition Exercise\n\nFor each meter, compose just ONE pāda (one line) correctly:\n\n1. **Indravajrā** (11): – – ∪ – – ∪ ∪ – ∪ – –\n   > nā-mā-mi-de-vaṃ-tri-pu-rān-ta-kā-ram (check pattern)\n\n2. **Vasantatilakā** (14): – – ∪ – ∪ ∪ ∪ – ∪ ∪ – ∪ – –\n   > (compose and scan)\n\n## Key Principle\nStart by imitating. Take a famous verse in each meter, replace key words while maintaining the pattern.\n\n## Milestone Check\nCan you compose at least one pāda in Indravajrā, Vasantatilakā, and one other meter beyond anuṣṭubh?\n", "reference": "# Stage 18: Chandas III — Reference Guide\n\n## Meter Patterns (Sama-vṛtta — all pādas identical)\n\n| Meter | Syl | Pattern (gaṇa) | Pattern (∪ –) |\n|-------|-----|----------------|---------------|\n| Anuṣṭubh | 8 | (variable) | ×××× ∪–(–/∪)× |\n| Indravajrā | 11 | ta-ta-ja-ga-ga | ––∪––∪∪–∪–– |\n| Upendravajrā | 11 | ja-ta-ja-ga-ga | ∪–∪––∪∪–∪–– |\n| Vaṃśastha | 12 | ja-ta-ja-ra | ∪–∪––∪∪–∪–∪– |\n| Vasantatilakā | 14 | ta-bha-ja-ja-ga-ga | ––∪–∪∪∪–∪∪–∪–– |\n| Mālinī | 15 | na-na-ma-ya-ya | ∪∪∪∪∪∪––∪––∪––– |\n| Mandākrāntā | 17 | ma-bha-na-ta-ta-ga-ga | ––––∪∪∪∪∪––∪––∪–– |\n| Śārdūlavikrīḍita | 19 | ma-sa-ja-sa-ta-ta-ga | –––∪∪–∪–∪∪∪–––∪––∪– |\n| Sragdharā | 21 | ma-ra-bha-na-ya-ya-ya | ––––∪––∪∪∪∪∪∪–––∪––∪– |\n\n## Yati (Caesura) Positions\n\n| Meter | Yati after |\n|-------|-----------|\n| Anuṣṭubh | 4 |\n| Indravajrā | 5 |\n| Vasantatilakā | 8 |\n| Mālinī | 8 |\n| Mandākrāntā | 4, 10 |\n| Śārdūlavikrīḍita | 12 |\n| Sragdharā | 7, 14 |\n\n## Famous Examples\n\n### Indravajrā (11)\n> sā vidyā yā vimuktaye (part of a famous verse)\n\n### Vasantatilakā (14)\n> śāntākāraṃ bhujagaśayanaṃ padmanābhaṃ sureśam\n(Actually this is Śārdūlavikrīḍita — careful!)\n\nThe Viṣṇu dhyāna-śloka:\n> śān-tā-kā-raṃ-bhu-ja-ga-śa-ya-naṃ-pa-dma-nā-bhaṃ-su-re-śam\nThis is 19 syllables = Śārdūlavikrīḍita!\n\n### Mālinī (15)\nMany Meghadūta stanzas. Also Devī-māhātmya ślokas.\n\n### Mandākrāntā (17)\nKālidāsa's Meghadūta opening:\n> kaś-cit-kān-tā | vi-ra-ha-gu-ru-ṇā | sva-adhi-kā-rāt-pra-ma-ttaḥ\n\n## Meter-Mood Matching Quick Card\n\n| For this mood... | Use this meter |\n|-----------------|----------------|\n| Quiet teaching | Anuṣṭubh |\n| Royal praise | Indravajrā |\n| Flowing devotion | Vasantatilakā |\n| Sweet tenderness | Mālinī |\n| Vast majesty | Mandākrāntā |\n| Grand celebration | Śārdūlavikrīḍita |\n| Supreme glory | Sragdharā |\n", "workbook-questions": "# Stage 18: Chandas III — Workbook (Questions)\n\n## Section A: Meter Identification (15 marks)\n**A1.** Count syllables and identify the meter (10 marks):\n1. Syllable count 8 per pāda → meter: ___\n2. Syllable count 11 per pāda, starts – – ∪ → meter: ___\n3. Syllable count 14 per pāda → meter: ___\n4. Syllable count 19 per pāda → meter: ___\n5. Syllable count 17 per pāda → meter: ___\n\n**A2.** Match meter to mood (5 marks):\n1. Grand heroic praise → ___  2. Gentle sweetness → ___  3. Narrative/teaching → ___\n4. Majestic meditation → ___  5. Spring-like devotion → ___\n\n## Section B: Scansion (15 marks)\n**B1.** Scan 2 verses — mark every syllable ∪ or –, then identify the meter (15 marks):\n\nVerse 1:\n> śāntākāraṃ bhujagaśayanaṃ padmanābhaṃ sureśam\n> viśvādhāraṃ gaganasadṛśaṃ meghavarṇaṃ śubhāṅgam\n\nVerse 2 (one anuṣṭubh):\n> sarvadharmān parityajya māmekam śaraṇaṃ vraja\n> ahaṃ tvā sarvapāpebhyo mokṣayiṣyāmi mā śucaḥ\n\n## Section C: Composition (30 marks)\n**C1.** Compose one pāda (single line) in Indravajrā meter (11 syllables, pattern: ––∪––∪∪–∪––) (10 marks):\n\n**C2.** Compose one pāda in Vasantatilakā (14 syllables) (10 marks):\n\n**C3.** Compose a full anuṣṭubh śloka (4 × 8) and then restate the same idea in a different meter of your choice (10 marks):\n\n---\n\n**Total: 60 marks**\n", "workbook-answers": "# Stage 18: Chandas III — Workbook (Answers)\n\n## Section A\n**A1.** 1. **Anuṣṭubh** 2. **Indravajrā** 3. **Vasantatilakā** 4. **Śārdūlavikrīḍita** 5. **Mandākrāntā**\n\n**A2.** 1. **Śārdūlavikrīḍita** 2. **Mālinī** 3. **Anuṣṭubh** 4. **Mandākrāntā** 5. **Vasantatilakā**\n\n## Section B\n**B1.** Verse 1:\n> śān-tā-kā-raṃ-bhu-ja-ga-śa-ya-naṃ-pa-dma-nā-bhaṃ-su-re-śam\n> – – – – ∪ ∪ ∪ ∪ ∪ – ∪ – – – ∪ – – –\nCount: 19 syllables → **Śārdūlavikrīḍita**\n\nVerse 2:\n> sar-va-dha-rmān-pa-ri-tya-jya / mā-me-kaṃ-śa-ra-ṇaṃ-vra-ja\n> – ∪ ∪ – ∪ ∪ – ∪ / – – – ∪ ∪ – ∪ ∪\nCount: 8 + 8 = 16 per half → **Anuṣṭubh**\n\n## Section C\n**C1.** Sample Indravajrā pāda (11, ––∪––∪∪–∪––):\n> nā-mā-mi-de-vaṃ-pa-ra-maṃ-ma-he-śam\n> – – ∪ – – ∪ ∪ – ∪ – –\n(Accept if pattern matches closely)\n\n**C2.** Sample Vasantatilakā pāda (14, ––∪–∪∪∪–∪∪–∪––):\n> (Very challenging — accept any reasonable 14-syllable attempt with correct pattern at key positions)\n\n**C3.** Sample:\nAnuṣṭubh: namāmi śivaṃ devaṃ taṃ / nīlakaṇṭhaṃ maheśvaram / trinetraṃ bhasmabhūṣitam / sadāśivaṃ namāmy aham\n\nSame idea in Indravajrā (11 per pāda):\n> nā-mā-mi-śaṃ-bhuṃ-tri-pu-rān-ta-kā-ram (attempt — accept reasonable efforts)\n\n---\n\n**Total: 60 marks**\n"}, "tabs": ["theory", "reference", "workbook-questions", "workbook-answers"]}, {"id": "19-paryaya-chandas", "number": 19, "title": "Paryaya-Chandas", "subtitle": "Lexical Flexibility", "files": {"theory": "# Stage 19: Paryāya-Chandas — Lexical Flexibility\n\n## Goal\nDevelop the ability to swap synonyms instantly to save a meter — making lexical search automatic under metrical pressure.\n\n## The Problem\nYou're composing in Vasantatilakā and need a 2-syllable word for \"sun\" at a position requiring – –. \"Sūryaḥ\" (– –) works! But what if you need ∪ – ? Then \"raviḥ\" (∪ –). Need ∪ ∪ – ? Try \"bhānuḥ\" doesn't work... \"dinakaraḥ\" (∪ ∪ ∪ ∪) — too many lags. \"arkaḥ\" (– –) — back to guru-guru.\n\nThis is the **Save the Meter** game: when your first-choice word doesn't fit the metrical pattern, instantly find a synonym that does.\n\n## Synonym Banks by Prosodic Pattern\n\n### Sun\n| Pattern | Word | Syllables |\n|---------|------|-----------|\n| – – | sūryaḥ, arkaḥ | 2 |\n| ∪ – | raviḥ | 2 |\n| – ∪ ∪ | bhāskaraḥ | 3 (– ∪ ∪) |\n| ∪ – ∪ | savitā | 3 |\n| ∪ ∪ – ∪ | divākaraḥ | 4 |\n\n### Moon\n| Pattern | Word |\n|---------|------|\n| – – | candraḥ |\n| ∪ – | induḥ |\n| ∪ ∪ – | śaśī (∪ ∪? no: śa-śī = ∪ –)... vidhuḥ (∪ –) |\n| – – ∪ ∪ | niśākaraḥ (∪ – ∪ ∪) |\n\n### Water\n| Pattern | Word |\n|---------|------|\n| ∪ ∪ | jala |\n| – ∪ | vāri |\n| – – | toyam (– –) |\n| ∪ ∪ ∪ | salila (∪ ∪ ∪) |\n| – – ∪ | nīram (– –) |\n\n### Lotus\n| Pattern | Word |\n|---------|------|\n| – – | padmam |\n| ∪ ∪ ∪ | kamala (∪ ∪ ∪) |\n| ∪ ∪ – – | aravindam (∪ ∪ – –) |\n| ∪ ∪ ∪ ∪ | sarasijam (∪ ∪ ∪ ∪) |\n| – ∪ ∪ | paṅkajam (– ∪ ∪) |\n\n## The Technique\n\n1. **Know 3-5 synonyms** for every common noun\n2. **Know their prosodic profiles** (laghu-guru patterns)\n3. **When stuck**, cycle through synonyms mentally: padmam (––), kamalam (∪∪∪), aravindam (∪∪––), paṅkajam (–∪∪)\n4. **Pick the one that fits** the required pattern at that position\n\n## Practice Method\n\nTake a half-composed pāda with a gap:\n> – – ∪ – – [need ∪ ∪ –] ∪ – – (Indravajrā, 11 syllables)\n\nPosition 6-7-8 needs ∪ ∪ –. I need a word for \"lotus\":\n- padmam (– –) — NO\n- kamala (∪ ∪ ∪) — close, but last is laghu\n- kamale (∪ ∪ –) — YES! (locative gives the guru ending)\n\n**Key insight:** Changing the vibhakti (case form) changes the prosodic pattern too! This gives you even more options.\n\n## Case Forms as Prosodic Tools\n\n| Word | Nom | Acc | Inst | Dat | Loc |\n|------|-----|-----|------|-----|-----|\n| śiva | ∪∪– (śivaḥ) | ∪∪– (śivam) | ∪∪–∪ (śivena) | ∪∪–∪ (śivāya) | ∪∪– (śive) |\n| padma | –– (padmam) | –– | –∪–∪ (padmena) | ––∪ (padmāya) | –– (padme) |\n\n## Milestone Check\nGiven a metrical gap of specific pattern, can you instantly find a synonym + case form that fills it?\n", "reference": "# Stage 19: Paryāya-Chandas — Reference Guide\n\n## Prosodic Synonym Banks\n\n### Śiva\n| Syllables | ∪∪ | ∪– | –∪ | –– | ∪∪∪ | ∪–∪ | –∪∪ | –∪– | ∪–– |\n|-----------|----|----|----|----|-----|-----|-----|-----|-----|\n| 2 | — | haraḥ | — | — | — | — | — | — | — |\n| 3 | — | — | — | — | śivaḥ | — | śambhuḥ | — | — |\n| 4+ | — | — | — | — | — | — | — | maheśvaraḥ | — |\n\n### Sun (Sūrya)\n| Pattern | Word | Syl |\n|---------|------|-----|\n| – – | sūryaḥ, arkaḥ | 2 |\n| ∪ – | raviḥ | 2 |\n| ∪ ∪ – | — | — |\n| – ∪ ∪ | bhāskaraḥ? (–∪∪∪) | 4 |\n| – – ∪ | ādityaḥ (–∪–) | 3 |\n\n### Moon (Candra)\n| Pattern | Word | Syl |\n|---------|------|-----|\n| – – | candraḥ | 2 |\n| ∪ – | induḥ, vidhuḥ | 2 |\n| ∪ – | śaśī | 2 |\n| – ∪ | somaḥ | 2 |\n| ∪ – ∪ ∪ | niśākaraḥ | 4 |\n\n### Lotus\n| Pattern | Word | Syl |\n|---------|------|-----|\n| – – | padmam | 2 |\n| ∪ ∪ ∪ | kamalam | 3 |\n| ∪ – – | ambujam | 3 |\n| – ∪ ∪ | paṅkajam | 3 |\n| ∪ ∪ – – | aravindam | 4 |\n| ∪ ∪ ∪ ∪ | sarasijam | 4 |\n| – ∪ ∪ | jalajam | 3 |\n| ∪ ∪ ∪ ∪ | nalinam? | check |\n\n### Water\n| Pattern | Word | Syl |\n|---------|------|-----|\n| ∪ ∪ | jala | 2 |\n| – ∪ | vāri | 2 |\n| – – | toyam | 2 |\n| – – | nīram | 2 |\n| – ∪ | ambu | 2 |\n| ∪ ∪ ∪ | salila | 3 |\n| ∪ ∪ – | udakam | 3 |\n\n### Fire\n| Pattern | Word | Syl |\n|---------|------|-----|\n| – – | agniḥ | 2 |\n| – – | vahniḥ | 2 |\n| ∪ ∪ ∪ | anala | 3 |\n| – ∪ ∪ | pāvakaḥ | 3 |\n| ∪ – ∪ ∪ | hutāśanaḥ | 4 |\n\n### Mountain\n| Pattern | Word |\n|---------|------|\n| ∪ ∪ | giri | 2 |\n| – ∪ | adri | 2 |\n| – – ∪ ∪ | parvataḥ | 3 |\n| ∪ ∪ ∪ | acalaḥ | 3 |\n| – ∪ | śailaḥ | 2 |\n\n### Ocean\n| Pattern | Word |\n|---------|------|\n| – – | sindhuḥ | 2 |\n| – ∪ ∪ | sāgaraḥ | 3 |\n| ∪ ∪ – | samudraḥ? (∪∪–) | 3 |\n| – ∪ | abdhi | 2 |\n| ∪ ∪ ∪ | udadhi | 3 |\n\n## Case-Form Prosodic Variants (śiva example)\n\n| Case | Form | Pattern |\n|------|------|---------|\n| 1st | śivaḥ | ∪ ∪ – |\n| 2nd | śivam | ∪ ∪ – |\n| 3rd | śivena | ∪ ∪ – ∪ |\n| 4th | śivāya | ∪ ∪ – ∪ |\n| 5th | śivāt | ∪ ∪ – |\n| 6th | śivasya | ∪ ∪ – ∪ |\n| 7th | śive | ∪ – |\n\n## Quick Decision Process\n\n1. What meaning do I need? (e.g., \"lotus\")\n2. How many syllables can I fit? (e.g., 3)\n3. What pattern do I need? (e.g., ∪ – –)\n4. Scan synonym list → ambujam (∪ – –) ✓\n5. Does it make grammatical sense in this case? ✓ → Use it!\n", "workbook-questions": "# Stage 19: Paryāya-Chandas — Workbook (Questions)\n\n## Section A: Pattern Matching (15 marks)\n**A1.** For each concept, give a synonym matching the required prosodic pattern (10 marks):\n1. Sun, pattern – – : ___\n2. Sun, pattern ∪ – : ___\n3. Lotus, pattern ∪ ∪ ∪ : ___\n4. Lotus, pattern – – : ___\n5. Water, pattern – ∪ : ___\n6. Moon, pattern ∪ – : ___\n7. Fire, pattern – – : ___\n8. Mountain, pattern ∪ ∪ : ___\n9. Ocean, pattern – – : ___\n10. Lotus, pattern – ∪ ∪ : ___\n\n**A2.** Give 3 prosodically different synonyms for \"Śiva\" with their patterns (5 marks):\n\n## Section B: Meter Rescue (20 marks)\n**B1.** This Indravajrā pāda (– – ∪ – – ∪ ∪ – ∪ – –) needs fixing. The underlined word doesn't fit metrically. Replace it with a synonym that fits (10 marks):\n1. Position needs – – but \"raviḥ\" (∪ –) is there → replace with: ___\n2. Position needs ∪ ∪ ∪ but \"padmam\" (– –) is there → replace with: ___\n3. Position needs ∪ – but \"candraḥ\" (– –) is there → replace with: ___\n4. Position needs – ∪ but \"jalam\" (∪ ∪) is there → replace with: ___\n5. Position needs ∪ ∪ ∪ but \"agniḥ\" (– –) is there → replace with: ___\n\n**B2.** Complete each pāda by filling the gap with an appropriately patterned word (10 marks):\n1. nā-mā-mi ___(∪∪–∪)___ ma-he-śva-ram (Indravajrā, need 4 syllables matching ∪∪–∪)\n2. ___(––)___kaṇṭhaṃ bhajāmi tam (need 2 guru syllables for \"blue\")\n\n## Section C: Composition Under Constraint (25 marks)\n**C1.** Compose one anuṣṭubh śloka about the sun, using at least 3 different synonyms for \"sun\" (10 marks):\n**C2.** Compose a 2-pāda verse in any longer meter (11+ syllables), using synonym swaps to maintain the pattern. Show your working: which words you tried first and why you swapped (15 marks):\n\n---\n\n**Total: 60 marks**\n", "workbook-answers": "# Stage 19: Paryāya-Chandas — Workbook (Answers)\n\n## Section A\n**A1.**\n1. Sun, – – : **sūryaḥ** or **arkaḥ**\n2. Sun, ∪ – : **raviḥ**\n3. Lotus, ∪ ∪ ∪ : **kamalam**\n4. Lotus, – – : **padmam**\n5. Water, – ∪ : **vāri** or **ambu**\n6. Moon, ∪ – : **induḥ** or **śaśī**\n7. Fire, – – : **agniḥ** or **vahniḥ**\n8. Mountain, ∪ ∪ : **giriḥ** (∪ ∪)\n9. Ocean, – – : **sindhuḥ** or **abdhiḥ**\n10. Lotus, – ∪ ∪ : **paṅkajam**\n\n**A2.** Three prosodically different synonyms for Śiva:\n- **haraḥ** (∪ –) — 2 syllables\n- **śambhuḥ** (– –) — 2 syllables\n- **maheśvaraḥ** (∪ – ∪ ∪ ∪) — 5 syllables (or: mahādevaḥ ∪ – – ∪ — 4 syllables)\n\n## Section B\n**B1.**\n1. Need – – for \"sun\" → **sūryaḥ** or **arkaḥ**\n2. Need ∪ ∪ ∪ for \"lotus\" → **kamalam**\n3. Need ∪ – for \"moon\" → **induḥ** or **vidhuḥ**\n4. Need – ∪ for \"water\" → **vāri**\n5. Need ∪ ∪ ∪ for \"fire\" → **analaḥ**\n\n**B2.**\n1. nāmāmi **śivaṃ divyaṃ** (∪∪–∪? need to check — accept reasonable fits) maheśvaram\n2. **nīla**kaṇṭhaṃ bhajāmi tam (nīla = – ∪, giving – ∪ – – ∪ – ∪ –)\n\n## Section C\n**C1.** Sample:\n> sūryaḥ udeti pūrvasyāṃ / raviḥ prakāśate sadā\n> arkaḥ tamāṃsi nāśayet / bhānuḥ jagat prakāśayet\n(Uses sūryaḥ, raviḥ, arkaḥ, bhānuḥ — 4 synonyms. Accept 3+.)\n\n**C2.** Sample working for Indravajrā:\nFirst attempt: nāmāmi devaṃ nīlakaṇṭham → syllable check: 4+2+4 = 10 (need 11!)\nSwap: nāmāmi devaṃ nīlakaṇṭha-haram → too long\nTry: nāmāmi devaṃ nīlakaṇṭham imam → pattern check...\nFinal: nāmāmi śambhuṃ tripurāntakāram (– – ∪ – – ∪ ∪ – ∪ – – = 11 ✓)\n\nAward marks for: showing working (5), metrical correctness (5), synonym variety (5).\n\n---\n\n**Total: 60 marks**\n"}, "tabs": ["theory", "reference", "workbook-questions", "workbook-answers"]}, {"id": "20-alankara", "number": 20, "title": "Alankara", "subtitle": "Poetic Ornament", "files": {"theory": "# Stage 20: Alaṅkāra — Poetic Ornament\n\n## Goal\nTransform correct verse into *beautiful* verse using alaṅkāras (figures of speech). Master upamā (simile), rūpaka (metaphor), anuprāsa (alliteration), and other ornaments.\n\n## What is Alaṅkāra?\n\n**Alaṅkāra** (अलङ्कार) means \"ornament.\" Just as jewelry adorns the body, alaṅkāras adorn poetry. A verse can be grammatically correct and metrically perfect but still lack beauty — alaṅkāra provides the beauty.\n\n## Major Alaṅkāras\n\n### 1. Upamā (Simile) — \"like\"\nExplicit comparison using iva, yathā, sadṛśa, tulya, etc.\n\n> tava mukhaṃ candraḥ **iva** śobhate\n> (Your face shines **like** the moon)\n\n> gaṅgā **iva** pavitrā tava kṛpā\n> (Your grace is pure **like** the Gaṅgā)\n\n**Four elements:** upameya (thing compared), upamāna (standard), sādhāraṇa-dharma (shared quality), vācaka (word of comparison).\n\n### 2. Rūpaka (Metaphor) — \"is\"\nIdentification without comparison word. The upameya IS the upamāna.\n\n> tava mukhaṃ candraḥ (your face IS the moon)\n> saṃsāra-sāgaraḥ (saṃsāra IS an ocean)\n> jñāna-dīpaḥ (knowledge IS a lamp)\n> bhakti-sudhā (devotion IS nectar)\n> kṛpā-varṣaḥ (grace IS rain)\n\n### 3. Anuprāsa (Alliteration)\nRepetition of consonant sounds.\n\n> **śa**mbhuṃ **śa**ṅkaraṃ **śā**ntaṃ **śi**vam\n> (alliteration of **ś**)\n\n> **ka**ruṇā-**ka**lita-**kā**nti-**ka**malam\n> (alliteration of **k**)\n\nTypes:\n- **Chekānuprāsa:** same consonant cluster repeated (e.g., \"nta nta\")\n- **Vṛttyanuprāsa:** single consonant repeated throughout\n\n### 4. Yamaka (Rhyme/Punning Repetition)\nSame syllable sequence repeated with different meanings.\n\n> kālī kālī kālī — dark goddess / time / black\n> rāma-rāma — Rāma + pleasure\n\n### 5. Utprekṣā (Poetic Fancy/Hyperbole)\n\"As if\" — iva, manyate, kalpyate.\n\n> tava netraṃ padmam iva vikasati\n> (your eye blooms as if it were a lotus)\n\n### 6. Atiśayokti (Hyperbole)\nExtreme exaggeration for effect.\n\n> tava yaśaḥ diśaḥ pūrayati\n> (your fame fills all directions)\n\n### 7. Virodha (Paradox)\nApparent contradiction that reveals deeper truth.\n\n> agninā śītalaḥ (cool with fire — Śiva drinks fire but remains cool)\n> mṛtyoḥ amṛtam (from death, immortality)\n\n### 8. Arthāntaranyāsa (Corroboration)\nA general statement followed by a specific example, or vice versa.\n\n> mahātmanāṃ prabhāvaḥ anirvacanīyaḥ / yathā śivaḥ viṣaṃ pītvā nīlakaṇṭhaḥ abhavat\n> (The power of great souls is indescribable — as when Śiva drank poison and became blue-throated)\n\n## Adorning a Simple Verse\n\n### Without alaṅkāra:\n> namāmi devīṃ sundarīṃ karuṇāmayīm\n> (I bow to the beautiful, compassionate goddess)\n\n### With upamā:\n> candra-mukhīṃ devīṃ gaṅgā-sadṛśa-kṛpāṃ namāmi\n> (I bow to the goddess whose face is like the moon, whose grace resembles the Gaṅgā)\n\n### With rūpaka:\n> karuṇā-sindhuṃ jñāna-dīpam devīṃ namāmi\n> (I bow to the goddess who is an ocean of compassion, a lamp of knowledge)\n\n### With anuprāsa:\n> śāntāṃ śubhāṃ śivāṃ śaktiṃ devīṃ namāmi\n> (alliteration of **ś** throughout)\n\n## Milestone Check\nCan you take a plain stotra verse and adorn it with at least 2 different alaṅkāras?\n", "reference": "# Stage 20: Alaṅkāra — Reference Guide\n\n## Alaṅkāra Quick Table\n\n| Alaṅkāra | Type | Marker | Example |\n|-----------|------|--------|---------|\n| Upamā | Śabdālaṅkāra | iva, yathā, sadṛśa | mukhaṃ candra iva |\n| Rūpaka | Arthālaṅkāra | direct identification | karuṇā-sindhuḥ |\n| Anuprāsa | Śabdālaṅkāra | repeated consonant | śambhuṃ śaṅkaraṃ śāntam |\n| Yamaka | Śabdālaṅkāra | repeated syllable group | — |\n| Utprekṣā | Arthālaṅkāra | iva (fancy) | netraṃ padmam iva |\n| Atiśayokti | Arthālaṅkāra | extreme statement | yaśaḥ diśaḥ pūrayati |\n| Virodha | Arthālaṅkāra | paradox | agninā śītalaḥ |\n| Svabhāvokti | Arthālaṅkāra | vivid description | — |\n| Arthāntaranyāsa | Arthālaṅkāra | general + specific | — |\n\n## Upamā Components\n\n| Term | Role | In: mukhaṃ candra iva śobhate |\n|------|------|------|\n| Upameya | thing compared | mukham (face) |\n| Upamāna | standard | candra (moon) |\n| Sādhāraṇa-dharma | shared quality | śobhā (beauty) |\n| Vācaka | comparison word | iva (like) |\n\n## Comparison Words (Vācaka)\n\n| Sanskrit | Meaning |\n|----------|---------|\n| iva | like, as if |\n| yathā | as, like |\n| sadṛśa | resembling |\n| tulya | equal to |\n| samāna | same as |\n| nibha | resembling |\n| prakhya | appearing like |\n| kalpa | almost like |\n\n## Ready-Made Rūpakas (Metaphors)\n\n| Rūpaka | Literal | Applied Meaning |\n|--------|---------|-----------------|\n| karuṇā-sindhuḥ | ocean of compassion | extremely compassionate deity |\n| jñāna-dīpaḥ | lamp of knowledge | source of illumination |\n| bhakti-sudhā | nectar of devotion | devotion that gives immortality |\n| saṃsāra-sāgaraḥ | ocean of worldly existence | vast, hard to cross |\n| kṛpā-varṣaḥ | rain of grace | abundant grace |\n| moha-tamas | darkness of delusion | spiritual ignorance |\n| dharma-sūryaḥ | sun of dharma | illuminating righteousness |\n| prema-latā | vine of love | growing, clinging love |\n| māyā-jālam | net of māyā | entangling illusion |\n| jīvana-nadī | river of life | flowing existence |\n\n## Anuprāsa Consonant Groups for Deity Praise\n\n| Sound | Words Available |\n|-------|----------------|\n| ś- | śiva, śambhu, śaṅkara, śānta, śubha, śakti, śaraṇa, śreṣṭha |\n| k- | kṛṣṇa, karuṇā, kamala, kānti, kṛpā, kīrti, kalā, kailāsa |\n| m- | mahā, mālā, mandira, mādhava, mukha, mokṣa, mūrti, maṅgala |\n| d- | deva, devī, durgā, divya, dayā, darśana, dāna, dīpa |\n| n- | namāmi, nīla, nitya, nadī, nātha, nṛtya, naṭa |\n| p- | padma, pāhi, pavitra, pūjā, prabhu, prasāda, priya, prema |\n\n## Adornment Process\n\n1. **Write plain verse** (correct grammar + meter)\n2. **Identify plain nouns** that could become rūpakas\n3. **Add iva/yathā** comparisons where natural\n4. **Check for anuprāsa opportunities** — can you alliterate?\n5. **Verify meter still works** after changes\n", "workbook-questions": "# Stage 20: Alaṅkāra — Workbook (Questions)\n\n## Section A: Identification (15 marks)\n**A1.** Identify the alaṅkāra in each (10 marks):\n1. tava mukhaṃ candraḥ iva bhāti → ___\n2. karuṇā-sindho! pāhi mām → ___\n3. śambhuṃ śaṅkaraṃ śāntaṃ śivam → ___\n4. tava yaśaḥ sarvā diśaḥ pūrayati → ___\n5. agninā śītalaḥ śivaḥ → ___\n\n**A2.** For A1 #1, identify the four components of the upamā (5 marks):\nUpameya: ___  Upamāna: ___  Sādhāraṇa-dharma: ___  Vācaka: ___\n\n## Section B: Creation (20 marks)\n**B1.** Write one upamā (simile) comparing your iṣṭadevatā to a natural object (5 marks):\n**B2.** Write one rūpaka (metaphor) — use a compound like X-sindhu or X-dīpa (5 marks):\n**B3.** Write a line with anuprāsa (alliteration) — at least 4 words starting with the same consonant (5 marks):\n**B4.** Write a line using utprekṣā (poetic fancy) with \"iva\" (5 marks):\n\n## Section C: Adornment (25 marks)\n**C1.** Take this plain verse and adorn it with at least 2 alaṅkāras. Show before and after (15 marks):\nPlain: namāmi devīṃ karuṇāmayīṃ sundarīṃ pavitrām\n\n**C2.** Compose an original 4-line stotra using at least 3 different alaṅkāras. Label each (10 marks):\n\n---\n\n**Total: 60 marks**\n", "workbook-answers": "# Stage 20: Alaṅkāra — Workbook (Answers)\n\n## Section A\n**A1.**\n1. **Upamā** (simile — \"iva\" = like)\n2. **Rūpaka** (metaphor — called \"ocean of compassion\" directly)\n3. **Anuprāsa** (alliteration of ś-)\n4. **Atiśayokti** (hyperbole — fame fills all directions)\n5. **Virodha** (paradox — cool by fire)\n\n**A2.** Upameya: **mukham** (face). Upamāna: **candra** (moon). Sādhāraṇa-dharma: **bhāti/śobhā** (shining/beauty). Vācaka: **iva** (like).\n\n## Section B\n**B1.** Sample upamā: **tava kṛpā gaṅgā iva pavitrā** (your grace is pure like the Gaṅgā)\n**B2.** Sample rūpaka: **he karuṇā-sindho!** (O ocean of compassion!) or **jñāna-dīpa śiva** (Śiva, lamp of knowledge)\n**B3.** Sample anuprāsa: **śāntaṃ śubhaṃ śivaṃ śaṅkaraṃ bhaje** (alliteration of ś)\n**B4.** Sample utprekṣā: **tava netraṃ nīlotpalam iva vikasati** (your eye blooms as if it were a blue lotus)\n\n## Section C\n**C1.**\nPlain: namāmi devīṃ karuṇāmayīṃ sundarīṃ pavitrām\nAdorned:\n> **candra-mukhīṃ** [rūpaka] karuṇā-**sindhu**-samānāṃ [rūpaka + upamā]\n> **mā**yā-hariṇīṃ **mā**ngalya-**mā**linīṃ [anuprāsa of m]\n> devīṃ namāmi\n\n**C2.** Sample 4-line stotra:\n1. candra-vadanaṃ [rūpaka] devam namāmi (face-as-moon)\n2. śambhuṃ śaṅkaraṃ śāntaṃ śivam [anuprāsa: ś]\n3. yasya kṛpā gaṅgā iva pavitrā [upamā: grace like Gaṅgā]\n4. taṃ karuṇā-sāgaraṃ prapadye [rūpaka: ocean of compassion]\n\n---\n\n**Total: 60 marks**\n"}, "tabs": ["theory", "reference", "workbook-questions", "workbook-answers"]}, {"id": "21-rasa", "number": 21, "title": "Rasa", "subtitle": "Emotional Aesthetics", "files": {"theory": "# Stage 21: Rasa — Emotional Aesthetics\n\n## Goal\nConsciously control the rasa (aesthetic flavor) of your devotional composition. Describe the same deity in śānta, vīra, adbhuta, karuṇa, and other rasas.\n\n## The Nine Rasas (Navarasa)\n\n| Rasa | Sthāyibhāva (root emotion) | Mood | Color |\n|------|---------------------------|------|-------|\n| Śṛṅgāra | Rati (love) | Romantic, beautiful | Green |\n| Hāsya | Hāsa (laughter) | Comic, playful | White |\n| Karuṇa | Śoka (grief) | Compassionate, sad | Grey |\n| Raudra | Krodha (anger) | Furious, wrathful | Red |\n| Vīra |
