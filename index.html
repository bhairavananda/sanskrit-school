4\n- Correct meter (8 syllables per pāda): 3\n- Context makes the \"strange\" pāda sensible: 3\n- Sample context: The lotus (padma) — born from water, lives in water\n\n### Challenge 2 — Dattapadī (10 marks)\n- All 4 words (siṃha, kamala, vāyu, kāñcana) present: 4\n- Natural integration (not forced): 3\n- Devotional coherence: 3\n\n### Challenge 3 — Niṣiddhākṣarī (10 marks)\n- ZERO occurrences of \"ma\" (म): 5 (any violation = 0)\n- Devotional content about Devī: 3\n- Reasonable meter: 2\n- Note: all \"-am\" endings contain \"ma\" — must rephrase!\n\n### Challenge 4 — Āśu-kavitva (8 marks)\n- Relevant to guru-kṛpā theme: 3\n- Correct meter: 3\n- Poetic quality: 2\n\n### Challenge 5 — Kathā (6 marks)\n1. Cow's name: **Kāmadhenu** (2 marks)\n2. Who wanted it: **Viśvāmitra** (2 marks)\n3. What he became: **Brahmarṣi** (2 marks)\n\n### Challenge 6 — Gaṇanā (4 marks)\nCount of \"ca\": **8** (śivaś ca, viṣṇuś ca, brahmā ca, indraś ca, agniś ca, vāyuś ca, sūryaś ca, candraś ca)\nExact count = 4 marks, off by 1 = 2 marks, off by 2+ = 0\n\n### Challenge 7 — Aprastuta (6 marks)\n- Raghuvaṃśa author: **Kālidāsa** (2 marks)\n- 19 × 4: **76** (2 marks)\n- Gāyatrī from: **Ṛgveda** (2 marks)\n\n### Challenge 8 — Citra (6 marks)\n- All 4 pādas begin with \"go\": 3\n- Devotional to Kṛṣṇa: 2\n- Correct meter: 1\n\n## Sample Complete Responses\n\n**1.** Samasyā:\n> padmaṃ nāma kusumam etat (a)\n> sarve jānanti lokāḥ (b)\n> tat sundaram atiśobhanam (c)\n> **jalāt jātaṃ jale sthitam** (d)\n\n**2.** Dattapadī:\n> **siṃha**-rūpaṃ hariṃ bhaje (lion-form Hari)\n> **kamala**-nābhaṃ prapadye tam (lotus-naveled)\n> **vāyu**-sutena sevitaṃ devam (served by Hanumān)\n> **kāñcana**-varṇaṃ nārāyaṇam (gold-complexioned)\n\n**3.** No \"ma\" (very challenging — even \"-am\" is blocked!):\n> bhaje durgāṃ... wait, durgā**ṃ** has anusvāra not \"ma\"...\n> Actually anusvāra (ṃ) and \"ma\" (म) are different akṣaras. If only the akṣara \"ma\" is forbidden:\n> durge bhaje tvāṃ sadā śakti (no ma ✓)\n> trāhi pāhi dayānidhe (no ma ✓)\n> śūla-hastāṃ siṃha-vāhinīṃ (no ma ✓... wait, check every syllable)\n> This requires extreme care.\n\n**8.** Go- verse:\n> **go**vindaṃ praṇamāmy ahaṃ\n> **go**pālaṃ veṇuvādinaṃ\n> **go**vardhana-dharaṃ devaṃ\n> **go**pī-vallabham āśraye\n\n---\n\n**Total: 60 marks**\n"}, "tabs": ["theory", "reference", "workbook-questions", "workbook-answers"]}, {"id": "32-avadhana-seva", "number": 32, "title": "Avadhana-seva", "subtitle": "Mastery", "files": {"theory": "# Stage 32: Avadhāna-Sevā — Mastery\n\n## Goal\nThe performance itself becomes offering. You are now an Avadhānī — one whose attention is an act of worship.\n\n## What is Avadhāna-Sevā?\n\n**Sevā** = service, worship. At this final stage, avadhāna is no longer a test — it is a **sevā**. Every verse you compose under constraint is an offering. The eight challenges are eight flowers placed at the deity's feet. The entire performance is a pūjā of attention.\n\n## The Avadhānī's Qualities\n\n### 1. Pratibhā (Creative Genius)\nSpontaneous poetic ability — not mechanical production, but inspired composition that surprises even the composer.\n\n### 2. Dhāraṇā (Holding Power)\nThe ability to hold multiple threads of composition in memory simultaneously, without confusion or loss.\n\n### 3. Vāk-siddhi (Mastery of Speech)\nEvery word chosen with precision — grammatically correct, metrically perfect, aesthetically beautiful, and semantically deep.\n\n### 4. Dhairya (Composure)\nUnshakeable calm under pressure. The avadhānī never appears flustered, even when a constraint seems impossible.\n\n### 5. Vinaya (Humility)\nThe avadhānī attributes all ability to the deity's grace, not personal skill.\n\n## The Performance as Pūjā\n\n| Avadhāna Element | Pūjā Parallel |\n|-----------------|---------------|\n| Opening invocation | Āvāhana |\n| First compositions | Puṣpāñjali |\n| Responding to constraints | Upacāra |\n| Witty responses | Mānasa-pūjā |\n| Completing all verses | Naivedya |\n| Final presentation | Ārātrika |\n| Closing śloka | Kṣamā-prārthanā |\n\n## Beyond Aṣṭāvadhāna\n\n| Type | Simultaneous Threads |\n|------|---------------------|\n| Aṣṭāvadhāna | 8 |\n| Śatāvadhāna | 100 |\n| Sahasrāvadhāna | 1000 |\n\nThese higher forms are extremely rare. Historically, only a handful of poets have achieved śatāvadhāna.\n\n## The Avadhānī's Daily Practice\n\n1. **Morning:** Compose one original śloka as offering\n2. **Midday:** Practice one constraint exercise (niṣiddhākṣarī or samasyā)\n3. **Evening:** Rapid deity-switching drill (8 pādas for 8 deities)\n4. **Weekly:** Simulated full aṣṭāvadhāna with a friend or group\n5. **Continuously:** Think in Sanskrit, see the world through paryāya\n\n## The Final Teaching\n\n> kavitvaṃ na mama — kaveḥ anugrahaḥ\n> \"Poetry is not mine — it is the grace of the Poet.\"\n\nThe avadhānī knows that all their skill is a gift. The constraints are not obstacles but opportunities for the divine to speak through them. When every faculty is engaged — memory, wit, phonological awareness, metrical sense, devotional feeling, philosophical depth — the small self steps aside and something greater composes.\n\nThis is why it is called sevā.\n\n## Your Ongoing Path\n\n1. Perform your first aṣṭāvadhāna (even informally, with friends)\n2. Record it — review your compositions honestly\n3. Identify weak areas — drill them specifically\n4. Seek a guru who practices avadhāna\n5. Compose daily — quantity leads to quality\n6. Study classical stotras deeply — they are your models\n7. Never stop being a student\n\n## The Avadhānī's Closing Verse\n\n> yat kiñcit api sāmarthyaṃ\n> mama vāci sthitaṃ yadi\n> tat sarvaṃ tava kṛpayā\n> he deva! tvayi samarpaye\n\n\"Whatever ability may reside in my speech, all of that is by your grace, O Lord — to you I offer it.\"\n\n---\n\niti saṃskṛta-vidyālaye dvātriṃśat-sopāna-pāṭhaḥ samāptaḥ.\nThus concludes the 32-stage curriculum of the Sanskrit School.\n", "reference": "# Stage 32: Avadhāna-Sevā — Reference Guide\n\n## Avadhāna Performance Checklist\n\n### Before Performance\n- [ ] Invoke iṣṭadevatā mentally\n- [ ] Prepare tracking sheet (8 slots)\n- [ ] Clear mind — 5 minutes of prāṇāyāma\n- [ ] Opening śloka ready\n\n### During Performance\n- [ ] Stay in the present — attend fully to the current pṛcchaka\n- [ ] Use \"bookmark\" technique between slots\n- [ ] Maintain composure — smile through difficulty\n- [ ] Don't rush — accuracy over speed\n- [ ] Use constraints as inspiration, not obstacles\n\n### After Performance\n- [ ] Present all compositions cleanly\n- [ ] Acknowledge errors honestly\n- [ ] Thank pṛcchakas\n- [ ] Closing invocation\n\n## Self-Assessment Rubric\n\n| Skill | Beginner | Intermediate | Advanced | Avadhānī |\n|-------|----------|-------------|----------|----------|\n| Vocabulary | 100 words | 500 words | 1000+ words | Unlimited paryāya |\n| Declension | 1-2 paradigms | All common | Automatic | Unconscious |\n| Meter | Anuṣṭubh only | 3-4 meters | 7+ meters | Any meter |\n| Composition speed | 5 min/pāda | 1 min/pāda | 15 sec/pāda | Spontaneous |\n| Constraint handling | 1 at a time | 2-3 | 4-5 | 6+ simultaneous |\n| Memory threads | 1-2 | 3-4 | 5-6 | 8+ |\n| Rasa control | Unconscious | Aware | Intentional | Masterful |\n| Recovery from error | Freeze | Pause and recover | Smooth recovery | No errors visible |\n\n## Daily Practice Schedule\n\n| Time | Activity | Duration |\n|------|----------|----------|\n| Morning | Compose 1 original śloka | 15 min |\n| Morning | Recite 1 classical stotra from memory | 10 min |\n| Midday | Constraint exercise (rotate: niṣiddha/samasya/dattapada) | 15 min |\n| Evening | 8-deity rapid drill | 10 min |\n| Weekly | Full simulated aṣṭāvadhāna | 90 min |\n| Monthly | Review and assess progress | 30 min |\n\n## Classical Avadhānīs to Study\n\n| Name | Era | Known For |\n|------|-----|-----------|\n| Tirumalāmbā | 16th c. | Female avadhānī, court of Vijayanagara |\n| Gaṇapati Śāstrī | 19th-20th c. | Śatāvadhāna, student of Ramaṇa's era |\n| Śatāvadhānī Gaṇeśa (R. Ganesh) | Contemporary | Living tradition-bearer, 1000+ avadhānas |\n| Sridhar | Contemporary | Kannada/Sanskrit avadhāna |\n\n## The Tradition's Living Heart\n\nAvadhāna is not a dead art. It lives wherever a poet sits before an audience, receives impossible challenges, and — through grace, practice, and attention — transforms constraint into beauty.\n\nYour journey from nāma (Stage 1) to avadhāna-sevā (Stage 32) is complete as a curriculum. But as practice, it never ends.\n\n> anantā vai vedāḥ — the Vedas are infinite\n> anantā vai kavitā — poetry too is infinite\n\nBegin. Continue. Offer.\n", "workbook-questions": "# Stage 32: Avadhāna-Sevā — Final Examination\n\n## This is your final assessment. It is a complete, timed Aṣṭāvadhāna.\n\n### Instructions\n- Work through all 4 rounds without looking back\n- Time yourself: aim for under 60 minutes total\n- Be honest in self-assessment\n\n---\n\n## CHALLENGES:\n\n1. **Samasyāpūraṇa** — Given pāda (d): **mriyate ca sa jīvati** (\"he dies and he lives\")\n2. **Dattapadī** — Words: **darpaṇa (mirror), latā (vine), dīpa (lamp), payodhi (ocean)**\n3. **Niṣiddhākṣarī** — No letter: **ta** (त). Praise Śiva.\n4. **Āśu-kavitva** — Theme: \"Dawn at the temple\"\n5. **Kathā** — Read ONCE:\n   > purā mathurāyāṃ kaṃsaḥ nāma duṣṭaḥ rājā āsīt. saḥ devakīṃ kāragṛhe asthāpayat. devakī kṛṣṇam ajanayet. vasudevo rātrau kṛṣṇaṃ yamunāṃ tīrtvā gokule nandagṛhe asthāpayat. kṛṣṇo gokule vṛddho'bhavat. gopaiḥ saha akrīḍat. veṇum avādayat. govardhanaṃ dhṛtavān. ante kaṃsam nihantavān.\n6. **Gaṇanā** — Count the letter \"a\" (अ) at the START of words in this: \"aham adya atra āgacchāmi, aśvena agamaṃ, api atra āsīt ālayaḥ\" → count: ___\n7. **Aprastuta** — Questions in each round.\n8. **Citra** — Compose to Sarasvatī with anuprāsa (alliteration) of \"va\" throughout.\n\n---\n\n## ROUND 1\n1. Samasyā pāda (a): ___\n2. Dattapadī line 1 (darpaṇa): ___\n3. No \"ta\" — Śiva pāda (a): ___\n4. Dawn — pāda (a): ___\n7. INTERRUPTION: In which city was Kṛṣṇa born? ___\n8. \"va\" alliteration — Sarasvatī pāda (a): ___\n\n## ROUND 2\n1. Pāda (b): ___\n2. Line 2 (latā): ___\n3. No \"ta\" — pāda (b): ___\n4. Dawn — pāda (b): ___\n7. INTERRUPTION: What is 144 ÷ 12? ___\n8. \"va\" — pāda (b): ___\n\n## ROUND 3\n1. Pāda (c): ___\n2. Line 3 (dīpa): ___\n3. No \"ta\" — pāda (c): ___\n4. Dawn — pāda (c): ___\n7. INTERRUPTION: Name Kālidāsa's 2 mahākāvyas: ___\n8. \"va\" — pāda (c): ___\n\n## ROUND 4\n1. Pāda (d) = **mriyate ca sa jīvati** (given)\n2. Line 4 (payodhi): ___\n3. No \"ta\" — pāda (d): ___\n4. Dawn — pāda (d): ___\n5. KATHĀ QUESTIONS:\n   a. Where was Kṛṣṇa born? ___\n   b. Who carried him across the Yamunā? ___\n   c. What mountain did he lift? ___\n6. GAṆANĀ count: ___\n7. INTERRUPTION: What is the first word of the Ṛgveda? ___\n8. \"va\" — pāda (d): ___\n\n---\n\n## FINAL: Write all completed compositions cleanly below.\n\n**1. Samasyāpūraṇa:**\n\n**2. Dattapadī:**\n\n**3. Niṣiddhākṣarī:**\n\n**4. Āśu-kavitva:**\n\n**8. Citra:**\n\n**5. Kathā answers:**\n\n**6. Gaṇanā count:**\n\n**Total time taken:** ___\n\n---\n\n**Total: 100 marks** (Final Examination)\n", "workbook-answers": "# Stage 32: Avadhāna-Sevā — Final Examination (Answers)\n\n## Scoring Rubric (100 marks total)\n\n### 1. Samasyāpūraṇa (15 marks)\n- Context makes \"mriyate ca sa jīvati\" sensible: 5\n  - Best contexts: yogī dying to ego, living in brahman; or Śiva drinking poison\n- Correct meter throughout: 5\n- Poetic quality: 5\n\n### 2. Dattapadī (15 marks)\n- All 4 words present (darpaṇa, latā, dīpa, payodhi): 4\n- Natural integration: 4\n- Devotional coherence: 4\n- Poetic quality: 3\n- Sample connections: darpaṇa=ātman reflecting brahman, latā=bhakti-vine, dīpa=jñāna-lamp, payodhi=saṃsāra-ocean or karuṇā-ocean\n\n### 3. Niṣiddhākṣarī (15 marks)\n- ZERO \"ta\" (त) violations: 8 (any single violation = max 4)\n- Devotional to Śiva: 4\n- Poetic quality: 3\n- Note: \"ta\" blocks: tava, asti, -ti endings, triśūla, naṭarāja, satatam... very challenging!\n\n### 4. Āśu-kavitva (10 marks)\n- Theme \"dawn at temple\" expressed: 4\n- Correct meter: 3\n- Beauty/imagery: 3\n\n### 5. Kathā (9 marks)\na. Where born: **Mathurā** (kāragṛhe in Mathurā) — 3\nb. Who carried: **Vasudeva** — 3\nc. Mountain lifted: **Govardhana** — 3\n\n### 6. Gaṇanā (6 marks)\nWords starting with \"a\" (अ): aham, adya, atra, āgacchāmi (ā?), aśvena, agamam, api, atra, āsīt (ā?), ālayaḥ (ā?)\n\nIf counting only अ (short a): aham, adya, atra, aśvena, agamam, api, atra = **7**\nIf counting ā (आ) as well: + āgacchāmi, āsīt, ālayaḥ = **10**\nAccept either interpretation. Exact count = 6 marks, off by 1 = 4, off by 2 = 2.\n\n### 7. Aprastuta (12 marks, 3 each)\n- Kṛṣṇa born in: **Mathurā** (3)\n- 144 ÷ 12 = **12** (3)\n- Kālidāsa's mahākāvyas: **Raghuvaṃśa** and **Kumārasambhava** (3)\n- First word of Ṛgveda: **agnim** (agním īḷe...) (3)\n\n### 8. Citra (18 marks)\n- All 4 pādas have \"va\" alliteration: 6\n- About Sarasvatī: 4\n- Correct meter: 4\n- Beauty: 4\n- Sample: vāgdevīṃ vandāmi varade / vīṇā-vādana-viśāradām / vidyā-vilāsa-vibhūṣitām / varadāṃ vāṇīṃ prapadye sadā\n\n---\n\n## Grade Thresholds\n\n| Score | Grade | Title |\n|-------|-------|-------|\n| 90-100 | Avadhānī | Ready for public performance |\n| 75-89 | Siddha-kavitā | Near-mastery, continue drilling |\n| 60-74 | Upāsaka | Strong foundation, needs speed |\n| 45-59 | Abhyāsī | Good effort, review stages 23-30 |\n| Below 45 | Śiṣya | Continue learning — return to earlier stages |\n\n---\n\n## Closing\n\nWhatever your score, remember:\n\n> na cāhaṃ kaviḥ — kaviḥ tu bhagavān eva\n> \"I am not the poet — the Lord alone is the Poet\"\n\nThe journey from nāma to avadhāna is complete as curriculum.\nAs practice, it is ananta — endless.\n\noṃ tat sat.\n\n---\n\niti saṃskṛta-vidyālayasya dvātriṃśat-sopāna-pāṭhakramaḥ samāptaḥ.\n"}, "tabs": ["theory", "reference", "workbook-questions", "workbook-answers"]}];

const VOCAB = [{"id": "00-index", "title": "Index", "subtitle": "Source texts & overview", "content": "# Vocabulary Bank — Index\n\nA comprehensive Sanskrit vocabulary bank drawn from five foundational texts. Every entry includes source references so you can trace each word back to its original verse or name.\n\n## Source Texts\n\n| Abbreviation | Text | Tradition |\n|---|---|---|\n| **DM** | Devī Māhātmyam (Durgā Saptaśatī, 700 verses, 13 chapters) | Śākta / Mārkaṇḍeya Purāṇa |\n| **LS** | Lalitā Sahasranāma (1000 names, Brahmāṇḍa Purāṇa) | Śrīvidyā |\n| **KKS** | Kakārādi Kālī Sahasranāma (1000 names, Rudrayāmala) | Kālī-kula |\n| **KS** | Kālī Sahasranāma (1000 names, Bṛhannīla Tantra) | Kālī-kula |\n| **VS** | Viṣṇu Sahasranāma (1000 names, Mahābhārata Anuśāsana Parva) | Vaiṣṇava |\n\n## Reference Format\n\nEach entry shows: **word** — meaning — [grammar] — Sources: DM 2.14, LS 45, VS 100, etc.\n\n- DM references = chapter.verse (e.g., DM 1.78 = Ch.1, verse 78)\n- LS/KKS/KS/VS references = name number (e.g., LS 264 = 264th name)\n\n## File Index\n\n| File | Category | Entries |\n|------|----------|---------|\n| [01-goddess-names.md](01-goddess-names.md) | Names, epithets, and forms of Devī | ~250 |\n| [02-god-names.md](02-god-names.md) | Male deities, sages, celestials | ~120 |\n| [03-demons.md](03-demons.md) | Asuras, demon vocabulary | ~80 |\n| [04-weapons.md](04-weapons.md) | Weapons, instruments, battle gear | ~60 |\n| [05-body.md](05-body.md) | Body parts, physical description, adornment | ~100 |\n| [06-nature-cosmos.md](06-nature-cosmos.md) | Earth, sky, water, mountains, directions | ~80 |\n| [07-war-combat.md](07-war-combat.md) | Battle terms, combat verbs, destruction | ~90 |\n| [08-sound-speech.md](08-sound-speech.md) | Sound, speech, praise, narrative markers | ~50 |\n| [09-emotions.md](09-emotions.md) | Mental states, emotions, qualities of mind | ~70 |\n| [10-verbs.md](10-verbs.md) | High-frequency action verbs with text forms | ~80 |\n| [11-adjecti ---------|\n| √dṛś | to see | dadarśa, dṛṣṭvā, dṛṣṭaḥ | DM 1.8, 6.8; VS passim |\n| √śru | to hear | śuśrāva, śrutvā, śruta | DM 6.20, 9.1; VS passim |\n| √vid | to know | veda, vetti, vidita | DM passim; VS passim |\n| √jñā | to know | jānāti, jñātaḥ, jñāna (n.) | DM passim; LS passim |\n| √man | to think | manyate, manvāna, mata | DM passim; VS passim |\n| √cint | to contemplate | cintayāmāsa, cintita | DM 1.9 |\n| √smṛ | to remember | smarati, smṛtā | LS passim; DM 12.14 |\n| √budh | to awaken, know | buddhā, bodhayāmāsa | DM 1.73 (Viṣṇu awakened) |\n\n## D. Speaking (see also 08-sound-speech.md)\n\n| Root | Meaning | Key Forms | Sources |\n|------|---------|-----------|---------|\n| √vac | to speak | uvāca, uktaḥ, vakti | DM throughout |\n| √brū | to say | abravīt, brūhi | DM passim |\n| √ah | to say | āha, prāha | DM 6.3 |\n| √gad | to speak | jagāda | DM 6.8 |\n| √kathay | to narrate | kathayāmāsa | DM 1.4 |\n\n## E. Giving and Taking\n\n| Root | Meaning | Key Forms | Sources |\n|------|---------|-----------|---------|\n| √dā | to give | dadau, dadāti, dattaḥ | DM 4.37 (abhayaṃ dadau); VS passim |\n| √grah / √gṛh | to seize, take | jagrāha, gṛhīta | DM 9.14; VS passim |\n| √labh | to obtain | lebhe, labdha, lābha | DM passim; VS passim |\n| √āp | to attain | āpa, prāpta | DM 13.20; VS passim |\n| √hṛ | to take, carry | jaghāra, āhṛta | DM passim; VS passim |\n\n## F. Creating and Destroying\n\n| Root | Meaning | Key Forms | Sources |\n|------|---------|-----------|---------|\n| √sṛj | to create, release | sasarja, sṛṣṭa, sṛṣṭi | LS 264; VS passim |\n| √naś | to perish | nāśa, naṣṭa, vināśa | DM 12.9; LS passim |\n| √han | to kill | jaghāna, hata | DM throughout |\n| √kṛ | to do, make | cakāra, karoti, kṛtaḥ, kartṛ | DM throughout; VS passim |\n| √jan | to be born | jajñe, jāta, janana | DM passim; LS passim; VS passim |\n| √mṛ | to die | mamāra, mṛta, maraṇa | DM passim |\n| √jīv | to live | jīvati, jīvana | DM passim |\n\n## G. Worship and Devotion\n\n| Root  C. Horses\n\n| Term | Meaning | Grammar | Sources |\n|------|---------|---------|---------|\n| aśva / haya / turaga / vājin | horse | m. | DM 2.52; LS 68 |\n\n## D. Serpents\n\n| Term | Meaning | Grammar | Sources |\n|------|---------|---------|---------|\n| sarpa / nāga / ahi / bhujaṅga | serpent | m. | VS passim; KS passim |\n| ananta / śeṣa | the infinite serpent-bed | m. | VS 659; KS passim |\n| nāgayajñopavīta | serpent as sacred thread | adj. | KS passim |\n\n## E. Other Animals\n\n| Term | Meaning | Grammar | Sources |\n|------|---------|---------|---------|\n| mṛga | deer, wild animal | m. | DM passim; LS 472 |\n| kuraṅga / hariṇa | deer | m. | KKS 764 |\n| śvan / kukkura | dog | m. | KKS 871-873 (kukkura) |\n| go / dhenu | cow | f. | LS passim; VS passim |\n| kūrma | tortoise | m. | KKS 883; VS passim |\n| varāha | boar | m. | DM 8.18; VS passim |\n| vyāghra | tiger | m. | KS passim |\n| kokila | cuckoo | f. | KKS 959 |\n| kīra / śuka | parrot | m. | KS passim |\n| haṃsī | female swan | f. | KS passim |\n| cāmarī | yak | f. | KS passim |\n| mīna / matsya | fish | m. | LS 18; VS passim |\n| śarabha | mythical eight-legged beast | m. | KS passim |\n\n## F. Chariot and Vehicles\n\n| Term | Meaning | Grammar | Sources |\n|------|---------|---------|---------|\n| ratha | chariot | m. | DM 2.52, 9.18; LS 65-67 |\n| sārathi | charioteer | m. | DM 2.53 |\n| vāhana | mount, vehicle | n. from √vah | DM 6.15 |\n| siṃhavāhinī | she whose vehicle is the lion | f. | DM 2.29 |\n| vṛṣavāhinī | she whose vehicle is the bull | f. | KS passim |\n| siṃhavāhinī | lion-rider | f. | KS passim |\n| cakrarājaratha | chariot of Śrīcakra | m. | LS 65 |\n| geyacakraratha | chariot of Geyacakra | m. | LS 66 |\n| kiricakraratha | chariot of Kiricakra | m. | LS 67 |\n", "cards": [{"t": "siṃha / kesarin / keśarī", "m": "lion"}, {"t": "mahiṣa", "m": "buffalo"}, {"t": "garuḍa", "m": "eagle/divine bird"}, {"t": "haṃsa", "m": "swan/goose"}, {"t": "vṛṣabha / nandin", "m": "bull"}, {"t": "mayū | athavā | or else | DM passim |\n| api | also, even | DM passim |\n| atha | now, then (opening particle) | DM passim |\n| tathā | so, likewise | DM passim (paired with yathā) |\n\n## B. Emphasis and Affirmation\n\n| Term | Meaning | Sources |\n|------|---------|---------|\n| eva | indeed, only, precisely | DM throughout |\n| hi | indeed, for (causal) | DM passim |\n| khalu | indeed, certainly | DM passim |\n| nūnam | certainly, surely | DM passim |\n| sma | (emphatic past particle) | DM passim |\n| vai | truly, indeed | DM passim |\n\n## C. Negation\n\n| Term | Meaning | Sources |\n|------|---------|---------|\n| na | not | DM throughout |\n| mā | don't (prohibitive) | DM passim |\n| na... na | neither... nor | DM passim |\n\n## D. Comparison\n\n| Term | Meaning | Sources |\n|------|---------|---------|\n| iva | like, as if (simile marker) | DM 9.9; LS passim |\n| yathā | as, just as | DM passim |\n| tathā | so, likewise | paired with yathā |\n| samam | equally, like | DM passim |\n\n## E. Temporal Adverbs\n\n| Term | Meaning | Sources |\n|------|---------|---------|\n| tataḥ | then, thereupon | DM most frequent connector |\n| tadā | then, at that time | DM passim |\n| yadā | when | DM passim |\n| idānīm | now | DM passim |\n| purā | formerly | DM 2.3 |\n| pūrvam | before | DM passim |\n| paścāt | afterward | DM passim |\n| sadā / nityam / sarvadā | always | DM passim; KKS passim; KS passim |\n| muhur muhur | again and again | DM passim |\n| punar | again | DM passim |\n| śīghram / drutam / āśu / tvaritam / laghu | quickly | DM 6.7, 6.22 |\n| sahasā | suddenly | DM passim |\n| cirāt / ciram | for a long time | DM passim |\n\n## F. Spatial Adverbs\n\n| Term | Meaning | Sources |\n|------|---------|---------|\n| atra | here | DM passim |\n| tatra | there | DM passim |\n| yatra | where | DM passim |\n| sarvatra | everywhere | DM passim |\n| samantāt | all around | DM passim |\n| upari | above | DM passim |\n| adhaḥ | below | DM passim |\n| agrataḥ | in front | DM 9.7 |\n| pṛṣṭhataḥ | behind | DM 9.7 |\n| dūrāt / dūrataḥ | from afar | DM passim |\n| antare | within, between | DM passim |\n\n## G. Interrogatives\n\n| Term | Meaning | Sources |\n|------|---------|---------|\n| kim | what? why? | DM 1.31; DM 6.11 |\n| katham | how? | DM 1.31 |\n| kutaḥ | whence? why? | DM 1.31 |\n| kaḥ / kā / kim | who? which? what? | DM passim |\n| kvacit | somewhere, sometimes | DM passim |\n\n## H. Quotation and Manner\n\n| Term | Meaning | Sources |\n|------|---------|---------|\n| iti | thus (closes quotation/speech) | DM throughout |\n| evam | thus, in this way | DM passim |\n| tathā | in that way | DM passim |\n| svayam | by oneself | DM 5.88 (svayameva) |\n| balāt | forcibly | DM 6.4, 6.9 |\n| saṃkhye | in battle (loc. of saṃkhyā) | DM passim |\n\n## I. Miscellaneous\n\n| Term | Meaning | Sources |\n|------|---------|---------|\n| aho | ah! (exclamation) | DM passim |\n| hanta | alas! come! | DM passim |\n| param | but, however; beyond | DM passim |\n| prabhṛti | from (starting from) | DM passim |\n| prāyaḥ | mostly | DM passim |\n| kimu / kiṃ punar | how much more / what then | DM passim |\n| vinā | without | DM passim |\n| saha | with, together | DM passim |\n", "cards": [{"t": "ca", "m": "and"}, {"t": "tu", "m": "but, however"}, {"t": "vā", "m": "or"}, {"t": "athavā", "m": "or else"}, {"t": "api", "m": "also, even"}, {"t": "atha", "m": "now, then (opening particle)"}, {"t": "tathā", "m": "so, likewise"}, {"t": "eva", "m": "indeed, only, precisely"}, {"t": "hi", "m": "indeed, for (causal)"}, {"t": "khalu", "m": "indeed, certainly"}, {"t": "nūnam", "m": "certainly, surely"}, {"t": "sma", "m": "(emphatic past particle)"}, {"t": "vai", "m": "truly, indeed"}, {"t": "na", "m": "not"}, {"t": "mā", "m": "don't (prohibitive)"}, {"t": "na... na", "m": "neither... nor"}, {"t": "iva", "m": "like, as if (simile marker)"}, {"t": "yathā", "m": "as, just as"}, {"t": "tathā", "m": "so, likewise"}, {"t": "samam", "m": "equally, like"}, {"t": "tataḥ", "m": efix | Meaning | Example | Source |\n|--------|---------|---------|--------|\n| pra- | forward, intensely, forth | prahāra (strike), praṇamya (prostrate), prabodhana (awakening) | DM 1.73, 3.24; VS passim |\n| vi- | apart, away, intensely | vicchinna (severed), vināśa (destruction), vimukta (freed) | DM 3.18; LS passim |\n| sam- | together, completely | saṃhāra (annihilation), saṃgrāma (battle), saṃpūjya (worshipping fully) | DM 3.26; LS passim |\n| upa- | near, toward, sub- | upāgamya (having approached), upāsana (worship) | DM passim; VS passim |\n| ā- | toward, until | āgata (arrived), ākarṇya (hearing), ākṛṣya (dragging) | DM 6.2, 6.4 |\n| ni- | down, into, completely | nipāta (downfall), nihata (slain), nilaya (abode) | DM passim; LS passim |\n| nis- / nir- | out, without, away | nirgata (gone out), nirghāta (thunder), nirañjana (unstained) | DM 9.26; LS 134 |\n| abhi- | toward, against, upon | abhyadhāvat (rushed toward), abhiṣeka (consecration) | DM 6.13; KS passim |\n| pari- | around, fully | parivṛta (surrounded), parikṣipta (encircled) | DM passim; LS passim |\n| anu- | after, along, according to | anugraha (grace), anucara (follower) | LS 272; DM passim |\n| ati- | beyond, exceedingly | ativīrya (of great valor), atimatta (extremely intoxicated) | DM 2.57; KS passim |\n| ud- / ut- | up, out | utthitā (risen), udgata (arisen), unmatta (mad) | DM passim; KS passim |\n| apa- | away, off | apavarga (liberation), apamṛtyu (untimely death) | DM 13.5, 12.19 |\n| dur- / duṣ- | bad, difficult | durgā (inaccessible), durlabha (hard to get), durjaya (hard to conquer) | DM 4.11; LS 188; KS passim |\n| su- | good, well, easy | sundara (beautiful), sulabha (easy to attain), sukha (happiness) | LS passim; KS passim |\n\n## B. Feminine Name-Forming Suffixes (common in sahasranāmas)\n\n| Suffix | Function | Examples | Sources |\n|--------|----------|----------|---------|\n| -ā | basic feminine | durgā, kālī, ambikā, śivā | all texts |\n| -inī | possessive feminine | yoginī, kāminī, vāsinī, dhāriṇī | LS/KKS/KS passim |\n| -ikā | diminutive/descriptive feminine | kālikā, caṇḍikā, nāyikā | DM passim; KS passim |\n| -iṇī | agent feminine | pāśinī, śūlinī, cakriṇī | KS passim |\n| -vatī | possessing (feminine) | kalavatī, bhagavatī, guṇavatī | KKS 6; DM passim; KS passim |\n| -mayī | made of, consisting of (f.) | cinmayī, sarvamayī, ānandamayī | LS 251; DM 11.23; KS passim |\n| -rūpiṇī | having the form of (f.) | caitanyarūpiṇī, kāmarūpiṇī | DM 5.14; KKS passim; KS passim |\n| -svarūpiṇī | whose essential nature is (f.) | mantrarūpiṇī, sarvasvarūpiṇī | KS passim; DM 11.6 |\n| -parāyaṇā | devoted to (f.) | kāmaparāyaṇā, dharmaparāyaṇā | KKS passim; KS passim |\n| -priyā | fond of (f.) | puṣpapriyā, madhupriyā | KKS passim; LS passim |\n| -sthā / -sthitā | situated in (f.) | bindumaṇḍalavāsinī, padmasthā | LS passim; KKS passim |\n| -dā / -dāyinī | giving (f.) | varadā, abhayapradā, siddhidāyinī | LS passim; KKS passim |\n\n## C. Key Kṛt Suffixes (participles/verbal adjectives)\n\n| Suffix | Function | Examples | Sources |\n|--------|----------|----------|---------|\n| -ta (pp.) | past passive participle | hata (slain), kṛta (done), stuta (praised) | all texts |\n| -tavat (past active pp.) | one who has done | kṛtavān, dṛṣṭavān | DM passim |\n| -māna (pres. middle pp.) | being done | stūyamāna (being praised) | DM 4.37 |\n| -at / -ant (pres. active pp.) | doing | gacchat, kurvat, jayat | DM passim |\n| -tṛ / -tr (agent) | doer | kartṛ, hartṛ, goptrī | LS 266; VS passim |\n| -tvā (absolutive) | having done | hatvā, dṛṣṭvā, śrutvā, gatvā | DM throughout |\n| -ya (absolutive with prefix) | having done (w/ prefix) | praṇamya, ākarṇya, samīkṣya | DM throughout |\n| -ana (action noun) | the act of | vandana, tarpaṇa, pūjana | KKS passim; VS passim |\n| -in (possessive) | having, possessing | tejasvín, tapasvin, yogin | VS passim; KS passim |\n\n## D. Key Taddhita Suffixes\n\n| Suffix | Function | Examples | Sources |\n|--------|----------|----------|---------|\n| -eya (patronymic) | son/descendant of | kauṇḍinya, kātyāyanī, kaunteya | KKS 985; DM 11.2 |\n| -ika (relating to) | belonging to, connected with | vaidika, tāntrika, sāttvikaḥ | LS passim |\n| -tva (abstract n.) | -ness, -ship | kavitva, devatva, mahattva | KKS 150+; VS passim |\n| -tā (abstract f.) | -ness | devatā, mahimatā | VS passim |\n", "cards": [{"t": "pra-", "m": "forward, intensely, forth"}, {"t": "vi-", "m": "apart, away, intensely"}, {"t": "sam-", "m": "together, completely"}, {"t": "upa-", "m": "near, toward, sub-"}, {"t": "ā-", "m": "toward, until"}, {"t": "ni-", "m": "down, into, completely"}, {"t": "nis- / nir-", "m": "out, without, away"}, {"t": "abhi-", "m": "toward, against, upon"}, {"t": "pari-", "m": "around, fully"}, {"t": "anu-", "m": "after, along, according to"}, {"t": "ati-", "m": "beyond, exceedingly"}, {"t": "ud- / ut-", "m": "up, out"}, {"t": "apa-", "m": "away, off"}, {"t": "dur- / duṣ-", "m": "bad, difficult"}, {"t": "su-", "m": "good, well, easy"}]}, {"id": "17-compounds", "title": "Compounds", "subtitle": "Key samasas broken down", "content": "# 17 — Key Compounds (Samāsas) Broken Down\n\nSource key: DM = Devī Māhātmyam, LS = Lalitā Sahasranāma, KKS = Kakārādi Kālī SN, KS = Kālī SN, VS = Viṣṇu SN\n\n---\n\n## A. Tatpuruṣa (Determinative) Compounds\n\n| Compound | Vigraha | Meaning | Sources |\n|----------|---------|---------|---------|\n| mahiṣāsura-mardanī | mahiṣāsuraṃ mardayati iti | crusher of the buffalo-demon | DM 3.44 |\n| durgārti-nāśinī | durgām ārtim nāśayati iti | destroyer of dire suffering | LS; DM 9.31 |\n| triśūla-dhāriṇī | triśūlaṃ dhārayati iti | wielder of the trident | DM passim |\n| siṃha-vāhinī | siṃho vāhanam yasyāḥ sā | she whose vehicle is the lion | DM 2.29 |\n| sarvadaitya-kulāntaka | sarveṣāṃ daityakulānāṃ antakaḥ | ender of all demon clans | DM 11.14 |\n| sarvadeva-śarīrajā | sarveṣāṃ devānāṃ śarīrebhyaḥ jātā | born from all gods' bodies | DM 2.10 |\n| keśa-ākarṣaṇa-vihvalā | keśānām āka n heads | KS passim |\n| prasphuritādhara | prasphuritaḥ adharaḥ yasya saḥ | he whose lip quivers | DM 6.21 |\n\n## D. Dvandva (Copulative) Compounds\n\n| Compound | Vigraha | Meaning | Sources |\n|----------|---------|---------|---------|\n| devāsura | devāḥ ca asurāḥ ca | gods and demons | DM 2.3 |\n| śumbha-niśumbha | śumbhaḥ ca niśumbhaḥ ca | Śumbha and Niśumbha | DM 5.4+ |\n| caṇḍa-muṇḍa | caṇḍaḥ ca muṇḍaḥ ca | Caṇḍa and Muṇḍa | DM 7.1 |\n| madhu-kaiṭabha | madhuḥ ca kaiṭabhaḥ ca | Madhu and Kaiṭabha | DM 1.72 |\n| bhoga-svarga-apavarga | bhogaḥ ca svargaḥ ca apavargaḥ ca | enjoyment, heaven, and liberation | DM 13.5 |\n| icchā-jñāna-kriyā-śakti | icchā ca jñānaṃ ca kriyā ca | will, knowledge, and action powers | LS passim |\n\n## E. Avyayībhāva (Adverbial) Compounds\n\n| Compound | Meaning | Sources |\n|----------|---------|---------|\n| khaṇḍaśaḥ | into pieces | DM passim |\n| śataśaḥ | by hundreds | DM 9.27 |\n| sahasraśaḥ | by thousands | DM 8.45, 9.27 |\n| yathāvidhi | according to rule | DM passim |\n| samantataḥ | all around | DM passim |\n\n## F. Vocative Compounds (Sambodhana in Stutis)\n\n| Compound | Meaning | Sources |\n|----------|---------|---------|\n| sarvamaṅgalamāṅgalye | O auspicious of all auspicious things | DM 11.10 |\n| śive sarvārthasādhike | O auspicious one, accomplisher of all goals | DM 11.10 |\n| śaraṇye tryambake gauri | O refuge, three-eyed Gaurī | DM 11.10 |\n| nārāyaṇi namo'stu te | O Nārāyaṇī, salutations to you | DM 11.12+ (refrain) |\n", "cards": [{"t": "mahiṣāsura-mardanī", "m": "mahiṣāsuraṃ mardayati iti"}, {"t": "durgārti-nāśinī", "m": "durgām ārtim nāśayati iti"}, {"t": "triśūla-dhāriṇī", "m": "triśūlaṃ dhārayati iti"}, {"t": "siṃha-vāhinī", "m": "siṃho vāhanam yasyāḥ sā"}, {"t": "sarvadaitya-kulāntaka", "m": "sarveṣāṃ daityakulānāṃ antakaḥ"}, {"t": "sarvadeva-śarīrajā", "m": "sarveṣāṃ devānāṃ śarīrebhyaḥ jātā"}, {"t": "keśa-ākarṣaṇa-vihvalā", "m": "keśānām ākarṣaṇena vihvalā"}, {"t": "kapāla-mālyam", "m": "kapālānāṃ māly  namo'stu te", "m": "O Nārāyaṇī, salutations to you"}]}, {"id": "18-formulae", "title": "Formulae", "subtitle": "Recurring phrases, refrains", "content": "# 18 — Recurring Phrases, Refrains, and Colophons\n\nThese fixed expressions appear dozens or hundreds of times across the texts. Recognize them instantly.\n\nSource key: DM = Devī Māhātmyam, LS = Lalitā Sahasranāma, KKS = Kakārādi Kālī SN, KS = Kālī SN, VS = Viṣṇu SN\n\n---\n\n## A. DM Narrative Markers\n\n| Phrase | Meaning | Frequency |\n|--------|---------|-----------|\n| ṛṣir uvāca | the sage said | every chapter (narrator switch) |\n| rājovāca | the king said | DM 1.3, 9.1, 13.1 |\n| devyuvāca | the Goddess said | DM 5.116, 6.10, 12.1 |\n| devā ūcuḥ | the gods said | DM 4.1, 5.9 |\n| mārkaṇḍeya uvāca | Mārkaṇḍeya said | DM 13.6, 13.26 |\n\n## B. DM Transitional Phrases\n\n| Phrase | Meaning | Usage |\n|--------|---------|-------|\n| tataḥ | then, thereupon | most common connector (~100 times) |\n| ity uktvā | having said thus | speech→action transition |\n| iti śrutvā | having heard thus | hearing→response |\n| evaṃ stutvā | having praised thus | stuti→result |\n| tān/tāṃ dṛṣṭvā | having seen them/her | vision→action |\n| tato devī | then the Goddess | action pivot |\n\n## C. DM Emotional State Phrases\n\n| Phrase | Meaning | Sources |\n|--------|---------|---------|\n| kopāviṣṭā | seized by anger | DM 3.26 |\n| saṃkruddha | thoroughly enraged | DM 9.17 |\n| kopādhmatā | swollen with rage | DM 8.4 |\n| prasphuritādhara | with quivering lip | DM 6.21 |\n| amarṣapūritaḥ | filled with indignation | DM 6.2 |\n\n## D. DM Ch.5 — Yā Devī Refrain\n\n| Phrase | Meaning |\n|--------|---------|\n| yā devī sarvabhūteṣu X-rūpeṇa saṃsthitā | She who in all beings is established as X |\n| namaḥ tasyai namaḥ tasyai namaḥ tasyai namo namaḥ | Salutation to her, to her, to her — salutations! |\n\nX rotates through: viṣṇumāyā, cetanā, buddhi, nidrā, kṣudhā, chāyā, śakti, tṛṣṇā, kṣānti, jāti, lajjā, śānti, śraddhā, kānti, lakṣmī, vṛtti, smṛti, dayā, tuṣṭi, mātṛ, bhrānti (DM 5.14-78)\n\n## E. DM Ch.11 — Nārāyaṇī Stuti Refrain\n\n| Phrase | Meaning |\n|--------|---------|\n| nārāyaṇi namo'stu te | O Nārāyaṇī, salutations to you |\n\nAppears after nearly every verse in Ch.11 as a recurring refrain.\n\n## F. DM Ch.11 — Key Verse (11.10)\n\n| Pāda | Text | Meaning |\n|------|------|---------|\n| a | sarvamaṅgalamāṅgalye | O auspicious of all auspicious things |\n| b | śive sarvārthasādhike | O Śivā, accomplisher of all goals |\n| c | śaraṇye tryambake gauri | O refuge, three-eyed Gaurī |\n| d | nārāyaṇi namo'stu te | O Nārāyaṇī, salutations to you |\n\n## G. DM Colophon Formula\n\n| Phrase | Meaning |\n|--------|---------|\n| iti śrīmārkaṇḍeyapurāṇe sāvarṇike manvantare devīmāhātmye | Thus in the Śrī Mārkaṇḍeya Purāṇa, in the Sāvarṇika Manvantara, in the Devī Māhātmya |\n| X-vadho nāma Y-o'dhyāyaḥ | named \"the slaying of X\", the Y-th chapter |\n\n## H. Sahasranāma Opening/Closing Formulae\n\n### Namāvalī Format\n| Phrase | Meaning | Text |\n|--------|---------|------|\n| oṃ X-āya/ai namaḥ | Oṃ, salutation to X | VS/LS/KKS/KS throughout |\n| oṃ X-āya namaḥ | (masculine dative) | VS throughout |\n| oṃ X-yai namaḥ | (feminine dative) | LS/KKS/KS throughout |\n\n### VS Opening\n| Phrase | Meaning |\n|--------|---------|\n| śrī bhagavān uvāca | the blessed Lord said |\n| yaḥ sarvatrānavadyātmā | he who is the blameless self everywhere |\n\n### LS Opening (Pūrvabhāga)\n| Phrase | Meaning |\n|--------|---------|\n| hayagrīva uvāca | Hayagrīva said |\n| agastyāya varaṃ dattvā | having given a boon to Agastya |\n\n## I. Universal Sacred Phrases\n\n| Phrase | Meaning | Sources |\n|--------|---------|---------|\n| oṃ namaḥ śivāya | Oṃ, salutation to Śiva | KS/KKS contexts |\n| oṃ namo nārāyaṇāya | Oṃ, salutation to Nārāyaṇa | VS context |\n| oṃ aiṃ hrīṃ klīṃ | Bāla mantra seed | LS/KKS contexts |\n| jayatu jayatu devī | victory, victory to the Goddess | DM passim |\n| svasti | well-being, auspiciousness   } else {
    selectVocab(0);
  }
}

function buildSidebar() {
  const list = document.getElementById('stageList');
  let html = '';

  if (currentSection === 'lessons') {
    let phaseIdx = 0;
    STAGES.forEach((stage, i) => {
      while (phaseIdx < PHASES.length && stage.number > PHASES[phaseIdx].after) {
        if (stage.number > 0) html += '<div class="phase-label">' + PHASES[phaseIdx].label + '</div>';
        phaseIdx++;
      }
      const num = stage.number === 0 ? '' : String(stage.number).padStart(2, '0');
      html += '<div class="stage-item" data-idx="' + i + '" data-section="lessons" onclick="selectStage(' + i + ')">';
      html += '<span class="stage-num">' + num + '</span>';
      html += '<div class="stage-info"><div class="stage-title">' + stage.title + '</div>';
      html += '<div class="stage-subtitle">' + stage.subtitle + '</div></div></div>';
    });
  } else {
    html += '<div class="phase-label">Vocabulary Bank</div>';
    VOCAB.forEach((v, i) => {
      const num = v.id.split('-')[0];
      const cardCount = v.cards.length;
      const sub = v.subtitle + (cardCount > 0 ? ' &middot; ' + cardCount + ' cards' : '');
      html += '<div class="stage-item" data-idx="' + i + '" data-section="vocab" onclick="selectVocab(' + i + ')">';
      html += '<span class="stage-num">' + num + '</span>';
      html += '<div class="stage-info"><div class="stage-title">' + v.title + '</div>';
      html += '<div class="stage-subtitle">' + sub + '</div></div></div>';
    });
  }

  list.innerHTML = html;
}

function selectStage(idx) {
  currentStage = idx;
  currentVocab = null;
  const stage = STAGES[idx];

  document.querySelectorAll('.stage-item').forEach(el => el.classList.remove('active'));
  const item = document.querySelector('.stage-item[data-idx="' + idx + '"][data-section="lessons"]');
  if (item) item.classList.add('active');

  const tabBar = document.getElementById('tabBar');
  if (stage.number === 0) {
    tabBar.innerHTML = '<div class="tab active">Overview</div>';
    renderContent(stage.files.overview);
    currentTab = 'overview';
  } else {
    let tabHtml = '';
    stage.tabs.forEach((t, ti) => {
      const cls = ti === 0 ? 'active' : '';
      const label = FILE_LABELS[t] || t;
      tabHtml += '<div class="tab ' + cls + '" data-tab="' + t + '" onclick="selectTab(&quot;' + t + '&quot;)">' + label + '</div>';
    });
    tabBar.innerHTML = tabHtml;
    currentTab = stage.tabs[0];
    renderContent(stage.files[currentTab]);
  }

  closeMobileSidebar();
}

function selectVocab(idx) {
  currentVocab = idx;
  currentStage = null;
  const v = VOCAB[idx];

  document.querySelectorAll('.stage-item').forEach(el => el.classList.remove('active'));
  const item = document.querySelector('.stage-item[data-idx="' + idx + '"][data-section="vocab"]');
  if (item) item.classList.add('active');

  const tabBar = document.getElementById('tabBar');
  let tabHtml = '<div class="tab active" data-tab="browse" onclick="selectVocabTab(&quot;browse&quot;)">Browse</div>';
  if (v.cards.length > 0) {
    tabHtml += '<div class="tab" data-tab="flashcard" onclick="selectVocabTab(&quot;flashcard&quot;)">Flashcards</div>';
  }
  tabBar.innerHTML = tabHtml;
  currentTab = 'browse';
  renderContent(v.content);
  closeMobileSidebar();
}

function selectVocabTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
  const tabEl = document.querySelector('.tab[data-tab="' + tab + '"]');
  if (tabEl) tabEl.classList.add('active');

  if (tab === 'browse') {
    renderContent(VOCAB[currentVocab].content);
  } else {
    startFlashcards(VOCAB[currentVocab].cards);
  }
}

function selectTab(tab) {
  if (currentStage === null) return;
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
  const tabEl = document.querySelector('.tab[data-tab="' + tab + '"]');
  if (tabEl) tabEl.classList.add('active');
  renderContent(STAGES[currentStage].files[tab]);
}

function renderContent(md) {
  const el = document.getElementById('content');
  let html = marked.parse(md);
  // Wrap tables for horizontal scroll
  html = html.replace(/<table>/g, '<div class="table-wrap"><table>').replace(/<\/table>/g, '<\/table><\/div>');
  // Add bottom nav for lessons
  if (currentSection === 'lessons' && currentStage !== null) {
    html += buildBottomNav();
  }
  el.innerHTML = html;
  document.getElementById('contentWrap').scrollTop = 0;
  updateProgress();
}

function buildBottomNav() {
  const stage = STAGES[currentStage];
  const tabs = stage.tabs || [];
  const tabIdx = tabs.indexOf(currentTab);
  let h = '<div class="bottom-nav">';

  // Prev: previous tab, or previous stage last tab
  if (tabIdx > 0) {
    const prevTab = tabs[tabIdx - 1];
    h += '<div class="nav-btn" onclick="selectTab(&quot;' + prevTab + '&quot;)"><span class="nav-label">Previous</span><span class="nav-title">' + (FILE_LABELS[prevTab] || prevTab) + '</span></div>';
  } else if (currentStage > 0) {
    const prevStage = STAGES[currentStage - 1];
    h += '<div class="nav-btn" onclick="selectStage(' + (currentStage - 1) + ')"><span class="nav-label">Previous Stage</span><span class="nav-title">' + prevStage.title + '</span></div>';
  } else {
    h += '<div class="nav-btn disabled"></div>';
  }

  // Next: next tab, or next stage first tab
  if (tabIdx < tabs.length - 1) {
    const nextTab = tabs[tabIdx + 1];
    h += '<div class="nav-btn" onclick="selectTab(&quot;' + nextTab + '&quot;)"><span class="nav-label">Next</span><span class="nav-title">' + (FILE_LABELS[nextTab] || nextTab) + '</span></div>';
  } else if (currentStage < STAGES.length - 1) {
    const nextStage = STAGES[currentStage + 1];
    h += '<div class="nav-btn" onclick="selectStage(' + (currentStage + 1) + ')"><span class="nav-label">Next Stage</span><span class="nav-title">' + nextStage.title + '</span></div>';
  } else {
    h += '<div class="nav-btn disabled"></div>';
  }

  h += '</div>';
  return h;
}

function updateProgress() {
  const fill = document.getElementById('progressFill');
  if (currentSection === 'lessons' && currentStage !== null) {
    const stage = STAGES[currentStage];
    const tabs = stage.tabs || [];
    const tabIdx = Math.max(0, tabs.indexOf(currentTab));
    // Progress = stage position + tab fraction within stage
    const stageProgress = (currentStage / STAGES.length);
    const tabProgress = tabs.length > 1 ? (tabIdx / (tabs.length - 1)) / STAGES.length : 0;
    fill.style.width = Math.round((stageProgress + tabProgress) * 100) + '%';
  } else if (currentSection === 'vocab' && currentVocab !== null) {
    fill.style.width = Math.round(((currentVocab + 1) / VOCAB.length) * 100) + '%';
  }
}

// ── Flashcards ──

let fcBatchSize = 20;
let fcMissed = [];

function startFlashcards(cards, batchSize) {
  batchSize = batchSize || fcBatchSize;
  const deck = shuffle([...cards]);
  fcCards = deck.slice(0, Math.min(batchSize, deck.length));
  fcBatchSize = batchSize;
  fcIdx = 0;
  fcRevealed = false;
  fcGood = 0;
  fcAgain = 0;
  fcMissed = [];
  renderFlashcard();
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function renderFlashcard() {
  const el = document.getElementById('content');
  const total = VOCAB[currentVocab].cards.length;

  if (fcIdx >= fcCards.length) {
    let h = '<div class="fc-done"><h2>Round Complete</h2>';
    h += '<p>' + fcGood + ' known &middot; ' + fcAgain + ' to review &middot; ' + fcCards.length + ' cards</p>';
    if (fcMissed.length > 0) {
      h += '<button class="fc-restart" onclick="startFlashcards(fcMissed, fcMissed.length)" style="margin-right:12px">Drill Missed (' + fcMissed.length + ')</button>';
    }
    h += '<button class="fc-restart" onclick="startFlashcards(VOCAB[currentVocab].cards, fcBatchSize)">New Round</button>';
    if (total > 20) {
      h += '<div style="margin-top:20px">';
      [10, 20, 50, total].forEach(n => {
        const label = n === total ? 'All ' + total : n;
        const act = n === fcBatchSize ? 'color:var(--accent);border-color:var(--accent)' : '';
        h += '<button class="nav-btn" style="margin:4px;' + act + '" onclick="startFlashcards(VOCAB[currentVocab].cards,' + n + ')">' + label + '</button>';
      });
      h += '</div>';
    }
    h += '</div>';
    el.innerHTML = h;
    document.getElementById('contentWrap').scrollTop = 0;
    return;
  }

  const card = fcCards[fcIdx];
  const pct = Math.round((fcIdx / fcCards.length) * 100);

  let h = '<div class="flashcard-container">';
  h += '<div class="fc-progress">' + (fcIdx + 1) + ' / ' + fcCards.length;
  if (total > fcCards.length) h += ' (of ' + total + ')';
  h += '</div>';
  h += '<div class="fc-bar"><div class="fc-bar-fill" style="width:' + pct + '%"></div></div>';
  h += '<div class="fc-card" onclick="revealCard()">';
  h += '<div class="fc-term">' + escHtml(card.t) + '</div>';

  if (fcRevealed) {
    h += '<div class="fc-meaning">' + escHtml(card.m) + '</div>';
  } else {
    h += '<div class="fc-hint">space to reveal &middot; then &#8592; again / &#8594; good</div>';
  }

  h += '</div>';

  if (fcRevealed) {
    h += '<div class="fc-buttons">';
    h += '<button class="fc-btn again" onclick="fcAnswer(false)">&#8592; Again</button>';
    h += '<button class="fc-btn good" onclick="fcAnswer(true)">Good &#8594;</button>';
    h += '</div>';
  }

  h += '<div class="fc-score"><span class="g">good: ' + fcGood + '</span><span class="r">again: ' + fcAgain + '</span></div>';
  h += '</div>';

  el.innerHTML = h;
  document.getElementById('contentWrap').scrollTop = 0;
}

function revealCard() {
  if (!fcRevealed) {
    fcRevealed = true;
    renderFlashcard();
  }
}

function fcAnswer(good) {
  if (good) {
    fcGood++;
  } else {
    fcAgain++;
    fcMissed.push(fcCards[fcIdx]);
    // Re-queue missed card ~5 cards later
    const reinsert = Math.min(fcIdx + 3 + Math.floor(Math.random() * 4), fcCards.length);
    fcCards.splice(reinsert, 0, fcCards[fcIdx]);
  }
  fcIdx++;
  fcRevealed = false;
  renderFlashcard();
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── Utilities ──

function filterItems(query) {
  const q = query.toLowerCase();
  document.querySelectorAll('.stage-item').forEach(el => {
    const idx = parseInt(el.dataset.idx);
    let text = '';
    if (currentSection === 'lessons') {
      const s = STAGES[idx];
      text = (s.title + ' ' + s.subtitle + ' ' + s.id).toLowerCase();
    } else {
      const v = VOCAB[idx];
      if (v) text = (v.title + ' ' + v.subtitle + ' ' + v.id).toLowerCase();
    }
    el.classList.toggle('hidden', q.length > 0 && !text.includes(q));
  });
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('show');
}

function closeMobileSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('show');
}

// Keyboard
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;

  // Flashcard keys
  if (currentTab === 'flashcard' && currentVocab !== null) {
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); revealCard(); }
    else if (fcRevealed && (e.key === '1' || e.key === 'a' || e.key === 'ArrowLeft')) { e.preventDefault(); fcAnswer(false); }
    else if (fcRevealed && (e.key === '2' || e.key === 'g' || e.key === 'ArrowRight')) { e.preventDefault(); fcAnswer(true); }
    return;
  }

  // Tab shortcuts: 1-4 for lesson tabs
  if (currentSection === 'lessons' && currentStage !== null && currentStage > 0) {
    const stage = STAGES[currentStage];
    const tabNum = parseInt(e.key);
    if (tabNum >= 1 && tabNum <= 4 && stage.tabs[tabNum - 1]) {
      selectTab(stage.tabs[tabNum - 1]);
      return;
    }
  }

  if (currentSection === 'lessons') {
    if (e.key === 'ArrowDown' && currentStage < STAGES.length - 1) {
      selectStage(currentStage + 1);
      document.querySelector('.stage-item.active')?.scrollIntoView({ block: 'nearest' });
    } else if (e.key === 'ArrowUp' && currentStage > 0) {
      selectStage(currentStage - 1);
      document.querySelector('.stage-item.active')?.scrollIntoView({ block: 'nearest' });
    }
  } else {
    if (e.key === 'ArrowDown' && currentVocab < VOCAB.length - 1) {
      selectVocab(currentVocab + 1);
      document.querySelector('.stage-item.active')?.scrollIntoView({ block: 'nearest' });
    } else if (e.key === 'ArrowUp' && currentVocab > 0) {
      selectVocab(currentVocab - 1);
      document.querySelector('.stage-item.active')?.scrollIntoView({ block: 'nearest' });
    }
  }

  if (e.key === '/' && !e.metaKey) {
    e.preventDefault();
    document.getElementById('search').focus();
  }
});

// Init
buildSidebar();
selectStage(0);
</script>
