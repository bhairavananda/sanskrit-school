 Utsāha (heroism) | Heroic, brave | Orange |\n| Bhayānaka | Bhaya (fear) | Terrifying | Black |\n| Bībhatsa | Jugupsā (disgust) | Revolting | Blue |\n| Adbhuta | Vismaya (wonder) | Wondrous, magical | Yellow |\n| Śānta | Śama (peace) | Serene, transcendent | White/clear |\n\n## Rasa in Devotional Context\n\nDifferent rasas reveal different facets of the same deity:\n\n### Śiva in Five Rasas\n\n**Śānta (Peace):**\n> dhyāna-sthitaḥ śāntaḥ sadāśivaḥ / nirañjanaḥ nirguṇaḥ nirvikāraḥ\n> (Meditative, peaceful, eternal Śiva — stainless, beyond qualities, unchanging)\n\n**Vīra (Heroic):**\n> tripurāntakaḥ saṃhāra-mūrtiḥ / triśūla-dhārī raudra-naṭarājaḥ\n> (Destroyer of Tripura, embodiment of dissolution, trident-wielding, fierce cosmic dancer)\n\n**Adbhuta (Wonder):**\n> aho! ardhanaṭeśvaraḥ! ardhaṃ strī ardhaṃ puruṣaḥ! / ko'yaṃ māhātmyam!\n> (Oh! The half-woman lord! Half female, half male! What is this greatness!)\n\n**Karuṇa (Compassion):**\n> kṛpāluḥ śivaḥ duḥkhitānāṃ śaraṇam / dīnānāṃ bandhuḥ, ārtānām trātā\n> (Compassionate Śiva, refuge of the suffering, friend of the wretched, rescuer of the distressed)\n\n**Śṛṅgāra (Beauty):**\n> candraśekharaḥ sumukhāḥ / pārvatyā saha kailāse ramate\n> (Moon-crested, beautiful-faced, he sports with Pārvatī on Kailāsa)\n\n## Rasa Control Techniques\n\n### Vocabulary Selection\n| Rasa | Choose words like... |\n|------|---------------------|\n| Śānta | śānta, nirañjana, akhaṇḍa, nitya, sthira |\n| Vīra | jayati, vijaya, parākrama, śūra, bala |\n| Karuṇa | kṛpā, dayā, dīna, ārt, trāhi, duḥkha |\n| Adbhuta | aho!, adbhuta, āścarya, citraṃ, apūrva |\n| Raudra | krodha, ugra, pralaya, dahana, garjana |\n\n### Meter Selection\nŚānta → slow meters (Mandākrāntā). Vīra → powerful meters (Śārdūlavikrīḍita). Karuṇa → flowing meters (Vasantatilakā).\n\n### Sentence Structure\nŚānta → simple declaratives. Vīra → exclamatory, active verbs. Karuṇa → pleas, conditionals. Adbhuta → questions, exclamations.\n\n## The Game: \"Change the Darśana\"\n\nGiven one deity, rapidly switch between rasas — same deity, different emotional lens. The words, meter, alaṅkāras, and sentence structures all change.\n\n## Milestone Check\nCan you compose 4 short passages about one deity, each in a consciously different rasa, and explain what makes each passage that rasa?\n", "reference": "# Stage 21: Rasa — Reference Guide\n\n## Navarasa Vocabulary Banks\n\n### Śānta\nśānta, nitya, akhaṇḍa, nirañjana, nirguṇa, nirvikāra, sthira, dhīra, yoga, dhyāna, samādhi, ātman, brahman, mokṣa, turīya, kaivalya, avyaya, acintyam\n\n### Vīra\nvijaya, jayati, jitam, parākrama, śūra, bala, vīrya, siṃha, garjana, praharaṇa, khaḍga, cāpa, śara, yuddha, saṃgrāma, raṇa, krodha, abhaya\n\n### Karuṇa\nkṛpā, dayā, karuṇā, dīna, ārt, duḥkhita, hā!, trāhi, pāhi, śaraṇa, bandhu, mātar, netra-jala (tears), rudan, vilāpa, snigdha\n\n### Adbhuta\naho!, āścaryam, citraṃ, adbhutam, apūrvam, ko'yam, kīdṛśam, māhātmya, prabhāva, vismaya, akathya, anirvacana, līlā, māyā\n\n### Raudra\nugra, krodha, pralaya, saṃhāra, dahana, jvālā, bhīma, bhayaṅkara, rākṣasa, asura, garjana, huṅkāra, tāṇḍava, kāla\n\n### Śṛṅgāra\nsundara, rūpa, lāvaṇya, kānti, kāma, priya, vallabha, līlā, vilāsa, smita, hāsa, manda, kusuma, candana, mālya\n\n### Bhayānaka\nbhaya, trāsa, kamp, vepathu, palāyana, ghora, karāla, timira, pretāḥ, piśāca, mṛtyu, yama\n\n## Rasa-Meter Pairings\n\n| Rasa | Best Meters | Reason |\n|------|------------|--------|\n| Śānta | Mandākrāntā, Mālinī | Slow, meditative |\n| Vīra | Śārdūlavikrīḍita, Indravajrā | Powerful, stately |\n| Karuṇa | Vasantatilakā, Mandākrāntā | Flowing, emotional |\n| Adbhuta | Sragdharā, Śārdūlavikrīḍita | Grand, expansive |\n| Śṛṅgāra | Vasantatilakā, Mālinī | Beautiful, ornate |\n| Raudra | Śārdūlavikrīḍita | Forceful |\n\n## Rasa Indicators in Composition\n\n| Element | Śānta | Vīra | Karuṇa |\n|---------|-------|------|--------|\n| Verb mood | Declarative | Imperative | Optative/plea |\n| Sentence length | Long, flowing | Short, punchy | Medium, broken |\n| Alaṅkāra | Upamā (serene) | Atiśayokti | Virodha, utprekṣā |\n| Deity aspect | Meditating | Fighting | Rescuing |\n| Reader response | Calm | Inspired | Moved |\n", "workbook-questions": "# Stage 21: Rasa — Workbook (Questions)\n\n## Section A: Identification (10 marks)\nIdentify the dominant rasa in each passage:\n1. dhyāna-sthitaḥ nirañjanaḥ nirguṇaḥ sadāśivaḥ → ___\n2. aho! ko'yaṃ māhātmyam! naṭarājaḥ nṛtyati! → ___\n3. he mātar! dīno'smi, trāhi mām duḥkhāt → ___\n4. jayati jayati vīraḥ tripurāntakaḥ! → ___\n5. sundaraṃ śivaṃ pārvatyā saha kailāse ramate → ___\n\n## Section B: Rasa Composition (30 marks)\nChoose one deity. Compose a 3-line passage in each rasa:\n**B1.** Śānta (6 marks): ___\n**B2.** Vīra (6 marks): ___\n**B3.** Karuṇa (6 marks): ___\n**B4.** Adbhuta (6 marks): ___\n**B5.** Śṛṅgāra (6 marks): ___\n\n## Section C: Analysis (10 marks)\n**C1.** Take any famous stotra you know. Identify its dominant rasa. What vocabulary, meter, and sentence patterns make it that rasa? (10 marks)\n\n## Section D: Controlled Shift (10 marks)\n**D1.** Take the sentence \"namāmi śivam\" and expand it into 4 different versions — one for each rasa (śānta, vīra, karuṇa, adbhuta). Each version should be 2-3 lines.\n\n---\n\n**Total: 60 marks**\n", "workbook-answers": "# Stage 21: Rasa — Workbook (Answers)\n\n## Section A\n1. **Śānta** (dhyāna, nirañjana, nirguṇa = peace vocabulary)\n2. **Adbhuta** (aho!, ko'yam = wonder exclamations)\n3. **Karuṇa** (dīna, trāhi, duḥkha = compassion/sorrow)\n4. **Vīra** (jayati, vīra, tripurāntaka = heroic)\n5. **Śṛṅgāra** (sundara, ramate, kailāse = beauty/love)\n\n## Section B — Samples for Śiva\n**B1.** Śānta: nityo nirmalaḥ nirguṇaḥ sadāśivaḥ / akhaṇḍānanda-rūpaḥ svayam-prakāśaḥ / tasmin dhyāna-sthite sarvaṃ śāntam\n**B2.** Vīra: jayati tripurāntakaḥ! jayati saṃhāra-mūrtiḥ! / triśūla-hasta ugra-rūpaḥ śivaḥ asurān nihanti!\n**B3.** Karuṇa: he kṛpālo! he dayānidhe! / dīno'smi, ārtaḥ asmi, trāhi mām / tava kṛpā vinā ko me śaraṇam?\n**B4.** Adbhuta: aho! kīdṛśaṃ rūpam! ardhaṃ strī ardhaṃ puruṣaḥ! / viṣaṃ pītvā nīlakaṇṭhaḥ — ko'yaṃ prabhāvaḥ!\n**B5.** Śṛṅgāra: candra-mukhāḥ smita-sundaraḥ / pārvatyā saha mandāra-vane viharati / manda-vātena jaṭā calanti\n\n## Section C\nAccept any well-reasoned analysis. Example: Rudram (Śrī Rudram) — dominant rasa is **Adbhuta** mixed with **Bhayānaka** and **Śānta**. Vocabulary includes ugra, bhīma, ghora (fearful) but also śiva, śānta, mayaskara (benevolent). The Vedic triṣṭubh meter provides power. Paradoxical descriptions (terrible yet benign) create sustained wonder.\n\n## Section D — Samples\n**Śānta:** namāmi śivaṃ nityaṃ nirañjanam / dhyāna-sthitam ākāśa-sadṛśam / sarvam asya praśāntam\n**Vīra:** namāmi śivaṃ saṃhāra-mūrtim / yasya triśūla-prasāreṇa asuratrayam naṣṭam / jayati mahāvīraḥ!\n**Karuṇa:** namāmi śivaṃ karuṇā-sindhum / he dīna-bandho! mama duḥkhaṃ paśya / tava caraṇe patito'smi\n**Adbhuta:** namāmi śivam — aho adbhutam! / yaḥ viṣam pītvā amṛtaṃ dadāti / yasya ardhāṅge devī vasati — kiṃ citraṃ!\n\n---\n\n**Total: 60 marks**\n"}, "tabs": ["theory", "reference", "workbook-questions", "workbook-answers"]}, {"id": "22-darshana", "number": 22, "title": "Darshana", "subtitle": "Philosophical Expression", "files": {"theory": "# Stage 22: Darśana — Philosophical Expression\n\n## Goal\nDescribe the deity as consciousness, time, śakti, and other philosophical tattvas. Make philosophy become poetry.\n\n## Core Philosophical Concepts for Poetic Use\n\n### Brahman / Ātman\n> tvam eva sarvam — you alone are everything\n> sacchidānanda-rūpa — whose nature is being-consciousness-bliss\n> nityam, śuddham, buddham, muktam — eternal, pure, awake, free\n\n### Māyā / Prakṛti\n> māyādhīśa — lord of illusion\n> prakṛti-puruṣa — nature and consciousness\n> nāma-rūpa-vilāsa — the play of name and form\n\n### Kāla (Time)\n> kālātīta — beyond time\n> mahākāla — great time (Śiva as time itself)\n> kālasya kālaḥ — the time of time (death of death)\n\n### Śakti (Power)\n> cit-śakti — consciousness-power\n> icchā-jñāna-kriyā — will, knowledge, action (the three śaktis)\n> parā-śaktiḥ — supreme power\n\n### Pañca-kṛtya (Five Acts)\n> sṛṣṭi (creation), sthiti (maintenance), saṃhāra (dissolution), tirodhāna (concealment), anugraha (grace)\n\n## Philosophical Praise Patterns\n\n### Pattern 1: Neti-neti (not this, not this)\n> na strī na puruṣaḥ, na ca napuṃsakaḥ\n> na sthūlaḥ na sūkṣmaḥ, na dṛśyaḥ na śrāvyaḥ\n> sarvasya sākṣī, sarvasya adhiṣṭhānam\n\n### Pattern 2: Paradox as Praise\n> aṇoḥ aṇīyān mahato mahīyān (smaller than the small, greater than the great)\n> dūre ca antike ca (far and near)\n> sarva-gataḥ acalaḥ (all-pervading yet unmoving)\n\n### Pattern 3: Tattva Identification\n> tvaṃ ākāśaḥ, tvaṃ vāyuḥ, tvaṃ agniḥ, tvaṃ āpaḥ, tvaṃ pṛthivī\n> tvaṃ sarvam idam — you are all this\n\n### Pattern 4: Philosophical Epithets\n> caitanya-rūpa (consciousness-formed)\n> ānanda-ghana (mass of bliss)\n> jñāna-svarūpa (knowledge-natured)\n> sat-cit-ānanda (being-consciousness-bliss)\n> svayam-prakāśa (self-luminous)\n\n## The Game: \"Praise Through Tattva\"\n\nInstead of praising a deity's form (eyes, arms), praise through philosophical categories:\n\n> he śiva! tvaṃ caitanyam, tvaṃ ākāśaḥ\n> tvaṃ kālaḥ, tvaṃ kālātītaḥ\n> tvayi sṛṣṭiḥ, tvayi sthitiḥ, tvayi layaḥ\n> tvam advayam brahma, nānyat kiñcit\n\n## Key Philosophical Terms for Poetry\n\n| Sanskrit | Meaning |\n|----------|---------|\n| advaya / advaita | non-dual |\n| nirguṇa / saguṇa | without/with qualities |\n| nirmala | stainless |\n| nirañjana | untainted |\n| nirākāra / sākāra | formless / with form |\n| svayam-bhū | self-born |\n| svayam-prakāśa | self-luminous |\n| anādi | beginningless |\n| ananta | endless |\n| aprameya | immeasurable |\n\n## Milestone Check\nCan you praise your deity philosophically — describing them as consciousness, time, and śakti — making it sound like poetry, not a textbook?\n", "reference": "# Stage 22: Darśana — Reference Guide\n\n## Philosophical Vocabulary by Category\n\n### Being/Reality: sat, satya, tattva, vastu, svarūpa, bhūta, padārtha\n### Consciousness: cit, caitanya, bodha, prajñā, saṃvit, prakāśa\n### Bliss: ānanda, sukha, hlāda, tuṣṭi, muda\n### Non-duality: advaita, advaya, eka, kevala, kaivalya\n### Transcendence: nirguṇa, nirākāra, nirañjana, nirmala, nirvikāra, niṣkala\n### Immanence: saguṇa, sākāra, viśvarūpa, sarva-gata, antaryāmin\n### Time: kāla, mahākāla, nitya, sanātana, anādi, ananta, kṣaṇa\n### Power: śakti, parā, icchā, jñāna, kriyā, māyā, prakṛti, vibhūti\n### Cosmology: sṛṣṭi, sthiti, saṃhāra, tirodhāna, anugraha\n\n## Paradox Pairs for Poetic Use\n| Pair | Meaning |\n|------|---------|\n| aṇu / vibhu | atomic / all-pervading |\n| nirguṇa / saguṇa | qualityless / with qualities |\n| nirākāra / viśvarūpa | formless / universal form |\n| niṣkriya / sarvakartā | actionless / doer of all |\n| śūnya / pūrṇa | empty / full |\n| eka / aneka | one / many |\n| dūra / antika | far / near |\n| avyakta / vyakta | unmanifest / manifest |\n\n## Model Philosophical Verses\n### Dakṣiṇāmūrti Stotra (Ādi Śaṅkara):\n> viśvaṃ darpaṇa-dṛśyamāna-nagarī-tulyaṃ nijāntargatam\n> (The universe is like a city reflected in a mirror, contained within the self)\n\n### Śvetāśvatara Upaniṣad:\n> eko devaḥ sarvabhūteṣu gūḍhaḥ sarvavyāpī sarvabhūtāntarātmā\n> (One god hidden in all beings, all-pervading, inner self of all beings)\n\n## Template: Philosophical Stotra\n```\ntvaṃ [tattva-1], tvaṃ [tattva-2], tvaṃ [tattva-3]\ntvayi [cosmic act], tvayi [cosmic act]\ntvam [paradox-A] ca [paradox-B] ca\nnamo [philosophical epithet]\n```\n", "workbook-questions": "# Stage 22: Darśana — Workbook (Questions)\n\n## Section A: Vocabulary (10 marks)\nGive the Sanskrit for: 1. non-dual  2. self-luminous  3. being-consciousness-bliss  4. formless  5. beyond time\nGive the meaning of: 6. nirañjana  7. svayam-bhū  8. antaryāmin  9. aprameya  10. kaivalya\n\n## Section B: Philosophical Praise (25 marks)\n**B1.** Write a 4-line praise of your deity as consciousness (caitanya) (10 marks):\n**B2.** Write a 4-line praise using the paradox technique (aṇu yet vibhu, near yet far, etc.) (10 marks):\n**B3.** Write a \"tvaṃ... tvaṃ...\" passage identifying the deity with the five elements (5 marks):\n\n## Section C: Philosophy as Poetry (25 marks)\n**C1.** Compose a 6-line philosophical stotra that a reader would find *beautiful*, not merely correct. Use at least 2 alaṅkāras alongside the philosophical content (15 marks):\n**C2.** Take a philosophical concept (māyā, advaita, or pañca-kṛtya) and express it as a 4-line devotional verse (10 marks):\n\n---\n\n**Total: 60 marks**\n", "workbook-answers": "# Stage 22: Darśana — Workbook (Answers)\n\n## Section A\n1. **advaita/advaya** 2. **svayam-prakāśa** 3. **saccidānanda** 4. **nirākāra** 5. **kālātīta**\n6. untainted/spotless 7. self-born 8. inner controller/self 9. immeasurable 10. absolute aloneness/liberation\n\n## Section B\n**B1.** Sample: caitanya-rūpa! tvaṃ sarvasya sākṣī / na tvaṃ dṛśyaḥ, kintu draṣṭā tvam eva / tava prakāśena jagatī bhāti / namo namo jñāna-svarūpāya\n\n**B2.** Sample: aṇoḥ aṇīyān mahato mahīyān / dūre ca antike ca sadā vasasi / nirguṇaḥ saguṇaś ca tvam eva / nirākāraḥ viśvarūpaś ca tvam\n\n**B3.** Sample: tvaṃ pṛthivī, tvaṃ āpaḥ, tvaṃ tejaḥ / tvaṃ vāyuḥ, tvaṃ ākāśam / tvaṃ sarvam idam viśvam\n\n## Section C\n**C1.** Sample: viśvaṃ darpaṇe nagarī iva [upamā] tava antare bhāti / tvaṃ caitanya-sindhuḥ [rūpaka], jagat taraṅgāḥ tava / sṛṣṭiṃ karosi līlayā, saṃhāram api līlayā / nirguṇaḥ saguṇaś ca eka eva tvam / aho māyā-vilāsa! [adbhuta-rasa] / namo namo advaya-brahmaṇe tubhyam\n\n**C2.** Sample (Māyā): māyayā āvṛtaṃ jagat sarvaṃ / rajju-sarpa-nyāyena bhāti nānātvam / kintu eka-rūpaḥ tvam eva asti / māyāpatiṃ prapadye tam advayam\n\n---\n\n**Total: 60 marks**\n"}, "tabs": ["theory", "reference", "workbook-questions", "workbook-answers"]}, {"id": "23-samasyapurana", "number": 23, "title": "Samasyapurana", "subtitle": "Backwards Composition", "files": {"theory": "# Stage 23: Samasyāpūraṇa — Backwards Composition\n\n## Goal\nGiven a strange, out-of-context pāda (line), construct the remaining pādas so the whole verse makes sense. This is the foundational avadhāna skill — deriving context creatively from a constraint.\n\n## What is Samasyāpūraṇa?\n\n**Samasya** = problem/puzzle. **Pūraṇa** = completion. You receive one pāda (quarter-verse) — often one that seems bizarre or contradictory in isolation — and must compose the remaining three pādas to create a coherent, meaningful verse.\n\n## The Method\n\n### Step 1: Analyze the given pāda\n- What is the literal meaning?\n- What meter is it in? (count syllables, determine pattern)\n- What are the key words?\n\n### Step 2: Find a context that makes the pāda sensible\n- Is there a deity story where this makes sense?\n- Can the words be reinterpreted through sandhi-splitting differently?\n- Is there a philosophical reading?\n\n### Step 3: Compose the surrounding pādas\n- Match the meter\n- Build up to the given pāda naturally\n- The verse should feel inevitable — the given pāda should seem the perfect conclusion\n\n## Example\n\n**Given pāda (d):** viṣaṃ pītvā sukhī bhavat\n(\"He drank poison and became happy\" — seems absurd!)\n\n**Solution:** Create context where this makes sense → Śiva drinking hālāhala!\n\n> devāsura-samudra-manthane purā (a)\n> hālāhalaṃ viṣaṃ samutthitam (b)\n> jagad-rakṣārthaṃ maheśvaraḥ (c)\n> **viṣaṃ pītvā sukhī bhavat** (d)\n\nNow the meaning is clear: \"During the churning of the ocean, terrible poison arose. For the world's protection, Maheśvara drank the poison and was content.\"\n\n## Another Example\n\n**Given pāda:** agnau śītalatā katham\n(\"How can there be coolness in fire?\" — paradox!)\n\n**Solution:** Connect to Prahlāda story — Prahlāda survived the fire through Viṣṇu's grace.\n\n> viṣṇu-bhakta-prahlādasya\n> hiraṇyakaśipor bhayāt\n> agnimadhye sthitasyāpi\n> **agnau śītalatā katham?** → because of Viṣṇu's kṛpā!\n\n## Strategy Tips\n\n1. **Mythological context** — most \"impossible\" pādas become possible in the context of a deity's līlā\n2. **Sandhi re-analysis** — break sandhi differently to find new meanings\n3. **Metaphorical reading** — \"fire\" might mean \"anger,\" \"drinking poison\" might mean \"absorbing criticism\"\n4. **Double meaning (śleṣa)** — words with multiple meanings open new contexts\n\n## Practice Format\n\nYou will be given a pāda. Compose the remaining 3 pādas to make a complete anuṣṭubh śloka. Each pāda should be 8 syllables.\n\n## Milestone Check\nCan you complete a samasyāpūraṇa — given a strange pāda, construct a coherent verse around it — within 10 minutes?\n", "reference": "# Stage 23: Samasyāpūraṇa — Reference Guide\n\n## Problem-Solving Approaches\n\n| Approach | When to Use | Example |\n|----------|------------|---------|\n| Mythological | Pāda describes impossible physical feat | \"drank poison\" → Śiva/hālāhala |\n| Philosophical | Pāda contains paradox | \"formless yet formed\" → Brahman |\n| Śleṣa (double meaning) | Words have multiple meanings | \"go\" = cow/earth/speech |\n| Sandhi re-analysis | Break words differently | \"tapobhiḥ\" → tapaḥ + abhiḥ or tapo + bhiḥ |\n| Metaphorical | Literal reading absurd | \"fire\" = anger, \"ocean\" = saṃsāra |\n| Narrative twist | Set up a story context | Begin with \"once upon a time...\" |\n\n## Common Mythological Rescue Contexts\n\n| Strange Claim | Deity/Story Context |\n|--------------|-------------------|\n| Drank poison, was happy | Śiva + hālāhala |\n| Fire was cool | Prahlāda + Narasiṃha |\n| Ocean was crossed | Hanumān / Rāma's bridge |\n| Mountain was lifted | Kṛṣṇa + Govardhana |\n| Moon on the head | Śiva + Candraśekhara |\n| River on the hair | Śiva + Gaṅgā |\n| Ten heads destroyed | Rāma + Rāvaṇa |\n| Elephant face | Gaṇeśa |\n| Half woman, half man | Ardhanārīśvara |\n\n## Composition Checklist for Samasyāpūraṇa\n\n1. ☐ Given pāda: note exact syllable count and pattern\n2. ☐ Identify meter (usually anuṣṭubh)\n3. ☐ Find a context that naturalizes the given pāda\n4. ☐ Compose pāda a (set the scene)\n5. ☐ Compose pāda b (develop)\n6. ☐ Compose pāda c (transition to the given pāda)\n7. ☐ Given pāda falls naturally as conclusion\n8. ☐ Verify meter in all 4 pādas\n9. ☐ Check that the whole verse is coherent\n\n## Words with Multiple Meanings (Śleṣa Resources)\n\n| Word | Meaning 1 | Meaning 2 | Meaning 3 |\n|------|-----------|-----------|-----------|\n| go | cow | earth | speech |\n| hari | Viṣṇu | lion | monkey |\n| kāla | time | black | death |\n| dharā | earth | stream | — |\n| ambara | sky | cloth | — |\n| sara | lake | arrow | — |\n| padma | lotus | Lakṣmī | — |\n| arka | sun | flower (calotropis) | — |\n", "workbook-questions": "# Stage 23: Samasyāpūraṇa — Workbook (Questions)\n\n## Section A: Analysis (10 marks)\n**A1.** For each \"problem pāda,\" suggest a mythological context that makes it sensible (5 marks):\n1. viṣaṃ pītvā sukhī bhavat → context: ___\n2. vahnau śītalatā katham → context: ___\n3. daśa-śiraḥ apatan bhuvam → context: ___\n4. giriṃ karāṅgulyā dhṛtam → context: ___\n5. ardhaṃ strī ardhaṃ pum-vapuḥ → context: ___\n\n**A2.** Identify the meter (count syllables) for each given pāda (5 marks):\n1. viṣaṃ pītvā sukhī bhavat → ___ syllables, meter: ___\n2. bhajāmi tam anantam harim → ___ syllables, meter: ___\n\n## Section B: Completion (35 marks)\nComplete each samasyā by composing the remaining 3 pādas:\n\n**B1.** Given pāda (d): **viṣaṃ pītvā sukhī abhūt** (10 marks)\n- a: ___\n- b: ___\n- c: ___\n- d: viṣaṃ pītvā sukhī abhūt\n\n**B2.** Given pāda (d): **candraṃ śirasi dhārayat** (10 marks)\n- a: ___\n- b: ___\n- c: ___\n- d: candraṃ śirasi dhārayat\n\n**B3.** Given pāda (b): **karuṇā-sindhuḥ ucyate** — complete the śloka (15 marks)\n- a: ___\n- b: karuṇā-sindhuḥ ucyate\n- c: ___\n- d: ___\n\n## Section C: Free Composition (15 marks)\n**C1.** Invent your own samasyā pāda (a deliberately strange/paradoxical line), then solve it yourself. Show both the \"problem\" and the complete verse (15 marks).\n\n---\n\n**Total: 60 marks**\n", "workbook-answers": "# Stage 23: Samasyāpūraṇa — Workbook (Answers)\n\n## Section A\n**A1.**\n1. **Śiva drinking hālāhala** during samudra-manthana\n2. **Prahlāda in fire** — Viṣṇu's grace made fire cool\n3. **Rāvaṇa's ten heads** fell — Rāma's victory\n4. **Kṛṣṇa lifting Govardhana** mountain with a finger\n5. **Ardhanārīśvara** — Śiva's half-female, half-male form\n\n**A2.**\n1. vi-ṣaṃ-pī-tvā-su-khī-a-bhūt = **8 syllables → anuṣṭubh**\n2. bha-jā-mi-ta-ma-nan-ta-ma-ha-rim = **10 syllables** (likely not standard anuṣṭubh — recount or longer meter)\n\n## Section B\n**B1.** Sample:\n- a: devā-asura-nimagnānām (8)\n- b: samudra-manthane purā (8)\n- c: lokānām rakṣaṇārthāya (8)\n- d: **viṣaṃ pītvā sukhī abhūt** (8)\n\n**B2.** Sample:\n- a: gaṅgāṃ yasya jaṭāsu ca (8)\n- b: nayanatritayaṃ yasya (8)\n- c: sa śaṃbhuḥ parameśvaraḥ (8)\n- d: **candraṃ śirasi dhārayat** (8)\n\n**B3.** Sample:\n- a: yo dīnānāṃ dayānidhiḥ (8)\n- b: **karuṇā-sindhuḥ ucyate** (8)\n- c: sa śivaḥ duḥkha-nāśāya (8)\n- d: bhaktānām abhayaṃ dadat (8)\n\n## Section C\nAccept any well-crafted samasyā + solution. Example:\nProblem pāda: **mriyate ca sa jīvati** (\"he dies and he lives\")\nSolution: context = the yogī who dies to ego and lives in brahman\n- a: ahaṅkāraṃ parityajya\n- b: yogī brahmaṇi līyate\n- c: dehena vinā api ātmā\n- d: **mriyate ca sa jīvati**\n\n---\n\n**Total: 60 marks**\n"}, "tabs": ["theory", "reference", "workbook-questions", "workbook-answers"]}, {"id": "24-dattapadi", "number": 24, "title": "Dattapadi", "subtitle": "Forced Vocabulary", "files": {"theory": "# Stage 24: Dattapadī — Forced Vocabulary\n\n## Goal\nCompose a stotra that naturally integrates four supplied words — words that may seem completely unrelated to devotion. This tests lexical creativity and the ability to find connections.\n\n## What is Dattapadī?\n\n**Datta** = given. **Padī** = having words/feet. Four words are supplied (often from everyday or incongruous domains). You must compose a 4-line verse where each line contains one of the given words, and the whole verse forms a coherent devotional composition.\n\n## The Challenge\n\nGiven words might be: **megha** (cloud), **siṃha** (lion), **nauka** (boat), **dīpa** (lamp)\n\nThese seem unrelated to each other or to devotion. But:\n- megha → complexion of Viṣṇu is like a cloud\n- siṃha → Narasiṃha avatāra\n- nauka → the boat that crosses the ocean of saṃsāra\n- dīpa → lamp of knowledge\n\n## Techniques for Integration\n\n### 1. Upamā (Simile)\nUse the word in a comparison:\n> tava rūpaṃ **megha** iva nīlam (your form is dark like a cloud)\n\n### 2. Rūpaka (Metaphor)\nMake the word a metaphor:\n> saṃsāra-sāgare bhaktiḥ **nauka** iva (devotion is a boat in the ocean of saṃsāra)\n\n### 3. Direct Attribute\nConnect the word to a known deity attribute:\n> **siṃha**-rūpaḥ narasiṃhaḥ (lion-formed Narasiṃha)\n\n### 4. Philosophical Bridge\nAbstract the word:\n> **dīpa** iva jñānaṃ tamo nāśayati (like a lamp, knowledge destroys darkness)\n\n### 5. Narrative Context\nPlace it in a story:\n> **megha** garjati, indraḥ varṣati (the cloud thunders, Indra rains)\n\n## Example Solution\n\nGiven: **megha, siṃha, nauka, dīpa**\n\n> **megha**-śyāmaṃ nārāyaṇam āśraye\n> yaḥ **siṃha**-rūpo daityān nihanti sadā\n> saṃsāra-sāgare bhaktiḥ **nauka** mama\n> tava jñānaṃ **dīpa** iva tamo harati\n\nTranslation: \"I take refuge in the cloud-dark Nārāyaṇa / Who in lion-form always slays demons / Devotion is my boat in the ocean of saṃsāra / Your knowledge, like a lamp, removes darkness\"\n\n## Practice Method\n\n1. Receive 4 words\n2. For each word, brainstorm 3 possible connections to devotion\n3. Choose the smoothest connections\n4. Compose the verse, one line per word\n5. Verify coherence — does the verse tell one story?\n\n## Difficulty Levels\n\n| Level | Word Types |\n|-------|-----------|\n| Easy | puṣpa, jala, candana, mālā (already devotional) |\n| Medium | megha, sindhu, vṛkṣa, tārakā (nature — easy to symbolize) |\n| Hard | rathya (street), kūpa (well), mārjāra (cat), kaṭhinya (hardness) |\n\n## Milestone Check\nGiven 4 arbitrary words, can you compose a coherent devotional verse integrating all four naturally?\n", "reference": "# Stage 24: Dattapadī — Reference Guide\n\n## Integration Techniques Summary\n\n| Technique | How | Example |\n|-----------|-----|---------|\n| Upamā | \"like X\" | tava kṛpā megha iva varṣati |\n| Rūpaka | \"X IS Y\" | bhakti-nauka, jñāna-dīpa |\n| Direct attribute | deity has/is X | siṃha-rūpa narasiṃha |\n| Philosophical | X symbolizes Y | dīpa = jñāna, tamas = ajñāna |\n| Narrative | place in story | megha garjati → deity appears |\n| Negation | \"even X cannot...\" | sindhur api na tava mahimā |\n| Vocative | address deity as X | he jñāna-dīpa! |\n\n## Universal Connectors (How to link any word to devotion)\n\n| Seemingly unrelated word | Devotional connection via... |\n|--------------------------|------------------------------|\n| Any animal | vehicle (vāhana), form (avatāra), or simile |\n| Any natural object | simile for deity's quality |\n| Any tool/object | metaphor for spiritual aid |\n| Any place | where deity's līlā occurred |\n| Any abstract concept | philosophical attribute |\n| Any negative concept | what deity removes/conquers |\n\n## Quick Metaphor Bank\n\n| Word | As Devotional Metaphor |\n|------|----------------------|\n| megha | deity's complexion; grace that rains |\n| sindhu | saṃsāra-sāgara; karuṇā-sindhu |\n| nauka | bhakti as boat to cross saṃsāra |\n| dīpa | jñāna-dīpa illuminating darkness |\n| vṛkṣa | dharma-vṛkṣa giving shade |\n| tārakā | guru as guiding star |\n| pathika | jīva as traveler in saṃsāra |\n| auṣadha | nāma as medicine for saṃsāra |\n| sūtra | dharma as thread connecting all |\n| darpana | ātman as mirror reflecting brahman |\n", "workbook-questions": "# Stage 24: Dattapadī — Workbook (Questions)\n\n## Section A: Brainstorming (10 marks)\nFor each word, give 2 possible devotional connections (10 marks):\n1. megha (cloud): a) ___  b) ___\n2. mārjāra (cat): a) ___  b) ___\n3. kūpa (well): a) ___  b) ___\n4. ratna (jewel): a) ___  b) ___\n5. pathika (traveler): a) ___  b) ___\n\n## Section B: Composition (40 marks)\n**B1.** Given words: **padma, candra, sindhu, agni** — compose a 4-line devotional verse using one word per line (10 marks):\n\n**B2.** Given words: **vṛkṣa, sarpa, jala, parvata** — compose a 4-line verse for Śiva (10 marks):\n\n**B3.** HARD — Given words: **rathya (street), ghaṭa (pot), tantuvāya (weaver), rajakaḥ (washerman)** — compose a 4-line philosophical/devotional verse (20 marks):\n\n## Section C: Analysis (10 marks)\n**C1.** A poet was given the words \"siṃha, padma, megha, vaṃśa (bamboo/lineage).\" Explain how each was integrated in this verse:\n> megha-varṇaṃ bhaje viṣṇuṃ yadu-**vaṃśa**-vibhūṣaṇam\n> **padma**-nābhaṃ **siṃha**-rūpaṃ yasya **megha** iva kṛpā\n\nIdentify the technique used for each word.\n\n---\n\n**Total: 60 marks**\n", "workbook-answers": "# Stage 24: Dattapadī — Workbook (Answers)\n\n## Section A\n1. megha: a) **Viṣṇu's complexion** (megha-varṇa) b) **grace raining like a cloud**\n2. mārjāra: a) **mārjāra-nyāya** (kitten surrender — prapatti doctrine) b) simile for stealth/māyā\n3. kūpa: a) **ajñāna-kūpa** (well of ignorance jīva falls into) b) deep well = depth of devotion\n4. ratna: a) **ratnākara** (ocean of jewels) = epithet of deity b) devotion as precious jewel\n5. pathika: a) **jīva as traveler** in saṃsāra b) deity as guide for the traveler\n\n## Section B\n**B1.** Sample (Viṣṇu):\n> **padma**-nābhaṃ prapadye taṃ (I take refuge in lotus-naveled one)\n> **candra**-vadanaṃ sundaraṃ harim (moon-faced, beautiful Hari)\n> saṃsāra-**sindhu**-tārakaṃ (who helps cross the ocean of saṃsāra)\n> jñāna-**agni**-nā tamo harati (who removes darkness with the fire of knowledge)\n\n**B2.** Sample (Śiva):\n> kailāsa-**parvata**-nilayaṃ (dwelling on mount Kailāsa)\n> **sarpa**-bhūṣaṇa-maṇḍitam (adorned with serpent ornaments)\n> gaṅgā-**jala**-dharam śambhum (bearing the water of Gaṅgā)\n> bilva-**vṛkṣa**-priyaṃ bhaje (I adore him who loves the bilva tree)\n\n**B3.** Sample (Hard):\n> brahma **tantuvāya** iva viśvaṃ vayati (Brahmā weaves the universe like a weaver)\n> jīvaḥ **ghaṭa** iva mṛdā nirmitaḥ (the jīva is fashioned like a pot from clay)\n> karma-mala-**rajakaḥ** iva guruḥ (the guru is like a washerman of karmic stains)\n> saṃsāra-**rathyā**-bhramaṇāt trāhi mām (save me from wandering the street of saṃsāra)\n\n## Section C\n- **vaṃśa** → Direct attribute: yadu-vaṃśa-vibhūṣaṇam (ornament of the Yadu lineage)\n- **padma** → Direct epithet: padma-nābham (lotus-naveled)\n- **siṃha** → Direct form: siṃha-rūpam (lion-formed — Narasiṃha)\n- **megha** → Double use: (1) megha-varṇam (direct complexion), (2) megha iva kṛpā (upamā — grace like a cloud)\n\n---\n\n**Total: 60 marks**\n"}, "tabs": ["theory", "reference", "workbook-questions", "workbook-answers"]}, {"id": "25-nishiddhakshari", "number": 25, "title": "Nishiddhakshari", "subtitle": "Inhibition", "files": {"theory": "# Stage 25: Niṣiddhākṣarī — Inhibition\n\n## Goal\nCompose devotional verse without using a forbidden sound (akṣara). This trains phonological awareness and lexical flexibility under constraint.\n\n## What is Niṣiddhākṣarī?\n\n**Niṣiddha** = forbidden. **Akṣarī** = having a syllable/letter. You must compose a verse praising a deity WITHOUT using a specified consonant or vowel. If the forbidden letter is \"na\" (न), you cannot use any word containing \"na\" anywhere.\n\n## Why This Matters\n\n1. **Phonological control** — you become aware of every sound in every word\n2. **Synonym mastery** — forces you to find alternatives instantly\n3. **Avadhāna preparation** — niṣiddhākṣarī is one of the 8 challenges in aṣṭāvadhāna\n\n## Strategy\n\n### Step 1: Identify all words you'd normally use that contain the forbidden letter\nIf forbidden = \"na\": namāmi ✗, nīlakaṇṭha ✗, mandira ✗, candra ✗, ananta ✗\n\n### Step 2: Find substitutes\nnamāmi → bhajāmi, vandāmi, prapadye\nnīlakaṇṭha → hara, śambhu, mahādeva\nmandira → ālaya, devagṛha\ncandra → indu, śaśī, vidhu\nananta → aprameya, aśeṣa\n\n### Step 3: Compose, checking every word\nRead every syllable of your composition. If the forbidden letter appears anywhere — even in the middle of a word — you must replace that word.\n\n## Example: Praise Śiva without \"na\"\n\nForbidden: **na** (न)\n\nWords we CANNOT use: namāmi, naṭarāja, nīlakaṇṭha, nandī, mandira, candra, ananta, namaḥ, namas, naya, nīla...\n\nReplacement strategy:\n| Blocked Word | Replacement |\n|-------------|-------------|\n| namāmi | bhajāmi, staumi |\n| candra | indu, śaśī, vidhu |\n| mandira | ālaya, kṣetra |\n| namaḥ | praise differently |\n\n**Composition:**\n> bhajāmi śambhuṃ satatam mahādevam\n> viśālākṣaṃ haram umāpatim prabhum\n> trilocakaṃ bhasmavibhūṣitāṅgam\n> yo viśvasya pālakaḥ sadā hitam\n\n(Every word checked — no \"na\" anywhere!)\n\nWait — \"trilocakam\" isn't a word. \"trinetra\" has \"na\"! Try \"tryakṣam\" instead... \"tryambakam\" has no \"na\" — but wait, let me check: try-am-ba-kam — no \"na\" ✓\n\n## Common Forbidden Letters and Their Challenges\n\n| Forbidden | Challenge Level | What It Blocks |\n|-----------|----------------|----------------|\n| na (न) | Hard | namāmi, namaḥ, nāma, -ana endings |\n| ma (म) | Very Hard | namāmi, mama, -am endings, mantram |\n| ta (त) | Very Hard | tava, -ti verb endings, -tat |\n| sa (स) | Hard | sarvam, sadā, sundara, sarasvatī |\n| ka (क) | Medium | kṛṣṇa, kamala, kṛpā |\n| ra (र) | Very Hard | rāma, hari, guru, sundara |\n\n## Milestone Check\nCan you compose a 4-line devotional verse praising your deity without using the letter \"na\"?\n", "reference": "# Stage 25: Niṣiddhākṣarī — Reference Guide\n\n## Substitute Words When Common Letters Are Forbidden\n\n### Without \"na\" (न)\n| Blocked | Substitutes |\n|---------|------------|\n| namāmi | bhajāmi, staumi, vandāmi |\n| namaḥ | jayatu, stuti |\n| nīlakaṇṭha | use śambhu, hara, mahādeva |\n| candra | indu, śaśī, vidhu |\n| mandira | ālaya, kṣetra |\n| nandī | vṛṣabha |\n| ananta | aprameya, aśeṣa |\n| sundara | rucira, cāru, śobha |\n\n### Without \"ma\" (म)\n| Blocked | Substitutes |\n|---------|------------|\n| namāmi | stauti (3P), bhajati (3P), vandāvahe |\n| mama | asya (his — rephrase to 3P) |\n| -am ending | use other cases |\n| mantra | vidyā |\n| mandira | ālaya |\n| mokṣa | kaivalya |\n\n### Without \"sa\" (स)\n| Blocked | Substitutes |\n|---------|------------|\n| sarvam | akhilam, viśvam |\n| sadā | nityam |\n| sundara | rucira, cāru |\n| sarasvatī | vāgdevī, bhāratī, śāradā |\n| stotra | gīti, stuti |\n\n### Without \"ka\" (क)\n| Blocked | Substitutes |\n|---------|------------|\n| kṛṣṇa | hari, govinda, mādhava |\n| kṛpā | dayā, prasāda |\n| kamala | padma, aravinda, paṅkaja |\n| karuṇā | dayā |\n| kartā | dhātā |\n\n## Checking Process\n\n1. Write your verse\n2. Read EVERY syllable aloud\n3. Mark any occurrence of the forbidden letter with ✗\n4. Replace the offending word\n5. Re-check the replacement\n6. Repeat until clean\n\n## Quick Phonological Awareness\n\nSanskrit consonant chart — know where each sound lives:\n```\nka kha ga gha ṅa   (kaṇṭhya - guttural)\nca cha ja jha ña   (tālavya - palatal)\nṭa ṭha ḍa ḍha ṇa  (mūrdhanya - retroflex)\nta tha da dha na   (dantya - dental)\npa pha ba bha ma   (oṣṭhya - labial)\nya ra la va        (antaḥstha)\nśa ṣa sa ha        (ūṣman)\n```\n", "workbook-questions": "# Stage 25: Niṣiddhākṣarī — Workbook (Questions)\n\n## Section A: Substitution (15 marks)\n**A1.** Forbidden letter: **na**. Give a substitute for each (5 marks):\n1. namāmi →  2. candra →  3. mandira →  4. ananta →  5. sundara →\n\n**A2.** Forbidden letter: **ka**. Give a substitute (5 marks):\n1. kṛṣṇa →  2. kṛpā →  3. kamala →  4. karuṇā →  5. karma →\n\n**A3.** Forbidden letter: **sa**. Give a substitute (5 marks):\n1. sarvam →  2. sadā →  3. sundara →  4. sarasvatī →  5. stotra →\n\n## Section B: Error Detection (10 marks)\nThis verse claims to avoid \"na\" — find all violations:\n> bhajāmi śambhuṃ nityam mahādevam\n> trilocanaṃ bhasmabhūṣitāṅgam\n> gāyāmi stotram śivasya kīrtim\n> pāhi māṃ prabho anugṛhāṇa\n\n## Section C: Composition (35 marks)\n**C1.** Compose a 4-line praise of Śiva WITHOUT the letter \"na\" (15 marks):\n**C2.** Compose a 4-line praise of your iṣṭadevatā WITHOUT the letter \"sa\" (20 marks):\n\n---\n\n**Total: 60 marks**\n", "workbook-answers": "# Stage 25: Niṣiddhākṣarī — Workbook (Answers)\n\n## Section A\n**A1.** 1. **bhajāmi/staumi** 2. **indu/śaśī** 3. **ālaya** 4. **aprameya/aśeṣa** 5. **rucira/cāru**\n\n**A2.** 1. **hari/govinda** 2. **dayā/prasāda** 3. **padma/aravinda** 4. **dayā** 5. **dhātu-phala (action-result)**... or rephrase without the concept\n\n**A3.** 1. **akhilam/viśvam** 2. **nityam** 3. **rucira/cāru** 4. **vāgdevī/bhāratī** 5. **gīti/stuti**\n\n## Section B\nViolations of \"na\" prohibition:\n1. **nityam** — contains **ni** ✗\n2. **trilocanaṃ** — contains **na** ✗\n3. No violation in line 3 ✓ (wait: sto-**tra**-m = no na... kīr-tim = no na ✓)\n4. **anugṛhāṇa** — contains **na** twice ✗ AND **a-nu** ✗\n\nTotal violations: **nityam, trilocanaṃ, anugṛhāṇa** (3 words with \"na\")\n\n## Section C\n**C1.** Without \"na\" — sample:\n> bhajāmi śambhuṃ girijāpatim prabhum (no na ✓)\n> tryakṣaṃ bhasmavibhūṣitāṅgam (aṅ has ṅ not na ✓... wait: aṅgam — ṅ is different from na ✓)\n> vidhu-śekharam umāpatiṃ haram\n> yo viśvasya hitaṃ sadā karoti\n\n(Must check every syllable carefully. Accept any legitimate attempt.)\n\n**C2.** Without \"sa\" — sample (for Śiva):\n> bhajāmi haram trilocanam prabhum (no sa ✓)\n> nīlakaṇṭham umāpatim mahādevam\n> gaṅgādharam naṭarājam bhaje nityam\n> kailālavālinam jagadīśam prapadye\n\n(Accept any well-checked attempt. Award marks for: no violations (7), devotional content (4), poetic quality (4/9).)\n\n---\n\n**Total: 60 marks**\n"}, "tabs": ["theory", "reference", "workbook-questions", "workbook-answers"]}, {"id": "26-citra-kavya", "number": 26, "title": "Citra-kavya", "subtitle": "Stacked Constraints", "files": {"theory": "# Stage 26: Citra-kāvya — Stacked Constraints\n\n## Goal\nCompose verse under multiple simultaneous constraints: meter + deity + rasa + required word + prohibition. This is the culmination of all previous skills working together.\n\n## What is Citra-kāvya?\n\n**Citra** = picture, wonder. **Kāvya** = poetry. Citra-kāvya is poetry composed under extraordinary constraints — visual patterns, phonological restrictions, or multiple simultaneous requirements.\n\n## Constraint Types\n\n1. **Chandas** — specific meter required\n2. **Viṣaya** — specific deity/topic required\n3. **Rasa** — specific emotional flavor required\n4. **Dattapada** — required word(s) that must appear\n5. **Niṣiddhākṣarī** — forbidden letter(s)\n6. **Alaṅkāra** — specific figure of speech required\n7. **Vibhakti** — specific case(s) must dominate\n\n## The Yantra Verse Game\n\nYou are given ALL constraints simultaneously:\n\n**Example Challenge:**\n- Meter: anuṣṭubh (8 syllables per pāda)\n- Deity: Śiva\n- Rasa: karuṇa (compassion)\n- Required word: sindhu (ocean)\n- Forbidden letter: na\n- Required alaṅkāra: upamā (simile)\n\n**Solution Process:**\n\n1. Check: which words about Śiva contain \"na\"? → nandī ✗, naṭarāja ✗, candra ✗... use hara, śambhu, tryakṣa\n2. \"sindhu\" must appear → karuṇā-sindhu iva (simile + required word + rasa!)\n3. Compose in 8-syllable pādas\n4. Verify all constraints met\n\n**Attempt:**\n> dīno'smi he dayānidhe (8 syl, karuṇa) [wait: \"nidhe\" has \"ni\"... but forbidden is \"na\" not \"ni\" — if na means the letter न specifically, then \"ni\" (नि) DOES contain न. Hmm. Let's check: if it's the akṣara \"na\" specifically = the sound /na/, then \"ni\" is a different akṣara. Typically in avadhāna, the specific akṣara is forbidden.]\n\nLet me be safe:\n> dīro'smi he dayālu hara (8?)\n> kṛpā-**sindhu** iva tava dayā (8: kṛ-pā-si-dhu-i-va-ta-va... 8? need to count)\n> pāhi māṃ śambhu tryakṣa prabho (8)\n> duḥkhāt trāhi sadā bhajāmi (8)\n\n## Multi-Constraint Checklist\n\nBefore composing, lay out all constraints:\n```\n☐ Meter: ___\n☐ Deity: ___\n☐ Rasa: ___\n☐ Required word(s): ___\n☐ Forbidden letter(s): ___\n☐ Required alaṅkāra: ___\n☐ Other: ___\n```\n\nAfter composing, verify each:\n```\n☐ All pādas correct syllable count?\n☐ Deity named/described?\n☐ Rasa consistent?\n☐ Required word present?\n☐ No forbidden letter anywhere?\n☐ Required alaṅkāra present?\n```\n\n## Classical Citra-kāvya Forms\n\n### Sarvatobhadra (palindrome in all directions)\nA verse that reads the same forward and backward.\n\n### Cakrabandha (wheel poem)\nSyllables arranged in a wheel pattern.\n\n### Padmabandha (lotus poem)\nSyllables arranged in lotus-petal pattern.\n\n(These visual forms are advanced — the constraint-stacking approach is the practical foundation.)\n\n## Milestone Check\nCan you compose a verse satisfying 4+ simultaneous constraints?\n", "reference": "# Stage 26: Citra-kāvya — Reference Guide\n\n## Multi-Constraint Planning Template\n\n```\nCONSTRAINTS:\n1. Meter: ___ (syllables per pāda: ___)\n2. Deity: ___ (available epithets: ___, ___, ___)\n3. Rasa: ___ (vocabulary bank: ___, ___, ___)\n4. Required word: ___ (syllable pattern: ___)\n5. Forbidden letter: ___ (blocked words: ___, ___, ___)\n6. Required alaṅkāra: ___\n\nPLAN:\n- Integrate required word via: [upamā / rūpaka / direct / narrative]\n- Rasa vocabulary choices: ___\n- Epithet choices (avoiding forbidden letter): ___\n- Line-by-line sketch: ___\n\nVERIFY:\n☐ Meter  ☐ Deity  ☐ Rasa  ☐ Word  ☐ Letter  ☐ Alaṅkāra\n```\n\n## Constraint Interaction Matrix\n\n| If constrained by... | Be flexible with... |\n|---------------------|---------------------|\n| Meter (strict) | Word choice, synonyms |\n| Forbidden letter | Synonyms, rephrasing |\n| Required word | Where it falls in the verse |\n| Required rasa | Vocabulary, sentence type |\n| Required alaṅkāra | Where in the verse it appears |\n\n## Order of Constraint Satisfaction\n\n1. **Fixed constraints first:** meter pattern, forbidden letter\n2. **Place the required word** — find where it fits metrically\n3. **Build around it** — deity reference, rasa vocabulary\n4. **Add the alaṅkāra** — weave in simile/metaphor\n5. **Final check** — verify ALL constraints simultaneously\n\n## Emergency Techniques\n\n| Problem | Solution |\n|---------|----------|\n| Required word doesn't fit meter | Change its case form / use a compound |\n| Can't avoid forbidden letter in key word | Use a completely different synonym |\n| Rasa conflicts with deity | Find an aspect of the deity that matches |\n| Alaṅkāra feels forced | Make it the central image, not an add-on |\n| Too many constraints at once | Satisfy the hardest 2 first, then adjust |\n", "workbook-questions": "# Stage 26: Citra-kāvya — Workbook (Questions)\n\n## Section A: 3-Constraint Verse (20 marks)\n**A1.** Compose a 4-line verse with: Meter = anuṣṭubh, Deity = Devī, Required word = padma (10 marks):\n**A2.** Compose a 4-line verse with: Deity = Kṛṣṇa, Rasa = śṛṅgāra, Required alaṅkāra = upamā (10 marks):\n\n## Section B: 4-Constraint Verse (20 marks)\n**B1.** Compose a verse with: Meter = anuṣṭubh, Deity = Śiva, Rasa = karuṇa, Required word = sindhu (20 marks):\n\n## Section C: 5-Constraint Verse (20 marks)\n**C1.** Compose a verse with ALL of the following:\n- Meter: anuṣṭubh (4 × 8 syllables)\n- Deity: Your iṣṭadevatā\n- Rasa: adbhuta (wonder)\n- Required word: megha (cloud)\n- Forbidden letter: na\nShow your planning process (constraint analysis, word choices, verification).\n\n---\n\n**Total: 60 marks**\n", "workbook-answers": "# Stage 26: Citra-kāvya — Workbook (Answers)\n\n## Section A\n**A1.** Sample (anuṣṭubh + Devī + padma):\n> padma-vāsinīṃ devīṃ ca (8)\n> jagadambāṃ bhajāmy aham (8)\n> padma-hastāṃ mahālakṣmīṃ (8)\n> karuṇāmayīṃ prapadye tām (8)\n✓ Meter (8×4), ✓ Devī, ✓ padma appears\n\n**A2.** Sample (Kṛṣṇa + śṛṅgāra + upamā):\n> megha-śyāmaṃ mukhāravindam (anuṣṭubh? check) — adjust:\n> kṛṣṇaṃ bhaje sundaraṃ tam (8)\n> candra iva mukhaṃ yasya (8)\n> veṇu-gāna-vinodinam (8)\n> gopī-vallabham āśraye (8)\n✓ Kṛṣṇa, ✓ śṛṅgāra vocabulary, ✓ candra iva = upamā\n\n## Section B\n**B1.** Sample (anuṣṭubh + Śiva + karuṇa + sindhu):\n> dīnaḥ aham he mahādeva (8)\n> karuṇā-sindhu tvam eva me (8? ka-ru-ṇā-si-ndhu-tva-me-va: check)\n> duḥkhāt trāhi dayānidhe (8)\n> pāhi māṃ śambhu sarvadā (8)\n✓ anuṣṭubh, ✓ Śiva (mahādeva, śambhu), ✓ karuṇa, ✓ sindhu used\n\n## Section C\n**C1.** Planning for anuṣṭubh + iṣṭadevatā + adbhuta + megha + no \"na\":\n\n**Constraint analysis:**\n- Forbidden \"na\" blocks: namas, nīla, nandī, sundara, candra, ananta, naṭarāja\n- \"megha\" (me-gha) — no \"na\" ✓, can use directly\n- Adbhuta rasa: use aho!, kiṃ citraṃ, kīdṛśam\n- Deity epithets without \"na\": hara, śambhu, tryakṣa, umāpati\n\n**Composition (for Śiva):**\n> aho **megha** iva śyāmaḥ (8: a-ho-me-gha-i-va-śyā-maḥ)\n> tryakṣo hara umāpatiḥ (8)\n> kīdṛśaṃ rūpam etasya (8? check for na: e-ta-sya ✓)\n> vismayo me sadā hṛdi (8: vi-sma-yo-me-sa-dā-hṛ-di)\n\n**Verification:**\n✓ Meter: 8×4\n✓ Deity: Śiva (hara, tryakṣa, umāpati)\n✓ Rasa: adbhuta (aho!, kīdṛśam, vismaya)\n✓ Required word: megha ✓\n✓ Forbidden letter: scan... a-ho-me-gha-i-va-śyā-maḥ ✓... try-a-kṣo-ha-ra-u-mā-pa-tiḥ ✓... kī-dṛ-śaṃ-rū-pa-me-ta-sya ✓... vi-sma-yo-me-sa-dā-hṛ-di ✓. NO \"na\" found ✓✓\n\n---\n\n**Total: 60 marks**\n"}, "tabs": ["theory", "reference", "workbook-questions", "workbook-answers"]}, {"id": "27-dharana-i", "number": 27, "title": "Dharana I", "subtitle": "Interrupted Memory", "files": {"theory": "# Stage 27: Dhāraṇā I — Interrupted Memory\n\n## Goal\nHold multiple unfinished compositions simultaneously in memory. Begin four different stotras, compose one pāda each, then return to complete them — maintaining each thread perfectly.\n\n## What is Dhāraṇā?\n\n**Dhāraṇā** (धारणा) = holding, retention. In avadhāna, you must hold multiple unfinished verses in memory while being interrupted by other challenges. This stage trains that memory muscle.\n\n## The Exercise: One Pāda Offering\n\n### Round 1: Begin four compositions\nCompose pāda (a) for each of four different stotras:\n\n1. **Śiva stotra:** śāntam divyam trilocanam\n2. **Devī stotra:** jagadambāṃ prapadye tām\n3. **Kṛṣṇa stotra:** govindaṃ veṇuvādinam\n4. **Gaṇeśa stotra:** siddhidaṃ gaṇanāyakam\n\nNow STOP. Do something else. Come back later.\n\n### Round 2: Add pāda (b) to each\nReturn and continue each without re-reading pāda (a):\n\n1. **Śiva:** [recall pāda a] → add pāda b\n2. **Devī:** [recall pāda a] → add pāda b\n3. **Kṛṣṇa:** [recall pāda a] → add pāda b\n4. **Gaṇeśa:** [recall pāda a] → add pāda b\n\n### Rounds 3-4: Complete with pādas (c) and (d)\n\n## Memory Techniques\n\n### 1. Anchoring\nAssociate each composition with a distinct mental image:\n- Śiva stotra → image of Kailāsa\n- Devī stotra → image of the yantra\n- Kṛṣṇa stotra → image of Vṛndāvana\n- Gaṇeśa stotra → image of the modaka\n\n### 2. Rhythmic Memory\nEach pāda has a distinct rhythm. Memorize the SOUND, not just the words.\n\n### 3. Semantic Chunking\nRemember the meaning-arc, not just individual words:\n\"I started with peaceful-divine-three-eyed → next should describe form/action\"\n\n### 4. First-Word Triggers\nRemember just the first word of each pāda: śāntam → jagadambām → govindam → siddhidam\n\n## Progressive Training Schedule\n\n| Week | Challenge |\n|------|-----------|\n| 1 | Hold 2 half-finished verses |\n| 2 | Hold 3 half-finished verses |\n| 3 | Hold 4 half-finished verses |\n| 4 | Hold 4 verses + 1 interrupting question |\n| 5 | Hold 4 verses + 2 interruptions |\n| 6 | Hold 4 verses + answer questions between rounds |\n\n## Milestone Check\nCan you begin 4 stotras (one pāda each), wait 10 minutes, then return and continue all four correctly?\n", "reference": "# Stage 27: Dhāraṇā I — Reference Guide\n\n## Memory Palace for 4 Compositions\n\n| Slot | Deity | Image Anchor | Pāda a | Pāda b | Pāda c | Pāda d |\n|------|-------|-------------|--------|--------|--------|--------|\n| 1 | Śiva | Kailāsa | __ | __ | __ | __ |\n| 2 | Devī | Yantra | __ | __ | __ | __ |\n| 3 | Kṛṣṇa | Vṛndāvana | __ | __ | __ | __ |\n| 4 | Gaṇeśa | Modaka | __ | __ | __ | __ |\n\n## Process Template\n\n### Round 1 (compose pāda a for all)\n- [ ] Compose Slot 1, pāda a. First word: ___\n- [ ] Compose Slot 2, pāda a. First word: ___\n- [ ] Compose Slot 3, pāda a. First word: ___\n- [ ] Compose Slot 4, pāda a. First word: ___\n- [ ] PAUSE. Do unrelated activity.\n\n### Round 2 (recall + compose pāda b)\n- [ ] Recall Slot 1 pāda a → compose pāda b\n- [ ] Recall Slot 2 pāda a → compose pāda b\n- [ ] Recall Slot 3 pāda a → compose pāda b\n- [ ] Recall Slot 4 pāda a → compose pāda b\n- [ ] PAUSE.\n\n### Rounds 3-4: same for pādas c and d.\n\n## Memory Strategies\n\n| Strategy | How |\n|----------|-----|\n| First-word chain | Remember: śāntam-jagad-govinda-siddhi |\n| Rhythmic humming | Hum the meter of each pāda |\n| Semantic arc | \"peace → mother → flute → elephant\" |\n| Spatial placement | Place each in a corner of a mental room |\n| Body anchoring | Touch head/heart/navel/feet for 1/2/3/4 |\n\n## Common Errors and Prevention\n\n| Error | Prevention |\n|-------|-----------|\n| Confusing pādas between slots | Distinct deity anchors |\n| Forgetting exact words | Remember first 2 words minimum |\n| Meter drift on continuation | Re-chant the rhythm before continuing |\n| Semantic inconsistency | Remember the \"story arc\" of each verse |\n", "workbook-questions": "# Stage 27: Dhāraṇā I — Workbook (Questions)\n\n## Exercise 1: Two Threads (20 marks)\n**Round 1:** Compose pāda (a) for two stotras:\n1. Śiva stotra, pāda a: ___\n2. Devī stotra, pāda a: ___\n\n**Now close this book. Wait 5 minutes. Do something else.**\n\n**Round 2:** WITHOUT looking back, write pāda (a) from memory, then add pāda (b):\n1. Śiva: a (recalled): ___ → b: ___\n2. Devī: a (recalled): ___ → b: ___\n\n**Round 3:** Recall a+b, add c and d:\n1. Śiva: complete śloka: ___\n2. Devī: complete śloka: ___\n\n## Exercise 2: Four Threads (30 marks)\n**Round 1:** Compose pāda (a) for four stotras (4 different deities):\n1. ___ 2. ___ 3. ___ 4. ___\n\n**PAUSE 10 minutes.**\n\n**Round 2:** Recall all four pāda (a)s and add pāda (b):\n1. a: ___ → b: ___\n2. a: ___ → b: ___\n3. a: ___ → b: ___\n4. a: ___ → b: ___\n\n**PAUSE 5 minutes.**\n\n**Round 3-4:** Complete all four ślokas.\n\n## Exercise 3: Self-Assessment (10 marks)\nAfter completing Exercise 2, compare your recalled pāda (a)s with what you originally wrote. Score yourself:\n- Perfect recall = 2 marks each\n- Minor change (1-2 syllables different) = 1 mark each\n- Forgot / major change = 0 marks each\n\nSelf-score: ___ / 8\n\nReflection: What memory strategy worked best for you?\n\n---\n\n**Total: 60 marks**\n", "workbook-answers": "# Stage 27: Dhāraṇā I — Workbook (Answers)\n\nThis stage is primarily practical and self-assessed. There are no fixed \"correct\" answers — the test is whether you can accurately recall and continue your own compositions.\n\n## Evaluation Criteria\n\n### For Exercises 1 & 2:\n- **Recall accuracy** (10 marks per exercise): Did you remember your own pāda (a) correctly after the pause?\n- **Continuation quality** (10 marks per exercise): Are pādas b, c, d metrically consistent, thematically connected, and grammatically correct?\n- **Completion** (5 marks per exercise): Did you finish all threads?\n\n### Scoring Guide:\n| Criterion | Full marks | Half marks | No marks |\n|-----------|-----------|------------|----------|\n| Recall | Perfect or near-perfect | Remembered theme but not exact words | Forgot entirely |\n| Meter | All 8-syllable pādas | Some pādas off by 1 syllable | No metrical awareness |\n| Theme | Coherent from a to d | Some drift | Contradictory |\n| Grammar | Correct cases and verbs | Minor errors | Major errors |\n\n### For Exercise 3:\nAward yourself honestly. The goal is to identify which memory strategies work for YOU.\n\n### Effective strategies commonly reported:\n1. **First-word chain** — most common effective strategy\n2. **Rhythmic memory** — especially effective for musically trained students\n3. **Visual anchoring** — placing each verse in a specific mental location\n4. **Semantic story** — remembering what the verse says, then reconstructing\n\n---\n\n**Total: 60 marks (self-assessed with honesty)**\n"}, "tabs": ["theory", "reference", "workbook-questions", "workbook-answers"]}, {"id": "28-dharana-ii", "number": 28, "title": "Dharana II", "subtitle": "Associative Retrieval", "files": {"theory": "# Stage 28: Dhāraṇā II — Associative Retrieval\n\n## Goal\nRetrieve poetic states from cues. Given a deity → instantly recall the bhāva → select the meter → apply the constraint → produce the pāda. Build rapid associative chains.\n\n## The Chain: Deity → Bhāva → Meter → Constraint → Pāda\n\nIn avadhāna, you don't have time to think sequentially. You must build **automatic associations**:\n\n### Level 1: Deity → Vocabulary Set\nHear \"Śiva\" → instantly access: hara, śambhu, trilocana, gaṅgādhara, kailāsa, bhasm, jaṭā, tṛtīya-netra, nandī, ḍamaru...\n\n### Level 2: Bhāva → Sentence Type + Word Choice\nHear \"karuṇa\" → plea structure, dīna/ārt vocabulary, trāhi/pāhi verbs, mandākrāntā meter preference\n\n### Level 3: Meter → Automatic Pattern\nHear \"anuṣṭubh\" → 8 syllables, positions 5-6-7 in even pādas, yati after 4\n\n### Level 4: Constraint → Avoidance/Inclusion Set\nHear \"no na\" → instant mental filter activating: use bhaj not nam, use indu not candra...\n\n## The Deity Memory Palace\n\nBuild a mental structure for each deity containing:\n\n```\nŚIVA\n├── Epithets: [hara, śambhu, tryakṣa, maheśvara...]\n├── Objects: [triśūla, ḍamaru, bhasm...]\n├── Stories: [hālāhala, gaṅgā, tripura, tāṇḍava...]\n├── Bhāva-ready phrases:\n│   ├── Śānta: dhyāna-sthita nirañjana...\n│   ├── Vīra: tripurāntaka saṃhāramūrti...\n│   ├── Karuṇa: he kṛpālo dīnabandho...\n│   └── Adbhuta: aho ardhanaṭeśvara...\n├── Synonyms by syllable count: [hara(2), śambhu(2), maheśvara(4)...]\n└── Prosodic profiles: [hara=∪∪, śambhu=––, maheśvara=∪–∪∪...]\n```\n\n## Retrieval Drills\n\n### Drill 1: Flash Response\nSomeone says a deity name. Within 5 seconds, produce ONE epithet you haven't used recently.\n\n### Drill 2: Bhāva Shift\nGiven \"Śiva + vīra\" — produce one line immediately.\nGiven \"Śiva + karuṇa\" — produce one line immediately.\nGiven \"Śiva + śānta\" — produce one line immediately.\n\n### Drill 3: Constraint Chain\nGiven \"Devī + anuṣṭubh + no sa\" — produce one pāda within 30 seconds.\n\n### Drill 4: Cue Reconstruction\nYou composed a verse about Kṛṣṇa yesterday. Cue: \"veṇu\". Can you recall and continue?\n\n## Building Speed\n\n| Week | Target Response Time |\n|------|---------------------|\n| 1 | 2 minutes per pāda |\n| 2 | 1 minute per pāda |\n| 3 | 30 seconds per pāda |\n| 4 | 15 seconds per pāda |\n| 5 | Near-instantaneous |\n\n## Milestone Check\nGiven a deity name + bhāva + meter + one constraint, can you produce a pāda within 30 seconds?\n", "reference": "# Stage 28: Dhāraṇā II — Reference Guide\n\n## Quick-Access Deity Banks\n\n### Śiva — Instant Access\nEpithets (2-syl): hara, īśa, bhava\nEpithets (3-syl): śambhu, śaṅkara, rudra\nEpithets (4-syl): maheśvara, tryambaka, nīlakaṇṭha\nBhāva starters: śānta→dhyānasthita, vīra→tripurāntaka, karuṇa→dīnabandho\n\n### Devī — Instant Access\nEpithets (2-syl): ambā, śakti\nEpithets (3-syl): durgā, gaurī, umā\nEpithets (4-syl): jagadambā, pārvatī, bhavānī\nBhāva starters: śānta→caitanya, vīra→mahiṣāsura-mardinī, karuṇa→he mātar\n\n### Viṣṇu/Kṛṣṇa — Instant Access\nEpithets (2-syl): hari, kṛṣṇa\nEpithets (3-syl): govinda, mādhava\nEpithets (4-syl): nārāyaṇa, vāsudeva, janārdana\nBhāva starters: śānta→yoganidrā, vīra→narasiṃha, karuṇa→dīnavatsala\n\n## Retrieval Speed Test Format\n\n```\nCUE: [Deity] + [Bhāva] + [Meter] + [Constraint]\nTARGET: 1 pāda within ___ seconds\n```\n\n## Associative Chain Diagram\n\n```\nTRIGGER (e.g., \"Śiva\")\n    ↓ (< 1 sec)\nVOCABULARY SET activated\n    ↓ (+ bhāva cue)\nWORD FILTER applied (rasa vocabulary)\n    ↓ (+ meter cue)\nPROSODIC FILTER applied (syllable count/pattern)\n    ↓ (+ constraint)\nPROHIBITION FILTER applied (forbidden letter check)\n    ↓\nOUTPUT: pāda\n```\n\n## Common Cue-Response Pairs (memorize these)\n\n| Cue | Instant Response Pāda |\n|-----|----------------------|\n| Śiva + śānta | dhyānasthitaṃ nirañjanaṃ |\n| Śiva + vīra | tripurāntakaṃ bhaje haram |\n| Devī + karuṇa | he ambe trāhi māṃ sadā |\n| Kṛṣṇa + śṛṅgāra | veṇuvādinam āśraye |\n| Gaṇeśa + maṅgala | siddhidaṃ vandāmahe |\n", "workbook-questions": "# Stage 28: Dhāraṇā II — Workbook (Questions)\n\n## Section A: Flash Response (15 marks)\nProduce ONE pāda (8 syllables) for each cue. Time yourself — aim for under 30 seconds each.\n\n1. Śiva + śānta: ___ (time: ___s)\n2. Devī + vīra: ___ (time: ___s)\n3. Kṛṣṇa + karuṇa: ___ (time: ___s)\n4. Gaṇeśa + adbhuta: ___ (time: ___s)\n5. Rāma + śānta: ___ (time: ___s)\n\n## Section B: Constrained Flash (20 marks)\nProduce ONE pāda meeting ALL stated constraints:\n\n1. Śiva + anuṣṭubh + no \"na\": ___ (time: ___s)\n2. Devī + anuṣṭubh + must contain \"padma\": ___ (time: ___s)\n3. Kṛṣṇa + anuṣṭubh + rasa karuṇa: ___ (time: ___s)\n4. Śiva + anuṣṭubh + no \"sa\" + must contain \"indu\": ___ (time: ___s)\n\n## Section C: Bhāva Shift Drill (15 marks)\nFor Śiva alone, produce 5 pādas, each in a different rasa. Time the total.\n1. Śānta: ___\n2. Vīra: ___\n3. Karuṇa: ___\n4. Adbhuta: ___\n5. Śṛṅgāra: ___\nTotal time: ___\n\n## Section D: Cue Reconstruction (10 marks)\nYour teacher gives you only the first word of a pāda you composed earlier (in Stage 27). Reconstruct the full pāda from the cue.\n1. Cue: \"śāntam\" → your pāda: ___\n2. Cue: \"jagadambām\" → your pāda: ___\n\n---\n\n**Total: 60 marks**\n", "workbook-answers": "# Stage 28: Dhāraṇā II — Workbook (Answers)\n\nThis stage is performance-based. Answers are self-generated and self-timed.\n\n## Scoring Guide\n\n### Section A (3 marks each):\n- Under 15s + correct meter + appropriate rasa = 3\n- Under 30s + correct meter = 2\n- Under 60s + reasonable attempt = 1\n- Over 60s or wrong = 0\n\n### Section B (5 marks each):\n- All constraints met + under 30s = 5\n- All constraints met + under 60s = 4\n- One constraint missed = 2\n- Multiple constraints missed = 0\n\n### Section C (3 marks each):\n- Distinct rasa clearly expressed + correct meter = 3\n- Rasa somewhat expressed = 2\n- Rasa unclear = 1\nTotal time benchmark: under 3 minutes for all 5 = excellent\n\n### Section D (5 marks each):\n- Exact or near-exact recall = 5\n- Theme correct, words differ slightly = 3\n- Only remembered the deity/topic = 1\n\n## Sample Responses (for reference only)\n\nA1. Śiva + śānta: **dhyānastho nirguṇaḥ śivaḥ** (7... adjust: dhyānastho nirguṇaḥ paraḥ = 8)\nA2. Devī + vīra: **jayati durgā mahiṣāntakī** (adjust to 8 syllables)\nB1. Śiva + no \"na\": **bhajāmi śambhuṃ satatam** (8, no na ✓)\nC: The key is speed and distinct vocabulary per rasa.\nD: Recall depends on your own earlier work.\n\n---\n\n**Total: 60 marks (largely self-assessed)**\n"}, "tabs": ["theory", "reference", "workbook-questions", "workbook-answers"]}, {"id": "29-aprastuta-prasanga", "number": 29, "title": "Aprastuta-prasanga", "subtitle": "Wit & Context Switching", "files": {"theory": "# Stage 29: Aprastuta-prasaṅga — Wit and Context Switching\n\n## Goal\nRespond intelligently to interruptions and distractions while retaining your ongoing devotional composition. Train resilient attention.\n\n## What is Aprastuta-prasaṅga?\n\n**Aprastuta** = irrelevant. **Prasaṅga** = topic/occasion. In avadhāna, a pṛcchaka (questioner) deliberately asks off-topic, witty, or tricky questions to distract you from your compositions. You must answer intelligently AND return to your verses without losing your place.\n\n## The Skill Set\n\n### 1. Rapid Wit (Pratibhā)\nAnswer the distraction cleverly — ideally in Sanskrit, with humor or depth.\n\n### 2. Context Preservation\nWhile answering, hold your unfinished verse in a \"background thread.\"\n\n### 3. Graceful Return\nAfter answering, smoothly resume composition as if uninterrupted.\n\n## Types of Distracting Questions\n\n| Type | Example | How to Answer |\n|------|---------|--------------|\n| Factual | \"How many sons did Daśaratha have?\" | Quick factual answer |\n| Riddle | \"What has eyes but cannot see?\" | Creative answer (needle? potato? māyā?) |\n| Philosophical | \"If Brahman is nirguṇa, how can it create?\" | Brief philosophical response |\n| Trick | \"Is a coconut a fruit or a nut?\" | Note the trick, answer wisely |\n| Provocative | \"Your last pāda was grammatically wrong!\" | Stay composed, correct if needed |\n| Computational | \"What is 17 × 23?\" | Quick mental math |\n\n## Training Exercises\n\n### Exercise 1: Compose + Interrupt\n- Begin composing a stotra\n- After each pāda, answer a random question (have a friend ask, or use flashcards)\n- Return to composition\n\n### Exercise 2: Dual-Task\n- Recite a known stotra while simultaneously counting backward from 100 by 7s\n- The stotra tests verbal memory; counting tests numerical attention\n\n### Exercise 3: Witty Response Practice\nGiven: \"Why is Gaṇeśa's vehicle a mouse?\"\nAnswer: \"The mouse represents the mind — small, quick, always gnawing. Gaṇeśa, lord of wisdom, rides the mind, meaning he has mastered it.\"\n\n## Attention Management\n\n### The \"Pause and Resume\" Technique\n1. When interrupted, mentally \"bookmark\" your composition: note the first word of the pāda you were about to compose\n2. Give full attention to the question\n3. Answer it completely\n4. Retrieve your bookmark and continue\n\n### The \"Background Hum\" Technique\nKeep the rhythm of your unfinished verse humming mentally while answering the question. Your mouth speaks the answer; your inner ear holds the meter.\n\n## Key Principle\nThe avadhānī never appears flustered. Even under distraction, maintain composure (dhairya). A witty response to an interruption is itself an ornament to the performance.\n\n## Milestone Check\nCan you compose a verse, answer 3 unrelated questions mid-composition, and complete the verse correctly?\n", "reference": "# Stage 29: Aprastuta-prasaṅga — Reference Guide\n\n## Witty Response Templates\n\n| Question Type | Response Pattern |\n|--------------|-----------------|\n| \"Why does X do Y?\" | \"Because [philosophical reason], just as [analogy]\" |\n| \"Which is greater, X or Y?\" | \"Both are aspects of [higher truth]\" or give a clever disambiguation |\n| Trick question | Acknowledge the trick: \"The question itself contains the answer...\" |\n| Factual | Answer directly, then add a witty observation |\n| Mathematical | Compute and move on |\n\n## Quick Factual Bank (Common Avadhāna Questions)\n\n| Topic | Quick Facts |\n|-------|------------|\n| Rāmāyaṇa | 7 kāṇḍas, Vālmīki, 24000 ślokas |\n| Mahābhārata | 18 parvas, Vyāsa, 100000 ślokas |\n| Vedas | 4: Ṛg, Yajus, Sāma, Atharva |\n| Purāṇas | 18 major |\n| Bhagavadgītā | 18 chapters, 700 ślokas |\n| Daśaratha's sons | 4: Rāma, Bharata, Lakṣmaṇa, Śatrughna |\n| Pāṇḍavas | 5: Yudhiṣṭhira, Bhīma, Arjuna, Nakula, Sahadeva |\n| Navagrahāḥ | Sūrya, Candra, Maṅgala, Budha, Guru, Śukra, Śani, Rāhu, Ketu |\n\n## Attention Management Checklist\n\nBefore answering interruption:\n- [ ] Note your current position (which stotra? which pāda?)\n- [ ] Note first word of next planned pāda\n- [ ] Answer question\n- [ ] Recall position and continue\n\n## Composure Phrases\n\nIf thrown off:\n- \"Let me consider...\" (buys 3 seconds)\n- Smile and return to the verse\n- If you truly forgot, acknowledge and move forward — never bluff\n", "workbook-questions": "# Stage 29: Aprastuta-prasaṅga — Workbook (Questions)\n\n## Exercise 1: Compose Under Interruption (30 marks)\n\nBegin composing a śloka to Śiva. After EACH pāda, answer the interrupting question before continuing.\n\n**Pāda a:** Compose → ___\n\nINTERRUPTION: How many kāṇḍas are in the Rāmāyaṇa? Answer: ___\n\n**Pāda b:** Continue from pāda a → ___\n\nINTERRUPTION: What is 13 × 7? Answer: ___\n\n**Pāda c:** Continue → ___\n\nINTERRUPTION: Why does Śiva wear a serpent? Give a witty answer: ___\n\n**Pāda d:** Complete the śloka → ___\n\nWrite the complete śloka without the interruptions: ___\n\n## Exercise 2: Dual-Task (15 marks)\n\nWhile mentally reciting \"oṃ namaḥ śivāya\" continuously, answer these:\n1. Name 3 rivers of India: ___\n2. What is 256 ÷ 8? ___\n3. Name the 5 pāṇḍavas: ___\n4. Who wrote the Meghadūta? ___\n5. What is the 4th vibhakti called? ___\n\nWere you able to maintain the mental recitation throughout?\n\n## Exercise 3: Witty Responses (15 marks)\nGive witty, Sanskrit-tinged answers:\n1. \"Why is the sky blue?\" → ___\n2. \"If Brahman is everywhere, is it in this question too?\" → ___\n3. \"Which came first — the mantra or the deity?\" → ___\n\n---\n\n**Total: 60 marks**\n", "workbook-answers": "# Stage 29: Aprastuta-prasaṅga — Workbook (Answers)\n\n## Exercise 1\n**Interruption answers:**\n- Rāmāyaṇa kāṇḍas: **7** (Bāla, Ayodhyā, Araṇya, Kiṣkindhā, Sundara, Yuddha, Uttara)\n- 13 × 7 = **91**\n- Why serpent? Sample: \"The serpent represents kuṇḍalinī — Śiva wears the awakened energy as his ornament, showing mastery over prāṇa.\"\n\n**Scoring for śloka:** Award marks for: coherent śloka (10), correct meter (5), no confusion between pādas due to interruptions (10), quality of interruption answers (5).\n\n## Exercise 2\n1. **Gaṅgā, Yamunā, Sarasvatī** (or any valid)\n2. **32**\n3. **Yudhiṣṭhira, Bhīma, Arjuna, Nakula, Sahadeva**\n4. **Kālidāsa**\n5. **Caturthī** (dative)\n\nDual-task assessment: Could you maintain the japa mentally? Rate yourself 1-5.\n\n## Exercise 3 — Sample witty answers:\n1. \"The sky is blue because it reflects Nīlakaṇṭha's throat — or perhaps because the Lord chose the color of his own complexion for his favorite canvas.\"\n\n2. \"Indeed — Brahman is the questioner, the question, and the answer. Your question is itself Brahman asking about itself. *tat tvam asi.*\"\n\n3. \"Neither came first — they are anādi (beginningless). The mantra IS the deity in sound-form. As the Mīmāṃsakas say: *autpattiko śabdasyārthena sambandhaḥ* — the connection between word and meaning is eternal.\"\n\nAward marks for: wit (3), Sanskrit integration (1), philosophical depth (1) per question.\n\n---\n\n**Total: 60 marks**\n"}, "tabs": ["theory", "reference", "workbook-questions", "workbook-answers"]}, {"id": "30-multi-devata", "number": 30, "title": "Multi-devata", "subtitle": "Rapid Semantic Switching", "files": {"theory": "# Stage 30: Multi-devatā — Rapid Semantic Switching\n\n## Goal\nSwitch between deity lexical worlds instantly — Śiva → Lalitā → Kṛṣṇa → Sarasvatī — each requiring completely different vocabulary, rasa, epithets, and associations.\n\n## The Challenge\n\nIn avadhāna, different pṛcchakas may assign different deities to different compositions. You might be simultaneously composing:\n- A śānta-rasa Śiva verse (no \"na\")\n- A vīra-rasa Durgā verse (with required word \"sindhu\")\n- A śṛṅgāra-rasa Kṛṣṇa verse (in vasantatilakā)\n- A karuṇa-rasa Rāma verse (samasyāpūraṇa)\n\nEach time you switch between these, your entire mental vocabulary must shift.\n\n## Eight Darśanas Drill\n\nRapidly compose ONE pāda for each of 8 deities in sequence:\n\n1. **Śiva** → kaivalya, hara, kailāsa, tṛtīya-netra...\n   → pāda: ___\n\n2. **Lalitā** → śṛṅgāra, māṇikya, kāmakalā, bindu...\n   → pāda: ___\n\n3. **Kṛṣṇa** → veṇu, gopī, vṛndāvana, pīta-ambara...\n   → pāda: ___\n\n4. **Sarasvatī** → vīṇā, pustaka, haṃsa, śveta...\n   → pāda: ___\n\n5. **Durgā** → siṃha, khaḍga, mahiṣa, aṣṭa-bhuja...\n   → pāda: ___\n\n6. **Gaṇeśa** → modaka, mūṣaka, siddhi, ekadanta...\n   → pāda: ___\n\n7. **Hanumān** → vāyu-putra, rāma-dāsa, laṅkā, parvata...\n   → pāda: ___\n\n8. **Sūrya** → ratha, saptāśva, divākara, prabhā...\n   → pāda: ___\n\n## Semantic World Boundaries\n\nEach deity has a \"world\" — a set of associated words that belong together:\n\n| Deity | Exclusive Vocabulary |\n|-------|---------------------|\n| Śiva | liṅga, bhasm, ḍamaru, gaṅgā-jaṭā, nandī, kailāsa, pināka |\n| Kṛṣṇa | veṇu, gopī, makhan, yamunā, vṛndāvana, rāsa |\n| Durgā | siṃha-vāhana, khaḍga, mahiṣa, caṇḍī, navadurgā |\n| Sarasvatī | vīṇā, pustaka, haṃsa, akṣamālā, śveta-padma |\n| Rāma | kodaṇḍa, vānara, sītā, ayodhyā, setubandha |\n| Gaṇeśa | ekadanta, modaka, mūṣaka, siddhi-buddhi |\n| Hanumān | giridhārī (different from Kṛṣṇa's!), rāmadāsa, laṅkā-dāha |\n\n## The Mixing Error\n\nThe biggest danger: accidentally using Kṛṣṇa vocabulary in a Śiva verse. \"Veṇu-vadana\" for Śiva would be a blunder. Maintain strict boundaries.\n\n## Speed Training\n\n| Level | Challenge |\n|-------|-----------|\n| 1 | Switch between 2 deities every 2 minutes |\n| 2 | Switch between 4 deities every minute |\n| 3 | Switch between 8 deities every 30 seconds |\n| 4 | Random deity calls — respond with 1 pāda in 15 seconds |\n\n## Milestone Check\nCan you produce one pāda for each of 8 different deities, switching between them with no vocabulary contamination?\n", "reference": "# Stage 30: Multi-devatā — Reference Guide\n\n## Deity Vocabulary Quick Cards\n\n### Śiva\nCore: hara, śambhu, trilocana, gaṅgādhara, nīlakaṇṭha, naṭarāja\nObjects: triśūla, ḍamaru, bhasm, rudrākṣa, kapāla\nPlaces: kailāsa, śmaśāna, mandākiṇī\nConsort: pārvatī, umā, gaurī\nVehicle: nandī (bull)\n\n### Viṣṇu/Kṛṣṇa\nCore: hari, govinda, mādhava, keśava, acyuta, janārdana\nObjects: cakra, śaṅkha, gadā, padma, veṇu (Kṛṣṇa), kodaṇḍa (Rāma)\nPlaces: vaikuṇṭha, vṛndāvana (K), ayodhyā (R), kṣīrasāgara\nConsort: lakṣmī, rādhā (K), sītā (R)\nVehicle: garuḍa\n\n### Devī/Durgā\nCore: durgā, caṇḍikā, ambikā, mahiṣamardinī, bhagavatī\nObjects: khaḍga, triśūla, cakra, dhanuḥ, aṣṭāyudha\nPlaces: vindhya, mahiṣapura\nVehicle: siṃha\n\n### Lalitā/Tripurasundarī\nCore: lalitā, rājarājeśvarī, tripurasundarī, kāmeśvarī, bālā\nObjects: ikṣu-dhanuḥ (sugarcane bow), puṣpa-bāṇa (flower arrow), pāśa, aṅkuśa\nPlaces: śrīnagara, maṇidvīpa, cintāmaṇi-gṛha\nConsort: kāmeśvara\n\n### Sarasvatī\nCore: vāgdevī, bhāratī, śāradā, vāṇī, vāgīśvarī\nObjects: vīṇā, pustaka, akṣamālā, kamaṇḍalu\nColor: śveta (white)\nVehicle: haṃsa\n\n### Gaṇeśa\nCore: gaṇapati, vighneśvara, lambodara, ekadanta, gajanāna\nObjects: modaka, paraśu, pāśa, aṅkuśa, danta\nVehicle: mūṣaka (mouse)\n\n### Hanumān\nCore: mārutātmaja, vāyuputra, añjanīsuta, rāmadāsa, pavananandana\nFeats: laṅkā-dāha, sañjīvanī, samudra-laṅghana, sītā-anveṣaṇa\n\n### Sūrya\nCore: āditya, bhāskara, divākara, savitā, prabhākara\nObjects: ratha, saptāśva (7 horses), prabhā-maṇḍala\nConsorts: chāyā, saṃjñā\n", "workbook-questions": "# Stage 30: Multi-devatā — Workbook (Questions)\n\n## Section A: Eight Darśanas (40 marks)\nCompose ONE pāda (8 syllables) for each deity. Time yourself — total should be under 5 minutes.\n\n1. Śiva: ___ (time: ___s)\n2. Devī/Durgā: ___ (time: ___s)\n3. Kṛṣṇa: ___ (time: ___s)\n4. Sarasvatī: ___ (time: ___s)\n5. Gaṇeśa: ___ (time: ___s)\n6. Rāma: ___ (time: ___s)\n7. Hanumān: ___ (time: ___s)\n8. Sūrya: ___ (time: ___s)\n\nTotal time: ___\n\n## Section B: Contamination Check (10 marks)\nReview your pādas above. For each, verify that NO vocabulary from another deity's world has leaked in. Mark any contamination:\n1-8: clean? ___\n\n## Section C: Rapid Switching (10 marks)\nYour teacher calls deity names randomly. For each, produce a fresh pāda (not reusing any from Section A):\n1. Call: \"Gaṇeśa\" → ___\n2. Call: \"Śiva\" → ___\n3. Call: \"Kṛṣṇa\" → ___\n4. Call: \"Sarasvatī\" → ___\n5. Call: \"Durgā\" → ___\n\n---\n\n**Total: 60 marks**\n", "workbook-answers": "# Stage 30: Multi-devatā — Workbook (Answers)\n\n## Scoring Guide\n\n### Section A (5 marks each):\n- Correct meter (8 syllables) = 2\n- Deity-appropriate vocabulary = 2\n- No contamination from other deity worlds = 1\n\n### Time Benchmarks:\n- Under 3 minutes total = excellent\n- Under 5 minutes = good\n- Under 8 minutes = developing\n\n### Sample Responses:\n1. Śiva: **bhajāmi śambhuṃ satatam** (∪–∪––∪∪–)\n2. Durgā: **mahiṣāntakīṃ bhaje** (adjust to 8)\n3. Kṛṣṇa: **govindam veṇuvādinam** (–––∪∪–∪–)\n4. Sarasvatī: **vīṇāpustakdhāriṇīm** (–––∪∪–∪–)\n5. Gaṇeśa: **siddhidaṃ vandāmahe** (check count)\n6. Rāma: **kodaṇḍadharaṃ rāmam** (–––∪∪––)\n7. Hanumān: **vāyuputraṃ namāmy aham** (–∪∪∪–∪∪–)\n8. Sūrya: **bhāskaraṃ praṇamāmy aham** (–∪∪∪∪∪–∪–)\n\n### Section B:\nCheck each pāda for: Kṛṣṇa words in Śiva verse? Śiva items in Devī verse? If clean, award 1-2 marks per pāda.\n\n### Section C:\nSame scoring as Section A. Additional challenge: must be DIFFERENT pādas from what you composed in Section A.\n\n---\n\n**Total: 60 marks**\n"}, "tabs": ["theory", "reference", "workbook-questions", "workbook-answers"]}, {"id": "31-ashtavadhana", "number": 31, "title": "Ashtavadhana", "subtitle": "Integrated Attention", "files": {"theory": "# Stage 31: Aṣṭāvadhāna — Integrated Attention (Eight Offerings)\n\n## Goal\nComplete a simulated Aṣṭāvadhāna — managing eight simultaneous challenges from eight pṛcchakas, producing correct compositions under all constraints.\n\n## What is Aṣṭāvadhāna?\n\n**Aṣṭa** = eight. **Avadhāna** = attention/concentration. Eight pṛcchakas (questioners) each give you a different challenge. You cycle through them in rounds, attending to each briefly, then moving to the next — holding all eight threads simultaneously.\n\n## The Eight Challenges (Traditional)\n\n| # | Challenge | Skill Tested |\n|---|-----------|-------------|\n| 1 | **Samasyāpūraṇa** | Given a pāda, complete the verse | Backwards composition |\n| 2 | **Dattapadī** | Four given words to integrate | Lexical creativity |\n| 3 | **Niṣiddhākṣarī** | Compose without a forbidden letter | Phonological control |\n| 4 | **Āśu-kavitva** | Compose on a given theme/deity | Speed composition |\n| 5 | **Vācana (Kathā)** | Listen to a story, answer questions later | Auditory memory |\n| 6 | **Gaṇanā** | Count bells/claps while composing | Divided attention |\n| 7 | **Aprastuta-prasaṅga** | Answer off-topic questions | Wit + memory |\n| 8 | **Vyatyasta (Citra)** | Additional constraint (specific meter, etc.) | Multi-constraint |\n\n## The Round Structure\n\n### Round 1:\n- Pṛcchaka 1: Gives the samasya pāda → you compose pāda (a)\n- Pṛcchaka 2: Gives 4 words → you compose line 1\n- Pṛcchaka 3: States forbidden letter → you compose pāda (a) without it\n- Pṛcchaka 4: States theme → you compose pāda (a)\n- Pṛcchaka 5: Reads part of a story → you listen\n- Pṛcchaka 6: Rings bell → you start counting\n- Pṛcchaka 7: Asks a question → you answer\n- Pṛcchaka 8: States additional constraint → you compose pāda (a)\n\n### Rounds 2-4: Continue each composition, adding one pāda per round.\n\n### Final: Present all compositions + answer story questions + report bell count.\n\n## Simulated Aṣṭāvadhāna Exercise\n\n### Challenge 1 (Samasyāpūraṇa):\nGiven pāda (d): **viṣaṃ pītvā sukhī bhavat**\nComplete the remaining 3 pādas across rounds.\n\n### Challenge 2 (Dattapadī):\nGiven words: **padma, megha, agni, sindhu**\nCompose a 4-line verse, one line per round.\n\n### Challenge 3 (Niṣiddhākṣarī):\nForbidden letter: **na**\nCompose a 4-pāda praise of Śiva, no \"na\" anywhere.\n\n### Challenge 4 (Āśu-kavitva):\nTheme: Praise of the Guru\nCompose a 4-pāda śloka, one pāda per round.\n\n### Challenge 5 (Kathā):\nA short story will be read to you. Answer 3 questions about it at the end.\n\n### Challenge 6 (Gaṇanā):\nA bell will ring at random intervals during each round. Report the total at the end.\n\n### Challenge 7 (Aprastuta-prasaṅga):\nRandom questions will be asked during each round.\n\n### Challenge 8 (Citra):\nCompose a verse to Devī in Indravajrā meter (11 syllables per pāda).\n\n## Mental Management\n\n### Partition Strategy\nDivide your mind into 8 \"slots.\" Each slot holds:\n- The current state (what pāda am I on?)\n- The constraint (what rules apply?)\n- The content so far (what have I composed?)\n\n### Priority\nFocus on the hardest challenges (samasyāpūraṇa, niṣiddhākṣarī) first. Easier ones (gaṇanā, aprastuta) can run in background.\n\n## Milestone Check\nCan you complete a simulated Aṣṭāvadhāna with all 8 challenges?\n", "reference": "# Stage 31: Aṣṭāvadhāna — Reference Guide\n\n## 8-Slot Tracking Sheet\n\n| Slot | Challenge | Constraint | Pāda a | Pāda b | Pāda c | Pāda d | Status |\n|------|-----------|-----------|--------|--------|--------|--------|--------|\n| 1 | Samasyā | given pāda = d | | | | [given] | |\n| 2 | Dattapadī | words: _,_,_,_ | | | | | |\n| 3 | Niṣiddha | no letter: _ | | | | | |\n| 4 | Āśu | theme: _ | | | | | |\n| 5 | Kathā | listen + remember | notes: | | | | |\n| 6 | Gaṇanā | count: _ | tally: | | | | |\n| 7 | Aprastuta | Q&A | answers: | | | | |\n| 8 | Citra | meter: _ + deity: _ | | | | | |\n\n## Round-by-Round Process\n\n```\nROUND 1: Compose pāda (a) for slots 1,2,3,4,8\n         Listen to story segment (slot 5)\n         Start bell count (slot 6)\n         Answer question (slot 7)\n\nROUND 2: Compose pāda (b) for slots 1,2,3,4,8\n         Listen to more story (slot 5)\n         Continue count (slot 6)\n         Answer question (slot 7)\n\nROUND 3: Compose pāda (c) for slots 1,2,3,4,8\n         Listen to final story segment (slot 5)\n         Continue count (slot 6)\n         Answer question (slot 7)\n\nROUND 4: Compose pāda (d) for slots 2,3,4,8\n         (Slot 1 pāda d was given)\n         Answer story questions (slot 5)\n         Report bell count (slot 6)\n         Final question (slot 7)\n```\n\n## Emergency Recovery\n\n| If you forget... | Do this... |\n|-----------------|-----------|\n| A pāda you composed | Recall the deity + rasa → reconstruct |\n| The bell count | Give your best estimate with confidence |\n| A story detail | Answer what you can, acknowledge gaps |\n| A constraint | Ask the pṛcchaka to repeat (costs dignity but saves accuracy) |\n\n## Scoring Criteria (Traditional)\n\n| Component | Weight |\n|-----------|--------|\n| Samasyāpūraṇa completed meaningfully | 15% |\n| Dattapadī — all 4 words naturally integrated | 15% |\n| Niṣiddhākṣarī — zero violations | 15% |\n| Āśu-kavitva — correct and beautiful | 10% |\n| Kathā — questions answered correctly | 10% |\n| Gaṇanā — exact count | 10% |\n| Aprastuta — witty and correct | 10% |\n| Citra — meter + constraints met | 15% |\n", "workbook-questions": "# Stage 31: Aṣṭāvadhāna — Workbook (Simulated Test)\n\n## Instructions\nThis is a simulated Aṣṭāvadhāna. Work through the 4 rounds sequentially. For each round, attend to all 8 challenges in order. Do NOT look back at previous rounds while working on the current one.\n\n---\n\n## CHALLENGES ANNOUNCED:\n\n1. **Samasyāpūraṇa** — Given pāda (d): **jalāt jātaṃ jale sthitam** (\"born from water, situated in water\")\n2. **Dattapadī** — Required words: **siṃha, kamala, vāyu, kāñcana** (lion, lotus, wind, gold)\n3. **Niṣiddhākṣarī** — Forbidden letter: **ma** (म). Compose praise of Devī without \"ma\".\n4. **Āśu-kavitva** — Theme: \"The Guru's grace.\" Compose an anuṣṭubh śloka.\n5. **Kathā** — Read this story ONCE, then answer questions at the end:\n   > purā ekasmin vane munir vasiṣṭhaḥ tapasyām akarot. tasya āśrame ekā dhenuḥ kāmadhenuḥ nāma āsīt. sā sarvaṃ dadāti sma. ekadā rājā viśvāmitraḥ āgacchat. saḥ dhenūm aicchat. muniḥ na adadāt. tadā yuddhm abhavat. viśvāmitraḥ parājitaḥ abhavat. saḥ kṣatriyabalaṃ tyaktvā tapasyāṃ akarot. evaṃ saḥ brahmarṣiḥ abhavat.\n6. **Gaṇanā** — Count the word \"ca\" in this passage: \"śivaś ca viṣṇuś ca brahmā ca indraś ca agniś ca vāyuś ca sūryaś ca candraś ca\" → total: ___\n7. **Aprastuta** — Questions will appear in each round.\n8. **Citra** — Compose a verse to Kṛṣṇa where each pāda begins with the same syllable \"go\" (go-vinda, go-pāla, etc.)\n\n---\n\n## ROUND 1\n\n**Challenge 1:** Compose pāda (a) for the samasyā: ___\n**Challenge 2:** Compose line 1 using \"siṃha\": ___\n**Challenge 3:** Compose pāda (a) praising Devī, no \"ma\": ___\n**Challenge 4:** Compose pāda (a) on guru's grace: ___\n**Challenge 7 — INTERRUPTION:** Name the author of Raghuvaṃśa: ___\n**Challenge 8:** Compose pāda (a) starting with \"go\": ___\n\n---\n\n## ROUND 2\n\n**Challenge 1:** Compose pāda (b): ___\n**Challenge 2:** Line 2 using \"kamala\": ___\n**Challenge 3:** Pāda (b), no \"ma\": ___\n**Challenge 4:** Pāda (b) on guru: ___\n**Challenge 7 — INTERRUPTION:** What is 19 × 4? ___\n**Challenge 8:** Pāda (b) starting with \"go\": ___\n\n---\n\n## ROUND 3\n\n**Challenge 1:** Compose pāda (c): ___\n**Challenge 2:** Line 3 using \"vāyu\": ___\n**Challenge 3:** Pāda (c), no \"ma\": ___\n**Challenge 4:** Pāda (c) on guru: ___\n**Challenge 7 — INTERRUPTION:** Which Veda is Gāyatrī mantra from? ___\n**Challenge 8:** Pāda (c) starting with \"go\": ___\n\n---\n\n## ROUND 4\n\n**Challenge 1:** (pāda d is given: jalāt jātaṃ jale sthitam)\n**Challenge 2:** Line 4 using \"kāñcana\": ___\n**Challenge 3:** Pāda (d), no \"ma\": ___\n**Challenge 4:** Pāda (d) on guru: ___\n**Challenge 5 — STORY QUESTIONS:**\n   1. What was the cow's name? ___\n   2. Who wanted the cow? ___\n   3. What did Viśvāmitra become at the end? ___\n**Challenge 6:** Count of \"ca\": ___\n**Challenge 8:** Pāda (d) starting with \"go\": ___\n\n---\n\n## FINAL PRESENTATION\nWrite all completed compositions below:\n\n**1. Samasyāpūraṇa (complete śloka):**\n\n**2. Dattapadī (complete verse):**\n\n**3. Niṣiddhākṣarī (complete verse, no \"ma\"):**\n\n**4. Āśu-kavitva (guru-kṛpā śloka):**\n\n**8. Citra (go- verse for Kṛṣṇa):**\n\n---\n\n**Total: 60 marks**\n", "workbook-answers": "# Stage 31: Aṣṭāvadhāna — Workbook (Answers)\n\n## Scoring Rubric\n\n### Challenge 1 — Samasyāpūraṇa (10 marks)\n- Verse is coherent and the given pāda fits naturally:
