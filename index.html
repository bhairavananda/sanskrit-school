<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>tantrikk sanskrit</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
:root {
  --bg: #0f0f17;
  --bg-secondary: #151520;
  --bg-card: #1c1c2e;
  --bg-card-hover: #25253d;
  --text: #f0eef5;
  --text-muted: #9b95b0;
  --text-dim: #605a75;
  --accent: #ff6b4a;
  --accent-glow: #ff6b4a20;
  --accent-secondary: #ffa63e;
  --border: #2a2940;
  --code-bg: #0a0a12;
  --table-header: #1a1a2c;
  --table-row-alt: #131320;
  --scrollbar-thumb: #3d3a55;
  --sidebar-width: 300px;
  --link: #64d2ff;
  --green: #34d399;
  --red: #f87171;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Georgia', 'Palatino', serif;
  background: var(--bg);
  color: var(--text);
  display: flex;
  height: 100vh;
  overflow: hidden;
}

::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: var(--bg-secondary); }
::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 4px; }

/* ── Sidebar ── */
.sidebar {
  width: var(--sidebar-width);
  min-width: var(--sidebar-width);
  background: var(--bg-secondary);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
}

.sidebar-header {
  padding: 24px 20px 16px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.sidebar-header h1 {
  font-size: 20px;
  color: var(--accent);
  letter-spacing: 1px;
  font-weight: normal;
}

.sidebar-header p {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 4px;
  letter-spacing: 0.5px;
}

.sidebar-search {
  padding: 12px 16px;
  flex-shrink: 0;
}

.sidebar-search input {
  width: 100%;
  padding: 8px 12px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  font-size: 13px;
  font-family: 'Georgia', serif;
  outline: none;
}

.sidebar-search input:focus { border-color: var(--accent); }
.sidebar-search input::placeholder { color: var(--text-dim); }

/* Section toggles */
.section-toggle {
  padding: 12px 20px;
  display: flex;
  gap: 8px;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border);
}

.section-btn {
  flex: 1;
  padding: 7px 0;
  text-align: center;
  font-size: 12px;
  font-family: 'Menlo', monospace;
  letter-spacing: 0.5px;
  border-radius: 5px;
  cursor: pointer;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-muted);
  transition: all 0.15s;
}

.section-btn.active {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}

.section-btn:hover:not(.active) {
  border-color: var(--accent);
  color: var(--text);
}

.stage-list {
  flex: 1;
  overflow-y: auto;
  padding: 8px 0;
}

.stage-item {
  padding: 10px 20px;
  cursor: pointer;
  border-left: 3px solid transparent;
  transition: all 0.15s;
  display: flex;
  align-items: baseline;
  gap: 10px;
}

.stage-item:hover { background: var(--bg-card); }

.stage-item.active {
  background: var(--bg-card);
  border-left-color: var(--accent);
}

.stage-item.hidden { display: none; }

.stage-num {
  font-size: 11px;
  color: var(--text-dim);
  min-width: 22px;
  font-family: 'Menlo', monospace;
}

.stage-info { flex: 1; min-width: 0; }

.stage-title { font-size: 14px; color: var(--text); }
.active .stage-title { color: var(--accent); }

.stage-subtitle {
  font-size: 11px;
  color: var(--text-dim);
  margin-top: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.phase-label {
  padding: 16px 20px 6px;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  color: var(--text-dim);
  font-family: 'Menlo', monospace;
}

/* ── Main ── */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.tab-bar {
  display: flex;
  padding: 0 32px;
  border-bottom: 1px solid var(--border);
  background: var(--bg-secondary);
  flex-shrink: 0;
  overflow-x: auto;
}

.tab {
  padding: 14px 24px;
  font-size: 13px;
  color: var(--text-muted);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: all 0.15s;
  font-family: 'Menlo', monospace;
  letter-spacing: 0.5px;
  white-space: nowrap;
}

.tab:hover { color: var(--text); background: var(--bg-card); }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); }

.content-wrap {
  flex: 1;
  overflow-y: auto;
}

.content {
  max-width: 900px;
  margin: 0 auto;
  padding: 40px 48px 80px;
}

/* Table horizontal scroll */
.content .table-wrap {
  overflow-x: auto;
  margin: 16px 0;
}

/* Bottom nav */
.bottom-nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 48px;
  padding-top: 24px;
  border-top: 1px solid var(--border);
}

.nav-btn {
  padding: 10px 20px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text-muted);
  font-size: 13px;
  font-family: 'Georgia', serif;
  cursor: pointer;
  transition: all 0.15s;
  text-decoration: none;
}

.nav-btn:hover { border-color: var(--accent); color: var(--accent); }
.nav-btn.disabled { opacity: 0.3; pointer-events: none; }

.nav-btn .nav-label {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--text-dim);
  display: block;
  margin-bottom: 4px;
}

.nav-btn .nav-title { color: var(--accent); }

/* Progress bar under tab-bar */
.progress-bar {
  height: 2px;
  background: var(--border);
  flex-shrink: 0;
}

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--accent-secondary));
  transition: width 0.4s;
}

/* ── Markdown ── */
.content h1 { font-size: 28px; color: var(--accent); margin-bottom: 24px; font-weight: normal; line-height: 1.3; border-bottom: 1px solid var(--border); padding-bottom: 16px; }
.content h2 { font-size: 21px; color: var(--accent-secondary); margin-top: 40px; margin-bottom: 16px; font-weight: normal; }
.content h3 { font-size: 17px; margin-top: 28px; margin-bottom: 12px; font-weight: bold; }
.content h4 { font-size: 15px; color: var(--text-muted); margin-top: 20px; margin-bottom: 8px; font-weight: bold; }
.content p { font-size: 15px; line-height: 1.8; margin-bottom: 14px; }
.content ul, .content ol { margin-bottom: 14px; padding-left: 24px; }
.content li { font-size: 15px; line-height: 1.7; margin-bottom: 4px; }
.content blockquote { border-left: 3px solid var(--accent); padding: 12px 20px; margin: 16px 0; background: var(--accent-glow); border-radius: 0 6px 6px 0; font-style: italic; }
.content blockquote p { margin-bottom: 4px; }
.content code { background: var(--code-bg); padding: 2px 6px; border-radius: 3px; font-family: 'Menlo', monospace; font-size: 13px; color: var(--accent); }
.content pre { background: var(--code-bg); padding: 16px 20px; border-radius: 8px; overflow-x: auto; margin: 16px 0; border: 1px solid var(--border); }
.content pre code { background: none; padding: 0; font-size: 13px; line-height: 1.6; color: var(--text); }
.content table { width: 100%; border-collapse: collapse; margin: 16px 0; font-size: 14px; }
.content thead { background: var(--table-header); }
.content th { padding: 10px 14px; text-align: left; color: var(--accent); font-weight: normal; border-bottom: 2px solid var(--border); font-size: 13px; }
.content td { padding: 8px 14px; border-bottom: 1px solid var(--border); vertical-align: top; }
.content tbody tr:nth-child(even) { background: var(--table-row-alt); }
.content tbody tr:hover { background: var(--bg-card-hover); }
.content hr { border: none; border-top: 1px solid var(--border); margin: 32px 0; }
.content strong { color: var(--accent); font-weight: bold; }
.content a { color: var(--link); text-decoration: none; }
.content a:hover { text-decoration: underline; }

/* ── Flashcard ── */
.flashcard-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 40px 20px;
  max-width: 600px;
}

.fc-progress {
  font-size: 13px;
  color: var(--text-muted);
  font-family: 'Menlo', monospace;
  margin-bottom: 8px;
}

.fc-bar {
  width: 100%;
  height: 4px;
  background: var(--border);
  border-radius: 2px;
  margin-bottom: 32px;
  overflow: hidden;
}

.fc-bar-fill {
  height: 100%;
  background: var(--accent);
  border-radius: 2px;
  transition: width 0.3s;
}

.fc-card {
  width: 100%;
  min-height: 220px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 40px 32px;
  cursor: pointer;
  user-select: none;
  transition: border-color 0.2s;
  position: relative;
}

.fc-card:hover { border-color: var(--accent); }

.fc-term {
  font-size: 32px;
  color: var(--accent);
  text-align: center;
  line-height: 1.4;
}

.fc-hint {
  font-size: 12px;
  color: var(--text-dim);
  margin-top: 16px;
  font-family: 'Menlo', monospace;
}

.fc-meaning {
  font-size: 20px;
  color: var(--text);
  text-align: center;
  margin-top: 20px;
  line-height: 1.5;
  padding-top: 20px;
  border-top: 1px solid var(--border);
  width: 100%;
}

.fc-buttons {
  display: flex;
  gap: 16px;
  margin-top: 32px;
  width: 100%;
}

.fc-btn {
  flex: 1;
  padding: 14px 24px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--bg-card);
  color: var(--text);
  font-size: 14px;
  font-family: 'Georgia', serif;
  cursor: pointer;
  transition: all 0.15s;
  text-align: center;
}

.fc-btn:hover { border-color: var(--accent); }
.fc-btn.again { border-color: var(--red); color: var(--red); }
.fc-btn.again:hover { background: var(--red); color: white; }
.fc-btn.good { border-color: var(--green); color: var(--green); }
.fc-btn.good:hover { background: var(--green); color: white; }

.fc-score {
  display: flex;
  gap: 24px;
  margin-top: 20px;
  font-size: 13px;
  font-family: 'Menlo', monospace;
}

.fc-score span { color: var(--text-dim); }
.fc-score .g { color: var(--green); }
.fc-score .r { color: var(--red); }

.fc-done {
  text-align: center;
  padding: 60px 20px;
}

.fc-done h2 { color: var(--accent); font-weight: normal; margin-bottom: 16px; }
.fc-done p { color: var(--text-muted); margin-bottom: 24px; }

.fc-restart {
  padding: 12px 32px;
  background: var(--accent);
  color: var(--bg);
  border: none;
  border-radius: 8px;
  font-size: 14px;
  font-family: 'Georgia', serif;
  cursor: pointer;
}

.fc-restart:hover { opacity: 0.9; }

/* ── Mobile ── */
@media (max-width: 768px) {
  .sidebar { position: fixed; left: -100%; z-index: 100; width: 85vw; transition: left 0.3s; }
  .sidebar.open { left: 0; }
  .content { padding: 24px 20px 60px; }
  .tab { padding: 12px 16px; font-size: 12px; }
  .mobile-toggle { display: flex !important; }
}

.mobile-toggle {
  display: none;
  position: fixed;
  top: 12px;
  left: 12px;
  z-index: 200;
  background: var(--bg-card);
  border: 1px solid var(--border);
  color: var(--accent);
  width: 40px;
  height: 40px;
  border-radius: 8px;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: 20px;
}

.overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 50; }
.overlay.show { display: block; }
</style>
</head>

<div class="mobile-toggle" onclick="toggleSidebar()">&#9776;</div>
<div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

<nav class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <h1>tantrikk sanskrit</h1>
    <p>Beginner to Avadhani &middot; 32 Stages + Vocab</p>
  </div>

    <div class="section-btn active" onclick="showSection('lessons')">Lessons</div>
    <div class="section-btn" onclick="showSection('vocab')">Vocab</div>
  </div>
  <div class="sidebar-search">
    <input type="text" id="search" placeholder="Search..." oninput="filterItems(this.value)">
  </div>
  <div class="stage-list" id="stageList"></div>
</nav>

<main class="main">
  <div class="tab-bar" id="tabBar"></div>
  <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
  <div class="content-wrap" id="contentWrap">
    <div class="content" id="content">
      <p style="color: var(--text-muted); margin-top: 40px; text-align: center;">Select a stage from the sidebar to begin.</p>
    </div>
  </div>
</main>

<script>
const STAGES = [{"id": "00-overview", "number": 0, "title": "Overview", "subtitle": "From Beginner to Avadhani", "files": {"overview": "# Sanskrit School: From Beginner to Avadhānī\n\nA 32-stage syllabus integrating Sanskrit language acquisition with bhakti expression\nand classical poetic composition, culminating in Aṣṭāvadhāna competence.\n\n## Syllabus Map\n\n| # | Stage | Sanskrit Skill | Milestone |\n|---|-------|---------------|-----------|\n| 1 | Nāma | Basic vocabulary | Describe iṣṭadevatā with 20 words |\n| 2 | Guṇa | Adjectives | Generate 10 qualities spontaneously |\n| 3 | Rūpa | Case/number/gender | Decline devotional vocabulary actively |\n| 4 | Kriyā | Verbs | Describe one's own worship |\n| 5 | Kāraka | Semantic relations | Build complete devotional sentences |\n| 6 | Sambodhana | Direct address | Spontaneous prayer |\n| 7 | Dhātu | Roots/upasargas | See semantic architecture in sacred vocabulary |\n| 8 | Paryāya | Synonyms | Explain/build divine epithets |\n| 9 | Samāsa | Compounds | Invent grammatically valid epithets |\n| 10 | Vākya | Free composition | Think directly in Sanskrit |\n| 11 | Bhāva | Emotional vocabulary | Express inner states without English |\n| 12 | Stotra I | Accusative constructions | 4-line original praise |\n| 13 | Stotra II | Varied cases | Compose around one case intentionally |\n| 14 | Prārthanā | Requests/imperatives | Original Sanskrit prayer |\n| 15 | Kathā | Narration | 2-3 minute Sanskrit narration |\n| 16 | Chandas I | Syllables | Hear 8-syllable units |\n| 17 | Chandas II | Anuṣṭubh | Spontaneous anuṣṭubh |\n| 18 | Chandas III | Multiple meters | Compose in several meters |\n| 19 | Paryāya-Chandas | Lexical flexibility | Lexical search becomes automatic |\n| 20 | Alaṅkāra | Poetic ornament | Beautiful rather than merely correct verse |\n| 21 | Rasa | Emotional aesthetics | Consciously control devotional rasa |\n| 22 | Darśana | Philosophical expression | Philosophy becomes poetry |\n| 23 | Samasyāpūraṇa | Backwards composition | Derive context creatively |\n| 24 | Dattapadī | Forced vocabulary | Integrate arbitrary concepts naturally |\n| 25 | Niṣiddhākṣarī | Inhibition | Phonological control |\n| 26 | Citra-kāvya | Stacked constraints | Simultaneous constraint solving |\n| 27 | Dhāraṇā I | Interrupted memory | Hold unfinished compositions |\n| 28 | Dhāraṇā II | Associative retrieval | Retrieve poetic states from cues |\n| 29 | Aprastuta-prasaṅga | Wit/context switching | Attention becomes resilient |\n| 30 | Multi-devatā | Rapid semantic switching | Switch lexical/rasa worlds instantly |\n| 31 | Aṣṭāvadhāna | Integrated attention | Complete simulated Aṣṭāvadhāna |\n| 32 | Avadhāna-Sevā | Mastery | Avadhānī |\n\n## How to Use This Material\n\nEach stage folder contains four files:\n- **theory.md** — Concepts, explanations, and examples\n- **reference.md** — Quick-lookup tables, paradigms, and lists\n- **workbook-questions.md** — Exercises and prompts (no answers)\n- **workbook-answers.md** — Answer key for all exercises\n\nWork through stages sequentially. Each stage builds on the previous.\nMaster the milestone before moving on.\n"}, "tabs": ["overview"]}, {"id": "01-nama", "number": 1, "title": "Nama", "subtitle": "Basic Vocabulary", "files": {"theory": "# Stage 1: Nāma — Basic Vocabulary\n\n## Goal\nLearn foundational Sanskrit nouns related to devotion, deity forms, pūjā items, and sacred qualities. By the end, you should be able to describe your iṣṭadevatā using at least 20 words.\n\n## What is a Nāma?\n\nIn Sanskrit, **nāma** (नाम) means \"name\" or \"noun.\" Every object, deity, quality, and concept has a nāma. Sanskrit nouns have three properties:\n- **Liṅga** (gender): puṃliṅga (masculine), strīliṅga (feminine), napuṃsakaliṅga (neuter)\n- **Vacana** (number): ekavacana (singular), dvivacana (dual), bahuvacana (plural)\n- **Vibhakti** (case): prathamā (nominative) is the basic \"naming\" form\n\nAt this stage, we only learn words in their **prathamā ekavacana** (nominative singular) form — the dictionary form.\n\n## Gender Patterns\n\nMost Sanskrit nouns follow predictable gender patterns:\n\n| Ending | Typical Gender | Examples |\n|--------|---------------|----------|\n| -aḥ | Masculine | devaḥ, śivaḥ, puṣpaḥ |\n| -ā | Feminine | devī → but also: latā, mālā, gaṅgā |\n| -am | Neuter | phalam, jalam, dhāma |\n| -ī | Feminine | devī, nadī, lakṣmī |\n\nNote: These are tendencies, not absolute rules.\n\n## Core Vocabulary Categories\n\n### 1. Deities (Devatāḥ)\n- **śivaḥ** (शिवः) — the auspicious one, Śiva\n- **viṣṇuḥ** (विष्णुः) — the all-pervading, Viṣṇu\n- **devī** (देवी) — the goddess\n- **gaṇeśaḥ** (गणेशः) — lord of the gaṇas\n- **sarasvatī** (सरस्वती) — goddess of knowledge\n- **lakṣmī** (लक्ष्मी) — goddess of prosperity\n- **kṛṣṇaḥ** (कृष्णः) — the dark one, Kṛṣṇa\n- **rāmaḥ** (रामः) — Rāma\n- **hanumān** (हनुमान्) — Hanumān\n- **sūryaḥ** (सूर्यः) — the sun deity\n\n### 2. Body and Form (Śarīram)\n- **mukham** (मुखम्) — face\n- **netraṃ** (नेत्रम्) — eye\n- **karaḥ** (करः) — hand\n- **pādaḥ** (पादः) — foot\n- **śiraḥ** (शिरः) — head\n- **hṛdayam** (हृदयम्) — heart\n- **kaṇṭhaḥ** (कण्ठः) — throat\n- **jaṭā** (जटा) — matted locks\n\n### 3. Pūjā Items (Pūjā-sāmagrī)\n- **puṣpam** (पुष्पम्) — flower\n- **dhūpaḥ** (धूपः) — incense\n- **dīpaḥ** (दीपः) — lamp\n- **naivedyam** (नैवेद्यम्) — food offering\n- **jalam** (जलम्) — water\n- **candanam** (चन्दनम्) — sandalwood paste\n- **akṣatāḥ** (अक्षताः) — unbroken rice\n- **camphor** → **karpūram** (कर्पूरम्)\n- **mālā** (माला) — garland\n- **pātraṃ** (पात्रम्) — vessel\n\n### 4. Sacred Objects and Places\n- **mandiraṃ** (मन्दिरम्) — temple\n- **mūrtiḥ** (मूर्तिः) — image, form\n- **yantraṃ** (यन्त्रम्) — sacred diagram\n- **ghaṇṭā** (घण्टा) — bell\n- **āsanam** (आसनम्) — seat\n- **śaṅkhaḥ** (शङ्खः) — conch\n- **rudrākṣaḥ** (रुद्राक्षः) — rudrākṣa bead\n- **liṅgam** (लिङ्गम्) — the Śiva-liṅga\n- **padmam** (पद्मम्) — lotus\n- **nadī** (नदी) — river\n\n### 5. Nature and Cosmos\n- **sūryaḥ** (सूर्यः) — sun\n- **candraḥ** (चन्द्रः) — moon\n- **agniḥ** (अग्निः) — fire\n- **vāyuḥ** (वायुः) — wind\n- **ākāśaḥ** (आकाशः) — sky/space\n- **pṛthivī** (पृथिवी) — earth\n- **jalam** (जलम्) — water\n- **parvatah** (पर्वतः) — mountain\n- **vanam** (वनम्) — forest\n- **tārakā** (तारका) — star\n\n## The Game: \"Name the Divine\"\n\nPractice by looking at an image of your iṣṭadevatā and naming everything you see:\n- What is the deity holding? (triśūlam, padmam, veṇuḥ…)\n- What is the deity wearing? (mālā, vasanam…)\n- What surrounds the deity? (agniḥ, padmam, parvatah…)\n- What qualities does the deity embody? (preview of Stage 2)\n\n## Key Principle: Nāma as Mantra\n\nIn the bhakti tradition, the name itself carries śakti. Learning nāma is not merely vocabulary acquisition — it is the first act of recognition. When you say \"śivaḥ,\" you are not labeling an object; you are invoking a presence.\n\n## Milestone Check\n\nCan you describe your iṣṭadevatā using 20 Sanskrit words?\nExample for Śiva:\n> śivaḥ, triśūlam, ḍamaruḥ, jaṭā, candraḥ, sarpaḥ, gaṅgā, nandī, bhasm, netraṃ, kaṇṭhaḥ, nīlaḥ (preview), parvatah, himālayaḥ, liṅgam, rudrākṣaḥ, agniḥ, vṛṣabhaḥ, ākāśaḥ, pādaḥ\n", "reference": "# Stage 1: Nāma — Reference Guide\n\n## Quick Gender Identification\n\n| Ending | Gender | Example |\n|--------|--------|---------|\n| -aḥ | M | devaḥ, śivaḥ |\n| -am | N | phalam, jalam |\n| -ā | F | mālā, gaṅgā |\n| -ī | F | devī, nadī |\n| -uḥ | M | viṣṇuḥ, vāyuḥ |\n| -iḥ | M/F | agniḥ (M), mūrtiḥ (F) |\n\n## Master Vocabulary List (80 words)\n\n### Deities\n| Sanskrit | Devanāgarī | Meaning | Gender |\n|----------|-----------|---------|--------|\n| śivaḥ | शिवः | Śiva | M |\n| viṣṇuḥ | विष्णुः | Viṣṇu | M |\n| brahmā | ब्रह्मा | Brahmā | M |\n| devī | देवी | goddess | F |\n| gaṇeśaḥ | गणेशः | Gaṇeśa | M |\n| sarasvatī | सरस्वती | Sarasvatī | F |\n| lakṣmī | लक्ष्मी | Lakṣmī | F |\n| pārvatī | पार्वती | Pārvatī | F |\n| kṛṣṇaḥ | कृष्णः | Kṛṣṇa | M |\n| rāmaḥ | रामः | Rāma | M |\n| hanumān | हनुमान् | Hanumān | M |\n| sūryaḥ | सूर्यः | Sūrya | M |\n| durgā | दुर्गा | Durgā | F |\n| skanda | स्कन्दः | Skanda | M |\n| indraḥ | इन्द्रः | Indra | M |\n\n### Body Parts\n| Sanskrit | Devanāgarī | Meaning | Gender |\n|----------|-----------|---------|--------|\n| mukham | मुखम् | face | N |\n| netram | नेत्रम् | eye | N |\n| karaḥ | करः | hand | M |\n| pādaḥ | पादः | foot | M |\n| śiraḥ | शिरः | head | N |\n| hṛdayam | हृदयम् | heart | N |\n| kaṇṭhaḥ | कण्ठः | throat | M |\n| jaṭā | जटा | matted locks | F |\n| keśaḥ | केशः | hair | M |\n| aṅgam | अङ्गम् | limb | N |\n\n### Pūjā Items\n| Sanskrit | Devanāgarī | Meaning | Gender |\n|----------|-----------|---------|--------|\n| puṣpam | पुष्पम् | flower | N |\n| dhūpaḥ | धूपः | incense | M |\n| dīpaḥ | दीपः | lamp | M |\n| naivedyam | नैवेद्यम् | food offering | N |\n| jalam | जलम् | water | N |\n| candanam | चन्दनम् | sandalwood | N |\n| akṣatāḥ | अक्षताः | unbroken rice | M (pl) |\n| karpūram | कर्पूरम् | camphor | N |\n| mālā | माला | garland | F |\n| pātram | पात्रम् | vessel | N |\n| tīrtham | तीर्थम् | holy water | N |\n| vibhūtiḥ | विभूतिः | sacred ash | F |\n| kuṅkumam | कुङ्कुमम् | vermillion | N |\n| bilvapatram | बिल्वपत्रम् | bilva leaf | N |\n| tulasī | तुलसी | tulasī plant | F |\n\n### Sacred Objects & Places\n| Sanskrit | Devanāgarī | Meaning | Gender |\n|----------|-----------|---------|--------|\n| mandiram | मन्दिरम् | temple | N |\n| mūrtiḥ | मूर्तिः | image/form | F |\n| yantram | यन्त्रम् | sacred diagram | N |\n| ghaṇṭā | घण्टा | bell | F |\n| āsanam | आसनम् | seat | N |\n| śaṅkhaḥ | शङ्खः | conch | M |\n| rudrākṣaḥ | रुद्राक्षः | rudrākṣa | M |\n| liṅgam | लिङ्गम् | Śiva-liṅga | N |\n| padmam | पद्मम् | lotus | N |\n| nadī | नदी | river | F |\n| kṣetram | क्षेत्रम् | sacred field | N |\n| garbhagṛham | गर्भगृहम् | sanctum | N |\n| dhvajam | ध्वजम् | flag/banner | N |\n| prākāraḥ | प्राकारः | boundary wall | M |\n| gopuram | गोपुरम् | temple tower | N |\n\n### Nature & Cosmos\n| Sanskrit | Devanāgarī | Meaning | Gender |\n|----------|-----------|---------|--------|\n| sūryaḥ | सूर्यः | sun | M |\n| candraḥ | चन्द्रः | moon | M |\n| agniḥ | अग्निः | fire | M |\n| vāyuḥ | वायुः | wind | M |\n| ākāśaḥ | आकाशः | sky/space | M |\n| pṛthivī | पृथिवी | earth | F |\n| parvataḥ | पर्वतः | mountain | M |\n| vanam | वनम् | forest | N |\n| tārakā | तारका | star | F |\n| samudraḥ | समुद्रः | ocean | M |\n| meghaḥ | मेघः | cloud | M |\n| vṛkṣaḥ | वृक्षः | tree | M |\n| kusumam | कुसुमम् | flower | N |\n| phaṇī | फणी | serpent | M |\n| vṛṣabhaḥ | वृषभः | bull | M |\n\n### Deity Attributes (Objects)\n| Sanskrit | Devanāgarī | Meaning | Gender |\n|----------|-----------|---------|--------|\n| triśūlam | त्रिशूलम् | trident | N |\n| ḍamaruḥ | डमरुः | drum | M |\n| cakram | चक्रम् | discus | N |\n| gadā | गदा | mace | F |\n| dhanuḥ | धनुः | bow | N |\n| bāṇaḥ | बाणः | arrow | M |\n| veṇuḥ | वेणुः | flute | M |\n| vīṇā | वीणा | vīṇā | F |\n| vajram | वज्रम् | thunderbolt | N |\n| paraśuḥ | परशुः | axe | M |\n\n## Pronunciation Key\n\n| Symbol | Sound | Example |\n|--------|-------|---------|\n| ā | long \"a\" as in \"father\" | mālā |\n| ī | long \"ee\" | devī |\n| ū | long \"oo\" | pūjā |\n| ṛ | a short rolled \"ri\" | kṛṣṇa |\n| ṃ | nasal (anusvāra) | puṣpaṃ |\n| ḥ | breath (visarga) | śivaḥ |\n| ś | \"sh\" (palatal) | śiva |\n| ṣ | \"sh\" (retroflex) | viṣṇu |\n| ṭ, ḍ, ṇ | retroflex | gaṇeśa |\n| c | \"ch\" as in \"church\" | candra |\n", "workbook-questions": "# Stage 1: Nāma — Workbook (Questions)\n\n## Section A: Identification (10 marks)\n\n**A1.** Give the Sanskrit word for each of the following (5 marks):\n1. Flower\n2. Lamp\n3. Water\n4. Moon\n5. Temple\n\n**A2.** Identify the gender (M/F/N) of each word (5 marks):\n1. puṣpam\n2. devī\n3. śivaḥ\n4. mālā\n5. netram\n\n---\n\n## Section B: Categorization (10 marks)\n\n**B1.** Sort the following words into the correct category — Deity, Pūjā Item, Body Part, or Nature (8 marks):\n\n> agniḥ, candanam, gaṇeśaḥ, hṛdayam, jalam, lakṣmī, mukham, parvataḥ\n\n| Deity | Pūjā Item | Body Part | Nature |\n|-------|-----------|-----------|--------|\n| | | | |\n\n**B2.** Which two of these words are neuter gender? (2 marks):\n> śivaḥ, padmam, devī, āsanam, nadī\n\n---\n\n## Section C: Matching (10 marks)\n\n**C1.** Match each deity to their associated object (5 marks):\n\n| Deity | Object |\n|-------|--------|\n| 1. Śiva | a. cakram |\n| 2. Viṣṇu | b. vīṇā |\n| 3. Sarasvatī | c. vajram |\n| 4. Kṛṣṇa | d. triśūlam |\n| 5. Indra | e. veṇuḥ |\n\n**C2.** Match the Sanskrit to its meaning (5 marks):\n\n| Sanskrit | Meaning |\n|----------|---------|\n| 1. ghaṇṭā | a. sacred ash |\n| 2. śaṅkhaḥ | b. bell |\n| 3. vibhūtiḥ | c. garland |\n| 4. mālā | d. conch |\n| 5. karpūram | e. camphor |\n\n---\n\n## Section D: Gender Patterns (10 marks)\n\n**D1.** Predict the likely gender based on the ending (5 marks):\n1. phalam (-am)\n2. gaṅgā (-ā)\n3. rāmaḥ (-aḥ)\n4. tulasī (-ī)\n5. vanam (-am)\n\n**D2.** Give one example word for each gender from memory (5 marks):\n1. Masculine (-aḥ ending): ___\n2. Feminine (-ā ending): ___\n3. Feminine (-ī ending): ___\n4. Neuter (-am ending): ___\n5. Masculine (-uḥ ending): ___\n\n---\n\n## Section E: Description Challenge (10 marks)\n\n**E1.** List 10 Sanskrit words you would use to describe Gaṇeśa's form and surroundings (5 marks):\n\n1. ___  2. ___  3. ___  4. ___  5. ___\n6. ___  7. ___  8. ___  9. ___  10. ___\n\n**E2.** List 10 Sanskrit words for items you would use in a pūjā (5 marks):\n\n1. ___  2. ___  3. ___  4. ___  5. ___\n6. ___  7. ___  8. ___  9. ___  10. ___\n\n---\n\n## Section F: Milestone Exercise (10 marks)\n\n**F1.** Choose your iṣṭadevatā. Write their name and then list 20 Sanskrit nouns that describe their form, attributes, surroundings, and associated pūjā items:\n\nIṣṭadevatā: ___\n\n1. ___  2. ___  3. ___  4. ___  5. ___\n6. ___  7. ___  8. ___  9. ___  10. ___\n11. ___ 12. ___ 13. ___ 14. ___ 15. ___\n16. ___ 17. ___ 18. ___ 19. ___ 20. ___\n\n---\n\n**Total: 60 marks**\n", "workbook-answers": "# Stage 1: Nāma — Workbook (Answers)\n\n## Section A: Identification\n\n**A1.**\n1. Flower → **puṣpam**\n2. Lamp → **dīpaḥ**\n3. Water → **jalam**\n4. Moon → **candraḥ**\n5. Temple → **mandiram**\n\n**A2.**\n1. puṣpam → **Neuter** (ends in -am)\n2. devī → **Feminine** (ends in -ī)\n3. śivaḥ → **Masculine** (ends in -aḥ)\n4. mālā → **Feminine** (ends in -ā)\n5. netram → **Neuter** (ends in -am)\n\n---\n\n## Section B: Categorization\n\n**B1.**\n\n| Deity | Pūjā Item | Body Part | Nature |\n|-------|-----------|-----------|--------|\n| gaṇeśaḥ | candanam | hṛdayam | agniḥ |\n| lakṣmī | jalam | mukham | parvataḥ |\n\n**B2.** The two neuter words are: **padmam** and **āsanam** (both end in -am)\n\n---\n\n## Section C: Matching\n\n**C1.**\n1. Śiva → **d. triśūlam**\n2. Viṣṇu → **a. cakram**\n3. Sarasvatī → **b. vīṇā**\n4. Kṛṣṇa → **e. veṇuḥ**\n5. Indra → **c. vajram**\n\n**C2.**\n1. ghaṇṭā → **b. bell**\n2. śaṅkhaḥ → **d. conch**\n3. vibhūtiḥ → **a. sacred ash**\n4. mālā → **c. garland**\n5. karpūram → **e. camphor**\n\n---\n\n## Section D: Gender Patterns\n\n**D1.**\n1. phalam (-am) → **Neuter**\n2. gaṅgā (-ā) → **Feminine**\n3. rāmaḥ (-aḥ) → **Masculine**\n4. tulasī (-ī) → **Feminine**\n5. vanam (-am) → **Neuter**\n\n**D2.** (Sample answers — any correct example accepted)\n1. Masculine (-aḥ): **devaḥ** (or śivaḥ, candraḥ, dīpaḥ, etc.)\n2. Feminine (-ā): **mālā** (or gaṅgā, gadā, ghaṇṭā, etc.)\n3. Feminine (-ī): **devī** (or nadī, lakṣmī, tulasī, etc.)\n4. Neuter (-am): **jalam** (or phalam, puṣpam, mandiram, etc.)\n5. Masculine (-uḥ): **viṣṇuḥ** (or vāyuḥ, veṇuḥ, etc.)\n\n---\n\n## Section E: Description Challenge\n\n**E1.** Gaṇeśa — sample answer:\n1. gaṇeśaḥ  2. mukham  3. karaḥ  4. modakam (sweet)  5. paraśuḥ\n6. mūṣakaḥ (mouse)  7. padmam  8. udaram (belly)  9. dantaḥ (tusk)  10. mālā\n\nAccept any 10 valid nouns reasonably associated with Gaṇeśa.\n\n**E2.** Pūjā items — sample answer:\n1. puṣpam  2. dhūpaḥ  3. dīpaḥ  4. naivedyam  5. jalam\n6. candanam  7. akṣatāḥ  8. karpūram  9. mālā  10. vibhūtiḥ\n\nAccept any 10 valid pūjā-related nouns.\n\n---\n\n## Section F: Milestone Exercise\n\n**F1.** Sample for Śiva:\n1. śivaḥ  2. triśūlam  3. ḍamaruḥ  4. jaṭā  5. candraḥ\n6. sarpaḥ  7. gaṅgā  8. nandī  9. vibhūtiḥ  10. netram\n11. kaṇṭhaḥ  12. parvataḥ  13. liṅgam  14. rudrākṣaḥ  15. agniḥ\n16. vṛṣabhaḥ  17. ākāśaḥ  18. padmam  19. dīpaḥ  20. puṣpam\n\nAccept any 20 valid Sanskrit nouns related to the chosen deity.\nAward 0.5 marks per correct word.\n\n---\n\n**Total: 60 marks**\n"}, "tabs": ["theory", "reference", "workbook-questions", "workbook-answers"]}, {"id": "02-guna", "number": 2, "title": "Guna", "subtitle": "Adjectives", "files": {"theory": "# Stage 2: Guṇa — Adjectives\n\n## Goal\nLearn to describe deities and sacred objects with qualities (guṇas). Generate 10 qualities for any deity spontaneously.\n\n## What is a Guṇa?\n\n**Guṇa** (गुण) means \"quality\" or \"attribute.\" In grammar, adjectives (viśeṣaṇa) describe nouns (viśeṣya). In Sanskrit, adjectives **agree** with their noun in gender, number, and case.\n\n## The Agreement Rule\n\nThe adjective takes the same gender, number, and case as the noun it describes.\n\n| Noun | Adjective \"beautiful\" | Why |\n|------|----------------------|-----|\n| sundaraḥ devaḥ | masculine -aḥ | devaḥ is masculine |\n| sundarī devī | feminine -ī | devī is feminine |\n| sundaram phalam | neuter -am | phalam is neuter |\n\n## Core Adjective Vocabulary\n\n### Spiritual/Sacred Qualities\n| Sanskrit | Devanāgarī | Meaning | M / F / N |\n|----------|-----------|---------|-----------|\n| śāntaḥ | शान्तः | peaceful | śāntaḥ / śāntā / śāntam |\n| dayāluḥ | दयालुः | compassionate | dayāluḥ / dayālū / dayālu |\n| karuṇāmayaḥ | करुणामयः | full of compassion | -mayaḥ / -mayī / -mayam |\n| divyaḥ | दिव्यः | divine | divyaḥ / divyā / divyam |\n| pavitraḥ | पवित्रः | pure/sacred | pavitraḥ / pavitrā / pavitram |\n| pūjyaḥ | पूज्यः | worshipful | pūjyaḥ / pūjyā / pūjyam |\n| mahān | महान् | great | mahān / mahatī / mahat |\n| priyaḥ | प्रियः | dear/beloved | priyaḥ / priyā / priyam |\n| śubhaḥ | शुभः | auspicious | śubhaḥ / śubhā / śubham |\n| mangalaḥ | मङ्गलः | auspicious | mangalaḥ / maṅgalā / maṅgalam |\n\n### Physical Description\n| Sanskrit | Meaning | M / F / N |\n|----------|---------|-----------|\n| sundaraḥ | beautiful | sundaraḥ / sundarī / sundaram |\n| nīlaḥ | blue | nīlaḥ / nīlā / nīlam |\n| śvetaḥ | white | śvetaḥ / śvetā / śvetam |\n| raktaḥ | red | raktaḥ / raktā / raktam |\n| kṛṣṇaḥ | dark/black | kṛṣṇaḥ / kṛṣṇā / kṛṣṇam |\n| pītaḥ | yellow | pītaḥ / pītā / pītam |\n| bṛhat | large/vast | bṛhan / bṛhatī / bṛhat |\n| sūkṣmaḥ | subtle | sūkṣmaḥ / sūkṣmā / sūkṣmam |\n| tejasvin | radiant | tejasvī / tejasvinī / tejasvi |\n| prācīnaḥ | ancient | prācīnaḥ / prācīnā / prācīnam |\n\n### Emotional/Bhāva Qualities\n| Sanskrit | Meaning | M / F / N |\n|----------|---------|-----------|\n| premamayaḥ | full of love | -mayaḥ / -mayī / -mayam |\n| ānandamayaḥ | full of bliss | -mayaḥ / -mayī / -mayam |\n| kṛpāluḥ | gracious | kṛpāluḥ / kṛpālū / kṛpālu |\n| bhayaṅkaraḥ | fearsome | -karaḥ / -karā / -karam |\n| gambhīraḥ | profound | -raḥ / -rā / -ram |\n| udāraḥ | generous | -raḥ / -rā / -ram |\n| amṛtamayaḥ | nectarean | -mayaḥ / -mayī / -mayam |\n| sarvaśaktiḥ | all-powerful | (indeclinable in compounds) |\n| nityaḥ | eternal | nityaḥ / nityā / nityam |\n| sarvajñaḥ | omniscient | -jñaḥ / -jñā / -jñam |\n\n## The -maya Suffix\n\nOne of the most productive ways to form adjectives in devotional Sanskrit:\n\n**noun + maya = \"full of / made of\"**\n\n| Base | + maya | Meaning |\n|------|--------|---------|\n| karuṇā | karuṇāmayaḥ | full of compassion |\n| ānanda | ānandamayaḥ | full of bliss |\n| jyotis | jyotirmayaḥ | full of light |\n| amṛta | amṛtamayaḥ | nectarean |\n| prema | premamayaḥ | full of love |\n| tejas | tejomayaḥ | radiant |\n\n## The Guṇa-Mālā Game\n\nString together adjective-noun pairs like beads on a garland:\n\n> śivaḥ śāntaḥ — Śiva is peaceful\n> devī sundarī — the goddess is beautiful\n> kṛṣṇaḥ nīlaḥ — Kṛṣṇa is blue/dark\n> gaṅgā pavitrā — Gaṅgā is sacred\n> agniḥ tejasvi — fire is radiant\n\nPractice: pick a deity, generate a \"garland\" of 10 qualities.\n\n## Adjective Placement\n\nIn Sanskrit, the adjective can come before or after the noun. Both are correct:\n- **sundaraḥ devaḥ** = the beautiful god\n- **devaḥ sundaraḥ** = the god is beautiful (or: the beautiful god)\n\nContext determines whether it's attributive or predicative.\n\n## Milestone Check\n\nCan you spontaneously generate 10 qualities for your iṣṭadevatā?\nExample for Devī: sundarī, divyā, karuṇāmayī, mahatī, śāntā, tejasvinī, nityā, priyā, pavitrā, ānandamayī\n", "reference": "# Stage 2: Guṇa — Reference Guide\n\n## Adjective Agreement Quick Table\n\nFor -a stem adjectives (the most common type):\n\n| Gender | Singular | Example |\n|--------|----------|---------|\n| Masculine | -aḥ | sundaraḥ devaḥ |\n| Feminine | -ā or -ī | sundarī devī |\n| Neuter | -am | sundaram vanam |\n\n## Master Adjective List\n\n### Colors\n| Sanskrit | M | F | N | Meaning |\n|----------|---|---|---|---------|\n| nīlaḥ | nīlaḥ | nīlā | nīlam | blue/dark |\n| śvetaḥ | śvetaḥ | śvetā | śvetam | white |\n| raktaḥ | raktaḥ | raktā | raktam | red |\n| pītaḥ | pītaḥ | pītā | pītam | yellow |\n| kṛṣṇaḥ | kṛṣṇaḥ | kṛṣṇā | kṛṣṇam | black/dark |\n| haritaḥ | haritaḥ | haritā | haritam | green |\n| gauraḥ | gauraḥ | gaurī | gauram | fair/golden |\n\n### Size & Shape\n| Sanskrit | Meaning |\n|----------|---------|\n| bṛhat / mahān | great, large |\n| alpam | small |\n| sūkṣmaḥ | subtle |\n| viśālaḥ | vast, wide |\n| dīrghaḥ | long |\n| hrasvaḥ | short |\n\n### Sacred Qualities\n| Sanskrit | Meaning |\n|----------|---------|\n| śāntaḥ | peaceful |\n| divyaḥ | divine |\n| pavitraḥ | pure |\n| pūjyaḥ | venerable |\n| pūtaḥ | purified |\n| śubhaḥ | auspicious |\n| maṅgalaḥ | auspicious |\n| nityaḥ | eternal |\n| sanātanaḥ | primordial |\n| avyayaḥ | imperishable |\n\n### Emotional Qualities\n| Sanskrit | Meaning |\n|----------|---------|\n| dayāluḥ | compassionate |\n| kṛpāluḥ | gracious |\n| karuṇāmayaḥ | full of mercy |\n| premamayaḥ | full of love |\n| priyaḥ | beloved |\n| snigdhaḥ | tender |\n| udāraḥ | generous |\n| gambhīraḥ | profound |\n| dhīraḥ | steadfast |\n| vīraḥ | heroic |\n\n### Power & Radiance\n| Sanskrit | Meaning |\n|----------|---------|\n| tejasvin | radiant |\n| prabhāvān | powerful |\n| śaktimat | endowed with śakti |\n| sarvajñaḥ | omniscient |\n| sarvaśaktimat | omnipotent |\n| sarvavyāpin | omnipresent |\n| jyotirmayaḥ | luminous |\n| pratāpavān | glorious |\n| amitaḥ | immeasurable |\n| anantaḥ | infinite |\n\n## The -maya / -vat / -mat Suffixes\n\n| Suffix | Meaning | Example |\n|--------|---------|---------|\n| -maya | full of, made of | ānandamayaḥ (full of bliss) |\n| -vat / -mat | possessing | balavān (possessing strength) |\n| -in | having | tejasvī (having tejas) |\n\n## Deity-Quality Quick Pairs\n\n| Deity | Common Qualities |\n|-------|-----------------|\n| Śiva | śāntaḥ, bhayaṅkaraḥ, nīlakaṇṭhaḥ, mahān, yogī |\n| Viṣṇu | śāntaḥ, nīlaḥ, karuṇāmayaḥ, anantaḥ, divyaḥ |\n| Devī/Durgā | sundarī, bhayaṅkarā, tejasvinī, karuṇāmayī, divyā |\n| Kṛṣṇa | sundaraḥ, nīlaḥ, priyaḥ, līlāmayaḥ, ānandamayaḥ |\n| Sarasvatī | śvetā, śāntā, divyā, vidyāmayī, sundarī |\n| Gaṇeśa | mahān, udāraḥ, priyaḥ, gambhīraḥ, maṅgalaḥ |\n| Lakṣmī | sundarī, divyā, karuṇāmayī, maṅgalā, priyā |\n", "workbook-questions": "# Stage 2: Guṇa — Workbook (Questions)\n\n## Section A: Gender Agreement (15 marks)\n\n**A1.** Convert the adjective \"sundara\" to match each noun (5 marks):\n1. devaḥ (M) → ___ devaḥ\n2. devī (F) → ___ devī\n3. phalam (N) → ___ phalam\n4. nadī (F) → ___ nadī\n5. candraḥ (M) → ___ candraḥ\n\n**A2.** Convert \"divya\" to match each noun (5 marks):\n1. mūrtiḥ (F) → ___ mūrtiḥ\n2. mandiram (N) → ___ mandiram\n3. dīpaḥ (M) → ___ dīpaḥ\n4. mālā (F) → ___ mālā\n5. padmam (N) → ___ padmam\n\n**A3.** Correct any errors in these adjective-noun pairs (5 marks):\n1. śāntaḥ devī\n2. sundarī kṛṣṇaḥ\n3. nīlam ākāśaḥ\n4. divyā mandiram\n5. pavitraḥ gaṅgā\n\n---\n\n## Section B: -maya Suffix (10 marks)\n\n**B1.** Form the -maya adjective from each base and give its meaning (5 marks):\n1. karuṇā + maya = ___  (meaning: ___)\n2. ānanda + maya = ___  (meaning: ___)\n3. jyotis + maya = ___  (meaning: ___)\n4. amṛta + maya = ___  (meaning: ___)\n5. prema + maya = ___  (meaning: ___)\n\n**B2.** Give the feminine form (-mayī) for each (5 marks):\n1. karuṇāmayaḥ → ___\n2. ānandamayaḥ → ___\n3. jyotirmayaḥ → ___\n4. tejomayaḥ → ___\n5. premamayaḥ → ___\n\n---\n\n## Section C: Deity Description (15 marks)\n\n**C1.** Give 5 adjectives for Śiva (5 marks):\n1. ___  2. ___  3. ___  4. ___  5. ___\n\n**C2.** Give 5 adjectives for Lakṣmī (in correct feminine form) (5 marks):\n1. ___  2. ___  3. ___  4. ___  5. ___\n\n**C3.** Pair each adjective with an appropriate deity noun, ensuring gender agreement (5 marks):\n1. śāntaḥ + ___\n2. sundarī + ___\n3. nīlam + ___\n4. tejasvinī + ___\n5. gambhīraḥ + ___\n\n---\n\n## Section D: Translation (10 marks)\n\n**D1.** Translate into Sanskrit adjective-noun pairs (5 marks):\n1. The blue lotus\n2. The peaceful god\n3. The beautiful goddess\n4. The sacred river\n5. The radiant fire\n\n**D2.** Translate into English (5 marks):\n1. nīlaḥ kaṇṭhaḥ\n2. divyā mālā\n3. pavitraṃ jalam\n4. ānandamayaḥ kṛṣṇaḥ\n5. karuṇāmayī devī\n\n---\n\n## Section E: Guṇa-Mālā Game (10 marks)\n\n**E1.** Create a \"garland of qualities\" — 10 adjective-noun pairs for your iṣṭadevatā. Each pair must use a different adjective and show correct gender agreement.\n\n1. ___ ___\n2. ___ ___\n3. ___ ___\n4. ___ ___\n5. ___ ___\n6. ___ ___\n7. ___ ___\n8. ___ ___\n9. ___ ___\n10. ___ ___\n\n---\n\n**Total: 60 marks**\n", "workbook-answers": "# Stage 2: Guṇa — Workbook (Answers)\n\n## Section A: Gender Agreement\n\n**A1.**\n1. **sundaraḥ** devaḥ (M)\n2. **sundarī** devī (F)\n3. **sundaram** phalam (N)\n4. **sundarī** nadī (F)\n5. **sundaraḥ** candraḥ (M)\n\n**A2.**\n1. **divyā** mūrtiḥ (F)\n2. **divyam** mandiram (N)\n3. **divyaḥ** dīpaḥ (M)\n4. **divyā** mālā (F)\n5. **divyam** padmam (N)\n\n**A3.**\n1. śāntaḥ devī → **śāntā devī** (devī is F, needs F adjective)\n2. sundarī kṛṣṇaḥ → **sundaraḥ kṛṣṇaḥ** (kṛṣṇaḥ is M)\n3. nīlam ākāśaḥ → **nīlaḥ ākāśaḥ** (ākāśaḥ is M)\n4. divyā mandiram → **divyam mandiram** (mandiram is N)\n5. pavitraḥ gaṅgā → **pavitrā gaṅgā** (gaṅgā is F)\n\n---\n\n## Section B: -maya Suffix\n\n**B1.**\n1. karuṇā + maya = **karuṇāmayaḥ** (full of compassion)\n2. ānanda + maya = **ānandamayaḥ** (full of bliss)\n3. jyotis + maya = **jyotirmayaḥ** (full of light)\n4. amṛta + maya = **amṛtamayaḥ** (nectarean)\n5. prema + maya = **premamayaḥ** (full of love)\n\n**B2.**\n1. karuṇāmayaḥ → **karuṇāmayī**\n2. ānandamayaḥ → **ānandamayī**\n3. jyotirmayaḥ → **jyotirmayī**\n4. tejomayaḥ → **tejomayī**\n5. premamayaḥ → **premamayī**\n\n---\n\n## Section C: Deity Description\n\n**C1.** Śiva (masculine forms) — sample answers:\n1. **śāntaḥ** 2. **mahān** 3. **divyaḥ** 4. **bhayaṅkaraḥ** 5. **nityaḥ**\n(Accept any 5 valid masculine adjectives)\n\n**C2.** Lakṣmī (feminine forms) — sample answers:\n1. **sundarī** 2. **divyā** 3. **karuṇāmayī** 4. **maṅgalā** 5. **priyā**\n(Accept any 5 valid feminine adjectives)\n\n**C3.** Sample answers:\n1. śāntaḥ + **śivaḥ** (or any M noun)\n2. sundarī + **devī** (or any F noun)\n3. nīlam + **padmam** (or any N noun)\n4. tejasvinī + **durgā** (or any F noun)\n5. gambhīraḥ + **samudraḥ** (or any M noun)\n\n---\n\n## Section D: Translation\n\n**D1.**\n1. The blue lotus → **nīlam padmam**\n2. The peaceful god → **śāntaḥ devaḥ**\n3. The beautiful goddess → **sundarī devī**\n4. The sacred river → **pavitrā nadī**\n5. The radiant fire → **tejasvī agniḥ**\n\n**D2.**\n1. nīlaḥ kaṇṭhaḥ → **blue throat**\n2. divyā mālā → **divine garland**\n3. pavitraṃ jalam → **sacred/pure water**\n4. ānandamayaḥ kṛṣṇaḥ → **Kṛṣṇa who is full of bliss**\n5. karuṇāmayī devī → **the goddess full of compassion**\n\n---\n\n## Section E: Guṇa-Mālā Game\n\nSample for Śiva:\n1. śāntaḥ śivaḥ (peaceful Śiva)\n2. divyaḥ mahādevaḥ (divine Mahādeva)\n3. nīlaḥ kaṇṭhaḥ (blue throat)\n4. tejasvi netram (radiant eye)\n5. gambhīraḥ svāmī (profound lord)\n6. bhayaṅkaraḥ rudraḥ (fearsome Rudra)\n7. nityaḥ yogī (eternal yogī)\n8. karuṇāmayaḥ śambhuḥ (compassionate Śambhu)\n9. sundaraḥ naṭarājaḥ (beautiful Naṭarāja)\n10. anantaḥ īśvaraḥ (infinite Lord)\n\nAward 1 mark per correct pair (adjective agrees with noun in gender).\n\n---\n\n**Total: 60 marks**\n"}, "tabs": ["theory", "reference", "workbook-questions", "workbook-answers"]}, {"id": "03-rupa", "number": 3, "title": "Rupa", "subtitle": "Case / Number / Gender", "files": {"theory": "# Stage 3: Rūpa — Case, Number, and Gender (Declension)\n\n## Goal\nLearn to transform nouns through all cases (vibhaktis), numbers, and genders. Decline devotional vocabulary actively so that words become usable in sentences.\n\n## What is Rūpa?\n\n**Rūpa** (रूप) means \"form.\" In Sanskrit, nouns change their form (ending) depending on their role in a sentence. This system of changes is called **declension** (śabda-rūpa).\n\n## The Eight Cases (Vibhaktis)\n\n| # | Vibhakti | Name | Function | Question | Example |\n|---|---------|------|----------|----------|---------|\n| 1 | Prathamā | Nominative | Subject | Who/What? | śivaḥ (Śiva [does]) |\n| 2 | Dvitīyā | Accusative | Object | Whom/What? | śivam (Śiva [I worship]) |\n| 3 | Tṛtīyā | Instrumental | By/With | By whom? | śivena (by Śiva) |\n| 4 | Caturthī | Dative | For/To | For whom? | śivāya (for Śiva) |\n| 5 | Pañcamī | Ablative | From | From whom? | śivāt (from Śiva) |\n| 6 | Ṣaṣṭhī | Genitive | Of | Whose? | śivasya (of Śiva) |\n| 7 | Saptamī | Locative | In/On | Where? | śive (in Śiva) |\n| 8 | Sambodhana | Vocative | Address | O...! | he śiva! |\n\n## The Three Numbers\n\n| Vacana | Meaning | Example (prathamā of deva) |\n|--------|---------|---------------------------|\n| Ekavacana | Singular | devaḥ |\n| Dvivacana | Dual | devau |\n| Bahuvacana | Plural | devāḥ |\n\n## Model Paradigm: Masculine -a stem (deva)\n\n| Vibhakti | Eka | Dvi | Bahu |\n|----------|-----|-----|------|\n| Prathamā | devaḥ | devau | devāḥ |\n| Dvitīyā | devam | devau | devān |\n| Tṛtīyā | devena | devābhyām | devaiḥ |\n| Caturthī | devāya | devābhyām | devebhyaḥ |\n| Pañcamī | devāt | devābhyām | devebhyaḥ |\n| Ṣaṣṭhī | devasya | devayoḥ | devānām |\n| Saptamī | deve | devayoḥ | deveṣu |\n| Sambodhana | he deva! | he devau! | he devāḥ! |\n\n## Model Paradigm: Neuter -a stem (phala)\n\n| Vibhakti | Eka | Dvi | Bahu |\n|----------|-----|-----|------|\n| Prathamā | phalam | phale | phalāni |\n| Dvitīyā | phalam | phale | phalāni |\n| Tṛtīyā | phalena | phalābhyām | phalaiḥ |\n| Caturthī | phalāya | phalābhyām | phalebhyaḥ |\n| Pañcamī | phalāt | phalābhyām | phalebhyaḥ |\n| Ṣaṣṭhī | phalasya | phalayoḥ | phalānām |\n| Saptamī | phale | phalayoḥ | phaleṣu |\n\nNote: Neuter prathamā and dvitīyā are always identical.\n\n## Model Paradigm: Feminine -ā stem (mālā)\n\n| Vibhakti | Eka | Dvi | Bahu |\n|----------|-----|-----|------|\n| Prathamā | mālā | māle | mālāḥ |\n| Dvitīyā | mālām | māle | mālāḥ |\n| Tṛtīyā | mālayā | mālābhyām | mālābhiḥ |\n| Caturthī | mālāyai | mālābhyām | mālābhyaḥ |\n| Pañcamī | mālāyāḥ | mālābhyām | mālābhyaḥ |\n| Ṣaṣṭhī | mālāyāḥ | mālayoḥ | mālānām |\n| Saptamī | mālāyām | mālayoḥ | mālāsu |\n\n## Model Paradigm: Feminine -ī stem (nadī)\n\n| Vibhakti | Eka | Dvi | Bahu |\n|----------|-----|-----|------|\n| Prathamā | nadī | nadyau | nadyaḥ |\n| Dvitīyā | nadīm | nadyau | nadīḥ |\n| Tṛtīyā | nadyā | nadībhyām | nadībhiḥ |\n| Caturthī | nadyai | nadībhyām | nadībhyaḥ |\n| Pañcamī | nadyāḥ | nadībhyām | nadībhyaḥ |\n| Ṣaṣṭhī | nadyāḥ | nadyoḥ | nadīnām |\n| Saptamī | nadyām | nadyoḥ | nadīṣu |\n\n## Devotional Context: \"Transform the Deity\"\n\nSee how a single name changes across cases:\n\n| Case | Form | Devotional Sentence |\n|------|------|-------------------|\n| Prathamā | śivaḥ | śivaḥ asti — Śiva exists |\n| Dvitīyā | śivam | śivam namāmi — I bow to Śiva |\n| Tṛtīyā | śivena | śivena rakṣitaḥ — protected by Śiva |\n| Caturthī | śivāya | śivāya namaḥ — salutation to Śiva |\n| Pañcamī | śivāt | śivāt āgataḥ — come from Śiva |\n| Ṣaṣṭhī | śivasya | śivasya kṛpā — Śiva's grace |\n| Saptamī | śive | śive bhaktiḥ — devotion in/to Śiva |\n| Sambodhana | he śiva! | he śiva! prasīda — O Śiva! be gracious |\n\n## Key Insight\n\nThe case system is what makes Sanskrit a free-word-order language. Since the function of each word is encoded in its ending, you can rearrange words freely:\n- śivāya puṣpam dadāmi\n- puṣpam śivāya dadāmi\n- dadāmi śivāya puṣpam\n\nAll three mean: \"I give a flower to Śiva.\"\n\n## Milestone Check\n\nCan you decline śiva, puṣpa, mālā, and nadī through all 8 cases in singular from memory?\n", "reference": "# Stage 3: Rūpa — Reference Guide\n\n## Vibhakti Summary Card\n\n| # | Name | Meaning | Key Marker (M -a) |\n|---|------|---------|-------------------|\n| 1 | Prathamā | Subject | -aḥ |\n| 2 | Dvitīyā | Object | -am |\n| 3 | Tṛtīyā | By/With | -ena |\n| 4 | Caturthī | For/To | -āya |\n| 5 | Pañcamī | From | -āt |\n| 6 | Ṣaṣṭhī | Of | -asya |\n| 7 | Saptamī | In/On | -e |\n| 8 | Sambodhana | O...! | -a! |\n\n## Full Paradigm Tables\n\n### Masculine -a (deva, śiva, rāma)\n| Vib. | Eka | Dvi | Bahu |\n|------|-----|-----|------|\n| 1 | -aḥ | -au | -āḥ |\n| 2 | -am | -au | -ān |\n| 3 | -ena | -ābhyām | -aiḥ |\n| 4 | -āya | -ābhyām | -ebhyaḥ |\n| 5 | -āt | -ābhyām | -ebhyaḥ |\n| 6 | -asya | -ayoḥ | -ānām |\n| 7 | -e | -ayoḥ | -eṣu |\n| 8 | -a! | -au! | -āḥ! |\n\n### Neuter -a (phala, puṣpa, jala)\n| Vib. | Eka | Dvi | Bahu |\n|------|-----|-----|------|\n| 1 | -am | -e | -āni |\n| 2 | -am | -e | -āni |\n| 3–7 | same as masculine |\n| 8 | -a! | -e! | -āni! |\n\n### Feminine -ā (mālā, gaṅgā, latā)\n| Vib. | Eka | Dvi | Bahu |\n|------|-----|-----|------|\n| 1 | -ā | -e | -āḥ |\n| 2 | -ām | -e | -āḥ |\n| 3 | -ayā | -ābhyām | -ābhiḥ |\n| 4 | -āyai | -ābhyām | -ābhyaḥ |\n| 5 | -āyāḥ | -ābhyām | -ābhyaḥ |\n| 6 | -āyāḥ | -ayoḥ | -ānām |\n| 7 | -āyām | -ayoḥ | -āsu |\n\n### Feminine -ī (nadī, devī, lakṣmī)\n| Vib. | Eka | Dvi | Bahu |\n|------|-----|-----|------|\n| 1 | -ī | -yau | -yaḥ |\n| 2 | -īm | -yau | -īḥ |\n| 3 | -yā | -ībhyām | -ībhiḥ |\n| 4 | -yai | -ībhyām | -ībhyaḥ |\n| 5 | -yāḥ | -ībhyām | -ībhyaḥ |\n| 6 | -yāḥ | -yoḥ | -īnām |\n| 7 | -yām | -yoḥ | -īṣu |\n\n### Masculine -i (agni, muni)\n| Vib. | Eka | Dvi | Bahu |\n|------|-----|-----|------|\n| 1 | -iḥ | -ī | -ayaḥ |\n| 2 | -im | -ī | -īn |\n| 3 | -inā | -ibhyām | -ibhiḥ |\n| 4 | -aye | -ibhyām | -ibhyaḥ |\n| 5 | -eḥ | -ibhyām | -ibhyaḥ |\n| 6 | -eḥ | -yoḥ | -īnām |\n| 7 | -au | -yoḥ | -iṣu |\n\n### Masculine -u (viṣṇu, guru)\n| Vib. | Eka | Dvi | Bahu |\n|------|-----|-----|------|\n| 1 | -uḥ | -ū | -avaḥ |\n| 2 | -um | -ū | -ūn |\n| 3 | -unā | -ubhyām | -ubhiḥ |\n| 4 | -ave | -ubhyām | -ubhyaḥ |\n| 5 | -oḥ | -ubhyām | -ubhyaḥ |\n| 6 | -oḥ | -voḥ | -ūnām |\n| 7 | -au | -voḥ | -uṣu |\n\n## Devotional Declension Examples\n\n### śiva (M, -a stem)\n| Vib. | Form | Usage |\n|------|------|-------|\n| 1 | śivaḥ | śivaḥ rakṣati (Śiva protects) |\n| 2 | śivam | śivam namāmi (I bow to Śiva) |\n| 3 | śivena | śivena saha (with Śiva) |\n| 4 | śivāya | śivāya namaḥ (salutation to Śiva) |\n| 5 | śivāt | śivāt jñānam (knowledge from Śiva) |\n| 6 | śivasya | śivasya kṛpā (Śiva's grace) |\n| 7 | śive | śive bhaktiḥ (devotion in Śiva) |\n| 8 | he śiva! | he śiva prasīda! (O Śiva, be gracious!) |\n\n### puṣpa (N, -a stem)\n| Vib. | Form | Usage |\n|------|------|-------|\n| 1 | puṣpam | puṣpam asti (there is a flower) |\n| 2 | puṣpam | puṣpam arpayāmi (I offer a flower) |\n| 3 | puṣpena | puṣpena pūjā (worship with a flower) |\n| 4 | puṣpāya | — |\n| 5 | puṣpāt | puṣpāt gandhaḥ (fragrance from a flower) |\n| 6 | puṣpasya | puṣpasya gandhaḥ (fragrance of a flower) |\n| 7 | puṣpe | puṣpe bhramaraḥ (a bee on a flower) |\n\n## Quick Case-Function Memory Aid\n\n> **Su**bject **A**ccuses **I**nstrument **For** **From** **Of** **In** — **O!**\n> Prathamā Dvitīyā Tṛtīyā Caturthī Pañcamī Ṣaṣṭhī Saptamī Sambodhana\n", "workbook-questions": "# Stage 3: Rūpa — Workbook (Questions)\n\n## Section A: Case Identification (10 marks)\n\n**A1.** Identify the vibhakti (case) and its function for each form (5 marks):\n1. śivam → Vibhakti: ___ Function: ___\n2. devāya → Vibhakti: ___ Function: ___\n3. gaṅgāyāḥ → Vibhakti: ___ Function: ___\n4. mandire → Vibhakti: ___ Function: ___\n5. puṣpena → Vibhakti: ___ Function: ___\n\n**A2.** Which vibhakti would you use in each situation? (5 marks):\n1. To say \"I worship ___\" (object of worship)\n2. To say \"___ protects\" (subject)\n3. To say \"of ___\" (possession)\n4. To say \"with/by ___\" (instrument)\n5. To say \"for ___\" (recipient)\n\n---\n\n## Section B: Declension (20 marks)\n\n**B1.** Decline \"rāma\" (M, -a stem) in ekavacana, all 8 vibhaktis (8 marks):\n1. Prathamā: ___\n2. Dvitīyā: ___\n3. Tṛtīyā: ___\n4. Caturthī: ___\n5. Pañcamī: ___\n6. Ṣaṣṭhī: ___\n7. Saptamī: ___\n8. Sambodhana: ___\n\n**B2.** Decline \"puṣpa\" (N, -a stem) in ekavacana (8 marks):\n1. Prathamā: ___\n2. Dvitīyā: ___\n3. Tṛtīyā: ___\n4. Caturthī: ___\n5. Pañcamī: ___\n6. Ṣaṣṭhī: ___\n7. Saptamī: ___\n8. Sambodhana: ___\n\n**B3.** Give the prathamā (nominative) in all three vacanas for (4 marks):\n1. deva: ___, ___, ___\n2. phala: ___, ___, ___\n\n---\n\n## Section C: Transformation (15 marks)\n\n**C1.** Transform the word as directed (10 marks):\n1. śivaḥ → accusative singular: ___\n2. devī → genitive singular: ___\n3. mandiram → locative singular: ___\n4. mālā → instrumental singular: ___\n5. agniḥ → dative singular: ___\n6. puṣpam → instrumental singular: ___\n7. nadī → locative singular: ___\n8. gaṅgā → accusative singular: ___\n9. viṣṇuḥ → genitive singular: ___\n10. padmam → locative singular: ___\n\n**C2.** Fill in the correct case form to complete each devotional phrase (5 marks):\n1. ___ namaḥ (salutation to Viṣṇu) [viṣṇu, caturthī]\n2. ___ namāmi (I bow to Rāma) [rāma, dvitīyā]\n3. ___ kṛpā (Devī's grace) [devī, ṣaṣṭhī]\n4. ___ pūjayāmi (I worship with a flower) [puṣpa, tṛtīyā]\n5. ___ bhaktiḥ (devotion in Kṛṣṇa) [kṛṣṇa, saptamī]\n\n---\n\n## Section D: Sentence Understanding (10 marks)\n\n**D1.** Identify the case and role of each underlined word (5 marks):\n1. **śivaḥ** jagat rakṣati (__ protects the world)\n2. bhaktaḥ **śivam** pūjayati (the devotee worships __)\n3. **śivena** saha tiṣṭhāmi (I stand with __)\n4. **śivāya** phalaṃ dadāti (he gives fruit to __)\n5. **śivasya** mandiraṃ sundaram (__ temple is beautiful)\n\n**D2.** Rearrange each set of words into a meaningful sentence (5 marks):\n1. puṣpam / dadāmi / devāya\n2. namaḥ / śivāya\n3. karuṇā / devasya / mahatī\n4. mandire / bhaktaḥ / tiṣṭhati\n5. devīm / namāmi / bhaktyā\n\n---\n\n## Section E: Free Declension (5 marks)\n\n**E1.** Choose one deity name and one pūjā item. Decline both fully in ekavacana (all 8 vibhaktis). Write a short devotional phrase using each form.\n\nDeity: ___\nPūjā item: ___\n\n---\n\n**Total: 60 marks**\n", "workbook-answers": "# Stage 3: Rūpa — Workbook (Answers)\n\n## Section A: Case Identification\n\n**A1.**\n1. śivam → **Dvitīyā** (accusative) — object\n2. devāya → **Caturthī** (dative) — for/to\n3. gaṅgāyāḥ → **Ṣaṣṭhī** (genitive) or **Pañcamī** (ablative) — of / from\n4. mandire → **Saptamī** (locative) — in/on\n5. puṣpena → **Tṛtīyā** (instrumental) — by/with\n\n**A2.**\n1. Object of worship → **Dvitīyā** (accusative)\n2. Subject → **Prathamā** (nominative)\n3. Possession → **Ṣaṣṭhī** (genitive)\n4. Instrument → **Tṛtīyā** (instrumental)\n5. Recipient → **Caturthī** (dative)\n\n---\n\n## Section B: Declension\n\n**B1.** rāma (M, -a stem), ekavacana:\n1. Prathamā: **rāmaḥ**\n2. Dvitīyā: **rāmam**\n3. Tṛtīyā: **rāmeṇa**\n4. Caturthī: **rāmāya**\n5. Pañcamī: **rāmāt**\n6. Ṣaṣṭhī: **rāmasya**\n7. Saptamī: **rāme**\n8. Sambodhana: **he rāma!**\n\n**B2.** puṣpa (N, -a stem), ekavacana:\n1. Prathamā: **puṣpam**\n2. Dvitīyā: **puṣpam**\n3. Tṛtīyā: **puṣpeṇa**\n4. Caturthī: **puṣpāya**\n5. Pañcamī: **puṣpāt**\n6. Ṣaṣṭhī: **puṣpasya**\n7. Saptamī: **puṣpe**\n8. Sambodhana: **he puṣpa!**\n\n**B3.**\n1. deva: **devaḥ, devau, devāḥ**\n2. phala: **phalam, phale, phalāni**\n\n---\n\n## Section C: Transformation\n\n**C1.**\n1. śivaḥ → accusative: **śivam**\n2. devī → genitive: **devyāḥ**\n3. mandiram → locative: **mandire**\n4. mālā → instrumental: **mālayā**\n5. agniḥ → dative: **agnaye**\n6. puṣpam → instrumental: **puṣpeṇa**\n7. nadī → locative: **nadyām**\n8. gaṅgā → accusative: **gaṅgām**\n9. viṣṇuḥ → genitive: **viṣṇoḥ**\n10. padmam → locative: **padme**\n\n**C2.**\n1. **viṣṇave** namaḥ\n2. **rāmam** namāmi\n3. **devyāḥ** kṛpā\n4. **puṣpeṇa** pūjayāmi\n5. **kṛṣṇe** bhaktiḥ\n\n---\n\n## Section D: Sentence Understanding\n\n**D1.**\n1. śivaḥ → **Prathamā** (nominative) — subject: \"Śiva protects the world\"\n2. śivam → **Dvitīyā** (accusative) — object: \"worships Śiva\"\n3. śivena → **Tṛtīyā** (instrumental) — \"with Śiva\"\n4. śivāya → **Caturthī** (dative) — recipient: \"to Śiva\"\n5. śivasya → **Ṣaṣṭhī** (genitive) — possession: \"of Śiva / Śiva's\"\n\n**D2.**\n1. **devāya puṣpam dadāmi** (I give a flower to the god)\n2. **śivāya namaḥ** (salutation to Śiva)\n3. **devasya karuṇā mahatī** (the god's compassion is great)\n4. **bhaktaḥ mandire tiṣṭhati** (the devotee stands in the temple)\n5. **bhaktyā devīm namāmi** (with devotion I bow to the goddess)\n\n---\n\n## Section E: Free Declension\n\nSample — Deity: kṛṣṇa (M, -a stem), Pūjā item: dīpa (M, -a stem)\n\n**kṛṣṇa:**\n1. kṛṣṇaḥ — kṛṣṇaḥ hasati (Kṛṣṇa smiles)\n2. kṛṣṇam — kṛṣṇam bhajāmi (I adore Kṛṣṇa)\n3. kṛṣṇena — kṛṣṇena saha (with Kṛṣṇa)\n4. kṛṣṇāya — kṛṣṇāya namaḥ (salutation to Kṛṣṇa)\n5. kṛṣṇāt — kṛṣṇāt ānandam (bliss from Kṛṣṇa)\n6. kṛṣṇasya — kṛṣṇasya līlā (Kṛṣṇa's play)\n7. kṛṣṇe — kṛṣṇe bhaktiḥ (devotion in Kṛṣṇa)\n8. he kṛṣṇa! — he kṛṣṇa rakṣa mām! (O Kṛṣṇa, protect me!)\n\n**dīpa:**\n1. dīpaḥ — dīpaḥ jvalati (the lamp burns)\n2. dīpam — dīpam arpayāmi (I offer a lamp)\n3. dīpena — dīpena pūjā (worship with a lamp)\n4. dīpāya — —\n5. dīpāt — dīpāt jyotiḥ (light from the lamp)\n6. dīpasya — dīpasya jvālā (the lamp's flame)\n7. dīpe — dīpe agniḥ (fire in the lamp)\n8. he dīpa! — —\n\nAward full marks for any correctly declined pair with reasonable phrases.\n\n---\n\n**Total: 60 marks**\n"}, "tabs": ["theory", "reference", "workbook-questions", "workbook-answers"]}, {"id": "04-kriya", "number": 4, "title": "Kriya", "subtitle": "Verbs", "files": {"theory": "# Stage 4: Kriyā — Verbs\n\n## Goal\nLearn Sanskrit verbs to describe acts of worship, devotion, and daily spiritual practice. Describe your own worship in Sanskrit.\n\n## What is a Kriyā?\n\n**Kriyā** (क्रिया) means \"action.\" Sanskrit verbs conjugate according to:\n- **Puruṣa** (person): prathama (3rd), madhyama (2nd), uttama (1st)\n- **Vacana** (number): eka (singular), dvi (dual), bahu (plural)\n- **Lakāra** (tense/mood): laṭ (present), loṭ (imperative), laṅ (past), etc.\n\n## Present Tense (Laṭ-lakāra) — The Essential Tense\n\n### Parasmaipada (active) endings:\n\n| Person | Singular | Dual | Plural |\n|--------|----------|------|--------|\n| Prathama (he/she/it) | -ti | -taḥ | -anti |\n| Madhyama (you) | -si | -thaḥ | -tha |\n| Uttama (I) | -mi | -vaḥ | -maḥ |\n\n### Core Devotional Verbs (Present Tense, Uttama Puruṣa = \"I\")\n\n| Dhātu | 1st person | Meaning | Devotional Use |\n|-------|-----------|---------|----------------|\n| nam (1P) | namāmi | I bow | namāmi śivam |\n| pūj (10P) | pūjayāmi | I worship | pūjayāmi devīm |\n| smṛ (1P) | smarāmi | I remember | smarāmi kṛṣṇam |\n| dṛś (1P) | paśyāmi | I see | paśyāmi mūrtim |\n| dā (3P) | dadāmi | I give | dadāmi puṣpam |\n| śru (5P) | śṛṇomi | I hear | śṛṇomi mantram |\n| gam (1P) | gacchāmi | I go | gacchāmi mandiram |\n| sthā (1P) | tiṣṭhāmi | I stand | tiṣṭhāmi mandire |\n| bhaj (1P) | bhajāmi | I adore/serve | bhajāmi harim |\n| gai (1P) | gāyāmi | I sing | gāyāmi stotram |\n| paṭh (1P) | paṭhāmi | I recite | paṭhāmi mantram |\n| dhyai (1P) | dhyāyāmi | I meditate | dhyāyāmi devam |\n| jap (1P) | japāmi | I chant | japāmi nāma |\n| arpay (10P) | arpayāmi | I offer | arpayāmi naivedyam |\n| rakṣ (1P) | rakṣāmi | I protect | — (used of deity) |\n| kṛ (8U) | karomi | I do/make | karomi pūjām |\n\n## All Three Persons\n\nExample with \"nam\" (to bow):\n\n| Person | Singular | Meaning |\n|--------|----------|---------|\n| 3rd | namati | he/she bows |\n| 2nd | namasi | you bow |\n| 1st | namāmi | I bow |\n\nExample with \"pūj\" (to worship, causative/10th class):\n\n| Person | Singular | Meaning |\n|--------|----------|---------|\n| 3rd | pūjayati | he/she worships |\n| 2nd | pūjayasi | you worship |\n| 1st | pūjayāmi | I worship |\n\n## Ātmanepada Verbs\n\nSome verbs use ātmanepada (middle voice) endings:\n\n| Person | Singular | Dual | Plural |\n|--------|----------|------|--------|\n| 3rd | -te | -ete | -ante |\n| 2nd | -se | -ethe | -dhve |\n| 1st | -e | -vahe | -mahe |\n\nKey ātmanepada verb: **sev** (to serve) → **seve** (I serve)\n\n## The Game: \"What Do I Offer?\"\n\nDescribe your daily worship using verbs:\n\n> prātaḥ uttiṣṭhāmi (in the morning I rise)\n> snānaṃ karomi (I bathe)\n> mandiram gacchāmi (I go to the temple)\n> devam paśyāmi (I see the deity)\n> puṣpam arpayāmi (I offer a flower)\n> dhūpam dadāmi (I give incense)\n> dīpam jvālayāmi (I light a lamp)\n> mantram japāmi (I chant a mantra)\n> stotram gāyāmi (I sing a hymn)\n> devam namāmi (I bow to the deity)\n> dhyāyāmi (I meditate)\n> prasādam svīkaromi (I accept prasāda)\n\n## Negation\n\nTo negate a verb, place **na** before it:\n- na jānāmi — I do not know\n- na paśyāmi — I do not see\n- na tyajāmi — I do not abandon\n\n## Milestone Check\n\nCan you describe your own daily worship (real or ideal) using at least 8 different verbs?\n", "reference": "# Stage 4: Kriyā — Reference Guide\n\n## Parasmaipada Present Tense Endings\n\n| Person | Eka | Dvi | Bahu |\n|--------|-----|-----|------|\n| 3rd (prathama) | -ti | -taḥ | -anti |\n| 2nd (madhyama) | -si | -thaḥ | -tha |\n| 1st (uttama) | -mi | -vaḥ | -maḥ |\n\n## Ātmanepada Present Tense Endings\n\n| Person | Eka | Dvi | Bahu |\n|--------|-----|-----|------|\n| 3rd | -te | -ete | -ante |\n| 2nd | -se | -ethe | -dhve |\n| 1st | -e | -vahe | -mahe |\n\n## 40 Essential Verbs — Full Present Tense (1st person singular)\n\n### Worship & Devotion\n| Verb | 1st sing. | 3rd sing. | Meaning |\n|------|-----------|-----------|---------|\n| nam | namāmi | namati | bow |\n| pūj | pūjayāmi | pūjayati | worship |\n| bhaj | bhajāmi | bhajati | adore/serve |\n| sev | seve | sevate | serve |\n| arc | arcāmi | arcati | worship with rites |\n| stū/stu | staumi/stuvāmi | stauti/stuvati | praise |\n| dhyai | dhyāyāmi | dhyāyati | meditate |\n| jap | japāmi | japati | chant/repeat |\n| smṛ | smarāmi | smarati | remember |\n| prārth | prārthayāmi | prārthayati | pray |\n\n### Giving & Offering\n| Verb | 1st sing. | 3rd sing. | Meaning |\n|------|-----------|-----------|---------|\n| dā | dadāmi | dadāti | give |\n| arpay | arpayāmi | arpayati | offer |\n| yaj | yajāmi | yajati | sacrifice |\n| hu | juhomi | juhoti | pour oblation |\n\n### Perception & Knowledge\n| Verb | 1st sing. | 3rd sing. | Meaning |\n|------|-----------|-----------|---------|\n| dṛś | paśyāmi | paśyati | see |\n| śru | śṛṇomi | śṛṇoti | hear |\n| jñā | jānāmi | jānāti | know |\n| vid | vede/vedmi | vetti | know |\n| man | manye | manyate | think |\n| budh | bodhāmi | bodhati | understand |\n\n### Movement\n| Verb | 1st sing. | 3rd sing. | Meaning |\n|------|-----------|-----------|---------|\n| gam | gacchāmi | gacchati | go |\n| ā-gam | āgacchāmi | āgacchati | come |\n| sthā | tiṣṭhāmi | tiṣṭhati | stand/stay |\n| car | carāmi | carati | walk/move |\n| praviś | praviśāmi | praviśati | enter |\n| ni-kram | niṣkrāmāmi | niṣkrāmati | exit |\n\n### Speech & Song\n| Verb | 1st sing. | 3rd sing. | Meaning |\n|------|-----------|-----------|---------|\n| vad | vadāmi | vadati | speak |\n| gai | gāyāmi | gāyati | sing |\n| paṭh | paṭhāmi | paṭhati | recite |\n| brū | bravīmi | bravīti | say/tell |\n\n### Action & Creation\n| Verb | 1st sing. | 3rd sing. | Meaning |\n|------|-----------|-----------|---------|\n| kṛ | karomi | karoti | do/make |\n| likh | likhāmi | likhati | write |\n| nī | nayāmi | nayati | lead |\n| rakṣ | rakṣāmi | rakṣati | protect |\n| tyaj | tyajāmi | tyajati | abandon |\n| grah | gṛhṇāmi | gṛhṇāti | take/seize |\n| pā | pibāmi | pibati | drink |\n| bhuj | bhuñjāmi | bhuṅkte | eat |\n| vas | vasāmi | vasati | live/dwell |\n| jīv | jīvāmi | jīvati | live |\n\n## Imperative (Loṭ-lakāra) — Quick Reference\n\n| Person | Eka | Meaning |\n|--------|-----|---------|\n| 3rd | -tu | let him... |\n| 2nd | -a / -hi | do...! |\n| 1st | -āni | let me... |\n\nExamples: pātu (let him protect), gaccha (go!), karāṇi (let me do)\n\n## Common Verb Phrases for Pūjā\n\n| Sanskrit | Meaning |\n|----------|---------|\n| pādau prakṣālayāmi | I wash the feet |\n| ācamanam samarpayāmi | I offer sipping water |\n| snānam samarpayāmi | I offer bathing |\n| vastram samarpayāmi | I offer clothing |\n| gandham samarpayāmi | I offer fragrance |\n| puṣpam samarpayāmi | I offer a flower |\n| dhūpam samarpayāmi | I offer incense |\n| dīpam samarpayāmi | I offer a lamp |\n| naivedyam samarpayāmi | I offer food |\n| pradakṣiṇam karomi | I circumambulate |\n| namaskāram karomi | I offer prostration |\n", "workbook-questions": "# Stage 4: Kriyā — Workbook (Questions)\n\n## Section A: Conjugation (15 marks)\n\n**A1.** Give the present tense form for each (5 marks):\n1. nam, 1st person singular (I bow): ___\n2. pūj, 3rd person singular (he worships): ___\n3. gam, 2nd person singular (you go): ___\n4. dā, 1st person singular (I give): ___\n5. paśy (dṛś), 3rd person plural (they see): ___\n\n**A2.** Conjugate \"bhaj\" (to adore) in all three persons, singular (3 marks):\n- 3rd: ___\n- 2nd: ___\n- 1st: ___\n\n**A3.** Conjugate \"smṛ\" (to remember) in all three persons, singular (3 marks):\n- 3rd: ___\n- 2nd: ___\n- 1st: ___\n\n**A4.** What is the difference between parasmaipada and ātmanepada? Give one example verb of each (4 marks).\n\n---\n\n## Section B: Translation (15 marks)\n\n**B1.** Translate into Sanskrit (use 1st person singular) (5 marks):\n1. I bow to Śiva\n2. I sing a hymn\n3. I go to the temple\n4. I offer a flower\n5. I meditate on the deity\n\n**B2.** Translate into English (5 marks):\n1. bhaktaḥ devam pūjayati\n2. mantram japāmi\n3. śivaḥ rakṣati\n4. dīpam jvālayāmi\n5. gāyāmi stotram\n\n**B3.** Change each sentence from 1st person to 3rd person (5 marks):\n1. namāmi → ___\n2. gacchāmi → ___\n3. dadāmi → ___\n4. paśyāmi → ___\n5. karomi → ___\n\n---\n\n## Section C: Sentence Building (15 marks)\n\n**C1.** Complete each sentence with the correct verb form (5 marks):\n1. aham devam ___ (I worship) [pūj]\n2. bhaktaḥ mandiram ___ (the devotee goes) [gam]\n3. tvam mantram ___ (you chant) [jap]\n4. devī bhaktam ___ (the goddess protects) [rakṣ]\n5. vayam stotram ___ (we sing) [gai]\n\n**C2.** Build 5 sentences describing a morning pūjā, using 5 different verbs (10 marks):\n1. ___\n2. ___\n3. ___\n4. ___\n5. ___\n\n---\n\n## Section D: Negation & Questions (5 marks)\n\n**D1.** Negate each sentence (3 marks):\n1. jānāmi → ___\n2. paśyāmi → ___\n3. tyajāmi → ___\n\n**D2.** What does each sentence mean? (2 marks):\n1. na tyajāmi devam\n2. kiṃ paśyasi?\n\n---\n\n## Section E: Milestone — Describe Your Worship (10 marks)\n\nWrite a sequence of at least 8 Sanskrit sentences describing your daily worship (real or imagined). Use at least 8 different verbs. Include subjects, objects, and verbs.\n\n1. ___\n2. ___\n3. ___\n4. ___\n5. ___\n6. ___\n7. ___\n8. ___\n\n---\n\n**Total: 60 marks**\n", "workbook-answers": "# Stage 4: Kriyā — Workbook (Answers)\n\n## Section A: Conjugation\n\n**A1.**\n1. nam, 1st sing. → **namāmi**\n2. pūj, 3rd sing. → **pūjayati**\n3. gam, 2nd sing. → **gacchasi**\n4. dā, 1st sing. → **dadāmi**\n5. dṛś, 3rd pl. → **paśyanti**\n\n**A2.** bhaj:\n- 3rd: **bhajati**\n- 2nd: **bhajasi**\n- 1st: **bhajāmi**\n\n**A3.** smṛ:\n- 3rd: **smarati**\n- 2nd: **smarasi**\n- 1st: **smarāmi**\n\n**A4.** Parasmaipada (\"for another\") uses -ti/-si/-mi endings; ātmanepada (\"for oneself\") uses -te/-se/-e endings. Parasmaipada example: **namati** (nam). Ātmanepada example: **sevate** (sev).\n\n---\n\n## Section B: Translation\n\n**B1.**\n1. I bow to Śiva → **śivam namāmi** (or namāmi śivam)\n2. I sing a hymn → **stotram gāyāmi**\n3. I go to the temple → **mandiram gacchāmi**\n4. I offer a flower → **puṣpam arpayāmi**\n5. I meditate on the deity → **devam dhyāyāmi**\n\n**B2.**\n1. bhaktaḥ devam pūjayati → **The devotee worships the deity**\n2. mantram japāmi → **I chant a mantra**\n3. śivaḥ rakṣati → **Śiva protects**\n4. dīpam jvālayāmi → **I light a lamp**\n5. gāyāmi stotram → **I sing a hymn**\n\n**B3.**\n1. namāmi → **namati**\n2. gacchāmi → **gacchati**\n3. dadāmi → **dadāti**\n4. paśyāmi → **paśyati**\n5. karomi → **karoti**\n\n---\n\n## Section C: Sentence Building\n\n**C1.**\n1. aham devam **pūjayāmi**\n2. bhaktaḥ mandiram **gacchati**\n3. tvam mantram **japasi**\n4. devī bhaktam **rakṣati**\n5. vayam stotram **gāyāmaḥ**\n\n**C2.** Sample answers:\n1. **prātaḥ uttiṣṭhāmi** (I rise in the morning)\n2. **snānam karomi** (I bathe)\n3. **mandiram gacchāmi** (I go to the temple)\n4. **dīpam jvālayāmi** (I light a lamp)\n5. **puṣpam arpayāmi** (I offer a flower)\n\nAccept any 5 grammatically correct sentences with different verbs.\n\n---\n\n## Section D: Negation & Questions\n\n**D1.**\n1. jānāmi → **na jānāmi** (I do not know)\n2. paśyāmi → **na paśyāmi** (I do not see)\n3. tyajāmi → **na tyajāmi** (I do not abandon)\n\n**D2.**\n1. na tyajāmi devam → **I do not abandon the deity**\n2. kiṃ paśyasi? → **What do you see?**\n\n---\n\n## Section E: Milestone\n\nSample answer:\n1. **prātaḥ uttiṣṭhāmi** (In the morning I rise)\n2. **snānam karomi** (I bathe)\n3. **mandiram gacchāmi** (I go to the temple)\n4. **devam paśyāmi** (I see the deity)\n5. **puṣpam arpayāmi** (I offer a flower)\n6. **mantram japāmi** (I chant a mantra)\n7. **stotram gāyāmi** (I sing a hymn)\n8. **devam namāmi** (I bow to the deity)\n\nAward marks for: correct verb forms (4), correct objects in dvitīyā (3), use of 8+ different verbs (3).\n\n---\n\n**Total: 60 marks**\n"}, "tabs": ["theory", "reference", "workbook-questions", "workbook-answers"]}, {"id": "05-karaka", "number": 5, "title": "Karaka", "subtitle": "Semantic Relations", "files": {"theory": "# Stage 5: Kāraka — Semantic Relations\n\n## Goal\nUnderstand the kāraka system — the deep semantic roles that map to vibhaktis — and build complete devotional sentences with multiple participants.\n\n## What is Kāraka?\n\n**Kāraka** (कारक) means \"that which causes action.\" It is the Pāṇinian system for describing the semantic roles that nouns play in relation to a verb. While vibhakti is the surface form (ending), kāraka is the underlying meaning.\n\n## The Six Kārakas\n\n| Kāraka | Meaning | Typical Vibhakti | Example |\n|--------|---------|------------------|---------|\n| **Kartā** | Agent/doer | Prathamā (1st) | **bhaktaḥ** pūjayati (the devotee worships) |\n| **Karma** | Object/patient | Dvitīyā (2nd) | bhaktaḥ **devam** pūjayati (worships the deity) |\n| **Karaṇa** | Instrument/means | Tṛtīyā (3rd) | **puṣpeṇa** pūjayati (worships with a flower) |\n| **Sampradāna** | Recipient/purpose | Caturthī (4th) | **śivāya** namaḥ (salutation to Śiva) |\n| **Apādāna** | Source/origin | Pañcamī (5th) | **parvātat** nadī patati (river falls from mountain) |\n| **Adhikaraṇa** | Location/locus | Saptamī (7th) | **mandire** pūjā (worship in the temple) |\n\nNote: Ṣaṣṭhī (genitive, \"of\") is NOT a kāraka — it expresses sambandha (relation) rather than participation in the action.\n\n## Kāraka in Devotional Sentences\n\n### Full Sentence Analysis\n\n**bhaktaḥ bhaktyā mandire śivāya puṣpam dadāti**\n(The devotee gives a flower to Śiva in the temple with devotion)\n\n| Word | Vibhakti | Kāraka | Role |\n|------|---------|--------|------|\n| bhaktaḥ | 1st | Kartā | agent — who gives |\n| bhaktyā | 3rd | Karaṇa | instrument — by what means |\n| mandire | 7th | Adhikaraṇa | location — where |\n| śivāya | 4th | Sampradāna | recipient — to whom |\n| puṣpam | 2nd | Karma | object — what is given |\n| dadāti | verb | — | action — gives |\n\n## Building Complex Devotional Sentences\n\n### Pattern 1: Kartā + Karma + Kriyā (Subject + Object + Verb)\n> bhaktaḥ devam namati — The devotee bows to the deity\n\n### Pattern 2: + Karaṇa (adding instrument)\n> bhaktaḥ puṣpeṇa devam pūjayati — The devotee worships the deity with a flower\n\n### Pattern 3: + Sampradāna (adding recipient)\n> bhaktaḥ śivāya puṣpam dadāti — The devotee gives a flower to Śiva\n\n### Pattern 4: + Adhikaraṇa (adding location)\n> bhaktaḥ mandire śivāya puṣpam dadāti — The devotee gives a flower to Śiva in the temple\n\n### Pattern 5: + Karaṇa (adding manner)\n> bhaktaḥ bhaktyā mandire śivāya puṣpam dadāti — with devotion, in the temple, to Śiva, a flower, the devotee gives\n\n## The Pūjā Grammar Game\n\nExpress each step of pūjā as a full kāraka sentence:\n\n1. **āvāhanam**: bhaktaḥ bhaktyā devam āvāhayati\n   (The devotee invokes the deity with devotion)\n\n2. **āsanam**: bhaktaḥ devāya āsanam arpayati\n   (The devotee offers a seat to the deity)\n\n3. **puṣpam**: bhaktaḥ devāya sundaram puṣpam dadāti\n   (The devotee gives a beautiful flower to the deity)\n\n4. **dhūpam**: bhaktaḥ dhūpena devam arcati\n   (The devotee worships the deity with incense)\n\n5. **naivedyam**: bhaktaḥ devāya naivedyam nivedayati\n   (The devotee presents food to the deity)\n\n## Tṛtīyā as Bhāva (Manner)\n\nThe instrumental case often expresses the emotional manner of worship:\n\n| Expression | Meaning |\n|-----------|---------|\n| bhaktyā | with devotion |\n| premaṇā | with love |\n| śraddhayā | with faith |\n| ānandena | with joy |\n| namratayā | with humility |\n\n> bhaktyā śivāya puṣpam dadāmi\n> (With devotion I give a flower to Śiva)\n\n## Word Order Freedom\n\nBecause kāraka relations are marked by endings, word order is flexible:\n- śivāya puṣpam dadāmi\n- puṣpam śivāya dadāmi\n- dadāmi śivāya puṣpam\n- puṣpam dadāmi śivāya\n\nAll mean the same thing. Choose the order that emphasizes what matters most (what comes first gets emphasis, what comes just before the verb gets focus).\n\n## Milestone Check\n\nCan you build 5 complete devotional sentences, each with at least 3 kārakas?\n", "reference": "# Stage 5: Kāraka — Reference Guide\n\n## Kāraka-Vibhakti Mapping\n\n| Kāraka | Meaning | Vibhakti | Marker (M -a) | Question |\n|--------|---------|----------|---------------|----------|\n| Kartā | Agent | 1st (prathamā) | -aḥ | Who does? |\n| Karma | Object | 2nd (dvitīyā) | -am | What is done? |\n| Karaṇa | Instrument | 3rd (tṛtīyā) | -ena | By what means? |\n| Sampradāna | Recipient | 4th (caturthī) | -āya | For whom? |\n| Apādāna | Source | 5th (pañcamī) | -āt | From where? |\n| Adhikaraṇa | Location | 7th (saptamī) | -e | Where? |\n| (Sambandha) | Relation | 6th (ṣaṣṭhī) | -asya | Whose? |\n\n## Sentence Building Template\n\n```\n[Kartā/1st] + [Karaṇa/3rd] + [Adhikaraṇa/7th] + [Sampradāna/4th] + [Karma/2nd] + [Kriyā/verb]\n```\n\nExample:\n```\nbhaktaḥ    bhaktyā    mandire    śivāya    puṣpam    dadāti\nkartā      karaṇa     adhikaraṇa sampradāna karma     kriyā\n```\n\n## Common Karaṇa (Instrument) Words\n\n| Sanskrit | Vibhakti 3 | Meaning |\n|----------|-----------|---------|\n| bhakti | bhaktyā | with devotion |\n| śraddhā | śraddhayā | with faith |\n| prema | premaṇā / premṇā | with love |\n| ānanda | ānandena | with joy |\n| puṣpa | puṣpeṇa | with a flower |\n| dhūpa | dhūpena | with incense |\n| mantra | mantreṇa | with a mantra |\n| jala | jalena | with water |\n| candana | candanena | with sandalwood |\n\n## Common Sampradāna (Recipient) Words\n\n| Sanskrit | Vibhakti 4 | Meaning |\n|----------|-----------|---------|\n| śiva | śivāya | to/for Śiva |\n| viṣṇu | viṣṇave | to/for Viṣṇu |\n| devī | devyai | to/for the goddess |\n| gaṇeśa | gaṇeśāya | to/for Gaṇeśa |\n| guru | gurave | to/for the guru |\n| bhakta | bhaktāya | to/for the devotee |\n\n## Common Adhikaraṇa (Location) Words\n\n| Sanskrit | Vibhakti 7 | Meaning |\n|----------|-----------|---------|\n| mandira | mandire | in the temple |\n| hṛdaya | hṛdaye | in the heart |\n| padma | padme | on the lotus |\n| gṛha | gṛhe | in the house |\n| vana | vane | in the forest |\n| nadī | nadyām | in the river |\n| parvata | parvate | on the mountain |\n\n## Pūjā Kāraka Sentences — Complete Set\n\n| Step | Full Sentence | Analysis |\n|------|--------------|----------|\n| Āvāhana | bhaktaḥ bhaktyā devam āvāhayati | K1+K3+K2+V |\n| Āsana | bhaktaḥ devāya āsanam arpayati | K1+K4+K2+V |\n| Pādya | bhaktaḥ jalena devasya pādau prakṣālayati | K1+K3+K6+K2+V |\n| Gandha | bhaktaḥ devāya candanam arpayati | K1+K4+K2+V |\n| Puṣpa | bhaktaḥ devāya puṣpam dadāti | K1+K4+K2+V |\n| Dhūpa | bhaktaḥ dhūpena devam arcati | K1+K3+K2+V |\n| Dīpa | bhaktaḥ dīpena devam arcati | K1+K3+K2+V |\n| Naivedya | bhaktaḥ devāya naivedyam nivedayati | K1+K4+K2+V |\n| Pradakṣiṇā | bhaktaḥ bhaktyā devam pradakṣiṇam karoti | K1+K3+K2+V |\n| Namaskāra | bhaktaḥ devam namati | K1+K2+V |\n\n## Kāraka Analysis Shorthand\n\nUse these codes for quick analysis:\n- K1 = Kartā (agent)\n- K2 = Karma (object)\n- K3 = Karaṇa (instrument)\n- K4 = Sampradāna (recipient)\n- K5 = Apādāna (source)\n- K7 = Adhikaraṇa (location)\n- V = Kriyā (verb)\n- S6 = Sambandha (genitive relation)\n", "workbook-questions": "# Stage 5: Kāraka — Workbook (Questions)\n\n## Section A: Kāraka Identification (15 marks)\n\n**A1.** Identify the kāraka of each underlined word (5 marks):\n1. **bhaktaḥ** devam pūjayati\n2. bhaktaḥ **devam** pūjayati\n3. bhaktaḥ **puṣpeṇa** devam pūjayati\n4. bhaktaḥ **śivāya** namaḥ karoti\n5. bhaktaḥ **mandire** pūjayati\n\n**A2.** For each kāraka, give the typical vibhakti it maps to (6 marks):\n1. Kartā → ___\n2. Karma → ___\n3. Karaṇa → ___\n4. Sampradāna → ___\n5. Apādāna → ___\n6. Adhikaraṇa → ___\n\n**A3.** Which of the 8 vibhaktis is NOT a kāraka? What does it express instead? (4 marks)\n\n---\n\n## Section B: Sentence Analysis (15 marks)\n\n**B1.** Analyze each word in the following sentence (label kāraka and vibhakti) (5 marks):\n\n> bhaktaḥ bhaktyā mandire devāya puṣpam arpayati\n\n| Word | Vibhakti | Kāraka | Role |\n|------|---------|--------|------|\n| bhaktaḥ | | | |\n| bhaktyā | | | |\n| mandire | | | |\n| devāya | | | |\n| puṣpam | | | |\n\n**B2.** Analyze this sentence (5 marks):\n\n> sītā śraddhayā gṛhe rāmāya dīpam jvālayati\n\n| Word | Vibhakti | Kāraka | Role |\n|------|---------|--------|------|\n| sītā | | | |\n| śraddhayā | | | |\n| gṛhe | | | |\n| rāmāya | | | |\n| dīpam | | | |\n\n**B3.** Analyze this sentence (5 marks):\n\n> guruḥ ānandena āśrame śiṣyāya jñānam dadāti\n\n| Word | Vibhakti | Kāraka | Role |\n|------|---------|--------|------|\n| guruḥ | | | |\n| ānandena | | | |\n| āśrame | | | |\n| śiṣyāya | | | |\n| jñānam | | | |\n\n---\n\n## Section C: Sentence Building (20 marks)\n\n**C1.** Build a sentence using these kārakas (5 marks):\n- Kartā: bhaktaḥ\n- Karma: stotram\n- Karaṇa: bhaktyā\n- Adhikaraṇa: mandire\n- Verb: gāyati\nSentence: ___\n\n**C2.** Build a sentence using these elements (5 marks):\n- Kartā: devī\n- Karma: bhaktam\n- Karaṇa: kṛpayā\n- Apādāna: duḥkhāt\n- Verb: rakṣati\nSentence: ___\n\n**C3.** Write 5 complete pūjā sentences, each using at least 3 kārakas. Label the kārakas (10 marks):\n\n1. Sentence: ___\n   Kārakas: ___\n\n2. Sentence: ___\n   Kārakas: ___\n\n3. Sentence: ___\n   Kārakas: ___\n\n4. Sentence: ___\n   Kārakas: ___\n\n5. Sentence: ___\n   Kārakas: ___\n\n---\n\n## Section D: Word Order (10 marks)\n\n**D1.** Rearrange each sentence to emphasize the word in brackets (5 marks):\n1. bhaktaḥ puṣpam devāya dadāti [emphasize: puṣpam]\n2. śivaḥ bhaktam rakṣati [emphasize: śivaḥ]\n3. mandire bhaktaḥ dhyāyati [emphasize: mandire]\n\n**D2.** Do all three arrangements below mean the same thing? Explain (5 marks):\n1. śivāya puṣpam dadāmi\n2. puṣpam dadāmi śivāya\n3. dadāmi śivāya puṣpam\n\n---\n\n**Total: 60 marks**\n", "workbook-answers": "# Stage 5: Kāraka — Workbook (Answers)\n\n## Section A\n\n**A1.**\n1. bhaktaḥ → **Kartā** (agent)\n2. devam → **Karma** (object)\n3. puṣpeṇa → **Karaṇa** (instrument)\n4. śivāya → **Sampradāna** (recipient)\n5. mandire → **Adhikaraṇa** (location)\n\n**A2.**\n1. Kartā → **Prathamā (1st)**\n2. Karma → **Dvitīyā (2nd)**\n3. Karaṇa → **Tṛtīyā (3rd)**\n4. Sampradāna → **Caturthī (4th)**\n5. Apādāna → **Pañcamī (5th)**\n6. Adhikaraṇa → **Saptamī (7th)**\n\n**A3.** **Ṣaṣṭhī (6th / genitive)** is not a kāraka. It expresses **sambandha** (relation/possession), e.g., \"śivasya mandiraṃ\" (Śiva's temple). It does not describe a participant in the action.\n\n---\n\n## Section B\n\n**B1.**\n| Word | Vibhakti | Kāraka | Role |\n|------|---------|--------|------|\n| bhaktaḥ | 1st | Kartā | agent — who offers |\n| bhaktyā | 3rd | Karaṇa | instrument — with devotion |\n| mandire | 7th | Adhikaraṇa | location — in the temple |\n| devāya | 4th | Sampradāna | recipient — to the deity |\n| puṣpam | 2nd | Karma | object — what is offered |\n\n**B2.**\n| Word | Vibhakti | Kāraka | Role |\n|------|---------|--------|------|\n| sītā | 1st | Kartā | agent — Sītā |\n| śraddhayā | 3rd | Karaṇa | instrument — with faith |\n| gṛhe | 7th | Adhikaraṇa | location — in the house |\n| rāmāya | 4th | Sampradāna | recipient — for Rāma |\n| dīpam | 2nd | Karma | object — a lamp |\n\n**B3.**\n| Word | Vibhakti | Kāraka | Role |\n|------|---------|--------|------|\n| guruḥ | 1st | Kartā | agen
