t — the guru |\n| ānandena | 3rd | Karaṇa | instrument — with joy |\n| āśrame | 7th | Adhikaraṇa | location — in the āśrama |\n| śiṣyāya | 4th | Sampradāna | recipient — to the student |\n| jñānam | 2nd | Karma | object — knowledge |\n\n---\n\n## Section C\n\n**C1.** **bhaktaḥ bhaktyā mandire stotram gāyati**\n(The devotee sings a hymn with devotion in the temple)\n\n**C2.** **devī kṛpayā bhaktam duḥkhāt rakṣati**\n(The goddess protects the devotee from suffering with grace)\n\n**C3.** Sample answers:\n\n1. **bhaktaḥ bhaktyā mandire devam namati**\n   K1=bhaktaḥ, K3=bhaktyā, K7=mandire, K2=devam\n\n2. **bālaḥ premaṇā devāya puṣpam arpayati**\n   K1=bālaḥ, K3=premaṇā, K4=devāya, K2=puṣpam\n\n3. **yogī hṛdaye śivam dhyāyati**\n   K1=yogī, K7=hṛdaye, K2=śivam\n\n4. **mātā śraddhayā gṛhe dīpam jvālayati**\n   K1=mātā, K3=śraddhayā, K7=gṛhe, K2=dīpam\n\n5. **guruḥ āśrame śiṣyāya mantram dadāti**\n   K1=guruḥ, K7=āśrame, K4=śiṣyāya, K2=mantram\n\n---\n\n## Section D\n\n**D1.**\n1. Emphasize puṣpam: **puṣpam bhaktaḥ devāya dadāti**\n2. Emphasize śivaḥ: **śivaḥ bhaktam rakṣati** (already first — correct)\n3. Emphasize mandire: **mandire bhaktaḥ dhyāyati** (already first — correct)\n\n**D2.** **Yes**, all three mean the same thing: \"I give a flower to Śiva.\" Because kāraka relations are encoded in the vibhakti endings (-āya = dative, puṣpam = accusative), the meaning is preserved regardless of word order. The difference is emphasis: the first position carries topical emphasis, and the pre-verbal position carries focus.\n\n---\n\n**Total: 60 marks**\n"}, "tabs": ["theory", "reference", "workbook-questions", "workbook-answers"]}, {"id": "06-sambodhana", "number": 6, "title": "Sambodhana", "subtitle": "Direct Address", "files": {"theory": "# Stage 6: Sambodhana — Direct Address\n\n## Goal\nLearn to speak directly to the deity — vocative case, imperatives, and spontaneous prayer. Move from talking *about* the divine to talking *to* the divine.\n\n## What is Sambodhana?\n\n**Sambodhana** (सम्बोधन) is the vocative case — the form used when calling or addressing someone directly. It is the grammar of prayer, invocation, and intimate conversation with the divine.\n\n## Vocative Forms\n\n### Masculine -a stems\n- devaḥ → **he deva!** (O god!)\n- śivaḥ → **he śiva!** (O Śiva!)\n- rāmaḥ → **he rāma!** (O Rāma!)\n\nRule: Drop the -aḥ visarga, keep the -a. Prefix with **he** (हे).\n\n### Feminine -ā stems\n- durgā → **he durge!** (O Durgā!)\n- gaṅgā → **he gaṅge!** (O Gaṅgā!)\n- mālā → **he māle!**\n\nRule: -ā becomes -e.\n\n### Feminine -ī stems\n- devī → **he devi!** (O Goddess!)\n- lakṣmī → **he lakṣmi!**\n- pārvatī → **he pārvati!**\n\nRule: Long -ī shortens to -i.\n\n### Masculine -u stems\n- viṣṇuḥ → **he viṣṇo!** (O Viṣṇu!)\n- guruḥ → **he guro!**\n\nRule: -uḥ becomes -o.\n\n### Masculine -i stems\n- agniḥ → **he agne!** (O Fire!)\n- muniḥ → **he mune!**\n\nRule: -iḥ becomes -e.\n\n## Imperatives (Loṭ-lakāra)\n\nWhen addressing the deity, we use imperative verb forms:\n\n### 2nd Person (requesting the deity to act)\n| Verb | Imperative (2P sg) | Meaning |\n|------|-------------------|---------|\n| pā (protect) | **pāhi** | protect! |\n| rakṣ (protect) | **rakṣa** | protect! |\n| dā (give) | **dehi** | give! |\n| kṛ (do/make) | **kuru** | do/make! |\n| pra-sad (be gracious) | **prasīda** | be gracious! |\n| kṣam (forgive) | **kṣamasva** | forgive! |\n| nī (lead) | **naya** | lead! |\n| śru (hear) | **śṛṇu** | hear/listen! |\n| ā-gam (come) | **āgaccha** | come! |\n| darśay (show) | **darśaya** | show! |\n\n### 3rd Person (benedictive — \"let X happen\")\n| Form | Meaning |\n|------|---------|\n| pātu | let [deity] protect |\n| rakṣatu | let [deity] protect |\n| bhavatu | let it be |\n| jayatu | let [deity] be victorious |\n| nayatu | let [deity] lead |\n\n## Building Spontaneous Prayers\n\n### Structure 1: Address + Imperative\n> he śiva! prasīda! — O Śiva, be gracious!\n> he devi! rakṣa mām! — O Goddess, protect me!\n> he kṛṣṇa! pāhi mām! — O Kṛṣṇa, save me!\n\n### Structure 2: Address + Imperative + Object\n> he rāma! dehi me bhaktim — O Rāma, give me devotion!\n> he devi! dehi me jñānam — O Goddess, give me knowledge!\n> he guru! naya mām — O Guru, lead me!\n\n### Structure 3: Address + Description + Imperative\n> he karuṇāmaya śiva! prasīda! — O compassionate Śiva, be gracious!\n> he jagadambike! rakṣa mām! — O Mother of the world, protect me!\n\n### Structure 4: Multiple Requests\n> he devi! pāhi mām, rakṣa mām, naya mām!\n> O Goddess, save me, protect me, lead me!\n\n## Key Pronoun: mām (me)\n\nWhen praying, you often need \"me\" — this is **mām** (माम्), the accusative of aham:\n\n| Case | Form | Meaning |\n|------|------|---------|\n| Nominative | aham | I |\n| Accusative | mām | me (object) |\n| Instrumental | mayā | by me |\n| Dative | mahyam / me | to/for me |\n| Genitive | mama / me | my, of me |\n| Locative | mayi | in me |\n\n## The Particle \"namaḥ\"\n\n**namaḥ** takes the dative (caturthī), not the vocative:\n- śivāya namaḥ (salutation TO Śiva) — correct\n- he śiva! namaḥ — mixing vocative address with namaḥ (also used)\n\n## Classical Prayer Phrases\n\n| Sanskrit | Meaning |\n|----------|---------|\n| he śiva prasīda | O Śiva, be gracious |\n| he devi rakṣa mām | O Goddess, protect me |\n| tvaṃ eva mātā ca pitā tvaṃ eva | You alone are mother and father |\n| tvaṃ eva sarvaṃ mama deva deva | You alone are everything, O God of gods |\n| śaraṇam prapadye | I take refuge |\n| tvām eva śaraṇam | You alone are refuge |\n| kṛpāṃ kuru | show mercy |\n| bhayāt trāhi | save from fear |\n\n## Milestone Check\n\nCan you compose a spontaneous 4-line prayer to your iṣṭadevatā using vocative + imperatives?\n", "reference": "# Stage 6: Sambodhana — Reference Guide\n\n## Vocative Formation Rules\n\n| Stem Type | Nominative | Vocative | Rule |\n|-----------|-----------|----------|------|\n| M -a | devaḥ | he deva! | drop visarga |\n| F -ā | durgā | he durge! | -ā → -e |\n| F -ī | devī | he devi! | -ī → -i |\n| M -u | guruḥ | he guro! | -uḥ → -o |\n| M -i | agniḥ | he agne! | -iḥ → -e |\n| M -an | rājan | he rājan! | unchanged |\n| M -at | bhagavat | he bhagavan! | -at → -an |\n\n## Deity Vocative Forms\n\n| Deity | Nominative | Vocative |\n|-------|-----------|----------|\n| Śiva | śivaḥ | he śiva! |\n| Viṣṇu | viṣṇuḥ | he viṣṇo! |\n| Kṛṣṇa | kṛṣṇaḥ | he kṛṣṇa! |\n| Rāma | rāmaḥ | he rāma! |\n| Gaṇeśa | gaṇeśaḥ | he gaṇeśa! |\n| Devī | devī | he devi! |\n| Durgā | durgā | he durge! |\n| Lakṣmī | lakṣmī | he lakṣmi! |\n| Sarasvatī | sarasvatī | he sarasvati! |\n| Pārvatī | pārvatī | he pārvati! |\n| Ambā | ambā | he ambe! |\n| Bhagavān | bhagavān | he bhagavan! |\n\n## Imperative Forms (Loṭ-lakāra)\n\n### 2nd Person Singular (commands/requests)\n\n| Root | Imperative | Meaning |\n|------|-----------|---------|\n| pā | pāhi | protect/save |\n| rakṣ | rakṣa | protect |\n| trā | trāhi | save/rescue |\n| dā | dehi | give |\n| kṛ | kuru | do/make |\n| nī | naya | lead |\n| gam | gaccha | go |\n| ā-gam | āgaccha | come |\n| śru | śṛṇu | hear/listen |\n| pra-sad | prasīda | be gracious |\n| kṣam | kṣamasva | forgive |\n| darśay | darśaya | show |\n| bhaj | bhaja | worship/adore |\n| jñā | jānīhi | know |\n| brū | brūhi | speak/tell |\n| tyaj | tyaja | abandon/release |\n\n### 3rd Person Singular (benedictive \"let...\")\n\n| Root | Imperative | Meaning |\n|------|-----------|---------|\n| pā | pātu | let [him/her] protect |\n| rakṣ | rakṣatu | let [him/her] protect |\n| bhū | bhavatu | let it be |\n| ji | jayatu | let [him/her] be victorious |\n| nī | nayatu | let [him/her] lead |\n| vas | vasatu | let [him/her] dwell |\n| kṛ | karotu | let [him/her] do |\n\n## Pronoun Quick Reference (aham = I)\n\n| Case | Form | Use in Prayer |\n|------|------|--------------|\n| 1st | aham | aham bhaktaḥ (I am a devotee) |\n| 2nd | mām | rakṣa mām (protect me) |\n| 3rd | mayā | mayā kṛtam (done by me) |\n| 4th | mahyam / me | dehi me (give to me) |\n| 5th | mat | mat sakāśāt (from me) |\n| 6th | mama / me | mama pāpam (my sin) |\n| 7th | mayi | mayi kṛpā kuru (show mercy to me) |\n\n## Prayer Building Blocks\n\n### Openings\n| Sanskrit | Meaning |\n|----------|---------|\n| he śiva! | O Śiva! |\n| he jagadīśvara! | O Lord of the world! |\n| he karuṇānidhe! | O treasury of compassion! |\n| he jagadamba! | O Mother of the world! |\n| he bhagavan! | O Lord! |\n\n### Requests\n| Sanskrit | Meaning |\n|----------|---------|\n| prasīda | be gracious |\n| pāhi mām | save me |\n| rakṣa mām | protect me |\n| dehi me bhaktim | give me devotion |\n| dehi me jñānam | give me knowledge |\n| naya mām | lead me |\n| kṛpāṃ kuru | show mercy |\n| kṣamasva | forgive |\n\n### Surrender Phrases\n| Sanskrit | Meaning |\n|----------|---------|\n| śaraṇam prapadye | I take refuge |\n| tvām prapadye | I surrender to you |\n| tavāsmi | I am yours |\n| tvayi sarvaṃ samarpayāmi | I offer everything to you |\n| tvam eva mama sarvasvaṃ | you alone are my everything |\n\n### Closings\n| Sanskrit | Meaning |\n|----------|---------|\n| namaḥ | salutation |\n| namo namaḥ | repeated salutation |\n| jayatu jayatu | victory, victory |\n| svāhā | offering (in fire) |\n| svasti | may there be well-being |\n", "workbook-questions": "# Stage 6: Sambodhana — Workbook (Questions)\n\n## Section A: Vocative Formation (10 marks)\n\n**A1.** Give the vocative (sambodhana) form (5 marks):\n1. śivaḥ → he ___!\n2. devī → he ___!\n3. durgā → he ___!\n4. viṣṇuḥ → he ___!\n5. agniḥ → he ___!\n\n**A2.** Give the vocative for these compound epithets (5 marks):\n1. mahādevaḥ → he ___!\n2. jagadambā → he ___!\n3. bhagavān → he ___!\n4. karuṇāmayī (devī) → he ___!\n5. sundarī (devī) → he ___!\n\n---\n\n## Section B: Imperatives (10 marks)\n\n**B1.** Give the 2nd person singular imperative (5 marks):\n1. pā (to protect) → ___\n2. dā (to give) → ___\n3. kṛ (to do) → ___\n4. pra-sad (to be gracious) → ___\n5. rakṣ (to protect) → ___\n\n**B2.** Give the 3rd person singular imperative (\"let him/her...\") (5 marks):\n1. pā → ___\n2. bhū (to be) → ___\n3. ji (to conquer) → ___\n4. rakṣ → ___\n5. nī (to lead) → ___\n\n---\n\n## Section C: Prayer Construction (20 marks)\n\n**C1.** Combine the vocative and imperative to form a prayer (5 marks):\n1. Śiva + protect me → ___\n2. Devī + be gracious → ___\n3. Kṛṣṇa + give me devotion → ___\n4. Rāma + lead me → ___\n5. Guru + forgive → ___\n\n**C2.** Translate into Sanskrit (5 marks):\n1. O Śiva, I bow to you!\n2. O Mother, protect me!\n3. O Lord, give me knowledge!\n4. O Goddess, be gracious!\n5. I take refuge in you.\n\n**C3.** Translate into English (5 marks):\n1. he devi! pāhi mām!\n2. he kṛṣṇa! dehi me premam\n3. he bhagavan! kṛpāṃ kuru\n4. he śiva! tvaṃ eva mama śaraṇam\n5. he rāma! prasīda, rakṣa mām\n\n**C4.** Compose a 4-line prayer to your iṣṭadevatā. Each line must contain a vocative and at least one imperative (5 marks):\n1. ___\n2. ___\n3. ___\n4. ___\n\n---\n\n## Section D: Pronoun Usage (10 marks)\n\n**D1.** Fill in the correct form of \"aham\" (I/me/my) (5 marks):\n1. rakṣa ___ (protect me) [accusative]\n2. dehi ___ jñānam (give ___ knowledge) [dative]\n3. ___ pāpam kṣamasva (forgive ___ sin) [genitive]\n4. ___ bhaktaḥ asmi (I am a devotee) [nominative]\n5. ___ kṛpā kuru (show mercy on me) [locative]\n\n**D2.** Write a 3-line prayer using mām, mama, and mayi (5 marks):\n1. ___ (using mām)\n2. ___ (using mama)\n3. ___ (using mayi)\n\n---\n\n## Section E: Milestone — Spontaneous Prayer (10 marks)\n\nCompose an original prayer of at least 6 lines to any deity. Include:\n- Vocative address (at least 2 different forms)\n- At least 4 different imperatives\n- Use of mām / mama / me\n- One line of praise (adjective + noun)\n- One line of surrender\n\n1. ___\n2. ___\n3. ___\n4. ___\n5. ___\n6. ___\n\n---\n\n**Total: 60 marks**\n", "workbook-answers": "# Stage 6: Sambodhana — Workbook (Answers)\n\n## Section A\n\n**A1.**\n1. śivaḥ → he **śiva**!\n2. devī → he **devi**!\n3. durgā → he **durge**!\n4. viṣṇuḥ → he **viṣṇo**!\n5. agniḥ → he **agne**!\n\n**A2.**\n1. mahādevaḥ → he **mahādeva**!\n2. jagadambā → he **jagadambe**!\n3. bhagavān → he **bhagavan**!\n4. karuṇāmayī → he **karuṇāmayi**!\n5. sundarī → he **sundari**!\n\n---\n\n## Section B\n\n**B1.**\n1. pā → **pāhi**\n2. dā → **dehi**\n3. kṛ → **kuru**\n4. pra-sad → **prasīda**\n5. rakṣ → **rakṣa**\n\n**B2.**\n1. pā → **pātu**\n2. bhū → **bhavatu**\n3. ji → **jayatu**\n4. rakṣ → **rakṣatu**\n5. nī → **nayatu**\n\n---\n\n## Section C\n\n**C1.**\n1. **he śiva! pāhi mām!** (or rakṣa mām)\n2. **he devi! prasīda!**\n3. **he kṛṣṇa! dehi me bhaktim!**\n4. **he rāma! naya mām!**\n5. **he guro! kṣamasva!**\n\n**C2.**\n1. **he śiva! tvām namāmi!** (or tubhyaṃ namaḥ)\n2. **he ambe! rakṣa mām!** (or he mātar!)\n3. **he bhagavan! dehi me jñānam!**\n4. **he devi! prasīda!**\n5. **tvāṃ śaraṇaṃ prapadye**\n\n**C3.**\n1. O Goddess, save me!\n2. O Kṛṣṇa, give me love\n3. O Lord, show mercy\n4. O Śiva, you alone are my refuge\n5. O Rāma, be gracious, protect me\n\n**C4.** Sample for Śiva:\n1. he śiva! he mahādeva! prasīda!\n2. he karuṇānidhe! pāhi mām!\n3. he nīlakaṇṭha! dehi me jñānam!\n4. he śambho! rakṣa mām sadā!\n\n---\n\n## Section D\n\n**D1.**\n1. rakṣa **mām**\n2. dehi **mahyam** (or **me**) jñānam\n3. **mama** pāpam kṣamasva\n4. **aham** bhaktaḥ asmi\n5. **mayi** kṛpāṃ kuru\n\n**D2.** Sample:\n1. he devi! rakṣa **mām** — O Goddess, protect me\n2. **mama** pāpam kṣamasva — forgive my sin\n3. **mayi** kṛpāṃ kuru — show mercy upon me\n\n---\n\n## Section E\n\nSample prayer to Devī:\n1. **he devi! he jagadambe! namāmi tvām** (O Goddess, O Mother of the world, I bow to you)\n2. **tvaṃ karuṇāmayī, tvaṃ sundarī** (You are full of compassion, you are beautiful)\n3. **pāhi mām he mātar!** (Save me, O Mother!)\n4. **dehi me bhaktim, dehi me jñānam** (Give me devotion, give me knowledge)\n5. **mama pāpam kṣamasva** (Forgive my sins)\n6. **tvām eva śaraṇaṃ prapadye** (To you alone I take refuge)\n\nAward marks for: vocative forms (2), imperative variety (3), pronoun usage (2), praise line (1), surrender line (1), overall coherence (1).\n\n---\n\n**Total: 60 marks**\n"}, "tabs": ["theory", "reference", "workbook-questions", "workbook-answers"]}, {"id": "07-dhatu", "number": 7, "title": "Dhatu", "subtitle": "Roots & Upasargas", "files": {"theory": "# Stage 7: Dhātu — Roots and Upasargas\n\n## Goal\nUnderstand verbal roots (dhātus) as the atomic units of Sanskrit meaning, and learn how upasargas (prefixes) transform them systematically. See the semantic architecture hidden inside sacred vocabulary.\n\n## What is a Dhātu?\n\nA **dhātu** (धातु) is a verbal root — the irreducible seed from which verbs, nouns, adjectives, and entire families of words grow. Pāṇini's Dhātupāṭha lists ~2000 roots. Mastering even 50 core roots unlocks thousands of words.\n\n## Core Dhātus for Devotional Sanskrit\n\n| Dhātu | Basic Meaning | Verb | Noun | Adjective |\n|-------|--------------|------|------|-----------|\n| √kṛ | to do/make | karoti | karma (action) | kṛta (done) |\n| √bhū | to be/become | bhavati | bhava (existence) | bhūta (being) |\n| √gam | to go | gacchati | gati (path) | gata (gone) |\n| √dā | to give | dadāti | dāna (gift) | datta (given) |\n| √dṛś | to see | paśyati | darśana (vision) | dṛṣṭa (seen) |\n| √jñā | to know | jānāti | jñāna (knowledge) | jñāta (known) |\n| √nam | to bow | namati | namas (bow) | nata (bowed) |\n| √bhaj | to serve | bhajati | bhakti (devotion) | bhakta (devoted) |\n| √śru | to hear | śṛṇoti | śruti (hearing) | śruta (heard) |\n| √vac | to speak | vakti | vāc (speech) | ukta (spoken) |\n| √man | to think | manyate | manas (mind) | mata (thought) |\n| √vid | to know | vetti | vidyā (knowledge) | vidita (known) |\n| √sthā | to stand | tiṣṭhati | sthāna (place) | sthita (standing) |\n| √pā | to protect | pāti | pāla (protector) | pālita (protected) |\n| √muc | to release | muñcati | mokṣa (liberation) | mukta (released) |\n| √yuj | to join | yunakti | yoga (union) | yukta (joined) |\n| √jan | to be born | jāyate | janma (birth) | jāta (born) |\n| √har | to take/seize | harati | hara (remover) | hṛta (taken) |\n| √pūj | to worship | pūjayati | pūjā (worship) | pūjita (worshipped) |\n| √stu | to praise | stauti | stuti (praise) | stuta (praised) |\n\n## Upasargas (Prefixes)\n\nSanskrit has 22 traditional upasargas that modify root meanings:\n\n| Upasarga | Core Meaning | Example with √gam |\n|----------|-------------|-------------------|\n| pra- | forth, forward | pragacchati (goes forth) |\n| parā- | away, back | parāgacchati (goes away) |\n| apa- | away, off | apagacchati (departs) |\n| sam- | together, fully | saṃgacchati (comes together) |\n| anu- | after, along | anugacchati (follows) |\n| ava- | down | avagacchati (understands) |\n| nis- | out, away | nirgacchati (goes out) |\n| dur- | bad, hard | durgama (hard to go) |\n| abhi- | toward | abhigacchati (approaches) |\n| adhi- | over, upon | adhigacchati (attains) |\n| su- | good, well | sugama (easy to go) |\n| ut- | up | udgacchati (rises) |\n| ati- | beyond | atigacchati (transcends) |\n| vi- | apart, special | vigacchati (separates) |\n| ā- | toward, back | āgacchati (comes) |\n| prati- | toward, against | pratigacchati (returns) |\n| pari- | around | parigacchati (goes around) |\n| upa- | near | upagacchati (approaches) |\n\n## The Mantra of Meanings: √grah as Example\n\n**√grah** (to seize/grasp):\n\n| Prefix + Root | Word | Meaning | Shift |\n|--------------|------|---------|-------|\n| grah | graha | planet (that seizes) | basic |\n| anu + grah | **anugraha** | grace, favor | \"seize after\" → bless |\n| ni + grah | **nigraha** | restraint, control | \"seize down\" → subdue |\n| sam + grah | **saṃgraha** | collection | \"seize together\" → gather |\n| pari + grah | **parigraha** | acceptance, embrace | \"seize around\" → surround |\n| vi + grah | **vigraha** | conflict, form | \"seize apart\" → separate |\n| upa + grah | **upagraha** | satellite, support | \"seize near\" → assist |\n| pra + grah | **pragraha** | rein, control | \"seize forward\" → guide |\n\nFrom one root, an entire philosophical vocabulary blooms.\n\n## Sacred Vocabulary Through Dhātu-Analysis\n\n### Divine Names as Root-Derivatives\n\n| Name | Dhātu | Meaning |\n|------|-------|---------|\n| Śiva | √śī (to lie) or auspicious | the auspicious one |\n| Viṣṇu | √viṣ (to pervade) | the all-pervading |\n| Brahman | √bṛh (to expand) | the vast, expansive |\n| Rudra | √rud (to cry/roar) | the howler |\n| Bhagavān | √bhaj (to share) | possessor of bhagas |\n| Īśvara | √īś (to rule) | the ruler |\n| Hara | √hṛ (to take) | the remover (of sin) |\n| Dhātā | √dhā (to place) | the placer, creator |\n| Vidhi | √dhā (to place) + vi | ordainer |\n| Kartā | √kṛ (to do) | the doer |\n\n### Bhakti Vocabulary from √bhaj\n\n| Word | Form | Meaning |\n|------|------|---------|\n| bhajati | verb | serves, adores |\n| bhakti | abstract noun | devotion |\n| bhakta | past participle | devoted; devotee |\n| bhajana | action noun | worship, singing |\n| bhāgavata | derivative | pertaining to Bhagavān |\n| bhāga | derivative | share, portion |\n\n## Kṛt-pratyayas (Root Suffixes)\n\nThese suffixes attach to dhātus to create new words:\n\n| Suffix | Creates | Example |\n|--------|---------|---------|\n| -ta / -na | past participle | kṛta (done), datta (given) |\n| -ti | abstract noun (F) | bhakti, śakti, mukti |\n| -ana | action noun (N) | darśana, smaraṇa |\n| -tṛ | agent noun | kartā (doer), dātā (giver) |\n| -ya | gerundive (\"to be X\") | pūjya (to be worshipped) |\n| -in | possessor | yogin (one who has yoga) |\n\n## Milestone Check\n\nGiven a word like \"anugraha,\" can you identify the root (√grah) and prefix (anu-), and explain how the meaning shifts? Can you see the semantic architecture in at least 10 sacred words?\n", "reference": "# Stage 7: Dhātu — Reference Guide\n\n## 50 Core Dhātus\n\n| # | Dhātu | Meaning | Class | Present 3sg | Key Derivative |\n|---|-------|---------|-------|-------------|---------------|\n| 1 | √kṛ | do/make | 8U | karoti | karma, kṛta |\n| 2 | √bhū | be/become | 1P | bhavati | bhava, bhūta |\n| 3 | √as | be/exist | 2P | asti | sat, astitva |\n| 4 | √gam | go | 1P | gacchati | gati, gata |\n| 5 | √dā | give | 3P | dadāti | dāna, datta |\n| 6 | √dhā | place/hold | 3U | dadhāti | dhāman, hita |\n| 7 | √dṛś | see | 1P | paśyati | darśana, dṛṣṭa |\n| 8 | √śru | hear | 5P | śṛṇoti | śruti, śruta |\n| 9 | √jñā | know | 9U | jānāti | jñāna, jñāta |\n| 10 | √vid | know | 2P | vetti | vidyā, vidita |\n| 11 | √vac | speak | 2P | vakti | vāc, ukta |\n| 12 | √brū | say | 2U | bravīti | — |\n| 13 | √man | think | 4Ā | manyate | manas, mata |\n| 14 | √budh | know/wake | 1P | bodhati | bodha, buddha |\n| 15 | √nam | bow | 1P | namati | namas, nata |\n| 16 | √bhaj | serve/adore | 1U | bhajati | bhakti, bhakta |\n| 17 | √pūj | worship | 10U | pūjayati | pūjā, pūjita |\n| 18 | √stu | praise | 2U | stauti | stuti, stuta |\n| 19 | √sev | serve | 1Ā | sevate | sevā, sevita |\n| 20 | √yaj | sacrifice | 1U | yajati | yajña, iṣṭa |\n| 21 | √hu | pour (oblation) | 3P | juhoti | homa, huta |\n| 22 | √sthā | stand | 1P | tiṣṭhati | sthāna, sthita |\n| 23 | √nī | lead | 1U | nayati | nīti, nīta |\n| 24 | √pā | protect | 2P | pāti | pāla, pālita |\n| 25 | √rakṣ | protect | 1P | rakṣati | rakṣā, rakṣita |\n| 26 | √hṛ | take/seize | 1U | harati | haraṇa, hṛta |\n| 27 | √grah | grasp | 9U | gṛhṇāti | graha, gṛhīta |\n| 28 | √muc | release | 6P | muñcati | mokṣa, mukta |\n| 29 | √yuj | join | 7U | yunakti | yoga, yukta |\n| 30 | √jan | be born | 4Ā | jāyate | janma, jāta |\n| 31 | √mṛ | die | 6Ā | mriyate | mṛtyu, mṛta |\n| 32 | √ji | conquer | 1P | jayati | jaya, jita |\n| 33 | √vṛt | turn/exist | 1Ā | vartate | vṛtti, vṛtta |\n| 34 | √car | move/act | 1P | carati | carya, carita |\n| 35 | √pat | fall | 1P | patati | pāta, patita |\n| 36 | √kram | step | 1U | krāmati | krama |\n| 37 | √prach | ask | 6P | pṛcchati | praśna, pṛṣṭa |\n| 38 | √labh | obtain | 1Ā | labhate | lābha, labdha |\n| 39 | √tyaj | abandon | 1P | tyajati | tyāga, tyakta |\n| 40 | √smṛ | remember | 1P | smarati | smṛti, smṛta |\n| 41 | √dhyai | meditate | 1P | dhyāyati | dhyāna |\n| 42 | √jap | chant | 1P | japati | japa |\n| 43 | √gai | sing | 1P | gāyati | gāna, gīta |\n| 44 | √likh | write | 6P | likhati | lekha, likhita |\n| 45 | √paṭh | recite | 1P | paṭhati | pāṭha |\n| 46 | √vas | dwell | 1P | vasati | vāsa |\n| 47 | √īś | rule | 2Ā | īṣṭe | īśvara |\n| 48 | √śī | lie/sleep | 2Ā | śete | śayana |\n| 49 | √sad | sit | 1P | sīdati | sādana |\n| 50 | √kṣam | forgive | 1Ā | kṣamate | kṣamā |\n\n## 22 Upasargas\n\n| Upasarga | Meaning | Example | Result |\n|----------|---------|---------|--------|\n| pra- | forth | pra+nam | praṇāma (prostration) |\n| parā- | away | parā+ji | parājaya (defeat) |\n| apa- | away, off | apa+nī | apanaya (removal) |\n| sam- | together | sam+gam | saṃgama (confluence) |\n| anu- | after, along | anu+grah | anugraha (grace) |\n| ava- | down | ava+tṝ | avatāra (descent) |\n| nis/nir- | out | nir+gam | nirgama (exit) |\n| dur- | bad, hard | dur+gam | durgama (inaccessible) |\n| abhi- | toward | abhi+ṣic | abhiṣeka (consecration) |\n| adhi- | over, upon | adhi+ṣṭhā | adhiṣṭhāna (foundation) |\n| su- | good, well | su+gam | sugama (accessible) |\n| ut/ud- | up | ut+sṛj | utsarga (offering up) |\n| ati- | beyond | ati+kram | atikrama (transgression) |\n| vi- | apart, special | vi+jñā | vijñāna (discernment) |\n| ā- | toward | ā+gam | āgama (tradition) |\n| prati- | back, toward | prati+pad | pratipad (understanding) |\n| pari- | around | pari+kram | parikrama (circumambulation) |\n| upa- | near | upa+niṣad | upaniṣad (sitting near) |\n| ni- | down, in | ni+vas | nivāsa (dwelling) |\n\n## Kṛt-Pratyaya (Suffix) Table\n\n| Suffix | Function | Example |\n|--------|----------|---------|\n| -ta | past participle | √kṛ → kṛta (done) |\n| -ti | abstract F noun | √bhaj → bhakti |\n| -ana | action N noun | √darś → darśana |\n| -tṛ | agent | √kṛ → kartā (doer) |\n| -ya | \"to be X\" | √pūj → pūjya |\n| -in | \"having X\" | √yuj → yogin |\n| -man | instrument/result | √kṛ → karman |\n| -tra | instrument | √man → mantra |\n| -tva | abstract N noun | √deva → devatva |\n", "workbook-questions": "# Stage 7: Dhātu — Workbook (Questions)\n\n## Section A: Root Identification (15 marks)\n\n**A1.** Identify the dhātu (root) behind each word (5 marks):\n1. darśana → √___\n2. bhakti → √___\n3. mokṣa → √___\n4. jñāna → √___\n5. karma → √___\n\n**A2.** Identify the dhātu and the upasarga in each compound (5 marks):\n1. anugraha → upa: ___ + √___\n2. avatāra → upa: ___ + √___\n3. praṇāma → upa: ___ + √___\n4. saṃgama → upa: ___ + √___\n5. vijñāna → upa: ___ + √___\n\n**A3.** Give the present tense 3rd singular form for each dhātu (5 marks):\n1. √kṛ → ___\n2. √gam → ___\n3. √dṛś → ___\n4. √bhū → ___\n5. √jñā → ___\n\n---\n\n## Section B: Upasarga Transformation (15 marks)\n\n**B1.** Add the given upasarga to √gam and give the meaning (5 marks):\n1. ā + gam → ___ (meaning: ___)\n2. sam + gam → ___ (meaning: ___)\n3. upa + gam → ___ (meaning: ___)\n4. pra + gam → ___ (meaning: ___)\n5. ni + gam → ___ (meaning: ___)\n\n**B2.** Add the given upasarga to √kṛ and give the meaning (5 marks):\n1. sam + kṛ → ___ (meaning: ___)\n2. pra + kṛ → ___ (meaning: ___)\n3. vi + kṛ → ___ (meaning: ___)\n4. upa + kṛ → ___ (meaning: ___)\n5. anu + kṛ → ___ (meaning: ___)\n\n**B3.** For each pair, explain how the upasarga changes the root's meaning (5 marks):\n1. graha vs. anugraha\n2. gama vs. āgama\n3. krama vs. parikrama\n4. nāma vs. praṇāma\n5. jñāna vs. vijñāna\n\n---\n\n## Section C: Word Families (15 marks)\n\n**C1.** From √bhaj, give (5 marks):\n1. Present tense verb (3sg): ___\n2. Abstract noun (-ti): ___\n3. Past participle (-ta): ___\n4. Action noun (-ana): ___\n5. Agent noun: ___\n\n**C2.** From √dṛś, give (5 marks):\n1. Present tense verb (3sg): ___\n2. Abstract noun: ___\n3. Past participle: ___\n4. \"Worth seeing\" (-ya): ___\n5. Agent noun (\"seer\"): ___\n\n**C3.** Identify the divine name's root and explain the etymology (5 marks):\n1. Viṣṇu ← √___ (meaning: ___)\n2. Rudra ← √___ (meaning: ___)\n3. Īśvara ← √___ (meaning: ___)\n4. Hara ← √___ (meaning: ___)\n5. Bhagavān ← √___ (meaning: ___)\n\n---\n\n## Section D: Semantic Architecture (15 marks)\n\n**D1.** Take √hṛ (to take/seize) and show how 4 different upasargas create 4 different sacred concepts (8 marks):\n1. upa: ___ + √hṛ = ___ (meaning: ___)\n2. upa: ___ + √hṛ = ___ (meaning: ___)\n3. upa: ___ + √hṛ = ___ (meaning: ___)\n4. upa: ___ + √hṛ = ___ (meaning: ___)\n\n**D2.** Explain the connection between these words — what root do they share? (7 marks):\n1. yoga, yukta, yuj → √___ meaning: ___\n2. dāna, datta, dātā → √___ meaning: ___\n3. stuti, stuta, stauti → √___ meaning: ___\n\n---\n\n**Total: 60 marks**\n", "workbook-answers": "# Stage 7: Dhātu — Workbook (Answers)\n\n## Section A\n\n**A1.**\n1. darśana → **√dṛś** (to see)\n2. bhakti → **√bhaj** (to serve/adore)\n3. mokṣa → **√muc** (to release)\n4. jñāna → **√jñā** (to know)\n5. karma → **√kṛ** (to do)\n\n**A2.**\n1. anugraha → upa: **anu** + **√grah** (grace = \"seize after\" → bless)\n2. avatāra → upa: **ava** + **√tṝ** (descent = \"cross down\")\n3. praṇāma → upa: **pra** + **√nam** (prostration = \"bow forth\")\n4. saṃgama → upa: **sam** + **√gam** (confluence = \"go together\")\n5. vijñāna → upa: **vi** + **√jñā** (discernment = \"know apart/specially\")\n\n**A3.**\n1. √kṛ → **karoti**\n2. √gam → **gacchati**\n3. √dṛś → **paśyati**\n4. √bhū → **bhavati**\n5. √jñā → **jānāti**\n\n---\n\n## Section B\n\n**B1.**\n1. ā + gam → **āgama** (coming, tradition/scripture)\n2. sam + gam → **saṃgama** (confluence, meeting)\n3. upa + gam → **upagama** (approach)\n4. pra + gam → **pragama** (going forth, advance)\n5. ni + gam → **nigama** (conclusion, Veda)\n\n**B2.**\n1. sam + kṛ → **saṃskāra** / saṃskṛta (refinement, perfected)\n2. pra + kṛ → **prakṛti** (nature, primal matter)\n3. vi + kṛ → **vikāra** / vikṛti (transformation, distortion)\n4. upa + kṛ → **upakāra** (help, service)\n5. anu + kṛ → **anukāra** / anukṛti (imitation)\n\n**B3.**\n1. graha (seizing) vs. anugraha (grace) — **anu-** adds \"following/favoring,\" transforming seizure into blessing\n2. gama (going) vs. āgama (tradition) — **ā-** adds \"toward,\" what has come down to us = scripture\n3. krama (step) vs. parikrama (circumambulation) — **pari-** adds \"around,\" stepping around = sacred circling\n4. nāma (name/bow) vs. praṇāma (prostration) — **pra-** adds \"forth/fully,\" complete bowing\n5. jñāna (knowledge) vs. vijñāna (discernment) — **vi-** adds \"special/distinct,\" knowledge that discriminates\n\n---\n\n## Section C\n\n**C1.** From √bhaj:\n1. Present 3sg: **bhajati**\n2. Abstract noun: **bhakti** (devotion)\n3. Past participle: **bhakta** (devoted)\n4. Action noun: **bhajana** (worship/singing)\n5. Agent noun: **bhājaka** (one who serves) or bhakta as agent\n\n**C2.** From √dṛś:\n1. Present 3sg: **paśyati**\n2. Abstract noun: **darśana** (vision/philosophy)\n3. Past participle: **dṛṣṭa** (seen)\n4. \"Worth seeing\": **darśanīya** or **dṛśya**\n5. Agent noun: **draṣṭā** (seer)\n\n**C3.**\n1. Viṣṇu ← **√viṣ** (to pervade) — \"the all-pervading one\"\n2. Rudra ← **√rud** (to cry/roar) — \"the howler/roarer\"\n3. Īśvara ← **√īś** (to rule) — \"the ruler/lord\"\n4. Hara ← **√hṛ** (to take/remove) — \"the remover (of sin/sorrow)\"\n5. Bhagavān ← **√bhaj** (to share/serve) — \"possessor of bhagas (fortune, power, etc.)\"\n\n---\n\n## Section D\n\n**D1.** √hṛ with different upasargas:\n1. **ā** + √hṛ = **āhāra** (food — \"bringing toward\" → intake)\n2. **upa** + √hṛ = **upahāra** (offering — \"bringing near\" → gift)\n3. **sam** + √hṛ = **saṃhāra** (destruction — \"seizing together\" → dissolution)\n4. **pra** + √hṛ = **prahāra** (strike — \"seizing forth\" → blow)\n\n(Also accept: vi+hṛ = vihāra (sport/monastery); pari+hṛ = parihāra (avoidance))\n\n**D2.**\n1. yoga, yukta, yuj → **√yuj** — \"to join/yoke\"; yoga=union, yukta=joined, yuj=to join\n2. dāna, datta, dātā → **√dā** — \"to give\"; dāna=gift, datta=given, dātā=giver\n3. stuti, stuta, stauti → **√stu** — \"to praise\"; stuti=praise, stuta=praised, stauti=he praises\n\n---\n\n**Total: 60 marks**\n"}, "tabs": ["theory", "reference", "workbook-questions", "workbook-answers"]}, {"id": "08-paryaya", "number": 8, "title": "Paryaya", "subtitle": "Synonyms", "files": {"theory": "# Stage 8: Paryāya — Synonyms\n\n## Goal\nMaster synonyms (paryāyas) for key devotional concepts. Understand how divine epithets are built from attributes, and learn to generate names from qualities — the skill behind aṣṭottaraśatanāma (108 names).\n\n## What is Paryāya?\n\n**Paryāya** (पर्याय) means \"synonym\" or \"alternative expression.\" Sanskrit is extraordinarily rich in synonyms because words are derived from roots: any quality or action associated with an entity can become its name.\n\n## Why Synonyms Matter\n\n1. **Poetic flexibility** — Different synonyms have different syllable counts and vowel patterns, critical for metrical composition\n2. **Depth of understanding** — Each synonym reveals a different facet of the deity\n3. **108 names tradition** — Aṣṭottaraśatanāmāvali are built from paryāyas\n4. **Avadhāna skill** — Rapid synonym recall is essential for spontaneous composition\n\n## Synonyms for Core Concepts\n\n### Names for Śiva (30+)\n\n| Name | Derivation | Meaning |\n|------|-----------|---------|\n| Śiva | √śī + va | the auspicious one |\n| Śambhu | śam + √bhū | source of happiness |\n| Śaṅkara | śam + √kṛ | maker of happiness |\n| Mahādeva | mahā + deva | the great god |\n| Maheśvara | mahā + īśvara | the great lord |\n| Rudra | √rud | the howler |\n| Hara | √hṛ | the remover |\n| Īśa | √īś | the ruler |\n| Īśāna | √īś | the ruling one |\n| Bhava | √bhū | existence itself |\n| Paśupati | paśu + pati | lord of beings |\n| Nīlakaṇṭha | nīla + kaṇṭha | blue-throated |\n| Gaṅgādhara | gaṅgā + √dhṛ | bearer of Gaṅgā |\n| Candraśekhara | candra + śekhara | moon-crested |\n| Trilocana | tri + locana | three-eyed |\n| Naṭarāja | naṭa + rāja | king of dance |\n| Tryambaka | tri + ambaka | three-eyed |\n| Bhairava | √bhī | the fearsome |\n| Vāmadeva | vāma + deva | the beautiful god |\n| Sadāśiva | sadā + śiva | eternally auspicious |\n\n### Names for the Goddess (Devī/Śakti)\n\n| Name | Meaning |\n|------|---------|\n| Devī | the goddess |\n| Ambā / Ambikā | mother |\n| Durgā | the invincible (dur + √gam) |\n| Pārvatī | daughter of the mountain |\n| Gaurī | the fair/golden one |\n| Lalitā | the playful one |\n| Kāmākṣī | she whose eyes are desire |\n| Mīnākṣī | fish-eyed |\n| Tripurasundarī | beauty of the three worlds |\n| Bhavānī | consort of Bhava |\n| Caṇḍikā | the fierce one |\n| Jagadambā | mother of the world |\n| Mahāmāyā | the great illusion |\n| Annapūrṇā | full of food |\n| Śāradā | Sarasvatī (of autumn) |\n\n### Synonyms for Key Concepts\n\n**Sun (Sūrya):** sūrya, āditya, bhāskara, divākara, savitṛ, arka, ravi, bhānu, mārtaṇḍa, mitra, prabhākara, dinamaṇi\n\n**Moon (Candra):** candra, śaśin, indu, soma, niśākara, sudhākara, himāṃśu, mṛgāṅka, kaumudīpati, vidhu\n\n**Lotus (Padma):** padma, kamala, aravinda, pankaja, sarasija, vārija, ambuja, nīraja, jalaja, rajīva, puṇḍarīka\n\n**Water (Jala):** jala, vāri, nīra, toya, ambu, pānīya, salila, uda, āpa, payas\n\n**Fire (Agni):** agni, vahni, anala, pāvaka, hutāśana, dahana, jvalana, kṛśānu, śikhin\n\n## How Epithets Are Built\n\n### From Physical Attributes\n- **nīla** (blue) + **kaṇṭha** (throat) = Nīlakaṇṭha (Śiva)\n- **catur** (four) + **bhuja** (arm) = Caturbhuja (Viṣṇu)\n- **tri** (three) + **netra** (eye) = Trinetra (Śiva)\n\n### From Actions\n- **√hṛ** (to remove) → Hara (the remover)\n- **√pā** (to protect) → Gopāla (cow-protector = Kṛṣṇa)\n- **√dhṛ** (to bear) → Gaṅgādhara (bearer of Gaṅgā)\n\n### From Relationships\n- **pārvata** (of the mountain) → Pārvatī (daughter of Parvata)\n- **dāśarathi** (son of Daśaratha) → Rāma\n- **umā + pati** → Umāpati (Śiva, husband of Umā)\n\n## The 108 Names Forge Game\n\nGiven a deity, generate epithets by combining:\n1. A quality + a body part → nīla-kaṇṭha\n2. An action + an object → gaṅgā-dhara\n3. A number + an attribute → tri-locana\n4. A relationship + a title → umā-pati\n5. A negation + a quality → a-mara (not dying = immortal)\n\n## Milestone Check\n\nCan you explain the etymology of at least 10 divine epithets and generate 5 new grammatically valid ones?\n", "reference": "# Stage 8: Paryāya — Reference Guide\n\n## Synonyms by Category\n\n### Deities — Śiva (40 names)\nśivaḥ, śambhuḥ, śaṅkaraḥ, mahādevaḥ, maheśvaraḥ, rudraḥ, haraḥ, īśaḥ, īśānaḥ, bhavaḥ, paśupatiḥ, nīlakaṇṭhaḥ, gaṅgādharaḥ, candraśekharaḥ, trilocanaḥ, naṭarājaḥ, tryambakaḥ, bhairavaḥ, vāmadevaḥ, sadāśivaḥ, umāpatiḥ, giriśaḥ, girīśaḥ, mṛḍaḥ, kapardī, digambaraḥ, bhūteśvaraḥ, vṛṣabhadhvajaḥ, pinākapāṇiḥ, tripurāntakaḥ, viśvanāthaḥ, bhīmaḥ, ugraḥ, kālakālaḥ, dhūrjaṭiḥ, vyomakeśaḥ, liṅgadhārī, somanāthaḥ, ramaṇāthaḥ, kedāranāthaḥ\n\n### Deities — Viṣṇu (30 names)\nviṣṇuḥ, nārāyaṇaḥ, hariḥ, keśavaḥ, mādhavaḥ, govindaḥ, trivikramaḥ, vāmanaḥ, śrīdharaḥ, hṛṣīkeśaḥ, padmanābhaḥ, dāmodaraḥ, saṅkarṣaṇaḥ, vāsudevaḥ, pradyumnaḥ, aniruddhaḥ, puruṣottamaḥ, adhokṣajaḥ, nṛsiṃhaḥ, acyutaḥ, janārdanaḥ, upendraḥ, vanamālī, lakṣmīpatiḥ, garuḍadhvajaḥ, cakrapāṇiḥ, śārṅgadharaḥ, gadādharaḥ, pītāmbaraḥ, murāriḥ\n\n### Deities — Devī (25 names)\ndevī, ambā, ambikā, durgā, pārvatī, gaurī, lalitā, kāmākṣī, tripurasundarī, bhavānī, caṇḍikā, jagadambā, mahāmāyā, annapūrṇā, śāradā, umā, śaktiḥ, mahālakṣmī, mahāsarasvatī, bālā, rājarājeśvarī, bhairāvī, kālikā, tārā, mātaṅgī\n\n### Nature Synonyms\n\n**Sun:** sūryaḥ, ādityaḥ, bhāskaraḥ, divākaraḥ, savitā, arkaḥ, raviḥ, bhānuḥ, mārtaṇḍaḥ, mitraḥ, prabhākaraḥ, dinamaṇiḥ\n\n**Moon:** candraḥ, śaśī, induḥ, somaḥ, niśākaraḥ, sudhākaraḥ, himāṃśuḥ, mṛgāṅkaḥ, vidhuḥ, kaumudīpatiḥ, rākāpatiḥ, oṣadhīśaḥ\n\n**Lotus:** padmam, kamalam, aravindam, paṅkajam, sarasijam, vārijam, ambujam, nīrajam, jalajam, rajīvam, puṇḍarīkam, nalinam, utpalam\n\n**Water:** jalam, vāri, nīram, toyam, ambu, pānīyam, salilam, udakam, āpaḥ, payaḥ, kīlālam\n\n**Fire:** agniḥ, vahniḥ, analaḥ, pāvakaḥ, hutāśanaḥ, dahanaḥ, jvalanaḥ, kṛśānuḥ, śikhī, vaiśvānaraḥ, vibhāvasuḥ\n\n**Earth:** pṛthivī, bhūmiḥ, dharā, dharaṇī, vasundharā, medinī, avaniḥ, kṣitiḥ, kṣmā, mahī\n\n**Sky:** ākāśaḥ, gagaṇam, vyoma, ambaram, nabhaḥ, dyauḥ, antarikṣam, kham\n\n**Mountain:** parvataḥ, giriḥ, adriḥ, acalaḥ, śailaḥ, nagaḥ, bhūdharaḥ\n\n**Ocean:** samudraḥ, sāgaraḥ, sindhuḥ, abdhi, udadhi, jaladhi, ratnākaraḥ, pārāvāraḥ, ambhodhi, vāridhi\n\n## Epithet-Building Patterns\n\n| Pattern | Formula | Examples |\n|---------|---------|----------|\n| Quality + Body part | adj + noun | nīlakaṇṭha, raktanetra |\n| Object + Bearer | noun + √dhṛ | gaṅgādhara, śārṅgadhara |\n| Number + Feature | num + noun | trilocana, caturbhuja |\n| Action + Object | √verb + noun | tripurāntaka, madanāri |\n| Relation + Title | name + pati/suta | umāpati, daśarathasuta |\n| Location + Lord | place + īśa/nātha | kailāsanātha, kedāranātha |\n\n## Syllable Counts for Common Synonyms\n\n| Meaning | 2 syl | 3 syl | 4 syl | 5+ syl |\n|---------|-------|-------|-------|--------|\n| Śiva | ha-ra | śi-va-ḥ | śam-bhu-ḥ | ma-hā-de-vaḥ |\n| Sun | ar-kaḥ | ra-vi-ḥ | bhās-ka-raḥ | di-vā-ka-raḥ |\n| Moon | in-duḥ | can-draḥ | śa-śī | ni-śā-ka-raḥ |\n| Lotus | — | pad-mam | ka-ma-lam | a-ra-vin-dam |\n| Water | — | ja-lam | vā-ri | sa-li-lam |\n", "workbook-questions": "# Stage 8: Paryāya — Workbook (Questions)\n\n## Section A: Synonym Recall (15 marks)\n\n**A1.** Give at least 5 synonyms for each (15 marks, 1 mark each):\n1. Śiva: ___, ___, ___, ___, ___\n2. Lotus: ___, ___, ___, ___, ___\n3. Sun: ___, ___, ___, ___, ___\n\n---\n\n## Section B: Etymology of Epithets (15 marks)\n\n**B1.** Break down each epithet into its components and explain the meaning (10 marks):\n1. Nīlakaṇṭha = ___ + ___ → meaning: ___\n2. Gaṅgādhara = ___ + ___ → meaning: ___\n3. Trilocana = ___ + ___ → meaning: ___\n4. Padmanābha = ___ + ___ → meaning: ___\n5. Caturbhuja = ___ + ___ → meaning: ___\n6. Tripurasundarī = ___ + ___ → meaning: ___\n7. Jagadambā = ___ + ___ → meaning: ___\n8. Annapūrṇā = ___ + ___ → meaning: ___\n9. Gopāla = ___ + ___ → meaning: ___\n10. Vṛṣabhadhvaja = ___ + ___ → meaning: ___\n\n**B2.** Which dhātu (root) is behind each name? (5 marks):\n1. Hara ← √___\n2. Bhāskara ← √___\n3. Durgā ← √___\n4. Śaṅkara ← √___\n5. Divākara ← √___\n\n---\n\n## Section C: Synonym Usage (15 marks)\n\n**C1.** Replace the underlined word with a synonym of different syllable count (5 marks):\n1. **padmam** sundaram asti (use a 4-syllable synonym): ___\n2. **sūryaḥ** udeti (use a 2-syllable synonym): ___\n3. **jalam** pavitraṃ (use a 2-syllable synonym): ___\n4. **candraḥ** śobhate (use a 3-syllable synonym): ___\n5. **agniḥ** jvalati (use a 3-syllable synonym): ___\n\n**C2.** For the concept \"ocean,\" give synonyms of 3, 4, and 5 syllables (3 marks):\n- 3 syllables: ___\n- 4 syllables: ___\n- 5 syllables: ___\n\n**C3.** Why are synonyms important for metrical composition? Give a specific example (2 marks):\n\n**C4.** Generate 5 new (but grammatically valid) epithets for Śiva using the pattern quality+noun or action+object (5 marks):\n1. ___\n2. ___\n3. ___\n4. ___\n5. ___\n\n---\n\n## Section D: 108 Names Forge (15 marks)\n\n**D1.** Categorize these 10 names of Śiva by the *type* of epithet — Physical (P), Action (A), Relationship (R), or Abstract quality (Q) (5 marks):\n1. Nīlakaṇṭha: ___\n2. Umāpati: ___\n3. Hara: ___\n4. Sadāśiva: ___\n5. Naṭarāja: ___\n6. Paśupati: ___\n7. Gaṅgādhara: ___\n8. Tryambaka: ___\n9. Bhairava: ___\n10. Viśvanātha: ___\n\n**D2.** Create a mini nāmāvalī (name garland) of 10 names for your iṣṭadevatā. For each, note the etymology (10 marks):\n1. ___ (etymology: ___)\n2. ___ (etymology: ___)\n3. ___ (etymology: ___)\n4. ___ (etymology: ___)\n5. ___ (etymology: ___)\n6. ___ (etymology: ___)\n7. ___ (etymology: ___)\n8. ___ (etymology: ___)\n9. ___ (etymology: ___)\n10. ___ (etymology: ___)\n\n---\n\n**Total: 60 marks**\n", "workbook-answers": "# Stage 8: Paryāya — Workbook (Answers)\n\n## Section A\n**A1.**\n1. Śiva: **śambhuḥ, śaṅkaraḥ, haraḥ, mahādevaḥ, rudraḥ** (accept any valid)\n2. Lotus: **padmam, kamalam, aravindam, paṅkajam, sarasijam**\n3. Sun: **sūryaḥ, raviḥ, arkaḥ, bhāskaraḥ, ādityaḥ**\n\n## Section B\n**B1.**\n1. Nīlakaṇṭha = **nīla** (blue) + **kaṇṭha** (throat) → blue-throated one\n2. Gaṅgādhara = **gaṅgā** + **dhara** (√dhṛ, bearer) → bearer of Gaṅgā\n3. Trilocana = **tri** (three) + **locana** (eye) → three-eyed\n4. Padmanābha = **padma** (lotus) + **nābha** (navel) → lotus-naveled\n5. Caturbhuja = **catur** (four) + **bhuja** (arm) → four-armed\n6. Tripurasundarī = **tripura** (three cities/worlds) + **sundarī** (beautiful woman) → beauty of the three worlds\n7. Jagadambā = **jagat** (world) + **ambā** (mother) → mother of the world\n8. Annapūrṇā = **anna** (food) + **pūrṇā** (full) → she who is full of food\n9. Gopāla = **go** (cow) + **pāla** (√pā, protector) → protector of cows\n10. Vṛṣabhadhvaja = **vṛṣabha** (bull) + **dhvaja** (banner) → bull-bannered\n\n**B2.**\n1. Hara ← **√hṛ** (to take/remove)\n2. Bhāskara ← **√kṛ** (to make) [bhās + kara = maker of light]\n3. Durgā ← **√gam** (to go) [dur + gā = hard to approach]\n4. Śaṅkara ← **√kṛ** (to make) [śam + kara = maker of peace]\n5. Divākara ← **√kṛ** (to make) [divā + kara = maker of day]\n\n## Section C\n**C1.**\n1. padmam → **aravindam** (4 syllables)\n2. sūryaḥ → **arkaḥ** (2 syllables)\n3. jalam → **vāri** (2 syllables)\n4. candraḥ → **śaśī** is 2; use **niśākaraḥ** for 4 or **induḥ** for 2. For 3: **niśāpaḥ** or accept **candramāḥ**\n5. agniḥ → **vahniḥ** (2) or **analaḥ** (3 syllables)\n\n**C2.**\n- 3 syllables: **sindhuḥ** or **abdhiḥ** (2) — better: **sā-ga-raḥ** (3)\n- 4 syllables: **sa-mu-dra-ḥ** (3-4) or **u-da-dhi-ḥ** (4)\n- 5 syllables: **rat-nā-ka-ra-ḥ** (4-5)\n\n**C3.** Synonyms are essential because Sanskrit meters require specific syllable counts and weight patterns (guru/laghu). If \"padmam\" doesn't fit the meter, \"kamalam\" or \"aravindam\" might. Example: in anuṣṭubh, if you need 3 syllables for \"lotus,\" use \"kamalam\"; if you need 4, use \"aravindam.\"\n\n**C4.** Sample new epithets for Śiva:\n1. **jñānadāyaka** (giver of knowledge)\n2. **bhaktarakṣaka** (protector of devotees)\n3. **śvetavṛṣabha** (white-bulled)\n4. **yogīśvara** (lord of yogīs)\n5. **kailāsavāsin** (dweller of Kailāsa)\n\n## Section D\n**D1.**\n1. Nīlakaṇṭha: **P** (physical)\n2. Umāpati: **R** (relationship)\n3. Hara: **A** (action)\n4. Sadāśiva: **Q** (abstract quality)\n5. Naṭarāja: **A** (action — king of dance)\n6. Paśupati: **R** (relationship — lord of beings)\n7. Gaṅgādhara: **A** (action — bearing Gaṅgā)\n8. Tryambaka: **P** (physical — three-eyed)\n9. Bhairava: **Q** (abstract quality — fearsome)\n10. Viśvanātha: **R** (relationship — lord of the universe)\n\n**D2.** Sample for Kṛṣṇa:\n1. **Kṛṣṇa** (the dark one, √kṛṣ to attract)\n2. **Govinda** (finder of cows, go+√vid)\n3. **Gopāla** (protector of cows, go+√pā)\n4. **Murāri** (enemy of Mura, mura+ari)\n5. **Vanamālī** (wearer of forest garland)\n6. **Pītāmbara** (yellow-robed, pīta+ambara)\n7. **Veṇugopāla** (flute-playing cowherd)\n8. **Devakīnandana** (son of Devakī)\n9. **Rādhāpriya** (beloved of Rādhā)\n10. **Jagannātha** (lord of the world, jagat+nātha)\n\n---\n\n**Total: 60 marks**\n"}, "tabs": ["theory", "reference", "workbook-questions", "workbook-answers"]}, {"id": "09-samasa", "number": 9, "title": "Samasa", "subtitle": "Compounds", "files": {"theory": "# Stage 9: Samāsa — Compounds\n\n## Goal\nMaster Sanskrit compound formation — the engine behind divine epithets, philosophical terms, and poetic expression. Learn to build and decompose compounds, and invent grammatically valid new epithets.\n\n## What is Samāsa?\n\n**Samāsa** (समास) means \"throwing together\" — the joining of two or more words into a single compound. Sanskrit compounds can be enormously long, but they follow strict rules.\n\n## The Four Major Types\n\n### 1. Tatpuruṣa (Determinative) — \"his man\"\nThe first member modifies the second. The second member is the head word.\n\n**Pattern:** modifier + head (relation between members = a vibhakti)\n\n| Subtype | Vibhakti | Example | Analysis | Meaning |\n|---------|---------|---------|----------|---------|\n| Dvitīyā-tat. | 2nd | grāma-gata | grāmam gataḥ | gone to the village |\n| Tṛtīyā-tat. | 3rd | deva-datta | devena dattaḥ | given by god |\n| Caturthī-tat. | 4th | yajña-śālā | yajñāya śālā | hall for sacrifice |\n| Pañcamī-tat. | 5th | svarga-patita | svargāt patitaḥ | fallen from heaven |\n| Ṣaṣṭhī-tat. | 6th | rāja-putra | rājñaḥ putraḥ | king's son |\n| Saptamī-tat. | 7th | vana-vāsa | vane vāsaḥ | dwelling in forest |\n\n### 2. Dvandva (Copulative) — \"and\"\nBoth members are equal; the compound means \"A and B.\"\n\n| Example | Meaning |\n|---------|---------|\n| rāma-lakṣmaṇau | Rāma and Lakṣmaṇa (dual) |\n| dharma-artha-kāma-mokṣāḥ | dharma, artha, kāma, and mokṣa (pl) |\n| śiva-pārvatī | Śiva and Pārvatī |\n| deva-asurāḥ | gods and demons |\n\n### 3. Bahuvrīhi (Possessive/Exocentric) — \"much rice\"\nThe compound describes something/someone *outside* itself. \"The one who has X.\"\n\n| Example | Literal | Actual Meaning |\n|---------|---------|---------------|\n| nīla-kaṇṭha | blue-throat | he whose throat is blue (= Śiva) |\n| catur-bhuja | four-arm | he who has four arms (= Viṣṇu) |\n| padma-nābha | lotus-navel | he whose navel has a lotus (= Viṣṇu) |\n| daśa-ānana | ten-face | he who has ten faces (= Rāvaṇa) |\n| mahā-bāhu | great-arm | he who has great arms |\n| pīta-ambara | yellow-cloth | he who wears yellow cloth (= Viṣṇu) |\n\nThis is the most common type for deity epithets.\n\n### 4. Avyayībhāva (Indeclinable/Adverbial)\nThe first member is an indeclinable, and the whole compound becomes adverbial.\n\n| Example | Meaning |\n|---------|---------|\n| yathā-śakti | according to ability |\n| prati-dinam | every day |\n| upa-kūlam | near the bank |\n| nir-bhayam | fearlessly |\n\n## Special Compound Types\n\n### Karmadhāraya (Appositional Tatpuruṣa)\nBoth members refer to the same entity — adjective + noun or noun + noun in apposition.\n\n| Example | Meaning |\n|---------|---------|\n| mahā-deva | great-god (Mahādeva) |\n| nīla-utpala | blue-lotus |\n| parama-ātman | supreme-self |\n| sat-guru | true-teacher |\n\n### Dvigu (Numeral Tatpuruṣa)\nFirst member is a number.\n\n| Example | Meaning |\n|---------|---------|\n| tri-loka | three worlds |\n| pañca-bhūta | five elements |\n| sapta-ṛṣi | seven sages |\n| daśa-āvatāra | ten incarnations |\n\n## The Build-a-Deity Game\n\nCreate valid epithets by combining components:\n\n| Component A | Component B | Compound | Type | Deity |\n|------------|------------|----------|------|-------|\n| gaṅgā | dhara | gaṅgādhara | Bahu. | Śiva |\n| tri | netra | trinetra | Bahu. | Śiva |\n| vana | mālī | vanamālī | Bahu. | Viṣṇu |\n| jagat | ambā | jagadambā | Ṣaṣṭhī-tat. | Devī |\n| mahā | lakṣmī | mahālakṣmī | Karm. | Devī |\n| cakra | pāṇi | cakrapāṇi | Bahu. | Viṣṇu |\n| mṛga | aṅka | mṛgāṅka | Bahu. | Moon |\n\n## Sandhi in Compounds\n\nWhen words join, sandhi rules apply at the junction:\n- jagat + ambā → **jagadambā** (t + a → da)\n- mahā + īśvara → **maheśvara** (ā + ī → e)\n- nīla + utpala → **nīlotpala** (a + u → o)\n- vana + oṣadhi → **vanauṣadhi** (a + o → au)\n\n## Milestone Check\n\nCan you:\n1. Identify the samāsa type of 10 common epithets?\n2. Decompose compounds into their constituent words?\n3. Invent 5 new grammatically valid epithets?\n", "reference": "# Stage 9: Samāsa — Reference Guide\n\n## Compound Types at a Glance\n\n| Type | Head | Meaning Pattern | Example |\n|------|------|----------------|---------|\n| Tatpuruṣa | 2nd word | \"X of/by/for/in Y\" | rāja-putra (king's son) |\n| Karmadhāraya | 2nd word | \"X which is Y\" | mahā-deva (great god) |\n| Dvigu | 2nd word | \"number + Y\" | tri-loka (three worlds) |\n| Dvandva | both | \"X and Y\" | rāma-kṛṣṇau |\n| Bahuvrīhi | external | \"having X-Y\" | nīla-kaṇṭha (blue-throated one) |\n| Avyayībhāva | 1st word | adverb | prati-dinam (daily) |\n\n## Tatpuruṣa Subtypes\n\n| Subtype | Relation | Vigraha (dissolution) | Example |\n|---------|---------|----------------------|---------|\n| 2nd (dvitīyā) | toward | X-am Y | śaraṇāgata (come to refuge) |\n| 3rd (tṛtīyā) | by/with | X-ena Y | deva-datta (god-given) |\n| 4th (caturthī) | for | X-āya Y | yajña-śālā (sacrifice-hall) |\n| 5th (pañcamī) | from | X-āt Y | bhaya-mukta (freed from fear) |\n| 6th (ṣaṣṭhī) | of | X-asya Y | rāja-putra (king's son) |\n| 7th (saptamī) | in | X-e Y | vana-vāsa (forest-dwelling) |\n\n## Common Bahuvrīhi Epithets\n\n| Compound | Components | Literal | Refers to |\n|----------|-----------|---------|-----------|\n| nīlakaṇṭha | nīla+kaṇṭha | blue-throat | Śiva |\n| caturbhuja | catur+bhuja | four-arm | Viṣṇu |\n| padmanābha | padma+nābha | lotus-navel | Viṣṇu |\n| trilocana | tri+locana | three-eye | Śiva |\n| daśānana | daśa+ānana | ten-face | Rāvaṇa |\n| pītāmbara | pīta+ambara | yellow-cloth | Viṣṇu/Kṛṣṇa |\n| cakrapāṇi | cakra+pāṇi | discus-hand | Viṣṇu |\n| pinākapāṇi | pinaka+pāṇi | pinaka-hand | Śiva |\n| vṛṣabhadhvaja | vṛṣabha+dhvaja | bull-banner | Śiva |\n| garuḍadhvaja | garuḍa+dhvaja | garuḍa-banner | Viṣṇu |\n| candraśekhara | candra+śekhara | moon-crest | Śiva |\n| vanamālī | vana+mālī | forest-garland | Viṣṇu |\n| mṛgāṅka | mṛga+aṅka | deer-mark | Moon |\n| pannagabhūṣaṇa | pannaga+bhūṣaṇa | serpent-ornament | Śiva |\n\n## Common Karmadhāraya Compounds\n\n| Compound | Components | Meaning |\n|----------|-----------|---------|\n| mahādeva | mahā+deva | great god |\n| paramātman | parama+ātman | supreme self |\n| sadguru | sat+guru | true teacher |\n| nīlotpala | nīla+utpala | blue lotus |\n| mahāvidyā | mahā+vidyā | great knowledge |\n| parama-puruṣa | parama+puruṣa | supreme person |\n\n## Sandhi at Compound Junctions\n\n| Rule | Example |\n|------|---------|\n| a + a → ā | deva + astra → devāstra |\n| a + i → e | mahā + īśvara → maheśvara |\n| a + u → o | nīla + utpala → nīlotpala |\n| a + ṛ → ar | mahā + ṛṣi → maharṣi |\n| t + vowel → d | jagat + ambā → jagadambā |\n| t + soft consonant → d | sat + guru → sadguru |\n| n + ś → ñś | mahān + śiva → — (rarely compounds) |\n\n## Compound Identification Flowchart\n\n1. Does the compound describe something OUTSIDE itself? → **Bahuvrīhi**\n2. Is the first word an indeclinable? → **Avyayībhāva**\n3. Are both members co-equal (\"and\")? → **Dvandva**\n4. Is the first member a number? → **Dvigu**\n5. Is the first an adjective for the second? → **Karmadhāraya**\n6. Otherwise → **Tatpuruṣa** (determine the case relationship)\n\n## Deity Name Building Toolkit\n\n| Meaning | Components Available |\n|---------|---------------------|\n| \"lord of X\" | X + pati, X + nātha, X + īśa |\n| \"destroyer of X\" | X + antaka, X + ari, X + hara |\n| \"bearer of X\" | X + dhara, X + dhārī |\n| \"having X\" | X + vat/mat (suffix, not compound) |\n| \"X-handed\" | X + pāṇi, X + hasta |\n| \"X-eyed\" | X + netra, X + akṣa, X + locana |\n| \"X-bannered\" | X + dhvaja, X + ketu |\n| \"son/daughter of X\" | X + putra/suta/tanaya, X + putri/sutā |\n", "workbook-questions": "# Stage 9: Samāsa — Workbook (Questions)\n\n## Section A: Compound Identification (15 marks)\n\n**A1.** Identify the samāsa type (Tatpuruṣa, Dvandva, Bahuvrīhi, Karmadhāraya, Dvigu, Avyayībhāva) (10 marks):\n1. nīlakaṇṭha: ___\n2. mahādeva: ___\n3. rāma-lakṣmaṇau: ___\n4. rāja-putra: ___\n5. tri-loka: ___\n6. prati-dinam: ___\n7. caturbhuja: ___\n8. vana-vāsa: ___\n9. pīta-ambara: ___\n10. deva-datta: ___\n\n**A2.** For each Tatpuruṣa compound, identify which vibhakti relates the members (5 marks):\n1. rāja-putra: ___\n2. vana-vāsa: ___\n3. bhaya-mukta: ___\n4. deva-datta: ___\n5. yajña-śālā: ___\n\n---\n\n## Section B: Compound Dissolution (Vigraha) (15 marks)\n\n**B1.** Dissolve each compound into its constituent words with the appropriate vibhakti (10 marks):\n1. gaṅgādhara → ___\n2. tripurāntaka → ___\n3. padmanābha → ___\n4. jagadambā → ___\n5. cakrapāṇi → ___\n6. nīlotpala → ___\n7. pañcabhūta → ___\n8. dharma-artha-kāma-mokṣāḥ → ___\n9. vanavāsa → ___\n10. sadguru → ___\n\n**B2.** What sandhi rule applies at the junction? (5 marks):\n1. mahā + īśvara → maheśvara: ___\n2. nīla + utpala → nīlotpala: ___\n3. jagat + ambā → jagadambā: ___\n4. sat + guru → sadguru: ___\n5. deva + indra → devendra: ___\n\n---\n\n## Section C: Compound Building (20 marks)\n\n**C1.** Form a compound from each pair and name the type (10 marks):\n1. padma (lotus) + akṣa (eye) = ___ (type: ___)\n2. mahā (great) + vidyā (knowledge) = ___ (type: ___)\n3. sūrya + candra = ___ (type: ___)\n4. tri + netra = ___ (type: ___)\n5. vana (forest) + cara (moving) = ___ (type: ___)\n6. rāja (king) + haṃsa (swan) = ___ (type: ___)\n7. śiva + pārvatī = ___ (type: ___)\n8. pra + dinam = ___ (type: ___)\n9. bhakta (devotee) + vatsala (affectionate) = ___ (type: ___)\n10. garuḍa + dhvaja = ___ (type: ___)\n\n**C2.** Invent 5 new Bahuvrīhi epithets for any deity. Give the components, meaning, and which deity (10 marks):\n1. ___ = ___ + ___ (meaning: ___) → deity: ___\n2. ___ = ___ + ___ (meaning: ___) → deity: ___\n3. ___ = ___ + ___ (meaning: ___) → deity: ___\n4. ___ = ___ + ___ (meaning: ___) → deity: ___\n5. ___ = ___ + ___ (meaning: ___) → deity: ___\n\n---\n\n## Section D: Advanced Analysis (10 marks)\n\n**D1.** Some compounds are ambiguous between Tatpuruṣa and Bahuvrīhi. Explain both readings of (5 marks):\n1. nīlakaṇṭha as Tatpuruṣa: ___\n   nīlakaṇṭha as Bahuvrīhi: ___\n\n2. rājaputra as Tatpuruṣa: ___\n   rājaputra as Bahuvrīhi: ___\n\n**D2.** Decompose this long compound (5 marks):\n> śrīmad-rāma-bhadra-mūrti-pādāravinda-yugala-dhyāna-parāyaṇa\n\nBreak it into individual words and explain the overall meaning.\n\n---\n\n**Total: 60 marks**\n", "workbook-answers": "# Stage 9: Samāsa — Workbook (Answers)\n\n## Section A\n**A1.**\n1. nīlakaṇṭha: **Bahuvrīhi** (he whose throat is blue)\n2. mahādeva: **Karmadhāraya** (great god)\n3. rāma-lakṣmaṇau: **Dvandva** (Rāma and Lakṣmaṇa)\n4. rāja-putra: **Tatpuruṣa** (ṣaṣṭhī) (king's son)\n5. tri-loka: **Dvigu** (three worlds)\n6. prati-dinam: **Avyayībhāva** (every day)\n7. caturbhuja: **Bahuvrīhi** (having four arms)\n8. vana-vāsa: **Tatpuruṣa** (saptamī) (dwelling in forest)\n9. pīta-ambara: **Bahuvrīhi** (wearing yellow cloth)\n10. deva-datta: **Tatpuruṣa** (tṛtīyā) (given by god)\n\n**A2.**\n1. rāja-putra: **ṣaṣṭhī** (6th — \"of the king\")\n2. vana-vāsa: **saptamī** (7th — \"in the forest\")\n3. bhaya-mukta: **pañcamī** (5th — \"freed from fear\")\n4. deva-datta: **tṛtīyā** (3rd — \"by god\")\n5. yajña-śālā: **caturthī** (4th — \"for sacrifice\")\n\n## Section B\n**B1.**\n1. gaṅgādhara → **gaṅgāṃ dharati yaḥ saḥ** (he who bears Gaṅgā) — Bahu.\n2. tripurāntaka → **tripurasya antakaḥ** (destroyer of Tripura) — Tat.\n3. padmanābha → **padmaṃ nābhau yasya saḥ** (he whose navel has a lotus) — Bahu.\n4. jagadambā → **jagataḥ ambā** (mother of the world) — Tat.\n5. cakrapāṇi → **cakraṃ pāṇau yasya saḥ** (discus in whose hand) — Bahu.\n6. nīlotpala → **nīlam utpalam** (blue lotus) — Karm.\n7. pañcabhūta → **pañca bhūtāni** (five elements) — Dvigu\n8. dharma-artha-kāma-mokṣāḥ → **dharmaḥ ca arthaḥ ca kāmaḥ ca mokṣaḥ ca** — Dvandva\n9. vanavāsa → **vane vāsaḥ** (dwelling in the forest) — Saptamī-tat.\n10. sadguru → **san guruḥ** (true guru) — Karm.\n\n**B2.**\n1. ā + ī → **e** (vowel sandhi: ā+ī=e)\n2. a + u → **o** (vowel sandhi: a+u=o)\n3. t + a → **da** (consonant: final t before voiced → d)\n4. t + g → **dg** (consonant: final t before voiced → d)\n5. a + i → **e** (vowel sandhi: a+i=e)\n\n## Section C\n**C1.**\n1. padma + akṣa = **padmākṣa** (type: **Bahuvrīhi** — lotus-eyed)\n2. mahā + vidyā = **mahāvidyā** (type: **Karmadhāraya** — great knowledge)\n3. sūrya + candra = **sūryacandau** (type: **Dvandva** — sun and moon)\n4. tri + netra = **trinetra** (type: **Bahuvrīhi/Dvigu** — three-eyed)\n5. vana + cara = **vanacara** (type: **Saptamī-Tatpuruṣa** — forest-wanderer)\n6. rāja + haṃsa = **rājahaṃsa** (type: **Karmadhāraya** — royal swan)\n7. śiva + pārvatī = **śivapārvatyau** (type: **Dvandva**)\n8. pra + dinam = **pradinam** (type: **Avyayībhāva** — daily) [or pratitinam]\n9. bhakta + vatsala = **bhaktavatsala** (type: **Saptamī-Tat.** — affectionate to devotees)\n10. garuḍa + dhvaja = **garuḍadhvaja** (type: **Bahuvrīhi** — garuḍa-bannered)\n\n**C2.** Sample new Bahuvrīhi epithets:\n1. **raktanetra** = rakta + netra (red-eyed one) → Rudra/Bhairava\n2. **hemakuṇḍala** = hema + kuṇḍala (gold-earringed) → Devī\n3. **śukladhvaja** = śukla + dhvaja (white-bannered) → Sarasvatī\n4. **daśabāhu** = daśa + bāhu (ten-armed one) → Durgā\n5. **meghavarṇa** = megha + varṇa (cloud-complexioned) → Kṛṣṇa\n\n## Section D\n**D1.**\n1. nīlakaṇṭha:\n   - As Tatpuruṣa: **nīlaḥ kaṇṭhaḥ** = \"a blue throat\" (the object itself)\n   - As Bahuvrīhi: **nīlaḥ kaṇṭhaḥ yasya saḥ** = \"he whose throat is blue\" (= Śiva)\n\n2. rājaputra:\n   - As Tatpuruṣa: **rājñaḥ putraḥ** = \"a king's son\" (the prince himself)\n   - As Bahuvrīhi: **rājā putraḥ yasya saḥ** = \"one whose son is a king\"\n\n**D2.**\nśrīmad-rāma-bhadra-mūrti-pādāravinda-yugala-dhyāna-parāyaṇa:\n- śrīmat = glorious\n- rāma = Rāma\n- bhadra = auspicious\n- mūrti = form\n- pāda = foot\n- aravinda = lotus\n- yugala = pair\n- dhyāna = meditation\n- parāyaṇa = devoted to\n\n**Meaning:** \"One devoted to the meditation upon the pair of lotus-feet of the auspicious form of glorious Rāma\"\n\n---\n\n**Total: 60 marks**\n"}, "tabs": ["theory", "reference", "workbook-questions", "workbook-answers"]}, {"id": "10-vakya", "number": 10, "title": "Vakya", "subtitle": "Free Composition", "files": {"theory": "# Stage 10: Vākya — Free Composition\n\n## Goal\nCompose freely in Sanskrit — describe daily life, thoughts, and experiences. Begin thinking directly in Sanskrit without translating from English.\n\n## The Shift: From Grammar to Thought\n\nStages 1–9 gave you building blocks. Now you combine them fluidly. This stage is about **automaticity** — moving from conscious rule-application to natural expression.\n\n## Sentence Patterns for Daily Life\n\n### Pattern 1: Simple Statement (Subject + Verb)\n> ahaṃ paṭhāmi — I study\n> sūryaḥ udeti — the sun rises\n> vṛṣṭiḥ bhavati — rain happens\n\n### Pattern 2: Transitive (Subject + Object + Verb)\n> ahaṃ pustakam paṭhāmi — I read a book\n> mātā bhojanaṃ pacati — mother cooks food\n> bālaḥ jalami pibati — the child drinks water\n\n### Pattern 3: Full Sentence (S + Instrument + Location + Object + Verb)\n> ahaṃ prātaḥ gṛhe bhojanaṃ karomi — I eat food at home in the morning\n\n### Pattern 4: Compound Sentence (X ca Y ca)\n> ahaṃ paṭhāmi likhāmi ca — I study and write\n> sūryaḥ udeti candraḥ ca astam gacchati — the sun rises and the moon sets\n\n### Pattern 5: Relative Clause (yaḥ... saḥ...)\n> yaḥ bhajati saḥ mucyate — he who worships is liberated\n> yā devī sarva-bhūteṣu... — she who is the goddess in all beings...\n\n## Essential Daily Vocabulary\n\n### Time\n| Sanskrit | Meaning |\n|----------|---------|\n| prātaḥ | in the morning |\n| madhyāhne | at noon |\n| sāyam | in the evening |\n| rātrau | at night |\n| adya | today |\n| śvaḥ | tomorrow |\n| hyaḥ | yesterday |\n| sadā / sarvadā | always |\n| kadā | when? |\n| idānīm | now |\n\n### Common Verbs for Daily Life\n| Sanskrit | Meaning |\n|----------|---------|\n| uttiṣṭhāmi | I get up |\n| snānaṃ karomi | I bathe |\n| bhojanaṃ karomi | I eat |\n| pibāmi | I drink |\n| paṭhāmi | I study |\n| likhāmi | I write |\n| gacchāmi | I go |\n| āgacchāmi | I come |\n| vasāmi | I live/dwell |\n| svapimi | I sleep |\n| jāgṛmi | I am awake |\n| krīḍāmi | I play |\n| hasāmi | I laugh |\n| rodimi | I cry |\n| kathayāmi | I tell/narrate |\n\n### Connectors and Particles\n| Sanskrit | Meaning |\n|----------|---------|\n| ca | and |\n| vā | or |\n| na | not |\n| api | also, even |\n| tu | but |\n| eva | only, indeed |\n| iti | thus (quotation marker) |\n| yadi | if |\n| tadā | then |\n| ataḥ | therefore |\n| tathā | so, likewise |\n| yathā | as, like |\n| kim | what? |\n| kutra | where? |\n| katham | how? |\n\n## The Game: \"Tell Bhagavān About Your Day\"\n\nSpeak to your iṣṭadevatā about your day in simple Sanskrit:\n\n> he śiva!\n> adya prātaḥ aham uttiṣṭhāmi.\n> snānaṃ karomi.\n> tava mandiraṃ gacchāmi.\n> tatra tvāṃ paśyāmi.\n> puṣpam arpayāmi.\n> gṛhaṃ āgacchāmi.\n> pustakam paṭhāmi.\n> sāyam bhojanaṃ karomi.\n> rātrau tvāṃ smarāmi.\n> sukhaṃ svapimi.\n\n## Building Longer Passages\n\n### Describing a Place\n> mama gṛham sundaram asti. tatra ekaṃ mandiram asti. mandire śivasya mūrtiḥ asti. pratidinṃ ahaṃ tatra pūjāṃ karomi. mandiraṃ śāntam asti. tatra ahaṃ dhyānaṃ karomi.\n\n### Describing a Person\n> mama guruḥ mahān asti. saḥ śāntaḥ asti. saḥ jñānī asti. saḥ pradinaṃ vedān paṭhati. saḥ śiṣyān pāṭhayati. ahaṃ tasya śiṣyaḥ asmi.\n\n### Narrating an Event\n> hyaḥ ahaṃ mandiraṃ gacchāmi (agaccham). tatra mahāpūjā āsīt. bahavaḥ bhaktāḥ āsan. sarve militvā stotram agāyan. atiśobhanam āsīt.\n\n## Thinking in Sanskrit — Tips\n\n1. **Start with objects around you** — name them in Sanskrit\n2. **Narrate your actions** as you do them: uttiṣṭhāmi, gacchāmi...\n3. **Use simple sentences first**, then add cases and qualifiers\n4. **Don't translate from English** — think in Subject-Object-Verb order\n5. **Talk to your deity** daily in Sanskrit — even one sentence\n\n## Milestone Check\n\nCan you speak for 2 minutes in simple Sanskrit about your day, your surroundings, or your devotional practice — without pausing to translate from English?\n", "reference": "# Stage 10: Vākya — Reference Guide\n\n## Sentence Templates\n\n### Existence: X asti (X exists / there is X)\n> mandiram asti. devī asti. jalam asti.\n\n### Identity: X Y asti (X is Y)\n> śivaḥ devaḥ asti. sā mama mātā asti.\n\n### Location: X Y-saptamī asti (X is in Y)\n> mūrtiḥ mandire asti. puṣpam padme asti.\n\n### Possession: X-ṣaṣṭhī Y asti (X has Y / X's Y exists)\n> mama gṛham asti. devasya kṛpā asti.\n\n### Action: S (+ O) + V\n> aham gacchāmi. aham pustakam paṭhāmi.\n\n### Full: S + Time + Place + Instrument + Recipient + O + V\n> aham prātaḥ mandire bhaktyā devāya puṣpam arpayāmi.\n\n## Essential Pronouns\n\n| Case | I | You | He | She | It/That |\n|------|---|-----|----|----|---------|\n| 1st | aham | tvam | saḥ | sā | tat |\n| 2nd | mām | tvām | tam | tām | tat |\n| 3rd | mayā | tvayā | tena | tayā | tena |\n| 4th | mahyam | tubhyam | tasmai | tasyai | tasmai |\n| 6th | mama | tava | tasya | tasyāḥ | tasya |\n| 7th | mayi | tvayi | tasmin | tasyām | tasmin |\n\nPlural: vayam (we), yūyam (you all), te (they M), tāḥ (they F), tāni (they N)\n\n## Question Words\n\n| Sanskrit | Meaning | Example |\n|----------|---------|---------|\n| kim | what? | kim karosi? (what do you do?) |\n| kaḥ | who? (M) | kaḥ āgacchati? |\n| kā | who? (F) | kā gāyati? |\n| kutra | where? | kutra vasasi? |\n| kadā | when? | kadā gacchasi? |\n| katham | how? | katham jānāsi? |\n| kasmāt / kimartham | why? | kasmāt rodisi? |\n| kiyat | how much/many? | kiyat dūram? |\n\n## Time Expressions\n\n| Sanskrit | Meaning |\n|----------|---------|\n| prātaḥ | morning |\n| madhyāhne | noon |\n| aparāhne | afternoon |\n| sāyam / sandhyāyām | evening |\n| rātrau | night |\n| adya | today |\n| śvaḥ | tomorrow |\n| hyaḥ | yesterday |\n| pratidinm | every day |\n| sarvadā | always |\n| kadācit | sometimes |\n| na kadāpi | never |\n\n## Connectors\n\n| Type | Sanskrit | Meaning |\n|------|----------|---------|\n| Addition | ca | and |\n| Alternative | vā | or |\n| Contrast | tu, kintu, parantu | but |\n| Emphasis | eva | indeed, only |\n| Also | api | also, even |\n| Reason | yataḥ, hi | because |\n| Result | ataḥ, tasmāt | therefore |\n| Condition | yadi... tadā | if... then |\n| Comparison | yathā... tathā | as... so |\n| Sequence | tataḥ, anantaram | then, after that |\n| Quotation | iti | thus (end quote) |\n\n## Common Phrases for Daily Narration\n\n| Sanskrit | Meaning |\n|----------|---------|\n| aham uttiṣṭhāmi | I get up |\n| mukhaṃ prakṣālayāmi | I wash my face |\n| snānaṃ karomi | I bathe |\n| vastrāṇi dhārayāmi | I wear clothes |\n| prātarāśaṃ karomi | I have breakfast |\n| gṛhāt nirgacchāmi | I leave the house |\n| kāryālayaṃ gacchāmi | I go to the office |\n| kāryaṃ karomi | I do work |\n| madhyāhna-bhojanaṃ karomi | I have lunch |\n| gṛham āgacchāmi | I come home |\n| sāyaṃ sandhyāvandanaṃ karomi | I do evening worship |\n| rātrau śayane tiṣṭhāmi | at night I lie on the bed |\n\n## Past Tense Quick Forms (Laṅ-lakāra)\n\n| Present | Past (3sg) | Meaning |\n|---------|-----------|---------|\n| gacchati | agacchat | went |\n| karoti | akarot | did |\n| vadati | avadat | said |\n| paśyati | apaśyat | saw |\n| bhavati | abhavat | became/was |\n| dadāti | adadāt | gave |\n| āsīt | (from √as) | was |\n", "workbook-questions": "# Stage 10: Vākya — Workbook (Questions)\n\n## Section A: Sentence Building (15 marks)\n\n**A1.** Form complete sentences from these elements (5 marks):\n1. aham / prātaḥ / uttiṣṭhāmi → ___\n2. bālaḥ / jalam / pibati → ___\n3. mātā / gṛhe / bhojanaṃ / pacati → ___\n4. aham / sāyam / mandiraṃ / gacchāmi → ___\n5. guruḥ / śiṣyān / pāṭhayati → ___\n\n**A2.** Add the given element to expand each sentence (5 marks):\n1. aham paṭhāmi (+where: gṛhe) → ___\n2. bhaktaḥ pūjayati (+with what: puṣpeṇa) → ___\n3. devī rakṣati (+whom: bhaktam) → ___\n4. aham gacchāmi (+when: prātaḥ, +where: mandiraṃ) → ___\n5. guruḥ kathayati (+what: kathāṃ, +to whom: śiṣyāya) → ___\n\n**A3.** Join the two sentences using the connector (5 marks):\n1. aham paṭhāmi + aham likhāmi (ca) → ___\n2. sūryaḥ udeti + tārakāḥ na dṛśyante (tadā) → ___\n3. tvam gacchasi + aham tiṣṭhāmi (tu) → ___\n4. saḥ bhaktaḥ + saḥ mucyate (yaḥ...saḥ) → ___\n5. prātaḥ uttiṣṭhāmi + snānam karomi (tataḥ) → ___\n\n---\n\n## Section B: Translation (15 marks)\n\n**B1.** Translate into Sanskrit (5 marks):\n1. Where do you live?\n2. I do not know.\n3. Mother cooks food at home.\n4. The sun rises in the morning.\n5. Who is coming?\n\n**B2.** Translate into English (5 marks):\n1. adya aham mandiram na gacchāmi\n2. mama guruḥ mahān jñānī asti\n3. kutra tava gṛham asti?\n4. sā pratidinṃ dhyānaṃ karoti\n5. yadi tvam bhajasi tadā muktiḥ bhavati\n\n**B3.** Describe your morning routine in 5 Sanskrit sentences (5 marks):\n1. ___\n2. ___\n3. ___\n4. ___\n5. ___\n\n---\n\n## Section C: Paragraph Composition (20 marks)\n\n**C1.** Describe your home in 5 Sanskrit sentences (10 marks):\n\n**C2.** Tell Bhagavān about your day — write 10 sentences in Sanskrit, starting with \"he [deity name]!\" (10 marks):\n\n---\n\n## Section D: Spontaneous Expression (10 marks)\n\n**D1.** Answer in Sanskrit (5 marks):\n1. tava nāma kim? → ___\n2. tvam kutra vasasi? → ___\n3. tava iṣṭadevatā kaḥ/kā? → ___\n4. adya kim karoṣi? → ___\n5. kim tvam saṃskṛtam jānāsi? → ___\n\n**D2.** Write 5 sentences about anything — your feelings, observations, or thoughts — entirely in Sanskrit (5 marks):\n\n---\n\n**Total: 60 marks**\n", "workbook-answers": "# Stage 10: Vākya — Workbook (Answers)\n\n## Section A\n**A1.**\n1. **aham prātaḥ uttiṣṭhāmi** (I get up in the morning)\n2. **bālaḥ jalam pibati** (the child drinks water)\n3. **mātā gṛhe bhojanaṃ pacati** (mother cooks food at home)\n4. **aham sāyam mandiraṃ gacchāmi** (I go to the temple in the evening)\n5. **guruḥ śiṣyān pāṭhayati** (the guru teaches students)\n\n**A2.**\n1. **aham gṛhe paṭhāmi**\n2. **bhaktaḥ puṣpeṇa pūjayati**\n3. **devī bhaktam rakṣati**\n4. **aham prātaḥ mandiram gacchāmi**\n5. **guruḥ śiṣyāya kathāṃ kathayati**\n\n**A3.**\n1. **aham paṭhāmi likhāmi ca**\n2. **yadā sūryaḥ udeti tadā tārakāḥ na dṛśyante**\n3. **tvam gacchasi, aham tu tiṣṭhāmi**\n4. **yaḥ bhaktaḥ saḥ mucyate** (or yaḥ bhajati saḥ mucyate)\n5. **prātaḥ uttiṣṭhāmi, tataḥ snānam karomi**\n\n## Section B\n**B1.**\n1. **tvam kutra vasasi?**\n2. **aham na jānāmi**\n3. **mātā gṛhe bhojanaṃ pacati**\n4. **prātaḥ sūryaḥ udeti**\n5. **kaḥ āgacchati?**\n\n**B2.**\n1. Today I do not go to the temple\n2. My guru is a great knower/wise one\n3. Where is your house?\n4. She meditates every day\n5. If you worship, then liberation happens\n\n**B3.** Sample:\n1. **prātaḥ aham uttiṣṭhāmi**\n2. **mukhaṃ prakṣālayāmi**\n3. **snānam karomi**\n4. **devam namāmi**\n5. **prātarāśam karomi**\n\n## Section C\n**C1.** Sample:\n> mama gṛham sundaram asti. gṛhe pañca kakṣāḥ santi. ekā kakṣā mama pūjā-gṛham asti. tatra śivasya mūrtiḥ asti. pratidinṃ aham tatra pūjām karomi.\n\n**C2.** Sample:\n> he śiva! adya prātaḥ aham uttiṣṭhāmi. snānaṃ karomi. tava mandiraṃ gacchāmi. puṣpaṃ arpayāmi. mantram japāmi. tataḥ gṛham āgacchāmi. pustakam paṭhāmi. madhyāhne bhojanaṃ karomi. sāyam punaḥ tvāṃ smarāmi. rātrau śāntyā svapimi.\n\nAward marks for: variety of verbs (3), correct cases (3), flow/coherence (2), vocabulary range (2).\n\n## Section D\n**D1.** Sample:\n1. **mama nāma [name] iti**\n2. **aham [place] nagare vasāmi**\n3. **mama iṣṭadevatā śivaḥ (or devī, etc.)**\n4. **adya aham saṃskṛtam paṭhāmi**\n5. **āṃ, aham kiñcit saṃskṛtam jānāmi** (yes, I know a little Sanskrit)\n\n**D2.** Accept any 5 grammatically reasonable Sanskrit sentences expressing thoughts/observations.\n\n---\n\n**Total: 60 marks**\n"}, "tabs": ["theory", "reference", "workbook-questions", "workbook-answers"]}, {"id": "11-bhava", "number": 11, "title": "Bhava", "subtitle": "Emotional Vocabulary", "files": {"theory": "# Stage 11: Bhāva — Emotional Vocabulary\n\n## Goal\nExpress inner emotional states — gratitude, longing, surrender, wonder, friendship — in Sanskrit without falling back to English. Develop the vocabulary of the heart.\n\n## What is Bhāva?\n\n**Bhāva** (भाव) means \"feeling,\" \"state of being,\" or \"emotional disposition.\" In bhakti, the bhāva toward the deity determines everything — the words you choose, the tone of prayer, the quality of worship.\n\n## The Five Bhāvas of Bhakti\n\n| Bhāva | Meaning | Attitude | Tone |\n|-------|---------|----------|------|\n| **Śānta** | Peace | Quiet reverence | calm, meditative |\n| **Dāsya** | Service | Servant to master | humble, obedient |\n| **Sakhya** | Friendship | Friend to friend | intimate, playful |\n| **Vātsalya** | Parental love | Parent to child | tender, protective |\n| **Mādhurya** | Sweet love | Lover to beloved | passionate, longing |\n\n## Emotional Vocabulary\n\n### Gratitude (Kṛtajñatā)\n| Sanskrit | Meaning |\n|----------|---------|\n| kṛtajñaḥ asmi | I am grateful |\n| dhanyaḥ asmi | I am blessed/fortunate |\n| anugrahaḥ | grace, favor |\n| kṛpā | mercy, compassion |\n| prasādaḥ | grace, clarity |\n| anugrāhya me | I am the recipient of grace |\n| tava kṛpayā | by your grace |\n| dhanyavādaḥ | thanks |\n\n### Longing (Viraha / Utkaṇṭhā)\n| Sanskrit | Meaning |\n|----------|---------|\n| virahaḥ | separation |\n| utkaṇṭhā | intense longing |\n| tṛṣṇā / pipāsā | thirst |\n| kāṅkṣā | desire, yearning |\n| ākulaḥ / ākulā | agitated |\n| vyākulaḥ | distressed |\n| tvāṃ vinā na jīvāmi | without you I cannot live |\n| kadā darśanaṃ bhavati? | when will I have your darśana? |\n| hṛdayam tvāṃ smṛtvā kampate | my heart trembles remembering you |\n| tava virahāt dahyate me manaḥ | my mind burns from separation from you |\n\n### Surrender (Śaraṇāgati / Prapatti)\n| Sanskrit | Meaning |\n|----------|---------|\n| śaraṇam | refuge |\n| prapatti | surrender |\n| samarpayāmi | I offer/dedicate |\n| ātma-nivedanam | self-offering |\n| tavāsmi | I am yours |\n| tvam eva mama sarvasvam | you alone are my everything |\n| ananya-śaraṇaḥ | having no other refuge |\n| tvayy arpita-manaḥ | mind offered to you |\n| mama kiñcit nāsti | I have nothing (of my own) |\n| tvayi sarvam samarpayāmi | I offer everything in you |\n\n### Wonder (Vismaya / Adbhuta)\n| Sanskrit | Meaning |\n|----------|---------|\n| vismayaḥ | wonder, amazement |\n| adbhutam | wonderful |\n| āścaryam | astonishing |\n| aho! | oh! (exclamation of wonder) |\n| citraṃ | strange, wonderful |\n| apūrvam | unprecedented |\n| atīva sundaram | exceedingly beautiful |\n| ko'yam mahimā! | what is this glory! |\n| mahad āścaryam | great wonder |\n| na śakyam vaktum | cannot be expressed |\n\n### Friendship/Intimacy (Sakhya)\n| Sanskrit | Meaning |\n|----------|---------|\n| sakhe! | O friend! |\n| bandhuḥ | kinsman, friend |\n| priyaḥ / priyā | dear one |\n| snehaḥ | affection |\n| viśvāsaḥ | trust |\n| sahacaraḥ | companion |\n| tvam mama bandhuḥ | you are my friend |\n| tvayā saha sukham | happiness is with you |\n| tava hāsam paśyan ānandaḥ | seeing your smile brings joy |\n\n### Remorse/Humility (Dīnatā)\n| Sanskrit | Meaning |\n|----------|---------|\n| aparādhaḥ | offense |\n| doṣaḥ | fault |\n| pāpam | sin |\n| dīnaḥ | wretched, humble |\n| hīnaḥ | low, lacking |\n| kṣamasva | forgive |\n| mama aparādham kṣamasva | forgive my offenses |\n| aham pāpī | I am a sinner |\n| tava karuṇā eva mama āśrayaḥ | your mercy alone is my support |\n\n## The Game: \"One Deity, Five Bhāvas\"\n\nExpress the same devotion to Śiva through all five emotional lenses:\n\n**Śānta:** śivaḥ sarvam, sarvaṃ śivaḥ. śāntaṃ dhyāyāmi.\n(Śiva is all, all is Śiva. I meditate in peace.)\n\n**Dāsya:** he prabho! aham tava dāsaḥ. kiṃ karavāṇi? ājñāṃ dehi.\n(O Lord! I am your servant. What shall I do? Give the command.)\n\n**Sakhya:** he śiva! sakhe! adya kiṃ kurvāvaḥ? kailāse viharāvaḥ!\n(O Śiva! Friend! What shall we do today? Let's wander on Kailāsa!)\n\n**Vātsalya:** he bāla śambho! ehi, kṣīraṃ piba. tvāṃ rakṣāmi.\n(O child Śambhu! Come, drink milk. I will protect you.)\n\n**Mādhurya:** he prāṇanātha! tava vinā hṛdayam śūnyam. kadā āgacchasi?\n(O lord of my life! Without you my heart is empty. When will you come?)\n\n## Milestone Check\n\nCan you express your inner state — joy, sorrow, longing, gratitude, or wonder — entirely in Sanskrit, without reverting to English even in thought?\n", "reference": "# Stage 11: Bhāva — Reference Guide\n\n## Emotion Quick-Reference\n\n### Positive States\n| Sanskrit | Meaning | Usage |\n|----------|---------|-------|\n| ānandaḥ | bliss | ānando me bhavati |\n| sukham | happiness | sukham anubhavāmi |\n| harṣaḥ | joy | harṣeṇa pūrṇaḥ |\n| santoṣaḥ | contentment | santoṣaḥ asti |\n| śāntiḥ | peace | śāntiḥ mama hṛdaye |\n| tuṣṭiḥ | satisfaction | tuṣṭaḥ asmi |\n| premā | love | premṇā pūrṇam hṛdayam |\n| snehaḥ | affection | sneham anubhavāmi |\n| kṛtajñatā | gratitude | kṛtajñaḥ asmi |\n| dhanyatā | blessedness | dhanyaḥ asmi |\n\n### Painful States\n| Sanskrit | Meaning | Usage |\n|----------|---------|-------|\n| duḥkham | sorrow | duḥkham anubhavāmi |\n| śokaḥ | grief | śokena magnḥ |\n| virahaḥ | separation | viraha-vedanā |\n| utkaṇṭhā | longing | utkaṇṭhayā ākulaḥ |\n| bhayam | fear | bhayam asti |\n| cintā | worry | cintā mām bādhate |\n| krodhaḥ | anger | krodhaḥ na śobhate |\n| lajjā | shame | lajjayā adhomukhḥ |\n| glāniḥ | weariness | glānim anubhavāmi |\n| nirāśā | despair | nirāśā mā bhavatu |\n\n### Devotional States\n| Sanskrit | Meaning | Usage |\n|----------|---------|-------|\n| bhaktiḥ | devotion | bhaktiḥ vardhatām |\n| śraddhā | faith | śraddhayā pūjayāmi |\n| prapatti | surrender | prapattim karomi |\n| dāsyam | servitude | dāsyam svīkaromi |\n| vismayaḥ | wonder | vismayena pūrṇaḥ |\n| anugrahaḥ | grace | anugṛhāṇa mām |\n| karuṇā | compassion | karuṇayā paśya |\n| kṛpā | mercy | kṛpāṃ kuru |\n\n## Five Bhāvas — Expression Templates\n\n### Śānta (Peace)\n- oṃ śāntiḥ śāntiḥ śāntiḥ\n- sarvam brahmamayam jagat\n- śāntam hṛdayam mama\n- nityam ānanda-svarūpam asi tvam\n\n### Dāsya (Service)\n- he prabho! aham tava dāsaḥ\n- ājñāṃ dehi — kiṃ karavāṇi?\n- tava pādau mama śiraḥ\n- tava sevāyāṃ mama jīvitam\n\n### Sakhya (Friendship)\n- he sakhe! ehi, kathayāvaḥ\n- tava hāsena mama hṛdayaṃ pūrṇam\n- tvayā saha sarvaṃ sundaram\n- mā gaccha — tiṣṭha mayā saha\n\n### Vātsalya (Parental Love)\n- he bāla! ehi, mama krodaṃ āgaccha\n- mā bhaiṣīḥ — aham atra asmi\n- kṣīraṃ piba, modakaṃ khāda\n- tvāṃ rakṣāmi sadā\n\n### Mādhurya (Sweet Love)\n- he priyatame! kadā āgacchasi?\n- tava virahāt hṛdayaṃ dahyate\n- tava vadanam eva mama candra\n- tvāṃ vinā na kiñcit priyam\n\n## Exclamatory Particles\n\n| Particle | Use |\n|---------|-----|\n| aho! | wonder, amazement |\n| hā! | grief, loss |\n| dhik! | shame, disapproval |\n| sādhu! | well done! bravo! |\n| bhoḥ! | hey! (calling) |\n| he! | O! (vocative) |\n| kaṣṭam! | alas! how difficult! |\n| citraṃ! | how strange! |\n\n## Common Bhāva Expressions\n\n| Sanskrit | Meaning |\n|----------|---------|\n| hṛdayaṃ druti-bhūtam | heart is melted |\n| netrābhyāṃ aśrūṇi patanti | tears fall from the eyes |\n| romāñcaḥ jāyate | goosebumps arise |\n| kaṇṭhaḥ ruddhate | throat chokes |\n| manaḥ kampate | mind trembles |\n| prāṇāḥ utkaṇṭhitāḥ | life-breaths are agitated |\n| cittam ārdrī-bhūtam | mind is softened |\n| ātmā vilīyate | self dissolves |\n", "workbook-questions": "# Stage 11: Bhāva — Workbook (Questions)\n\n## Section A: Vocabulary (10 marks)\n**A1.** Give the Sanskrit for (5 marks):\n1. Longing: ___  2. Surrender: ___  3. Wonder: ___  4. Gratitude: ___  5. Peace: ___\n\n**A2.** Translate into English (5 marks):\n1. virahaḥ  2. anugrahaḥ  3. dāsyam  4. vismayaḥ  5. premā\n\n---\n\n## Section B: Emotional Expression (15 marks)\n**B1.** Express each feeling in a Sanskrit sentence (5 marks):\n1. Joy: ___\n2. Sorrow: ___\n3. Fear: ___\n4. Gratitude: ___\n5. Longing: ___\n\n**B2.** Write 2 sentences expressing wonder at the divine (5 marks):\n\n**B3.** Write 2 sentences expressing surrender to the divine (5 marks):\n\n---\n\n## Section C: Five Bhāvas Game (20 marks)\nChoose your iṣṭadevatā. Write a 2-line address in each bhāva:\n\n**C1.** Śānta (peaceful reverence) — 2 lines (4 marks):\n\n**C2.** Dāsya (servitude) — 2 lines (4 marks):\n\n**C3.** Sakhya (friendship) — 2 lines (4 marks):\n\n**C4.** Vātsalya (parental love) — 2 lines (4 marks):\n\n**C5.** Mādhurya (sweet love) — 2 lines (4 marks):\n\n---\n\n## Section D: Emotional Narrative (15 marks)\n**D1.** Write a 5-sentence passage about visiting your iṣṭadevatā's temple. Include at least 3 different bhāva-words (emotions) (10 marks):\n\n**D2.** Translate this emotional passage into English (5 marks):\n> he devi! tava darśanena mama hṛdayaṃ pūrṇam. netrābhyāṃ ānandasya aśrūṇi patanti. aho! kīdṛśī tava karuṇā! aham dīnaḥ, tvaṃ tu karuṇāmayī. tava pādayoḥ mama sarvaṃ samarpayāmi.\n\n---\n\n**Total: 60 marks**\n", "workbook-answers": "# Stage 11: Bhāva — Workbook (Answers)\n\n## Section A\n**A1.** 1. **utkaṇṭhā** (or virahaḥ)  2. **śaraṇāgatiḥ** (or prapatti)  3. **vismayaḥ** (or adbhutam)  4. **kṛtajñatā**  5. **śāntiḥ**\n\n**A2.** 1. separation/longing  2. grace/blessing  3. servitude  4. wonder/amazement  5. love\n\n## Section B\n**B1.** Samples:\n1. **ānando me hṛdaye bhavati** (joy arises in my heart)\n2. **duḥkham anubhavāmi** (I experience sorrow)\n3. **bhayam asti mama hṛdaye** (fear is in my heart)\n4. **dhanyaḥ asmi tava kṛpayā** (I am blessed by your grace)\n5. **tava darśanasya utkaṇṭhā mama asti** (I have longing for your vision)\n\n**B2.** Sample: **aho! kīdṛśaṃ tava rūpam! vismayena mama manaḥ pūrṇam.** (Oh! What is your form like! My mind is full of wonder.)\n\n**B3.** Sample: **he prabho! tvām eva śaraṇam prapadye. mama sarvaṃ tvayi samarpayāmi.** (O Lord, I take refuge in you alone. I offer everything to you.)\n\n## Section C\nSamples for Śiva:\n\n**C1.** Śānta: **oṃ namaḥ śivāya. sarvam śāntam, sarvam śivam.**\n**C2.** Dāsya: **he prabho! aham tava dāsaḥ. ājñāṃ dehi, kāryaṃ karomi.**\n**C3.** Sakhya: **he śiva sakhe! adya kailāse viharāvaḥ. tvayā saha ānandaḥ.**\n**C4.** Vātsalya: **he bāla śambho! ehi mama kroḍam. tvāṃ rakṣāmi sadā.**\n**C5.** Mādhurya: **he prāṇeś
