<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>conversational sanskrit</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
:root {
  --bg: #0f0f17;
  --bg-secondary: #151520;
  --bg-card: #1c1c2e;
  --bg-card-hover: #25253d;
  --text: #f0eef5;
  --text-muted: #9b95b0;
  --text-dim: #605a75;
  --accent: #34d399;
  --accent-glow: #34d39920;
  --accent-secondary: #64d2ff;
  --border: #2a2940;
  --code-bg: #0a0a12;
  --table-header: #1a1a2c;
  --table-row-alt: #131320;
  --scrollbar-thumb: #3d3a55;
  --sidebar-width: 300px;
  --link: #64d2ff;
  --green: #34d399;
  --red: #f87171;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Georgia', 'Palatino', serif;
  background: var(--bg);
  color: var(--text);
  display: flex;
  height: 100vh;
  overflow: hidden;
}

::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: var(--bg-secondary); }
::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 4px; }

/* ── Sidebar ── */
.sidebar {
  width: var(--sidebar-width);
  min-width: var(--sidebar-width);
  background: var(--bg-secondary);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
}

.sidebar-header {
  padding: 24px 20px 16px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.sidebar-header h1 {
  font-size: 18px;
  color: var(--accent);
  letter-spacing: 1px;
  font-weight: normal;
}

.sidebar-header p {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 4px;
  letter-spacing: 0.5px;
}

.sidebar-header .back-link {
  display: inline-block;
  margin-top: 8px;
  font-size: 11px;
  color: var(--text-dim);
  text-decoration: none;
  font-family: 'Menlo', monospace;
}

.sidebar-header .back-link:hover { color: var(--accent); }

.sidebar-search {
  padding: 12px 16px;
  flex-shrink: 0;
}

.sidebar-search input {
  width: 100%;
  padding: 8px 12px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  font-size: 13px;
  font-family: 'Georgia', serif;
  outline: none;
}

.sidebar-search input:focus { border-color: var(--accent); }
.sidebar-search input::placeholder { color: var(--text-dim); }

.stage-list {
  flex: 1;
  overflow-y: auto;
  padding: 8px 0;
}

.stage-item {
  padding: 10px 20px;
  cursor: pointer;
  border-left: 3px solid transparent;
  transition: all 0.15s;
  display: flex;
  align-items: baseline;
  gap: 10px;
}

.stage-item:hover { background: var(--bg-card); }

.stage-item.active {
  background: var(--bg-card);
  border-left-color: var(--accent);
}

.stage-item.hidden { display: none; }

.stage-num {
  font-size: 11px;
  color: var(--text-dim);
  min-width: 22px;
  font-family: 'Menlo', monospace;
}

.stage-info { flex: 1; min-width: 0; }

.stage-title { font-size: 14px; color: var(--text); }
.active .stage-title { color: var(--accent); }

.stage-subtitle {
  font-size: 11px;
  color: var(--text-dim);
  margin-top: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.phase-label {
  padding: 16px 20px 6px;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  color: var(--text-dim);
  font-family: 'Menlo', monospace;
}

/* ── Main ── */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.tab-bar {
  display: flex;
  padding: 0 32px;
  border-bottom: 1px solid var(--border);
  background: var(--bg-secondary);
  flex-shrink: 0;
  overflow-x: auto;
}

.tab {
  padding: 14px 24px;
  font-size: 13px;
  color: var(--text-muted);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: all 0.15s;
  font-family: 'Menlo', monospace;
  letter-spacing: 0.5px;
  white-space: nowrap;
}

.tab:hover { color: var(--text); background: var(--bg-card); }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); }

.content-wrap {
  flex: 1;
  overflow-y: auto;
}

.content {
  max-width: 900px;
  margin: 0 auto;
  padding: 40px 48px 80px;
}

.content .table-wrap {
  overflow-x: auto;
  margin: 16px 0;
}

/* Bottom nav */
.bottom-nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 48px;
  padding-top: 24px;
  border-top: 1px solid var(--border);
}

.nav-btn {
  padding: 10px 20px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text-muted);
  font-size: 13px;
  font-family: 'Georgia', serif;
  cursor: pointer;
  transition: all 0.15s;
  text-decoration: none;
}

.nav-btn:hover { border-color: var(--accent); color: var(--accent); }
.nav-btn.disabled { opacity: 0.3; pointer-events: none; }

.nav-btn .nav-label {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--text-dim);
  display: block;
  margin-bottom: 4px;
}

.nav-btn .nav-title { color: var(--accent); }

/* Progress bar */
.progress-bar {
  height: 2px;
  background: var(--border);
  flex-shrink: 0;
}

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--accent-secondary));
  transition: width 0.4s;
}

/* ── Markdown ── */
.content h1 { font-size: 28px; color: var(--accent); margin-bottom: 24px; font-weight: normal; line-height: 1.3; border-bottom: 1px solid var(--border); padding-bottom: 16px; }
.content h2 { font-size: 21px; color: var(--accent-secondary); margin-top: 40px; margin-bottom: 16px; font-weight: normal; }
.content h3 { font-size: 17px; margin-top: 28px; margin-bottom: 12px; font-weight: bold; }
.content h4 { font-size: 15px; color: var(--text-muted); margin-top: 20px; margin-bottom: 8px; font-weight: bold; }
.content p { font-size: 15px; line-height: 1.8; margin-bottom: 14px; }
.content ul, .content ol { margin-bottom: 14px; padding-left: 24px; }
.content li { font-size: 15px; line-height: 1.7; margin-bottom: 4px; }
.content blockquote { border-left: 3px solid var(--accent); padding: 12px 20px; margin: 16px 0; background: var(--accent-glow); border-radius: 0 6px 6px 0; font-style: italic; }
.content blockquote p { margin-bottom: 4px; }
.content code { background: var(--code-bg); padding: 2px 6px; border-radius: 3px; font-family: 'Menlo', monospace; font-size: 13px; color: var(--accent); }
.content pre { background: var(--code-bg); padding: 16px 20px; border-radius: 8px; overflow-x: auto; margin: 16px 0; border: 1px solid var(--border); }
.content pre code { background: none; padding: 0; font-size: 13px; line-height: 1.6; color: var(--text); }
.content table { width: 100%; border-collapse: collapse; margin: 16px 0; font-size: 14px; }
.content thead { background: var(--table-header); }
.content th { padding: 10px 14px; text-align: left; color: var(--accent); font-weight: normal; border-bottom: 2px solid var(--border); font-size: 13px; }
.content td { padding: 8px 14px; border-bottom: 1px solid var(--border); vertical-align: top; }
.content tbody tr:nth-child(even) { background: var(--table-row-alt); }
.content tbody tr:hover { background: var(--bg-card-hover); }
.content hr { border: none; border-top: 1px solid var(--border); margin: 32px 0; }
.content strong { color: var(--accent); font-weight: bold; }
.content a { color: var(--link); text-decoration: none; }
.content a:hover { text-decoration: underline; }

/* ── Mobile ── */
@media (max-width: 768px) {
  .sidebar { position: fixed; left: -100%; z-index: 100; width: 85vw; transition: left 0.3s; }
  .sidebar.open { left: 0; }
  .content { padding: 24px 20px 60px; }
  .tab { padding: 12px 16px; font-size: 12px; }
  .mobile-toggle { display: flex !important; }
}

.mobile-toggle {
  display: none;
  position: fixed;
  top: 12px;
  left: 12px;
  z-index: 200;
  background: var(--bg-card);
  border: 1px solid var(--border);
  color: var(--accent);
  width: 40px;
  height: 40px;
  border-radius: 8px;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: 20px;
}

.overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 50; }
.overlay.show { display: block; }
</style>
</head>

<script>
const STAGES = [{"id": "00-overview", "number": 0, "title": "Overview", "subtitle": "The Lego Track", "files": {"overview": "# Conversational Sanskrit: The Lego Track\n\nA 31-stage parallel track building spoken Sanskrit fluency through phrase patterns.\nEach stage is a new \"lego piece\" — a conversational pattern you learn, play with, and\nadd to your repertoire. By the end, you can hold a real conversation in Sanskrit.\n\n## How It Works\n\nEach stage introduces **one phrase pattern** — the way Sanskrit expresses a specific\nconversational move. You learn the pattern, see it in example dialogues, then practice\nbuilding your own sentences with it in the workbook.\n\nThe stages are cumulative. By Stage 12, you can handle most daily interactions.\nBy Stage 24, you can narrate, argue, speculate, and tell stories.\nBy Stage 30, you sound human — with emphasis, nuance, and conversational repair.\n\n## Stage Map\n\n| # | Pattern | The Lego Piece | You Can Now Say |\n|---|---------|---------------|-----------------|\n| 1 | This Is / That Is | etat X asti | Point at things and name them |\n| 2 | I Am / You Are | aham X asmi | Introduce yourself, describe states |\n| 3 | Questions | kim, kutra, kaḥ, kadā, kasmāt | Ask anything basic |\n| 4 | Wanting & Needing | icchāmi, āvaśyakam | Express desires and needs |\n| 5 | Doing Things | present tense verbs | Describe current actions |\n| 6 | Did & Will Do | past and future tense | Talk about any time frame |\n| 7 | Having & Existing | mama asti, atra asti | Possession and existence |\n| 8 | Going & Coming | gacchāmi, āgacchāmi | Movement and invitation |\n| 9 | Give & Take | dehi, gṛhāṇa | Exchange and transactions |\n| 10 | Likes & Preferences | rocate, priyam | Express taste and preference |\n| 11 | Knowing & Not Knowing | jānāmi, na jānāmi | Knowledge and uncertainty |\n| 12 | Can & Cannot | śaknomi, na śaknomi | Ability and limitation |\n| 13 | Polite Phrases | kṛpayā, dhanyavādaḥ | Social grease |\n| 14 | Because & Therefore | yataḥ...tataḥ | Give reasons |\n| 15 | If & Then | yadi...tarhi | Conditionals |\n| 16 | But & Although | kintu, yadyapi...tathāpi | Contrast and concession |\n| 17 | When & While | yadā...tadā | Temporal framing |\n| 18 | First, Then, Finally | prathamam, tataḥ, ante | Sequence events |\n| 19 | Comparing | uttamam, iva, sadṛśam | More, less, similar |\n| 20 | The One Who... | yaḥ...saḥ | Relative clauses |\n| 21 | I Think & Opinions | manye, mama matena | Express views |\n| 22 | Should & Must | kartavyam, karaṇīyam | Obligation and advice |\n| 23 | Would Have / But Instead | conditional past | Counterfactuals |\n| 24 | Telling a Story | ekadā...tataḥ...ante | Extended narration |\n| 25 | Particles & Emphasis | eva, api, khalu, nanu, kila | Sound natural, not robotic |\n| 26 | Still / Already / No Longer | adhunāpi, pūrvam eva, na punaḥ | Track how things change |\n| 27 | Always / Sometimes / Never | sadā, kadācit, na kadāpi | Talk about habits and patterns |\n| 28 | Reported Speech | saḥ avadat yat..., iti | Report what others said |\n| 29 | Clarifying & Repairing | punaḥ vadatu, ko'rthaḥ? | Stay in Sanskrit when confused |\n| 30 | Exclamations & Reactions | aho!, sādhu!, adbhutam! | React with feeling |\n| 31 | Blessings, Promises & Vivid Past | Luṅ, Liṭ, Luṭ, āśīrliṅ | Complete lakāra coverage |\n\n## Four Tiers\n\n| Tier | Stages | What You Get |\n|------|--------|-------------|\n| **Survival** | 1-8 | Navigate basic interactions |\n| **Fluency** | 9-16 | Handle real conversations with nuance |\n| **Mastery** | 17-24 | Narrate, argue, speculate, persuade |\n| **Polish** | 25-31 | Sound human — emphasis, nuance, repair, all 10 lakāras |\n\n## Each Stage Contains\n\n- **theory.md** — The pattern explained with examples and mini-dialogues\n- **workbook-questions.md** — Build sentences, fill gaps, construct dialogues\n- **workbook-answers.md** — Answer key\n\n## Relationship to the Main Track\n\nThis track is independent — you can start it at any time. But it naturally reinforces\nthe grammar from the main syllabus:\n\n| Conv Stage | Grammar Baked In | Main Track Parallel |\n|-----------|-----------------|-------------------|\n| 1-2 | Nominative, basic copula | Stages 1-3 (Nāma, Guṇa) |\n| 3-4 | Interrogatives, accusative | Stage 4 (Rūpa) |\n| 5-6 | Verb conjugation, tenses | Stage 5 (Kriyā) |\n| 7-9 | Dative, instrumental cases | Stage 6 (Kāraka) |\n| 10-13 | Varied constructions | Stages 7-11 |\n| 14-18 | Conjunctions, indeclinables | Stage 11 (Vākya) |\n| 19-24 | Relative clauses, complex syntax | Stages 12+ |\n| 25-30 | Particles, adverbs, reported speech | Stages 9-11 (Paryāya, Samāsa, Vākya) |\n"}, "tabs": ["overview"]}, {"id": "conv-01-this-is", "number": 1, "title": "This Is / That Is", "subtitle": "etat X asti", "files": {"theory": "# Stage 1: This Is / That Is\n\n**Pattern Name:** etat ... asti / tat ... asti\n\n---\n\n## The Pattern\n\n| Sanskrit | IAST | Meaning |\n|----------|------|---------|\n| एतत् X अस्ति | etat X asti | This is X |\n| तत् Y अस्ति | tat Y asti | That is Y |\n| एतत् किम् अस्ति? | etat kim asti? | What is this? |\n\nPoint at something near you — **etat**. Point at something far away — **tat**. Slap **asti** (\"is\") at the end. Done.\n\n---\n\n## How It Works\n\nSanskrit has a simple copula verb **asti** (= \"is\"). To say \"this is a book,\" you point with **etat** (\"this\"), name the thing (**pustakam**, \"book\"), and close with **asti**. For \"that,\" swap in **tat**. To ask \"what is this?\", just drop **kim** (\"what\") where the noun would go: **etat kim asti?**\n\nThe thing you're pointing at sits in the nominative case — which for most neuter nouns just means the dictionary form. No extra endings to worry about yet.\n\n---\n\n## Example Phrases\n\n1. एतत् पुस्तकम् अस्ति।\n   etat pustakam asti.\n   \"This is a book.\"\n\n2. तत् गृहम् अस्ति।\n   tat gṛham asti.\n   \"That is a house.\"\n\n3. एतत् जलम् अस्ति।\n   etat jalam asti.\n   \"This is water.\"\n\n4. तत् फलम् अस्ति।\n   tat phalam asti.\n   \"That is a fruit.\"\n\n5. एतत् किम् अस्ति?\n   etat kim asti?\n   \"What is this?\"\n\n6. तत् पुष्पम् अस्ति।\n   tat puṣpam asti.\n   \"That is a flower.\"\n\n7. एतत् दुग्धम् अस्ति।\n   etat dugdham asti.\n   \"This is milk.\"\n\n8. तत् वृक्षः अस्ति।\n   tat vṛkṣaḥ asti.\n   \"That is a tree.\"\n\n9. एतत् यानम् अस्ति।\n   etat yānam asti.\n   \"This is a vehicle.\"\n\n10. तत् विद्यालयः अस्ति।\n    tat vidyālayaḥ asti.\n    \"That is a school.\"\n\n---\n\n## Mini-Dialogue 1\n\n**रामः (rāmaḥ):** एतत् किम् अस्ति?\netat kim asti?\n\"What is this?\"\n\n**सीता (sītā):** एतत् पुस्तकम् अस्ति।\netat pustakam asti.\n\"This is a book.\"\n\n**रामः:** तत् किम् अस्ति?\ntat kim asti?\n\"What is that?\"\n\n**सीता:** तत् कलमः अस्ति।\ntat kalamaḥ asti.\n\"That is a pen.\"\n\n## Mini-Dialogue 2\n\n**बालकः (bālakaḥ):** तत् किम् अस्ति?\ntat kim asti?\n\"What is that?\"\n\n**माता (mātā):** तत् चन्द्रः अस्ति।\ntat candraḥ asti.\n\"That is the moon.\"\n\n**बालकः:** एतत् किम् अस्ति?\netat kim asti?\n\"What is this?\"\n\n**माता:** एतत् दीपः अस्ति।\netat dīpaḥ asti.\n\"This is a lamp.\"\n\n---\n\n## Variations\n\n1. **Dropping asti:** In casual speech, you can just say **etat pustakam** — the \"is\" is understood. Like pointing and saying \"This — a book.\"\n\n2. **Gender forms of etat/tat:** When pointing at a masculine or feminine noun, the demonstrative changes form: **eṣaḥ** (this, masc.), **eṣā** (this, fem.), **saḥ** (that, masc.), **sā** (that, fem.). For now, **etat/tat** (neuter) covers most objects.\n\n3. **na asti (is not):** To negate, slip **na** before **asti**: **etat jalam na asti** — \"This is not water.\"\n\n---\n\n## Common Mistakes\n\n1. **Forgetting asti at the end.** While dropping it is fine in casual speech, keep it in while you're learning — it anchors the sentence structure.\n\n2. **Mixing up etat and tat.** Think of it physically: **etat** = close enough to touch, **tat** = over there. If you can point with your finger and almost poke it, use **etat**.\n", "workbook-questions": "# Stage 1: This Is / That Is — Workbook Questions\n\n**Total: 40 marks**\n\n---\n\n## Section A: Translate to Sanskrit (5 x 2 = 10 marks)\n\nWrite each sentence in IAST transliteration.\n\n1. This is water.\n2. That is a fruit.\n3. What is this?\n4. That is a flower.\n5. This is not milk.\n\n---\n\n## Section B: Translate to English (5 x 2 = 10 marks)\n\n1. etat pustakam asti.\n2. tat gṛham asti.\n3. etat kim asti?\n4. tat yānam asti.\n5. etat phalam na asti.\n\n---\n\n## Section C: Fill in the Blank (5 x 1 = 5 marks)\n\n1. ______ pustakam asti. (This is a book.)\n2. tat ______ asti. (That is a house.)\n3. etat kim ______? (What is this?)\n4. tat puṣpam ______ . (That is a flower.)\n5. etat jalam ______ asti. (This is not water.)\n\n---\n\n## Section D: Build a Mini-Dialogue (2 x 5 = 10 marks)\n\nWrite each dialogue in IAST transliteration (3-4 lines each).\n\n1. **Prompt:** Two friends are in a kitchen. One points at various items and asks what they are. The other answers. Use at least two instances of **etat kim asti?**\n\n2. **Prompt:** A child and a parent are outside at night. The child asks about things nearby and far away. Use both **etat** and **tat**.\n\n---\n\n## Section E: Free Response (2 x 2.5 = 5 marks)\n\n1. Look around the room you're in right now. Write three **etat ... asti** sentences about things near you and two **tat ... asti** sentences about things farther away.\n\n2. Write a short (4-5 line) scene where someone is confused about an object and keeps asking **etat kim asti?** before finally getting the right answer.\n", "workbook-answers": "# Stage 1: This Is / That Is — Workbook Answers\n\n---\n\n## Section A: Translate to Sanskrit\n\n1. etat jalam asti.\n2. tat phalam asti.\n3. etat kim asti?\n4. tat puṣpam asti.\n5. etat dugdham na asti.\n\n---\n\n## Section B: Translate to English\n\n1. This is a book.\n2. That is a house.\n3. What is this?\n4. That is a vehicle.\n5. This is not a fruit.\n\n---\n\n## Section C: Fill in the Blank\n\n1. **etat** pustakam asti.\n2. tat **gṛham** asti.\n3. etat kim **asti**?\n4. tat puṣpam **asti**.\n5. etat jalam **na** asti.\n\n---\n\n## Section D: Build a Mini-Dialogue — Sample Answers\n\n**Dialogue 1 (Kitchen):**\n\nrāmaḥ: etat kim asti?\nsītā: etat dugdham asti.\nrāmaḥ: etat kim asti?\nsītā: etat phalam asti.\n\n**Dialogue 2 (Outside at night):**\n\nbālakaḥ: tat kim asti?\nmātā: tat candraḥ asti.\nbālakaḥ: etat kim asti?\nmātā: etat dīpaḥ asti.\n\n---\n\n## Section E: Free Response — Sample Answers\n\n**1. Room description:**\n\netat pustakam asti. etat kalamaḥ asti. etat jalam asti.\ntat gṛham asti. tat vṛkṣaḥ asti.\n\n**2. Confused person scene:**\n\nbālakaḥ: etat kim asti?\nmātā: etat phalam asti.\nbālakaḥ: etat kim asti?\nmātā: etat puṣpam asti.\nbālakaḥ: etat kim asti?\nmātā: etat dugdham asti!\n"}, "tabs": ["theory", "workbook-questions", "workbook-answers"]}, {"id": "conv-02-i-am", "number": 2, "title": "I Am / You Are", "subtitle": "aham X asmi", "files": {"theory": "# Stage 2: I Am / You Are\n\n**Pattern Name:** aham ... asmi / tvam ... asi / saḥ-sā ... asti\n\n---\n\n## The Pattern\n\n| Sanskrit | IAST | Meaning |\n|----------|------|---------|\n| अहम् X अस्मि | aham X asmi | I am X |\n| त्वम् Y असि | tvam Y asi | You are Y |\n| सः Z अस्ति | saḥ Z asti | He is Z |\n| सा Z अस्ति | sā Z asti | She is Z |\n\nPoint at yourself — **aham** + **asmi**. Point at the person you're talking to — **tvam** + **asi**. Point at someone else — **saḥ** (he) or **sā** (she) + **asti**.\n\n---\n\n## How It Works\n\nThe verb \"to be\" (**as**) changes its ending depending on who you're talking about. Think of it like snapping a different tail onto the same root: **asmi** (I am), **asi** (you are), **asti** (he/she/it is). The pronoun tells you who, the verb ending confirms it.\n\nWhen describing yourself or someone else, the describing word often adjusts for gender. A hungry man is **kṣudhitaḥ**, a hungry woman is **kṣudhitā**. For now, just notice the pattern: **-aḥ** for masculine, **-ā** for feminine. Neuter descriptions (like occupations) often stay the same.\n\n---\n\n## Example Phrases\n\n1. अहम् छात्रः अस्मि।\n   aham chātraḥ asmi.\n   \"I am a student.\" (male speaker)\n\n2. अहम् छात्रा अस्मि।\n   aham chātrā asmi.\n   \"I am a student.\" (female speaker)\n\n3. त्वम् कः असि?\n   tvam kaḥ asi?\n   \"Who are you?\" (to a male)\n\n4. त्वम् सुखी असि?\n   tvam sukhī asi?\n   \"Are you happy?\" (to a female)\n\n5. सः वैद्यः अस्ति।\n   saḥ vaidyaḥ asti.\n   \"He is a doctor.\"\n\n6. सा अध्यापिका अस्ति।\n   sā adhyāpikā asti.\n   \"She is a teacher.\"\n\n7. अहम् क्षुधितः अस्मि।\n   aham kṣudhitaḥ asmi.\n   \"I am hungry.\" (male)\n\n8. अहम् श्रान्तः अस्मि।\n   aham śrāntaḥ asmi.\n   \"I am tired.\" (male)\n\n9. त्वम् सिद्धः असि।\n   tvam siddhaḥ asi.\n   \"You are ready.\" (to a male)\n\n10. सा प्रसन्ना अस्ति।\n    sā prasannā asti.\n    \"She is happy.\"\n\n---\n\n## Mini-Dialogue 1\n\n**रामः (rāmaḥ):** त्वम् कः असि?\ntvam kaḥ asi?\n\"Who are you?\"\n\n**कृष्णः (kṛṣṇaḥ):** अहम् कृष्णः अस्मि। अहम् छात्रः अस्मि।\naham kṛṣṇaḥ asmi. aham chātraḥ asmi.\n\"I am Krishna. I am a student.\"\n\n**रामः:** अहम् रामः अस्मि। अहम् अध्यापकः अस्मि।\naham rāmaḥ asmi. aham adhyāpakaḥ asmi.\n\"I am Rama. I am a teacher.\"\n\n## Mini-Dialogue 2\n\n**सीता (sītā):** त्वम् कुशलिनी असि?\ntvam kuśalinī asi?\n\"Are you well?\" (to a female)\n\n**गीता (gītā):** आम्, अहम् कुशलिनी अस्मि। त्वम्?\nām, aham kuśalinī asmi. tvam?\n\"Yes, I am well. You?\"\n\n**सीता:** अहम् किञ्चित् श्रान्ता अस्मि।\naham kiñcit śrāntā asmi.\n\"I am a little tired.\"\n\n**गीता:** सः कः अस्ति?\nsaḥ kaḥ asti?\n\"Who is he?\"\n\n**सीता:** सः मम भ्राता अस्ति।\nsaḥ mama bhrātā asti.\n\"He is my brother.\"\n\n---\n\n## Variations\n\n1. **Dropping the pronoun:** Because the verb ending already tells you who, you can drop **aham** and just say **chātraḥ asmi** — \"Am a student.\" Natural and common.\n\n2. **Plural:** For \"we are,\" use **vayam ... smaḥ**. For \"you all are,\" use **yūyam ... stha**. For \"they are,\" use **te ... santi**.\n\n3. **Negative:** Slip in **na** — **aham chātraḥ na asmi** — \"I am not a student.\"\n\n---\n\n## Common Mistakes\n\n1. **Using asti for everyone.** Remember: **asmi** = I, **asi** = you, **asti** = he/she/it. The ending must match the person.\n\n2. **Ignoring gender on adjectives.** If you're female, say **śrāntā asmi** (not **śrāntaḥ asmi**). The **-aḥ / -ā** distinction matters.\n", "workbook-questions": "# Stage 2: I Am / You Are — Workbook Questions\n\n**Total: 40 marks**\n\n---\n\n## Section A: Translate to Sanskrit (5 x 2 = 10 marks)\n\nWrite each sentence in IAST transliteration. Pay attention to the gender indicated.\n\n1. I am a teacher. (male speaker)\n2. You are happy. (to a female)\n3. She is a doctor.\n4. I am hungry. (female speaker)\n5. He is my brother.\n\n---\n\n## Section B: Translate to English (5 x 2 = 10 marks)\n\n1. aham chātraḥ asmi.\n2. tvam kaḥ asi?\n3. sā adhyāpikā asti.\n4. aham śrāntā asmi.\n5. saḥ prasannaḥ asti.\n\n---\n\n## Section C: Fill in the Blank (5 x 1 = 5 marks)\n\n1. aham vaidyaḥ ______. (I am a doctor.)\n2. tvam kuśalinī ______? (Are you well? — to a female)\n3. ______ adhyāpakaḥ asti. (He is a teacher.)\n4. aham ______ asmi. (I am tired. — male speaker)\n5. sā mama ______ asti. (She is my sister.)\n\n---\n\n## Section D: Build a Mini-Dialogue (2 x 5 = 10 marks)\n\nWrite each dialogue in IAST transliteration (3-4 lines each).\n\n1. **Prompt:** Two people meet for the first time. They introduce themselves by name and occupation. One asks \"Who are you?\" Use **aham ... asmi** and **tvam kaḥ/kā asi?**\n\n2. **Prompt:** A friend visits and asks how you are. You say you're tired. You ask about a third person (he/she). Use at least one instance each of **asmi**, **asi**, and **asti**.\n\n---\n\n## Section E: Free Response (2 x 2.5 = 5 marks)\n\n1. Describe yourself in four Sanskrit sentences using **aham ... asmi**. Include your name, one occupation or role, and two states (happy, tired, hungry, ready, etc.).\n\n2. Write a scene (4-5 lines) where someone introduces three people at a gathering, using **saḥ ... asti** and **sā ... asti**.\n", "workbook-answers": "# Stage 2: I Am / You Are — Workbook Answers\n\n---\n\n## Section A: Translate to Sanskrit\n\n1. aham adhyāpakaḥ asmi.\n2. tvam sukhī asi? *(or: tvam prasannā asi?)*\n3. sā vaidyā asti.\n4. aham kṣudhitā asmi.\n5. saḥ mama bhrātā asti.\n\n---\n\n## Section B: Translate to English\n\n1. I am a student. (male)\n2. Who are you? (to a male)\n3. She is a teacher.\n4. I am tired. (female)\n5. He is happy.\n\n---\n\n## Section C: Fill in the Blank\n\n1. aham vaidyaḥ **asmi**.\n2. tvam kuśalinī **asi**?\n3. **saḥ** adhyāpakaḥ asti.\n4. aham **śrāntaḥ** asmi.\n5. sā mama **bhaginī** asti.\n\n---\n\n## Section D: Build a Mini-Dialogue — Sample Answers\n\n**Dialogue 1 (First meeting):**\n\nrāmaḥ: tvam kaḥ asi?\nkṛṣṇaḥ: aham kṛṣṇaḥ asmi. aham vaidyaḥ asmi. tvam kaḥ asi?\nrāmaḥ: aham rāmaḥ asmi. aham adhyāpakaḥ asmi.\n\n**Dialogue 2 (Visiting friend):**\n\nsītā: tvam kuśalinī asi?\ngītā: aham kiñcit śrāntā asmi. saḥ kaḥ asti?\nsītā: saḥ mama bhrātā asti. saḥ prasannaḥ asti.\n\n---\n\n## Section E: Free Response — Sample Answers\n\n**1. Self-description:**\n\naham rāmaḥ asmi. aham chātraḥ asmi. aham prasannaḥ asmi. aham kiñcit kṣudhitaḥ asmi.\n\n**2. Introducing three people:**\n\neṣaḥ rāmaḥ asti. saḥ vaidyaḥ asti.\neṣā sītā asti. sā adhyāpikā asti.\nsaḥ kṛṣṇaḥ asti. saḥ chātraḥ asti.\n"}, "tabs": ["theory", "workbook-questions", "workbook-answers"]}, {"id": "conv-03-questions", "number": 3, "title": "Questions", "subtitle": "kim, kutra, kaḥ, kadā", "files": {"theory": "# Stage 3: Questions\n\n**Pattern Name:** kim / kaḥ / kutra / kadā / katham / kasmāt\n\n---\n\n## The Pattern\n\n| Sanskrit | IAST | Meaning |\n|----------|------|---------|\n| किम् | kim | What? |\n| कः / का | kaḥ / kā | Who? (masc. / fem.) |\n| कुत्र | kutra | Where? |\n| कदा | kadā | When? |\n| कथम् | katham | How? |\n| कस्मात् / किमर्थम् | kasmāt / kimartham | Why? |\n\nEvery question word starts with **ka-**. That's your anchor. Learn the **ka-** family and you can ask about anything.\n\n---\n\n## How It Works\n\nSanskrit question words slot into the same position as the answer would occupy. English moves the question word to the front (\"Where is the book?\"), but Sanskrit keeps it in place: **pustakam kutra asti?** — literally \"book where is?\" The word order is flexible, but keeping the question word near the verb sounds natural.\n\nFor \"who,\" gender matters: **kaḥ** asks about a male, **kā** about a female. **kim** does double duty — it means \"what?\" on its own, and also serves as the neuter form of \"who/which.\" Context makes it clear.\n\n---\n\n## Example Phrases\n\n1. एतत् किम् अस्ति?\n   etat kim asti?\n   \"What is this?\"\n\n2. सः कः अस्ति?\n   saḥ kaḥ asti?\n   \"Who is he?\"\n\n3. सा का अस्ति?\n   sā kā asti?\n   \"Who is she?\"\n\n4. रामः कुत्र अस्ति?\n   rāmaḥ kutra asti?\n   \"Where is Rama?\"\n\n5. भोजनम् कदा अस्ति?\n   bhojanam kadā asti?\n   \"When is the meal?\"\n\n6. एतत् कथम् अस्ति?\n   etat katham asti?\n   \"How is this?\" / \"What is this like?\"\n\n7. त्वम् कुत्र असि?\n   tvam kutra asi?\n   \"Where are you?\"\n\n8. त्वम् कस्मात् श्रान्तः असि?\n   tvam kasmāt śrāntaḥ asi?\n   \"Why are you tired?\"\n\n9. विद्यालयः कुत्र अस्ति?\n   vidyālayaḥ kutra asti?\n   \"Where is the school?\"\n\n10. तव नाम किम् अस्ति?\n    tava nāma kim asti?\n    \"What is your name?\"\n\n---\n\n## Mini-Dialogue 1\n\n**रामः (rāmaḥ):** तव नाम किम् अस्ति?\ntava nāma kim asti?\n\"What is your name?\"\n\n**सीता (sītā):** मम नाम सीता अस्ति। तव नाम किम्?\nmama nāma sītā asti. tava nāma kim?\n\"My name is Sita. What's yours?\"\n\n**रामः:** मम नाम रामः। त्वम् कुत्र असि?\nmama nāma rāmaḥ. tvam kutra asi?\n\"My name is Rama. Where are you (from)?\"\n\n**सीता:** अहम् अयोध्यायाम् अस्मि।\naham ayodhyāyām asmi.\n\"I am in Ayodhya.\"\n\n## Mini-Dialogue 2\n\n**बालकः (bālakaḥ):** भोजनम् कदा अस्ति?\nbhojanam kadā asti?\n\"When is the meal?\"\n\n**माता (mātā):** शीघ्रम्। त्वम् कस्मात् क्षुधितः असि?\nśīghram. tvam kasmāt kṣudhitaḥ asi?\n\"Soon. Why are you hungry?\"\n\n**बालकः:** अहम् बहु क्रीडितवान्!\naham bahu krīḍitavān!\n\"I played a lot!\"\n\n**माता:** तत् फलम् खाद।\ntat phalam khāda.\n\"Eat that fruit.\"\n\n---\n\n## Variations\n\n1. **kim + noun = \"which?\":** When **kim** sits before a noun, it becomes \"which\" — **kim pustakam?** = \"Which book?\" The form adjusts for gender: **kaḥ bālakaḥ?** = \"Which boy?\", **kā bālikā?** = \"Which girl?\"\n\n2. **Rhetorical questions with kim:** Adding **kim** at the start of any statement turns it into a yes/no question: **kim tvam chātraḥ asi?** = \"Are you a student?\"\n\n3. **kiyat = \"how much/many?\":** A cousin of the **ka-** family: **kiyat dūram?** = \"How far?\"\n\n---\n\n## Common Mistakes\n\n1. **Using kim for \"who\" with people.** For \"who is he?\", use **kaḥ** (not **kim**): **saḥ kaḥ asti?** The word **kim** is for \"what\" or neuter \"which.\"\n\n2. **Forgetting gender on kaḥ/kā.** Asking about a woman with **kaḥ** is like saying \"who is he?\" when you mean \"she.\" Use **kā** for feminine.\n", "workbook-questions": "# Stage 3: Questions — Workbook Questions\n\n**Total: 40 marks**\n\n---\n\n## Section A: Translate to Sanskrit (5 x 2 = 10 marks)\n\nWrite each sentence in IAST transliteration.\n\n1. What is your name?\n2. Where is the school?\n3. Who is she?\n4. When is the meal?\n5. Why are you tired? (to a male)\n\n---\n\n## Section B: Translate to English (5 x 2 = 10 marks)\n\n1. saḥ kaḥ asti?\n2. tvam kutra asi?\n3. etat kim asti?\n4. bhojanam kadā asti?\n5. tvam kasmāt kṣudhitaḥ asi?\n\n---\n\n## Section C: Fill in the Blank (5 x 1 = 5 marks)\n\nChoose the correct question word: kim, kaḥ, kā, kutra, kadā, katham, kasmāt.\n\n1. tava nāma ______ asti? (What is your name?)\n2. rāmaḥ ______ asti? (Where is Rama?)\n3. sā ______ asti? (Who is she?)\n4. bhojanam ______ asti? (When is the meal?)\n5. tvam ______ śrāntaḥ asi? (Why are you tired?)\n\n---\n\n## Section D: Build a Mini-Dialogue (2 x 5 = 10 marks)\n\nWrite each dialogue in IAST transliteration (3-4 lines each).\n\n1. **Prompt:** Two people meet at a gathering. They ask each other's names and where they are from. Use at least **kim**, **kutra**, and one other question word.\n\n2. **Prompt:** A child bombards a parent with questions — \"what is that?\", \"where is it?\", \"why?\" The parent answers patiently. Use at least three different question words.\n\n---\n\n## Section E: Free Response (2 x 2.5 = 5 marks)\n\n1. Write five different questions you might ask a new friend, each using a different question word from this stage.\n\n2. Imagine you arrive in a new city. Write 3-4 questions you would need to ask, using the patterns from this stage.\n", "workbook-answers": "# Stage 3: Questions — Workbook Answers\n\n---\n\n## Section A: Translate to Sanskrit\n\n1. tava nāma kim asti?\n2. vidyālayaḥ kutra asti?\n3. sā kā asti?\n4. bhojanam kadā asti?\n5. tvam kasmāt śrāntaḥ asi?\n\n---\n\n## Section B: Translate to English\n\n1. Who is he?\n2. Where are you?\n3. What is this?\n4. When is the meal?\n5. Why are you hungry?\n\n---\n\n## Section C: Fill in the Blank\n\n1. tava nāma **kim** asti?\n2. rāmaḥ **kutra** asti?\n3. sā **kā** asti?\n4. bhojanam **kadā** asti?\n5. tvam **kasmāt** śrāntaḥ asi?\n\n---\n\n## Section D: Build a Mini-Dialogue — Sample Answers\n\n**Dialogue 1 (At a gathering):**\n\nrāmaḥ: tava nāma kim asti?\nsītā: mama nāma sītā asti. tvam kutra asi?\nrāmaḥ: aham ayodhyāyām asmi. tvam kā asi?\nsītā: aham adhyāpikā asmi.\n\n**Dialogue 2 (Child questioning parent):**\n\nbālakaḥ: tat kim asti?\npitā: tat candraḥ asti.\nbālakaḥ: saḥ kutra asti?\npitā: saḥ ākāśe asti.\nbālakaḥ: kasmāt saḥ tatra asti?\npitā: sā tasya sthānam asti!\n\n---\n\n## Section E: Free Response — Sample Answers\n\n**1. Five questions for a new friend:**\n\ntava nāma kim asti?\ntvam kutra asi?\ntvam kaḥ asi? *(What do you do?)*\ntvam katham asi? *(How are you?)*\ntvam kadā āgataḥ? *(When did you come?)*\n\n**2. Questions in a new city:**\n\nvidyālayaḥ kutra asti?\nbhojanam kutra asti?\nbhojanam kadā asti?\netat nagaram kim asti? *(What is this city?)*\n"}, "tabs": ["theory", "workbook-questions", "workbook-answers"]}, {"id": "conv-04-wanting", "number": 4, "title": "Wanting & Needing", "subtitle": "icchāmi, āvaśyakam", "files": {"theory": "# Stage 4: Wanting & Needing\n\n**Pattern Name:** aham X icchāmi / mama X āvaśyakam\n\n---\n\n## The Pattern\n\n| Sanskrit | IAST | Meaning |\n|----------|------|---------|\n| अहम् X इच्छामि | aham X icchāmi | I want X |\n| त्वम् X इच्छसि | tvam X icchasi | You want X |\n| किम् त्वम् X इच्छसि? | kim tvam X icchasi? | Do you want X? |\n| मम X आवश्यकम् | mama X āvaśyakam | I need X |\n\n**icchāmi** handles desire. **āvaśyakam** handles need. Two tools, most of daily life covered.\n\n---\n\n## How It Works\n\nThe verb **icchati** (\"to want/desire\") conjugates like other verbs: **icchāmi** (I want), **icchasi** (you want), **icchati** (he/she wants). The thing you want goes in the accusative case — for most neuter nouns, that's just the dictionary form (e.g., **jalam** = \"water\"). For masculine nouns, the accusative singular swaps **-aḥ** to **-am**: **pustakaḥ** (book, nominative) becomes **pustakam** (book, accusative — the thing wanted).\n\nFor \"I need,\" Sanskrit uses an impersonal construction: **mama jalam āvaśyakam** — literally \"for-me water necessary.\" The word **mama** means \"my/for me,\" and **āvaśyakam** means \"necessary.\" The needed thing stays in nominative. No verb conjugation needed — neat and clean.\n\n---\n\n## Example Phrases\n\n1. अहम् जलम् इच्छामि।\n   aham jalam icchāmi.\n   \"I want water.\"\n\n2. अहम् भोजनम् इच्छामि।\n   aham bhojanam icchāmi.\n   \"I want food.\"\n\n3. किम् त्वम् चायम् इच्छसि?\n   kim tvam cāyam icchasi?\n   \"Do you want tea?\"\n\n4. सः सहायम् इच्छति।\n   saḥ sahāyam icchati.\n   \"He wants help.\"\n\n5. मम जलम् आवश्यकम्।\n   mama jalam āvaśyakam.\n   \"I need water.\"\n\n6. मम विश्रामः आवश्यकः।\n   mama viśrāmaḥ āvaśyakaḥ.\n   \"I need rest.\"\n\n7. अहम् फलम् इच्छामि।\n   aham phalam icchāmi.\n   \"I want a fruit.\"\n\n8. किम् त्वम् दुग्धम् इच्छसि?\n   kim tvam dugdham icchasi?\n   \"Do you want milk?\"\n\n9. सा पुस्तकम् इच्छति।\n   sā pustakam icchati.\n   \"She wants a book.\"\n\n10. मम सहायः आवश्यकः।\n    mama sahāyaḥ āvaśyakaḥ.\n    \"I need help.\"\n\n---\n\n## Mini-Dialogue 1\n\n**सीता (sītā):** किम् त्वम् चायम् इच्छसि?\nkim tvam cāyam icchasi?\n\"Do you want tea?\"\n\n**रामः (rāmaḥ):** न, अहम् जलम् इच्छामि।\nna, aham jalam icchāmi.\n\"No, I want water.\"\n\n**सीता (sītā):** किम् त्वम् फलम् इच्छसि?\nkim tvam phalam icchasi?\n\"Do you want fruit?\"\n\n**रामः (rāmaḥ):** आम्, अहम् फलम् इच्छामि।\nām, aham phalam icchāmi.\n\"Yes, I want fruit.\"\n\n## Mini-Dialogue 2\n\n**बालकः (bālakaḥ):** मम भोजनम् आवश्यकम्। अहम् क्षुधितः अस्मि।\nmama bhojanam āvaśyakam. aham kṣudhitaḥ asmi.\n\"I need food. I am hungry.\"\n\n**माता (mātā):** किम् त्वम् फलम् इच्छसि?\nkim tvam phalam icchasi?\n\"Do you want fruit?\"\n\n**बालकः:** न, अहम् भोजनम् इच्छामि!\nna, aham bhojanam icchāmi!\n\"No, I want a (proper) meal!\"\n\n**माता:** प्रथमम् फलम् खाद।\nprathamam phalam khāda.\n\"First, eat the fruit.\"\n\n---\n\n## Variations\n\n1. **vāñchati — a fancier \"want\":** The verb **vāñchati** also means \"to want/wish for,\" with a slightly more elevated tone. Same conjugation pattern: **aham pustakam vāñchāmi** = \"I desire a book.\"\n\n2. **mama ... na āvaśyakam — \"I don't need\":** Just slip **na** before **āvaśyakam**: **mama etat na āvaśyakam** = \"I don't need this.\"\n\n3. **Infinitive + icchāmi — \"I want to...\":** To say \"I want to go,\" use **gantum icchāmi** (gantum = \"to go\"). The infinitive ends in **-tum**: **khāditum icchāmi** = \"I want to eat.\"\n\n---\n\n## Common Mistakes\n\n1. **Confusing icchāmi and āvaśyakam constructions.** With **icchāmi**, the subject is \"I\" (aham) and the verb conjugates. With **āvaśyakam**, it's impersonal — you say **mama** (\"my/for me\"), not **aham**.\n\n2. **Forgetting accusative with icchāmi.** The object of wanting takes accusative: **pustakam icchāmi** (not **pustakaḥ icchāmi**).\n", "workbook-questions": "# Stage 4: Wanting & Needing — Workbook Questions\n\n**Total: 40 marks**\n\n---\n\n## Section A: Translate to Sanskrit (5 x 2 = 10 marks)\n\nWrite each sentence in IAST transliteration.\n\n1. I want water.\n2. Do you want tea?\n3. She wants a book.\n4. I need food.\n5. I need rest.\n\n---\n\n## Section B: Translate to English (5 x 2 = 10 marks)\n\n1. aham phalam icchāmi.\n2. kim tvam dugdham icchasi?\n3. saḥ sahāyam icchati.\n4. mama jalam āvaśyakam.\n5. aham bhojanam icchāmi.\n\n---\n\n## Section C: Fill in the Blank (5 x 1 = 5 marks)\n\n1. aham jalam ______. (I want water.)\n2. kim tvam phalam ______? (Do you want fruit?)\n3. mama viśrāmaḥ ______. (I need rest.)\n4. sā ______ icchati. (She wants a book.)\n5. ______ bhojanam āvaśyakam. (I need food.)\n\n---\n\n## Section D: Build a Mini-Dialogue (2 x 5 = 10 marks)\n\nWrite each dialogue in IAST transliteration (3-4 lines each).\n\n1. **Prompt:** You are at a friend's house. They offer you tea, but you want water. Then they offer fruit, and you accept. Use **kim tvam ... icchasi?** and **aham ... icchāmi**.\n\n2. **Prompt:** A child tells a parent what they need (food, help with something). The parent asks follow-up questions. Use both **icchāmi** and **āvaśyakam** patterns.\n\n---\n\n## Section E: Free Response (2 x 2.5 = 5 marks)\n\n1. Write four sentences: two things you want right now (using **icchāmi**) and two things you need (using **āvaśyakam**).\n\n2. Write a short scene (4-5 lines) at a market where a buyer asks for various items using the wanting/needing patterns.\n", "workbook-answers": "# Stage 4: Wanting & Needing — Workbook Answers\n\n---\n\n## Section A: Translate to Sanskrit\n\n1. aham jalam icchāmi.\n2. kim tvam cāyam icchasi?\n3. sā pustakam icchati.\n4. mama bhojanam āvaśyakam.\n5. mama viśrāmaḥ āvaśyakaḥ.\n\n---\n\n## Section B: Translate to English\n\n1. I want a fruit.\n2. Do you want milk?\n3. He wants help.\n4. I need water.\n5. I want food.\n\n---\n\n## Section C: Fill in the Blank\n\n1. aham jalam **icchāmi**.\n2. kim tvam phalam **icchasi**?\n3. mama viśrāmaḥ **āvaśyakaḥ**.\n4. sā **pustakam** icchati.\n5. **mama** bhojanam āvaśyakam.\n\n---\n\n## Section D: Build a Mini-Dialogue — Sample Answers\n\n**Dialogue 1 (At a friend's house):**\n\nmitraḥ: kim tvam cāyam icchasi?\naham: na, aham jalam icchāmi.\nmitraḥ: kim tvam phalam icchasi?\naham: ām, aham phalam icchāmi.\n\n**Dialogue 2 (Child and parent):**\n\nbālakaḥ: mama bhojanam āvaśyakam. aham kṣudhitaḥ asmi.\nmātā: kim tvam phalam icchasi?\nbālakaḥ: na, aham bhojanam icchāmi. mama sahāyaḥ api āvaśyakaḥ.\nmātā: kim sahāyam? pustakam paṭhitum?\n\n---\n\n## Section E: Free Response — Sample Answers\n\n**1. Wants and needs:**\n\naham cāyam icchāmi. aham pustakam icchāmi.\nmama viśrāmaḥ āvaśyakaḥ. mama jalam āvaśyakam.\n\n**2. Market scene:**\n\nkretā: aham phalam icchāmi.\nvikretā: kim tvam āmram icchasi?\nkretā: ām, āmram icchāmi. mama dugdham api āvaśyakam.\nvikretā: dugdham atra asti.\nkretā: aham dugdham api icchāmi.\n"}, "tabs": ["theory", "workbook-questions", "workbook-answers"]}, {"id": "conv-05-doing", "number": 5, "title": "Doing Things", "subtitle": "Present tense verbs", "files": {"theory": "# Stage 5: Doing Things\n\n**Pattern Name:** aham X karomi / tvam kim karoṣi?\n\n---\n\n## The Pattern\n\n| Sanskrit | IAST | Meaning |\n|----------|------|---------|\n| अहम् X करोमि | aham X karomi | I do X |\n| त्वम् किम् करोषि? | tvam kim karoṣi? | What are you doing? |\n| सः Y पठति | saḥ Y paṭhati | He reads Y |\n\nThis is your action toolkit. One verb at a time, you can describe everything anyone is doing right now.\n\n---\n\n## How It Works\n\nSanskrit present tense verbs change their ending based on who's doing the action. The pattern for most common verbs: **-āmi** (I), **-asi** (you), **-ati** (he/she/it). So **paṭhati** (he reads) becomes **paṭhāmi** (I read) and **paṭhasi** (you read). The verb **karoti** (\"does/makes\") is your all-purpose action word — it's slightly irregular: **karomi**, **karoṣi**, **karoti**.\n\nHere are eight high-frequency verbs to get you going:\n\n| Verb | IAST | Meaning | I (aham) | You (tvam) | He/She (saḥ/sā) |\n|------|------|---------|----------|------------|-----------------|\n| करोति | karoti | does | karomi | karoṣi | karoti |\n| पठति | paṭhati | reads | paṭhāmi | paṭhasi | paṭhati |\n| खादति | khādati | eats | khādāmi | khādasi | khādati |\n| पिबति | pibati | drinks | pibāmi | pibasi | pibati |\n| वदति | vadati | speaks | vadāmi | vadasi | vadati |\n| लिखति | likhati | writes | likhāmi | likhasi | likhati |\n| गच्छति | gacchati | goes | gacchāmi | gacchasi | gacchati |\n| पश्यति | paśyati | sees | paśyāmi | paśyasi | paśyati |\n\n---\n\n## Example Phrases\n\n1. अहम् पुस्तकम् पठामि।\n   aham pustakam paṭhāmi.\n   \"I read a book.\"\n\n2. त्वम् किम् करोषि?\n   tvam kim karoṣi?\n   \"What are you doing?\"\n\n3. सः भोजनम् खादति।\n   saḥ bhojanam khādati.\n   \"He eats food.\"\n\n4. सा जलम् पिबति।\n   sā jalam pibati.\n   \"She drinks water.\"\n\n5. अहम् पत्रम् लिखामि।\n   aham patram likhāmi.\n   \"I write a letter.\"\n\n6. त्वम् कुत्र गच्छसि?\n   tvam kutra gacchasi?\n   \"Where are you going?\"\n\n7. सः संस्कृतम् वदति।\n   saḥ saṃskṛtam vadati.\n   \"He speaks Sanskrit.\"\n\n8. अहम् वृक्षम् पश्यामि।\n   aham vṛkṣam paśyāmi.\n   \"I see a tree.\"\n\n9. सा विद्यालयम् गच्छति।\n   sā vidyālayam gacchati.\n   \"She goes to school.\"\n\n10. त्वम् किम् खादसि?\n    tvam kim khādasi?\n    \"What are you eating?\"\n\n---\n\n## Mini-Dialogue 1\n\n**रामः (rāmaḥ):** त्वम् किम् करोषि?\ntvam kim karoṣi?\n\"What are you doing?\"\n\n**सीता (sītā):** अहम् पुस्तकम् पठामि। त्वम् किम् करोषि?\naham pustakam paṭhāmi. tvam kim karoṣi?\n\"I'm reading a book. What are you doing?\"\n\n**रामः:** अहम् पत्रम् लिखामि।\naham patram likhāmi.\n\"I'm writing a letter.\"\n\n**सीता:** कम् प्रति लिखसि?\nkam prati likhasi?\n\"To whom are you writing?\"\n\n## Mini-Dialogue 2\n\n**माता (mātā):** बालकः कुत्र गच्छति?\nbālakaḥ kutra gacchati?\n\"Where is the boy going?\"\n\n**पिता (pitā):** सः विद्यालयम् गच्छति।\nsaḥ vidyālayam gacchati.\n\"He is going to school.\"\n\n**माता:** सा किम् करोति?\nsā kim karoti?\n\"What is she doing?\"\n\n**पिता:** सा भोजनम् खादति।\nsā bhojanam khādati.\n\"She is eating food.\"\n\n---\n\n## Variations\n\n1. **Adding \"also\" (api):** Slip **api** after the word it modifies: **aham api gacchāmi** = \"I also go.\" **sā api paṭhati** = \"She also reads.\"\n\n2. **Negation with na:** Place **na** before the verb: **aham na gacchāmi** = \"I am not going.\" **saḥ na vadati** = \"He does not speak.\"\n\n3. **Habitual vs. right now:** The present tense covers both habits and current actions. **aham pratidinām paṭhāmi** = \"I read every day.\" Context tells you which is meant.\n\n---\n\n## Common Mistakes\n\n1. **Mixing up karoṣi and karosi.** The \"you\" form of **karoti** has a retroflex **ṣ**: **karoṣi**, not **karosi**. Most other verbs use regular **-asi**.\n\n2. **Forgetting accusative on the object.** The thing being acted upon takes accusative: **pustakam paṭhāmi** (reading a book-ACC), not **pustakaḥ paṭhāmi**.\n", "workbook-questions": "# Stage 5: Doing Things — Workbook Questions\n\n**Total: 40 marks**\n\n---\n\n## Section A: Translate to Sanskrit (5 x 2 = 10 marks)\n\nWrite each sentence in IAST transliteration.\n\n1. I read a book.\n2. What are you doing?\n3. She drinks water.\n4. He goes to school.\n5. I am writing a letter.\n\n---\n\n## Section B: Translate to English (5 x 2 = 10 marks)\n\n1. saḥ bhojanam khādati.\n2. tvam kutra gacchasi?\n3. aham saṃskṛtam vadāmi.\n4. sā pustakam paṭhati.\n5. tvam kim paśyasi?\n\n---\n\n## Section C: Fill in the Blank (5 x 1 = 5 marks)\n\nFill in the correct verb form.\n\n1. aham pustakam ______. (I read a book.) [paṭh-]\n2. tvam kutra ______? (Where are you going?) [gacch-]\n3. saḥ jalam ______. (He drinks water.) [pib-]\n4. aham patram ______. (I write a letter.) [likh-]\n5. sā bhojanam ______. (She eats food.) [khād-]\n\n---\n\n## Section D: Build a Mini-Dialogue (2 x 5 = 10 marks)\n\nWrite each dialogue in IAST transliteration (3-4 lines each).\n\n1. **Prompt:** Two friends ask each other what they are doing. One is reading, the other is writing. They also ask where someone else (a third person) is going. Use at least three different verbs.\n\n2. **Prompt:** A parent asks a child what they see, what they are eating, and where they are going. The child answers each question. Use **paśyati**, **khādati**, and **gacchati**.\n\n---\n\n## Section E: Free Response (2 x 2.5 = 5 marks)\n\n1. Describe your typical morning in four Sanskrit sentences using four different verbs from this stage.\n\n2. Write a scene (4-5 lines) describing what different family members are doing right now, using **saḥ/sā ... verb** for each person.\n", "workbook-answers": "# Stage 5: Doing Things — Workbook Answers\n\n---\n\n## Section A: Translate to Sanskrit\n\n1. aham pustakam paṭhāmi.\n2. tvam kim karoṣi?\n3. sā jalam pibati.\n4. saḥ vidyālayam gacchati.\n5. aham patram likhāmi.\n\n---\n\n## Section B: Translate to English\n\n1. He eats food.\n2. Where are you going?\n3. I speak Sanskrit.\n4. She reads a book.\n5. What do you see?\n\n---\n\n## Section C: Fill in the Blank\n\n1. aham pustakam **paṭhāmi**.\n2. tvam kutra **gacchasi**?\n3. saḥ jalam **pibati**.\n4. aham patram **likhāmi**.\n5. sā bhojanam **khādati**.\n\n---\n\n## Section D: Build a Mini-Dialogue — Sample Answers\n\n**Dialogue 1 (Two friends):**\n\nrāmaḥ: tvam kim karoṣi?\nkṛṣṇaḥ: aham pustakam paṭhāmi. tvam kim karoṣi?\nrāmaḥ: aham patram likhāmi. sītā kutra gacchati?\nkṛṣṇaḥ: sā vidyālayam gacchati.\n\n**Dialogue 2 (Parent and child):**\n\nmātā: tvam kim paśyasi?\nbālakaḥ: aham vṛkṣam paśyāmi.\nmātā: tvam kim khādasi?\nbālakaḥ: aham phalam khādāmi.\nmātā: tvam kutra gacchasi?\nbālakaḥ: aham vidyālayam gacchāmi.\n\n---\n\n## Section E: Free Response — Sample Answers\n\n**1. Typical morning:**\n\naham prātaḥ jalam pibāmi. aham bhojanam khādāmi. aham pustakam paṭhāmi. aham vidyālayam gacchāmi.\n\n**2. Family scene:**\n\nsaḥ pitā pustakam paṭhati. sā mātā bhojanam karoti. saḥ bhrātā jalam pibati. sā bhaginī patram likhati.\n"}, "tabs": ["theory", "workbook-questions", "workbook-answers"]}, {"id": "conv-06-past-future", "number": 6, "title": "Did & Will Do", "subtitle": "Past & future tense", "files": {"theory": "# Stage 6: Did & Will Do\n\n**Pattern Name:** aham X akārṣam / aham Y kariṣyāmi\n\n---\n\n## The Pattern\n\n| Sanskrit | IAST | Meaning |\n|----------|------|---------|\n| अहम् X अकार्षम् | aham X akārṣam | I did X |\n| अहम् Y करिष्यामि | aham Y kariṣyāmi | I will do Y |\n| किम् त्वम् Z अकार्षीः? | kim tvam Z akārṣīḥ? | Did you do Z? |\n\nYou already know present tense. Now you get two more gears: reverse (past) and forward (future). Same verbs, different endings.\n\n---\n\n## How It Works\n\n**Past tense (laṅ lakāra)** adds the prefix **a-** to the verb stem and changes the ending. For **karoti** (does): **akārṣam** (I did), **akārṣīḥ** (you did), **akārṣīt** (he/she did). For simpler verbs like **gacchati** (goes): **agaccham** (I went), **agacchaḥ** (you went), **agacchat** (he/she went).\n\n**Future tense (lṛṭ lakāra)** inserts **-iṣya-** or **-sya-** before the ending. For **karoti**: **kariṣyāmi** (I will do), **kariṣyasi** (you will do), **kariṣyati** (he/she will do). For **gacchati**: **gamiṣyāmi** (I will go), **gamiṣyasi** (you will go), **gamiṣyati** (he/she will go).\n\nHere are the key verbs in all three tenses:\n\n| Meaning | Present (I) | Past (I) | Future (I) |\n|---------|------------|----------|------------|\n| do | karomi | akārṣam | kariṣyāmi |\n| go | gacchāmi | agaccham | gamiṣyāmi |\n| read | paṭhāmi | apaṭham | paṭhiṣyāmi |\n| eat | khādāmi | akhādam | khādiṣyāmi |\n| drink | pibāmi | apibam | pāsyāmi |\n| write | likhāmi | alikham | lekhiṣyāmi |\n| speak | vadāmi | avadam | vadiṣyāmi |\n| see | paśyāmi | apaśyam | drakṣyāmi |\n\n---\n\n## Example Phrases\n\n1. अहम् भोजनम् अकार्षम्।\n   aham bhojanam akārṣam.\n   \"I made food.\" / \"I did (the) food.\"\n\n2. अहम् श्वः गमिष्यामि।\n   aham śvaḥ gamiṣyāmi.\n   \"I will go tomorrow.\"\n\n3. किम् त्वम् पुस्तकम् अपठः?\n   kim tvam pustakam apaṭhaḥ?\n   \"Did you read the book?\"\n\n4. सः ह्यः अगच्छत्।\n   saḥ hyaḥ agacchat.\n   \"He went yesterday.\"\n\n5. सा श्वः पठिष्यति।\n   sā śvaḥ paṭhiṣyati.\n   \"She will read tomorrow.\"\n\n6. अहम् पत्रम् अलिखम्।\n   aham patram alikham.\n   \"I wrote a letter.\"\n\n7. त्वम् किम् करिष्यसि?\n   tvam kim kariṣyasi?\n   \"What will you do?\"\n\n8. अहम् ह्यः जलम् अपिबम्।\n   aham hyaḥ jalam apibam.\n   \"I drank water yesterday.\"\n\n9. सः भोजनम् खादिष्यति।\n   saḥ bhojanam khādiṣyati.\n   \"He will eat food.\"\n\n10. किम् त्वम् तत् अपश्यः?\n    kim tvam tat apaśyaḥ?\n    \"Did you see that?\"\n\n---\n\n## Mini-Dialogue 1\n\n**रामः (rāmaḥ):** त्वम् ह्यः किम् अकार्षीः?\ntvam hyaḥ kim akārṣīḥ?\n\"What did you do yesterday?\"\n\n**सीता (sītā):** अहम् पुस्तकम् अपठम्। त्वम् किम् अकार्षीः?\naham pustakam apaṭham. tvam kim akārṣīḥ?\n\"I read a book. What did you do?\"\n\n**रामः:** अहम् पत्रम् अलिखम्।\naham patram alikham.\n\"I wrote a letter.\"\n\n**सीता:** श्वः किम् करिष्यसि?\nśvaḥ kim kariṣyasi?\n\"What will you do tomorrow?\"\n\n**रामः:** अहम् विद्यालयम् गमिष्यामि।\naham vidyālayam gamiṣyāmi.\n\"I will go to school.\"\n\n## Mini-Dialogue 2\n\n**माता (mātā):** किम् त्वम् भोजनम् अखादः?\nkim tvam bhojanam akhādaḥ?\n\"Did you eat food?\"\n\n**बालकः (bālakaḥ):** आम्, अहम् भोजनम् अखादम्।\nām, aham bhojanam akhādam.\n\"Yes, I ate food.\"\n\n**माता:** किम् त्वम् दुग्धम् अपिबः?\nkim tvam dugdham apibaḥ?\n\"Did you drink milk?\"\n\n**बालकः:** न! अहम् श्वः पास्यामि।\nna! aham śvaḥ pāsyāmi.\n\"No! I will drink (it) tomorrow.\"\n\n---\n\n## Variations\n\n1. **Time markers:** Use **hyaḥ** (yesterday), **adya** (today), **śvaḥ** (tomorrow), **prātaḥ** (in the morning), **sāyam** (in the evening) to anchor your sentences in time.\n\n2. **\"Just did\" with samprati:** **aham samprati āgaccham** = \"I just arrived.\" The word **samprati** (\"just now\") bridges present and past.\n\n3. **\"About to\" with the future:** The future tense can express immediate intention: **aham idānīm gacchāmi** (present = \"I'm going now\") vs. **aham idānīm gamiṣyāmi** (future = \"I'm about to go\").\n\n---\n\n## Common Mistakes\n\n1. **Forgetting the a- prefix in past tense.** Past tense verbs get the augment **a-** at the front: **agaccham**, not **gaccham**. Without it, you're back in present tense territory.\n\n2. **Mixing up past and future endings.** Past tense has short, clipped endings (**-am**, **-aḥ**, **-at**). Future tense has the **-iṣya-/-sya-** marker. If you hear that **-ṣya-** sound, it's future.\n", "workbook-questions": "# Stage 6: Did & Will Do — Workbook Questions\n\n**Total: 40 marks**\n\n---\n\n## Section A: Translate to Sanskrit (5 x 2 = 10 marks)\n\nWrite each sentence in IAST transliteration.\n\n1. I went yesterday.\n2. What will you do tomorrow?\n3. Did you read the book?\n4. She will go to school tomorrow.\n5. I wrote a letter.\n\n---\n\n## Section B: Translate to English (5 x 2 = 10 marks)\n\n1. aham bhojanam akhādam.\n2. saḥ hyaḥ agacchat.\n3. tvam kim kariṣyasi?\n4. sā śvaḥ paṭhiṣyati.\n5. kim tvam tat apaśyaḥ?\n\n---\n\n## Section C: Fill in the Blank (5 x 1 = 5 marks)\n\nChoose the correct verb form (past or future as indicated).\n\n1. aham hyaḥ vidyālayam ______. (I went to school yesterday.) [gacch-, past]\n2. sā śvaḥ pustakam ______. (She will read a book tomorrow.) [paṭh-, future]\n3. kim tvam bhojanam ______? (Did you eat food?) [khād-, past]\n4. aham śvaḥ patram ______. (I will write a letter tomorrow.) [likh-, future]\n5. saḥ jalam ______. (He drank water.) [pib-, past]\n\n---\n\n## Section D: Build a Mini-Dialogue (2 x 5 = 10 marks)\n\nWrite each dialogue in IAST transliteration (3-4 lines each).\n\n1. **Prompt:** Two friends discuss what they did yesterday and what they will do tomorrow. Use at least two past tense and two future tense verbs. Include time markers (**hyaḥ**, **śvaḥ**).\n\n2. **Prompt:** A parent asks a child whether they completed various tasks (eating, reading, writing). The child answers some with \"yes, I did\" and one with \"no, I will do it tomorrow.\" Use the **kim tvam ... ?** question pattern.\n\n---\n\n## Section E: Free Response (2 x 2.5 = 5 marks)\n\n1. Write about your yesterday in four sentences using past tense, then about your tomorrow in four sentences using future tense.\n\n2. Write a short scene (4-5 lines) where someone recounts an exciting day they had, using at least four different past tense verbs.\n", "workbook-answers": "# Stage 6: Did & Will Do — Workbook Answers\n\n---\n\n## Section A: Translate to Sanskrit\n\n1. aham hyaḥ agaccham.\n2. tvam śvaḥ kim kariṣyasi?\n3. kim tvam pustakam apaṭhaḥ?\n4. sā śvaḥ vidyālayam gamiṣyati.\n5. aham patram alikham.\n\n---\n\n## Section B: Translate to English\n\n1. I ate food.\n2. He went yesterday.\n3. What will you do?\n4. She will read tomorrow.\n5. Did you see that?\n\n---\n\n## Section C: Fill in the Blank\n\n1. aham hyaḥ vidyālayam **agaccham**.\n2. sā śvaḥ pustakam **paṭhiṣyati**.\n3. kim tvam bhojanam **akhādaḥ**?\n4. aham śvaḥ patram **lekhiṣyāmi**.\n5. saḥ jalam **apibat**.\n\n---\n\n## Section D: Build a Mini-Dialogue — Sample Answers\n\n**Dialogue 1 (Friends discussing yesterday and tomorrow):**\n\nrāmaḥ: tvam hyaḥ kim akārṣīḥ?\nsītā: aham hyaḥ pustakam apaṭham. tvam?\nrāmaḥ: aham patram alikham. śvaḥ kim kariṣyasi?\nsītā: aham śvaḥ vidyālayam gamiṣyāmi.\nrāmaḥ: aham api gamiṣyāmi.\n\n**Dialogue 2 (Parent checking on tasks):**\n\nmātā: kim tvam bhojanam akhādaḥ?\nbālakaḥ: ām, aham bhojanam akhādam.\nmātā: kim tvam pustakam apaṭhaḥ?\nbālakaḥ: ām, aham pustakam apaṭham.\nmātā: kim tvam patram alikhaḥ?\nbālakaḥ: na, aham śvaḥ lekhiṣyāmi.\n\n---\n\n## Section E: Free Response — Sample Answers\n\n**1. Yesterday and tomorrow:**\n\nhyaḥ aham prātaḥ agaccham. aham pustakam apaṭham. aham bhojanam akhādam. aham patram alikham.\nśvaḥ aham vidyālayam gamiṣyāmi. aham saṃskṛtam paṭhiṣyāmi. aham bhojanam kariṣyāmi. aham patram lekhiṣyāmi.\n\n**2. Exciting day:**\n\nrāmaḥ: aham hyaḥ prātaḥ agaccham. aham nagaram apaśyam. aham bhojanam akhādam. aham bahūni janān avadam. aham sāyam gṛham agaccham.\n"}, "tabs": ["theory", "workbook-questions", "workbook-answers"]}, {"id": "conv-07-having", "number": 7, "title": "Having & Existing", "subtitle": "mama asti, atra asti", "files": {"theory": "# Stage 7: Having & Existing\n\n## The Pattern\n\n**mama X asti** — \"I have X\"\n\n| Sanskrit | IAST | Meaning |\n|----------|------|---------|\n| मम X अस्ति | mama X asti | I have X |\n| तव किम् अस्ति? | tava kim asti? | Do you have (something)? |\n| अत्र X अस्ति | atra X asti | There is X here |\n| न अस्ति | na asti | There isn't / I don't have |\n\n---\n\n## How It Works\n\nSanskrit doesn't have a verb for \"have.\" Instead, you say something *belongs to* someone and *exists*. So \"I have a book\" becomes \"Of-me a book exists\" — **mama pustakam asti**. The \"of-me\" part uses what grammarians call the genitive case, but you already know these words: **mama** (my/of me), **tava** (your/of you), **tasya** (his/of him), **tasyāḥ** (her/of her).\n\nTo say something exists in a place, just swap the person for a location word: **atra** (here), **tatra** (there). So **atra jalam asti** = \"there is water here.\" Negate with **na** before **asti**: **mama dhanaṃ na asti** = \"I don't have money.\"\n\n---\n\n## Example Phrases\n\n1. मम पुस्तकम् अस्ति।\n   mama pustakam asti.\n   *I have a book.*\n\n2. तव गृहम् अस्ति वा?\n   tava gṛham asti vā?\n   *Do you have a house?*\n\n3. अत्र जलम् अस्ति।\n   atra jalam asti.\n   *There is water here.*\n\n4. तत्र फलानि सन्ति।\n   tatra phalāni santi.\n   *There are fruits there.*\n\n5. मम समयः न अस्ति।\n   mama samayaḥ na asti.\n   *I don't have time.*\n\n6. तस्य धनम् अस्ति।\n   tasya dhanam asti.\n   *He has money.*\n\n7. तस्याः द्वे पुस्तके स्तः।\n   tasyāḥ dve pustake staḥ.\n   *She has two books.*\n\n8. अत्र किम् अस्ति?\n   atra kim asti?\n   *What is here?*\n\n9. मम मित्रम् अत्र अस्ति।\n   mama mitram atra asti.\n   *My friend is here.*\n\n10. तव दुग्धम् अस्ति वा?\n    tava dugdham asti vā?\n    *Do you have milk?*\n\n---\n\n## Mini-Dialogue 1\n\n> **अ:** तव जलम् अस्ति वा?\n> A: tava jalam asti vā?\n> *Do you have water?*\n\n> **ब:** आम्, मम जलम् अस्ति। तव?\n> B: ām, mama jalam asti. tava?\n> *Yes, I have water. You?*\n\n> **अ:** मम जलम् न अस्ति।\n> A: mama jalam na asti.\n> *I don't have water.*\n\n> **ब:** एतत् गृहाण!\n> B: etat gṛhāṇa!\n> *Take this!*\n\n## Mini-Dialogue 2\n\n> **अ:** अत्र किम् अस्ति?\n> A: atra kim asti?\n> *What is here?*\n\n> **ब:** अत्र फलानि सन्ति, दुग्धम् अस्ति च।\n> B: atra phalāni santi, dugdham asti ca.\n> *There are fruits and there is milk here.*\n\n> **अ:** उत्तमम्! मम क्षुधा अस्ति।\n> A: uttamam! mama kṣudhā asti.\n> *Excellent! I'm hungry. (lit. I have hunger.)*\n\n---\n\n## Variations\n\n1. **mama X nāsti** — Contracted form of *na asti*. Very common in speech: मम समयः नास्ति (mama samayaḥ nāsti) — \"I don't have time.\"\n\n2. **mama X asti, tava tu na asti** — Contrasting possession: \"I have X, but you don't.\" The word **tu** means \"but.\"\n\n3. **kasya X asti?** — \"Who has X?\" Uses the genitive interrogative *kasya* (of whom).\n\n---\n\n## Common Mistakes\n\n1. **Word order trap:** Don't put *asti* first. While Sanskrit word order is flexible, *mama pustakam asti* sounds natural; *asti mama pustakam* sounds like a Vedic chant. Keep *asti* at the end.\n\n2. **Forgetting santi for plurals:** When the thing you \"have\" is plural, *asti* becomes **santi**. One book = *pustakam asti*. Many books = *pustakāni santi*.\n", "workbook-questions": "# Stage 7: Having & Existing — Workbook\n\n## Section A: Translate to Sanskrit (10 marks)\n*Use the mama X asti pattern. Write in IAST.*\n\n1. I have a book.\n2. Do you have water?\n3. There are fruits here.\n4. He does not have time.\n5. Who has money?\n\n## Section B: Translate to English (10 marks)\n\n1. mama mitram atra asti.\n2. tava dugdham asti vā?\n3. tatra phalāni santi.\n4. tasyāḥ gṛham na asti.\n5. atra kim asti?\n\n## Section C: Fill in the Blank (10 marks)\n*Fill in the missing word.*\n\n1. ______ pustakam asti. (I have a book.)\n2. tava jalam ______ vā? (Do you have water?)\n3. atra phalāni ______. (There are fruits here.)\n4. mama samayaḥ ______ asti. (I don't have time.)\n5. ______ dhanam asti? (Who has money?)\n\n## Section D: Build a Mini-Dialogue (6 marks)\n*Write a 3-4 line dialogue in IAST for each prompt.*\n\n1. You are at a shop. Ask the shopkeeper if they have milk. The shopkeeper says yes. You ask if they also have fruits.\n\n2. A friend asks what you have in your bag. You say you have two books and water. Your friend says they have nothing.\n\n## Section E: Free Response (4 marks)\n\n1. Describe a room using atra X asti / atra X santi patterns (3-4 sentences in IAST).\n\n2. Write about what you have and don't have — possessions, time, friends, anything (3-4 sentences in IAST).\n", "workbook-answers": "# Stage 7: Having & Existing — Answer Key\n\n## Section A: Translate to Sanskrit (10 marks)\n\n1. mama pustakam asti.\n2. tava jalam asti vā?\n3. atra phalāni santi.\n4. tasya samayaḥ na asti.\n5. kasya dhanam asti?\n\n## Section B: Translate to English (10 marks)\n\n1. My friend is here.\n2. Do you have milk?\n3. There are fruits there.\n4. She does not have a house.\n5. What is here?\n\n## Section C: Fill in the Blank (10 marks)\n\n1. **mama** pustakam asti.\n2. tava jalam **asti** vā?\n3. atra phalāni **santi**.\n4. mama samayaḥ **na** asti.\n5. **kasya** dhanam asti?\n\n## Section D: Build a Mini-Dialogue (6 marks)\n\n### Dialogue 1 (sample)\n> A: tava dugdham asti vā?\n> B: ām, mama dugdham asti.\n> A: phalāni api santi vā?\n> B: ām, atra phalāni api santi.\n\n### Dialogue 2 (sample)\n> A: tava syūte kim asti?\n> B: mama dve pustake staḥ, jalam ca asti.\n> A: mama kiñcit na asti.\n> B: etat gṛhāṇa — ekaṃ pustakam tava.\n\n## Section E: Free Response (4 marks)\n\n### Sample 1\natra ekaṃ gṛham asti. atra dve pustake staḥ. atra jalam asti. atra phalāni na santi.\n\n### Sample 2\nmama pustakam asti. mama mitrāṇi santi. mama samayaḥ na asti. mama dhanam api na asti!\n"}, "tabs": ["theory", "workbook-questions", "workbook-answers"]}, {"id": "conv-08-going-coming", "number": 8, "title": "Going & Coming", "subtitle": "gacchāmi, āgaccha", "files": {"theory": "# Stage 8: Going & Coming\n\n## The Pattern\n\n**aham tatra gacchāmi** — \"I'm going there\"\n\n| Sanskrit | IAST | Meaning |\n|----------|------|---------|\n| अहम् तत्र गच्छामि | aham tatra gacchāmi | I'm going there |\n| अत्र आगच्छ | atra āgaccha | Come here |\n| आवां गच्छावः | āvāṃ gacchāvaḥ | Let's go (us two) |\n| वयम् गच्छामः | vayam gacchāmaḥ | Let's go (us all) |\n\n---\n\n## How It Works\n\nThe root **gam** (to go) and **āgam** (to come) are your movement verbs. \"Come\" is literally \"come-toward\" — the **ā-** prefix flips direction. You already know **atra** (here) and **tatra** (there); add **kutra** (where?) and you can navigate anywhere.\n\nHere's the key conjugation of **gam** you need: **gacchāmi** (I go), **gacchasi** (you go), **gacchati** (he/she goes), **gacchāvaḥ** (we two go), **gacchāmaḥ** (we all go). The dual form **gacchāvaḥ** is perfect for \"let's go\" when you're talking to one person. When there's a group, use **gacchāmaḥ**. The imperative \"go!\" is **gaccha**, and \"come!\" is **āgaccha**.\n\n---\n\n## Example Phrases\n\n1. अहम् गृहं गच्छामि।\n   aham gṛhaṃ gacchāmi.\n   *I'm going home.*\n\n2. त्वम् कुत्र गच्छसि?\n   tvam kutra gacchasi?\n   *Where are you going?*\n\n3. सः आपणं गच्छति।\n   saḥ āpaṇaṃ gacchati.\n   *He is going to the shop.*\n\n4. अत्र आगच्छ!\n   atra āgaccha!\n   *Come here!*\n\n5. आवां तत्र गच्छावः।\n   āvāṃ tatra gacchāvaḥ.\n   *Let's go there (us two).*\n\n6. वयम् उद्यानं गच्छामः।\n   vayam udyānaṃ gacchāmaḥ.\n   *Let's go to the garden.*\n\n7. सा कुत्र गच्छति?\n   sā kutra gacchati?\n   *Where is she going?*\n\n8. अहम् तत्र न गच्छामि।\n   aham tatra na gacchāmi.\n   *I'm not going there.*\n\n9. शीघ्रम् आगच्छ!\n   śīghram āgaccha!\n   *Come quickly!*\n\n10. अत्र आगच्छतु।\n    atra āgacchatu.\n    *Let him/her come here.* (polite)\n\n---\n\n## Mini-Dialogue 1\n\n> **अ:** त्वम् कुत्र गच्छसि?\n> A: tvam kutra gacchasi?\n> *Where are you going?*\n\n> **ब:** अहम् आपणं गच्छामि। त्वम् आगच्छसि वा?\n> B: aham āpaṇaṃ gacchāmi. tvam āgacchasi vā?\n> *I'm going to the shop. Are you coming?*\n\n> **अ:** आम्, आवां गच्छावः!\n> A: ām, āvāṃ gacchāvaḥ!\n> *Yes, let's go (the two of us)!*\n\n## Mini-Dialogue 2\n\n> **अ:** सीता कुत्र गच्छति?\n> A: sītā kutra gacchati?\n> *Where is Sita going?*\n\n> **ब:** सा गृहं गच्छति।\n> B: sā gṛhaṃ gacchati.\n> *She's going home.*\n\n> **अ:** अहम् अपि गृहं गच्छामि। वयं सर्वे गच्छामः!\n> A: aham api gṛhaṃ gacchāmi. vayaṃ sarve gacchāmaḥ!\n> *I'm also going home. Let's all go!*\n\n---\n\n## Variations\n\n1. **gacchatu / āgacchatu** — The polite imperative (\"please go\" / \"please come\"). Use this with elders or strangers instead of the blunt *gaccha*.\n\n2. **saḥ āgacchati** — \"He is coming.\" You can use *āgam* in regular present tense, not just as a command. *sā āgacchati* = \"She is coming.\"\n\n3. **kutra gantavyam?** — \"Where should one go?\" This uses the future passive participle for a \"should/must\" sense. A handy one-liner for asking directions.\n\n---\n\n## Common Mistakes\n\n1. **gacchāmi vs. gacchāmaḥ:** Don't mix up \"I go\" (*gacchāmi* — just me) with \"we go\" (*gacchāmaḥ* — all of us). That final **-aḥ** makes it plural.\n\n2. **āgaccha means \"come,\" not \"go\":** The prefix **ā-** reverses direction. *gaccha* = go away from me; *āgaccha* = come toward me. If you tell someone *gaccha* when you mean \"come here,\" you're sending them away!\n", "workbook-questions": "# Stage 8: Going & Coming — Workbook\n\n## Section A: Translate to Sanskrit (10 marks)\n*Write in IAST.*\n\n1. I am going to the garden.\n2. Where are you going?\n3. Come here quickly!\n4. Let's go there (just us two).\n5. She is not coming.\n\n## Section B: Translate to English (10 marks)\n\n1. aham āpaṇaṃ gacchāmi.\n2. tvam kutra gacchasi?\n3. vayam udyānaṃ gacchāmaḥ.\n4. śīghram āgaccha!\n5. saḥ gṛhaṃ gacchati.\n\n## Section C: Fill in the Blank (10 marks)\n*Fill in the missing word.*\n\n1. aham tatra ______. (I am going there.)\n2. tvam ______ gacchasi? (Where are you going?)\n3. atra ______! (Come here!)\n4. āvāṃ tatra ______. (Let's go there — dual.)\n5. sā gṛhaṃ ______. (She is going home.)\n\n## Section D: Build a Mini-Dialogue (6 marks)\n*Write a 3-4 line dialogue in IAST for each prompt.*\n\n1. You ask a friend where they are going. They say the shop. You say \"let's go together\" (use dual).\n\n2. Someone calls you to come quickly. You ask where. They say \"to the garden.\" You agree and say you're coming.\n\n## Section E: Free Response (4 marks)\n\n1. Describe the movements of three different people — where each is going (3-4 sentences in IAST).\n\n2. Write a short invitation asking someone to come to your house, using āgaccha/āgacchatu and location words (3-4 sentences in IAST).\n", "workbook-answers": "# Stage 8: Going & Coming — Answer Key\n\n## Section A: Translate to Sanskrit (10 marks)\n\n1. aham udyānaṃ gacchāmi.\n2. tvam kutra gacchasi?\n3. atra śīghram āgaccha!\n4. āvāṃ tatra gacchāvaḥ.\n5. sā na āgacchati.\n\n## Section B: Translate to English (10 marks)\n\n1. I am going to the shop.\n2. Where are you going?\n3. Let's go to the garden (all of us).\n4. Come quickly!\n5. He is going home.\n\n## Section C: Fill in the Blank (10 marks)\n\n1. aham tatra **gacchāmi**.\n2. tvam **kutra** gacchasi?\n3. atra **āgaccha**!\n4. āvāṃ tatra **gacchāvaḥ**.\n5. sā gṛhaṃ **gacchati**.\n\n## Section D: Build a Mini-Dialogue (6 marks)\n\n### Dialogue 1 (sample)\n> A: tvam kutra gacchasi?\n> B: aham āpaṇaṃ gacchāmi.\n> A: āvāṃ gacchāvaḥ!\n> B: ām, āgaccha!\n\n### Dialogue 2 (sample)\n> A: śīghram āgaccha!\n> B: kutra?\n> A: udyānaṃ gacchāvaḥ.\n> B: samyak, aham āgacchāmi.\n\n## Section E: Free Response (4 marks)\n\n### Sample 1\nrāmaḥ āpaṇaṃ gacchati. sītā udyānaṃ gacchati. aham gṛhaṃ gacchāmi. sarve bhinnāṃ diśāṃ gacchanti!\n\n### Sample 2\nmama gṛham āgacchatu. tatra phālani santi, dugdham asti ca. āvāṃ tatra upaviśāvaḥ. śīghram āgaccha!\n"}, "tabs": ["theory", "workbook-questions", "workbook-answers"]}, {"id": "conv-09-give-take", "number": 9, "title": "Give & Take", "subtitle": "dehi, gṛhāṇa", "files": {"theory": "# Stage 9: Give & Take\n\n## The Pattern\n\n**mahyam X dehi** — \"Give me X\"\n\n| Sanskrit | IAST | Meaning |\n|----------|------|---------|\n| मह्यम् X देहि | mahyam X dehi | Give me X |\n| तुभ्यम् Y ददामि | tubhyam Y dadāmi | I give you Y |\n| एतत् गृहाण | etat gṛhāṇa | Take this |\n| किम् ददामि? | kim dadāmi? | What shall I give? |\n\n---\n\n## How It Works\n\nWhen you give something, two things matter: *what* you're giving and *to whom*. The \"to whom\" part uses the dative case — the \"for/to\" form. You only need a few: **mahyam** (to me), **tubhyam** (to you), **tasmai** (to him), **tasyai** (to her). These are the dative forms of the pronouns you already know.\n\nThe verb **dā** (to give) has a distinctive conjugation: **dadāmi** (I give), **dadāsi** (you give), **dadāti** (he/she gives). The imperative \"give!\" is **dehi** (casual) or **dadātu** (polite). For \"take,\" use the root **grah**: the imperative is **gṛhāṇa** (take!). Between *dehi* and *gṛhāṇa*, you can handle every exchange from chai stalls to gift-giving.\n\n---\n\n## Example Phrases\n\n1. मह्यम् जलं देहि।\n   mahyam jalaṃ dehi.\n   *Give me water.*\n\n2. तुभ्यम् एतत् पुस्तकं ददामि।\n   tubhyam etat pustakaṃ dadāmi.\n   *I give you this book.*\n\n3. एतत् फलं गृहाण।\n   etat phalaṃ gṛhāṇa.\n   *Take this fruit.*\n\n4. तस्मै धनं देहि।\n   tasmai dhanaṃ dehi.\n   *Give him money.*\n\n5. मह्यम् एकं चायं देहि।\n   mahyam ekaṃ cāyaṃ dehi.\n   *Give me one tea.*\n\n6. अहं तुभ्यं किं ददामि?\n   ahaṃ tubhyaṃ kiṃ dadāmi?\n   *What shall I give you?*\n\n7. तस्यै पुष्पं ददातु।\n   tasyai puṣpaṃ dadātu.\n   *Please give her a flower.*\n\n8. मह्यम् समयं देहि।\n   mahyam samayaṃ dehi.\n   *Give me time.*\n\n9. एतत् सर्वं गृहाण।\n   etat sarvaṃ gṛhāṇa.\n   *Take all of this.*\n\n10. तुभ्यम् किम् आवश्यकम्?\n    tubhyam kim āvaśyakam?\n    *What do you need? (What is necessary for you?)*\n\n---\n\n## Mini-Dialogue 1\n\n> **अ:** मह्यम् एकं चायं देहि।\n> A: mahyam ekaṃ cāyaṃ dehi.\n> *Give me one tea.*\n\n> **ब:** एतत् गृहाण। दशरूप्यकाणि देहि।\n> B: etat gṛhāṇa. daśarūpyakāṇi dehi.\n> *Take this. Give ten rupees.*\n\n> **अ:** एतत् गृहाण।\n> A: etat gṛhāṇa.\n> *Here, take this.*\n\n## Mini-Dialogue 2\n\n> **अ:** तुभ्यम् किं ददामि?\n> A: tubhyam kiṃ dadāmi?\n> *What shall I give you?*\n\n> **ब:** मह्यम् एकं फलं देहि।\n> B: mahyam ekaṃ phalaṃ dehi.\n> *Give me one fruit.*\n\n> **अ:** एतत् आम्रं गृहाण।\n> A: etat āmraṃ gṛhāṇa.\n> *Take this mango.*\n\n> **ब:** धन्यवादः!\n> B: dhanyavādaḥ!\n> *Thank you!*\n\n---\n\n## Variations\n\n1. **mahyam X dadātu** — Polite form: \"Please give me X.\" Use *dadātu* instead of *dehi* when speaking to elders, strangers, or anyone you want to be respectful toward.\n\n2. **X yaccha** — Another word for \"give\" from the root *yam*. The imperative *yaccha* is common in classical texts. *mahyam jalaṃ yaccha* = \"hand me water.\"\n\n3. **kim dadāmi? / kim dehi?** — Useful pair. \"What shall I give?\" (offering) vs. \"What do you want?\" (asking what they need).\n\n---\n\n## Common Mistakes\n\n1. **mahyam vs. mama:** Both mean \"me\" but in different cases. *mama* = \"of me\" (possession). *mahyam* = \"to/for me\" (giving). \"I have a book\" = *mama pustakam asti*. \"Give me a book\" = *mahyam pustakaṃ dehi*. Don't swap them.\n\n2. **dehi is casual:** Using *dehi* with a teacher or elder sounds rude — like barking \"give!\" Use *dadātu* (please give) for politeness.\n", "workbook-questions": "# Stage 9: Give & Take — Workbook\n\n## Section A: Translate to Sanskrit (10 marks)\n*Write in IAST.*\n\n1. Give me water.\n2. I give you this fruit.\n3. Take this book.\n4. Please give her a flower. (polite)\n5. What shall I give you?\n\n## Section B: Translate to English (10 marks)\n\n1. mahyam ekaṃ cāyaṃ dehi.\n2. tubhyam etat pustakaṃ dadāmi.\n3. tasmai dhanaṃ dehi.\n4. etat sarvaṃ gṛhāṇa.\n5. tasyai puṣpaṃ dadātu.\n\n## Section C: Fill in the Blank (10 marks)\n*Fill in the missing word.*\n\n1. ______ jalaṃ dehi. (Give me water.)\n2. tubhyam etat phalaṃ ______. (I give you this fruit.)\n3. etat pustakaṃ ______. (Take this book.)\n4. ______ dhanaṃ dehi. (Give him money.)\n5. ahaṃ tubhyaṃ kiṃ ______? (What shall I give you?)\n\n## Section D: Build a Mini-Dialogue (6 marks)\n*Write a 3-4 line dialogue in IAST for each prompt.*\n\n1. You are at a tea stall. Order tea, receive it, and pay. Use dehi, gṛhāṇa, and the dative.\n\n2. A friend's birthday: you offer a gift (\"what shall I give you?\"), they ask for a book, you hand it to them with gṛhāṇa.\n\n## Section E: Free Response (4 marks)\n\n1. Describe a market scene where two people exchange items — use at least three give/take phrases (3-4 sentences in IAST).\n\n2. Write a polite request to a teacher for something you need, using dadātu (3-4 sentences in IAST).\n", "workbook-answers": "# Stage 9: Give & Take — Answer Key\n\n## Section A: Translate to Sanskrit (10 marks)\n\n1. mahyam jalaṃ dehi.\n2. tubhyam etat phalaṃ dadāmi.\n3. etat pustakaṃ gṛhāṇa.\n4. tasyai puṣpaṃ dadātu.\n5. tubhyam kiṃ dadāmi?\n\n## Section B: Translate to English (10 marks)\n\n1. Give me one tea.\n2. I give you this book.\n3. Give him money.\n4. Take all of this.\n5. Please give her a flower.\n\n## Section C: Fill in the Blank (10 marks)\n\n1. **mahyam** jalaṃ dehi.\n2. tubhyam etat phalaṃ **dadāmi**.\n3. etat pustakaṃ **gṛhāṇa**.\n4. **tasmai** dhanaṃ dehi.\n5. ahaṃ tubhyaṃ kiṃ **dadāmi**?\n\n## Section D: Build a Mini-Dialogue (6 marks)\n\n### Dialogue 1 (sample)\n> A: mahyam ekaṃ cāyaṃ dehi.\n> B: etat gṛhāṇa. pañcarūpyakāṇi dehi.\n> A: etat gṛhāṇa. dhanyavādaḥ!\n> B: svāgatam.\n\n### Dialogue 2 (sample)\n> A: adya tava janmadinam! tubhyam kiṃ dadāmi?\n> B: mahyam ekaṃ pustakaṃ dehi.\n> A: etat pustakaṃ gṛhāṇa. janmadinaśubhāśayāḥ!\n> B: dhanyavādaḥ!\n\n## Section E: Free Response (4 marks)\n\n### Sample 1\nāpaṇe ekaḥ janaḥ vadati — \"mahyam phalāni dehi.\" āpaṇikaḥ vadati — \"etat gṛhāṇa. viṃśatirūpyakāṇi dehi.\" janaḥ dhanaṃ dadāti. āpaṇikaḥ vadati — \"dhanyavādaḥ!\"\n\n### Sample 2\nācārya, mahyam ekaṃ pustakaṃ dadātu. saṃskṛtasya pustakam āvaśyakam. mama pustakam na asti. kṛpayā dadātu.\n"}, "tabs": ["theory", "workbook-questions", "workbook-answers"]}, {"id": "conv-10-likes", "number": 10, "title": "Likes & Preferences", "subtitle": "rocate, priyam", "files": {"theory": "# Stage 10: Likes & Preferences\n\n## The Pattern\n\n**mama X rocate** — \"I like X\" (literally: \"X pleases me\")\n\n| Sanskrit | IAST | Meaning |\n|----------|------|---------|\n| मम X रोचते | mama X rocate | I like X |\n| मम X प्रियम् | mama X priyam | X is dear to me |\n| मम X न रोचते | mama X na rocate | I don't like X |\n| तव किं रोचते? | tava kiṃ rocate? | What do you like? |\n\n---\n\n## How It Works\n\nSanskrit flips the \"like\" construction compared to English. You don't \"like\" something — rather, something \"pleases\" you. So \"I like fruit\" is literally \"of-me fruit pleases\" — **mama phalaṃ rocate**. The subject is the thing liked, not the person. This is why *rocate* stays the same regardless of who's doing the liking — it agrees with the thing, not you.\n\nFor a simpler alternative, use **priyam** (dear/beloved): **mama phalaṃ priyam** = \"fruit is dear to me\" = \"I like fruit.\" This is an easy, elegant way to express preference. To negate, just drop in **na**: **mama phalaṃ na rocate** = \"I don't like fruit.\"\n\n---\n\n## Example Phrases\n\n1. मम फलं रोचते।\n   mama phalaṃ rocate.\n   *I like fruit.*\n\n2. तव किं रोचते?\n   tava kiṃ rocate?\n   *What do you like?*\n\n3. मम संगीतं प्रियम्।\n   mama saṃgītaṃ priyam.\n   *Music is dear to me. / I love music.*\n\n4. मम दुग्धं न रोचते।\n   mama dugdhaṃ na rocate.\n   *I don't like milk.*\n\n5. तस्य क्रीडा रोचते।\n   tasya krīḍā rocate.\n   *He likes sports/games.*\n\n6. तस्याः पुष्पाणि प्रियाणि।\n   tasyāḥ puṣpāṇi priyāṇi.\n   *She likes flowers. (Flowers are dear to her.)*\n\n7. मम चायः अत्यन्तं रोचते।\n   mama cāyaḥ atyantaṃ rocate.\n   *I like tea very much.*\n\n8. तव कः आहारः रोचते?\n   tava kaḥ āhāraḥ rocate?\n   *What food do you like?*\n\n9. मम एतत् नगरं न रोचते।\n   mama etat nagaraṃ na rocate.\n   *I don't like this city.*\n\n10. मम वर्षाकालः प्रियः।\n    mama varṣākālaḥ priyaḥ.\n    *I like the rainy season. (The rainy season is dear to me.)*\n\n---\n\n## Mini-Dialogue 1\n\n> **अ:** तव किं रोचते — चायः वा काफी वा?\n> A: tava kiṃ rocate — cāyaḥ vā kāphī vā?\n> *What do you like — tea or coffee?*\n\n> **ब:** मम चायः रोचते। तव?\n> B: mama cāyaḥ rocate. tava?\n> *I like tea. You?*\n\n> **अ:** मम काफी प्रिया। चायः न रोचते।\n> A: mama kāphī priyā. cāyaḥ na rocate.\n> *Coffee is dear to me. I don't like tea.*\n\n## Mini-Dialogue 2\n\n> **अ:** तव एतत् भोजनं रोचते वा?\n> A: tava etat bhojanaṃ rocate vā?\n> *Do you like this food?*\n\n> **ब:** आम्, अत्यन्तं रोचते! एतत् मिष्टान्नं प्रियम्।\n> B: ām, atyantaṃ rocate! etat miṣṭānnaṃ priyam.\n> *Yes, I like it very much! This dessert is dear to me.*\n\n> **अ:** मम अपि! एतत् उत्तमम्।\n> A: mama api! etat uttamam.\n> *Mine too! This is excellent.*\n\n---\n\n## Variations\n\n1. **mama X iṣṭam** — Another way to say \"I like X.\" *iṣṭam* means \"desired/wished for.\" mama phalam iṣṭam = \"fruit is desired by me\" = \"I like fruit.\"\n\n2. **mama X atīva rocate** — \"I really like X.\" The word **atīva** or **atyantam** intensifies the liking. mama saṃgītam atīva rocate = \"I really like music.\"\n\n3. **mama X na priyam, Y priyam** — Contrasting preferences: \"I don't like X, I like Y.\" mama dugdhaṃ na priyam, cāyaḥ priyaḥ = \"I don't like milk, I like tea.\"\n\n---\n\n## Common Mistakes\n\n1. **The subject trap:** In *mama phalaṃ rocate*, the subject is *phalam* (fruit), not \"I.\" So if you like multiple things, the verb changes: *mama phalāni rocante* (I like fruits — plural verb). The verb agrees with the thing liked.\n\n2. **priyam must match gender:** When using *priyam*, it must agree with the noun. Masculine: *priyaḥ* (mama cāyaḥ priyaḥ). Feminine: *priyā* (mama kāphī priyā). Neuter: *priyam* (mama phalaṃ priyam). If in doubt, use *rocate* instead — it's simpler.\n", "workbook-questions": "# Stage 10: Likes & Preferences — Workbook\n\n## Section A: Translate to Sanskrit (10 marks)\n*Write in IAST.*\n\n1. I like music.\n2. What do you like?\n3. She doesn't like milk.\n4. Flowers are dear to him.\n5. I like tea very much.\n\n## Section B: Translate to English (10 marks)\n\n1. mama phalaṃ rocate.\n2. tava kiṃ rocate?\n3. tasya krīḍā rocate.\n4. mama cāyaḥ priyaḥ.\n5. mama etat bhojanaṃ na rocate.\n\n## Section C: Fill in the Blank (10 marks)\n*Fill in the missing word.*\n\n1. mama saṃgītaṃ ______. (I like music.)\n2. tava kiṃ ______? (What do you like?)\n3. mama dugdhaṃ ______ rocate. (I don't like milk.)\n4. tasyāḥ puṣpāṇi ______. (Flowers are dear to her.)\n5. mama cāyaḥ ______ rocate. (I like tea very much.)\n\n## Section D: Build a Mini-Dialogue (6 marks)\n*Write a 3-4 line dialogue in IAST for each prompt.*\n\n1. Two friends discuss food preferences — one likes sweets, the other doesn't. Use rocate and na rocate.\n\n2. Someone asks what you like. You name two things you like and one you don't. Use both rocate and priyam.\n\n## Sect
