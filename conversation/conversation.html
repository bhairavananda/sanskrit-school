ion E: Free Response (4 marks)\n\n1. List four things you like and two you don't, using rocate and/or priyam (4-5 sentences in IAST).\n\n2. Describe the preferences of two different people — what each likes and dislikes (3-4 sentences in IAST).\n", "workbook-answers": "# Stage 10: Likes & Preferences — Answer Key\n\n## Section A: Translate to Sanskrit (10 marks)\n\n1. mama saṃgītaṃ rocate.\n2. tava kiṃ rocate?\n3. tasyāḥ dugdhaṃ na rocate.\n4. tasya puṣpāṇi priyāṇi.\n5. mama cāyaḥ atyantaṃ rocate.\n\n## Section B: Translate to English (10 marks)\n\n1. I like fruit.\n2. What do you like?\n3. He likes sports/games.\n4. Tea is dear to me. / I like tea.\n5. I don't like this food.\n\n## Section C: Fill in the Blank (10 marks)\n\n1. mama saṃgītaṃ **rocate**.\n2. tava kiṃ **rocate**?\n3. mama dugdhaṃ **na** rocate.\n4. tasyāḥ puṣpāṇi **priyāṇi**.\n5. mama cāyaḥ **atyantaṃ** rocate.\n\n## Section D: Build a Mini-Dialogue (6 marks)\n\n### Dialogue 1 (sample)\n> A: tava miṣṭānnaṃ rocate vā?\n> B: ām, mama miṣṭānnaṃ atyantaṃ rocate! tava?\n> A: mama miṣṭānnaṃ na rocate. mama phalāni rocante.\n> B: phalāni api uttamāni!\n\n### Dialogue 2 (sample)\n> A: tava kiṃ rocate?\n> B: mama saṃgītaṃ rocate, puṣpāṇi ca priyāṇi. mama dugdhaṃ na rocate.\n> A: mama api saṃgītaṃ priyam!\n\n## Section E: Free Response (4 marks)\n\n### Sample 1\nmama saṃgītaṃ rocate. mama phalāni priyāṇi. mama pustakāni rocante. mama krīḍā rocate. mama dugdhaṃ na rocate. mama nagarasya kalaśoraḥ na rocate.\n\n### Sample 2\nrāmasya krīḍā rocate. tasya phalāni priyāṇi. sītāyāḥ saṃgītaṃ rocate. tasyāḥ puṣpāṇi priyāṇi. rāmasya saṃgītaṃ na rocate. sītāyāḥ krīḍā na rocate.\n"}, "tabs": ["theory", "workbook-questions", "workbook-answers"]}, {"id": "conv-11-knowing", "number": 11, "title": "Knowing & Not Knowing", "subtitle": "jānāmi, na jānāmi", "files": {"theory": "# Stage 11: Knowing & Not Knowing\n\n## The Pattern\n\n**aham jānāmi** — \"I know\"\n\n| Sanskrit | IAST | Meaning |\n|----------|------|---------|\n| अहं जानामि | ahaṃ jānāmi | I know |\n| अहं न जानामि | ahaṃ na jānāmi | I don't know |\n| किं त्वं जानासि? | kiṃ tvaṃ jānāsi? | Do you know? |\n| मम न ज्ञातम् | mama na jñātam | I didn't know that |\n\n---\n\n## How It Works\n\nThe root **jñā** (to know) gives you one of the most useful verbs in any language. Its present tense forms: **jānāmi** (I know), **jānāsi** (you know), **jānāti** (he/she knows), **jānīmaḥ** (we know). Negate with **na** right before the verb: **na jānāmi** = \"I don't know.\"\n\nThe past passive participle **jñātam** means \"known\" or \"was known.\" When you say **mama na jñātam**, it literally means \"it was not known by me\" — a natural way to say \"I didn't know that\" or \"I had no idea.\" You can also ask **kim jānāsi?** to mean \"do you know?\" — and this doubles as a lead-in for sharing interesting information, just like in English.\n\n---\n\n## Example Phrases\n\n1. अहं जानामि।\n   ahaṃ jānāmi.\n   *I know.*\n\n2. अहं न जानामि।\n   ahaṃ na jānāmi.\n   *I don't know.*\n\n3. किं त्वं जानासि?\n   kiṃ tvaṃ jānāsi?\n   *Do you know?*\n\n4. सः सर्वं जानाति।\n   saḥ sarvaṃ jānāti.\n   *He knows everything.*\n\n5. मम न ज्ञातम्।\n   mama na jñātam.\n   *I didn't know that.*\n\n6. अहम् एतत् जानामि।\n   aham etat jānāmi.\n   *I know this.*\n\n7. त्वं संस्कृतं जानासि वा?\n   tvaṃ saṃskṛtaṃ jānāsi vā?\n   *Do you know Sanskrit?*\n\n8. सा मार्गं न जानाति।\n   sā mārgaṃ na jānāti.\n   *She doesn't know the way.*\n\n9. वयं जानीमः।\n   vayaṃ jānīmaḥ.\n   *We know.*\n\n10. कः जानाति?\n    kaḥ jānāti?\n    *Who knows?*\n\n---\n\n## Mini-Dialogue 1\n\n> **अ:** त्वं रामस्य गृहं जानासि वा?\n> A: tvaṃ rāmasya gṛhaṃ jānāsi vā?\n> *Do you know Rama's house?*\n\n> **ब:** आम्, अहं जानामि। तत्र गच्छावः?\n> B: ām, ahaṃ jānāmi. tatra gacchāvaḥ?\n> *Yes, I know. Shall we go there?*\n\n> **अ:** आम्, मार्गं दर्शय।\n> A: ām, mārgaṃ darśaya.\n> *Yes, show the way.*\n\n## Mini-Dialogue 2\n\n> **अ:** किं त्वं जानासि? श्वः परीक्षा अस्ति!\n> A: kiṃ tvaṃ jānāsi? śvaḥ parīkṣā asti!\n> *Do you know? Tomorrow there's an exam!*\n\n> **ब:** मम न ज्ञातम्! सत्यम्?\n> B: mama na jñātam! satyam?\n> *I didn't know! Really?*\n\n> **अ:** आम्, सत्यम्। अहम् अपि अद्य एव ज्ञातम्।\n> A: ām, satyam. aham api adya eva jñātam.\n> *Yes, really. I also just found out today.*\n\n---\n\n## Variations\n\n1. **jānāmi / na jānāmi as complete sentences:** These work perfectly on their own. Someone asks a question, you simply say *jānāmi* (I know) or *na jānāmi* (no idea). Clean and natural.\n\n2. **idānīm jñātam** — \"Now I know\" or \"Now I understand.\" Use this when someone explains something and you get it. *idānīm* = now.\n\n3. **kasya jñātam?** — \"Who knew?\" A rhetorical question, just like in English. Works for expressing surprise.\n\n---\n\n## Common Mistakes\n\n1. **jānāmi vs. jñātam:** *jānāmi* is present tense — \"I know (right now).\" *jñātam* is a past participle — \"it was known / I came to know.\" Don't use *jñātam* for ongoing knowledge. \"I know Sanskrit\" = *ahaṃ saṃskṛtaṃ jānāmi* (not *jñātam*).\n\n2. **na placement:** Put **na** directly before the verb: *na jānāmi*. Putting it elsewhere can change the meaning or sound odd. *ahaṃ jānāmi na* is not standard.\n", "workbook-questions": "# Stage 11: Knowing & Not Knowing — Workbook\n\n## Section A: Translate to Sanskrit (10 marks)\n*Write in IAST.*\n\n1. I know.\n2. Do you know Sanskrit?\n3. She doesn't know the way.\n4. I didn't know that.\n5. Who knows?\n\n## Section B: Translate to English (10 marks)\n\n1. ahaṃ na jānāmi.\n2. saḥ sarvaṃ jānāti.\n3. kiṃ tvaṃ jānāsi?\n4. mama na jñātam.\n5. vayaṃ jānīmaḥ.\n\n## Section C: Fill in the Blank (10 marks)\n*Fill in the missing word.*\n\n1. ahaṃ ______. (I know.)\n2. ahaṃ ______ jānāmi. (I don't know.)\n3. kiṃ tvaṃ ______? (Do you know?)\n4. mama na ______. (I didn't know that.)\n5. sā mārgaṃ na ______. (She doesn't know the way.)\n\n## Section D: Build a Mini-Dialogue (6 marks)\n*Write a 3-4 line dialogue in IAST for each prompt.*\n\n1. You ask a friend if they know where the shop is. They don't know. You say you know and offer to show the way.\n\n2. Someone tells you surprising news (an exam tomorrow, a friend is coming, etc.). You say you didn't know. They explain, and you say \"now I know.\"\n\n## Section E: Free Response (4 marks)\n\n1. Write about three things you know and two things you don't know (3-4 sentences in IAST).\n\n2. Write a short scene where someone realizes something they didn't know before, using jñātam and idānīm jñātam (3-4 sentences in IAST).\n", "workbook-answers": "# Stage 11: Knowing & Not Knowing — Answer Key\n\n## Section A: Translate to Sanskrit (10 marks)\n\n1. ahaṃ jānāmi.\n2. tvaṃ saṃskṛtaṃ jānāsi vā?\n3. sā mārgaṃ na jānāti.\n4. mama na jñātam.\n5. kaḥ jānāti?\n\n## Section B: Translate to English (10 marks)\n\n1. I don't know.\n2. He knows everything.\n3. Do you know?\n4. I didn't know that.\n5. We know.\n\n## Section C: Fill in the Blank (10 marks)\n\n1. ahaṃ **jānāmi**.\n2. ahaṃ **na** jānāmi.\n3. kiṃ tvaṃ **jānāsi**?\n4. mama na **jñātam**.\n5. sā mārgaṃ na **jānāti**.\n\n## Section D: Build a Mini-Dialogue (6 marks)\n\n### Dialogue 1 (sample)\n> A: tvaṃ āpaṇasya mārgaṃ jānāsi vā?\n> B: na jānāmi.\n> A: ahaṃ jānāmi. āgaccha, mārgaṃ darśayāmi.\n> B: dhanyavādaḥ!\n\n### Dialogue 2 (sample)\n> A: kiṃ tvaṃ jānāsi? śvaḥ rāmaḥ āgacchati!\n> B: mama na jñātam! satyam?\n> A: ām, saḥ adya eva avadат — śvaḥ āgacchāmi iti.\n> B: idānīm jñātam. uttamam!\n\n## Section E: Free Response (4 marks)\n\n### Sample 1\nahaṃ saṃskṛtaṃ jānāmi. ahaṃ rāmasya gṛhaṃ jānāmi. ahaṃ mārgaṃ jānāmi. ahaṃ phārasībhāṣāṃ na jānāmi. ahaṃ saṅgaṇakasya nirmāṇaṃ na jānāmi.\n\n### Sample 2\nsītā avadat — \"śvaḥ parīkṣā asti.\" mama na jñātam! ahaṃ cintitaḥ. sītā avadат — \"cintā mā kuru, saralā parīkṣā.\" idānīm jñātam, sarvam uttamam.\n"}, "tabs": ["theory", "workbook-questions", "workbook-answers"]}, {"id": "conv-12-can-cannot", "number": 12, "title": "Can & Cannot", "subtitle": "śaknomi, na śaknomi", "files": {"theory": "# Stage 12: Can & Cannot\n\n## The Pattern\n\n**aham X kartum śaknomi** — \"I can do X\"\n\n| Sanskrit | IAST | Meaning |\n|----------|------|---------|\n| अहम् X कर्तुं शक्नोमि | aham X kartuṃ śaknomi | I can do X |\n| न शक्नोमि | na śaknomi | I can't |\n| किं त्वम् Y कर्तुं शक्नोषि? | kiṃ tvam Y kartuṃ śaknoṣi? | Can you do Y? |\n| सः Z कर्तुं शक्नोति | saḥ Z kartuṃ śaknoti | He can do Z |\n\n---\n\n## How It Works\n\nTo say \"can\" in Sanskrit, pair the verb **śak** (to be able) with an infinitive — a verb form ending in **-tum**. The infinitive is simple to build: take the root and add **-tum**. So **kar** (do) becomes **kartum** (to do), **gam** (go) becomes **gantum** (to go), **vac** (speak) becomes **vaktum** (to speak), **khād** (eat) becomes **khāditum** (to eat), **paṭh** (read) becomes **paṭhitum** (to read).\n\nThe conjugation of **śak**: **śaknomi** (I can), **śaknoṣi** (you can), **śaknoti** (he/she can), **śaknuvaḥ** (we two can), **śaknumaḥ** (we all can). Negate with **na**: **na śaknomi** = \"I can't.\" The structure is always: person + action-infinitive + śak-form. So \"I can go\" = *ahaṃ gantuṃ śaknomi*.\n\n---\n\n## Example Phrases\n\n1. अहं कर्तुं शक्नोमि।\n   ahaṃ kartuṃ śaknomi.\n   *I can do it.*\n\n2. अहं न शक्नोमि।\n   ahaṃ na śaknomi.\n   *I can't.*\n\n3. किं त्वं गन्तुं शक्नोषि?\n   kiṃ tvaṃ gantuṃ śaknoṣi?\n   *Can you go?*\n\n4. सः संस्कृतं वक्तुं शक्नोति।\n   saḥ saṃskṛtaṃ vaktuṃ śaknoti.\n   *He can speak Sanskrit.*\n\n5. अहं तत्र गन्तुं न शक्नोमि।\n   ahaṃ tatra gantuṃ na śaknomi.\n   *I can't go there.*\n\n6. सा गातुं शक्नोति।\n   sā gātuṃ śaknoti.\n   *She can sing.*\n\n7. वयं पठितुं शक्नुमः।\n   vayaṃ paṭhituṃ śaknumaḥ.\n   *We can read.*\n\n8. त्वं किं कर्तुं शक्नोषि?\n   tvaṃ kiṃ kartuṃ śaknoṣi?\n   *What can you do?*\n\n9. अहं साहाय्यं कर्तुं शक्नोमि।\n   ahaṃ sāhāyyaṃ kartuṃ śaknomi.\n   *I can help. (I can do help.)*\n\n10. सः खादितुं न शक्नोति।\n    saḥ khādituṃ na śaknoti.\n    *He cannot eat.*\n\n---\n\n## Mini-Dialogue 1\n\n> **अ:** किं त्वं श्वः आगन्तुं शक्नोषि?\n> A: kiṃ tvaṃ śvaḥ āgantuṃ śaknoṣi?\n> *Can you come tomorrow?*\n\n> **ब:** न शक्नोमि। श्वः मम कार्यम् अस्ति।\n> B: na śaknomi. śvaḥ mama kāryam asti.\n> *I can't. I have work tomorrow.*\n\n> **अ:** परश्वः शक्नोषि वा?\n> A: paraśvaḥ śaknoṣi vā?\n> *Can you the day after?*\n\n> **ब:** आम्, परश्वः शक्नोमि!\n> B: ām, paraśvaḥ śaknomi!\n> *Yes, the day after I can!*\n\n## Mini-Dialogue 2\n\n> **अ:** त्वं संस्कृतं वक्तुं शक्नोषि वा?\n> A: tvaṃ saṃskṛtaṃ vaktuṃ śaknoṣi vā?\n> *Can you speak Sanskrit?*\n\n> **ब:** किञ्चित् शक्नोमि। त्वम्?\n> B: kiñcit śaknomi. tvam?\n> *A little I can. You?*\n\n> **अ:** अहम् अपि किञ्चित् शक्नोमि। आवां सह अभ्यासं करवावः!\n> A: aham api kiñcit śaknomi. āvāṃ saha abhyāsaṃ karavāvaḥ!\n> *I can a little too. Let's practice together!*\n\n---\n\n## Variations\n\n1. **śaknomi alone as a complete answer:** Just like \"I can\" in English, you can answer *śaknomi* (I can) or *na śaknomi* (I can't) without repeating the infinitive. Very natural.\n\n2. **pārayāmi as an alternative:** The verb **pṛ** (pārayāmi) also means \"I am able.\" *ahaṃ kartuṃ pārayāmi* = \"I am able to do it.\" More formal, but good to recognize.\n\n3. **Common infinitives to memorize:** kartum (to do), gantum (to go), vaktum (to speak), khāditum (to eat), paṭhitum (to read), lekhitum (to write), gātum (to sing), draṣṭum (to see), śrotum (to hear).\n\n---\n\n## Common Mistakes\n\n1. **Don't forget -tum:** The infinitive must end in *-tum*. You can't say *ahaṃ gacchāmi śaknomi* (mashing two conjugated verbs together). It's *ahaṃ gantuṃ śaknomi* — one infinitive + one conjugated verb.\n\n2. **śaknomi vs. śaknoṣi:** Watch your endings. *śaknomi* = I can, *śaknoṣi* = you can. Mixing these up changes who is able to do the thing.\n", "workbook-questions": "# Stage 12: Can & Cannot — Workbook\n\n## Section A: Translate to Sanskrit (10 marks)\n*Write in IAST.*\n\n1. I can speak Sanskrit.\n2. Can you come tomorrow?\n3. She can sing.\n4. We cannot go there.\n5. What can you do?\n\n## Section B: Translate to English (10 marks)\n\n1. ahaṃ kartuṃ śaknomi.\n2. saḥ khādituṃ na śaknoti.\n3. kiṃ tvaṃ gantuṃ śaknoṣi?\n4. vayaṃ paṭhituṃ śaknumaḥ.\n5. sā vaktuṃ na śaknoti.\n\n## Section C: Fill in the Blank (10 marks)\n*Fill in the missing word.*\n\n1. ahaṃ saṃskṛtaṃ ______ śaknomi. (I can speak Sanskrit.)\n2. tvaṃ gantuṃ ______? (Can you go?)\n3. saḥ ______ na śaknoti. (He cannot eat.)\n4. vayaṃ paṭhituṃ ______. (We can read.)\n5. ahaṃ sāhāyyaṃ ______ śaknomi. (I can help.)\n\n## Section D: Build a Mini-Dialogue (6 marks)\n*Write a 3-4 line dialogue in IAST for each prompt.*\n\n1. You invite a friend to come to the garden. They say they can't today but can tomorrow. You agree to go tomorrow.\n\n2. Someone asks if you can speak Sanskrit. You say a little. They ask if you can read too. You say you can't read yet.\n\n## Section E: Free Response (4 marks)\n\n1. List four things you can do and two things you cannot do (4-5 sentences in IAST).\n\n2. Write a short scene where someone offers help — \"I can do this for you\" — using śaknomi and kartum (3-4 sentences in IAST).\n", "workbook-answers": "# Stage 12: Can & Cannot — Answer Key\n\n## Section A: Translate to Sanskrit (10 marks)\n\n1. ahaṃ saṃskṛtaṃ vaktuṃ śaknomi.\n2. kiṃ tvaṃ śvaḥ āgantuṃ śaknoṣi?\n3. sā gātuṃ śaknoti.\n4. vayaṃ tatra gantuṃ na śaknumaḥ.\n5. tvaṃ kiṃ kartuṃ śaknoṣi?\n\n## Section B: Translate to English (10 marks)\n\n1. I can do it.\n2. He cannot eat.\n3. Can you go?\n4. We can read.\n5. She cannot speak.\n\n## Section C: Fill in the Blank (10 marks)\n\n1. ahaṃ saṃskṛtaṃ **vaktuṃ** śaknomi.\n2. tvaṃ gantuṃ **śaknoṣi**?\n3. saḥ **khādituṃ** na śaknoti.\n4. vayaṃ paṭhituṃ **śaknumaḥ**.\n5. ahaṃ sāhāyyaṃ **kartuṃ** śaknomi.\n\n## Section D: Build a Mini-Dialogue (6 marks)\n\n### Dialogue 1 (sample)\n> A: udyānaṃ āgaccha! āvāṃ gacchāvaḥ.\n> B: adya gantuṃ na śaknomi. śvaḥ śaknomi.\n> A: samyak. śvaḥ gacchāvaḥ.\n> B: uttamam!\n\n### Dialogue 2 (sample)\n> A: tvaṃ saṃskṛtaṃ vaktuṃ śaknoṣi vā?\n> B: kiñcit vaktuṃ śaknomi.\n> A: paṭhituṃ api śaknoṣi?\n> B: na, paṭhituṃ na śaknomi adhunā.\n\n## Section E: Free Response (4 marks)\n\n### Sample 1\nahaṃ saṃskṛtaṃ vaktuṃ śaknomi. ahaṃ gātuṃ śaknomi. ahaṃ paṭhituṃ śaknomi. ahaṃ pāktuṃ śaknomi. ahaṃ taritum na śaknomi. ahaṃ phārasībhāṣāṃ vaktuṃ na śaknomi.\n\n### Sample 2\nmitram avadat — \"mama bhāraḥ asti, voḍhuṃ na śaknomi.\" ahaṃ avadaṃ — \"ahaṃ sāhāyyaṃ kartuṃ śaknomi. etat mahyaṃ dehi.\" mitram avadat — \"dhanyavādaḥ! tvam uttamaḥ mitraṃ asi.\"\n"}, "tabs": ["theory", "workbook-questions", "workbook-answers"]}, {"id": "conv-13-polite", "number": 13, "title": "Polite Phrases", "subtitle": "kṛpayā, dhanyavādaḥ", "files": {"theory": "# Stage 13: Polite Phrases\n\n## The Pattern\n\n**kṛpayā / dhanyavādaḥ / kṣamyatām / svāgatam / śubhāśayāḥ / punaḥ milāmaḥ**\n\nEvery language has its social lubricant — the \"please,\" \"thank you,\" \"sorry\" that keep conversations smooth. Sanskrit has a rich set of these, and many of them reveal neat grammar hiding in plain sight.\n\n---\n\n## How It Works\n\nMost of these phrases are **indeclinables** (avyaya) — words that never change form regardless of who is speaking or being addressed. *Kṛpayā* (\"please,\" literally \"by kindness\") is frozen in the instrumental case. *Dhanyavādaḥ* (\"thank you,\" literally \"a statement of gratitude\") is a compound noun. *Svāgatam* (\"welcome,\" literally \"well-arrived\") is a past participle used as a greeting.\n\nThe interesting one is *kṣamyatām* (\"please forgive / pardon\"). This is a **passive imperative** — the verb *kṣam* (\"to forgive\") put into passive voice and then commanded. It literally means \"let it be forgiven.\" You don't even need to say *who* should forgive — the construction handles it gracefully. Similarly, *punaḥ milāmaḥ* (\"let us meet again\") uses a first-person plural imperative — \"let us meet.\"\n\n---\n\n## Example Phrases\n\n1. कृपया उपविशतु।\n   *kṛpayā upaviśatu.*\n   Please sit down.\n\n2. बहु धन्यवादाः।\n   *bahu dhanyavādāḥ.*\n   Thank you very much.\n\n3. क्षम्यतां विलम्बाय।\n   *kṣamyatāṃ vilambāya.*\n   Sorry for the delay.\n\n4. अस्माकं गृहे स्वागतम्।\n   *asmākaṃ gṛhe svāgatam.*\n   Welcome to our home.\n\n5. नववर्षस्य शुभाशयाः!\n   *navavarṣasya śubhāśayāḥ!*\n   Good wishes for the new year!\n\n6. पुनः मिलामः श्वः।\n   *punaḥ milāmaḥ śvaḥ.*\n   Let us meet again tomorrow.\n\n7. कृपया मम सहायतां करोतु।\n   *kṛpayā mama sahāyatāṃ karotu.*\n   Please help me.\n\n8. तव सहायतायै धन्यवादाः।\n   *tava sahāyatāyai dhanyavādāḥ.*\n   Thank you for your help.\n\n9. क्षम्यतां, मार्गं ददातु।\n   *kṣamyatāṃ, mārgaṃ dadātu.*\n   Pardon me, please make way.\n\n10. शुभं भवतु!\n    *śubhaṃ bhavatu!*\n    May it be auspicious! (a general good-wish)\n\n---\n\n## Mini-Dialogues\n\n**Dialogue 1: At someone's home**\n\n— स्वागतम्! कृपया उपविशतु।\n  *svāgatam! kṛpayā upaviśatu.*\n  Welcome! Please sit down.\n\n— बहु धन्यवादाः। सुन्दरं गृहम्।\n  *bahu dhanyavādāḥ. sundaraṃ gṛham.*\n  Thank you very much. Beautiful home.\n\n— कृपया जलं स्वीकरोतु।\n  *kṛpayā jalaṃ svīkarotu.*\n  Please accept some water.\n\n— धन्यवादाः, अतीव दयालुः भवान्।\n  *dhanyavādāḥ, atīva dayāluḥ bhavān.*\n  Thank you, you are very kind.\n\n**Dialogue 2: Bumping into someone**\n\n— क्षम्यताम्! अहं न दृष्टवान्।\n  *kṣamyatām! ahaṃ na dṛṣṭavān.*\n  Sorry! I didn't see.\n\n— न किञ्चित्, चिन्ता मास्तु।\n  *na kiñcit, cintā māstu.*\n  It's nothing, don't worry.\n\n— पुनः मिलामः, शुभदिनम् अस्तु।\n  *punaḥ milāmaḥ, śubhadinam astu.*\n  See you again, have a good day.\n\n— शुभाशयाः!\n  *śubhāśayāḥ!*\n  Good wishes!\n\n---\n\n## Variations\n\n1. **Formal \"please\":** *kṛpayā* can be replaced with *dayā kṛtvā* (\"having done kindness\") for a more elaborate, formal register.\n   *dayā kṛtvā idaṃ paṭhatu.* — Kindly read this.\n\n2. **Casual \"thanks\":** Instead of the full *dhanyavādāḥ*, you can simply say *dhanyaḥ asmi* (\"I am grateful\") or even just *sādhu* (\"good, well done\") in casual settings.\n\n3. **Stronger apology:** Add *mahān aparādhaḥ* (\"great offence\") before *kṣamyatām* for a serious apology:\n   *mahān aparādhaḥ, kṣamyatām.* — It's a great fault, please forgive.\n\n---\n\n## Common Mistakes\n\n1. **Saying *kṣamasva* when you mean \"excuse me\":** *Kṣamasva* is a direct imperative — \"You forgive!\" It sounds demanding. Use the softer passive *kṣamyatām* (\"let it be forgiven\") for polite requests. Save *kṣamasva* for intimate or devotional contexts.\n\n2. **Forgetting the plural in *dhanyavādāḥ*:** The word ends in *-āḥ* (nominative plural) because you are offering multiple expressions of thanks. Writing *dhanyavādaḥ* (singular) is common but technically less standard in the set phrase.\n", "workbook-questions": "# Stage 13: Polite Phrases — Workbook Questions\n\n**Total: 40 marks**\n\n---\n\n## Section A: Translate to Sanskrit (10 marks, 2 each)\n\nUse Devanagari or IAST. Use the polite phrases from this stage.\n\n1. Please speak slowly.\n2. Thank you for the food.\n3. Sorry, I am late.\n4. Welcome to the school.\n5. Good wishes for the festival!\n\n---\n\n## Section B: Translate to English (10 marks, 2 each)\n\n1. kṛpayā pustakaṃ dadātu.\n2. bahu dhanyavādāḥ, mitrāṇi.\n3. kṣamyatāṃ mama doṣāya.\n4. asmākaṃ nagarē svāgatam.\n5. punaḥ milāmaḥ āgāmi-saptāhe.\n\n---\n\n## Section C: Fill in the Blank (10 marks, 2 each)\n\n1. _______ idaṃ dvāraṃ udgāṭayatu. (Please open this door.)\n2. tava upadeśāya _______. (Thank you for your advice.)\n3. _______, ahaṃ bhraṣṭavān. (Sorry, I made a mistake.)\n4. bhavataḥ gṛhe _______! (Welcome to your home!)\n5. _______ prātaḥ daśavādane. (Let us meet again at 10 in the morning.)\n\n---\n\n## Section D: Build a Mini-Dialogue (5 marks, 2.5 each)\n\nWrite a 3-4 line dialogue in Sanskrit (IAST is fine) for each situation. Use at least two polite phrases per dialogue.\n\n1. **Situation:** You arrive at a friend's celebration. Greet them, offer good wishes, and thank them for the invitation.\n\n2. **Situation:** You accidentally step on someone's foot in a market. Apologize, check if they are okay, and say goodbye politely.\n\n---\n\n## Section E: Free Response (5 marks, 2.5 each)\n\n1. Write 3-4 sentences describing the most formal way you would greet a respected teacher (*guruḥ*) in Sanskrit. Use as many polite phrases as you can.\n\n2. In your opinion, why does Sanskrit use a passive imperative (*kṣamyatām*) for \"sorry\" rather than a direct command? Write 2-3 sentences reflecting on this — in English or Sanskrit.\n", "workbook-answers": "# Stage 13: Polite Phrases — Workbook Answers\n\n---\n\n## Section A: Translate to Sanskrit\n\n1. kṛpayā śanaiḥ vadatu.\n2. bhojananāya dhanyavādāḥ.\n3. kṣamyatām, ahaṃ vilambitaḥ (m.) / vilambitā (f.).\n4. vidyālaye svāgatam.\n5. utsavasya śubhāśayāḥ!\n\n---\n\n## Section B: Translate to English\n\n1. Please give the book.\n2. Thank you very much, friends.\n3. Sorry for my fault / Pardon my mistake.\n4. Welcome to our city.\n5. Let us meet again next week.\n\n---\n\n## Section C: Fill in the Blank\n\n1. **kṛpayā** idaṃ dvāraṃ udgāṭayatu.\n2. tava upadeśāya **dhanyavādāḥ**.\n3. **kṣamyatām**, ahaṃ bhraṣṭavān.\n4. bhavataḥ gṛhe **svāgatam**!\n5. **punaḥ milāmaḥ** prātaḥ daśavādane.\n\n---\n\n## Section D: Sample Mini-Dialogues\n\n**1. Arriving at a friend's celebration:**\n\n— svāgatam, mitra! āgaccha, upaviśa.\n  Welcome, friend! Come, sit.\n\n— dhanyavādāḥ nimantranāya! navavarṣasya śubhāśayāḥ!\n  Thank you for the invitation! Good wishes for the new year!\n\n— tava āgamanena ānandaḥ. kṛpayā modakaṃ svīkuru.\n  Happy with your arrival. Please accept a sweet.\n\n— bahu dhanyavādāḥ. punaḥ milāmaḥ!\n  Thank you very much. See you again!\n\n**2. Stepping on someone's foot in a market:**\n\n— kṣamyatām! ahaṃ na dṛṣṭavān. kiṃ bhavān kuśalī?\n  Sorry! I didn't see. Are you well?\n\n— na kiñcit, cintā māstu.\n  It's nothing, don't worry.\n\n— kṛpayā kṣamantu. punaḥ milāmaḥ, śubhadinam astu!\n  Please forgive me. See you again, may the day be good!\n\n— dhanyavādāḥ, bhavate api śubhadinam.\n  Thank you, a good day to you too.\n\n---\n\n## Section E: Sample Responses\n\n**1. Greeting a respected teacher:**\n\ngurōḥ pādayōḥ namāmi. svāgatam, ācārya. kṛpayā āsane upaviśatu. bhavataḥ darśanena vayam dhanyāḥ. dayā kṛtvā asmān anugrahnātu.\n\n(I bow at the guru's feet. Welcome, teacher. Please sit on the seat. We are blessed by your presence. Kindly bestow grace upon us.)\n\n**2. Reflection on passive imperative:**\n\nThe passive imperative *kṣamyatām* (\"let it be forgiven\") avoids placing a burden directly on the listener. Instead of commanding \"You forgive me!\", it softly requests that forgiveness happen — as if the act is bigger than either person. This reflects a cultural and linguistic preference for indirectness in sensitive situations, making the apology feel humble rather than demanding.\n"}, "tabs": ["theory", "workbook-questions", "workbook-answers"]}, {"id": "conv-14-because", "number": 14, "title": "Because & Therefore", "subtitle": "yataḥ...tataḥ", "files": {"theory": "# Stage 14: Because & Therefore\n\n## The Pattern\n\n**yataḥ X tataḥ Y** — \"because X, therefore Y\"\n**X-kāraṇāt Y** — \"because of X, Y\"\n**ataḥ** — \"therefore\"\n**hi** — \"for / because\" (enclitic)\n\nYou can now give *reasons*. This is the stage where your Sanskrit stops being a list of facts and starts building arguments.\n\n---\n\n## How It Works\n\nSanskrit has a beautiful correlative system: *yataḥ* (\"since/because\") in the first clause pairs with *tataḥ* (\"therefore/so\") in the second. Think of them as a matched set — the reason clause and the result clause, neatly linked.\n\nFor shorter explanations, you can skip the pair and just use **ataḥ** (\"therefore\") to introduce a conclusion. Or tack on **hi** (\"for/because\") as a lightweight enclitic — it always comes *second* in its clause, never first. There is also the **ablative of cause** using *-kāraṇāt*: you take a noun, add *kāraṇāt* (\"from the reason of\"), and you have an instant \"because of X\" phrase. For example, *varṣā-kāraṇāt* = \"because of rain.\"\n\n---\n\n## Example Phrases\n\n1. यतः वर्षा भवति ततः अहं गृहे तिष्ठामि।\n   *yataḥ varṣā bhavati tataḥ ahaṃ gṛhe tiṣṭhāmi.*\n   Because it is raining, therefore I stay at home.\n\n2. रोगकारणात् सः विद्यालयं न गच्छति।\n   *roga-kāraṇāt saḥ vidyālayaṃ na gacchati.*\n   Because of illness, he does not go to school.\n\n3. अतः वयं श्वः गमिष्यामः।\n   *ataḥ vayaṃ śvaḥ gamiṣyāmaḥ.*\n   Therefore we will go tomorrow.\n\n4. सत्यं हि सदा जयति।\n   *satyaṃ hi sadā jayati.*\n   For truth always wins.\n\n5. यतः त्वं मम मित्रम् असि ततः अहं साहाय्यं करोमि।\n   *yataḥ tvaṃ mama mitram asi tataḥ ahaṃ sāhāyyaṃ karomi.*\n   Because you are my friend, therefore I help.\n\n6. उष्णकारणात् जलं पिबामि।\n   *uṣṇa-kāraṇāt jalaṃ pibāmi.*\n   Because of the heat, I drink water.\n\n7. यतः सः परिश्रमं करोति ततः सफलः भवति।\n   *yataḥ saḥ pariśramaṃ karoti tataḥ saphalaḥ bhavati.*\n   Because he works hard, therefore he succeeds.\n\n8. अलसः अस्ति, अतः न पठति।\n   *alasaḥ asti, ataḥ na paṭhati.*\n   He is lazy, therefore he does not study.\n\n9. धर्मः हि मूलम्।\n   *dharmaḥ hi mūlam.*\n   For dharma is the root.\n\n10. यतः मार्गः अवरुद्धः ततः वयम् अन्यमार्गेण गच्छामः।\n    *yataḥ mārgaḥ avaruddhaḥ tataḥ vayam anyamārgeṇa gacchāmaḥ.*\n    Because the road is blocked, therefore we go by another route.\n\n---\n\n## Mini-Dialogues\n\n**Dialogue 1: Why aren't you coming?**\n\n— किमर्थं त्वं न आगच्छसि?\n  *kimarthaṃ tvaṃ na āgacchasi?*\n  Why aren't you coming?\n\n— यतः मम कार्यं न समाप्तम्, ततः गन्तुं न शक्नोमि।\n  *yataḥ mama kāryaṃ na samāptam, tataḥ gantuṃ na śaknomi.*\n  Because my work isn't finished, therefore I can't go.\n\n— अतः श्वः मिलामः?\n  *ataḥ śvaḥ milāmaḥ?*\n  Then shall we meet tomorrow?\n\n— आम्, श्वः अवश्यम्।\n  *ām, śvaḥ avaśyam.*\n  Yes, tomorrow for sure.\n\n**Dialogue 2: Explaining a decision**\n\n— भवान् किमर्थम् एतत् पुस्तकं क्रीतवान्?\n  *bhavān kimartham etat pustakaṃ krītavān?*\n  Why did you buy this book?\n\n— एतत् हि उत्तमं पुस्तकम्। गुरुणा प्रशंसितम्।\n  *etat hi uttamaṃ pustakam. guruṇā praśaṃsitam.*\n  For this is an excellent book. Praised by the teacher.\n\n— साधु, अतः अहम् अपि पठिष्यामि।\n  *sādhu, ataḥ aham api paṭhiṣyāmi.*\n  Good, therefore I too will read it.\n\n---\n\n## Variations\n\n1. **yasmāt...tasmāt** — A more formal synonym pair for *yataḥ...tataḥ*, using ablative pronouns:\n   *yasmāt saḥ dhārmikaḥ, tasmāt sukhaṃ labhate.* — Since he is righteous, therefore he gains happiness.\n\n2. **tena** (\"therefore/by that reason\") — Another way to say \"therefore,\" using the instrumental of *tat*:\n   *sā paṇḍitā, tena sarvē tāṃ namanti.* — She is learned, therefore all bow to her.\n\n3. **-hetoḥ** (\"on account of\") — Alternative to *-kāraṇāt*, using the genitive:\n   *kāryahetoḥ āgataḥ.* — Came on account of work.\n\n---\n\n## Common Mistakes\n\n1. **Putting *hi* first in a clause:** *Hi* is an enclitic — it must come second. Say *satyaṃ hi jayati*, never *hi satyaṃ jayati*. Think of it as a word that leans on the word before it.\n\n2. **Mixing up *yataḥ* and *yatra*:** *Yataḥ* means \"because/since.\" *Yatra* means \"where.\" They sound similar but do completely different jobs. If you're giving a reason, reach for *yataḥ*.\n", "workbook-questions": "# Stage 14: Because & Therefore — Workbook Questions\n\n**Total: 40 marks**\n\n---\n\n## Section A: Translate to Sanskrit (10 marks, 2 each)\n\nUse any causal construction from this stage (yataḥ...tataḥ, -kāraṇāt, ataḥ, hi).\n\n1. Because it is cold, I wear warm clothes.\n2. He is tired, therefore he sleeps.\n3. Because of hunger, the child cries.\n4. For knowledge is the greatest wealth.\n5. Because you studied, therefore you passed.\n\n---\n\n## Section B: Translate to English (10 marks, 2 each)\n\n1. yataḥ sūryaḥ astam gacchati tataḥ andhakāraḥ bhavati.\n2. jalābhāva-kāraṇāt vṛkṣāḥ śuṣyanti.\n3. sā dhīrā, ataḥ na bibheti.\n4. jīvanaṃ hi anityam.\n5. yataḥ tvaṃ satyaṃ vadasi tataḥ ahaṃ viśvasimi.\n\n---\n\n## Section C: Fill in the Blank (10 marks, 2 each)\n\n1. _______ varṣā bhavati _______ nadī pūrṇā bhavati. (Because it rains, therefore the river fills.)\n2. śrama-_______ saḥ viśrāmyati. (Because of exhaustion, he rests.)\n3. vidyā _______ sarvōttamā. (For knowledge is the highest.)\n4. mārgaḥ dūraḥ, _______ vayaṃ yānaṃ svīkurmāḥ. (The road is long, therefore we take a vehicle.)\n5. _______ guruḥ kathayati _______ śiṣyaḥ śṛṇoti. (Because the teacher speaks, therefore the student listens.)\n\n---\n\n## Section D: Build a Mini-Dialogue (5 marks, 2.5 each)\n\nWrite a 3-4 line dialogue in Sanskrit (IAST is fine) for each situation. Use at least one causal construction per dialogue.\n\n1. **Situation:** Your friend asks why you are learning Sanskrit. Give a reason using *yataḥ...tataḥ* or *hi*.\n\n2. **Situation:** Someone asks why the shop is closed. Explain the reason using *-kāraṇāt* and conclude with *ataḥ*.\n\n---\n\n## Section E: Free Response (5 marks, 2.5 each)\n\n1. Write 3-4 sentences in Sanskrit explaining why you like (or dislike) a particular season. Use at least two different causal constructions.\n\n2. The word *hi* always comes second in a clause. Why do you think Sanskrit has this rule? Write 2-3 sentences reflecting — in English or Sanskrit.\n", "workbook-answers": "# Stage 14: Because & Therefore — Workbook Answers\n\n---\n\n## Section A: Translate to Sanskrit\n\n1. yataḥ śītalaṃ bhavati tataḥ ahaṃ uṣṇāni vastrāṇi dhārayāmi.\n2. saḥ śrāntaḥ, ataḥ svapiti.\n3. kṣudhā-kāraṇāt bālaḥ roditi.\n4. jñānaṃ hi mahattamaṃ dhanam.\n5. yataḥ tvaṃ paṭhitavān tataḥ utīrṇaḥ jātaḥ.\n\n---\n\n## Section B: Translate to English\n\n1. Because the sun sets, therefore darkness comes.\n2. Because of the lack of water, the trees dry up.\n3. She is courageous, therefore she does not fear.\n4. For life is impermanent.\n5. Because you speak the truth, therefore I trust (you).\n\n---\n\n## Section C: Fill in the Blank\n\n1. **yataḥ** varṣā bhavati **tataḥ** nadī pūrṇā bhavati.\n2. śrama-**kāraṇāt** saḥ viśrāmyati.\n3. vidyā **hi** sarvōttamā.\n4. mārgaḥ dūraḥ, **ataḥ** vayaṃ yānaṃ svīkurmāḥ.\n5. **yataḥ** guruḥ kathayati **tataḥ** śiṣyaḥ śṛṇoti.\n\n---\n\n## Section D: Sample Mini-Dialogues\n\n**1. Why learn Sanskrit?**\n\n— tvaṃ kimarthaṃ saṃskṛtaṃ paṭhasi?\n  Why are you studying Sanskrit?\n\n— yataḥ saṃskṛtam atīva sundaram, tataḥ ahaṃ paṭhāmi. prācīnāni śāstrāṇi hi saṃskṛte santi.\n  Because Sanskrit is very beautiful, therefore I study it. For the ancient texts are in Sanskrit.\n\n— sādhu! aham api paṭhitum icchāmi.\n  Good! I too want to study.\n\n**2. Why is the shop closed?**\n\n— eṣā āpaṇikā kimarthaṃ pidadhātī?\n  Why is this shop closed?\n\n— utsava-kāraṇāt āpaṇikā pidhānā. adya viśrāmadinam.\n  Because of the festival, the shop is closed. Today is a rest day.\n\n— ataḥ śvaḥ āgacchāmi.\n  Therefore I will come tomorrow.\n\n— ām, śvaḥ prātaḥ āpaṇikā bhaviṣyati.\n  Yes, the shop will be open tomorrow morning.\n\n---\n\n## Section E: Sample Responses\n\n**1. Favourite season:**\n\nvasantaṛtuḥ mama priyaḥ. yataḥ puṣpāṇi vikasanti tataḥ sarvatra saundaryadarśanaṃ bhavati. śītala-kāraṇāt na kaṣṭaṃ bhavati, uṣṇa-kāraṇāt api na. vāyuḥ hi vasante sukhadaḥ bhavati. ataḥ vasantam ahaṃ prīṇāmi.\n\n(Spring is my favourite. Because flowers bloom, therefore beauty is seen everywhere. There is no trouble from cold or heat. For the breeze in spring is pleasant. Therefore I love spring.)\n\n**2. Reflection on *hi* placement:**\n\nThe rule that *hi* must come second (Wackernagel's position) reflects Sanskrit's broader tendency to place enclitic particles after the first stressed element of a clause. This creates a natural rhythm — the important word lands first and *hi* leans on it for support. It also prevents ambiguity about which clause *hi* belongs to, since it always attaches to what immediately precedes it.\n"}, "tabs": ["theory", "workbook-questions", "workbook-answers"]}, {"id": "conv-15-if-then", "number": 15, "title": "If & Then", "subtitle": "yadi...tarhi", "files": {"theory": "# Stage 15: If & Then\n\n## The Pattern\n\n**yadi X tarhi Y** — \"if X, then Y\"\n**yadi X syāt tarhi Y syāt** — \"if X were to be, then Y would be\"\n**cet** — enclitic \"if\"\n\nYou now have the power to talk about possibilities, hypotheticals, warnings, and promises. This is where conversations get interesting.\n\n---\n\n## How It Works\n\nThe basic conditional uses another correlative pair: **yadi** (\"if\") opens the condition, and **tarhi** (\"then\") introduces the result. For straightforward, real-world conditions — \"if it rains, I'll stay home\" — just use the normal verb forms you already know.\n\nFor hypothetical or unlikely scenarios, Sanskrit uses the **optative mood** (also called the potential mood). The key verb here is **syāt** — the optative of *as* (\"to be\"), meaning \"would be / might be / should be.\" When you see *yadi...syāt...tarhi...syāt*, you know you're in \"what if\" territory. Other verbs also have optative forms: *gacchet* (\"would go\"), *kuryāt* (\"would do\"), *vadet* (\"would say\").\n\nThe enclitic **cet** is a compact alternative to *yadi*. Like *hi*, it sits in second position — after the first word of its clause. *Tvaṃ cet āgacchasi* = \"if you come.\"\n\n---\n\n## Example Phrases\n\n1. यदि वर्षा भवति तर्हि अहं गृहे तिष्ठामि।\n   *yadi varṣā bhavati tarhi ahaṃ gṛhe tiṣṭhāmi.*\n   If it rains, then I stay at home.\n\n2. यदि त्वं पठेः तर्हि सफलः भवेः।\n   *yadi tvaṃ paṭheḥ tarhi saphalaḥ bhaveḥ.*\n   If you were to study, you would succeed.\n\n3. त्वं चेत् आगच्छसि तर्हि आनन्दः भवति।\n   *tvaṃ cet āgacchasi tarhi ānandaḥ bhavati.*\n   If you come, then there is joy.\n\n4. यदि धनं स्यात् तर्हि गृहं क्रीणीयाम्।\n   *yadi dhanaṃ syāt tarhi gṛhaṃ krīṇīyām.*\n   If there were money, I would buy a house.\n\n5. यदि सः आगच्छेत् तर्हि कथयामि।\n   *yadi saḥ āgacchet tarhi kathayāmi.*\n   If he comes (were to come), I will tell.\n\n6. यदि भोजनं न भवति तर्हि बहिः गच्छामः।\n   *yadi bhojanaṃ na bhavati tarhi bahiḥ gacchāmaḥ.*\n   If there is no food, then we go out.\n\n7. समयः चेत् अस्ति तर्हि पुस्तकं पठ।\n   *samayaḥ cet asti tarhi pustakaṃ paṭha.*\n   If there is time, then read the book.\n\n8. यदि अहं पक्षी स्याम् तर्हि आकाशे उड्डयेयम्।\n   *yadi ahaṃ pakṣī syām tarhi ākāśe uḍḍayeyam.*\n   If I were a bird, I would fly in the sky.\n\n9. यदि श्वः वृष्टिः न भवति तर्हि वयं वनं गच्छामः।\n   *yadi śvaḥ vṛṣṭiḥ na bhavati tarhi vayaṃ vanaṃ gacchāmaḥ.*\n   If it doesn't rain tomorrow, then we go to the forest.\n\n10. यदि कृपया पृच्छसि तर्हि जनाः साहाय्यं कुर्वन्ति।\n    *yadi kṛpayā pṛcchasi tarhi janāḥ sāhāyyaṃ kurvanti.*\n    If you ask politely, then people help.\n\n---\n\n## Mini-Dialogues\n\n**Dialogue 1: Making plans**\n\n— श्वः किं करवाम?\n  *śvaḥ kiṃ karavāma?*\n  What shall we do tomorrow?\n\n— यदि सूर्यः भवति तर्हि नदीं गच्छामः।\n  *yadi sūryaḥ bhavati tarhi nadīṃ gacchāmaḥ.*\n  If it's sunny, then we go to the river.\n\n— वर्षा चेत् भवति?\n  *varṣā cet bhavati?*\n  And if it rains?\n\n— तर्हि गृहे एव पुस्तकानि पठामः!\n  *tarhi gṛhe eva pustakāni paṭhāmaḥ!*\n  Then we just read books at home!\n\n**Dialogue 2: A hypothetical**\n\n— यदि त्वं राजा स्याः तर्हि किं कुर्याः?\n  *yadi tvaṃ rājā syāḥ tarhi kiṃ kuryāḥ?*\n  If you were a king, what would you do?\n\n— यदि अहं राजा स्याम् तर्हि सर्वेभ्यः विद्यां ददाम्।\n  *yadi ahaṃ rājā syām tarhi sarvebhyaḥ vidyāṃ dadām.*\n  If I were a king, I would give education to all.\n\n— सुन्दरम्। तर्हि प्रजाः सुखिन्यः स्युः।\n  *sundaram. tarhi prajāḥ sukhinyaḥ syuḥ.*\n  Beautiful. Then the people would be happy.\n\n---\n\n## Variations\n\n1. **yadā...tadā for \"whenever\":** Don't confuse *yadi* (if) with *yadā* (when/whenever). *Yadā* describes things that actually happen repeatedly; *yadi* describes possibilities. We will cover *yadā...tadā* fully in Stage 17.\n\n2. **cet with negation — nocet:** *Na + cet* contracts to **nocet** (\"if not / otherwise\"):\n   *śīghraṃ gaccha, nocet vilambaḥ bhaviṣyati.* — Go quickly, otherwise there will be a delay.\n\n3. **tarhi dropped:** In casual speech, *tarhi* can be omitted when the meaning is clear:\n   *yadi āgacchasi, ānanditaḥ bhavāmi.* — If you come, I'll be delighted.\n\n---\n\n## Common Mistakes\n\n1. **Using indicative verbs in hypotheticals:** \"If I were a bird\" is unreal — use the optative (*syām*, *uḍḍayeyam*), not the present tense (*asmi*, *uḍḍayāmi*). Indicative + *yadi* implies you think the condition might actually be true.\n\n2. **Placing *cet* first:** Like *hi*, the word *cet* is an enclitic and must come second in its clause. Say *tvaṃ cet gacchasi*, never *cet tvaṃ gacchasi*.\n", "workbook-questions": "# Stage 15: If & Then — Workbook Questions\n\n**Total: 40 marks**\n\n---\n\n## Section A: Translate to Sanskrit (10 marks, 2 each)\n\nUse yadi...tarhi, cet, or the optative mood as appropriate.\n\n1. If you come tomorrow, then we will play.\n2. If I were rich, I would travel the world.\n3. If the teacher asks, tell the truth.\n4. If there is no water, the plants die.\n5. Go quickly, otherwise (nocet) you will be late.\n\n---\n\n## Section B: Translate to English (10 marks, 2 each)\n\n1. yadi tvaṃ jalaṃ pibasi tarhi svāsthyaṃ bhavati.\n2. yadi sā āgacchet tarhi vayaṃ kathāṃ śṛṇuyāma.\n3. dhanaṃ cet asti tarhi dānaṃ kuru.\n4. yadi ahaṃ pakṣī syām tarhi himālayaṃ paśyeyam.\n5. śīghraṃ paṭha, nocet parīkṣāyāṃ na utīrṇaḥ bhavasi.\n\n---\n\n## Section C: Fill in the Blank (10 marks, 2 each)\n\n1. _______ vṛṣṭiḥ bhavati _______ kṛṣakāḥ prasannāḥ bhavanti. (If it rains, then the farmers are happy.)\n2. tvaṃ _______ āgacchasi tarhi miṣṭānnaṃ dadāmi. (If you come, I will give sweets.)\n3. yadi samayaḥ _______ tarhi viśrāmaṃ kuryām. (If there were time, I would rest.)\n4. śīghraṃ gaccha, _______ vilambaḥ bhaviṣyati. (Go fast, otherwise there will be a delay.)\n5. yadi sā gāyet tarhi sarve _______ . (If she were to sing, everyone would listen.)\n\n---\n\n## Section D: Build a Mini-Dialogue (5 marks, 2.5 each)\n\nWrite a 3-4 line dialogue in Sanskrit (IAST is fine) for each situation.\n\n1. **Situation:** Two friends discuss what they would do if they had a flying vehicle (*vimānam*). Use hypothetical conditionals with the optative.\n\n2. **Situation:** A parent warns a child — if you don't eat vegetables, you won't be strong. The child responds with their own \"if...then.\" Use *yadi...tarhi* or *nocet*.\n\n---\n\n## Section E: Free Response (5 marks, 2.5 each)\n\n1. Write 3-4 sentences about what you would do if you could live in any time period. Use *yadi...syāt...tarhi...* constructions.\n\n2. What is the difference between *yadi saḥ gacchati* and *yadi saḥ gacchet*? Explain in 2-3 sentences — English or Sanskrit.\n", "workbook-answers": "# Stage 15: If & Then — Workbook Answers\n\n---\n\n## Section A: Translate to Sanskrit\n\n1. yadi tvaṃ śvaḥ āgacchasi tarhi vayaṃ krīḍāmaḥ.\n2. yadi ahaṃ dhanavanān syām tarhi viśvaṃ paryaṭeyam.\n3. yadi ācāryaḥ pṛcchati tarhi satyaṃ vada.\n4. yadi jalaṃ na bhavati tarhi vanaspatayaḥ mriyante.\n5. śīghraṃ gaccha, nocet vilambitaḥ bhaviṣyasi.\n\n---\n\n## Section B: Translate to English\n\n1. If you drink water, then health comes (you become healthy).\n2. If she were to come, then we would listen to a story.\n3. If there is wealth, then give charity.\n4. If I were a bird, I would see the Himalayas.\n5. Study quickly, otherwise you will not pass the exam.\n\n---\n\n## Section C: Fill in the Blank\n\n1. **yadi** vṛṣṭiḥ bhavati **tarhi** kṛṣakāḥ prasannāḥ bhavanti.\n2. tvaṃ **cet** āgacchasi tarhi miṣṭānnaṃ dadāmi.\n3. yadi samayaḥ **syāt** tarhi viśrāmaṃ kuryām.\n4. śīghraṃ gaccha, **nocet** vilambaḥ bhaviṣyati.\n5. yadi sā gāyet tarhi sarve **śṛṇuyuḥ**.\n\n---\n\n## Section D: Sample Mini-Dialogues\n\n**1. Flying vehicle:**\n\n— yadi āvayoḥ vimānaṃ syāt tarhi kutra gaccheva?\n  If we had a flying vehicle, where would we go?\n\n— yadi mama vimānaṃ syāt tarhi pratidinṃ himālayam uḍḍayeyam.\n  If I had a flying vehicle, I would fly to the Himalayas every day.\n\n— aham api! megheṣu upari viśrāmaṃ kuryām.\n  Me too! I would rest above the clouds.\n\n— yadi tathā syāt tarhi jīvanaṃ sundararṃ syāt!\n  If that were so, life would be beautiful!\n\n**2. Parent and child:**\n\n— yadi śākāni na khādasi tarhi balavān na bhaviṣyasi.\n  If you don't eat vegetables, you won't be strong.\n\n— kintu mama phalāni rocante! yadi phalāni khādāmi tarhi api balavān bhavāmi, nanu?\n  But I like fruits! If I eat fruits, I become strong too, right?\n\n— ām, phalāni api uttamāni. kintu śākāni api khāda, nocet rogaḥ bhaviṣyati.\n  Yes, fruits are good too. But eat vegetables also, otherwise illness will come.\n\n— yadi tvaṃ miṣṭānnaṃ dadāsi tarhi śākāni api khādāmi!\n  If you give sweets, then I'll eat vegetables too!\n\n---\n\n## Section E: Sample Responses\n\n**1. Living in another time:**\n\nyadi ahaṃ prācīnakāle vaseyyam tarhi nalandā-viśvavidyālaye paṭheyam. yadi tatra guravāḥ syuḥ tarhi vyākaraṇaṃ jyotiṣaṃ ca adhīyīya. yadi kālidāsasya samaye syām tarhi tena saha kāvyaṃ vicārayeyam. tat tu svapnaḥ eva syāt, kintu sundaraḥ svapnaḥ!\n\n(If I lived in ancient times, I would study at Nalanda University. If there were teachers, I would learn grammar and astronomy. If I were in Kalidasa's time, I would discuss poetry with him. That would just be a dream, but a beautiful dream!)\n\n**2. Indicative vs. optative:**\n\n*Yadi saḥ gacchati* uses the indicative mood — the speaker considers it a real possibility that \"he goes.\" *Yadi saḥ gacchet* uses the optative — the speaker is imagining a hypothetical or unlikely scenario, \"if he were to go.\" The first is for practical conditions you expect might happen; the second is for wishes, speculations, or unreal situations.\n"}, "tabs": ["theory", "workbook-questions", "workbook-answers"]}, {"id": "conv-16-but-although", "number": 16, "title": "But & Although", "subtitle": "kintu, yadyapi...tathāpi", "files": {"theory": "# Stage 16: But & Although\n\n## The Pattern\n\n**X kintu Y** — \"X, but Y\"\n**X parantu Y** — \"X, however Y\"\n**yadyapi X tathāpi Y** — \"although X, nevertheless Y\"\n\nYou can now push back, qualify, and add nuance. No more agreeing with everything — time to say \"but.\"\n\n---\n\n## How It Works\n\n**Kintu** and **parantu** both mean \"but/however\" and work almost identically. They sit between two clauses and flip the direction. *Kintu* is slightly more common in conversational Sanskrit; *parantu* feels a shade more formal. Both are indeclinables — they never change form.\n\nThe power move is **yadyapi...tathāpi** (\"although...nevertheless\"). This is another correlative pair: *yadyapi* (literally *yadi + api* = \"even if\") opens the concession, and *tathāpi* (*tathā + api* = \"even so\") delivers the counter-punch. Use this when you want to acknowledge something and then push past it: \"Although it rained, we still went.\"\n\nYou can also use **api** alone to mean \"even/also\" — it's the building block inside both *yadyapi* and *tathāpi*.\n\n---\n\n## Example Phrases\n\n1. सः धनवान् किन्तु सुखी नास्ति।\n   *saḥ dhanavān kintu sukhī nāsti.*\n   He is rich, but not happy.\n\n2. अहं गन्तुम् इच्छामि परन्तु समयः नास्ति।\n   *ahaṃ gantum icchāmi parantu samayaḥ nāsti.*\n   I want to go, however there is no time.\n\n3. यद्यपि वर्षा भवति तथापि सः गच्छति।\n   *yadyapi varṣā bhavati tathāpi saḥ gacchati.*\n   Although it rains, nevertheless he goes.\n\n4. भोजनं स्वादिष्टं किन्तु अतीव उष्णम्।\n   *bhojanaṃ svādiṣṭaṃ kintu atīva uṣṇam.*\n   The food is delicious, but very hot.\n\n5. यद्यपि सा लघ्वी तथापि बलवती।\n   *yadyapi sā laghvī tathāpi balavatī.*\n   Although she is small, she is nevertheless strong.\n\n6. मार्गः सुन्दरः परन्तु दीर्घः।\n   *mārgaḥ sundaraḥ parantu dīrghaḥ.*\n   The path is beautiful, however long.\n\n7. यद्यपि अहं श्रान्तः तथापि कार्यं करोमि।\n   *yadyapi ahaṃ śrāntaḥ tathāpi kāryaṃ karomi.*\n   Although I am tired, I still do the work.\n\n8. सा गायति, किन्तु नृत्यं न करोति।\n   *sā gāyati, kintu nṛtyaṃ na karoti.*\n   She sings, but does not dance.\n\n9. यद्यपि गुरुः कठोरः तथापि शिष्याः तं प्रीणन्ति।\n   *yadyapi guruḥ kaṭhoraḥ tathāpi śiṣyāḥ taṃ prīṇanti.*\n   Although the teacher is strict, the students still love him.\n\n10. पुस्तकं प्राचीनं किन्तु ज्ञानं नवीनम्।\n    *pustakaṃ prācīnaṃ kintu jñānaṃ navīnam.*\n    The book is old, but the knowledge is fresh.\n\n---\n\n## Mini-Dialogues\n\n**Dialogue 1: Changing plans**\n\n— अद्य वनं गच्छामः, किं भवति?\n  *adya vanaṃ gacchāmaḥ, kiṃ bhavati?*\n  Shall we go to the forest today?\n\n— इच्छामि, किन्तु वर्षा आगच्छति इति भाति।\n  *icchāmi, kintu varṣā āgacchati iti bhāti.*\n  I'd like to, but it looks like rain is coming.\n\n— यद्यपि वर्षा भवेत् तथापि वनं सुन्दरम् एव।\n  *yadyapi varṣā bhavet tathāpi vanaṃ sundaram eva.*\n  Even if it rains, the forest is still beautiful.\n\n— सत्यम्! तर्हि गच्छामः।\n  *satyam! tarhi gacchāmaḥ.*\n  True! Then let's go.\n\n**Dialogue 2: Acknowledging and countering**\n\n— एतत् पुस्तकं कठिनम्।\n  *etat pustakaṃ kaṭhinam.*\n  This book is difficult.\n\n— आम्, कठिनं परन्तु अतीव उपयोगि।\n  *ām, kaṭhinaṃ parantu atīva upayogi.*\n  Yes, difficult, however very useful.\n\n— यद्यपि कठिनं तथापि पठनीयम् एव?\n  *yadyapi kaṭhinaṃ tathāpi paṭhanīyam eva?*\n  Although it's difficult, it should still be read?\n\n— अवश्यम्! कठिनं किन्तु योग्यम्।\n  *avaśyam! kaṭhinaṃ kintu yogyam.*\n  Certainly! Difficult but worthwhile.\n\n---\n\n## Variations\n\n1. **tu** — A lighter, more classical \"but.\" Often found in verse and older prose. *Saḥ vadati, ahaṃ tu na śṛṇomi.* — He speaks, but I don't listen. Note: *tu* also sits in second position, like *hi* and *cet*.\n\n2. **athāpi** (\"even then / and yet\") — Combines *atha* + *api* for a softer \"nevertheless\":\n   *kṣudraḥ jīvaḥ, athāpi mahattvam asya.* — A tiny creature, and yet its greatness.\n\n3. **tad api** (\"even so\") — Can replace *tathāpi* in less formal speech:\n   *kaṣṭaṃ bhavati, tad api na tyajāmi.* — It's hard, even so I don't quit.\n\n---\n\n## Common Mistakes\n\n1. **Using *kintu* at the start of a sentence without a preceding clause:** *Kintu* links two ideas. You need something before it — even if it's implied from the previous speaker's line. Don't just open with *kintu* out of nowhere.\n\n2. **Forgetting *tathāpi* after *yadyapi*:** The pair works together. If you say *yadyapi* and then just continue without *tathāpi*, the sentence feels unfinished, like saying \"although...\" in English and never delivering the \"nevertheless.\" Always close the pair.\n", "workbook-questions": "# Stage 16: But & Although — Workbook Questions\n\n**Total: 40 marks**\n\n---\n\n## Section A: Translate to Sanskrit (10 marks, 2 each)\n\nUse kintu, parantu, or yadyapi...tathāpi as appropriate.\n\n1. The city is big, but noisy.\n2. Although she is young, she is nevertheless very wise.\n3. I want to eat, however I am not hungry.\n4. He speaks Sanskrit, but does not write it.\n5. Although the exam was difficult, nevertheless all students passed.\n\n---\n\n## Section B: Translate to English (10 marks, 2 each)\n\n1. grāmaḥ śāntaḥ kintu nagarāt dūraḥ.\n2. yadyapi sā navāgataḥ tathāpi sarvān jānāti.\n3. ahaṃ khedāmi parantu sahāyyaṃ kartuṃ na śaknomi.\n4. yadyapi rātriḥ tathāpi tārakāḥ prakāśante.\n5. bhojanaṃ paryāptaṃ kintu jalaṃ nāsti.\n\n---\n\n## Section C: Fill in the Blank (10 marks, 2 each)\n\n1. saḥ medhāvī _______ alasaḥ. (He is intelligent but lazy.)\n2. _______ mārgaḥ dīrghaḥ _______ vayaṃ calāmaḥ eva. (Although the path is long, we still walk.)\n3. ahaṃ tvaṃ draṣṭum āgatavān _______ tvaṃ gṛhe nāsīḥ. (I came to see you, however you were not at home.)\n4. _______ vṛddhaḥ _______ dhāvituṃ śaknoti. (Although old, he can still run.)\n5. phalaṃ madhuraṃ _______ mahārgham. (The fruit is sweet but expensive.)\n\n---\n\n## Section D: Build a Mini-Dialogue (5 marks, 2.5 each)\n\nWrite a 3-4 line dialogue in Sanskrit (IAST is fine) for each situation.\n\n1. **Situation:** Two people argue about a film — one liked it (but admits a flaw), the other didn't like it (but admits a strength). Use kintu or parantu.\n\n2. **Situation:** A student explains to a friend why they keep studying a hard subject. Use yadyapi...tathāpi at least once.\n\n---\n\n## Section E: Free Response (5 marks, 2.5 each)\n\n1. Describe something you find both good and bad — food, weather, a place, a habit. Write 3-4 Sanskrit sentences using kintu/parantu and yadyapi...tathāpi.\n\n2. What is the difference in feeling between *kintu* and *yadyapi...tathāpi*? When would you choose one over the other? Write 2-3 sentences — English or Sanskrit.\n", "workbook-answers": "# Stage 16: But & Although — Workbook Answers\n\n---\n\n## Section A: Translate to Sanskrit\n\n1. nagaram mahat kintu kolāhalapūrṇam.\n2. yadyapi sā yuvatiḥ tathāpi atīva buddhimatī.\n3. ahaṃ khāditum icchāmi parantu kṣudhā nāsti.\n4. saḥ saṃskṛtaṃ vadati kintu na likhati.\n5. yadyapi parīkṣā kaṭhinā āsīt tathāpi sarve chātrāḥ utīrṇāḥ abhavan.\n\n---\n\n## Section B: Translate to English\n\n1. The village is peaceful but far from the city.\n2. Although she is a newcomer, nevertheless she knows everyone.\n3. I am sorry, however I am not able to help.\n4. Although it is night, nevertheless the stars shine.\n5. The food is enough, but there is no water.\n\n---\n\n## Section C: Fill in the Blank\n\n1. saḥ medhāvī **kintu** alasaḥ.\n2. **yadyapi** mārgaḥ dīrghaḥ **tathāpi** vayaṃ calāmaḥ eva.\n3. ahaṃ tvāṃ draṣṭum āgatavān **parantu** tvaṃ gṛhe nāsīḥ.\n4. **yadyapi** vṛddhaḥ **tathāpi** dhāvituṃ śaknoti.\n5. phalaṃ madhuraṃ **kintu** mahārgham.\n\n---\n\n## Section D: Sample Mini-Dialogues\n\n**1. Film debate:**\n\n— mama matē citrapaṭaḥ sundaraḥ āsīt, kintu antyaḥ bhāgaḥ durbalaḥ.\n  In my opinion the film was beautiful, but the ending was weak.\n\n— ahaṃ na rocitavān. kathā mandā āsīt, parantu saṅgītam uttamam āsīt.\n  I didn't like it. The story was slow, however the music was excellent.\n\n— sādhu! saṅgītaṃ sundaraṃ kintu kathā api āvaśyakī, nanu?\n  True! The music is beautiful, but the story is also necessary, right?\n\n— āṃ, dvayam api āvaśyakam.\n  Yes, both are necessary.\n\n**2. Studying a hard subject:**\n\n— kimarthaṃ tvaṃ vyākaraṇam adhīṣe? kaṭhinaṃ nanu?\n  Why do you study grammar? Isn't it difficult?\n\n— āṃ, yadyapi vyākaraṇaṃ kaṭhinaṃ tathāpi atīva ānanddāyakam.\n  Yes, although grammar is difficult, it is nevertheless very enjoyable.\n\n— kintu parikṣā api kaṭhinā bhavati!\n  But the exam is also hard!\n\n— sā tu kaṭhinā, parantu yadyapi kaṣṭena paṭhāmi tathāpi jñānasya ānandaḥ mahān.\n  That is indeed hard, but although I study with difficulty, the joy of knowledge is great.\n\n---\n\n## Section E: Sample Responses\n\n**1. Something both good and bad (example: summer):**\n\ngrīṣmaṛtuḥ sundaraḥ kintu atīva uṣṇaḥ. dīrghāḥ divāḥ bhavanti — tat mama rocate. parantu rātrau api uṣṇatā na kṣīyate. yadyapi grīṣme phalāni bahūni labhyante tathāpi uṣṇa-kāraṇāt bahiḥ gantuṃ na śaknomi.\n\n(Summer is beautiful but very hot. The days are long — I like that. However, even at night the heat doesn't subside. Although many fruits are available in summer, I can't go out because of the heat.)\n\n**2. Kintu vs. yadyapi...tathāpi:**\n\n*Kintu* is a simple pivot — it flips from one statement to another, like \"but\" in English. It's quick and lightweight. *Yadyapi...tathāpi* is heavier and more dramatic — it first acknowledges a concession (\"although this is true\") and then deliberately overrides it (\"nevertheless\"). You choose *yadyapi...tathāpi* when you want the listener to feel the weight of both sides, and *kintu* when you just need a quick contrast.\n"}, "tabs": ["theory", "workbook-questions", "workbook-answers"]}, {"id": "conv-17-when-while", "number": 17, "title": "When & While", "subtitle": "yadā...tadā", "files": {"theory": "# Stage 17: When & While\n\n## The Pattern\n\n**yadā X tadā Y** — \"when X, then Y\"\n**X-samaye** — \"at the time of X\"\n**yāvat X tāvat Y** — \"while X, Y\" / \"as long as X, Y\"\n**yatra X tatra Y** — \"where X, there Y\"\n\nTime and place — the frame around every story. With these correlative pairs, you can schedule, narrate, and describe the world in motion.\n\n---\n\n## How It Works\n\nYou have already met correlative pairs (*yataḥ...tataḥ*, *yadi...tarhi*). Now you get the temporal and spatial ones. **Yadā...tadā** is the workhorse for \"when...then.\" It covers single events (\"when he arrived, I left\"), habitual actions (\"when I wake, I drink water\"), and future plans (\"when summer comes, we'll travel\").\n\n**Yāvat...tāvat** is for duration — \"as long as / while.\" *Yāvat* sets up a span of time, and *tāvat* tells you what fills it. This pair can also mean \"until\": *yāvat sūryaḥ na udeti tāvat andhakāraḥ* — \"until the sun rises, there is darkness.\"\n\n**X-samaye** uses the locative case of *samaya* (\"time/occasion\") to mark a point in time: *bhojana-samaye* = \"at mealtime.\" It's a compact, elegant alternative to a full *yadā* clause.\n\n**Yatra...tatra** gives you spatial correlation: \"where X, there Y.\" Handy for describing places, giving directions, and making philosophical observations (\"where there is dharma, there is victory\").\n\n---\n\n## Example Phrases\n\n1. यदा सूर्यः उदेति तदा पक्षिणः गायन्ति।\n   *yadā sūryaḥ udeti tadā pakṣiṇaḥ gāyanti.*\n   When the sun rises, then the birds sing.\n\n2. भोजनसमये मौनं पालयतु।\n   *bhojana-samaye maunaṃ pālayatu.*\n   At mealtime, maintain silence.\n\n3. यावत् अहं पठामि तावत् त्वं क्रीड।\n   *yāvat ahaṃ paṭhāmi tāvat tvaṃ krīḍa.*\n   While I study, you play.\n\n4. यत्र विद्या तत्र विनयः।\n   *yatra vidyā tatra vinayaḥ.*\n   Where there is knowledge, there is humility.\n\n5. यदा गुरुः आगच्छति तदा सर्वे उत्तिष्ठन्ति।\n   *yadā guruḥ āgacchati tadā sarve uttiṣṭhanti.*\n   When the teacher arrives, then everyone stands.\n\n6. सन्ध्यासमये दीपं ज्वालयामि।\n   *sandhyā-samaye dīpaṃ jvālayāmi.*\n   At twilight, I light a lamp.\n\n7. यावत् जीवं तावत् पठेत्।\n   *yāvat jīvaṃ tāvat paṭhet.*\n   As long as one lives, one should study.\n\n8. यत्र नदी तत्र हरितम्।\n   *yatra nadī tatra haritam.*\n   Where there is a river, there is greenery.\n\n9. यदा वर्षा समाप्ता तदा वयं बहिः गच्छामः।\n   *yadā varṣā samāptā tadā vayaṃ bahiḥ gacchāmaḥ.*\n   When the rain stops, then we go out.\n\n10. परीक्षासमये शान्तिः आवश्यकी।\n    *parīkṣā-samaye śāntiḥ āvaśyakī.*\n    At exam time, calmness is necessary.\n\n---\n\n## Mini-Dialogues\n\n**Dialogue 1: Daily routine**\n\n— त्वं प्रातः कदा उत्तिष्ठसि?\n  *tvaṃ prātaḥ kadā uttiṣṭhasi?*\n  When do you wake up in the morning?\n\n— यदा सूर्यः उदेति तदा उत्तिष्ठामि।\n  *yadā sūryaḥ udeti tadā uttiṣṭhāmi.*\n  When the sun rises, then I wake up.\n\n— प्रातःभोजनसमये किं खादसि?\n  *prātaḥbhojana-samaye kiṃ khādasi?*\n  What do you eat at breakfast time?\n\n— यावत् भोजनं पचति तावत् चायं पिबामि।\n  *yāvat bhojanaṃ pacati tāvat cāyaṃ pibāmi.*\n  While the food cooks, I drink tea.\n\n**Dialogue 2: Describing a place**\n\n— तव ग्रामः कीदृशः?\n  *tava grāmaḥ kīdṛśaḥ?*\n  What is your village like?\n\n— यत्र मम ग्रामः तत्र सुन्दरा नदी अस्ति।\n  *yatra mama grāmaḥ tatra sundarā nadī asti.*\n  Where my village is, there is a beautiful river.\n\n— यदा त्वं तत्र गच्छसि तदा किं करोषि?\n  *yadā tvaṃ tatra gacchasi tadā kiṃ karoṣi?*\n  When you go there, what do you do?\n\n— सन्ध्यासमये नद्यां स्नानं करोमि। शान्तिः एव शान्तिः।\n  *sandhyā-samaye nadyāṃ snānaṃ karomi. śāntiḥ eva śāntiḥ.*\n  At twilight I bathe in the river. Just peace.\n\n---\n\n## Variations\n\n1. **yasmin samaye...tasmin samaye** — A more explicit \"at which time...at that time,\" using locative pronouns:\n   *yasmin samaye sā prāviśat tasmin samaye sarve atuṣyan.* — At the time she entered, everyone was delighted.\n\n2. **yāvat...na...tāvat** for \"until\":\n   *yāvat saḥ na āgacchati tāvat pratīkṣāmahe.* — Until he comes, we wait.\n\n3. **yadā yadā...tadā tadā** for \"whenever...always\":\n   *yadā yadā duḥkhaṃ bhavati tadā tadā dhairyaṃ dhārayāmi.* — Whenever sorrow comes, I always hold courage.\n\n---\n\n## Common Mistakes\n\n1. **Confusing *yadā* (when) with *yadi* (if):** These are different constructions. *Yadā* describes something that happens or will happen in time. *Yadi* introduces a condition that may or may not be true. \"When summer comes\" (certain, temporal) = *yadā*. \"If summer comes early\" (uncertain, conditional) = *yadi*.\n\n2. **Dropping the correlative partner:** Each *yadā* wants a *tadā*, each *yāvat* wants a *tāvat*, each *yatra* wants a *tatra*. Dropping the second word is like leaving a sentence hanging. In casual speech you can sometimes get away with it, but while learning, always close the pair.\n", "workbook-questions": "# Stage 17: When & While — Workbook Questions\n\n**Total: 40 marks**\n\n---\n\n## Section A: Translate to Sanskrit (10 marks, 2 each)\n\nUse yadā...tadā, -samaye, yāvat...tāvat, or yatra...tatra as appropriate.\n\n1. When the bell rings, then the class begins.\n2. At dinnertime, the family sits together.\n3. While the children play, the mother cooks.\n4. Where there are trees, there is shade.\n5. Whenever I hear music, I feel happy.\n\n---\n\n## Section B: Translate to English (10 marks, 2 each)\n\n1. yadā rātriḥ bhavati tadā tārakāḥ dṛśyante.\n2. prātaḥ-samaye vāyuḥ śītalaḥ bhavati.\n3. yāvat guruḥ kathayati tāvat śiṣyāḥ śṛṇvanti.\n4. yatra dhūmaḥ tatra agniḥ.\n5. yadā yadā sā hasati tadā tadā sarve hasanti.\n\n---\n\n## Section C: Fill in the Blank (10 marks, 2 each)\n\n1. _______ vasantaḥ āgacchati _______ puṣpāṇi vikasanti. (When spring comes, then flowers bloom.)\n2. sandhyā-_______ dīpaṃ ज्वālayāmi. (At twilight, I light a lamp.)\n3. _______ ahaṃ gṛhe asmi _______ tvaṃ āpaṇaṃ gaccha. (While I am at home, you go to the shop.)\n4. _______ jalaṃ _______ jīvanam. (Where there is water, there is life.)\n5. _______ saḥ na āgacchati _______ vayaṃ pratīkṣāmahe. (Until he comes, we wait.)\n\n---\n\n## Section D: Build a Mini-Dialogue (5 marks, 2.5 each)\n\nWrite a 3-4 line dialogue in Sanskrit (IAST is fine) for each situation.\n\n1. **Situation:** Two friends discuss their morning routines. Use yadā...tadā and -samaye to describe what they do at different times.\n\n2. **Situation:** Someone describes their favourite place — what is found where, and what they do while they are there. Use yatra...tatra and yāvat...tāvat.\n\n---\n\n## Section E: Free Response (5 marks, 2.5 each)\n\n1. Describe your typical evening in 3-4 Sanskrit sentences, using at least two different temporal constructions from this stage.\n\n2. The subhāṣita says *yatra vidyā tatra vinayaḥ*. Write your own \"yatra...tatra\" proverb and explain its meaning in 2-3 sentences — English or Sanskrit.\n", "workbook-answers": "# Stage 17: When & While — Workbook Answers\n\n---\n\n## Section A: Translate to Sanskrit\n\n1. yadā ghaṇṭā vādyate tadā kakṣā ārabhate.\n2. rātri-bhojana-samaye parivāraḥ saha upaviśati.\n3. yāvat bālāḥ krīḍanti tāvat mātā pacati.\n4. yatra vṛkṣāḥ tatra chāyā.\n5. yadā yadā saṅgītaṃ śṛṇomi tadā tadā sukhī bhavāmi.\n\n---\n\n## Section B: Translate to English\n\n1. When it becomes night, then the stars are seen.\n2. At morning time, the air is cool.\n3. While the teacher speaks, the students listen.\n4. Where there is smoke, there is fire.\n5. Whenever she laughs, everyone laughs.\n\n---\n\n## Section C: Fill in the Blank\n\n1. **yadā** vasantaḥ āgacchati **tadā** puṣpāṇi vikasanti.\n2. sandhyā-**samaye** dīpaṃ jvālayāmi.\n3. **yāvat** ahaṃ gṛhe asmi **tāvat** tvaṃ āpaṇaṃ gaccha.\n4. **yatra** jalaṃ **tatra** jīvanam.\n5. **yāvat** saḥ na āgacchati **tāvat** vayaṃ pratīkṣāmahe.\n\n---\n\n## Section D: Sample Mini-Dialogues\n\n**1. Morning routines:**\n\n— tvaṃ prātaḥ kadā uttiṣṭhasi?\n  When do you wake up in the morning?\n\n— yadā ghaṇṭā ṣaṭ bhavati tadā uttiṣṭhāmi. prātaḥ-snāna-samaye mantram paṭhāmi. tvaṃ ca?\n  When it becomes six o'clock, I wake up. At bath time, I recite a mantra. And you?\n\n— aham pañcavādane uttiṣṭhāmi. yadā sūryaḥ udeti tadā yogābhyāsaṃ karomi.\n  I wake up at five. When the sun rises, I do yoga practice.\n\n— sundaram! prātaḥ-bhojana-samaye kiṃ khādasi?\n  Lovely! What do you eat at breakfast time?\n\n**2. Favourite place:**\n\n— mama priyaṃ sthānaṃ parvataḥ.\n  My favourite place is the mountain.\n\n— yatra parvataḥ tatra śāntiḥ, nanu?\n  Where there are mountains, there is peace, right?\n\n— āṃ! yāvat ahaṃ tatra vasāmi tāvat sarvāṇi duḥkhāni vismarāmi.\n  Yes! While I stay there, I forget all sorrows.\n\n— yatra vṛkṣāḥ ca nadyaḥ ca tatra svargaḥ eva.\n  Where there are trees and rivers, there is heaven itself.\n\n---\n\n## Section E: Sample Responses\n\n**1. Typical evening:**\n\nyadā kāryaṃ samāpyate tadā gṛhaṃ gacchāmi. sandhyā-samaye dīpaṃ jvālayāmi mantram ca paṭhāmi. yāvat bhojanaṃ pacati tāvat pustakaṃ paṭhāmi. yadā rātriḥ bhavati tadā parivāreṇa saha kathāṃ karomi.\n\n(When work finishes, I go home. At twilight I light a lamp and recite a mantra. While the food cooks, I read a book. When it becomes night, I converse with the family.)\n\n**2. Custom yatra...tatra proverb:**\n\n*yatra hāsyaṃ tatra ārogyam.* — Where there is laughter, there is health.\n\nThis means that humour and joy are themselves a form of medicine. A place filled with laughter tends to be a place where people are well — not just in body, but in spirit. The *yatra...tatra* construction compresses a whole philosophy into six syllables.\n"}, "tabs": ["theory", "workbook-questions", "workbook-answers"]}, {"id": "conv-18-sequencing", "number": 18, "title": "First, Then, Finally", "subtitle": "prathamam, tataḥ, ante", "files": {"theory": "# Stage 18: First, Then, Finally\n\n## The Pattern\n\n**prathamaṃ X** — \"first, X\"\n**tataḥ Y** — \"then, Y\"\n**anantaraṃ Z** — \"after that, Z\"\n**ante / antataḥ** — \"finally / at last\"\n**pūrvam** — \"before / earlier\"\n\nYou can now tell stories, give directions, explain processes, and walk someone through a recipe. Sequencing is the skeleton of narrative.\n\n---\n\n## How It Works\n\nAll five of these words are **indeclinables** (avyaya) — they never change form, no matter what the subject or tense is. They simply slot into the sentence to mark order. Think of them as signposts along a road: *prathamam* plants the flag at the start, *tataḥ* moves you forward one step, *anantaram* takes another step, and *ante* or *antataḥ* signals the finish line.\n\n**Pūrvam** (\"before/earlier\") lets you reference something that came before the current action. It can also combine with a noun in the ablative: *bhojanāt pūrvam* = \"before the meal.\"\n\nThe beauty of these words is that they stack naturally. You can chain as many *tataḥ* steps as you need — *tataḥ...tataḥ...tataḥ...* — and it sounds perfectly normal, like \"then...then...then\" in spoken English. For variety, swap in *anantaram* or *tadanantaram* (\"immediately after that\") to break the rhythm.\n\n---\n\n## Example Phrases\n\n1. प्रथमं हस्तौ प्रक्षालयतु, ततः भोजनं करोतु।\n   *prathamaṃ hastau prakṣālayatu, tataḥ bhojanaṃ karotu.*\n   First wash your hands, then eat.\n\n2. ततः सः विद्यालयं गतवान्।\n   *tataḥ saḥ vidyālayaṃ gatavān.*\n   Then he went to school.\n\n3. अनन्तरं वयं चायं पीतवन्तः।\n   *anantaraṃ vayaṃ cāyaṃ pītavantaḥ.*\n   After that, we drank tea.\n\n4. अन्ते सर्वे गृहं प्रत्यागताः।\n   *ante sarve gṛhaṃ pratyāgatāḥ.*\n   Finally, everyone returned home.\n\n5. भोजनात् पूर्वं प्रार्थनां कुर्मः।\n   *bhojanāt pūrvaṃ prārthanāṃ kurmaḥ.*\n   Before the meal, we pray.\n\n6. प्रथमं श्रुत्वा ततः विचिन्त्य अनन्तरं वदतु।\n   *prathamaṃ śrutvā tataḥ vicintya anantaraṃ vadatu.*\n   First listen, then think, after that speak.\n\n7. पूर्वम् अहं दिल्ल्यां वसामि स्म।\n   *pūrvam ahaṃ dillyāṃ vasāmi sma.*\n   Earlier, I used to live in Delhi.\n\n8. प्रथमं तण्डुलान् प्रक्षालयतु, ततः जलं योजयतु, अन्ततः पचतु।\n   *prathamaṃ taṇḍulān prakṣālayatu, tataḥ jalaṃ yojayatu, antataḥ pacatu.*\n   First wash the rice, then add water, finally cook.\n\n9. सः प्रथमं सस्मित, ततः अवदत्।\n   *saḥ prathamaṃ sasmita, tataḥ avadat.*\n   He first smiled, then spoke.\n\n10. स्नानात् अनन्तरं वस्त्राणि धृतवान्।\n    *snānāt anantaraṃ vastrāṇi dhṛtavān.*\n    After the bath, he put on clothes.\n\n---\n\n## Mini-Dialogues\n\n**Dialogue 1: Giving directions**\n\n— क्षम्यतां, देवालयः कुत्र अस्ति?\n  *kṣamyatāṃ, devālayaḥ kutra asti?*\n  Excuse me, where is the temple?\n\n— प्रथमम् ऋजु गच्छतु। ततः वामे परिवर्ततु। अनन्तरं सेतुं पारयतु। अन्ते देवालयः दृश्यते।\n  *prathamam ṛju gacchatu. tataḥ vāme parivartatu. anantaraṃ setuṃ pārayatu. ante devālayaḥ dṛśyate.*\n  First go straight. Then turn left. After that, cross the bridge. Finally, the temple is visible.\n\n— बहु धन्यवादाः!\n  *bahu dhanyavādāḥ!*\n  Thank you very much!\n\n**Dialogue 2: Morning routine**\n\n— तव प्रातःकालः कथम् अस्ति?\n  *tava prātaḥkālaḥ katham asti?*\n  What is your morning like?\n\n— प्रथमम् उत्तिष्ठामि, ततः मुखं प्रक्षालयामि। अनन्तरं योगं करोमि।\n  *prathamam uttiṣṭhāmi, tataḥ mukhaṃ prakṣālayāmi. anantaraṃ yogaṃ karomi.*\n  First I get up, then I wash my face. After that I do yoga.\n\n— अन्ते प्रातःभोजनम्?\n  *ante prātaḥbhojanam?*\n  And finally, breakfast?\n\n— आम्! स्नानात् अनन्तरं भोजनं करोमि, ततः विद्यालयं गच्छामि।\n  *ām! snānāt anantaraṃ bhojanaṃ karomi, tataḥ vidyālayaṃ gacchāmi.*\n  Yes! After bathing I eat, then I go to school.\n\n---\n\n## Variations\n\n1. **tadanantaram** (\"immediately after that\") — A more emphatic form of *anantaram*:\n   *saḥ āgataḥ, tadanantaraṃ sarvaṃ parivartatam.* — He arrived, and immediately after, everything changed.\n\n2. **paścāt** (\"afterwards / later\") — Another sequencing word, useful for looser time connections:\n   *prathamaṃ paṭha, paścāt krīḍa.* — First study, later play.\n\n3. **ādau** (\"in the beginning / at first\") — A synonym for *prathamam*, slightly more literary:\n   *ādau kaṣṭam āsīt, parantu ante sāphalam.* — At first it was hard, but in the end, successful.\n\n---\n\n## Common Mistakes\n\n1. **Overusing *tataḥ* without *prathamam* or *ante*:** A chain of *tataḥ...tataḥ...tataḥ* is fine for two or three steps, but longer sequences feel flat. Anchor the beginning with *prathamam* and the end with *ante* or *antataḥ* to give the narrative shape.\n\n2. **Confusing *pūrvam* and *prathamam*:** *Prathamam* means \"first\" in a sequence — step one. *Pūrvam* means \"before\" or \"earlier\" and often references a past time or a point before another action. They overlap but are not identical: *pūrvam ahaṃ tatra vasāmi sma* (\"earlier I lived there\") vs. *prathamaṃ tatra gacchāmaḥ* (\"first we go there\").\n", "workbook-questions": "# Stage 18: First, Then, Finally — Workbook Questions\n\n**Total: 40 marks**\n\n---\n\n## Section A: Translate to Sanskrit (10 marks, 2 each)\n\nUse prathamam, tataḥ, anantaram, ante/antataḥ, and pūrvam as appropriate.\n\n1. First open the book, then read the lesson.\n2. Before sleeping, I drink warm milk.\n3. He first went to the market, then to the temple, and finally came home.\n4. After eating, we walked in the garden.\n5. Earlier I did not know Sanskrit, but now I speak it.\n\n---\n\n## Section B: Translate to English (10 marks, 2 each)\n\n1. prathamaṃ snānaṃ kuru, tataḥ pūjāṃ kuru.\n2. bhojanāt pūrvaṃ hastau prakṣālaya.\n3. saḥ prathamaṃ hasitavān, tataḥ roditavān, ante tu nirgatavān.\n4. anantaraṃ vayaṃ nagaraṃ draṣṭuṃ gatavantaḥ.\n5. ādau kaṣṭam āsīt, paścāt sulabham abhavat.\n\n---\n\n## Section C: Fill in the Blank (10 marks, 2 each)\n\n1. _______ jalaṃ uṣṇaṃ kuru, _______ cāya-patrāṇi yojaya. (First heat the water, then add tea leaves.)\n2. snānāt _______ vastrāṇi dhārayāmi. (After bathing, I wear clothes.)\n3. _______ sā grāme avasata. (Earlier, she lived in a village.)\n4. prathamaṃ śṛṇu, tataḥ vicāraya, _______ vada. (First listen, then think, finally speak.)\n5. vidyālayāt _______ gṛhakāryaṃ karomi. (After school, I do homework.)\n\n---\n\n## Section D: Build a Mini-Dialogue (5 marks, 2.5 each)\n\nWrite a 3-4 line dialogue in Sanskrit (IAST is fine) for each situation.\n\n1. **Situation:** Someone asks you how to make tea (cāyam). Give step-by-step instructions using prathamam, tataḥ, anantaram, and antataḥ.\n\n2. **Situation:** A friend asks what you did yesterday (hyaḥ). Narrate your day in order using sequencing words.\n\n---\n\n## Section E: Free Response (5 marks, 2.5 each)\n\n1. Describe the route from your home to a place you visit often (school, temple, market). Use at least three sequencing words and give directions in Sanskrit (3-4 sentences).\n\n2. The phrase *prathamaṃ śrutvā tataḥ vicintya anantaraṃ vadatu* (\"first listen, then think, then speak\") is practical advice. Write your own 3-step advice in Sanskrit using sequencing words, and explain why you chose those three steps.\n", "workbook-answers": "# Stage 18: First, Then, Finally — Workbook Answers\n\n---\n\n## Section A: Translate to Sanskrit\n\n1. prathamaṃ pustakaṃ udgāṭaya, tataḥ pāṭhaṃ paṭha.\n2. śayanāt pūrvaṃ uṣṇaṃ dugdhaṃ pibāmi.\n3. saḥ prathamaṃ āpaṇaṃ gatavān, tataḥ devālayaṃ gatavān, ante gṛhaṃ āgatavān.\n4. bhojanāt anantaraṃ vayam udyāne abhramaṃ.\n5. pūrvam ahaṃ saṃskṛtaṃ na jānāmi sma, kintu adhunā vadāmi.\n\n---\n\n## Section B: Translate to English\n\n1. First bathe, then do worship.\n2. Before the meal, wash your hands.\n3. He first laughed, then cried, and finally left.\n4. After that, we went to see the city.\n5. At first it was difficult, afterwards it became easy.\n\n---\n\n## Section C: Fill in the Blank\n\n1. **prathamaṃ** jalaṃ uṣṇaṃ kuru, **tataḥ** cāya-patrāṇi yojaya.\n2. snānāt **anantaraṃ** vastrāṇi dhārayāmi.\n3. **pūrvam** sā grāme avasata.\n4. prathamaṃ śṛṇu, tataḥ vicāraya, **ante** vada. (also acceptable: **antataḥ**)\n5. vidyālayāt **anantaraṃ** gṛhakāryaṃ karomi.\n\n---\n\n## Section D: Sample Mini-Dialogues\n\n**1. How to make tea:**\n\n— cāyaṃ kathaṃ racayāmi?\n  How do I make tea?\n\n— prathamaṃ jalaṃ pātre uṣṇaṃ kuru. tataḥ cāya-patrāṇi dugdhaṃ ca yojaya.\n  First heat water in a pot. Then add tea leaves and milk.\n\n— anantaraṃ kim?\n  After that, what?\n\n— anantaraṃ śarkarāṃ yojaya, antataḥ cālanyena cālaya. cāyaḥ siddhaḥ!\n  After that add sugar, finally strain with a strainer. The tea is ready!\n\n**2. What did you do yesterday?**\n\n— hyaḥ tvaṃ kiṃ kṛtavān?\n  What did you do yesterday?\n\n— prathamaṃ prātaḥ yogam akārṣam. tataḥ vidyālayaṃ gatavān.\n  First I did yoga in the morning. Then I went to school.\n\n— anantaram?\n  After that?\n\n— anantaraṃ mitreṇa saha krīḍitavān. ante gṛhe pustakaṃ paṭhitvā suptavān.\n  After that I played with a friend. Finally, at home I read a book and slept.\n\n---\n\n## Section E: Sample Responses\n\n**1. Route description:**\n\nmama gṛhāt prathamaṃ ṛjuṃ gacchāmi. tataḥ mahāmārgē dakṣiṇe parivartāmi. anantaraṃ dvau kṣetrau atikramya āpaṇaṃ paśyāmi. ante vāme parivartya devālayaḥ samīpe eva asti.\n\n(From my home, first I go straight. Then at the main road I turn right. After that, passing two fields, I see the market. Finally, turning left, the temple is right nearby.)\n\n**2. Three-step advice:**\n\n*prathamaṃ paśya, tataḥ jānīhi, anantaraṃ kuru.* — First observe, then understand, then act.\n\nI chose these three steps because most mistakes come from acting without understanding, and most misunderstanding comes from not observing carefully. The sequence forces patience — you must look before you know, and know before you do. It applies to cooking, to learning, and to life.\n"}, "tabs": ["theory", "workbook-questions", "workbook-answers"]}, {"id": "conv-19-comparing", "number": 19, "title": "Comparing", "subtitle": "uttamam, iva, sadṛśam", "files": {"theory": "# Stage 19: Comparing\n\n## Pattern Name: \"X is better / X is like Y\"\n\n---\n\n## The Pattern\n\n**X Y-āt uttamam asti** — \"X is better than Y\"\n**X Y-iva asti** — \"X is like Y\"\n**X Y-sadṛśam** — \"X is similar to Y\"\n**sarvottamam** — \"best of all\"\n\n---\n\n## How It Works\n\nWhen you want to say \"better than,\" Sanskrit uses the ablative case on the thing you're comparing against. So \"than Y\" becomes *Y-āt* (for masculine/neuter -a stems). The word *uttama* (best/better) or *śreṣṭha* (excellent) sits next to the thing you're praising. For \"like,\" you just drop *iva* right after the thing you're comparing to -- it works like a postposition. And *sadṛśam* (\"similar to\") takes the thing compared in the instrumental or genitive.\n\nFor superlatives (\"the best of all\"), you use *sarvottama* or *sarveṣu śreṣṭha*. The comparative suffix *-tara* means \"more\" and *-tama* means \"most.\" So *madhura* (sweet) becomes *madhuratara* (sweeter) and *madhuratama* (sweetest). Simple lego: snap -tara or -tama onto the adjective.\n\n---\n\n## Example Phrases\n\n1. **एतत् भोजनं तस्मात् भोजनात् उत्तमम् अस्ति।**\n   *etat bhojanaṃ tasmāt bhojanāt uttamam asti.*\n   This food is better than that food.\n\n2. **चायं कॉफ़ीतः मधुरतरम् अस्ति।**\n   *cāyaṃ kŏphītaḥ madhurataram asti.*\n   Tea is sweeter than coffee.\n\n3. **तव गृहं मम गृहात् विशालतरम् अस्ति।**\n   *tava gṛhaṃ mama gṛhāt viśālataram asti.*\n   Your house is bigger than my house.\n\n4. **सा तस्याः मातुः इव सुन्दरा अस्ति।**\n   *sā tasyāḥ mātuḥ iva sundarā asti.*\n   She is beautiful like her mother.\n\n5. **अयं नगरं स्वर्गसदृशम् अस्ति।**\n   *ayaṃ nagaraṃ svargasadṛśam asti.*\n   This city is like heaven.\n\n6. **सर्वेषु फलेषु आम्रं सर्वोत्तमम् अस्ति।**\n   *sarveṣu phaleṣu āmraṃ sarvottamam asti.*\n   Among all fruits, mango is the best.\n\n7. **संस्कृतं ग्रीकभाषातः प्राचीनतरम् अस्ति।**\n   *saṃskṛtaṃ grīkabhāṣātaḥ prācīnataram asti.*\n   Sanskrit is more ancient than Greek.\n\n8. **अद्य हिमालयः मेघैः इव शोभते।**\n   *adya himālayaḥ meghaiḥ iva śobhate.*\n   Today the Himalayas look like clouds.\n\n9. **एषः छात्रः सर्वेषु छात्रेषु बुद्धिमत्तमः अस्ति।**\n   *eṣaḥ chātraḥ sarveṣu chātreṣu buddhimattamaḥ asti.*\n   This student is the most intelligent among all students.\n\n10. **पादचारः वाहनात् स्वास्थ्यकरतरः अस्ति।**\n    *pādacāraḥ vāhanāt svāsthyakarataraḥ asti.*\n    Walking is healthier than driving.\n\n---\n\n## Mini-Dialogues\n\n**Dialogue 1: At a restaurant**\n\n-- किम् इच्छसि? पनीरं वा दालम्?\n   *kim icchasi? panīraṃ vā dālam?*\n   What do you want? Paneer or dal?\n\n-- दालं पनीरात् लघुतरम् अस्ति। दालम् इच्छामि।\n   *dālaṃ panīrāt laghutaram asti. dālam icchāmi.*\n   Dal is lighter than paneer. I want dal.\n\n-- आम्, किन्तु अत्र पनीरं सर्वोत्तमम् अस्ति!\n   *ām, kintu atra panīraṃ sarvottamam asti!*\n   Yes, but here the paneer is the best!\n\n**Dialogue 2: Comparing cities**\n\n-- वाराणसी कीदृशी अस्ति?\n   *vārāṇasī kīdṛśī asti?*\n   What is Varanasi like?\n\n-- वाराणसी स्वप्नसदृशी अस्ति। सा दिल्लीतः शान्ततरा अस्ति।\n   *vārāṇasī svapnasadṛśī asti. sā dillītaḥ śāntatarā asti.*\n   Varanasi is like a dream. It is more peaceful than Delhi.\n\n-- सा मम प्रियतमा नगरी अस्ति।\n   *sā mama priyatamā nagarī asti.*\n   It is my most favorite city.\n\n---\n\n## Variations\n\n1. **Using śreṣṭha instead of uttama:**\n   *etat pustakam anyebhyaḥ śreṣṭham asti* — \"This book is better than the others.\"\n\n2. **Double comparison with api (even):**\n   *saḥ tvaттaḥ api uccataraḥ asti* — \"He is even taller than you.\"\n\n3. **Negative comparison with na tādṛśam:**\n   *etat tat na tādṛśam asti* — \"This is not like that.\"\n\n---\n\n## Common Mistakes\n\n1. **Forgetting the ablative:** Learners often say *rāmaḥ śyāma uttamaḥ* instead of *rāmaḥ śyāmāt uttamaḥ*. The \"-āt\" ending on the compared thing is non-negotiable -- without it, you're just listing two people, not comparing them.\n\n2. **Mixing up -tara and -tama:** Remember *-tara* is \"more\" (comparing two) and *-tama* is \"most\" (comparing many). Saying *sarvottaraḥ* when you mean \"best of all\" is a common slip -- you want *sarvottamaḥ*.\n", "workbook-questions": "# Stage 19: Comparing — Workbook Questions\n\n**Total: 40 marks**\n\n---\n\n## Section A: Translate to Sanskrit (10 marks, 2 each)\n\n1. This fruit is sweeter than that fruit.\n2. She is taller than her brother.\n3. Among all rivers, the Ganga is the best.\n4. Your garden is like a forest.\n5. This village is more peaceful than the city.\n\n---\n\n## Section B: Translate to English (10 marks, 2 each)\n\n1. संस्कृतं हिन्दीतः कठिनतरम् अस्ति।\n   *saṃskṛtaṃ hindītaḥ kaṭhinataram asti.*\n\n2. सः सिंहः इव बलवान् अस्ति।\n   *saḥ siṃhaḥ iva balavān asti.*\n\n3. सर्वेषु ऋतुषु वसन्तः सर्वोत्तमः अस्ति।\n   *sarveṣu ṛtuṣu vasantaḥ sarvottamaḥ asti.*\n\n4. तव स्वरः वीणासदृशः अस्ति।\n   *tava svaraḥ vīṇāsadṛśaḥ asti.*\n\n5. अद्य श्वस्तात् उष्णतरम् अस्ति।\n   *adya śvastāt uṣṇataram asti.*\n\n---\n\n## Section C: Fill in the Blank (10 marks, 2 each)\n\n1. एतत् पुस्तकं तस्मात् पुस्तकात् __________ अस्ति। (interesting → use -tara)\n   *etat pustakaṃ tasmāt pustakāt __________ asti.*\n\n2. सा हंसः __________ चलति। (like a swan)\n   *sā haṃsaḥ __________ calati.*\n\n3. सर्वेषु वृक्षेषु वटवृक्षः __________ अस्ति। (the greatest)\n   *sarveṣu vṛkṣeṣu vaṭavṛkṣaḥ __________ asti.*\n\n4. मम गृहं तव गृह__________ लघुतरम् अस्ति। (than — supply the ablative ending)\n   *mama gṛhaṃ tava gṛha__________ laghutaram asti.*\n\n5. एषा नदी समुद्र__________ अस्ति। (similar to the ocean)\n   *eṣā nadī samudra__________ asti.*\n\n---\n\n## Section D: Build a Mini-Dialogue (6 marks, 3 each)\n\n1. **Prompt:** Two friends are deciding which movie to watch. One says the comedy is funnier, the other says the action film is the best of all. Write 3-4 lines.\n\n2. **Prompt:** A teacher asks a student to compare two seasons. The student says summer is hotter than winter but the rainy season is like magic. Write 3-4 lines.\n\n---\n\n## Section E: Free Response (4 marks, 2 each)\n\n1. Compare your favorite food to another food. Use at least one ablative comparison (-āt + adjective-tara) and one superlative (sarvottama or -tama). Write 2-3 sentences in Sanskrit.\n\n2. Describe someone you admire using *iva* (like) and *sadṛśa* (similar to). Write 2-3 sentences in Sanskrit.\n", "workbook-answers": "# Stage 19: Comparing — Workbook Answers\n\n---\n\n## Section A: Translate to Sanskrit\n\n1. **एतत् फलं तस्मात् फलात् मधुरतरम् अस्ति।**\n   *etat phalaṃ tasmāt phalāt madhurataram asti.*\n\n2. **सा तस्याः भ्रातुः उच्चतरा अस्ति।**\n   *sā tasyāḥ bhrātuḥ uccatarā asti.*\n\n3. **सर्वासु नदीषु गङ्गा सर्वोत्तमा अस्ति।**\n   *sarvāsu nadīṣu gaṅgā sarvottamā asti.*\n\n4. **तव उद्यानं वनसदृशम् अस्ति।**\n   *tava udyānaṃ vanasadṛśam asti.*\n   (Also acceptable: *tava udyānaṃ vanam iva asti.*)\n\n5. **एतत् ग्रामं नगरात् शान्ततरम् अस्ति।**\n   *etat grāmaṃ nagarāt śāntataram asti.*\n\n---\n\n## Section B: Translate to English\n\n1. Sanskrit is harder than Hindi.\n\n2. He is strong like a lion.\n\n3. Among all seasons, spring is the best.\n\n4. Your voice is like a veena.\n\n5. Today is hotter than tomorrow.\n\n---\n\n## Section C: Fill in the Blank\n\n1. **रोचकतरम्** (*rocakataram*) — more interesting\n\n2. **इव** (*iva*) — like\n\n3. **सर्वोत्तमः** (*sarvottamaḥ*) — the greatest\n\n4. **आत्** (*āt*) — full form: *tava gṛhāt* — than your house\n\n5. **सदृशी** (*sadṛśī*) — full form: *samudrasadṛśī* — similar to the ocean\n\n---\n\n## Section D: Build a Mini-Dialogue\n\n**1. Movie night:**\n\n-- हास्यचित्रं किम् इच्छसि? एतत् तस्मात् हास्यतरम् अस्ति।\n   *hāsyacitraṃ kim icchasi? etat tasmāt hāsyataram asti.*\n   Do you want the comedy? This one is funnier than that one.\n\n-- न, क्रियाचित्रं सर्वोत्तमम् अस्ति। तत् पश्यावः।\n   *na, kriyācitraṃ sarvottamam asti. tat paśyāvaḥ.*\n   No, the action film is the best of all. Let's watch that.\n\n-- आम्, तत् सिंहः इव तीव्रम् अस्ति!\n   *ām, tat siṃhaḥ iva tīvram asti!*\n   Yes, it is intense like a lion!\n\n**2. Comparing seasons:**\n\n-- ऋतून् तुलय। ग्रीष्मः शीतकालात् कीदृशः?\n   *ṛtūn tulaya. grīṣmaḥ śītakālāt kīdṛśaḥ?*\n   Compare the seasons. How is summer compared to winter?\n\n-- ग्रीष्मः शीतकालात् उष्णतरः अस्ति।\n   *grīṣmaḥ śītakālāt uṣṇataraḥ asti.*\n   Summer is hotter than winter.\n\n-- वर्षाकालः कीदृशः?\n   *varṣākālaḥ
