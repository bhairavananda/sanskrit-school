logue (5 marks)\n\n**Prompt 1:** A parent asks a child about their habits. The child says they always brush their teeth but sometimes forget to drink water. The parent says \"never forget water!\" Write 3-4 lines.\n\n**Prompt 2:** Two friends compare how often they visit a temple. One says \"every day,\" the other says \"rarely — but I usually pray at home.\" Write 3-4 lines.\n\n---\n\n## Section E: Free Response (5 marks)\n\n1. Describe three habits of yours using three different frequency words (e.g., sadā, kadācit, na kadāpi, pratyaham, prāyaḥ). Write in Sanskrit with IAST and English.\n\n2. Tell a short anecdote starting with ekadā (once). Write 2-3 sentences in Sanskrit describing something that happened to you.\n", "workbook-answers": "# Stage 27: Always / Sometimes / Never — Answer Key\n\n---\n\n## Section A: Translate to Sanskrit (10 marks)\n\n1. सा सदा सत्यं वदति। (sā sadā satyaṃ vadati.)\n2. अहं कदाचित् रात्रौ पठामि। (ahaṃ kadācit rātrau paṭhāmi.)\n3. सः न कदापि मिष्टान्नं खादति। (saḥ na kadāpi miṣṭānnaṃ khādati.)\n4. वयं प्रत्यहम् अभ्यासं कुर्मः। (vayaṃ pratyaham abhyāsaṃ kurmaḥ.)\n5. एकदा अहं वने व्याघ्रम् अपश्यम्। (ekadā ahaṃ vane vyāghram apaśyam.)\n\n---\n\n## Section B: Translate to English (10 marks)\n\n1. He usually arrives late.\n2. They ask the same question again and again.\n3. I rarely eat sweets.\n4. She never gets angry.\n5. Once a sage lived here.\n\n---\n\n## Section C: Fill in the Blank (10 marks)\n\n1. **प्रत्यहम्** (pratyaham) — I study Sanskrit every day.\n2. **कदाचित् ... कदाचित्** (kadācit ... kadācit) — She sometimes laughs, sometimes cries.\n3. **न कदापि** (na kadāpi) — My grandfather never spoke a lie.\n4. **एकदा** (ekadā) — Once there was a king.\n5. **पुनः पुनः** (punaḥ punaḥ) — The boy plays that game again and again.\n\n---\n\n## Section D: Build a Mini-Dialogue (5 marks)\n\n**Prompt 1 — Sample:**\n\n> **माता** — त्वं प्रत्यहं दन्तान् मार्जयसि किम्? (tvaṃ pratyahaṃ dantān mārjayasi kim?)\n> \"Do you brush your teeth every day?\"\n>\n> **बालकः** — आम्, सदा मार्जयामि। किन्तु कदाचित् जलपानं विस्मरामि। (ām, sadā mārjayāmi. kintu kadācit jalapānaṃ vismarāmi.)\n> \"Yes, I always brush. But I sometimes forget to drink water.\"\n>\n> **माता** — जलं न कदापि विस्मर! शरीरस्य कृते आवश्यकम्। (jalaṃ na kadāpi vismara! śarīrasya kṛte āvaśyakam.)\n> \"Never forget water! It's necessary for the body.\"\n>\n> **बालकः** — आम् माते, प्रत्यहं पास्यामि। (ām māte, pratyahaṃ pāsyāmi.)\n> \"Yes mother, I will drink every day.\"\n\n**Prompt 2 — Sample:**\n\n> **क:** अहं प्रत्यहं मन्दिरं गच्छामि। त्वम्? (ahaṃ pratyahaṃ mandiraṃ gacchāmi. tvam?)\n> \"I go to the temple every day. You?\"\n>\n> **ख:** अहं विरलं मन्दिरं गच्छामि। (ahaṃ viralaṃ mandiraṃ gacchāmi.)\n> \"I rarely go to the temple.\"\n>\n> **क:** तर्हि प्रार्थनां कदा करोषि? (tarhi prārthanāṃ kadā karoṣi?)\n> \"Then when do you pray?\"\n>\n> **ख:** अहं प्रायः गृहे एव प्रार्थयामि। (ahaṃ prāyaḥ gṛhe eva prārthayāmi.)\n> \"I usually pray at home itself.\"\n\n---\n\n## Section E: Free Response — Sample Answers (5 marks)\n\n**1. Three habits:**\n\n- अहं प्रत्यहं प्रातः चायं पिबामि। (ahaṃ pratyahaṃ prātaḥ cāyaṃ pibāmi.) — \"I drink tea every morning.\"\n- अहं कदाचित् रात्रौ भ्रमणाय गच्छामि। (ahaṃ kadācit rātrau bhramaṇāya gacchāmi.) — \"I sometimes go for a walk at night.\"\n- अहं न कदापि मद्यं पिबामि। (ahaṃ na kadāpi madyaṃ pibāmi.) — \"I never drink alcohol.\"\n\n**2. An anecdote with ekadā:**\n\n- एकदा अहं बाल्ये वने भ्रान्तः। (ekadā ahaṃ bālye vane bhrāntaḥ.) — \"Once in my childhood I got lost in a forest.\"\n- अहं पुनः पुनः मातरम् अवदम् किन्तु कोऽपि न अशृणोत्। (ahaṃ punaḥ punaḥ mātaram avadam kintu ko'pi na aśṛṇot.) — \"I called out for mother again and again but no one heard.\"\n- ततः एकः वृद्धः मां गृहं प्रापयत्। (tataḥ ekaḥ vṛddhaḥ māṃ gṛhaṃ prāpayat.) — \"Then an old man brought me home.\"\n"}, "tabs": ["theory", "workbook-questions", "workbook-answers"]}, {"id": "conv-28-reported-speech", "number": 28, "title": "Reported Speech", "subtitle": "saḥ avadat yat..., iti", "files": {"theory": "# Stage 28: Reported Speech\n\n**Pattern: saḥ avadat yat... / ...iti saḥ avadat**\n\n---\n\n## The Pattern\n\nSanskrit gives you **two ways** to report what someone said:\n\n| Method | Template | Style |\n|--------|----------|-------|\n| Direct (with *iti*) | **\"...\"** ***iti*** **saḥ avadat** | Classic, literary |\n| Indirect (with *yat*) | **saḥ avadat** ***yat...*** | Conversational |\n\nThink of *iti* as a closing quotation mark that comes AFTER the quote. Think of *yat* as the English word \"that\" in \"he said that...\"\n\n---\n\n## How It Works\n\n**Direct speech with *iti*:** You put the exact words first, then *iti*, then the speaking verb. The quoted words stay exactly as the speaker said them — first person, present tense, everything. \"ahaṃ gacchāmi\" iti saḥ avadat = He said, \"I am going.\"\n\n**Indirect speech with *yat*:** You start with the speaking verb, add *yat*, then rephrase. Pronouns shift (aham → saḥ), and the perspective changes to the reporter's viewpoint. saḥ avadat yat saḥ gacchati = He said that he goes. This is the more natural pattern in everyday Sanskrit conversation.\n\nFor **reported questions**, use *kim* after the asking verb: saḥ apṛcchat kim tvaṃ gacchasi? = He asked whether you are going.\n\n---\n\n## Example Phrases\n\n1. **\"अहं श्वः आगमिष्यामि\" इति सा अवदत्**\n   \"ahaṃ śvaḥ āgamiṣyāmi\" iti sā avadat\n   *She said, \"I will come tomorrow.\"*\n\n2. **सः अवदत् यत् सः श्वः आगमिष्यति**\n   saḥ avadat yat saḥ śvaḥ āgamiṣyati\n   *He said that he would come tomorrow.*\n\n3. **श्रुतं मया यत् परीक्षा स्थगिता**\n   śrutaṃ mayā yat parīkṣā sthagitā\n   *I heard that the exam is postponed.*\n\n4. **\"किं भवान् सिद्धः?\" इति सा अपृच्छत्**\n   \"kiṃ bhavān siddhaḥ?\" iti sā apṛcchat\n   *She asked, \"Are you ready?\"*\n\n5. **ते वदन्ति यत् वृष्टिः आगमिष्यति**\n   te vadanti yat vṛṣṭiḥ āgamiṣyati\n   *They say that rain will come.*\n\n6. **तस्य मते एतत् कार्यं कठिनम् अस्ति**\n   tasya mate etat kāryaṃ kaṭhinam asti\n   *In his opinion, this work is difficult.*\n\n7. **\"मम सहायं कुरु\" इति बालः अक्रन्दत्**\n   \"mama sahāyaṃ kuru\" iti bālaḥ akrandat\n   *The boy cried, \"Help me!\"*\n\n8. **सः अवदत् यत् आगमिष्यति किन्तु न आगच्छत्**\n   saḥ avadat yat āgamiṣyati kintu na āgacchat\n   *He said he would come but didn't come.*\n\n9. **गुरुः अपृच्छत् किं छात्राः पाठं पठितवन्तः**\n   guruḥ apṛcchat kiṃ chātrāḥ pāṭhaṃ paṭhitavantaḥ\n   *The teacher asked whether the students had read the lesson.*\n\n10. **\"सर्वं कुशलम्\" इति सः प्रत्यवदत्**\n    \"sarvaṃ kuśalam\" iti saḥ pratyavadat\n    *He replied, \"All is well.\"*\n\n---\n\n## Mini-Dialogues\n\n**Dialogue 1: The rumor**\n\n**राहुलः:** श्रुतं मया यत् नूतनः आचार्यः आगतः। किम् एतत् सत्यम्?\nrāhulaḥ: śrutaṃ mayā yat nūtanaḥ ācāryaḥ āgataḥ. kim etat satyam?\n*Rahul: I heard that a new teacher has arrived. Is this true?*\n\n**मीरा:** आम्, सीता अवदत् यत् सः अद्य प्रथमं पाठम् अपाठयत्।\nmīrā: ām, sītā avadat yat saḥ adya prathamaṃ pāṭham apāṭhayat.\n*Meera: Yes, Sita said that he taught the first lesson today.*\n\n**राहुलः:** \"सः अतीव रोचते\" इति कश्चित् अवदत्।\nrāhulaḥ: \"saḥ atīva rocate\" iti kaścit avadat.\n*Rahul: Someone said, \"He is very likeable.\"*\n\n---\n\n**Dialogue 2: Broken promise**\n\n**अनिलः:** किम् अभवत्? रामः कुत्र अस्ति?\nanilaḥ: kim abhavat? rāmaḥ kutra asti?\n*Anil: What happened? Where is Ram?*\n\n**सुमा:** सः अवदत् यत् अष्टवादने आगमिष्यति। किन्तु इदानीं दशवादनम्, सः न आगच्छत्।\nsumā: saḥ avadat yat aṣṭavādane āgamiṣyati. kintu idānīṃ daśavādanam, saḥ na āgacchat.\n*Suma: He said he would come at eight. But now it's ten, and he didn't come.*\n\n**अनिलः:** \"मा चिन्तयतु\" इति सः सदा वदति, किन्तु सदा विलम्बते!\nanilaḥ: \"mā cintayatu\" iti saḥ sadā vadati, kintu sadā vilambate!\n*Anil: He always says \"don't worry,\" but he's always late!*\n\n---\n\n## Variations\n\n- **mama mate** / **tasya mate** / **teṣāṃ mate** — \"in my / his / their opinion\" — a softer way to attribute a view without direct quotation.\n- **kathayati yat...** — using *kathayati* (tells/narrates) instead of *vadati* (says) for storytelling contexts.\n- **iti kila** — \"so they say\" / \"reportedly\" — *kila* adds hearsay flavor, signaling you're not vouching for the truth.\n\n---\n\n## Common Mistakes\n\n1. **Putting *iti* before the quote.** In Sanskrit, *iti* is a CLOSER, not an opener. The quote always comes first: ✓ \"gacchāmi\" iti saḥ avadat. ✗ iti \"gacchāmi\" saḥ avadat.\n\n2. **Forgetting to shift pronouns in indirect speech.** If Ram said \"I (aham) will go,\" your indirect report should be \"Ram said that *he* (saḥ) will go\" — just like English. Direct with *iti* keeps the original pronouns; indirect with *yat* shifts them.\n", "workbook-questions": "# Stage 28: Reported Speech — Workbook\n\n---\n\n## Section A: Translate to Sanskrit (10 marks)\n\nUse either the *iti* (direct) or *yat* (indirect) pattern as indicated.\n\n1. She said, \"I am happy.\" *(use iti)*\n2. He said that he will come tomorrow. *(use yat)*\n3. I heard that the shop is closed. *(use yat)*\n4. The teacher asked, \"Did you read the book?\" *(use iti)*\n5. In her opinion, this food is excellent. *(use tasyāḥ mate)*\n\n---\n\n## Section B: Translate to English (10 marks)\n\n1. \"ahaṃ na jānāmi\" iti sā avadат — \"अहं न जानामि\" इति सा अवदत्\n2. te vadanti yat nagaraṃ sundaraṃ asti — ते वदन्ति यत् नगरं सुन्दरं अस्ति\n3. śrutaṃ mayā yat saḥ gatvān — श्रुतं मया यत् सः गतवान्\n4. guruḥ apṛcchat kiṃ chātrāḥ siddhaḥ — गुरुः अपृच्छत् किं छात्राः सिद्धाः\n5. \"śvaḥ āgacchāmi\" iti saḥ avadat kintu na āgacchat — \"श्वः आगच्छामि\" इति सः अवदत् किन्तु न आगच्छत्\n\n---\n\n## Section C: Fill in the Blank (10 marks)\n\n1. \"ahaṃ kṣudhitaḥ asmi\" ______ bālaḥ avadat.\n   *(The boy said, \"I am hungry.\" — fill the quotation marker)*\n\n2. sā avadat ______ sā śvaḥ āgamiṣyati.\n   *(She said that she would come tomorrow. — fill the complementizer)*\n\n3. ______ mayā yat vṛṣṭiḥ āgamiṣyati.\n   *(I heard that rain will come. — fill the verbal phrase)*\n\n4. tasya ______ etat kāryaṃ sugamam asti.\n   *(In his opinion, this work is easy. — fill the word for \"opinion\")*\n\n5. saḥ ______ kiṃ tvaṃ saṃskṛtaṃ vadasi.\n   *(He asked whether you speak Sanskrit. — fill the verb of asking)*\n\n---\n\n## Section D: Build a Mini-Dialogue (6 marks)\n\n**D1.** Write a 3-4 line dialogue where one friend tells another what their mother said about dinner plans. Use at least one *iti* construction and one *yat* construction.\n\n**D2.** Write a 3-4 line dialogue where a student reports to a classmate what the teacher said about the exam, but the information turns out to be wrong. Use the pattern \"saḥ avadat yat... kintu...\"\n\n---\n\n## Section E: Free Response (4 marks)\n\n**E1.** Report a piece of news you heard recently using *śrutaṃ mayā yat...* Write 2-3 sentences expanding on it.\n\n**E2.** Write 2-3 sentences contrasting what someone promised versus what actually happened, using both *iti* and *yat* patterns.\n", "workbook-answers": "# Stage 28: Reported Speech — Answer Key\n\n---\n\n## Section A: Translate to Sanskrit (10 marks)\n\n1. \"ahaṃ prasannā asmi\" iti sā avadat.\n   \"अहं प्रसन्ना अस्मि\" इति सा अवदत्।\n\n2. saḥ avadat yat saḥ śvaḥ āgamiṣyati.\n   सः अवदत् यत् सः श्वः आगमिष्यति।\n\n3. śrutaṃ mayā yat āpaṇaḥ pihitaḥ asti.\n   श्रुतं मया यत् आपणः पिहितः अस्ति।\n\n4. \"kiṃ tvam pustakam apaṭhaḥ?\" iti ācāryaḥ apṛcchat.\n   \"किं त्वम् पुस्तकम् अपठः?\" इति आचार्यः अपृच्छत्।\n\n5. tasyāḥ mate etat bhojanaṃ śreṣṭham asti.\n   तस्याः मते एतत् भोजनं श्रेष्ठम् अस्ति।\n\n---\n\n## Section B: Translate to English (10 marks)\n\n1. She said, \"I don't know.\"\n2. They say that the city is beautiful.\n3. I heard that he has gone.\n4. The teacher asked whether the students are ready.\n5. He said \"I'll come tomorrow\" but didn't come.\n\n---\n\n## Section C: Fill in the Blank (10 marks)\n\n1. **iti** — \"ahaṃ kṣudhitaḥ asmi\" **iti** bālaḥ avadat.\n2. **yat** — sā avadat **yat** sā śvaḥ āgamiṣyati.\n3. **śrutam** — **śrutam** mayā yat vṛṣṭiḥ āgamiṣyati.\n4. **mate** — tasya **mate** etat kāryaṃ sugamam asti.\n5. **apṛcchat** — saḥ **apṛcchat** kiṃ tvaṃ saṃskṛtaṃ vadasi.\n\n---\n\n## Section D: Build a Mini-Dialogue (6 marks)\n\n**D1.** Sample:\n\n**rāmaḥ:** adya kiṃ bhojanaṃ bhavati?\n**sītā:** mama mātā avadat yat adya bāhyabhojanaṃ kariṣyāmaḥ.\n**rāmaḥ:** sā kim avadat kutra gamiṣyāmaḥ iti?\n**sītā:** \"nūtane bhojanālaye gamiṣyāmaḥ\" iti sā avadat.\n\n*(Ram: What's for dinner today? / Sita: My mother said that we'll eat out today. / Ram: Did she say where we'll go? / Sita: She said, \"We'll go to the new restaurant.\")*\n\n**D2.** Sample:\n\n**anilaḥ:** guruḥ avadat yat parīkṣā śukriyavāsare bhavati.\n**priyā:** kintu adya guruḥ avadat yat parīkṣā somiravāsare bhavati!\n**anilaḥ:** saḥ avadat yat śukriyavāsare bhavati kintu idānīṃ somiravāsare iti? kaṣṭam!\n**priyā:** āṃ, idānīṃ adhikaṃ paṭhanīyam!\n\n*(Anil: The teacher said the exam is on Friday. / Priya: But today the teacher said the exam is on Monday! / Anil: He said Friday but now Monday? Oh no! / Priya: Yes, now we need to study more!)*\n\n---\n\n## Section E: Free Response — Sample Answers (4 marks)\n\n**E1.** śrutaṃ mayā yat nūtanaḥ saṅgaṇakaḥ āgataḥ. mama mitram avadat yat saḥ atīva śīghraḥ asti. \"sarve janāḥ taṃ kretum icchanti\" iti saḥ avadat.\n\n*(I heard that a new computer has arrived. My friend said that it is very fast. He said, \"Everyone wants to buy it.\")*\n\n**E2.** mama mitraṃ \"ahaṃ pustakaṃ pratyarpayiṣyāmi\" iti avadat. saḥ avadat yat ekasminn saptāhe pratyarpayiṣyati. kintu dvau māsau atītau, pustakaṃ na pratyāgataṃ!\n\n*(My friend said, \"I will return the book.\" He said that he would return it in one week. But two months have passed, and the book hasn't come back!)*\n"}, "tabs": ["theory", "workbook-questions", "workbook-answers"]}, {"id": "conv-29-clarifying", "number": 29, "title": "Clarifying & Repairing", "subtitle": "punaḥ vadatu, ko'rthaḥ?", "files": {"theory": "# Stage 29: Clarifying & Repairing\n\n**Pattern: punaḥ vadatu / na avagatam / ko'rthaḥ?**\n\n---\n\n## The Pattern\n\nThese are your **survival tools** for real conversation. When you mishear, blank on a word, or need something repeated, these phrases keep you in Sanskrit instead of bailing out to English.\n\n| Phrase | IAST | Use |\n|--------|------|-----|\n| Say that again (polite) | punaḥ vadatu | Requesting repetition |\n| I don't understand | na avagacchāmi | Present confusion |\n| I didn't understand | na avagatam | Past confusion |\n| What does it mean? | kim arthaḥ? / ko'rthaḥ? | Asking meaning |\n| That is to say... | arthāt... | Rephrasing/clarifying |\n| How do you say...? | kathaṃ ucyate? | Asking for a word |\n| Speak slowly | śanaiḥ vadatu | Slowing pace |\n| Sorry, say again | kṣamyatām, punaḥ vadatu | Polite repeat request |\n\n---\n\n## How It Works\n\n**punaḥ vadatu** uses the polite imperative — technically the 3rd-person command form (\"let him/her speak\"), but used as a respectful \"you\" form, like Hindi's *āp*-style address. For casual \"you,\" say **punar vada**.\n\n**avagacchāmi** is *ava* + *gam* — literally \"go into,\" meaning \"understand.\" The past form **avagatam** (literally \"it was understood\") is a neat impersonal construction: \"understanding happened (to me).\" Add **na** and you get a clean \"I didn't get that.\"\n\n**ko'rthaḥ** is a sandhi of *kaḥ arthaḥ* — \"what (is the) meaning?\" You can prefix any word: **'dharma'-śabdasya ko'rthaḥ?** = \"What is the meaning of the word 'dharma'?\"\n\n**śanaiḥ** is the instrumental plural of *śanai*, used as an adverb meaning \"slowly.\" **arthāt** is the ablative of *artha*, functioning as \"that is to say\" or \"meaning...\"\n\n---\n\n## Example Phrases\n\n1. **क्षम्यताम्, पुनः वदतु**\n   kṣamyatām, punaḥ vadatu\n   *Sorry, say that again.*\n\n2. **न अवगतम्। कृपया शनैः वदतु**\n   na avagatam. kṛpayā śanaiḥ vadatu\n   *I didn't understand. Please speak slowly.*\n\n3. **'धर्म'-शब्दस्य कोऽर्थः?**\n   'dharma'-śabdasya ko'rthaḥ?\n   *What is the meaning of the word 'dharma'?*\n\n4. **'book' इति संस्कृते कथम् उच्यते?**\n   'book' iti saṃskṛte katham ucyate?\n   *How do you say 'book' in Sanskrit?*\n\n5. **अर्थात् सः न आगमिष्यति**\n   arthāt saḥ na āgamiṣyati\n   *That is to say, he won't come.*\n\n6. **त्वं किम् अवदः? न अवगच्छामि**\n   tvaṃ kim avadaḥ? na avagacchāmi\n   *What did you say? I don't understand.*\n\n7. **किं पुनः वक्तुं शक्नोषि?**\n   kiṃ punaḥ vaktuṃ śaknoṣi?\n   *Can you repeat that?*\n\n8. **इदानीं अवगतम्। धन्यवादः**\n   idānīṃ avagatam. dhanyavādaḥ\n   *Now I understood. Thank you.*\n\n9. **एतत् पदं किम् अर्थं वहति?**\n   etat padaṃ kim arthaṃ vahati?\n   *What meaning does this word carry?*\n\n10. **कृपया स्पष्टं वदतु**\n    kṛpayā spaṣṭaṃ vadatu\n    *Please speak clearly.*\n\n---\n\n## Mini-Dialogues\n\n**Dialogue 1: The unknown word**\n\n**छात्रः:** गुरो, 'विमर्शः' इति पदस्य कोऽर्थः?\nchātraḥ: guro, 'vimarśaḥ' iti padasya ko'rthaḥ?\n*Student: Teacher, what is the meaning of the word 'vimarśa'?*\n\n**गुरुः:** विमर्शः अर्थात् 'विचारः' इति। 'reflection' इति आङ्ग्ले उच्यते।\nguruḥ: vimarśaḥ arthāt 'vicāraḥ' iti. 'reflection' iti āṅgle ucyate.\n*Teacher: Vimarśa, that is to say, 'thought/reflection.' In English it's called 'reflection.'*\n\n**छात्रः:** इदानीम् अवगतम्। धन्यवादः गुरो।\nchātraḥ: idānīm avagatam. dhanyavādaḥ guro.\n*Student: Now I understand. Thank you, teacher.*\n\n---\n\n**Dialogue 2: Too fast!**\n\n**सुमा:** ह्यः अहं नगरं गतवती तत्र मया बहूनि वस्तूनि क्रीतानि मम भगिनी अपि आगतवती आवां बहु विनोदम् अकुर्वाव...\nsumā: hyaḥ ahaṃ nagaraṃ gatavatī tatra mayā bahūni vastūni krītāni mama bhaginī api āgatavatī āvāṃ bahu vinodam akurvāva...\n*Suma: Yesterday I went to the city and I bought many things and my sister also came and we had lots of fun...*\n\n**रामः:** शनैः शनैः! कृपया पुनः वदतु। त्वं बहु शीघ्रं वदसि!\nrāmaḥ: śanaiḥ śanaiḥ! kṛpayā punaḥ vadatu. tvaṃ bahu śīghraṃ vadasi!\n*Ram: Slowly, slowly! Please say that again. You speak too fast!*\n\n**सुमा:** क्षम्यताम्! ह्यः... अहं... नगरं... गतवती। अवगतम्?\nsumā: kṣamyatām! hyaḥ... ahaṃ... nagaraṃ... gatavatī. avagatam?\n*Suma: Sorry! Yesterday... I... went... to the city. Understood?*\n\n**रामः:** आम्, इदानीम् अवगतम्!\nrāmaḥ: ām, idānīm avagatam!\n*Ram: Yes, now I understand!*\n\n---\n\n## Variations\n\n- **punar brūhi** — a more casual \"say it again\" using *brū* (speak) in the familiar imperative.\n- **kim iti?** — literally \"what, thus?\" — a quick, colloquial \"what was that?\" or \"come again?\"\n- **spaṣṭaṃ vadatu** — \"speak clearly\" — when the issue is clarity, not speed.\n\n---\n\n## Common Mistakes\n\n1. **Saying *na jānāmi* when you mean *na avagacchāmi*.** *Na jānāmi* means \"I don't know (the fact).\" *Na avagacchāmi* means \"I don't understand (what you said).\" If someone asks you a question and you lack the knowledge, use *na jānāmi*. If you heard words but couldn't parse them, use *na avagacchāmi*.\n\n2. **Forgetting that *vadatu* is already polite.** You don't need to pile on extra politeness. *Punaḥ vadatu* is perfectly respectful. Adding *kṛpayā* (please) makes it extra polite but isn't required.\n", "workbook-questions": "# Stage 29: Clarifying & Repairing — Workbook\n\n---\n\n## Section A: Translate to Sanskrit (10 marks)\n\n1. Sorry, I didn't understand.\n2. What is the meaning of the word 'guru'?\n3. How do you say 'water' in Sanskrit?\n4. Please speak slowly.\n5. Can you repeat that?\n\n---\n\n## Section B: Translate to English (10 marks)\n\n1. punaḥ vadatu, na avagatam — पुनः वदतु, न अवगतम्\n2. 'saṃskṛtam' iti padasya ko'rthaḥ? — 'संस्कृतम्' इति पदस्य कोऽर्थः?\n3. arthāt sā adya na āgamiṣyati — अर्थात् सा अद्य न आगमिष्यति\n4. kṛpayā spaṣṭaṃ vadatu, na avagacchāmi — कृपया स्पष्टं वदतु, न अवगच्छामि\n5. idānīm avagatam, dhanyavādaḥ — इदानीम् अवगतम्, धन्यवादः\n\n---\n\n## Section C: Fill in the Blank (10 marks)\n\n1. kṣamyatām, ______ vadatu.\n   *(Sorry, say that again.)*\n\n2. na ______. kṛpayā śanaiḥ vadatu.\n   *(I didn't understand. Please speak slowly.)*\n\n3. 'tree' iti saṃskṛte ______ ucyate?\n   *(How do you say 'tree' in Sanskrit?)*\n\n4. 'mokṣaḥ' iti padasya ______?\n   *(What is the meaning of the word 'mokṣa'?)*\n\n5. ______ saḥ parīkṣāyāṃ na utīrṇaḥ.\n   *(That is to say, he did not pass the exam.)*\n\n---\n\n## Section D: Build a Mini-Dialogue (6 marks)\n\n**D1.** Write a 3-4 line dialogue where a Sanskrit learner asks their teacher the meaning of an unfamiliar word. The teacher explains, and the student confirms understanding. Use at least two clarifying phrases from this stage.\n\n**D2.** Write a 3-4 line dialogue where someone is speaking too fast and the listener asks them to slow down and repeat. Use *śanaiḥ vadatu*, *punaḥ vadatu*, and *avagatam*.\n\n---\n\n## Section E: Free Response (4 marks)\n\n**E1.** You're in a Sanskrit conversation class and you hear a word you don't know. Write 2-3 sentences asking about the word, getting an answer, and confirming you understood.\n\n**E2.** Write 2-3 sentences where you ask how to say three different English words in Sanskrit, using the *katham ucyate* pattern.\n", "workbook-answers": "# Stage 29: Clarifying & Repairing — Answer Key\n\n---\n\n## Section A: Translate to Sanskrit (10 marks)\n\n1. kṣamyatām, na avagatam.\n   क्षम्यताम्, न अवगतम्।\n\n2. 'guru'-śabdasya ko'rthaḥ?\n   'गुरु'-शब्दस्य कोऽर्थः?\n\n3. 'water' iti saṃskṛte katham ucyate?\n   'water' इति संस्कृते कथम् उच्यते?\n\n4. kṛpayā śanaiḥ vadatu.\n   कृपया शनैः वदतु।\n\n5. kiṃ punaḥ vaktuṃ śaknoṣi?\n   किं पुनः वक्तुं शक्नोषि?\n\n---\n\n## Section B: Translate to English (10 marks)\n\n1. Say that again, I didn't understand.\n2. What is the meaning of the word 'saṃskṛtam'?\n3. That is to say, she won't come today.\n4. Please speak clearly, I don't understand.\n5. Now I understood, thank you.\n\n---\n\n## Section C: Fill in the Blank (10 marks)\n\n1. **punaḥ** — kṣamyatām, **punaḥ** vadatu.\n2. **avagatam** — na **avagatam**. kṛpayā śanaiḥ vadatu.\n3. **katham** — 'tree' iti saṃskṛte **katham** ucyate?\n4. **ko'rthaḥ** — 'mokṣaḥ' iti padasya **ko'rthaḥ**?\n5. **arthāt** — **arthāt** saḥ parīkṣāyāṃ na utīrṇaḥ.\n\n---\n\n## Section D: Build a Mini-Dialogue (6 marks)\n\n**D1.** Sample:\n\n**chātraḥ:** guro, 'prajñā' iti padasya ko'rthaḥ?\n**guruḥ:** prajñā arthāt 'viśeṣa-jñānam' iti. āṅgle 'wisdom' iti ucyate.\n**chātraḥ:** idānīm avagatam. prajñā arthāt wisdom. dhanyavādaḥ!\n\n*(Student: Teacher, what does the word 'prajñā' mean? / Teacher: Prajñā, that is to say, 'special knowledge.' In English it's called 'wisdom.' / Student: Now I understand. Prajñā means wisdom. Thank you!)*\n\n**D2.** Sample:\n\n**anilā:** hyaḥ mama bhaginī āgatavatī vayaṃ nagaraṃ gatvā kīḍitavatyaḥ...\n**meghaḥ:** śanaiḥ vadatu! bahu śīghraṃ vadasi. punaḥ vadatu kṛpayā.\n**anilā:** hyaḥ... mama bhaginī... āgatavatī. avagatam?\n**meghaḥ:** ām, avagatam! tataḥ kim abhavat?\n\n*(Anila: Yesterday my sister came and we went to the city and played... / Megha: Speak slowly! You speak too fast. Please say again. / Anila: Yesterday... my sister... came. Understood? / Megha: Yes, understood! Then what happened?)*\n\n---\n\n## Section E: Free Response — Sample Answers (4 marks)\n\n**E1.** \"ācārya, 'viveka'-śabdasya ko'rthaḥ? na avagacchāmi etat padam.\" ācāryaḥ avadat yat viveka-śabdasya arthaḥ 'discrimination' iti. idānīm avagatam — viveka arthāt samyak-nirṇayaḥ.\n\n*(Teacher, what does the word 'viveka' mean? I don't understand this word. The teacher said that the meaning of viveka is 'discrimination.' Now I understand — viveka means proper discernment.)*\n\n**E2.** 'computer' iti saṃskṛte katham ucyate? saṅgaṇakaḥ iti ucyate. 'telephone' iti saṃskṛte katham ucyate? dūravāṇī iti ucyate. 'train' iti saṃskṛte katham ucyate? lohapathagāminī iti ucyate.\n\n*(How do you say 'computer' in Sanskrit? It's called saṅgaṇaka. How do you say 'telephone' in Sanskrit? It's called dūravāṇī. How do you say 'train' in Sanskrit? It's called lohapathagāminī.)*\n"}, "tabs": ["theory", "workbook-questions", "workbook-answers"]}, {"id": "conv-30-exclamations", "number": 30, "title": "Exclamations & Reactions", "subtitle": "aho!, sādhu!, adbhutam!", "files": {"theory": "# Stage 30: Exclamations & Reactions\n\n**Pattern: aho! / sādhu! / adbhutam! / dhik! / hā hanta!**\n\n---\n\n## The Pattern\n\nExclamations are the **emotional heartbeat** of conversation. Drop these in naturally and you stop sounding like a textbook and start sounding like a person.\n\n| Exclamation | IAST | Emotion |\n|-------------|------|---------|\n| Wow! / Oh! | aho! | Wonder, surprise |\n| Bravo! Well done! | sādhu! sādhu! | Praise, approval |\n| Amazing! | adbhutam! | Amazement |\n| Shame! Alas! | dhik! | Disgust, contempt |\n| Alas! Oh no! | hā! / hā hanta! | Grief, distress |\n| Hey! Ho! | bhoḥ! | Calling attention |\n| Excellent! | śobhanam! | Approval, delight |\n| What a pity! | kaṣṭam! | Sympathy, pain |\n| Long live! Bless you! | ciraṃ jīva! | Blessing, celebration |\n| Impossible! No way! | na śakyam! / asambhavam! | Disbelief |\n\n---\n\n## How It Works\n\nMost of these are **frozen forms** — you don't conjugate or decline them, you just throw them into conversation as-is. Grammatically, they fall into three buckets:\n\n**Accusative neuters** used as exclamatory expressions: *adbhutam*, *kaṣṭam*, *śobhanam*, *asambhavam*. These are technically \"that (is) amazing / painful / excellent / impossible\" with the verb *asti* dropped. You already know this pattern — it's just an adjective in the neuter accusative standing alone.\n\n**Indeclinables** (avyaya): *aho*, *dhik*, *hā*, *hanta*, *bhoḥ* — these never change form. *Bhoḥ* is the vocative particle, used before names or titles to call someone: *bhoḥ rāma!* = \"Hey Ram!\" *Dhik* takes the accusative of the person you're shaming: *dhik tvām!* = \"Shame on you!\"\n\n**Imperative verbs** used as blessings: *ciraṃ jīva* = \"live long\" (*jīva* is the imperative of *jīv*).\n\n---\n\n## Example Phrases\n\n1. **अहो! किम् एतत् सत्यम्?**\n   aho! kim etat satyam?\n   *Wow! Is this true?*\n\n2. **साधु साधु! सुन्दरं गीतम्**\n   sādhu sādhu! sundaraṃ gītam\n   *Bravo! Beautiful song!*\n\n3. **अद्भुतम्! त्वं परीक्षायाम् उत्तीर्णः!**\n   adbhutam! tvaṃ parīkṣāyām uttīrṇaḥ!\n   *Amazing! You passed the exam!*\n\n4. **धिक् त्वाम्! त्वं मिथ्या अवदः**\n   dhik tvām! tvaṃ mithyā avadaḥ\n   *Shame on you! You lied!*\n\n5. **हा हन्त! सः गतवान्**\n   hā hanta! saḥ gatavān\n   *Alas! He is gone.*\n\n6. **भोः राम! अत्र आगच्छ**\n   bhoḥ rāma! atra āgaccha\n   *Hey Ram! Come here!*\n\n7. **शोभनम्! तव उत्तरं सम्यक् अस्ति**\n   śobhanam! tava uttaraṃ samyak asti\n   *Excellent! Your answer is correct.*\n\n8. **कष्टम्! तस्य पिता रुग्णः अस्ति**\n   kaṣṭam! tasya pitā rugṇaḥ asti\n   *What a pity! His father is ill.*\n\n9. **चिरं जीव, पुत्र!**\n   ciraṃ jīva, putra!\n   *Long live, son! / Bless you, son!*\n\n10. **असम्भवम्! सः एतत् कर्तुं न शक्नोति**\n    asambhavam! saḥ etat kartuṃ na śaknoti\n    *Impossible! He cannot do this!*\n\n---\n\n## Mini-Dialogues\n\n**Dialogue 1: Great news**\n\n**सीता:** अद्य मम परीक्षा-फलम् आगतम्। अहम् उत्तीर्णा!\nsītā: adya mama parīkṣā-phalam āgatam. aham uttīrṇā!\n*Sita: My exam results came today. I passed!*\n\n**रामः:** अद्भुतम्! साधु साधु! किं प्रथमा श्रेणी?\nrāmaḥ: adbhutam! sādhu sādhu! kiṃ prathamā śreṇī?\n*Ram: Amazing! Bravo! First rank?*\n\n**सीता:** आम्, प्रथमा श्रेणी!\nsītā: ām, prathamā śreṇī!\n*Sita: Yes, first rank!*\n\n**रामः:** अहो! शोभनम्! चिरं जीव!\nrāmaḥ: aho! śobhanam! ciraṃ jīva!\n*Ram: Oh! Excellent! Bless you!*\n\n---\n\n**Dialogue 2: Bad news**\n\n**अनिलः:** श्रुतं किम्? रोहितस्य गृहे चौर्यम् अभवत्।\nanilaḥ: śrutaṃ kim? rohitasya gṛhe cauryam abhavat.\n*Anil: Did you hear? There was a theft at Rohit's house.*\n\n**प्रिया:** हा हन्त! कष्टम्! सः कुशली अस्ति किम्?\npriyā: hā hanta! kaṣṭam! saḥ kuśalī asti kim?\n*Priya: Oh no! How awful! Is he okay?*\n\n**अनिलः:** आम्, सर्वे कुशलिनः, किन्तु बहु धनं हृतम्।\nanilaḥ: ām, sarve kuśalinaḥ, kintu bahu dhanaṃ hṛtam.\n*Anil: Yes, everyone is safe, but a lot of money was stolen.*\n\n**प्रिया:** धिक् एतत्! असम्भवम्!\npriyā: dhik etat! asambhavam!\n*Priya: How terrible! Unbelievable!*\n\n---\n\n## Variations\n\n- **aho bata!** — intensified \"oh!\" expressing deep wonder or sorrow (bata amplifies any emotion).\n- **sādhu uktam!** — \"well said!\" — a refined way to praise someone's words specifically.\n- **diṣṭyā!** — \"by good fortune! / thank goodness!\" — used when something good happens after worry or danger.\n\n---\n\n## Common Mistakes\n\n1. **Overusing one exclamation for everything.** Just like you wouldn't say \"wow\" for both good news and bad news in English, don't use *aho* for everything. Match the exclamation to the emotion: *śobhanam* for praise, *kaṣṭam* for pity, *dhik* for disgust.\n\n2. **Forgetting that *dhik* takes the accusative.** It's *dhik tvām* (shame on you), not *dhik tvaṃ*. The person being shamed goes in the accusative case.\n", "workbook-questions": "# Stage 30: Exclamations & Reactions — Workbook\n\n---\n\n## Section A: Translate to Sanskrit (10 marks)\n\n1. Amazing! You did this yourself!\n2. Alas! She is very ill.\n3. Hey Sita! Come here quickly!\n4. Impossible! I don't believe this.\n5. Well done! Your Sanskrit is excellent.\n\n---\n\n## Section B: Translate to English (10 marks)\n\n1. aho! etat nagaram atīva sundaram — अहो! एतत् नगरम् अतीव सुन्दरम्\n2. kaṣṭam! vṛṣṭiḥ āgatā, vayaṃ na gantum śaknumaḥ — कष्टम्! वृष्टिः आगता, वयं न गन्तुं शक्नुमः\n3. dhik tvām! tvaṃ vacanaṃ na pālitavān — धिक् त्वाम्! त्वं वचनं न पालितवान्\n4. sādhu uktam! tava vicāraḥ samyak asti — साधु उक्तम्! तव विचारः सम्यक् अस्ति\n5. ciraṃ jīva, putrī! tava jayaḥ bhavatu — चिरं जीव, पुत्री! तव जयः भवतु\n\n---\n\n## Section C: Fill in the Blank (10 marks)\n\n1. ______! tvaṃ parīkṣāyām prathamaḥ āsīḥ!\n   *(Bravo! You were first in the exam!)*\n\n2. ______ tvām! tvaṃ tasya dhanaṃ coritavān!\n   *(Shame on you! You stole his money!)*\n\n3. hā ______! mama priyaḥ śvā mṛtaḥ.\n   *(Alas! My dear dog has died.)*\n\n4. ______ rāma! atra āgaccha, tvaṃ etat paśya!\n   *(Hey Ram! Come here, look at this!)*\n\n5. ______! etat kartuṃ kasyāpi na śakyam!\n   *(Impossible! No one can do this!)*\n\n---\n\n## Section D: Build a Mini-Dialogue (6 marks)\n\n**D1.** Write a 3-4 line dialogue where one person shares good news (a promotion, a birth, a victory) and the other reacts with appropriate exclamations. Use at least three different exclamations from this stage.\n\n**D2.** Write a 3-4 line dialogue where one person shares shocking or bad news and the other reacts with dismay, disbelief, and sympathy. Use at least three different exclamations.\n\n---\n\n## Section E: Free Response (4 marks)\n\n**E1.** Describe a scene where someone achieves something great. Write 3-4 sentences using at least three exclamations naturally woven into the narration.\n\n**E2.** Write 3-4 sentences reacting to surprising or disappointing news, using a variety of exclamations and showing emotional range.\n", "workbook-answers": "# Stage 30: Exclamations & Reactions — Answer Key\n\n---\n\n## Section A: Translate to Sanskrit (10 marks)\n\n1. adbhutam! tvam etat svayam akāraḥ!\n   अद्भुतम्! त्वम् एतत् स्वयम् अकारः!\n\n2. hā hanta! sā atīva rugṇā asti.\n   हा हन्त! सा अतीव रुग्णा अस्ति।\n\n3. bhoḥ sīte! atra śīghram āgaccha!\n   भोः सीते! अत्र शीघ्रम् आगच्छ!\n\n4. asambhavam! ahaṃ na etat viśvasimi.\n   असम्भवम्! अहं न एतत् विश्वसिमि।\n\n5. sādhu sādhu! tava saṃskṛtam uttamam asti.\n   साधु साधु! तव संस्कृतम् उत्तमम् अस्ति।\n\n---\n\n## Section B: Translate to English (10 marks)\n\n1. Wow! This city is very beautiful.\n2. What a pity! The rain has come, we can't go.\n3. Shame on you! You didn't keep your promise.\n4. Well said! Your idea is correct.\n5. Long live / Bless you, daughter! May you be victorious.\n\n---\n\n## Section C: Fill in the Blank (10 marks)\n\n1. **sādhu sādhu** — **sādhu sādhu**! tvaṃ parīkṣāyām prathamaḥ āsīḥ!\n2. **dhik** — **dhik** tvām! tvaṃ tasya dhanaṃ coritavān!\n3. **hanta** — hā **hanta**! mama priyaḥ śvā mṛtaḥ.\n4. **bhoḥ** — **bhoḥ** rāma! atra āgaccha, tvaṃ etat paśya!\n5. **asambhavam** — **asambhavam**! etat kartuṃ kasyāpi na śakyam!\n\n---\n\n## Section D: Build a Mini-Dialogue (6 marks)\n\n**D1.** Sample:\n\n**sītā:** adya mama patiḥ unnatiṃ prāptavān!\n**gītā:** aho! adbhutam! sādhu sādhu! ciraṃ jīvatu saḥ!\n**sītā:** dhanyavādaḥ! vayaṃ adya utsavaṃ kariṣyāmaḥ.\n**gītā:** śobhanam! ahaṃ api āgamiṣyāmi!\n\n*(Sita: Today my husband got a promotion! / Gita: Oh! Amazing! Bravo! May he live long! / Sita: Thank you! We'll celebrate today. / Gita: Excellent! I'll come too!)*\n\n**D2.** Sample:\n\n**rāmaḥ:** śrutaṃ kim? vidyālayaḥ māsatrayaṃ pihitaḥ bhavati.\n**hariḥ:** asambhavam! kiṃ etat satyam? hā hanta!\n**rāmaḥ:** ām satyam. sarvāḥ parīkṣāḥ api sthagitāḥ.\n**hariḥ:** kaṣṭam! vayaṃ bahu pariśramam akurmahi, idānīṃ sarvam vyartham!\n\n*(Ram: Did you hear? The school will be closed for three months. / Hari: Impossible! Is this true? Oh no! / Ram: Yes, true. All exams are also postponed. / Hari: What a pity! We worked so hard, now it's all in vain!)*\n\n---\n\n## Section E: Free Response — Sample Answers (4 marks)\n\n**E1.** adya sītā dhāvana-spardhāyāṃ prathamā āsīt. sādhu sādhu! sā atīva śīghraṃ dhāvitavatī. aho! sarve janāḥ \"adbhutam! adbhutam!\" iti avocan. guruḥ avadat \"śobhanam! ciraṃ jīva, putrī!\"\n\n*(Today Sita came first in the running competition. Bravo! She ran very fast. Oh! All the people said \"Amazing! Amazing!\" The teacher said, \"Excellent! Bless you, daughter!\")*\n\n**E2.** śrutaṃ mayā yat mama priyaṃ bhojanaālayaṃ pihitam. kaṣṭam! daśa-varṣebhyaḥ tatra gacchāmi sma. hā hanta! asambhavam etat. kintu diṣṭyā nūtanaṃ bhojanaālayam udghaṭitam — aho, tatra bhojanaṃ śreṣṭham iti śrutam!\n\n*(I heard that my favorite restaurant has closed. What a pity! I'd been going there for ten years. Alas! Unbelievable. But thankfully a new restaurant has opened — oh, I heard the food there is excellent!)*\n"}, "tabs": ["theory", "workbook-questions", "workbook-answers"]}, {"id": "conv-31-lakara-trio", "number": 31, "title": "Blessings, Promises & Vivid Past", "subtitle": "Luṅ, Liṭ, Luṭ, āśīrliṅ", "files": {"theory": "# Stage 31: Blessings, Promises & Vivid Past — The Three Missing Lakāras\n\n## The Pattern\n\nSanskrit has ten verb-forms (lakāras). You already use six of them. This stage gives you the last three that matter conversationally:\n\n| Lakāra | What It Does | The Feel |\n|--------|-------------|----------|\n| **Luṅ** (aorist) | Punctual past — \"it just happened\" | Vivid, immediate, dramatic |\n| **Liṭ** (perfect) | Narrative past — \"it had happened / it came to pass\" | Literary, story-opening, weighty |\n| **Luṭ** (periphrastic future) | Definite future — \"I am going to do it\" | Scheduled, committed, certain |\n\nThe tenth lakāra (Leṭ, Vedic subjunctive) is archaic — you'll encounter it in the main track's Svara-Vidyā stage but never need it in conversation.\n\nWe also cover the **āśīrliṅ** (benedictive) — a special sub-mode of Liṅ used exclusively for blessings and wishes. This is the verb-form behind every \"may you prosper\" you've ever heard in Sanskrit.\n\n---\n\n## How It Works\n\n### Luṅ — The Aorist: \"It Just Happened\"\n\nThe aorist expresses a **punctual, completed action** — something that happened as a single event, often just now. Where Laṅ (imperfect) narrates ongoing past action, Luṅ captures a flash.\n\nFormation: **a-** prefix + modified root + special endings. The aorist has multiple formation types, but you only need the most common forms.\n\nHigh-frequency aorist forms:\n\n| Root | Meaning | 3rd sg. | 3rd pl. |\n|------|---------|---------|---------|\n| bhū (be/become) | became | **abhūt** | abhūvan |\n| kṛ (do) | did | **akārṣīt** | akārṣuḥ |\n| gam (go) | went | **agamat** | agaman |\n| dā (give) | gave | **adāt** | aduḥ |\n| dṛś (see) | saw | **adrākṣīt** | adrākṣuḥ |\n| vac (speak) | spoke | **avocat** | avocan |\n| śru (hear) | heard | **aśrauṣīt** | aśrauṣuḥ |\n| pat (fall) | fell | **apātat** | apātan |\n\n### Example Phrases — Luṅ\n\n1. **सा अपतत्!**\n   *sā apātat!*\n   She fell! (just now — vivid)\n\n2. **किम् अभूत्?**\n   *kim abhūt?*\n   What happened? (the single most useful aorist phrase)\n\n3. **सः अवोचत् — \"अहं न गमिष्यामि\" इति।**\n   *saḥ avocat — \"ahaṃ na gamiṣyāmi\" iti.*\n   He said (just now) — \"I will not go.\"\n\n4. **मेघः अगर्जत्, विद्युत् अभूत्।**\n   *meghaḥ agarjat, vidyut abhūt.*\n   Thunder roared, lightning struck. (vivid narration)\n\n5. **तत् श्रुत्वा सः अद्राक्षीत्।**\n   *tat śrutvā saḥ adrākṣīt.*\n   Having heard that, he saw (it clearly). (dramatic realization)\n\n---\n\n### Liṭ — The Perfect: \"It Had Come to Pass\"\n\nThe perfect expresses a **completed past action with present relevance**, or a **narrative past** in elevated/literary speech. It's the verb-form that opens stories and describes accomplished facts.\n\nFormation: **reduplication** of the root's first syllable + special endings. The perfect has its own unique conjugation.\n\nHigh-frequency perfect forms:\n\n| Root | Meaning | 3rd sg. | 3rd pl. |\n|------|---------|---------|---------|\n| bhū (be) | has been / became | **babhūva** | babhūvuḥ |\n| kṛ (do) | has done | **cakāra** | cakruḥ |\n| gam (go) | has gone | **jagāma** | jagmuḥ |\n| vac (speak) | has spoken | **uvāca** | ūcuḥ |\n| dṛś (see) | has seen | **dadarśa** | dadṛśuḥ |\n| vid (know) | has known | **viveda** / **veda** | viduḥ |\n| śru (hear) | has heard | **śuśrāva** | śuśruvuḥ |\n| as (be) | has been | **āsa** | āsuḥ |\n\n### Example Phrases — Liṭ\n\n6. **पुरा अत्र एकः राजा बभूव।**\n   *purā atra ekaḥ rājā babhūva.*\n   Long ago, there was a king here. (story opening — weighty)\n\n7. **सः उवाच — \"धर्मः एव जयति\" इति।**\n   *saḥ uvāca — \"dharmaḥ eva jayati\" iti.*\n   He spoke — \"Dharma alone prevails.\" (quotation in elevated register)\n\n8. **सा तं ददर्श, सः तां ददर्श।**\n   *sā taṃ dadarśa, saḥ tāṃ dadarśa.*\n   She saw him, he saw her. (literary — mutual recognition)\n\n9. **किं त्वम् इदं शुश्राव?**\n   *kiṃ tvam idaṃ śuśrāva?*\n   Have you heard this? (present relevance of past event)\n\n10. **भगवान् उवाच — ...**\n    *bhagavān uvāca — ...*\n    The Lord spoke — ... (the Gītā's framing verb — this IS the perfect)\n\n---\n\n### Luṭ — The Periphrastic Future: \"I'm Going To\"\n\nThe periphrastic future expresses a **definite, scheduled, or committed future action**. Where Lṛṭ (simple future, kariṣyāmi) is general intention, Luṭ is firm commitment — \"this WILL happen.\"\n\nFormation: agent noun in **-tā** + present tense of **as** (to be).\n\n| Person | Singular | Meaning |\n|--------|----------|---------|\n| 1st | **kartā asmi** | I am going to do (it's decided) |\n| 2nd | **kartā asi** | You are going to do |\n| 3rd | **kartā** (asti dropped) | He is going to do |\n\n| Root | -tā form | Example |\n|------|----------|---------|\n| kṛ (do) | kartā | kartā asmi = I'm going to do it |\n| gam (go) | gantā | gantā asmi = I'm going to go |\n| dā (give) | dātā | dātā asmi = I'm going to give |\n| vac (speak) | vaktā | vaktā asmi = I'm going to speak |\n| bhū (become) | bhavitā | bhavitā = it's going to happen |\n\n### Example Phrases — Luṭ\n\n11. **अहं श्वः गन्ता अस्मि।**\n    *ahaṃ śvaḥ gantā asmi.*\n    I am going to go tomorrow. (it's decided, not just a wish)\n\n12. **सः वक्ता — अहं श्रोता।**\n    *saḥ vaktā — ahaṃ śrotā.*\n    He will be the speaker — I will be the listener. (roles assigned)\n\n13. **एतत् भवितैव।**\n    *etat bhavitaiva.* (bhavitā + eva)\n    This is going to happen, period.\n\n14. **त्वं कर्ता असि वा न?**\n    *tvaṃ kartā asi vā na?*\n    Are you going to do it or not? (pressing for commitment)\n\n---\n\n### Āśīrliṅ — The Benedictive: \"May It Be So\"\n\nThe āśīrliṅ is a special sub-form of the optative (Liṅ) used exclusively for **blessings, wishes, and benedictions**. It's the verb behind temple blessings, guru-blessings, and auspicious wishes.\n\nFormation: root + **-yā-** + special endings (different from regular Liṅ).\n\nKey benedictive forms:\n\n| Root | Benedictive 3rd sg. | Meaning |\n|------|---------------------|---------|\n| bhū | **bhūyāt** | May it be! |\n| kṛ | **kriyāt** | May it be done! |\n| as | **syāt** (same as Liṅ) | May it be! |\n| jīv | **jīvyāt** | May he live! |\n| vṛdh | **vardhiṣīṣṭa** | May he prosper! |\n\n### Example Phrases — Āśīrliṅ & Blessings\n\n15. **भद्रं भूयात्!**\n    *bhadraṃ bhūyāt!*\n    May there be good! (universal blessing)\n\n16. **तव मङ्गलं भूयात्!**\n    *tava maṅgalaṃ bhūyāt!*\n    May there be auspiciousness for you!\n\n17. **चिरं जीव! शतं जीव!**\n    *ciraṃ jīva! śataṃ jīva!*\n    Live long! Live a hundred (years)! (imperative used as blessing)\n\n18. **विद्या भूयात्, अविद्या नश्यतु!**\n    *vidyā bhūyāt, avidyā naśyatu!*\n    May knowledge arise, may ignorance perish!\n\n19. **सर्वे भवन्तु सुखिनः!**\n    *sarve bhavantu sukhinaḥ!*\n    May all beings be happy! (Loṭ used as blessing — the famous prayer)\n\n20. **शुभम् अस्तु!**\n    *śubham astu!*\n    May it be auspicious! (astu = Loṭ of as, the everyday blessing)\n\n---\n\n## Mini-Dialogue 1: \"What Happened?\"\n\n> **A:** किम् अभूत्? त्वं चिन्तितः इव भासि।\n> *kim abhūt? tvaṃ cintitaḥ iva bhāsi.*\n> What happened? You look worried.\n\n> **B:** गुरुः उवाच — \"परीक्षा श्वः भवितैव\" इति।\n> *guruḥ uvāca — \"parīkṣā śvaḥ bhavitaiva\" iti.*\n> The guru said — \"The exam is going to be tomorrow, for sure.\"\n\n> **A:** अहो! अहं तु न शुश्राव। अधुना अध्येता अस्मि।\n> *aho! ahaṃ tu na śuśrāva. adhunā adhyetā asmi.*\n> Oh! I hadn't heard. Now I'm going to study.\n\n> **B:** भद्रं भूयात्! सफलतां प्राप्नुयाः!\n> *bhadraṃ bhūyāt! saphalatāṃ prāpnuyāḥ!*\n> May there be good! May you attain success!\n\n## Mini-Dialogue 2: \"A Story Opening\"\n\n> **A:** एकां कथां शृणु। पुरा एकः मुनिः बभूव।\n> *ekāṃ kathāṃ śṛṇu. purā ekaḥ muniḥ babhūva.*\n> Listen to a story. Long ago, there was a sage.\n\n> **B:** सः किं चकार?\n> *saḥ kiṃ cakāra?*\n> What did he do?\n\n> **A:** सः वनं जगाम, तत्र एकं सर्पम् अद्राक्षीत्।\n> *saḥ vanaṃ jagāma, tatra ekaṃ sarpam adrākṣīt.*\n> He went to the forest, and there he saw a serpent.\n\n> **B:** ततः किम् अभूत्?\n> *tataḥ kim abhūt?*\n> Then what happened?\n\n---\n\n## Variations\n\n- **Luṅ vs Laṅ** — In conversation, Laṅ (imperfect) handles most past tense. Use Luṅ when you want **vividness** or **surprise**: \"kim abhūt?\" (what just happened?) vs \"kim abhavat?\" (what was happening?)\n- **Liṭ as quotation frame** — \"uvāca\" is far more common than \"avadat\" in literary/devotional contexts. If you're quoting a guru, a text, or a deity, use uvāca.\n- **Luṭ vs Lṛṭ** — \"kartā asmi\" (I'm going to do it — decided) vs \"kariṣyāmi\" (I will do it — general). The distinction is like English \"I'm going to\" vs \"I will.\"\n- **Everyday blessings** — Most daily blessings use Loṭ (imperative), not āśīrliṅ: \"śubham astu\" (may it be good), \"sukhinaḥ bhavantu\" (may they be happy). Reserve bhūyāt for formal/ritual blessings.\n\n## Common Mistakes\n\n1. **Overusing Liṭ in conversation.** The perfect is literary. Don't say \"ahaṃ jagāma\" in casual speech — say \"ahaṃ agaccham\" (Laṅ) or \"ahaṃ agamat\" (Luṅ for vividness). Save Liṭ for storytelling and elevated register.\n\n2. **Confusing Luṭ agent noun with regular nouns.** \"kartā\" in Luṭ means \"one who is going to do\" — it's a verbal form, not just \"doer.\" Don't use it as a standalone noun meaning \"creator\" in this context.\n", "workbook-questions": "# Stage 31: Blessings, Promises & Vivid Past — Workbook (Questions)\n\n## Section A: Translate to Sanskrit (10 marks)\n\nUse the appropriate lakāra (Luṅ, Liṭ, Luṭ, or āśīrliṅ/blessing) for each.\n\n1. What happened? (2 marks)\n2. Long ago, there was a great king. (2 marks)\n3. I am going to speak tomorrow. (2 marks)\n4. May there be auspiciousness for all! (2 marks)\n5. He said — \"I will not come.\" (Use Liṭ for \"said\") (2 marks)\n\n---\n\n## Section B: Translate to English (10 marks)\n\n1. sā apātat, sarve adrākṣuḥ. (2 marks)\n2. purā atra ekaḥ vṛkṣaḥ babhūva. (2 marks)\n3. ahaṃ śvaḥ gantā asmi. (2 marks)\n4. tava maṅgalaṃ bhūyāt! (2 marks)\n5. bhagavān uvāca — \"kṣetraṃ kṣetrajñam eva ca\" iti. (2 marks)\n\n---\n\n## Section C: Choose the Right Lakāra (10 marks)\n\nFor each sentence, choose the correct form from the options. Explain WHY that lakāra fits.\n\n1. \"The guru _____ (spoke) these words.\" (2 marks)\n   a) avadat (Laṅ)  b) uvāca (Liṭ)  c) avocat (Luṅ)\n\n2. \"I _____ (am going to do) this work, it's decided.\" (2 marks)\n   a) kariṣyāmi (Lṛṭ)  b) kartā asmi (Luṭ)  c) kuryām (Liṅ)\n\n3. \"Suddenly lightning _____! (struck)\" (2 marks)\n   a) abhavat (Laṅ)  b) babhūva (Liṭ)  c) abhūt (Luṅ)\n\n4. \"May knowledge _____ (arise)!\" (2 marks)\n   a) bhavatu (Loṭ)  b) bhūyāt (āśīrliṅ)  c) bhavet (Liṅ)\n\n5. \"Long ago, a sage _____ (went) to the forest.\" (2 marks)\n   a) agacchat (Laṅ)  b) jagāma (Liṭ)  c) agamat (Luṅ)\n\n---\n\n## Section D: Build a Mini-Dialogue (5 marks)\n\n**D1.** Write a 4-line dialogue where someone shares surprising news. Use at least one aorist (Luṅ) and one blessing. (2.5 marks)\n\n**D2.** Write a 4-line story opening using Liṭ (perfect) for the narrative frame and Luṭ (periphrastic future) for a character's promise. (2.5 marks)\n\n---\n\n## Section E: Free Response (5 marks)\n\n**E1.** Write 3 blessings you would give at a wedding, a graduation, and a temple visit. Use a mix of āśīrliṅ (bhūyāt), Loṭ (astu/bhavantu), and imperative blessings (jīva). (2.5 marks)\n\n**E2.** Retell a short incident from your day using at least one aorist form for vividness. (2.5 marks)\n\n---\n\n**Total: 40 marks**\n", "workbook-answers": "# Stage 31: Blessings, Promises & Vivid Past — Workbook (Answers)\n\n## Section A: Translate to Sanskrit\n\n1. **kim abhūt?** (Luṅ — aorist of bhū, punctual \"what happened?\")\n\n2. **purā ekaḥ mahārājā babhūva.** (Liṭ — perfect of bhū, narrative story opening)\n\n3. **ahaṃ śvaḥ vaktā asmi.** (Luṭ — periphrastic future of vac, definite/committed)\n\n4. **sarveṣāṃ maṅgalaṃ bhūyāt!** (āśīrliṅ — benedictive of bhū)\n\n5. **saḥ uvāca — \"ahaṃ na āgamiṣyāmi\" iti.** (Liṭ — perfect of vac for elevated quotation frame)\n\n## Section B: Translate to English\n\n1. She fell — everyone saw (it). (apātat = Luṅ of pat; adrākṣuḥ = Luṅ 3rd pl. of dṛś)\n\n2. Long ago, there was a tree here. (babhūva = Liṭ of bhū, narrative past)\n\n3. I am going to go tomorrow. (gantā asmi = Luṭ of gam, definite future)\n\n4. May there be auspiciousness for you! (bhūyāt = āśīrliṅ of bhū)\n\n5. The Lord spoke — \"the field and the knower of the field\" — thus. (uvāca = Liṭ of vac, Gītā quotation frame)\n\n## Section C: Choose the Right Lakāra\n\n1. **b) uvāca (Liṭ)** — A guru speaking weighty words calls for the elevated, literary perfect. Laṅ would be casual; Luṅ would imply sudden/surprised speech.\n\n2. **b) kartā asmi (Luṭ)** — The phrase \"it's decided\" signals definite commitment — exactly Luṭ's domain. Lṛṭ (kariṣyāmi) is general future without the commitment. Liṅ (kuryām) is hypothetical.\n\n3. **c) abhūt (Luṅ)** — \"Suddenly\" signals punctual, vivid, instantaneous — the aorist's specialty. Laṅ would narrate it as ongoing; Liṭ would be too literary.\n\n4. **b) bhūyāt (āśīrliṅ)** — A formal blessing/wish. Loṭ (bhavatu) would also work for everyday blessing, but bhūyāt is more ritually potent. Liṅ bhavet is hypothetical, not a wish.\n\n5. **b) jagāma (Liṭ)** — \"Long ago\" (purā) signals narrative/literary past — the perfect's domain. Laṅ would work in casual narration. Luṅ would be too vivid/immediate for \"long ago.\"\n\n## Section D: Build a Mini-Dialogue\n\n**D1.** Sample:\n> **A:** bhoḥ! kim abhūt? tava mukhaṃ prasannam asti!\n> **B:** aho! mama putraḥ parīkṣāyāṃ prathamaḥ abhūt!\n> **A:** sādhu! sādhu! adbhutam!\n> **B:** tava āśīrvādena. tasya maṅgalaṃ bhūyāt!\n\n**D2.** Sample:\n> **A:** purā kasmiṃścit grāme ekaḥ vṛddhaḥ babhūva.\n> **B:** saḥ kiṃ cakāra?\n> **A:** saḥ uvāca — \"ahaṃ śvaḥ nagaraṃ gantā asmi, sarveṣāṃ kṛte dhanaṃ ānayitā asmi\" iti.\n> **B:** tataḥ kim abhūt?\n\n## Section E: Free Response\n\n**E1.** Sample blessings:\n- Wedding: *yuvayoḥ dāmpatyaṃ ciraṃ bhūyāt! sukhinau bhavatam!* (May your married life endure! May you two be happy!)\n- Graduation: *tava vidyā vṛddhiṃ prāpnuyāt! yaśaḥ bhūyāt!* (May your knowledge grow! May there be glory!)\n- Temple: *śubham astu! sarveṣāṃ maṅgalaṃ bhūyāt! bhagavān rakṣatu!* (May there be auspiciousness! May God protect!)\n\n**E2.** Sample:\n*adya prātaḥ ahaṃ mārge agaccham. ekākasmāt meghaḥ agarjat! varṣā abhūt! ahaṃ dhāvitavān — gṛhaṃ prāptavān — kintu pūrṇaṃ klinnaḥ abhūvam! kim abhūt iti mātā apṛcchat. ahaṃ ahāsam.*\n(This morning I was walking on the road. Suddenly thunder roared! Rain happened! I ran — reached home — but was completely drenched! \"What happened?\" mother asked. I laughed.)\n"}, "tabs": ["theory", "workbook-questions", "workbook-answers"]}];
const FILE_LABELS = {"theory": "Theory", "workbook-questions": "Questions", "workbook-answers": "Answers"};

const PHASES = [
  { after: 0, label: "Survival" },
  { after: 8, label: "Fluency" },
  { after: 16, label: "Mastery" },
  { after: 24, label: "Polish" },
];

let currentStage = null;
let currentTab = null;

function buildSidebar() {
  const list = document.getElementById('stageList');
  let html = '';
  let phaseIdx = 0;

  STAGES.forEach((stage, i) => {
    while (phaseIdx < PHASES.length && stage.number > PHASES[phaseIdx].after) {
      if (stage.number > 0) html += '<div class="phase-label">' + PHASES[phaseIdx].label + '</div>';
      phaseIdx++;
    }
    const num = stage.number === 0 ? '' : String(stage.number).padStart(2, '0');
    html += '<div class="stage-item" data-idx="' + i + '" onclick="selectStage(' + i + ')">';
    html += '<span class="stage-num">' + num + '</span>';
    html += '<div class="stage-info"><div class="stage-title">' + stage.title + '</div>';
    html += '<div class="stage-subtitle">' + stage.subtitle + '</div></div></div>';
  });

  list.innerHTML = html;
}

function selectStage(idx) {
  currentStage = idx;
  const stage = STAGES[idx];

  document.querySelectorAll('.stage-item').forEach(el => el.classList.remove('active'));
  const item = document.querySelector('.stage-item[data-idx="' + idx + '"]');
  if (item) item.classList.add('active');

  const tabBar = document.getElementById('tabBar');
  if (stage.number === 0) {
    tabBar.innerHTML = '<div class="tab active">Overview</div>';
    renderContent(stage.files.overview);
    currentTab = 'overview';
  } else {
    let tabHtml = '';
    stage.tabs.forEach((t, ti) => {
      const cls = ti === 0 ? 'active' : '';
      const label = FILE_LABELS[t] || t;
      tabHtml += '<div class="tab ' + cls + '" data-tab="' + t + '" onclick="selectTab(\'' + t + '\')">' + label + '</div>';
    });
    tabBar.innerHTML = tabHtml;
    currentTab = stage.tabs[0];
    renderContent(stage.files[currentTab]);
  }

  closeMobileSidebar();
}

function selectTab(tab) {
  if (currentStage === null) return;
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
  const tabEl = document.querySelector('.tab[data-tab="' + tab + '"]');
  if (tabEl) tabEl.classList.add('active');
  renderContent(STAGES[currentStage].files[tab]);
}

function renderContent(md) {
  const el = document.getElementById('content');
  let html = marked.parse(md);
  html = html.replace(/<table>/g, '<div class="table-wrap"><table>').replace(/<\/table>/g, '</table></div>');
  if (currentStage !== null) {
    html += buildBottomNav();
  }
  el.innerHTML = html;
  document.getElementById('contentWrap').scrollTop = 0;
  updateProgress();
}

function buildBottomNav() {
  const stage = STAGES[currentStage];
  const tabs = stage.tabs || [];
  const tabIdx = tabs.indexOf(currentTab);
  let h = '<div class="bottom-nav">';

  if (tabIdx > 0) {
    const prevTab = tabs[tabIdx - 1];
    h += '<div class="nav-btn" onclick="selectTab(\'' + prevTab + '\')"><span class="nav-label">Previous</span><span class="nav-title">' + (FILE_LABELS[prevTab] || prevTab) + '</span></div>';
  } else if (currentStage > 0) {
    const prevStage = STAGES[currentStage - 1];
    h += '<div class="nav-btn" onclick="selectStage(' + (currentStage - 1) + ')"><span class="nav-label">Previous Stage</span><span class="nav-title">' + prevStage.title + '</span></div>';
  } else {
    h += '<div class="nav-btn disabled"></div>';
  }

  if (tabIdx < tabs.length - 1) {
    const nextTab = tabs[tabIdx + 1];
    h += '<div class="nav-btn" onclick="selectTab(\'' + nextTab + '\')"><span class="nav-label">Next</span><span class="nav-title">' + (FILE_LABELS[nextTab] || nextTab) + '</span></div>';
  } else if (currentStage < STAGES.length - 1) {
    const nextStage = STAGES[currentStage + 1];
    h += '<div class="nav-btn" onclick="selectStage(' + (currentStage + 1) + ')"><span class="nav-label">Next Stage</span><span class="nav-title">' + nextStage.title + '</span></div>';
  } else {
    h += '<div class="nav-btn disabled"></div>';
  }

  h += '</div>';
  return h;
}

function updateProgress() {
  const fill = document.getElementById('progressFill');
  if (currentStage !== null) {
    const stage = STAGES[currentStage];
    const tabs = stage.tabs || [];
    const tabIdx = Math.max(0, tabs.indexOf(currentTab));
    const stageProgress = (currentStage / STAGES.length);
    const tabProgress = tabs.length > 1 ? (tabIdx / (tabs.length - 1)) / STAGES.length : 0;
    fill.style.width = Math.round((stageProgress + tabProgress) * 100) + '%';
  }
}

function filterItems(query) {
  const q = query.toLowerCase();
  document.querySelectorAll('.stage-item').forEach(el => {
    const idx = parseInt(el.dataset.idx);
    const s = STAGES[idx];
    const text = (s.title + ' ' + s.subtitle + ' ' + s.id).toLowerCase();
    el.classList.toggle('hidden', q.length > 0 && !text.includes(q));
  });
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('show');
}

function closeMobileSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('show');
}

// Keyboard
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;

  if (currentStage !== null && currentStage > 0) {
    const stage = STAGES[currentStage];
    const tabNum = parseInt(e.key);
    if (tabNum >= 1 && tabNum <= 3 && stage.tabs[tabNum - 1]) {
      selectTab(stage.tabs[tabNum - 1]);
      return;
    }
  }

  if (e.key === 'ArrowDown' && currentStage < STAGES.length - 1) {
    selectStage(currentStage + 1);
    document.querySelector('.stage-item.active')?.scrollIntoView({ block: 'nearest' });
  } else if (e.key === 'ArrowUp' && currentStage > 0) {
    selectStage(currentStage - 1);
    document.querySelector('.stage-item.active')?.scrollIntoView({ block: 'nearest' });
  }

  if (e.key === '/' && !e.metaKey) {
    e.preventDefault();
    document.getElementById('search').focus();
  }
});

// Init
buildSidebar();
selectStage(0);
</script>
</body>
</html>
