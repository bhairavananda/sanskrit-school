kīdṛśaḥ?*\n   What about the rainy season?\n\n-- वर्षाकालः मायासदृशः अस्ति। सः सर्वोत्तमः अस्ति।\n   *varṣākālaḥ māyāsadṛśaḥ asti. saḥ sarvottamaḥ asti.*\n   The rainy season is like magic. It is the best.\n\n---\n\n## Section E: Free Response (Sample Answers)\n\n**1.**\nआम्रं सर्वेषु फलेषु मधुरतमम् अस्ति। तत् सेवात् मधुरतरम् अस्ति। आम्रं सर्वोत्तमम् अस्ति।\n*āmraṃ sarveṣu phaleṣu madhuratamam asti. tat sevāt madhurataram asti. āmraṃ sarvottamam asti.*\nMango is the sweetest among all fruits. It is sweeter than apple. Mango is the best.\n\n**2.**\nमम गुरुः समुद्रसदृशः अस्ति। तस्य ज्ञानं हिमालयः इव उच्चम् अस्ति। सः सर्वेषु गुरुषु श्रेष्ठः अस्ति।\n*mama guruḥ samudrasadṛśaḥ asti. tasya jñānaṃ himālayaḥ iva uccam asti. saḥ sarveṣu guruṣu śreṣṭhaḥ asti.*\nMy teacher is like the ocean. His knowledge is high like the Himalayas. He is the greatest among all teachers.\n"}, "tabs": ["theory", "workbook-questions", "workbook-answers"]}, {"id": "conv-20-who-which", "number": 20, "title": "The One Who...", "subtitle": "yaḥ...saḥ", "files": {"theory": "# Stage 20: The One Who...\n\n## Pattern Name: Relative-Correlative (\"yaḥ...saḥ\")\n\n---\n\n## The Pattern\n\n**yaḥ X karoti saḥ Y bhavati** — \"He who does X becomes Y\"\n**yat pustakam tvam paṭhasi tat mama asti** — \"The book which you read is mine\"\n\n---\n\n## How It Works\n\nSanskrit doesn't use \"who\" or \"which\" the way English does. Instead, it uses a two-part system: a relative clause starting with *yaḥ* (who/which) and a correlative clause starting with *saḥ* (he/that). They come in matched pairs and must agree in gender and number. Think of it as a call-and-response: *yaḥ* calls out the person or thing, and *saḥ* answers by pointing to them.\n\nThe forms shift with gender: *yaḥ...saḥ* (masculine), *yā...sā* (feminine), *yat...tat* (neuter). For plural: *ye...te* (masc.), *yāḥ...tāḥ* (fem.), *yāni...tāni* (neut.). The relative clause can come first or second -- Sanskrit is flexible. These constructions show up everywhere in proverbs and everyday speech, so once you have this lego piece, you can build surprisingly complex thoughts.\n\n---\n\n## Example Phrases\n\n1. **यः पठति सः जानाति।**\n   *yaḥ paṭhati saḥ jānāti.*\n   He who studies, knows.\n\n2. **या स्त्री अत्र गायति सा मम भगिनी अस्ति।**\n   *yā strī atra gāyati sā mama bhaginī asti.*\n   The woman who sings here is my sister.\n\n3. **यत् फलं त्वम् इच्छसि तत् गृहाण।**\n   *yat phalaṃ tvam icchasi tat gṛhāṇa.*\n   Take the fruit which you want.\n\n4. **ये जनाः सत्यं वदन्ति ते सुखिनः भवन्ति।**\n   *ye janāḥ satyaṃ vadanti te sukhinaḥ bhavanti.*\n   Those people who speak truth become happy.\n\n5. **यत् जलं त्वं पिबसि तत् शुद्धम् अस्ति।**\n   *yat jalaṃ tvaṃ pibasi tat śuddham asti.*\n   The water which you drink is clean.\n\n6. **यः बालकः क्रीडति सः मम पुत्रः अस्ति।**\n   *yaḥ bālakaḥ krīḍati saḥ mama putraḥ asti.*\n   The boy who is playing is my son.\n\n7. **यस्मिन् ग्रामे अहं वसामि तत् ग्रामं सुन्दरम् अस्ति।**\n   *yasmin grāme ahaṃ vasāmi tat grāmaṃ sundaram asti.*\n   The village in which I live is beautiful.\n\n8. **या भाषा त्वं वदसि सा मधुरा अस्ति।**\n   *yā bhāṣā tvaṃ vadasi sā madhurā asti.*\n   The language which you speak is sweet.\n\n9. **यत् कार्यं त्वं करोषि तत् शोभनम् अस्ति।**\n   *yat kāryaṃ tvaṃ karoṣi tat śobhanam asti.*\n   The work which you do is excellent.\n\n10. **यः गुरुं सेवते सः विद्यां लभते।**\n    *yaḥ guruṃ sevate saḥ vidyāṃ labhate.*\n    He who serves the teacher obtains knowledge.\n\n---\n\n## Mini-Dialogues\n\n**Dialogue 1: Who is that?**\n\n-- सः बालकः कः अस्ति?\n   *saḥ bālakaḥ kaḥ asti?*\n   Who is that boy?\n\n-- यः बालकः नीलं वस्त्रं धारयति सः मम मित्रम् अस्ति।\n   *yaḥ bālakaḥ nīlaṃ vastraṃ dhārayati saḥ mama mitram asti.*\n   The boy who is wearing blue clothes is my friend.\n\n-- आम्, यः हसति सः एव?\n   *ām, yaḥ hasati saḥ eva?*\n   Yes, the one who is laughing?\n\n-- आम्, सः एव।\n   *ām, saḥ eva.*\n   Yes, that's him.\n\n**Dialogue 2: A proverb exchange**\n\n-- एकं सूक्तिं वद।\n   *ekaṃ sūktiṃ vada.*\n   Tell me a proverb.\n\n-- यः श्रमं करोति सः फलं लभते।\n   *yaḥ śramaṃ karoti saḥ phalaṃ labhate.*\n   He who works hard obtains the fruit.\n\n-- सुन्दरम्! अपरम् अपि — या विद्या दानेन वर्धते सा एव सत्या विद्या।\n   *sundaram! aparam api — yā vidyā dānena vardhate sā eva satyā vidyā.*\n   Beautiful! Another one too — the knowledge which grows by giving is the true knowledge.\n\n---\n\n## Variations\n\n1. **Locative relative (yasmin...tasmin):**\n   *yasmin nagare saḥ vasati tasmin nagare mandiraṃ asti* — \"In the city where he lives, there is a temple.\"\n\n2. **With instrumental (yena...tena):**\n   *yena mārgena tvaṃ gacchasi tena mārgena aham api gacchāmi* — \"I also go by the path by which you go.\"\n\n3. **Compact form (dropping saḥ when obvious):**\n   *yaḥ paṭhati jānāti* — \"He who reads, knows.\" (The *saḥ* is implied.)\n\n---\n\n## Common Mistakes\n\n1. **Gender mismatch:** If the noun is feminine (*nadī*), you need *yā...sā*, not *yaḥ...saḥ*. The relative and correlative must match the gender of the noun they refer to, not the gender of some other noun in the sentence.\n\n2. **Forgetting the correlative:** In English we say \"the man who came is my friend\" -- one clause. In Sanskrit you need the echo: *yaḥ naraḥ āgataḥ **saḥ** mama mitraṃ asti.* Dropping *saḥ* can work in poetry but sounds incomplete in conversation.\n", "workbook-questions": "# Stage 20: The One Who... — Workbook Questions\n\n**Total: 40 marks**\n\n---\n\n## Section A: Translate to Sanskrit (10 marks, 2 each)\n\n1. He who speaks the truth is happy.\n2. The book which is on the table is mine.\n3. The girl who is singing is my daughter.\n4. The food which you cook is delicious.\n5. Those who help others obtain peace.\n\n---\n\n## Section B: Translate to English (10 marks, 2 each)\n\n1. यः विद्यां लभते सः धनवान् भवति।\n   *yaḥ vidyāṃ labhate saḥ dhanavān bhavati.*\n\n2. यत् गृहं त्वं पश्यसि तत् नवीनम् अस्ति।\n   *yat gṛhaṃ tvaṃ paśyasi tat navīnam asti.*\n\n3. या नदी अत्र वहति सा गङ्गा अस्ति।\n   *yā nadī atra vahati sā gaṅgā asti.*\n\n4. ये छात्राः परिश्रमं कुर्वन्ति ते उत्तीर्णाः भवन्ति।\n   *ye chātrāḥ pariśramaṃ kurvanti te uttīrṇāḥ bhavanti.*\n\n5. यस्मिन् वने अहं गच्छामि तस्मिन् वने व्याघ्राः सन्ति।\n   *yasmin vane ahaṃ gacchāmi tasmin vane vyāghrāḥ santi.*\n\n---\n\n## Section C: Fill in the Blank (10 marks, 2 each)\n\n1. __________ जनः परोपकारं करोति सः सुखी भवति। (supply the masculine relative pronoun)\n   *__________ janaḥ paropakāraṃ karoti saḥ sukhī bhavati.*\n\n2. या बालिका अत्र पठति __________ मम सखी अस्ति। (supply the feminine correlative)\n   *yā bālikā atra paṭhati __________ mama sakhī asti.*\n\n3. यत् पुस्तकं मम हस्ते अस्ति __________ रोचकम् अस्ति। (supply the neuter correlative)\n   *yat pustakaṃ mama haste asti __________ rocakam asti.*\n\n4. __________ मार्गेण त्वं गच्छसि तेन मार्गेण अहम् अपि गच्छामि। (supply the instrumental relative)\n   *__________ mārgeṇa tvaṃ gacchasi tena mārgeṇa aham api gacchāmi.*\n\n5. ये बालकाः क्रीडन्ति __________ मम मित्राणि सन्ति। (supply the masculine plural correlative)\n   *ye bālakāḥ krīḍanti __________ mama mitrāṇi santi.*\n\n---\n\n## Section D: Build a Mini-Dialogue (6 marks, 3 each)\n\n1. **Prompt:** Someone points at two people in a crowd and asks who they are. The other person identifies each using *yaḥ...saḥ* and *yā...sā*. Write 3-4 lines.\n\n2. **Prompt:** A teacher shares a proverb using the *yaḥ...saḥ* pattern, and a student responds with their own proverb in the same pattern. Write 3-4 lines.\n\n---\n\n## Section E: Free Response (4 marks, 2 each)\n\n1. Write a proverb or wise saying using the *yaḥ...saḥ* pattern. Then explain in English what it means.\n\n2. Describe your home or school using the *yasmin...tasmin* (locative relative) pattern. Write 2-3 sentences in Sanskrit.\n", "workbook-answers": "# Stage 20: The One Who... — Workbook Answers\n\n---\n\n## Section A: Translate to Sanskrit\n\n1. **यः सत्यं वदति सः सुखी अस्ति।**\n   *yaḥ satyaṃ vadati saḥ sukhī asti.*\n\n2. **यत् पुस्तकं मेषोपरि अस्ति तत् मम अस्ति।**\n   *yat pustakaṃ meṣopari asti tat mama asti.*\n\n3. **या बालिका गायति सा मम पुत्री अस्ति।**\n   *yā bālikā gāyati sā mama putrī asti.*\n\n4. **यत् भोजनं त्वं पचसि तत् स्वादिष्टम् अस्ति।**\n   *yat bhojanaṃ tvaṃ pacasi tat svādiṣṭam asti.*\n\n5. **ये अन्यान् सहायन्ते ते शान्तिं लभन्ते।**\n   *ye anyān sahāyante te śāntiṃ labhante.*\n\n---\n\n## Section B: Translate to English\n\n1. He who obtains knowledge becomes wealthy.\n\n2. The house which you see is new.\n\n3. The river which flows here is the Ganga.\n\n4. Those students who work hard pass (the exam).\n\n5. In the forest where I go, there are tigers.\n\n---\n\n## Section C: Fill in the Blank\n\n1. **यः** (*yaḥ*) — masculine singular relative pronoun\n\n2. **सा** (*sā*) — feminine singular correlative pronoun\n\n3. **तत्** (*tat*) — neuter singular correlative pronoun\n\n4. **येन** (*yena*) — instrumental singular relative pronoun\n\n5. **ते** (*te*) — masculine plural correlative pronoun\n\n---\n\n## Section D: Build a Mini-Dialogue\n\n**1. In a crowd:**\n\n-- तौ द्वौ जनौ कौ स्तः?\n   *tau dvau janau kau staḥ?*\n   Who are those two people?\n\n-- यः पुरुषः श्वेतं वस्त्रं धारयति सः मम पिता अस्ति।\n   *yaḥ puruṣaḥ śvetaṃ vastraṃ dhārayati saḥ mama pitā asti.*\n   The man who is wearing white clothes is my father.\n\n-- या स्त्री तस्य समीपे तिष्ठति सा कः?\n   *yā strī tasya samīpe tiṣṭhati sā kaḥ?*\n   The woman who stands near him -- who is she?\n\n-- सा मम माता अस्ति।\n   *sā mama mātā asti.*\n   She is my mother.\n\n**2. Proverb exchange:**\n\n-- छात्राः, एकं सूक्तिं शृणुत — यः धर्मं रक्षति सः धर्मेण रक्ष्यते।\n   *chātrāḥ, ekaṃ sūktiṃ śṛṇuta — yaḥ dharmaṃ rakṣati saḥ dharmeṇa rakṣyate.*\n   Students, hear a proverb — He who protects dharma is protected by dharma.\n\n-- गुरो, अहम् अपि एकं जानामि — या विद्या मुक्तिं ददाति सा एव उत्तमा विद्या।\n   *guro, aham api ekaṃ jānāmi — yā vidyā muktiṃ dadāti sā eva uttamā vidyā.*\n   Teacher, I also know one — The knowledge which gives liberation is the best knowledge.\n\n-- साधु! सम्यक् उक्तम्।\n   *sādhu! samyak uktam.*\n   Excellent! Well said.\n\n---\n\n## Section E: Free Response (Sample Answers)\n\n**1.**\nयः क्षमां करोति सः वीरः अस्ति।\n*yaḥ kṣamāṃ karoti saḥ vīraḥ asti.*\nHe who forgives is a hero. — This proverb means that true strength is shown not in fighting but in the ability to forgive.\n\n**2.**\nयस्मिन् नगरे अहं वसामि तस्मिन् नगरे बहूनि मन्दिराणि सन्ति। यस्मिन् गृहे अहं पठामि तस्मिन् गृहे एकम् उद्यानम् अस्ति। तत् उद्यानं सुन्दरम् अस्ति।\n*yasmin nagare ahaṃ vasāmi tasmin nagare bahūni mandirāṇi santi. yasmin gṛhe ahaṃ paṭhāmi tasmin gṛhe ekam udyānam asti. tat udyānaṃ sundaram asti.*\nIn the city where I live, there are many temples. In the house where I study, there is a garden. That garden is beautiful.\n"}, "tabs": ["theory", "workbook-questions", "workbook-answers"]}, {"id": "conv-21-opinions", "number": 21, "title": "I Think & Opinions", "subtitle": "manye, mama matena", "files": {"theory": "# Stage 21: I Think & Opinions\n\n## Pattern Name: Expressing What You Think\n\n---\n\n## The Pattern\n\n**aham manye** — \"I think\"\n**mama matena** — \"in my opinion\"\n**mama dṛṣṭyā** — \"from my perspective\"\n**nūnam** — \"surely / certainly\"\n**sambhavati** — \"it's possible\"\n\n---\n\n## How It Works\n\nSanskrit has a rich toolkit for marking how sure you are about what you're saying. At the confident end, *nūnam* (\"surely\") and *niścayena* (\"certainly\") plant your flag firmly. In the middle, *mama matena* (\"in my opinion,\" literally \"by my thought\") and *mama dṛṣṭyā* (\"from my view\") soften a claim into a personal take. And *sambhavati* (\"it is possible\") or *syāt* (\"it might be\") let you hedge gracefully.\n\nThe verb *manye* (\"I think\") is special -- it's an ātmanepada form (middle voice), so it conjugates differently from most verbs you've seen. You don't say *manāmi*; you say *manye* (I think), *manyase* (you think), *manyate* (he/she thinks). The instrumental case does the heavy lifting in *mama matena* -- *matena* is the instrumental of *mata* (thought/opinion), so you're literally saying \"by my opinion.\" This is the same instrumental-of-means pattern you've seen before, now applied to abstract ideas.\n\n---\n\n## Example Phrases\n\n1. **अहं मन्ये एतत् उचितम् अस्ति।**\n   *ahaṃ manye etat ucitam asti.*\n   I think this is appropriate.\n\n2. **मम मतेन संस्कृतं सुन्दरतमा भाषा अस्ति।**\n   *mama matena saṃskṛtaṃ sundaratamā bhāṣā asti.*\n   In my opinion, Sanskrit is the most beautiful language.\n\n3. **मम दृष्ट्या एतत् कार्यं कठिनम् अस्ति।**\n   *mama dṛṣṭyā etat kāryaṃ kaṭhinam asti.*\n   From my perspective, this task is difficult.\n\n4. **नूनं सः आगमिष्यति।**\n   *nūnaṃ saḥ āgamiṣyati.*\n   Surely he will come.\n\n5. **सम्भवति वर्षा भविष्यति।**\n   *sambhavati varṣā bhaviṣyati.*\n   It's possible it will rain.\n\n6. **अहं न मन्ये तत् सत्यम् इति।**\n   *ahaṃ na manye tat satyam iti.*\n   I don't think that is true.\n\n7. **तव मतेन किम् उत्तमम्?**\n   *tava matena kim uttamam?*\n   In your opinion, what is best?\n\n8. **निश्चयेन सा उत्तीर्णा भविष्यति।**\n   *niścayena sā uttīrṇā bhaviṣyati.*\n   Certainly she will pass.\n\n9. **स्यात् सः गृहे अस्ति।**\n   *syāt saḥ gṛhe asti.*\n   He might be at home.\n\n10. **सत्यम् एव — अहम् अपि एवम् एव मन्ये।**\n    *satyam eva — aham api evam eva manye.*\n    Indeed -- I also think exactly so.\n\n---\n\n## Mini-Dialogues\n\n**Dialogue 1: Agreeing and disagreeing**\n\n-- मम मतेन अयं चलचित्रः उत्तमः अस्ति।\n   *mama matena ayaṃ calacitraḥ uttamaḥ asti.*\n   In my opinion, this movie is excellent.\n\n-- अहं न एवं मन्ये। मम दृष्ट्या सः मन्दः आसीत्।\n   *ahaṃ na evaṃ manye. mama dṛṣṭyā saḥ mandaḥ āsīt.*\n   I don't think so. From my perspective, it was slow.\n\n-- सम्भवति, किन्तु कथा तु सुन्दरा आसीत्, नूनम्।\n   *sambhavati, kintu kathā tu sundarā āsīt, nūnam.*\n   Possibly, but the story was beautiful, surely.\n\n-- आम्, तत् तु अहम् अङ्गीकरोमि।\n   *ām, tat tu aham aṅgīkaromi.*\n   Yes, that I do accept.\n\n**Dialogue 2: Making plans**\n\n-- श्वः किं करिष्यामः? तव मतेन कुत्र गच्छावः?\n   *śvaḥ kiṃ kariṣyāmaḥ? tava matena kutra gacchāvaḥ?*\n   What shall we do tomorrow? In your opinion, where should we go?\n\n-- मम मतेन उद्यानं गच्छावः।\n   *mama matena udyānaṃ gacchāvaḥ.*\n   In my opinion, let's go to the park.\n\n-- सम्भवति वर्षा भविष्यति। स्यात् गृहे एव तिष्ठावः।\n   *sambhavati varṣā bhaviṣyati. syāt gṛhe eva tiṣṭhāvaḥ.*\n   It's possible it will rain. Perhaps we should just stay home.\n\n---\n\n## Variations\n\n1. **Polite disagreement with kṣamyatām, kintu...:**\n   *kṣamyatām, kintu mama matena etat na ucitam* — \"Forgive me, but in my opinion this is not right.\"\n\n2. **Strengthening with eva:**\n   *nūnam eva saḥ āgamiṣyati* — \"He will most certainly come.\"\n\n3. **Asking for opinion with kim manyase:**\n   *tvam kim manyase?* — \"What do you think?\"\n\n---\n\n## Common Mistakes\n\n1. **Saying manāmi instead of manye:** The verb *man* (to think) is ātmanepada. The correct first person is *manye*, not *manāmi*. This is one of those verbs where the ending just has to be memorized.\n\n2. **Overusing nūnam for hedging:** *Nūnam* means \"surely/certainly\" -- it strengthens a claim. If you want to hedge (\"maybe\"), use *sambhavati* or *syāt* instead. Saying *nūnam sambhavati* (\"certainly it's possible\") sends mixed signals.\n", "workbook-questions": "# Stage 21: I Think & Opinions — Workbook Questions\n\n**Total: 40 marks**\n\n---\n\n## Section A: Translate to Sanskrit (10 marks, 2 each)\n\n1. I think this is a good idea.\n2. In my opinion, tea is better than coffee.\n3. Certainly he will come tomorrow.\n4. It's possible that she is at home.\n5. What do you think? (use *kim manyase*)\n\n---\n\n## Section B: Translate to English (10 marks, 2 each)\n\n1. मम मतेन एषः मार्गः सुरक्षितः अस्ति।\n   *mama matena eṣaḥ mārgaḥ surakṣitaḥ asti.*\n\n2. अहं मन्ये वयं विजेष्यामः।\n   *ahaṃ manye vayaṃ vijeṣyāmaḥ.*\n\n3. सम्भवति अद्य गुरुः न आगमिष्यति।\n   *sambhavati adya guruḥ na āgamiṣyati.*\n\n4. निश्चयेन एतत् पुस्तकं पठनीयम् अस्ति।\n   *niścayena etat pustakaṃ paṭhanīyam asti.*\n\n5. मम दृष्ट्या परीक्षा कठिना आसीत्।\n   *mama dṛṣṭyā parīkṣā kaṭhinā āsīt.*\n\n---\n\n## Section C: Fill in the Blank (10 marks, 2 each)\n\n1. अहं __________ एतत् सत्यम् अस्ति। (I think — use the correct ātmanepada form)\n   *ahaṃ __________ etat satyam asti.*\n\n2. __________ मतेन वयं श्वः गच्छामः। (In my opinion)\n   *__________ matena vayaṃ śvaḥ gacchāmaḥ.*\n\n3. __________ सा परीक्षायाम् उत्तीर्णा भविष्यति। (Surely)\n   *__________ sā parīkṣāyām uttīrṇā bhaviṣyati.*\n\n4. __________ वर्षा न भविष्यति। (It's possible)\n   *__________ varṣā na bhaviṣyati.*\n\n5. त्वं किं __________? (What do you think? — supply the ātmanepada verb)\n   *tvaṃ kiṃ __________?*\n\n---\n\n## Section D: Build a Mini-Dialogue (6 marks, 3 each)\n\n1. **Prompt:** Two friends are debating whether a new restaurant is good or bad. One expresses a positive opinion (*mama matena*), the other politely disagrees (*ahaṃ na evaṃ manye*). Write 3-4 lines.\n\n2. **Prompt:** A student is unsure about an answer on a test. They express uncertainty (*sambhavati*, *syāt*) and a friend expresses certainty (*nūnam*, *niścayena*). Write 3-4 lines.\n\n---\n\n## Section E: Free Response (4 marks, 2 each)\n\n1. Express your opinion about your favorite season. Use *mama matena* and at least one other opinion marker. Write 2-3 sentences in Sanskrit.\n\n2. Write a short exchange where you agree with someone's opinion. Use *satyam eva* or *aham api evaṃ manye*. Write 2-3 sentences.\n", "workbook-answers": "# Stage 21: I Think & Opinions — Workbook Answers\n\n---\n\n## Section A: Translate to Sanskrit\n\n1. **अहं मन्ये एतत् उत्तमा युक्तिः अस्ति।**\n   *ahaṃ manye etat uttamā yuktiḥ asti.*\n\n2. **मम मतेन चायं कॉफ़ीतः उत्तमा अस्ति।**\n   *mama matena cāyaṃ kŏphītaḥ uttamā asti.*\n\n3. **नूनं सः श्वः आगमिष्यति।**\n   *nūnaṃ saḥ śvaḥ āgamiṣyati.*\n\n4. **सम्भवति सा गृहे अस्ति।**\n   *sambhavati sā gṛhe asti.*\n\n5. **त्वं किं मन्यसे?**\n   *tvaṃ kiṃ manyase?*\n\n---\n\n## Section B: Translate to English\n\n1. In my opinion, this road is safe.\n\n2. I think we will win.\n\n3. It's possible the teacher won't come today.\n\n4. Certainly this book should be read.\n\n5. From my perspective, the exam was difficult.\n\n---\n\n## Section C: Fill in the Blank\n\n1. **मन्ये** (*manye*) — I think (ātmanepada first person singular)\n\n2. **मम** (*mama*) — my (in my opinion)\n\n3. **नूनम्** (*nūnam*) — surely\n\n4. **सम्भवति** (*sambhavati*) — it's possible\n\n5. **मन्यसे** (*manyase*) — you think (ātmanepada second person singular)\n\n---\n\n## Section D: Build a Mini-Dialogue\n\n**1. Restaurant debate:**\n\n-- मम मतेन नवीनं भोजनालयं बहु उत्तमम् अस्ति। भोजनं स्वादिष्टम् आसीत्।\n   *mama matena navīnaṃ bhojanālayaṃ bahu uttamam asti. bhojanaṃ svādiṣṭam āsīt.*\n   In my opinion, the new restaurant is very good. The food was delicious.\n\n-- अहं न एवं मन्ये। मम दृष्ट्या भोजनं लवणाधिकम् आसीत्।\n   *ahaṃ na evaṃ manye. mama dṛṣṭyā bhojanaṃ lavaṇādhikam āsīt.*\n   I don't think so. From my perspective, the food was too salty.\n\n-- सम्भवति, किन्तु मिष्टान्नं तु उत्तमम् आसीत्, नूनम्!\n   *sambhavati, kintu miṣṭānnaṃ tu uttamam āsīt, nūnam!*\n   Possibly, but the dessert was excellent, for sure!\n\n**2. Exam uncertainty:**\n\n-- अहं न जानामि मम उत्तरं सम्यक् अस्ति वा न वा। स्यात् अशुद्धम् अस्ति।\n   *ahaṃ na jānāmi mama uttaraṃ samyak asti vā na vā. syāt aśuddham asti.*\n   I don't know if my answer is correct or not. It might be wrong.\n\n-- नूनं तव उत्तरं शुद्धम् अस्ति। त्वं सम्यक् पठितवान्।\n   *nūnaṃ tava uttaraṃ śuddham asti. tvaṃ samyak paṭhitavān.*\n   Surely your answer is correct. You studied well.\n\n-- निश्चयेन? सम्भवति त्वं सत्यं वदसि।\n   *niścayena? sambhavati tvaṃ satyaṃ vadasi.*\n   Certainly? Perhaps you're right.\n\n---\n\n## Section E: Free Response (Sample Answers)\n\n**1.**\nमम मतेन वसन्तः सर्वोत्तमः ऋतुः अस्ति। नूनं पुष्पाणि तस्मिन् काले अतीव सुन्दराणि भवन्ति। मम दृष्ट्या वसन्ते सर्वं जगत् नवीनं भवति।\n*mama matena vasantaḥ sarvottamaḥ ṛtuḥ asti. nūnaṃ puṣpāṇi tasmin kāle atīva sundarāṇi bhavanti. mama dṛṣṭyā vasante sarvaṃ jagat navīnaṃ bhavati.*\nIn my opinion, spring is the best season. Surely the flowers at that time are very beautiful. From my perspective, in spring the whole world becomes new.\n\n**2.**\n-- मम मतेन संस्कृतभाषा अतीव मधुरा अस्ति।\n   *mama matena saṃskṛtabhāṣā atīva madhurā asti.*\n   In my opinion, the Sanskrit language is very sweet.\n\n-- सत्यम् एव! अहम् अपि एवम् एव मन्ये। सा देववाणी अस्ति।\n   *satyam eva! aham api evam eva manye. sā devavāṇī asti.*\n   Exactly true! I also think exactly so. It is the language of the gods.\n"}, "tabs": ["theory", "workbook-questions", "workbook-answers"]}, {"id": "conv-22-should-must", "number": 22, "title": "Should & Must", "subtitle": "kartavyam, karaṇīyam", "files": {"theory": "# Stage 22: Should & Must\n\n## Pattern Name: Obligation, Prohibition & Permission\n\n---\n\n## The Pattern\n\n**tvayā X kartavyam** — \"you should do X\" (lit. \"X is to-be-done by you\")\n**mayā Y karaṇīyam** — \"I must do Y\"\n**mā kuru** — \"don't do (it)\"\n**X karotu** — \"let him do X\"\n\n---\n\n## How It Works\n\nSanskrit flips the English construction on its head. Instead of \"you should do X,\" it says \"X is to-be-done by you.\" The doer goes into the instrumental case (*tvayā* = \"by you,\" *mayā* = \"by me\"), and the action becomes an adjective ending in *-tavya*, *-anīya*, or *-ya*. All three suffixes mean roughly the same thing: \"should/must be done.\" So *kartavyam* = \"to be done,\" *karaṇīyam* = \"to be done,\" *kāryam* = \"to be done.\" Pick whichever sounds best.\n\nFor prohibition (\"don't!\"), Sanskrit uses *mā* with the verb in a specific form. The simplest version: *mā kuru* (\"don't do\"), *mā gaccha* (\"don't go\"). For third-person imperatives (\"let him...\"), just use the imperative third person: *karotu* (\"let him do\"), *gacchatu* (\"let him go\"), *tiṣṭhatu* (\"let him stay\"). These are gentle commands or permissions -- not barking orders, more like \"may he...\"\n\n---\n\n## Example Phrases\n\n1. **त्वया गृहकार्यं कर्तव्यम्।**\n   *tvayā gṛhakāryaṃ kartavyam.*\n   You should do the homework.\n\n2. **मया अद्य पत्रं लेखनीयम्।**\n   *mayā adya patraṃ lekhanīyam.*\n   I must write a letter today.\n\n3. **सर्वैः सत्यं वक्तव्यम्।**\n   *sarvaiḥ satyaṃ vaktavyam.*\n   Everyone should speak the truth.\n\n4. **मा चिन्तां कुरु।**\n   *mā cintāṃ kuru.*\n   Don't worry.\n\n5. **सः गच्छतु। अहं तिष्ठामि।**\n   *saḥ gacchatu. ahaṃ tiṣṭhāmi.*\n   Let him go. I'll stay.\n\n6. **त्वया जलं पातव्यम्। बहु उष्णम् अस्ति।**\n   *tvayā jalaṃ pātavyam. bahu uṣṇam asti.*\n   You should drink water. It is very hot.\n\n7. **एतत् भोजनं न खादनीयम्। तत् पुरातनम् अस्ति।**\n   *etat bhojanaṃ na khādanīyam. tat purātanam asti.*\n   This food should not be eaten. It is old.\n\n8. **बालकेन औषधं सेवनीयम्।**\n   *bālakena auṣadhaṃ sevanīyam.*\n   The child must take the medicine.\n\n9. **मा कोपं कुरु। शान्तिं धारय।**\n   *mā kopaṃ kuru. śāntiṃ dhāraya.*\n   Don't be angry. Maintain peace.\n\n10. **सा पठतु। वयं श्रुणुमः।**\n    *sā paṭhatu. vayaṃ śṛṇumaḥ.*\n    Let her read. We will listen.\n\n---\n\n## Mini-Dialogues\n\n**Dialogue 1: Doctor's advice**\n\n-- वैद्य, मम शिरः पीड्यते। किं कर्तव्यम्?\n   *vaidya, mama śiraḥ pīḍyate. kiṃ kartavyam?*\n   Doctor, my head hurts. What should I do?\n\n-- त्वया विश्रामः कर्तव्यः। औषधम् अपि सेवनीयम्।\n   *tvayā viśrāmaḥ kartavyaḥ. auṣadham api sevanīyam.*\n   You should rest. You must also take medicine.\n\n-- मा बहु चिन्तां कुरु। शीघ्रम् एव स्वस्थः भविष्यसि।\n   *mā bahu cintāṃ kuru. śīghram eva svasthaḥ bhaviṣyasi.*\n   Don't worry too much. You will get well quickly.\n\n**Dialogue 2: What to do about a guest**\n\n-- अतिथिः आगच्छति। किं करणीयम्?\n   *atithiḥ āgacchati. kiṃ karaṇīyam?*\n   A guest is coming. What should be done?\n\n-- त्वया भोजनं पचनीयम्। रामः गृहं शोधयतु।\n   *tvayā bhojanaṃ pacanīyam. rāmaḥ gṛhaṃ śodhayatu.*\n   You should cook food. Let Rama clean the house.\n\n-- आम्, सर्वैः मिलित्वा कार्यं कर्तव्यम्।\n   *ām, sarvaiḥ militvā kāryaṃ kartavyam.*\n   Yes, everyone should work together.\n\n---\n\n## Variations\n\n1. **Using arha (deserve/ought to) with infinitive:**\n   *tvaṃ gantum arhasi* — \"You ought to go.\" (More polite, suggesting worthiness.)\n\n2. **Softened obligation with yuktam (proper/fitting):**\n   *yuktaṃ yat tvaṃ paṭhasi* — \"It is fitting that you study.\"\n\n3. **Permissive with astu (\"let it be, fine\"):**\n   *astu, saḥ gacchatu* — \"Fine, let him go.\"\n\n---\n\n## Common Mistakes\n\n1. **Putting the agent in the nominative:** You must say *tvayā kartavyam* (instrumental), not *tvaṃ kartavyam*. The person who \"should\" do the thing goes into instrumental because technically the sentence is passive: \"the thing is to-be-done by you.\"\n\n2. **Using mā with present tense:** *Mā* for prohibition properly takes specific verb forms (often the augmentless aorist or imperative). In conversational Sanskrit, *mā kuru* and *mā gaccha* are widely accepted. But avoid *mā karoti* -- that doesn't work. *Mā* goes with second person commands.\n", "workbook-questions": "# Stage 22: Should & Must — Workbook Questions\n\n**Total: 40 marks**\n\n---\n\n## Section A: Translate to Sanskrit (10 marks, 2 each)\n\n1. You should read this book.\n2. I must go to school today.\n3. Don't eat that food.\n4. Let her speak first.\n5. Everyone should help each other.\n\n---\n\n## Section B: Translate to English (10 marks, 2 each)\n\n1. त्वया प्रतिदिनं व्यायामः कर्तव्यः।\n   *tvayā pratidinaṃ vyāyāmaḥ kartavyaḥ.*\n\n2. मा तत्र गच्छ। तत् स्थानं भयङ्करम् अस्ति।\n   *mā tatra gaccha. tat sthānaṃ bhayaṅkaram asti.*\n\n3. बालकैः दुग्धं पातव्यम्।\n   *bālakaiḥ dugdhaṃ pātavyam.*\n\n4. सः तिष्ठतु। अहं गच्छामि।\n   *saḥ tiṣṭhatu. ahaṃ gacchāmi.*\n\n5. मया एतत् कार्यं श्वः पूर्णीकरणीयम्।\n   *mayā etat kāryaṃ śvaḥ pūrṇīkaraṇīyam.*\n\n---\n\n## Section C: Fill in the Blank (10 marks, 2 each)\n\n1. __________ अद्य गृहकार्यं कर्तव्यम्। (by you — supply the instrumental)\n   *__________ adya gṛhakāryaṃ kartavyam.*\n\n2. __________ कोपं कुरु। (Don't — supply the prohibitive particle)\n   *__________ kopaṃ kuru.*\n\n3. सा अत्र __________। वयं श्रुणुमः। (let her sing — supply third-person imperative of gai)\n   *sā atra __________. vayaṃ śṛṇumaḥ.*\n\n4. सर्वैः सत्यं __________। (should be spoken — supply the gerundive of vac)\n   *sarvaiḥ satyaṃ __________.*\n\n5. बालकेन औषधं __________। (must be taken — supply the gerundive of sev)\n   *bālakena auṣadhaṃ __________.*\n\n---\n\n## Section D: Build a Mini-Dialogue (6 marks, 3 each)\n\n1. **Prompt:** A parent tells a child what they should do before going to bed (study, drink milk, don't play). Write 3-4 lines using *kartavyam* and *mā kuru*.\n\n2. **Prompt:** Friends are dividing tasks for a party. One says \"let him cook,\" another says \"I must buy flowers,\" etc. Write 3-4 lines using *-tu* (imperative) and *mayā...kartavyam*.\n\n---\n\n## Section E: Free Response (4 marks, 2 each)\n\n1. Write 2-3 rules for a classroom using gerundives (*kartavyam / na kartavyam*). For example: \"Everyone should listen\" or \"Phones should not be used.\"\n\n2. Give advice to a friend who is nervous before an exam. Use *mā cintāṃ kuru*, *tvayā...kartavyam*, and *nūnam* (from Stage 21). Write 2-3 sentences.\n", "workbook-answers": "# Stage 22: Should & Must — Workbook Answers\n\n---\n\n## Section A: Translate to Sanskrit\n\n1. **त्वया एतत् पुस्तकं पठनीयम्।**\n   *tvayā etat pustakaṃ paṭhanīyam.*\n\n2. **मया अद्य विद्यालयं गन्तव्यम्।**\n   *mayā adya vidyālayaṃ gantavyam.*\n\n3. **मा तत् भोजनं खाद।**\n   *mā tat bhojanaṃ khāda.*\n\n4. **सा प्रथमं वदतु।**\n   *sā prathamaṃ vadatu.*\n\n5. **सर्वैः परस्परं साहाय्यं कर्तव्यम्।**\n   *sarvaiḥ parasparaṃ sāhāyyaṃ kartavyam.*\n\n---\n\n## Section B: Translate to English\n\n1. You should exercise every day.\n\n2. Don't go there. That place is dangerous.\n\n3. Children should drink milk.\n\n4. Let him stay. I will go.\n\n5. I must complete this work tomorrow.\n\n---\n\n## Section C: Fill in the Blank\n\n1. **त्वया** (*tvayā*) — by you (instrumental of tvam)\n\n2. **मा** (*mā*) — the prohibitive particle\n\n3. **गायतु** (*gāyatu*) — let her sing (third-person imperative of gai)\n\n4. **वक्तव्यम्** (*vaktavyam*) — should be spoken (gerundive of vac)\n\n5. **सेवनीयम्** (*sevanīyam*) — must be taken/consumed (gerundive of sev)\n\n---\n\n## Section D: Build a Mini-Dialogue\n\n**1. Bedtime routine:**\n\n-- पुत्र, शयनात् पूर्वं त्वया पाठः पठनीयः।\n   *putra, śayanāt pūrvaṃ tvayā pāṭhaḥ paṭhanīyaḥ.*\n   Son, before sleeping you should study the lesson.\n\n-- किम् अन्यत् कर्तव्यम्?\n   *kim anyat kartavyam?*\n   What else should I do?\n\n-- दुग्धं पातव्यम्। मा क्रीडां कुरु। अधुना विश्रामस्य समयः।\n   *dugdhaṃ pātavyam. mā krīḍāṃ kuru. adhunā viśrāmasya samayaḥ.*\n   You should drink milk. Don't play. Now it's time for rest.\n\n**2. Party planning:**\n\n-- उत्सवाय कः किं करोतु? रामः भोजनं पचतु।\n   *utsavāya kaḥ kiṃ karotu? rāmaḥ bhojanaṃ pacatu.*\n   For the party, who should do what? Let Rama cook the food.\n\n-- मया पुष्पाणि क्रेतव्यानि। सीता गृहम् अलङ्करोतु।\n   *mayā puṣpāṇi kretavyāni. sītā gṛham alaṅkarotu.*\n   I must buy flowers. Let Sita decorate the house.\n\n-- आम्, सर्वैः मिलित्वा कार्यं कर्तव्यम्। उत्सवः शोभनः भविष्यति!\n   *ām, sarvaiḥ militvā kāryaṃ kartavyam. utsavaḥ śobhanaḥ bhaviṣyati!*\n   Yes, everyone should work together. The party will be wonderful!\n\n---\n\n## Section E: Free Response (Sample Answers)\n\n**1. Classroom rules:**\nकक्षायां सर्वैः शान्तिः पालनीया। छात्रैः ध्यानेन श्रोतव्यम्। दूरवाणी न उपयोक्तव्या। सर्वैः गुरुः सम्मन्तव्यः।\n*kakṣāyāṃ sarvaiḥ śāntiḥ pālanīyā. chātraiḥ dhyānena śrotavyam. dūravāṇī na upayoktavyā. sarvaiḥ guruḥ sammantavyaḥ.*\nIn the classroom, silence should be maintained by all. Students should listen attentively. Phones should not be used. The teacher should be respected by all.\n\n**2. Exam advice:**\nमित्र, मा चिन्तां कुरु। त्वया केवलं शान्त्या पठनीयम्। नूनं त्वं उत्तीर्णः भविष्यसि। त्वया रात्रौ विश्रामः अपि कर्तव्यः।\n*mitra, mā cintāṃ kuru. tvayā kevalaṃ śāntyā paṭhanīyam. nūnaṃ tvaṃ uttīrṇaḥ bhaviṣyasi. tvayā rātrau viśrāmaḥ api kartavyaḥ.*\nFriend, don't worry. You should just study calmly. Surely you will pass. You should also rest at night.\n"}, "tabs": ["theory", "workbook-questions", "workbook-answers"]}, {"id": "conv-23-would-have", "number": 23, "title": "Would Have / But Instead", "subtitle": "Conditional past", "files": {"theory": "# Stage 23: Would Have / But Instead\n\n## Pattern Name: Counterfactuals & Missed Chances\n\n---\n\n## The Pattern\n\n**aham agamiṣyam kintu...** — \"I would have gone but...\"\n**yadi aham ajñāsyam tarhi...** — \"If I had known then...\"\n**tat sthāne aham X akārṣam** — \"Instead I did X\"\n\n---\n\n## How It Works\n\nUp until now, you've talked about what is, what was, what will be, and what should be. Now comes the slippery one: what *would have been*. Sanskrit handles this with the conditional mood (called *lṛṅ lakāra*), which looks a lot like the future tense but with a past-tense prefix (*a-*). So *gamiṣyati* (he will go) becomes *agamiṣyat* (he would have gone). The *a-* prefix (called augment) plus the future-looking stem creates this \"past-future\" meaning -- something that was going to happen but didn't.\n\nPair this with *yadi...tarhi* (\"if...then\") and you get full counterfactual sentences: \"If X had happened, then Y would have happened.\" The word *kintu* (\"but\") links what would have happened to what actually happened instead. And *tat sthāne* (\"in place of that\" / \"instead\") introduces the actual outcome. These patterns are gold for storytelling, explaining regret, and talking about why plans changed.\n\n---\n\n## Example Phrases\n\n1. **अहम् अगमिष्यम् किन्तु वर्षा आगता।**\n   *aham agamiṣyam kintu varṣā āgatā.*\n   I would have gone but it rained.\n\n2. **यदि अहम् अजानिष्यम् तर्हि अवश्यम् आगमिष्यम्।**\n   *yadi aham ajāniṣyam tarhi avaśyam āgamiṣyam.*\n   If I had known, I would certainly have come.\n\n3. **सा अपठिष्यत् किन्तु रुग्णा आसीत्।**\n   *sā apaṭhiṣyat kintu rugṇā āsīt.*\n   She would have studied but she was sick.\n\n4. **तत् स्थाने अहं गृहे अतिष्ठम्।**\n   *tat sthāne ahaṃ gṛhe atiṣṭham.*\n   Instead, I stayed at home.\n\n5. **यदि सः समये आगमिष्यत् तर्हि रथयानं प्राप्स्यत्।**\n   *yadi saḥ samaye āgamiṣyat tarhi rathayānaṃ prāpsyat.*\n   If he had come on time, he would have caught the train.\n\n6. **वयम् अक्रीडिष्याम किन्तु क्षेत्रम् आर्द्रम् आसीत्।**\n   *vayam akrīḍiṣyāma kintu kṣetram ārdram āsīt.*\n   We would have played but the field was wet.\n\n7. **यदि मूल्यं न्यूनम् अभविष्यत् तर्हि अक्रेष्यम्।**\n   *yadi mūlyaṃ nyūnam abhaviṣyat tarhi akreṣyam.*\n   If the price had been low, I would have bought it.\n\n8. **अहं तत्र गन्तुम् ऐच्छम् किन्तु समयः न आसीत्।**\n   *ahaṃ tatra gantum aiccham kintu samayaḥ na āsīt.*\n   I wanted to go there but there was no time.\n\n9. **तत् स्थाने वयं गृहे भोजनम् अपचाम।**\n   *tat sthāne vayaṃ gṛhe bhojanam apacāma.*\n   Instead, we cooked food at home.\n\n10. **यदि त्वम् अवदिष्यः तर्हि अहम् अश्रोष्यम्।**\n    *yadi tvam avadiṣyaḥ tarhi aham aśroṣyam.*\n    If you had spoken, I would have listened.\n\n---\n\n## Mini-Dialogues\n\n**Dialogue 1: Missed party**\n\n-- ह्यः उत्सवे कुत्र आसीः? सर्वे तत्र आसन्।\n   *hyaḥ utsave kutra āsīḥ? sarve tatra āsan.*\n   Where were you at yesterday's party? Everyone was there.\n\n-- अहम् अगमिष्यम् किन्तु मम माता रुग्णा आसीत्।\n   *aham agamiṣyam kintu mama mātā rugṇā āsīt.*\n   I would have gone but my mother was sick.\n\n-- अहो! यदि अहम् अज्ञास्यम् तर्हि तव गृहम् आगमिष्यम्।\n   *aho! yadi aham ajñāsyam tarhi tava gṛham āgamiṣyam.*\n   Oh! If I had known, I would have come to your house.\n\n-- चिन्ता मास्तु। तत् स्थाने अहं मातुः सेवाम् अकरवम्।\n   *cintā māstu. tat sthāne ahaṃ mātuḥ sevām akaravam.*\n   Don't worry. Instead, I took care of my mother.\n\n**Dialogue 2: Wrong turn**\n\n-- वयं मार्गं विस्मृतवन्तः। यदि मानचित्रं दृष्टम् अभविष्यत् तर्हि न भ्रमिष्याम।\n   *vayaṃ mārgaṃ vismṛtavantaḥ. yadi mānacitram dṛṣṭam abhaviṣyat tarhi na bhramiṣyāma.*\n   We forgot the way. If we had looked at the map, we wouldn't have wandered.\n\n-- सत्यम्। तत् स्थाने वयम् अन्यं ग्रामम् अपश्याम। सः तु सुन्दरः आसीत्!\n   *satyam. tat sthāne vayam anyaṃ grāmam apaśyāma. saḥ tu sundaraḥ āsīt!*\n   True. Instead, we saw another village. It was beautiful!\n\n---\n\n## Variations\n\n1. **With icchā for unfulfilled wishes:**\n   *aham āgantum aiccham kintu na aśaknuvam* — \"I wished to come but I couldn't.\"\n\n2. **Using ced instead of yadi (more literary):**\n   *saḥ ced āgamiṣyat tarhi sukhaṃ bhaviṣyat* — \"Had he come, there would have been happiness.\"\n\n3. **Expressing regret with hā / aho:**\n   *hā, yadi ahaṃ tatra abhaviṣyam!* — \"Alas, if only I had been there!\"\n\n---\n\n## Common Mistakes\n\n1. **Confusing future and conditional:** The conditional *agamiṣyat* looks like the future *gamiṣyati* but has the *a-* augment prefix and different endings. Without the *a-* prefix, you're saying \"he will go\" instead of \"he would have gone.\" The augment is the whole difference between planning and daydreaming.\n\n2. **Forgetting to pair yadi with tarhi:** The \"if...then\" structure needs both parts. Saying *yadi aham ajānīṣyam, āgamiṣyam* without *tarhi* is understood but sounds incomplete. In conversation, always include the *tarhi* to signal you're delivering the punchline.\n", "workbook-questions": "# Stage 23: Would Have / But Instead — Workbook Questions\n\n**Total: 40 marks**\n\n---\n\n## Section A: Translate to Sanskrit (10 marks, 2 each)\n\n1. I would have come but I was busy.\n2. If she had studied, she would have passed.\n3. We would have eaten there but the restaurant was closed.\n4. Instead, I read a book at home.\n5. If you had told me, I would have helped.\n\n---\n\n## Section B: Translate to English (10 marks, 2 each)\n\n1. अहम् अक्रेष्यम् किन्तु धनं न आसीत्।\n   *aham akreṣyam kintu dhanaṃ na āsīt.*\n\n2. यदि वर्षा न अभविष्यत् तर्हि वयम् अक्रीडिष्याम।\n   *yadi varṣā na abhaviṣyat tarhi vayam akrīḍiṣyāma.*\n\n3. सः अवदिष्यत् किन्तु भयम् अनुभूतवान्।\n   *saḥ avadiṣyat kintu bhayam anubhūtavān.*\n\n4. तत् स्थाने ते गृहे अतिष्ठन्।\n   *tat sthāne te gṛhe atiṣṭhan.*\n\n5. यदि मार्गः शुद्धः अभविष्यत् तर्हि शीघ्रम् आगमिष्याम।\n   *yadi mārgaḥ śuddhaḥ abhaviṣyat tarhi śīghram āgamiṣyāma.*\n\n---\n\n## Section C: Fill in the Blank (10 marks, 2 each)\n\n1. अहम् __________ किन्तु समयः न आसीत्। (I would have gone — supply conditional of gam)\n   *aham __________ kintu samayaḥ na āsīt.*\n\n2. यदि सः __________ तर्हि सर्वे प्रसन्नाः अभविष्यन्। (had come — supply conditional of āgam)\n   *yadi saḥ __________ tarhi sarve prasannāḥ abhaviṣyan.*\n\n3. __________ स्थाने वयं गृहे अस्थिष्याम। (Instead — supply the phrase)\n   *__________ sthāne vayaṃ gṛhe asthiṣyāma.*\n\n4. सा अगायिष्यत् __________ कण्ठे पीडा आसीत्। (but — supply the contrastive conjunction)\n   *sā agāyiṣyat __________ kaṇṭhe pīḍā āsīt.*\n\n5. __________ अहं तज्ज्ञास्यम् तर्हि अन्यथा अकरिष्यम्। (If — supply the conditional particle)\n   *__________ ahaṃ tajjñāsyam tarhi anyathā akariṣyam.*\n\n---\n\n## Section D: Build a Mini-Dialogue (6 marks, 3 each)\n\n1. **Prompt:** A friend missed your birthday celebration. They explain what happened using \"I would have come but...\" and you respond with \"If I had known, I would have...\" Write 3-4 lines.\n\n2. **Prompt:** Two travelers took a wrong road and ended up somewhere unexpected. One expresses regret using *yadi...tarhi*, the other points out the silver lining of what they did instead (*tat sthāne*). Write 3-4 lines.\n\n---\n\n## Section E: Free Response (4 marks, 2 each)\n\n1. Think of a real situation where your plans changed. Describe what you would have done and what you did instead, in 2-3 Sanskrit sentences.\n\n2. Write a counterfactual about a historical or mythological event: \"If X had (not) happened, then Y would have happened.\" Write 2-3 sentences.\n", "workbook-answers": "# Stage 23: Would Have / But Instead — Workbook Answers\n\n---\n\n## Section A: Translate to Sanskrit\n\n1. **अहम् आगमिष्यम् किन्तु व्यस्तः आसम्।**\n   *aham āgamiṣyam kintu vyastaḥ āsam.*\n\n2. **यदि सा अपठिष्यत् तर्हि उत्तीर्णा अभविष्यत्।**\n   *yadi sā apaṭhiṣyat tarhi uttīrṇā abhaviṣyat.*\n\n3. **वयम् तत्र अभक्षयिष्याम किन्तु भोजनालयः पिहितः आसीत्।**\n   *vayam tatra abhakṣayiṣyāma kintu bhojanālayaḥ pihitaḥ āsīt.*\n\n4. **तत् स्थाने अहं गृहे पुस्तकम् अपठम्।**\n   *tat sthāne ahaṃ gṛhe pustakam apaṭham.*\n\n5. **यदि त्वम् अवदिष्यः तर्हि अहं साहाय्यम् अकरिष्यम्।**\n   *yadi tvam avadiṣyaḥ tarhi ahaṃ sāhāyyam akariṣyam.*\n\n---\n\n## Section B: Translate to English\n\n1. I would have bought (it) but there was no money.\n\n2. If it had not rained, we would have played.\n\n3. He would have spoken but he felt fear.\n\n4. Instead, they stayed at home.\n\n5. If the road had been clear, we would have arrived quickly.\n\n---\n\n## Section C: Fill in the Blank\n\n1. **अगमिष्यम्** (*agamiṣyam*) — I would have gone (conditional first person of gam)\n\n2. **आगमिष्यत्** (*āgamiṣyat*) — had come / would have come (conditional third person of āgam)\n\n3. **तत्** (*tat*) — full phrase: *tat sthāne* — instead\n\n4. **किन्तु** (*kintu*) — but\n\n5. **यदि** (*yadi*) — if\n\n---\n\n## Section D: Build a Mini-Dialogue\n\n**1. Missed birthday:**\n\n-- मित्र, क्षम्यताम्। तव जन्मदिने अहम् आगमिष्यम् किन्तु मम यानं भग्नम् अभवत्।\n   *mitra, kṣamyatām. tava janmadine aham āgamiṣyam kintu mama yānaṃ bhagnam abhavat.*\n   Friend, forgive me. I would have come to your birthday but my vehicle broke down.\n\n-- चिन्ता मास्तु। यदि अहम् अज्ञास्यम् तर्हि यानं प्रेषयिष्यम्।\n   *cintā māstu. yadi aham ajñāsyam tarhi yānaṃ preṣayiṣyam.*\n   Don't worry. If I had known, I would have sent a vehicle.\n\n-- तत् स्थाने अहं गृहे एव तव कृते मिष्टान्नम् अपचम्!\n   *tat sthāne ahaṃ gṛhe eva tava kṛte miṣṭānnam apacam!*\n   Instead, I cooked sweets for you at home!\n\n**2. Wrong road silver lining:**\n\n-- हा, यदि वयं मानचित्रं दृष्टवन्तः अभविष्याम तर्हि न भ्रमिष्याम।\n   *hā, yadi vayaṃ mānacitram dṛṣṭavantaḥ abhaviṣyāma tarhi na bhramiṣyāma.*\n   Alas, if we had looked at the map, we wouldn't have wandered.\n\n-- किन्तु पश्य! तत् स्थाने वयम् एतत् सुन्दरं सरोवरम् अपश्याम!\n   *kintu paśya! tat sthāne vayam etat sundaraṃ sarovaram apaśyāma!*\n   But look! Instead, we discovered this beautiful lake!\n\n-- सत्यम्। सम्भवति भ्रमणम् एव उत्तमम् आसीत्!\n   *satyam. sambhavati bhramaṇam eva uttamam āsīt!*\n   True. Perhaps the wandering itself was the best part!\n\n---\n\n## Section E: Free Response (Sample Answers)\n\n**1.**\nअहं मित्रेण सह उद्यानं गन्तुम् ऐच्छम्। अहम् अगमिष्यम् किन्तु वर्षा आगता। तत् स्थाने वयं गृहे चायं पीत्वा कथाम् अवदाम।\n*ahaṃ mitreṇa saha udyānaṃ gantum aiccham. aham agamiṣyam kintu varṣā āgatā. tat sthāne vayaṃ gṛhe cāyaṃ pītvā kathām avadāma.*\nI wanted to go to the park with a friend. I would have gone but it rained. Instead, we drank tea at home and told stories.\n\n**2.**\nयदि रावणः सीतां न अहरिष्यत् तर्हि युद्धं न अभविष्यत्। यदि रामः वनं न अगमिष्यत् तर्हि लङ्कायाः कथा अन्या अभविष्यत्। किन्तु धर्मः एवं विजयम् अलभत।\n*yadi rāvaṇaḥ sītāṃ na ahariṣyat tarhi yuddhaṃ na abhaviṣyat. yadi rāmaḥ vanaṃ na agamiṣyat tarhi laṅkāyāḥ kathā anyā abhaviṣyat. kintu dharmaḥ evaṃ vijayam alabhata.*\nIf Ravana had not abducted Sita, the war would not have happened. If Rama had not gone to the forest, the story of Lanka would have been different. But thus dharma obtained victory.\n"}, "tabs": ["theory", "workbook-questions", "workbook-answers"]}, {"id": "conv-24-telling-stories", "number": 24, "title": "Telling a Story", "subtitle": "ekadā...tataḥ...ante", "files": {"theory": "# Stage 24: Telling a Story\n\n## Pattern Name: Narrative Building Blocks\n\n---\n\n## The Pattern\n\n**ekadā** — \"once upon a time\"\n**purā** — \"long ago\"\n**kasmiṃścit nagare** — \"in a certain city\"\n**tataḥ saḥ** — \"then he...\"\n**iti uktvā** — \"having said thus\"\n**evam** — \"thus / in this way\"\n**iti kathā samāptā** — \"thus the story ends\"\n\n---\n\n## How It Works\n\nStorytelling in Sanskrit has a toolkit of transition words and narrative devices that give your speech a rhythmic, flowing quality. *Ekadā* and *purā* set the scene in time. *Kasmiṃścit* (\"in a certain...\") uses the locative case with an indefinite pronoun to create that classic fable opening -- \"in a certain village there lived...\" The locative does all the setting work: *kasmiṃścit nagare* (in a certain city), *kasmiṃścit vane* (in a certain forest).\n\nThe glue of Sanskrit narrative is the gerund (also called absolutive): *uktvā* (having said), *gatvā* (having gone), *kṛtvā* (having done), *dṛṣṭvā* (having seen), *śrutvā* (having heard). These chain actions together: \"having done X, he then did Y.\" The word *iti* is the quotative particle -- it marks the end of quoted speech, like a closing quotation mark. And *tataḥ* (\"then, after that\") keeps the narrative moving forward. Stack these together and you can tell a complete story with surprisingly few verbs.\n\n---\n\n## Example Phrases\n\n1. **एकदा एकः राजा आसीत्।**\n   *ekadā ekaḥ rājā āsīt.*\n   Once upon a time, there was a king.\n\n2. **पुरा कस्मिंश्चित् ग्रामे एकः कृषकः अवसत्।**\n   *purā kasmiṃścit grāme ekaḥ kṛṣakaḥ avasat.*\n   Long ago, in a certain village, a farmer lived.\n\n3. **सः तत् दृष्ट्वा आश्चर्यम् अनुभूतवान्।**\n   *saḥ tat dṛṣṭvā āścaryam anubhūtavān.*\n   Having seen that, he felt astonishment.\n\n4. **\"अहं न बिभेमि\" इति उक्त्वा सः अगच्छत्।**\n   *\"ahaṃ na bibhemi\" iti uktvā saḥ agacchat.*\n   Having said \"I am not afraid,\" he went.\n\n5. **ततः सा वनं गत्वा फलानि असंगृह्णात्।**\n   *tataḥ sā vanaṃ gatvā phalāni asaṃgṛhṇāt.*\n   Then, having gone to the forest, she gathered fruits.\n\n6. **तत् श्रुत्वा राजा प्रसन्नः अभवत्।**\n   *tat śrutvā rājā prasannaḥ abhavat.*\n   Having heard that, the king became pleased.\n\n7. **एवं सः धनवान् अभवत्।**\n   *evaṃ saḥ dhanavān abhavat.*\n   Thus he became wealthy.\n\n8. **\"भवतु\" इति उक्त्वा सः गृहं प्रत्यागच्छत्।**\n   *\"bhavatu\" iti uktvā saḥ gṛhaṃ pratyāgacchat.*\n   Having said \"so be it,\" he returned home.\n\n9. **ततः तौ मिलित्वा अन्नम् अभक्षयताम्।**\n   *tataḥ tau militvā annam abhakṣayatām.*\n   Then the two of them, having met, ate food together.\n\n10. **इति कथा समाप्ता।**\n    *iti kathā samāptā.*\n    Thus the story is concluded.\n\n---\n\n## A Complete Mini-Story: The Farmer and the Fox\n\nThis story uses patterns from many previous stages. See how the lego pieces fit together.\n\n> **पुरा कस्मिंश्चित् ग्रामे एकः कृषकः अवसत्।** *(Stage 24: narrative opening)*\n> *purā kasmiṃścit grāme ekaḥ kṛṣakaḥ avasat.*\n> Long ago, in a certain village, a farmer lived.\n>\n> **तस्य क्षेत्रं सर्वेभ्यः क्षेत्रेभ्यः उत्तमम् आसीत्।** *(Stage 19: ablative comparison)*\n> *tasya kṣetraṃ sarvebhyaḥ kṣetrebhyaḥ uttamam āsīt.*\n> His field was better than all other fields.\n>\n> **एकदा एकः शृगालः आगत्य फलानि अखादत्।** *(Stage 24: gerund āgatya)*\n> *ekadā ekaḥ śṛgālaḥ āgatya phalāni akhādat.*\n> One day, a fox came and ate the fruits.\n>\n> **तत् दृष्ट्वा कृषकः अचिन्तयत् — \"यः मम फलानि चोरयति सः दण्डनीयः अस्ति।\"** *(Stage 20: yaḥ...saḥ; Stage 22: gerundive)*\n> *tat dṛṣṭvā kṛṣakaḥ acintayat — \"yaḥ mama phalāni corayati saḥ daṇḍanīyaḥ asti.\"*\n> Having seen that, the farmer thought: \"He who steals my fruits should be punished.\"\n>\n> **\"मया एतत् समस्या समाधातव्या\" इति उक्त्वा सः जालं स्थापितवान्।** *(Stage 22: obligation; Stage 24: iti uktvā)*\n> *\"mayā etat samasyā samādhātavyā\" iti uktvā saḥ jālaṃ sthāpitavān.*\n> Having said \"I must solve this problem,\" he set a trap.\n>\n> **अपरस्मिन् दिने शृगालः जाले बद्धः अभवत्। सः अवदत् — \"कृपया मां मुञ्च। अहं पुनः न आगमिष्यामि।\"** *(Stage 24: narrative past)*\n> *aparasmin dine śṛgālaḥ jāle baddhaḥ abhavat. saḥ avadat — \"kṛpayā māṃ muñca. ahaṃ punaḥ na āgamiṣyāmi.\"*\n> The next day, the fox was caught in the trap. He said: \"Please release me. I will not come again.\"\n>\n> **कृषकः अमन्यत — \"मम मतेन एषः सत्यं वदति।\"** *(Stage 21: manye, mama matena)*\n> *kṛṣakaḥ amanyata — \"mama matena eṣaḥ satyaṃ vadati.\"*\n> The farmer thought: \"In my opinion, he speaks the truth.\"\n>\n> **यदि सः शृगालं न अमोक्ष्यत् तर्हि शृगालः मृतः अभविष्यत्।** *(Stage 23: counterfactual)*\n> *yadi saḥ śṛgālaṃ na amokṣyat tarhi śṛgālaḥ mṛtaḥ abhaviṣyat.*\n> If he had not released the fox, the fox would have died.\n>\n> **किन्तु दयां कृत्वा सः शृगालं मुक्तवान्। ततः शृगालः वनं प्रत्यगच्छत्।** *(Stage 24: gerund kṛtvā)*\n> *kintu dayāṃ kṛtvā saḥ śṛgālaṃ muktavān. tataḥ śṛgālaḥ vanaṃ pratyagacchat.*\n> But having shown mercy, he released the fox. Then the fox returned to the forest.\n>\n> **एवं कृषकस्य दयया शृगालः जीवितवान्। इति कथा समाप्ता।** *(Stage 24: evam, iti kathā samāptā)*\n> *evaṃ kṛṣakasya dayayā śṛgālaḥ jīvitavān. iti kathā samāptā.*\n> Thus, by the farmer's compassion, the fox lived. The story ends here.\n\n---\n\n## Mini-Dialogues\n\n**Dialogue 1: Asking for a story**\n\n-- एकां कथां वद न।\n   *ekāṃ kathāṃ vada na.*\n   Tell me a story, won't you?\n\n-- शृणु। पुरा एकः वानरः आसीत्। सः नद्यां स्वमुखं दृष्ट्वा अचिन्तयत् — \"एषः कः अस्ति?\" इति।\n   *śṛṇu. purā ekaḥ vānaraḥ āsīt. saḥ nadyāṃ svamukhaṃ dṛṣṭvā acintayat — \"eṣaḥ kaḥ asti?\" iti.*\n   Listen. Long ago, there was a monkey. Seeing his own face in the river, he thought -- \"who is this?\"\n\n-- ततः किम् अभवत्?\n   *tataḥ kim abhavat?*\n   Then what happened?\n\n-- ततः सः जलं प्रहृतवान्, मुखं विलुप्तम्, सः हसितवान्। इति कथा समाप्ता!\n   *tataḥ saḥ jalaṃ prahṛtavān, mukhaṃ viluptam, saḥ hasitavān. iti kathā samāptā!*\n   Then he struck the water, the face vanished, and he laughed. Thus the story ends!\n\n**Dialogue 2: Retelling an event**\n\n-- ह्यः किम् अभवत्? कथय।\n   *hyaḥ kim abhavat? kathaya.*\n   What happened yesterday? Tell me.\n\n-- ह्यः अहं विपणिं गत्वा फलानि क्रीतवान्। गृहम् आगत्य भोजनम् अपचम्।\n   *hyaḥ ahaṃ vipaṇiṃ gatvā phalāni krītavān. gṛham āgatya bhojanam apacam.*\n   Yesterday, having gone to the market, I bought fruits. Having come home, I cooked food.\n\n-- ततः?\n   *tataḥ?*\n   Then?\n\n-- ततः मित्रम् आहूय सह भोजनम् अकुर्वम्। एवम् उत्तमः दिनः आसीत्।\n   *tataḥ mitram āhūya saha bhojanam akurvam. evam uttamaḥ dinaḥ āsīt.*\n   Then, having invited a friend, we ate together. Thus it was an excellent day.\n\n---\n\n## Variations\n\n1. **Different story openers:**\n   *asti kasmiṃścit deśe...* (\"there is, in a certain land...\") -- the Panchatantra style.\n   *bhūtapūrvaṃ...* (\"in times past...\") -- more formal.\n\n2. **Chaining multiple gerunds:**\n   *saḥ snātvā, bhuktvā, paṭhitvā, śayitavān* — \"He bathed, ate, studied, and slept.\" (Four actions chained with gerunds before the final verb.)\n\n3. **Closing formulas:**\n   *evaṃ kathā parisamāptā* — \"Thus the story is fully concluded.\"\n   *iyaṃ kathā śubhaṃ dadātu* — \"May this story bring auspiciousness.\"\n\n---\n\n## Common Mistakes\n\n1. **Using gerunds for simultaneous actions:** Gerunds (*gatvā, kṛtvā*) mean \"having done X, then...\" -- they show sequence, not simultaneity. If two things happen at the same time, you need a present participle (*gacchan* = \"while going\"), not a gerund.\n\n2. **Forgetting iti after quoted speech:** In Sanskrit, *iti* comes after the quote, not before. English says: He said, \"I will go.\" Sanskrit says: \"ahaṃ gamiṣyāmi\" *iti* saḥ avadat. Dropping *iti* leaves the quote hanging without a closing bracket.\n", "workbook-questions": "# Stage 24: Telling a Story — Workbook Questions\n\n**Total: 40 marks**\n\n---\n\n## Section A: Translate to Sanskrit (10 marks, 2 each)\n\n1. Once upon a time, there was a lion in a certain forest.\n2. Having seen the river, she was happy.\n3. \"I will come tomorrow,\" having said thus, he went home.\n4. Then the king, having heard that, became angry.\n5. Thus the story ends.\n\n---\n\n## Section B: Translate to English (10 marks, 2 each)\n\n1. पुरा कस्मिंश्चित् नगरे एका राज्ञी अवसत्।\n   *purā kasmiṃścit nagare ekā rājñī avasat.*\n\n2. सः वनं गत्वा वृक्षम् आरूढवान्।\n   *saḥ vanaṃ gatvā vṛkṣam ārūḍhavān.*\n\n3. \"अहं न बिभेमि\" इति उक्त्वा सा अग्रे अगच्छत्।\n   *\"ahaṃ na bibhemi\" iti uktvā sā agre agacchat.*\n\n4. तत् श्रुत्वा सर्वे जनाः प्रसन्नाः अभवन्।\n   *tat śrutvā sarve janāḥ prasannāḥ abhavan.*\n\n5. एवं सः बुद्धिमान् बालकः सर्वान् रक्षितवान्।\n   *evaṃ saḥ buddhimān bālakaḥ sarvān rakṣitavān.*\n\n---\n\n## Section C: Fill in the Blank (10 marks, 2 each)\n\n1. __________ कस्मिंश्चित् वने एकः व्याघ्रः अवसत्। (Long ago)\n   *__________ kasmiṃścit vane ekaḥ vyāghraḥ avasat.*\n\n2. तत् __________ राजा कुपितः अभवत्। (having heard — supply the gerund of śru)\n   *tat __________ rājā kupitaḥ abhavat.*\n\n3. \"मम समीपम् आगच्छ\" __________ सः अवदत्। (supply the quotative particle)\n   *\"mama samīpam āgaccha\" __________ saḥ avadat.*\n\n4. __________ सर्वे सुखिनः अभवन्। (Then — supply the narrative connector)\n   *__________ sarve sukhinaḥ abhavan.*\n\n5. एवं __________ कथा __________। (thus the story ends — supply both words)\n   *evaṃ __________ kathā __________.*\n\n---\n\n## Section D: Build a Mini-Dialogue (6 marks, 3 each)\n\n1. **Prompt:** Tell a 4-5 line mini-story about an animal (your choice). Use *ekadā* or *purā* to open, at least two gerunds (*gatvā, dṛṣṭvā, kṛtvā*, etc.), *tataḥ* for transitions, and *iti kathā samāptā* to close.\n\n2. **Prompt:** Write a 3-4 line dialogue where one person asks \"what happened yesterday?\" (*hyaḥ kim abhavat?*) and the other retells a simple event using gerunds and *tataḥ*.\n\n---\n\n## Section E: Free Response (4 marks, 2 each)\n\n1. Write a 5-6 line mini-story in Sanskrit about a person who goes on a journey. Use at least three gerunds, one piece of quoted speech with *iti*, and close with *iti kathā samāptā*. Try to include at least one pattern from a previous stage (comparison, opinion, obligation, or counterfactual).\n\n2. Retell something that happened to you recently (real or imagined) in 3-4 Sanskrit sentences, using narrative connectors (*tataḥ*, *ekadā*) and gerunds.\n", "workbook-answers": "# Stage 24: Telling a Story — Workbook Answers\n\n---\n\n## Section A: Translate to Sanskrit\n\n1. **एकदा कस्मिंश्चित् वने एकः सिंहः आसीत्।**\n   *ekadā kasmiṃścit vane ekaḥ siṃhaḥ āsīt.*\n\n2. **नदीं दृष्ट्वा सा प्रसन्ना अभवत्।**\n   *nadīṃ dṛṣṭvā sā prasannā abhavat.*\n\n3. **\"अहं श्वः आगमिष्यामि\" इति उक्त्वा सः गृहम् अगच्छत्।**\n   *\"ahaṃ śvaḥ āgamiṣyāmi\" iti uktvā saḥ gṛham agacchat.*\n\n4. **ततः राजा तत् श्रुत्वा कुपितः अभवत्।**\n   *tataḥ rājā tat śrutvā kupitaḥ abhavat.*\n\n5. **इति कथा समाप्ता।**\n   *iti kathā samāptā.*\n\n---\n\n## Section B: Translate to English\n\n1. Long ago, in a certain city, a queen lived.\n\n2. Having gone to the forest, he climbed a tree.\n\n3. Having said \"I am not afraid,\" she went forward.\n\n4. Having heard that, all the people became happy.\n\n5. Thus that intelligent boy saved everyone.\n\n---\n\n## Section C: Fill in the Blank\n\n1. **पुरा** (*purā*) — long ago\n\n2. **श्रुत्वा** (*śrutvā*) — having heard (gerund of śru)\n\n3. **इति** (*iti*) — the quotative particle\n\n4. **ततः** (*tataḥ*) — then\n\n5. **इति** (*iti*) ... **समाप्ता** (*samāptā*) — full phrase: *iti kathā samāptā*\n\n---\n\n## Section D: Build a Mini-Dialogue\n\n**1. Animal mini-story:**\n\nपुरा कस्मिंश्चित् वने एकः कूर्मः अवसत्। एकदा सः जलात् बहिः गत्वा मार्गे अचलत्। ततः एकं शशकम् दृष्ट्वा सः अवदत् — \"मां प्रति धावसि किम्?\" इति। शशकः अहसत्। किन्तु कूर्मः मन्दं मन्दं गत्वा प्रथमं लक्ष्यं प्राप्तवान्। एवं धैर्येण कूर्मः विजयम् अलभत। इति कथा समाप्ता।\n\n*purā kasmiṃścit vane ekaḥ kūrmaḥ avasat. ekadā saḥ jalāt bahiḥ gatvā mārge acalat. tataḥ ekaṃ śaśakam dṛṣṭvā saḥ avadat — \"māṃ prati dhāvasi kim?\" iti. śaśakaḥ ahasat. kintu kūrmaḥ mandaṃ mandaṃ gatvā prathamaṃ lakṣyaṃ prāptavān. evaṃ dhairyeṇa kūrmaḥ vijayam alabhata. iti kathā samāptā.*\n\nLong ago, in a certain forest, a tortoise lived. One day, having come out of the water, he walked on the road. Then, having seen a hare, he said -- \"are you racing me?\" The hare laughed. But the tortoise, having gone slowly and steadily, reached the goal first. Thus, by patience, the tortoise obtained victory. The story ends here.\n\n**2. What happened yesterday:**\n\n-- ह्यः किम् अभवत्?\n   *hyaḥ kim abhavat?*\n   What happened yesterday?\n\n-- ह्यः अहं प्रातः उत्थाय उद्यानं गतवान्। तत्र पुष्पाणि दृष्ट्वा प्रसन्नः अभवम्।\n   *hyaḥ ahaṃ prātaḥ utthāya udyānaṃ gatavān. tatra puṣpāṇi dṛṣṭvā prasannaḥ abhavam.*\n   Yesterday, having woken up in the morning, I went to the garden. Having seen the flowers there, I became happy.\n\n-- ततः किम् अकरोः?\n   *tataḥ kim akaroḥ?*\n   Then what did you do?\n\n-- ततः गृहम् आगत्य भोजनं पक्त्वा मित्रं आहूतवान्। उत्तमः दिनः आसीत्।\n   *tataḥ gṛham āgatya bhojanaṃ paktvā mitraṃ āhūtavān. uttamaḥ dinaḥ āsīt.*\n   Then, having come home, having cooked food, I invited a friend. It was an excellent day.\n\n---\n\n## Section E: Free Response (Sample Answers)\n\n**1. Journey mini-story:**\n\nएकदा एका बालिका पर्वतं द्रष्टुम् ऐच्छत्। \"मया एतत् पर्वतम् आरोढव्यम्\" इति उक्त्वा सा प्रस्थितवती। मार्गे एकं वृद्धम् दृष्ट्वा सा अवदत् — \"पर्वतः कुत्र अस्ति?\" इति। सः मार्गं दर्शितवान्। ततः सा बहु श्रमं कृत्वा शिखरं प्राप्तवती। तत्र स्थित्वा सा अमन्यत — \"एतत् सर्वोत्तमं दृश्यम् अस्ति।\" एवं साहसेन सा सुखं लब्धवती। इति कथा समाप्ता।\n\n*ekadā ekā bālikā parvataṃ draṣṭum aicchat. \"mayā etat parvatam āroḍhavyam\" iti uktvā sā prasthitavatī. mārge ekaṃ vṛddham dṛṣṭvā sā avadat — \"parvataḥ kutra asti?\" iti. saḥ mārgaṃ darśitavān. tataḥ sā bahu śramaṃ kṛtvā śikharaṃ prāptavatī. tatra sthitvā sā amanyata — \"etat sarvottamaṃ dṛśyam asti.\" evaṃ sāhasena sā sukhaṃ labdhavatī. iti kathā samāptā.*\n\nOnce a girl wanted to see the mountain. Having said \"I must climb this mountain,\" she set out. Having seen an old man on the road, she asked -- \"where is the mountain?\" He showed the way. Then, having worked very hard, she reached the peak. Standing there, she thought -- \"this is the best view.\" Thus, by courage, she found happiness. The story ends here.\n\n**2. Personal retelling:**\n\nह्यः अहं विपणिं गतवान्। तत्र बहूनि फलानि दृष्ट्वा आम्राणि क्रीतवान्। ततः गृहम् आगत्य आम्ररसं कृत्वा पीतवान्। एवम् उत्तमः सायङ्कालः आसीत्।\n\n*hyaḥ ahaṃ vipaṇiṃ gatavān. tatra bahūni phalāni dṛṣṭvā āmrāṇi krītavān. tataḥ gṛham āgatya āmrarasaṃ kṛtvā pītavān. evam uttamaḥ sāyaṅkālaḥ āsīt.*\n\nYesterday I went to the market. Having seen many fruits there, I bought mangoes. Then, having come home, having made mango juice, I drank it. Thus it was an excellent evening.\n"}, "tabs": ["theory", "workbook-questions", "workbook-answers"]}, {"id": "conv-25-particles", "number": 25, "title": "Particles & Emphasis", "subtitle": "eva, api, khalu, nanu, kila", "files": {"theory": "# Stage 25: Particles & Emphasis\n\n**Pattern: eva · api · khalu · nanu · kila · tu · vā**\n\n---\n\n## The Pattern\n\nSanskrit has a set of tiny, unchanging words — particles — that color everything around them. They never change form (they're *avyaya*, indeclinables). But where you place them changes the entire meaning of a sentence.\n\n> **word + eva** = ONLY that word / that word ITSELF / INDEED that word\n> **word + api** = EVEN that word / that word ALSO / that word TOO\n> **khalu** = certainly, indeed (sentence-level confidence)\n> **nanu** = isn't it so? / surely (opens rhetorical questions)\n> **kila** = reportedly, they say (marks hearsay)\n> **tu** = but, on the other hand (mild contrast)\n> **vā** = or\n\n## How It Works\n\nWithout particles, Sanskrit sounds like a telegram. With them, it sounds like a person talking. These words don't describe actions or things — they express *attitude*. They tell the listener what you're emphasizing, what you're contrasting, what you heard secondhand, and what you think should be obvious.\n\nThe crucial thing is *position*. **eva** and **api** come right after the word they modify. **khalu** usually sits in second position in the sentence. **nanu** opens the sentence. **kila** follows the subject or verb it marks as hearsay. **tu** follows the word being contrasted. **vā** follows each option in an \"or\" construction.\n\n## Example Phrases\n\nWatch how one base sentence transforms:\n\n**Base:** रामः गच्छति (rāmaḥ gacchati) — \"Rama goes.\"\n\n1. रामः एव गच्छति (rāmaḥ eva gacchati) — \"ONLY Rama goes.\" / \"Rama HIMSELF goes.\"\n2. रामः अपि गच्छति (rāmaḥ api gacchati) — \"Rama ALSO goes.\" / \"Even Rama goes.\"\n3. रामः खलु गच्छति (rāmaḥ khalu gacchati) — \"Rama certainly goes.\"\n4. रामः किल गच्छति (rāmaḥ kila gacchati) — \"Rama reportedly goes.\" / \"They say Rama goes.\"\n5. ननु रामः गच्छति? (nanu rāmaḥ gacchati?) — \"Doesn't Rama go?\" / \"Surely Rama goes?\"\n6. सः एव अवदत् (saḥ eva avadat) — \"He HIMSELF said it.\"\n7. अहम् अपि न जानामि (aham api na jānāmi) — \"Even I don't know.\"\n8. ननु एतत् सत्यम्? (nanu etat satyam?) — \"Isn't that true?\"\n9. सः किल अगच्छत् (saḥ kila agacchat) — \"They say he left.\"\n10. त्वं वा अहं वा (tvaṃ vā ahaṃ vā) — \"You or me.\"\n\n## Mini-Dialogue 1\n\n> **अर्जुनः** — कः अत्र आगच्छति? (kaḥ atra āgacchati?)\n> \"Who's coming here?\"\n>\n> **कृष्णः** — भीमः एव आगच्छति। (bhīmaḥ eva āgacchati.)\n> \"Only Bhima is coming.\"\n>\n> **अर्जुनः** — ननु नकुलः अपि आगच्छति? (nanu nakulaḥ api āgacchati?)\n> \"Doesn't Nakula come too?\"\n>\n> **कृष्णः** — न, सः तु गृहे तिष्ठति। (na, saḥ tu gṛhe tiṣṭhati.)\n> \"No, he on the other hand stays home.\"\n\n## Mini-Dialogue 2\n\n> **सीता** — रावणः किल शक्तिमान्। (rāvaṇaḥ kila śaktimān.)\n> \"They say Ravana is powerful.\"\n>\n> **रामः** — सत्यम् एव। किन्तु धर्मः खलु बलवत्तरः। (satyam eva. kintu dharmaḥ khalu balavattaraḥ.)\n> \"True indeed. But dharma is certainly stronger.\"\n>\n> **सीता** — ननु त्वम् अपि शक्तिमान् असि? (nanu tvam api śaktimān asi?)\n> \"Aren't you powerful too?\"\n>\n> **रामः** — ईश्वरः एव जानाति। (īśvaraḥ eva jānāti.)\n> \"Only God knows.\"\n\n## Variations\n\n- **eva** can intensify time words: अधुना एव (adhunā eva) = \"right now,\" तदा एव (tadā eva) = \"right then\"\n- **api** after a verb makes it concessive: गच्छति अपि (gacchati api) = \"even though he goes\"\n- **vā ... vā** creates \"either ... or\": फलं वा जलं वा (phalaṃ vā jalaṃ vā) = \"fruit or water\"\n\n## Common Mistakes\n\n1. **Putting eva/api in the wrong position.** \"Only Rama goes\" is रामः एव गच्छति, NOT एव रामः गच्छति. The particle follows the word it modifies. If you write गच्छति एव, it means \"he only GOES\" (emphasis on going, not on who).\n\n2. **Confusing kila and khalu.** khalu = \"certainly\" (you believe it). kila = \"reportedly\" (someone else said it, you're not vouching). They sound vaguely similar but point in opposite directions of certainty.\n", "workbook-questions": "# Stage 25: Particles & Emphasis — Workbook\n\n---\n\n## Section A: Translate to Sanskrit (10 marks)\n\nUse Devanagari and IAST. Each sentence must use the particle indicated.\n\n1. Only Sita knows the answer. *(use eva)*\n2. Even the teacher was surprised. *(use api)*\n3. They say the king is ill. *(use kila)*\n4. Isn't this your book? *(use nanu)*\n5. Tea or coffee? *(use vā)*\n\n---\n\n## Section B: Translate to English (10 marks)\n\n1. अहम् एव तत् करोमि। (aham eva tat karomi.)\n2. सः खलु विद्वान् अस्ति। (saḥ khalu vidvān asti.)\n3. बालकः अपि जानाति। (bālakaḥ api jānāti.)\n4. सा किल गायति। (sā kila gāyati.)\n5. ननु त्वं श्रुतवान्? (nanu tvaṃ śrutavān?)\n\n---\n\n## Section C: Fill in the Blank (10 marks)\n\nChoose the correct particle (eva, api, khalu, nanu, kila, tu, vā) for each blank.\n\n1. अहं पठामि, सः ___ क्रीडति। (I study, but he plays.)\n2. सः ___ सत्यं वदति। (He certainly speaks the truth.)\n3. गुरुः ___ अवदत्। (The guru himself said it.)\n4. दुग्धं ___ जलं ___ ? (Milk or water?)\n5. सा ___ देशं त्यक्तवती। (They say she left the country.)\n\n---\n\n## Section D: Build a Mini-Dialogue (5 marks)\n\n**Prompt 1:** Two friends are deciding what to eat. One asks \"rice or bread?\" The other says \"even bread is fine\" and adds \"but the rice is certainly fresh.\" Write 3-4 lines.\n\n**Prompt 2:** Someone shares a rumor (use kila). The other person responds with a rhetorical question (use nanu) doubting the rumor. Write 3-4 lines.\n\n---\n\n## Section E: Free Response (5 marks)\n\n1. Write 3 sentences about yourself using three different particles (eva, api, khalu, kila, or nanu).\n\n2. Take the sentence सः गच्छति (saḥ gacchati — \"He goes\") and write out five versions of it, each using a different particle, with English translations showing how the meaning shifts.\n", "workbook-answers": "# Stage 25: Particles & Emphasis — Answer Key\n\n---\n\n## Section A: Translate to Sanskrit (10 marks)\n\n1. सीता एव उत्तरं जानाति। (sītā eva uttaraṃ jānāti.)\n2. गुरुः अपि विस्मितः आसीत्। (guruḥ api vismitaḥ āsīt.)\n3. नृपः किल रुग्णः अस्ति। (nṛpaḥ kila rugṇaḥ asti.)\n4. ननु एतत् तव पुस्तकम्? (nanu etat tava pustakam?)\n5. चायं वा काफी वा? (cāyaṃ vā kāphī vā?)\n\n---\n\n## Section B: Translate to English (10 marks)\n\n1. I myself do it. / Only I do it.\n2. He is certainly a scholar.\n3. Even a child knows. / A child also knows.\n4. They say she sings. / She reportedly sings.\n5. Didn't you hear? / Surely you heard?\n\n---\n\n## Section C: Fill in the Blank (10 marks)\n\n1. **तु** (tu) — mild contrast: \"I study, but he plays.\"\n2. **खलु** (khalu) — certainty: \"He certainly speaks the truth.\"\n3. **एव** (eva) — emphasis: \"The guru himself said it.\"\n4. **वा ... वा** (vā ... vā) — \"Milk or water?\"\n5. **किल** (kila) — hearsay: \"They say she left the country.\"\n\n---\n\n## Section D: Build a Mini-Dialogue (5 marks)\n\n**Prompt 1 — Sample:**\n\n> **क:** ओदनं वा रोटिका वा? (odanaṃ vā roṭikā vā?)\n> \"Rice or bread?\"\n>\n> **ख:** रोटिका अपि शोभना। (roṭikā api śobhanā.)\n> \"Even bread is fine.\"\n>\n> **क:** किन्तु ओदनं खलु नूतनम्। (kintu odanaṃ khalu nūtanam.)\n> \"But the rice is certainly fresh.\"\n>\n> **ख:** तर्हि ओदनम् एव ददातु। (tarhi odanam eva dadātu.)\n> \"Then give only rice.\"\n\n**Prompt 2 — Sample:**\n\n> **क:** नृपः किल सिंहासनं त्यक्तवान्। (nṛpaḥ kila siṃhāsanaṃ tyaktavān.)\n> \"They say the king abandoned the throne.\"\n>\n> **ख:** ननु सः धीरः आसीत्? (nanu saḥ dhīraḥ āsīt?)\n> \"Wasn't he a brave man?\"\n>\n> **क:** सत्यम् एव। किन्तु जनाः तु एवं वदन्ति। (satyam eva. kintu janāḥ tu evaṃ vadanti.)\n> \"True indeed. But people say so.\"\n\n---\n\n## Section E: Free Response — Sample Answers (5 marks)\n\n**1. Three sentences with different particles:**\n\n- अहम् एव मम भोजनं पचामि। (aham eva mama bhojanaṃ pacāmi.) — \"I myself cook my food.\"\n- अहं कदाचित् संस्कृतम् अपि वदामि। (ahaṃ kadācit saṃskṛtam api vadāmi.) — \"I sometimes speak Sanskrit too.\"\n- ननु एतत् सुन्दरम्? (nanu etat sundaram?) — \"Isn't this beautiful?\"\n\n**2. Five versions of सः गच्छति:**\n\n- सः एव गच्छति (saḥ eva gacchati) — \"Only HE goes.\" / \"He himself goes.\"\n- सः अपि गच्छति (saḥ api gacchati) — \"He ALSO goes.\" / \"Even he goes.\"\n- सः खलु गच्छति (saḥ khalu gacchati) — \"He certainly goes.\"\n- सः किल गच्छति (saḥ kila gacchati) — \"They say he goes.\" / \"He reportedly goes.\"\n- ननु सः गच्छति? (nanu saḥ gacchati?) — \"Doesn't he go?\" / \"Surely he goes?\"\n"}, "tabs": ["theory", "workbook-questions", "workbook-answers"]}, {"id": "conv-26-still-already", "number": 26, "title": "Still / Already / No Longer", "subtitle": "adhunāpi, pūrvam eva, na punaḥ", "files": {"theory": "# Stage 26: Still / Already / No Longer / Not Yet\n\n**Pattern: adhunāpi · pūrvam eva · na punaḥ · na yāvat**\n\n---\n\n## The Pattern\n\nFour temporal state markers that let you talk about how things change over time:\n\n> **adhunāpi / idānīm api** (अधुनापि / इदानीम् अपि) = still (even now)\n> **pūrvam eva / prāg eva** (पूर्वम् एव / प्राग् एव) = already (before + indeed)\n> **na punaḥ / na adhunā** (न पुनः / न अधुना) = no longer, not anymore\n> **na yāvat / na tāvat** (न यावत् / न तावत्) = not yet\n\n## How It Works\n\nNotice something? The particles from Stage 25 are doing the heavy lifting here. **adhunāpi** is just adhunā (now) + api (even/also) — literally \"even now,\" which is exactly what \"still\" means. **pūrvam eva** is pūrvam (before) + eva (indeed) — \"before itself,\" i.e., \"already.\" These aren't new grammar — they're Stage 25 particles combined with time words.\n\n**na punaḥ** (not again) and **na adhunā** (not now) both express \"no longer.\" **na yāvat** (not as far as / not until) and **na tāvat** (not so much / not until then) express \"not yet.\" These four markers cover any situation where something has changed, hasn't changed, ended, or hasn't started.\n\n## Example Phrases\n\n1. त्वम् अधुनापि खादसि किम्? (tvam adhunāpi khādasi kim?)\n   — \"Are you still eating?\"\n\n2. अहं पूर्वम् एव समापितवान्। (ahaṃ pūrvam eva samāpitavān.)\n   — \"I already finished.\" *(masc. speaker)*\n\n3. सः न पुनः अत्र वसति। (saḥ na punaḥ atra vasati.)\n   — \"He no longer lives here.\"\n\n4. सा न यावत् आगता। (sā na yāvat āgatā.)\n   — \"She hasn't arrived yet.\"\n\n5. अहम् अधुनापि पठामि। (aham adhunāpi paṭhāmi.)\n   — \"I'm still learning.\"\n\n6. भोजनं पूर्वम् एव शीतलम्। (bhojanaṃ pūrvam eva śītalam.)\n   — \"The food is already cold.\"\n\n7. तौ न पुनः परस्परं वदतः। (tau na punaḥ parasparaṃ vadataḥ.)\n   — \"Those two no longer speak to each other.\"\n\n8. वर्षा न तावत् आरब्धा। (varṣā na tāvat ārabdhā.)\n   — \"The rain hasn't started yet.\"\n\n9. किं त्वम् अधुनापि कुप्यसि? (kiṃ tvam adhunāpi kupyasi?)\n   — \"Are you still angry?\"\n\n10. सा प्राग् एव प्रस्थिता। (sā prāg eva prasthitā.)\n    — \"She has already departed.\"\n\n## Mini-Dialogue 1\n\n> **माता** — भोजनं समाप्तं किम्? (bhojanaṃ samāptaṃ kim?)\n> \"Is the food finished?\"\n>\n> **पुत्रः** — न तावत्। अधुनापि पचामि। (na tāvat. adhunāpi pacāmi.)\n> \"Not yet. I'm still cooking.\"\n>\n> **माता** — अतिथिः पूर्वम् एव आगतः! (atithiḥ pūrvam eva āgataḥ!)\n> \"The guest has already arrived!\"\n>\n> **पुत्रः** — अहो! शीघ्रं करोमि। (aho! śīghraṃ karomi.)\n> \"Oh! I'll do it quickly.\"\n\n## Mini-Dialogue 2\n\n> **छात्रः** — गुरुः आगतः किम्? (guruḥ āgataḥ kim?)\n> \"Has the teacher come?\"\n>\n> **मित्रम्** — न यावत्। किन्तु सः खलु सदा समये आगच्छति। (na yāvat. kintu saḥ khalu sadā samaye āgacchati.)\n> \"Not yet. But he certainly always comes on time.\"\n>\n> **छात्रः** — अहं तु अधुनापि पाठं न पठितवान्! (ahaṃ tu adhunāpi pāṭhaṃ na paṭhitavān!)\n> \"But I still haven't read the lesson!\"\n>\n> **मित्रम्** — तर्हि अधुना एव पठ! (tarhi adhunā eva paṭha!)\n> \"Then read it right now!\"\n\n## Variations\n\n- **idānīm api** (इदानीम् अपि) is a synonym for adhunāpi — both mean \"still.\" idānīm is slightly more literary.\n- **prāg eva** (प्राग् एव) is a synonym for pūrvam eva — both mean \"already.\" prāk is a bit more formal.\n- **na punar eva** (न पुनर् एव) intensifies \"no longer\" — \"never again,\" \"absolutely not anymore.\"\n\n## Common Mistakes\n\n1. **Forgetting that adhunāpi is one compound idea.** Don't separate the meaning — adhunā api doesn't mean \"now also\" in two pieces. Together it means \"still.\" Context will usually make this clear, but keep the compound sense in your head.\n\n2. **Mixing up na yāvat and na punaḥ.** \"Not yet\" (na yāvat) implies it WILL happen. \"No longer\" (na punaḥ) implies it WON'T happen again. \"She hasn't come yet\" = she's expected. \"She no longer comes\" = she's done coming.\n", "workbook-questions": "# Stage 26: Still / Already / No Longer / Not Yet — Workbook\n\n---\n\n## Section A: Translate to Sanskrit (10 marks)\n\nUse Devanagari and IAST.\n\n1. I am still waiting.\n2. The water is already hot.\n3. He no longer teaches here.\n4. The letter has not arrived yet.\n5. Are you still sleeping?\n\n---\n\n## Section B: Translate to English (10 marks)\n\n1. सा अधुनापि गायति। (sā adhunāpi gāyati.)\n2. फलानि पूर्वम् एव क्रीतानि। (phalāni pūrvam eva krītāni.)\n3. ते न पुनः अत्र आगच्छन्ति। (te na punaḥ atra āgacchanti.)\n4. वृक्षः न तावत् पुष्पितः। (vṛkṣaḥ na tāvat puṣpitaḥ.)\n5. किं त्वम् अधुनापि तत्र एव असि? (kiṃ tvam adhunāpi tatra eva asi?)\n\n---\n\n## Section C: Fill in the Blank (10 marks)\n\nFill in with adhunāpi, pūrvam eva, na punaḥ, or na yāvat / na tāvat.\n\n1. सः ___ विद्यालये पठति। (He still studies at school.)\n2. अहं ___ गृहकार्यं कृतवान्। (I already did the homework.)\n3. सूर्यः ___ उदितः। (The sun has not risen yet.)\n4. तौ ___ मित्रे स्तः। (Those two are no longer friends.)\n5. किं वर्षा ___ चलति? (Is it still raining?)\n\n---\n\n## Section D: Build a Mini-Dialogue (5 marks)\n\n**Prompt 1:** A traveler asks if the bus has arrived. The other person says \"not yet\" and adds \"but it's already late.\" The traveler says they are still waiting. Write 3-4 lines.\n\n**Prompt 2:** Two people discuss an old friend. One says \"he no longer lives in the city.\" The other is surprised — \"Is he still in the village?\" Write 3-4 lines.\n\n---\n\n## Section E: Free Response (5 marks)\n\n1. Describe your morning routine using at least two of these markers (still, already, not yet, no longer). Write 3-4 sentences in Sanskrit with IAST and English translations.\n\n2. Think of something you used to do but no longer do, and something you still do. Write one sentence for each using na punaḥ and adhunāpi.\n", "workbook-answers": "# Stage 26: Still / Already / No Longer / Not Yet — Answer Key\n\n---\n\n## Section A: Translate to Sanskrit (10 marks)\n\n1. अहम् अधुनापि प्रतीक्षे। (aham adhunāpi pratīkṣe.)\n2. जलं पूर्वम् एव उष्णम्। (jalaṃ pūrvam eva uṣṇam.)\n3. सः न पुनः अत्र पाठयति। (saḥ na punaḥ atra pāṭhayati.)\n4. पत्रं न यावत् आगतम्। (patraṃ na yāvat āgatam.)\n5. किं त्वम् अधुनापि स्वपिषि? (kiṃ tvam adhunāpi svapiṣi?)\n\n---\n\n## Section B: Translate to English (10 marks)\n\n1. She is still singing.\n2. The fruits have already been bought.\n3. They no longer come here.\n4. The tree has not blossomed yet.\n5. Are you still there?\n\n---\n\n## Section C: Fill in the Blank (10 marks)\n\n1. **अधुनापि** (adhunāpi) — He still studies at school.\n2. **पूर्वम् एव** (pūrvam eva) — I already did the homework.\n3. **न तावत्** (na tāvat) — The sun has not risen yet.\n4. **न पुनः** (na punaḥ) — Those two are no longer friends.\n5. **अधुनापि** (adhunāpi) — Is it still raining?\n\n---\n\n## Section D: Build a Mini-Dialogue (5 marks)\n\n**Prompt 1 — Sample:**\n\n> **यात्री** — यानं किम् आगतम्? (yānaṃ kim āgatam?)\n> \"Has the bus arrived?\"\n>\n> **जनः** — न यावत्। किन्तु समयः पूर्वम् एव अतीतः। (na yāvat. kintu samayaḥ pūrvam eva atītaḥ.)\n> \"Not yet. But the time has already passed.\"\n>\n> **यात्री** — अहम् अधुनापि प्रतीक्षे। (aham adhunāpi pratīkṣe.)\n> \"I'm still waiting.\"\n>\n> **जनः** — धैर्यं धारय। आगमिष्यति। (dhairyaṃ dhāraya. āgamiṣyati.)\n> \"Be patient. It will come.\"\n\n**Prompt 2 — Sample:**\n\n> **क:** सः न पुनः नगरे वसति। (saḥ na punaḥ nagare vasati.)\n> \"He no longer lives in the city.\"\n>\n> **ख:** सत्यम्? किं सः अधुनापि ग्रामे अस्ति? (satyam? kiṃ saḥ adhunāpi grāme asti?)\n> \"Really? Is he still in the village?\"\n>\n> **क:** आम्, सः प्राग् एव तत्र गतवान्। (ām, saḥ prāg eva tatra gatavān.)\n> \"Yes, he already went there.\"\n>\n> **ख:** अहो, ग्रामजीवनं खलु सुखकरम्। (aho, grāmajīvanaṃ khalu sukhakaram.)\n> \"Well, village life is certainly pleasant.\"\n\n---\n\n## Section E: Free Response — Sample Answers (5 marks)\n\n**1. Morning routine:**\n\n- प्रातः अहं पूर्वम् एव उत्थितः। (prātaḥ ahaṃ pūrvam eva utthitaḥ.) — \"In the morning I've already woken up.\"\n- किन्तु चायं न तावत् पीतम्। (kintu cāyaṃ na tāvat pītam.) — \"But I haven't had tea yet.\"\n- मम भ्राता अधुनापि शय्यायां तिष्ठति। (mama bhrātā adhunāpi śayyāyāṃ tiṣṭhati.) — \"My brother is still in bed.\"\n\n**2. No longer / still:**\n\n- अहं न पुनः मांसं खादामि। (ahaṃ na punaḥ māṃsaṃ khādāmi.) — \"I no longer eat meat.\"\n- अहम् अधुनापि प्रतिदिनं योगं करोमि। (aham adhunāpi pratidinaṃ yogaṃ karomi.) — \"I still practice yoga every day.\"\n"}, "tabs": ["theory", "workbook-questions", "workbook-answers"]}, {"id": "conv-27-frequency", "number": 27, "title": "Always / Sometimes / Never", "subtitle": "sadā, kadācit, na kadāpi", "files": {"theory": "# Stage 27: Always / Sometimes / Never\n\n**Pattern: sadā · prāyaḥ · kadācit · viralam · na kadāpi · pratyaham · punaḥ punaḥ · ekadā**\n\n---\n\n## The Pattern\n\nFrequency words — how often something happens:\n\n> **sadā / sarvadā** (सदा / सर्वदा) = always\n> **prāyaḥ** (प्रायः) = usually, mostly\n> **kadācit** (कदाचित्) = sometimes\n> **viralam** (विरलम्) = rarely\n> **na kadāpi / na kadācit** (न कदापि / न कदाचित्) = never\n> **pratyaham / pratidinam** (प्रत्यहम् / प्रतिदिनम्) = every day\n> **punaḥ punaḥ** (पुनः पुनः) = again and again\n> **ekadā** (एकदा) = once (as in \"once upon a time\" / \"one time I...\")\n\n## How It Works\n\nAll of these are indeclinables — they never change form regardless of gender, number, or case. They typically sit before the verb, though they can open a sentence for emphasis. **sadā** and **sarvadā** are interchangeable. **prāyaḥ** is enormously useful — it lets you hedge, generalize, say \"mostly\" without committing to \"always.\" **kadācit** by itself means \"sometimes,\" but combined with **na** it becomes \"never\" — though **na kadāpi** is the stronger, more emphatic form of \"never.\"\n\nThink of these words as a spectrum: sadā → prāyaḥ → kadācit → viralam → na kadāpi. You can't talk about habits, routines, character, or patterns without them. Until now your Sanskrit has described single events. These words let you zoom out and generalize.\n\n## Example Phrases\n\n1. अहं सदा प्रातः उत्तिष्ठामि। (ahaṃ sadā prātaḥ uttiṣṭhāmi.)\n   — \"I always wake up early.\"\n\n2. सा प्रायः समये आगच्छति। (sā prāyaḥ samaye āgacchati.)\n   — \"She usually comes on time.\"\n\n3. अत्र कदाचित् वर्षा भवति। (atra kadācit varṣā bhavati.)\n   — \"Sometimes it rains here.\"\n\n4. सः न कदापि असत्यं वदति। (saḥ na kadāpi asatyaṃ vadati.)\n   — \"He never lies.\"\n\n5. अहं प्रत्यहं अभ्यासं करोमि। (ahaṃ pratyahaṃ abhyāsaṃ karomi.)\n   — \"I practice every day.\"\n\n6. सः पुनः पुनः तां एव भूलं करोति। (saḥ punaḥ punaḥ tāṃ eva bhūlaṃ karoti.)\n   — \"He keeps making the same mistake again and again.\"\n\n7. एकदा अहं काशीं अगच्छम्। (ekadā ahaṃ kāśīṃ agaccham.)\n   — \"Once I went to Kashi.\"\n\n8. विरलं सः हसति। (viralaṃ saḥ hasati.)\n   — \"He rarely laughs.\"\n\n9. मम पिता सर्वदा सत्यं वदति। (mama pitā sarvadā satyaṃ vadati.)\n   — \"My father always tells the truth.\"\n\n10. बालकाः प्रायः क्रीडन्ति। (bālakāḥ prāyaḥ krīḍanti.)\n    — \"Children usually play.\"\n\n## Mini-Dialogue 1\n\n> **शिष्यः** — गुरो, अहं कदाचित् ध्यानं विस्मरामि। (guro, ahaṃ kadācit dhyānaṃ vismarāmi.)\n> \"Teacher, I sometimes forget to meditate.\"\n>\n> **गुरुः** — प्रत्यहं कुरु। ततः न कदापि विस्मरिष्यसि। (pratyahaṃ kuru. tataḥ na kadāpi vismariṣyasi.)\n> \"Do it every day. Then you will never forget.\"\n>\n> **शिष्यः** — प्रयतिष्ये। किन्तु प्रायः आलस्यं मां बाधते। (prayatiṣye. kintu prāyaḥ ālasyaṃ māṃ bādhate.)\n> \"I'll try. But laziness usually troubles me.\"\n>\n> **गुरुः** — आलस्यं सदा बाधते। अभ्यासः एव औषधम्। (ālasyaṃ sadā bādhate. abhyāsaḥ eva auṣadham.)\n> \"Laziness always troubles. Practice itself is the medicine.\"\n\n## Mini-Dialogue 2\n\n> **क:** एकदा अहं हिमालयं गतवान्। (ekadā ahaṃ himālayaṃ gatavān.)\n> \"Once I went to the Himalayas.\"\n>\n> **ख:** सत्यम्? त्वं पुनः पुनः तत्र गच्छसि किम्? (satyam? tvaṃ punaḥ punaḥ tatra gacchasi kim?)\n> \"Really? Do you go there again and again?\"\n>\n> **क:** न, विरलम्। किन्तु सदा स्मरामि। (na, viralam. kintu sadā smarāmi.)\n> \"No, rarely. But I always remember it.\"\n>\n> **ख:** अहम् अपि प्रायः तत्र गन्तुम् इच्छामि। (aham api prāyaḥ tatra gantum icchāmi.)\n> \"I too usually want to go there.\"\n\n## Variations\n\n- **pratyaham** and **pratidinam** are interchangeable — both mean \"every day.\" You can extend the pattern: **prativāram** (every week), **pratimāsam** (every month), **prativarṣam** (every year).\n- **sadā** can combine with eva for extra force: **sadā eva** (always and forever). Similarly **na kadāpi eva** = absolutely never.\n- **ekadā** is the storytelling word. It opens anecdotes and tales, just like \"once\" in English or \"ek bār\" in Hindi.\n\n## Common Mistakes\n\n1. **Using na kadācit when you mean kadācit.** \"Sometimes\" and \"never\" are one negation apart. कदाचित् सः आगच्छति = \"Sometimes he comes.\" न कदाचित् सः आगच्छति = \"He never comes.\" Be careful with that न.\n\n2. **Placing frequency words after the verb.** While not strictly wrong, the natural position is before the verb. सदा गच्छति sounds natural; गच्छति सदा sounds like an afterthought or poetic inversion.\n", "workbook-questions": "# Stage 27: Always / Sometimes / Never — Workbook\n\n---\n\n## Section A: Translate to Sanskrit (10 marks)\n\nUse Devanagari and IAST.\n\n1. She always speaks the truth.\n2. I sometimes read at night.\n3. He never eats sweets.\n4. We practice every day.\n5. Once I saw a tiger in the forest.\n\n---\n\n## Section B: Translate to English (10 marks)\n\n1. सः प्रायः विलम्बेन आगच्छति। (saḥ prāyaḥ vilambena āgacchati.)\n2. ते पुनः पुनः तम् एव प्रश्नं पृच्छन्ति। (te punaḥ punaḥ tam eva praśnaṃ pṛcchanti.)\n3. अहं विरलं मधुरं खादामि। (ahaṃ viralaṃ madhuraṃ khādāmi.)\n4. सा न कदापि क्रुध्यति। (sā na kadāpi krudhyati.)\n5. एकदा अत्र एकः मुनिः अवसत्। (ekadā atra ekaḥ muniḥ avasat.)\n\n---\n\n## Section C: Fill in the Blank (10 marks)\n\nChoose the correct frequency word for each blank.\n\n1. अहं ___ संस्कृतं पठामि। (I study Sanskrit every day.) *(pratyaham / kadācit)*\n2. सा ___ हसति, ___ रोदिति। (She sometimes laughs, sometimes cries.) *(sadā / kadācit)*\n3. मम पितामहः ___ असत्यं न अवदत्। (My grandfather never spoke a lie.) *(viralam / na kadāpi)*\n4. ___ एकः राजा आसीत्। (Once there was a king.) *(ekadā / sadā)*\n5. बालकः ___ तां क्रीडां क्रीडति। (The boy plays that game again and again.) *(prāyaḥ / punaḥ punaḥ)*\n\n---\n\n## Section D: Build a Mini-Dia
